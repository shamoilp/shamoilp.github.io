<style>
/* VOICE  a practitioner's study course: precise, cited, plain words first
   IDEA   learn by habit: a picture first, a trigger-response anchor, worked cases, then spaced recall
   PICTURE the draft law as a road: scope gate, income, taxes, rate, top-up, filing
   COLOUR navy band and table heads (advisory house style), gold for anchors and limits, green only for correct answers, red for wrong ones
   TYPE   system sans; installed Arabic fonts for Arabic; numbers always left-to-right
   LAYOUT phone: one column. 1600px+: module rail, lesson, article reader. 2400px+: lesson beside practice. 3200px+: lesson, cases and quiz or cards side by side, plus reader */
:root{--bg:#ffffff;--ink:#0f1b2d;--muted:#556479;--line:#dde3ec;--pane:#f4f6fa;--band:#0f2747;--bandink:#ffffff;--accent:#1f4e9c;--btnink:#ffffff;--gold:#c8a24a;--goldsoft:#fbf3df;--ok:#1d7a46;--oksoft:#e7f5ec;--bad:#b4232a;--badsoft:#fdecec;--radius:14px;--shadow:0 1px 2px rgb(15 27 45 / 7%)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--ink:#e7ecf5;--muted:#9aa7bd;--line:#243149;--pane:#111a2b;--band:#0a1a33;--accent:#8fb4ff;--btnink:#0b1220;--goldsoft:#2a2414;--oksoft:#10291c;--badsoft:#2d1517;--shadow:none}}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
html[lang=ar] body{font-family:"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic","Geeza Pro","Arabic UI Text",Tahoma,Arial,sans-serif;line-height:1.85}
a{color:var(--accent)}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
.skip{position:absolute;inset-inline-start:-999px;top:8px;background:var(--gold);color:#000;padding:8px 12px;border-radius:8px;z-index:9}
.skip:focus{inset-inline-start:8px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.band{background:var(--band);color:var(--bandink);padding:12px max(16px,2.4vw)}
.band-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{display:flex;flex-direction:column;margin-inline-end:auto;text-decoration:none;color:inherit}
.brand b{font-size:clamp(19px,2.2vw,24px);letter-spacing:-.01em;line-height:1.15}
.brand small{color:#c9d5ea;font-size:13px}
.langbtn{background:var(--gold);color:#1b1405;border:0;border-radius:999px;padding:6px 14px;font-weight:700}
nav.main{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
nav.main a{color:#e3eaf6;text-decoration:none;padding:6px 10px;border-radius:999px;font-size:15px}
nav.main a[aria-current=page]{background:rgb(255 255 255 / 15%);color:#fff;font-weight:600}
main{max-width:980px;margin:0 auto;padding:18px max(14px,3vw) 40px}
body:not([data-lv="0"]) main{max-width:none;padding:18px max(20px,1.6vw) 40px}
main:focus{outline:none}
.narrow{max-width:900px;margin-inline:auto}
h1,h2,h3{line-height:1.25;margin:0 0 10px}
h1{font-size:clamp(24px,2.6vw,32px);letter-spacing:-.01em}
h2{font-size:clamp(19px,2vw,23px)}
h3{font-size:17px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.lede{font-size:17px;color:var(--muted);max-width:72ch}
.draft{background:var(--goldsoft);border:1px solid var(--gold);border-radius:var(--radius);padding:10px 14px;font-size:14.5px;margin:12px 0 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--pane);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--btnink);border-radius:999px;padding:8px 16px;font-weight:600;text-decoration:none;font-size:15px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1405}
.hub{display:block}
body:not([data-lv="0"]) .hub{display:grid;grid-template-columns:minmax(360px,500px) minmax(0,1fr);gap:32px;align-items:start}
body:not([data-lv="0"]) .hub .intro{position:sticky;top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.mod{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-decoration:none;color:inherit;background:var(--bg);box-shadow:var(--shadow)}
.mod:hover{border-color:var(--accent)}
.mod .mnum{font-size:13px;font-weight:700;color:var(--accent)}
.mod h3{margin:0}
.mod p{margin:0;font-size:14.5px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}
.crumbs{font-size:14px;margin-bottom:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin:8px 0 14px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabs a{white-space:nowrap;text-decoration:none;color:var(--ink);padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-size:15px}
.tabs a[aria-current=page]{background:var(--band);border-color:var(--band);color:#fff}
.colh{font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:2px 0 8px}
html[lang=ar] .colh{letter-spacing:0;text-transform:none}
/* module layout */
.mv{display:block}
.rail,.reader{display:none}
body:not([data-lv="0"]) .mv{display:grid;gap:22px;align-items:start;justify-content:center}
body[data-lv="1"] .mv{grid-template-columns:250px minmax(0,900px) minmax(400px,760px);grid-template-areas:"rail head reader" "rail c1 reader"}
body[data-lv="2"] .mv{grid-template-columns:260px minmax(0,860px) minmax(0,860px) minmax(420px,820px);grid-template-areas:"rail head head reader" "rail c1 c2 reader"}
body[data-lv="3"] .mv{grid-template-columns:270px repeat(3,minmax(0,820px)) minmax(440px,880px);grid-template-areas:"rail head head head reader" "rail c1 c2 c3 reader"}
body:not([data-lv="0"]) .rail,body:not([data-lv="0"]) .reader{display:block;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--pane);padding:12px}
.rail{grid-area:rail;grid-row:1 / span 2}.reader{grid-area:reader;grid-row:1 / span 2}.mhead{grid-area:head}.c1{grid-area:c1}.c2{grid-area:c2}.c3{grid-area:c3}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rail ol a{display:grid;grid-template-columns:1.8em 1fr;gap:6px;padding:6px 8px;border-radius:10px;text-decoration:none;color:inherit;font-size:14px;line-height:1.35}
.rail ol a:hover{background:var(--bg)}
.rail ol a[aria-current=page]{background:var(--band);color:#fff}
.rail .n{font-weight:700;color:var(--gold)}
.rail .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.reader select{width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);margin:4px 0 10px}
.reader h3{margin-top:4px}
.reader .lawtext{font-size:15px}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:12px 0;background:var(--bg);box-shadow:var(--shadow)}
.card.metaphor{background:var(--goldsoft);border-color:var(--gold)}
.card.reflect{border-inline-start:5px solid var(--gold)}
.card.reflect .ayah{font-family:"Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;font-size:21px;line-height:1.9;margin:4px 0 6px}
.card h3 .k{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:2px}
html[lang=ar] .card h3 .k{text-transform:none;letter-spacing:0}
.anchors{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.anchors li{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:var(--pane);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:15px}
.anchors .arr{color:var(--gold);font-weight:800}
html[dir=rtl] .anchors .arr{display:inline-block;transform:scaleX(-1)}
.anchors .if b,.anchors .then b{display:block;font-size:12px;color:var(--muted);font-weight:700}
@media (max-width:560px){.anchors li{grid-template-columns:1fr}.anchors .arr{transform:rotate(90deg)}html[dir=rtl] .anchors .arr{transform:rotate(90deg)}}
.points{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.points li{border-inline-start:4px solid var(--accent);padding-inline-start:12px}
.points b{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);text-decoration:none;background:transparent}
.chip:hover,.chip.on{background:var(--accent);color:var(--btnink)}
.oecd{border-inline-start:4px solid var(--gold);background:var(--pane);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15px}
.oecd .src{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.dg{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:12px 0;background:var(--pane)}
.dg-title{font-weight:700;margin-bottom:10px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .node{flex:1 1 130px;background:var(--bg);border:1px solid var(--line);border-top:4px solid var(--band);border-radius:10px;padding:8px 10px;font-size:14px}
.flow .node b{display:block;font-size:14.5px}
.flow .node span{color:var(--muted);font-size:13px}
.flow .ar{align-self:center;color:var(--gold);font-weight:800;font-size:18px}
html[dir=rtl] .flow .ar{transform:scaleX(-1)}
.tree{font-size:14.5px}
.tree .q{background:var(--bg);border:1px solid var(--line);border-inline-start:4px solid var(--band);border-radius:10px;padding:8px 10px;font-weight:600}
.tree .br{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 0;padding-inline-start:14px;border-inline-start:2px dashed var(--line)}
.tree .br.ln{grid-template-columns:minmax(110px,1fr) 2.2fr}
.tree .br.ly{grid-template-columns:2.2fr minmax(110px,1fr)}
.tree .lab{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px}
.tree .end{border-radius:10px;padding:8px 10px;font-weight:600}
.tree .end.in{background:var(--goldsoft);border:1px solid var(--gold)}
.tree .end.out{background:var(--bg);border:1px dashed var(--muted)}
.tree .end.na{background:var(--bg);border:1px solid var(--line)}
@media (max-width:560px){.tree .br,.tree .br.ln,.tree .br.ly{grid-template-columns:1fr}}
.formula{display:grid;gap:6px}
.formula .row{display:grid;grid-template-columns:minmax(0,1.1fr) auto minmax(0,2fr);gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14.5px}
.formula .op{font-weight:800;color:var(--gold)}
.formula .l{font-weight:700}
.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--bg)}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:start;vertical-align:top}
.tbl th{background:var(--band);color:#fff;font-weight:600}
.tbl tbody tr:nth-child(even) td{background:var(--pane)}
.bars{display:grid;gap:8px}
.bars .b{display:grid;grid-template-columns:minmax(90px,1fr) 3fr auto;gap:8px;align-items:center;font-size:14px}
.bars .t{height:14px;background:var(--line);border-radius:9px;overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--accent)}
.bars .t i.g{background:var(--gold)}
.bars .t i.c{background:var(--bad)}
.calc{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;font-size:14px;background:var(--pane);border:1px solid var(--line);border-radius:8px;padding:2px 7px;display:inline-block;margin-top:4px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.case .facts{background:var(--pane);border-radius:10px;padding:10px 12px;margin:8px 0;white-space:pre-line;font-size:15px}
.steps{list-style:none;padding:0;margin:8px 0;display:grid;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:15px}
.steps li::before{content:counter(s);background:var(--band);color:#fff;border-radius:999px;width:24px;height:24px;display:grid;place-items:center;font-size:13px;font-weight:700}
.steps .v{font-weight:700}
.ans{background:var(--oksoft);border:1px solid var(--ok);border-radius:10px;padding:10px 12px;margin-top:8px;white-space:pre-line}
.q{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:12px 0}
.q .qn{font-size:13px;color:var(--muted);font-weight:700}
.q .qt{font-weight:600;margin:4px 0 10px}
.opts{display:grid;gap:8px}
.opt{text-align:start;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px;display:flex;gap:8px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .ltr{font-weight:800;color:var(--muted)}
.opt.ok{background:var(--oksoft);border-color:var(--ok)}
.opt.bad{background:var(--badsoft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{margin-top:10px;border-radius:10px;padding:10px 12px;font-size:15px}
.fb.ok{background:var(--oksoft)}
.fb.bad{background:var(--badsoft)}
.fb b{display:block}
.score{position:sticky;bottom:10px;background:var(--band);color:#fff;border-radius:999px;padding:8px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px;box-shadow:0 4px 18px rgb(0 0 0 / 18%)}
.score .btn{background:var(--gold);border-color:var(--gold);color:#1b1405;padding:5px 12px;font-size:14px}
.deck{display:grid;gap:12px;justify-items:center}
.flash{width:min(560px,100%);min-height:230px;perspective:1200px;background:none;border:0;padding:0}
.flash .in{position:relative;width:100%;min-height:230px;transition:transform .45s cubic-bezier(.22,1,.36,1);transform-style:preserve-3d}
.flash.flipped .in{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:8px;background:var(--bg);box-shadow:0 2px 10px rgb(0 0 0 / 8%);font-size:17px;text-align:center}
.flash .back{transform:rotateY(180deg);background:var(--goldsoft);border-color:var(--gold);font-size:16px}
.flash .face small{color:var(--muted);font-size:12.5px}
@media (prefers-reduced-motion:reduce){.flash .in{transition:none}}
.rate{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rate button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 16px;font-weight:600}
.rate .again{border-color:var(--bad);color:var(--bad)}
.rate .good{border-color:var(--accent);color:var(--accent)}
.rate .easy{border-color:var(--gold);color:#8a6a1c}
@media (prefers-color-scheme:dark){.rate .easy{color:var(--gold)}}
.law-list{list-style:none;padding:0;margin:0;display:grid;gap:2px}
.law-list a{display:grid;grid-template-columns:3.2em 1fr auto;gap:8px;text-decoration:none;color:inherit;padding:7px 10px;border-radius:10px;border:1px solid transparent}
.law-list a:hover{border-color:var(--line);background:var(--pane)}
.law-list a[aria-current=page]{background:var(--band);color:#fff}
.law-list a[aria-current=page] .n,.law-list a[aria-current=page] .muted{color:#fff}
.law-list .n{font-weight:700;color:var(--accent)}
.lawv{display:block}
body:not([data-lv="0"]) .lawv{display:grid;grid-template-columns:minmax(320px,440px) minmax(0,1fr);gap:26px;align-items:start}
body:not([data-lv="0"]) .lawv .lawnav{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-inline-end:6px}
.lawtext p{margin:0 0 8px}
.lawtext p.sub{padding-inline-start:18px}
.cols{display:grid;gap:16px}
.cols.two{grid-template-columns:1fr 1fr}
@media (max-width:760px){.cols.two{grid-template-columns:1fr}}
.lawtext[dir=rtl]{font-family:"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic","Geeza Pro",Tahoma,Arial,sans-serif;line-height:1.9}
input[type=search]{width:100%;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:6px 0 12px}
.glwrap{columns:1}
body:not([data-lv="0"]) .glwrap{columns:3 440px;column-gap:32px}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;border-bottom:1px solid var(--line);padding:8px 2px;font-size:15px;break-inside:avoid}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14.5px}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
footer{border-top:1px solid var(--line);padding:16px max(14px,3vw) 28px;font-size:13.5px;color:var(--muted);text-align:center}
footer a{color:var(--muted)}
.hide{display:none!important}
</style>

<script type="application/json" id="course-data">{"about":[{"h":["What this is","ما هذه الدورة"],"p":[["A free, self-paced course on Saudi Arabia's draft Domestic Minimum Tax (DMT) Law, the Kingdom's Pillar Two domestic top-up tax. Fifteen modules follow the draft's twelve Parts. Each module opens with a picture and trigger-response anchors, works three case studies with numbers, then tests you with a quiz that gives instant feedback and flashcards that come back on a spaced schedule.","دورة مجانية للتعلم الذاتي حول مشروع نظام ضريبة الحد الأدنى المحلي في المملكة العربية السعودية، وهو الضريبة التكميلية المحلية ضمن الركيزة الثانية. تتبع خمس عشرة وحدة أجزاء المشروع الاثني عشر. تبدأ كل وحدة بصورة ذهنية ومحفّزات واستجابات، ثم ثلاث دراسات حالة بالأرقام، ثم اختبار بتغذية راجعة فورية وبطاقات مراجعة تعود وفق جدول متباعد."],["The format follows GMT Study, an open study course on the Singapore and OECD rules (github.com/LYM-00/Beps-2.0-E-learning-quiz). Everything here is written fresh for the Saudi draft, and every answer cites the article it comes from.","يتبع الشكل دورة GMT Study المفتوحة حول القواعد السنغافورية وقواعد المنظمة (github.com/LYM-00/Beps-2.0-E-learning-quiz). أما المحتوى هنا فمكتوب من جديد لمشروع النظام السعودي، وكل إجابة تذكر المادة التي تستند إليها."]]},{"h":["Sources and dates","المصادر والتواريخ"],"p":[["The draft: 'Draft Domestic Minimum Tax Law' (مشروع نظام ضريبة الحد الأدنى المحلي), a 75-page bilingual PDF created on 16 November 2026, with 106 articles in 12 Parts. The article text in this course was extracted from that PDF; check the official text for exact wording.","المشروع: «مشروع نظام ضريبة الحد الأدنى المحلي»، ملف PDF ثنائي اللغة من 75 صفحة أُنشئ في 16 نوفمبر 2026م، يضم 106 مواد في 12 جزءاً. استُخرج نص المواد في هذه الدورة من ذلك الملف، فراجع النص الرسمي للصياغة الدقيقة."],["On 19 November 2026 ZATCA announced that it will apply the domestic minimum top-up tax from 1 January 2027 to entities of multinational groups with annual revenue of €750 million or more (zatca.gov.sa, news).","أعلنت هيئة الزكاة والضريبة والجمارك في 19 نوفمبر 2026م تطبيق الضريبة التكميلية للحد الأدنى المحلي اعتباراً من 1 يناير 2027م على الكيانات التابعة للمجموعات متعددة الجنسيات التي تبلغ إيراداتها السنوية 750 مليون يورو أو أكثر (zatca.gov.sa، المركز الإعلامي)."],["The OECD notes compare the draft with the OECD/G20 GloBE Model Rules (December 2021) and later OECD guidance. They are comparisons, not part of the Saudi draft.","تقارن ملاحظات المنظمة المشروعَ بالقواعد النموذجية لمكافحة تآكل الوعاء الضريبي العالمي الصادرة عن الإطار الشامل لمجموعة العشرين ومنظمة التعاون الاقتصادي والتنمية (ديسمبر 2021م) والإرشادات اللاحقة. وهي مقارنات وليست جزءاً من المشروع السعودي."]]},{"h":["Limits","حدود الاستخدام"],"p":[["The law is a draft and its implementing Regulations are not yet issued, so articles, numbering and figures may change. This is a study aid, not tax or legal advice. The case studies use invented groups and round numbers to show the mechanics.","النظام ما يزال مشروعاً ولم تصدر لائحته التنفيذية بعد، لذا قد تتغير المواد وترقيمها والأرقام. هذه أداة للدراسة وليست استشارة ضريبية أو قانونية. وتستخدم دراسات الحالة مجموعات افتراضية وأرقاماً مقرّبة لتوضيح طريقة العمل."]]},{"h":["Privacy","الخصوصية"],"p":[["The page loads nothing from other sites and sends nothing anywhere. Your quiz answers, flashcard history and language choice are kept in this browser only. Use the buttons below to save them to a file, move them to another device or clear them.","لا تحمّل الصفحة أي شيء من مواقع أخرى ولا ترسل أي بيانات. تُحفظ إجابات الاختبارات وسجل البطاقات واختيار اللغة في هذا المتصفح فقط. استخدم الأزرار أدناه لحفظها في ملف أو نقلها إلى جهاز آخر أو مسحها."]]}],"glossary":[{"en":"Law (Domestic Minimum Tax Law)","ar":"النظام (نظام ضريبة الحد الأدنى المحلي)","r":1},{"en":"Regulations","ar":"اللائحة","r":1},{"en":"Kingdom","ar":"المملكة","r":1},{"en":"The Authority (ZATCA)","ar":"الهيئة (هيئة الزكاة والضريبة والجمارك)","r":1},{"en":"The Board","ar":"المجلس","r":1},{"e f all Constituent Entities","ar":"خسائر ضريبة الحد الأدنى المحلي لجميع الكيانات التابعة","r":1},{"en":"Net DMT Loss","ar":"صافي خسائر ضريبة الحد الأدنى المحلي","r":1},{"en":"Net DMT Income","ar":"صافي دخل ضريبة الحد الأدنى المحلي","r":53},{"en":"Qualified Imputation Tax","ar":"ضريبة الإسناد المؤهلة","r":1},{"en":"Qualified UTPR","ar":"قاعدة الأرباح الخاضعة لمعدل ضريبي منخفض المؤهلة","r":1},{"en":"Qualified IIR","ar":"قاعدة تضمين الدخل المؤهلة","r":1},{"en":"Income Inclusion Rule (IIR)","ar":"قاعدة تضمين الدخل","r":1},{"en":"GloBE Rules","ar":"قواعد مكافحة تآكل الوعاء الضريبي العالمي","r":1},{"en":"Income Tax Law","ar":"نظام ضريبة الدخل","r":1},{"en":"Special Economic Zones","ar":"المناطق الاقتصادية الخاصة","r":2},{"en":"Stateless Constituent Entity","ar":"الكيان التابع عديم الجنسية","r":2},{"en":"Revenue","ar":"الإيرادات","r":3},{"en":"Consolidated Financial Statements","ar":"القوائم المالية الموحدة","r":4},{"en":"Tax Resident","ar":"المقيم الضريبي","r":6},{"en":"Controlling Interest","ar":"الحصة المسيطرة","r":7},{"en":"MNE Group","ar":"المجموعة المتعددة الجنسيات","r":8},{"en":"Constituent Entity","ar":"الكيان التابع","r":9},{"en":"Ultimate Parent Entity (UPE)","ar":"الكيان الأم النهائي","r":10},{"en":"Permanent Establishment","ar":"المنشأة الدائمة","r":11},{"en":"Excluded Entity","ar":"الكيان المستبعد","r":12},{"en":"Governmental Entity","ar":"الكيان الحكومي","r":13},{"en":"International Organisation","ar":"المنظمة الدولية","r":14},{"en":"Non-profit Organisation","ar":"المنظمة غير الربحية","r":15},{"en":"Pension Fund","ar":"صندوق التقاعد","r":16},{"en":"Investment Fund","ar":"صندوق الاستثمار","r":17},{"en":"Net Taxes Expense","ar":"صافي المصاريف الضريبية","r":20},{"en":"Excluded Dividends","ar":"توزيعات الأرباح المستبعدة","r":21},{"en":"Excluded Equity Gain or Loss","ar":"مكاسب أو خسائر حقوق الملكية المستبعدة","r":22},{"en":"Policy Disallowed Expenses","ar":"المصاريف غير جائزة الحسم وفقاً للنظام","r":27},{"en":"Covered Taxes","ar":"الضرائب المشمولة","r":42},{"en":"Adjusted Covered Taxes","ar":"الضرائب المشمولة المعدلة","r":44},{"en":"Effective Tax Rate (ETR)","ar":"معدل الضريبة الفعلي","r":53},{"en":"Top-up Tax Percentage","ar":"نسبة الضريبة التكميلية","r":54},{"en":"Excess Profit","ar":"الربح الزائد","r":55},{"en":"Substance-based Income Exclusion (SBIE)","ar":"الاستبعاد على أساس جوهر النشاط","r":58},{"en":"Additional Current Top-up Tax","ar":"الضريبة التكميلية الحالية الإضافية","r":63},{"en":"De Minimis Exclusion","ar":"استبعاد المستوى الأدنى","r":64},{"en":"DMT Safe Harbour","ar":"الملاذ الآمن لضريبة الحد الأدنى المحلي","r":66},{"en":"Joint Venture","ar":"المشروع المشترك","r":79},{"en":"Multi-Parented MNE Group","ar":"المجموعة المتعددة الجنسيات ذات كيانات أم متعددة","r":81},{"en":"Investment Entity","ar":"الكيان الاستثماري","r":86}],"modules":[{"id":1,"title":["The big picture: what the DMT is and how it bites","الصورة الكاملة: ما ضريبة الحد الأدنى المحلي وكيف تُفرض"],"goal":["Explain in two minutes what the Saudi DMT is, who it reaches, from when, and how the top-up is computed and shared out.","شرح ماهية ضريبة الحد الأدنى المحلي في المملكة خلال دقيقتين: من تشمل، ومتى تبدأ، وكيف تُحتسب الضريبة التكميلية وتُوزَّع."],"parts":[1,2,5,6,7,12],"arts":[1,2,53,54,55,56,57,66,73,106],"time":25,"metaphor":{"title":["A fuel gauge with a 15% line","مؤشر وقود عليه خط عند 15%"],"text":["Picture every in-scope Saudi entity of a group pouring its profit into one shared tank: the Kingdom's Net DMT Income. The gauge on the tank reads the effective tax rate: the covered taxes those entities already bear, divided by that profit. There is a line on the gauge at 15%.\nIf the needle sits below the line, the DMT is the pump that tops the tank up to it. It only pumps on the profit left after a fixed allowance for real substance (payroll and tangible assets), and Saudi Arabia pumps first, before any other country's top-up rule reaches the same profit.","تخيّل أن كل كيان تابع للمجموعة في المملكة يصبّ أرباحه في خزان واحد مشترك: صافي دخل ضريبة الحد الأدنى المحلي في المملكة. ويقرأ مؤشر الخزان معدل الضريبة الفعلي، أي الضرائب المشمولة التي تتحملها تلك الكيانات مقسومة على ذلك الربح. وعلى المؤشر خط عند 15%.\nفإذا كان المؤشر دون الخط، كانت ضريبة الحد الأدنى المحلي هي المضخة التي تملأ الخزان حتى الخط. لكنها لا تضخ إلا على الربح المتبقي بعد استبعاد ثابت للجوهر الفعلي (الرواتب والأصول الملموسة)، والمملكة تضخ أولاً قبل أن تصل قاعدة أي دولة أخرى إلى الربح نفسه."]},"anchors":[{"if":["A group with a Saudi entity had consolidated revenue of €750m or more in 2 of the last 4 years","مجموعة لها كيان في المملكة بلغت إيراداتها الموحدة 750 مليون يورو أو أكثر في سنتين من آخر أربع سنوات"],"then":["Flag DMT scope for its fiscal years starting on or after 1 January 2027 (Arts 2, 106)","نبّه إلى خضوعها للنظام عن سنواتها المالية التي تبدأ في 1 يناير 2027م أو بعده (المادتان 2 و106)"]},{"if":["Someone says the 20% income tax rate means no DMT","يقول أحدهم إن سعر ضريبة الدخل البالغ 20% يعني عدم وجود ضريبة حد أدنى محلي"],"then":["Ask for the Kingdom ETR: adjusted covered taxes ÷ Net DMT Income, not the headline rate (Art 53)","اطلب معدل الضريبة الفعلي للمملكة: الضرائب المشمولة المعدلة ÷ صافي الدخل، لا السعر النظامي (المادة 53)"]},{"if":["The Kingdom ETR comes out below 15%","جاء معدل الضريبة الفعلي للمملكة أقل من 15%"],"then":["Compute (15% − ETR) × excess profit, then add any additional current top-up tax (Arts 54–56)","احسب (15% − المعدل الفعلي) × الربح الزائد، ثم أضف أي ضريبة تكميلية حالية إضافية (المواد 54–56)"]},{"if":["A client asks which Saudi entity pays","يسأل العميل أي كيان في المملكة يسدد الضريبة"],"then":["Each taxpayer for its own amount, and all group taxpayers jointly, unless ZATCA approves a limit (Art 73)","كل مكلف عن المبلغ المستحق عليه، والمكلفون في المجموعة بالتضامن، ما لم توافق الهيئة على قصر المسؤولية (المادة 73)"]}],"diagrams":[{"type":"flow","title":["The DMT road in seven stops","طريق ضريبة الحد الأدنى المحلي في سبع محطات"],"nodes":[{"t":["Scope","النطاق"],"s":["€750m test, located in KSA · Arts 2–17","اختبار 750 مليون يورو والوقوع في المملكة · المواد 2–17"]},{"t":["DMT Income or Loss","دخل أو خسارة ضريبة الحد الأدنى المحلي"],"s":["accounts + adjustments · Arts 18–41","الحسابات + التعديلات · المواد 18–41"]},{"t":["Adjusted Covered Taxes","الضرائب المشمولة المعدلة"],"s":["Arts 42–52","المواد 42–52"]},{"t":["ETR","معدل الضريبة الفعلي"],"s":["taxes ÷ net income · Art 53","الضرائب ÷ صافي الدخل · المادة 53"]},{"t":["Top-up %","نسبة الضريبة التكميلية"],"s":["15% − ETR · Art 54","15% − المعدل الفعلي · المادة 54"]},{"t":["Excess Profit","الربح الزائد"],"s":["net income − SBIE · Arts 55, 58","صافي الدخل − استبعاد الجوهر · المادتان 55 و58"]},{"t":["Domestic Top-up Tax","الضريبة التكميلية المحلية"],"s":["% × excess profit + additional · Art 56","النسبة × الربح الزائد + الإضافية · المادة 56"]}],"note":["Then share it out to each entity with DMT Income (Art 57), file and pay (Part 10).","ثم وزّعها على كل كيان لديه دخل (المادة 57)، وقدّم الإقرار وسدّد (الجزء العاشر)."]},{"type":"formula","title":["Six formulas to know by heart","ست معادلات يجب حفظها"],"rows":[{"l":["ETR","معدل الضريبة الفعلي"],"r":["Σ adjusted covered taxes of Saudi CEs ÷ Net DMT Income of the Kingdom","مجموع الضرائب المشمولة المعدلة للكيانات في المملكة ÷ صافي دخل ضريبة الحد الأدنى المحلي في المملكة"]},{"l":["Net DMT Income","صافي دخل ضريبة الحد الأدنى المحلي"],"r":["DMT Income of all Saudi CEs − their DMT Losses (if positive)","دخل جميع الكيانات التابعة في المملكة − خسائرها (إن كان موجباً)"]},{"l":["Top-up %","نسبة الضريبة التكميلية"],"r":["15% − ETR (if positive)","15% − معدل الضريبة الفعلي (إن كان موجباً)"]},{"l":["Excess Profit","الربح الزائد"],"r":["Net DMT Income − substance-based income exclusion","صافي الدخل − الاستبعاد على أساس جوهر النشاط"]},{"l":["Domestic Top-up Tax","الضريبة التكميلية المحلية"],"r":["Top-up % × Excess Profit + Additional Current Top-up Tax","نسبة الضريبة التكميلية × الربح الزائد + الضريبة التكميلية الحالية الإضافية"]},{"l":["One entity's share","حصة الكيان"],"r":["DTT × entity's DMT Income ÷ total DMT Income of Saudi CEs","الضريبة التكميلية المحلية × دخل الكيان ÷ مجموع دخل الكيانات في المملكة"]}]}],"points":[{"h":["What the law is","ما هذا النظام"],"t":["The draft is the Domestic Minimum Tax (DMT) Law, and the tax it imposes is the Domestic Top-up Tax. It is built as a qualified domestic minimum top-up tax (QDMTT): it measures Saudi excess profits the way the GloBE Rules do and raises the tax on them to the 15% Minimum Rate.","المشروع هو نظام ضريبة الحد الأدنى المحلي، والضريبة التي يفرضها هي الضريبة التكميلية المحلية. وقد صُمم بوصفه ضريبة تكميلية محلية أدنى مؤهلة: يحدد الأرباح الزائدة في المملكة بطريقة مكافئة لقواعد مكافحة تآكل الوعاء الضريبي العالمي، ويرفع الضريبة عليها إلى الحد الأدنى البالغ 15%."],"r":[1]},{"h":["Who is in","من يخضع"],"t":["Constituent entities located in the Kingdom, including in the Special Economic Zones, that belong to an MNE group whose ultimate parent's consolidated revenue reached the riyal equivalent of €750m in at least two of the four fiscal years immediately before the tested year. Stateless constituent entities created under Saudi law are caught too.","الكيانات التابعة الواقعة في المملكة، بما في ذلك المناطق الاقتصادية الخاصة، الأعضاء في مجموعة متعددة الجنسيات بلغت إيراداتها وفق القوائم المالية الموحدة للكيان الأم النهائي ما يوازي 750 مليون يورو بالريال في سنتين على الأقل من السنوات المالية الأربع السابقة مباشرة للسنة الخاضعة للاختبار. وتخضع أيضاً الكيانات التابعة عديمة الجنسية المنشأة بموجب أنظمة المملكة."],"r":["2(1)","2(2)"]},{"h":["From when","متى يبدأ"],"t":["Fiscal years beginning on or after 1 January 2027. The Board must issue the implementing Regulations within 180 days after the Law is issued, and they take effect on the same date as the Law.","السنوات المالية التي تبدأ في 1 يناير 2027م أو بعده. ويصدر المجلس اللائحة خلال 180 يوماً من صدور النظام، ويُعمل بها من تاريخ نفاذ النظام."],"r":["106(1)","106(2)"]},{"h":["One blended rate for the Kingdom","معدل واحد مجمّع للمملكة"],"t":["The ETR is not worked out entity by entity. Add up the adjusted covered taxes of all Saudi constituent entities and divide by the Kingdom's Net DMT Income (all DMT income less all DMT losses). Investment entities and insurance investment entities stay out of this blend, and each stateless entity counts as its own jurisdiction.","لا يُحتسب معدل الضريبة الفعلي لكل كيان على حدة، بل تُجمع الضرائب المشمولة المعدلة لجميع الكيانات التابعة في المملكة وتُقسم على صافي دخل ضريبة الحد الأدنى المحلي في المملكة (مجموع الدخل ناقص مجموع الخسائر). وتبقى الكيانات الاستثمارية وكيانات التأمين الاستثمارية خارج هذا التجميع، ويُعامل كل كيان عديم الجنسية كأنه ولاية قضائية منفصلة."],"r":[53]},{"h":["From rate to tax","من المعدل إلى الضريبة"],"t":["Top-up % = 15% minus the ETR. Excess profit = Net DMT Income minus the substance-based income exclusion. Domestic Top-up Tax = top-up % × excess profit, plus any additional current top-up tax that arises from recalculating earlier years.","نسبة الضريبة التكميلية = 15% ناقص معدل الضريبة الفعلي. والربح الزائد = صافي الدخل ناقص الاستبعاد على أساس جوهر النشاط. والضريبة التكميلية المحلية = النسبة × الربح الزائد، مضافاً إليها أي ضريبة تكميلية حالية إضافية تنشأ عن إعادة احتساب سنوات سابقة."],"r":[54,"55(1)",56,63]},{"h":["Sharing it out","توزيع الضريبة"],"t":["The Kingdom's tax is allocated only to entities that have DMT Income, in proportion: DTT × the entity's DMT Income ÷ the total DMT Income of all Saudi constituent entities. A loss-making entity gets no allocation.","تُوزَّع ضريبة المملكة على الكيانات التي لديها دخل فقط وبالتناسب: الضريبة التكميلية المحلية × دخل الكيان ÷ مجموع دخل جميع الكيانات التابعة في المملكة. ولا يُخصص للكيان الخاسر شيء."],"r":["57(1)"]},{"h":["Safe harbours can switch it off","الملاذات الآمنة قد توقفها"],"t":["If the filing entity elects and the Saudi entities qualify for the transitional CbCR, simplified ETR or NMCE simplified calculations safe harbour, the Kingdom's DTT is deemed zero. Under the substance-based tax incentive safe harbour, only the part linked to qualified incentives is deemed zero. ZATCA can reopen an election by notice within 36 months of filing.","إذا اختار الكيان المعين لتقديم الإقرار ذلك وكانت الكيانات في المملكة مؤهلة للملاذ الآمن الانتقالي للتقرير الخاص بكل دولة، أو الملاذ الآمن لمعدل الضريبة الفعلي المبسط، أو ملاذ الاحتساب المبسط للكيانات غير الجوهرية، تُعد الضريبة التكميلية المحلية للمملكة صفراً. وفي ملاذ الحوافز الضريبية القائمة على الجوهر يُعد صفراً الجزء المرتبط بالحوافز المؤهلة فقط. ويجوز للهيئة إعادة فتح الاختيار بإخطار خلال 36 شهراً من تقديم الإقرار."],"r":[66]},{"h":["Who pays","من يسدد"],"t":["Each taxpayer is liable for its own amount, and taxpayers that are members of the MNE group are jointly liable for the group's Saudi DTT. Joint ventures, JV subsidiaries and partners other than limited partners also carry joint liability. ZATCA can approve limiting joint liability to one or more entities.","كل مكلف مسؤول عن المبلغ المستحق عليه، والمكلفون الأعضاء في المجموعة المتعددة الجنسيات مسؤولون بالتضامن عن الضريبة التكميلية المحلية للمجموعة في المملكة. وتقع المسؤولية التضامنية كذلك على المشروعات المشتركة وشركاتها التابعة والشركاء عدا الشريك الموصي. ويجوز بموافقة الهيئة قصر المسؤولية التضامنية على كيان واحد أو أكثر."],"r":[73]}],"oecd":[{"t":["The draft follows the OECD's QDMTT design. Under the GloBE Model Rules, the top-up tax another country computes for a jurisdiction is reduced by the QDMTT payable there, so tax that Saudi Arabia collects first is credited rather than paid twice.","يتبع المشروع تصميم الضريبة التكميلية المحلية الأدنى المؤهلة لدى المنظمة. فبموجب القواعد النموذجية، تُخفَّض الضريبة التكميلية التي تحتسبها دولة أخرى لولاية قضائية بمقدار الضريبة التكميلية المحلية المؤهلة المستحقة فيها، فلا تُدفع الضريبة التي تحصّلها المملكة أولاً مرتين."],"src":["Model Rules Art 5.2.3 and the QDMTT definition in Art 10.1","القواعد النموذجية: المادة 5.2.3 وتعريف الضريبة التكميلية المحلية الأدنى المؤهلة في المادة 10.1"]},{"t":["Article 56 of the draft has no deduction for a QDMTT, unlike the Model Rules formula, because the DMT is itself the domestic top-up. The draft defines IIR and UTPR terms but charges only the Domestic Top-up Tax.","لا تتضمن المادة 56 من المشروع خصماً للضريبة التكميلية المحلية المؤهلة، بخلاف معادلة القواعد النموذجية، لأن ضريبة الحد الأدنى المحلي هي نفسها الضريبة التكميلية المحلية. ويعرّف المشروع مصطلحي قاعدة تضمين الدخل وقاعدة الأرباح الخاضعة لمعدل منخفض، لكنه لا يفرض إلا الضريبة التكميلية المحلية."],"src":["Model Rules Art 5.2.3","القواعد النموذجية: المادة 5.2.3"]}],"cases":[{"t":["Is GulfCo in scope for 2027?","هل تخضع شركة الخليج للنظام في 2027م؟"],"facts":["Rhein AG, a German company, is the ultimate parent of a group that includes GulfCo Arabia LLC, a Saudi company. All entities use calendar-year accounts. Consolidated revenue in Rhein AG's financial statements:\nFY2023 €690m · FY2024 €720m · FY2025 €810m · FY2026 €905m.","شركة راين الألمانية هي الكيان الأم النهائي لمجموعة تضم شركة الخليج العربية ذات المسؤولية المحدودة في المملكة. تستخدم جميع الكيانات سنة مالية تقويمية. الإيرادات الموحدة في القوائم المالية لشركة راين:\n2023م: 690 مليون يورو · 2024م: 720 مليون يورو · 2025م: 810 ملايين يورو · 2026م: 905 ملايين يورو."],"steps":[{"t":["The tested year is FY2027, so look at the four fiscal years immediately before it: 2023 to 2026.","السنة الخاضعة للاختبار هي 2027م، فننظر إلى السنوات المالية الأربع السابقة لها مباشرة: من 2023م إلى 2026م."]},{"t":["Count the years at or above €750m: 2025 (€810m) and 2026 (€905m).","نعدّ السنوات التي بلغت فيها الإيرادات 750 مليون يورو أو أكثر: 2025م (810 ملايين) و2026م (905 ملايين)."],"v":2},{"t":["Two of four meets the test. The group is an MNE group because GulfCo sits outside the parent's jurisdiction (Germany).","سنتان من أربع تستوفيان الاختبار. والمجموعة متعددة الجنسيات لأن شركة الخليج تقع خارج ولاية الكيان الأم (ألمانيا)."]},{"t":["FY2027 begins on 1 January 2027, the first fiscal year the Law covers.","تبدأ السنة المالية 2027م في 1 يناير 2027م، وهي أول سنة مالية يسري عليها النظام."]}],"ans":["In scope. GulfCo is a constituent entity located in the Kingdom, in an MNE group that met the €750m test in 2 of the 4 preceding years, so the DMT applies from FY2027. The threshold is applied in riyals (the SAR equivalent of €750m) and is prorated for any fiscal year that is not 12 months long.","تخضع. فشركة الخليج كيان تابع واقع في المملكة ضمن مجموعة متعددة الجنسيات استوفت اختبار 750 مليون يورو في سنتين من السنوات الأربع السابقة، فيسري النظام عليها من السنة المالية 2027م. ويُطبَّق الحد بالريال السعودي (ما يوازي 750 مليون يورو) ويُعدَّل تناسبياً لأي سنة مالية لا تساوي 12 شهراً."],"r":[2,8,"106(1)"]},{"t":["The Kingdom's top-up for 2027","الضريبة التكميلية للمملكة لعام 2027م"],"facts":["An in-scope group has three Saudi constituent entities for FY2027:\n• Alpha: DMT Income SAR 40m; adjusted covered taxes SAR 3.6m\n• Beta: DMT Income SAR 20m; adjusted covered taxes SAR 1.2m\n• Gamma: DMT Loss SAR 10m; no covered taxes\nSubstance-based income exclusion for all Saudi entities: SAR 8m. No additional current top-up tax and no safe harbour.","لمجموعة خاضعة للنظام ثلاثة كيانات تابعة في المملكة للسنة المالية 2027م:\n• ألفا: دخل 40 مليون ريال، وضرائب مشمولة معدلة 3.6 ملايين ريال\n• بيتا: دخل 20 مليون ريال، وضرائب مشمولة معدلة 1.2 مليون ريال\n• غاما: خسارة 10 ملايين ريال، ولا ضرائب مشمولة\nالاستبعاد على أساس جوهر النشاط لجميع الكيانات في المملكة: 8 ملايين ريال. لا توجد ضريبة تكميلية حالية إضافية ولا ملاذ آمن."],"steps":[{"t":["Net DMT Income of the Kingdom = Alpha's and Beta's income less Gamma's loss.","صافي دخل ضريبة الحد الأدنى المحلي في المملكة = دخل ألفا وبيتا ناقص خسارة غاما."],"x":"40000000+20000000-10000000","v":50000000,"u":"SAR"},{"t":["Adjusted covered taxes of all Saudi entities.","الضرائب المشمولة المعدلة لجميع الكيانات في المملكة."],"x":"3600000+1200000","v":4800000,"u":"SAR"},{"t":["ETR = covered taxes ÷ Net DMT Income, as a percentage.","معدل الضريبة الفعلي = الضرائب المشمولة ÷ صافي الدخل، كنسبة مئوية."],"x":"4800000/50000000*100","v":9.6,"u":"%"},{"t":["Top-up % = 15% − ETR.","نسبة الضريبة التكميلية = 15% − معدل الضريبة الفعلي."],"x":"15-9.6","v":5.4,"u":"%"},{"t":["Excess Profit = Net DMT Income − SBIE.","الربح الزائد = صافي الدخل − الاستبعاد على أساس جوهر النشاط."],"x":"50000000-8000000","v":42000000,"u":"SAR"},{"t":["Domestic Top-up Tax = top-up % × excess profit (additional current top-up tax is nil).","الضريبة التكميلية المحلية = النسبة × الربح الزائد (الضريبة الحالية الإضافية صفر)."],"x":"5.4/100*42000000","v":2268000,"u":"SAR"}],"ans":["SAR 2,268,000 for FY2027. Gamma's loss shrinks the denominator, so the blended ETR (9.6%) is higher than Alpha's 9% and Beta's 6%: blending works on the totals, not on an average of entity rates.","2,268,000 ريال للسنة المالية 2027م. وتُصغّر خسارة غاما المقام، فيأتي المعدل المجمّع (9.6%) أعلى من معدل ألفا (9%) ومعدل بيتا (6%)؛ فالتجميع يتم على المجاميع لا على متوسط معدلات الكيانات."],"r":[53,54,"55(1)",56]},{"t":["Who carries the SAR 2,268,000?","من يتحمل مبلغ 2,268,000 ريال؟"],"facts":["Same group as case 2. The Kingdom's Domestic Top-up Tax for FY2027 is SAR 2,268,000.","المجموعة نفسها في الحالة 2. الضريبة التكميلية المحلية للمملكة للسنة المالية 2027م تبلغ 2,268,000 ريال."],"steps":[{"t":["Only entities with DMT Income share the tax. Their total DMT Income is Alpha's plus Beta's (Gamma has a loss).","لا يتقاسم الضريبة إلا الكيانات التي لديها دخل. مجموع دخلها هو دخل ألفا وبيتا (غاما خاسرة)."],"x":"40000000+20000000","v":60000000,"u":"SAR"},{"t":["Alpha's share = DTT × 40m ÷ 60m.","حصة ألفا = الضريبة × 40 مليوناً ÷ 60 مليوناً."],"x":"2268000*40000000/60000000","v":1512000,"u":"SAR"},{"t":["Beta's share = DTT × 20m ÷ 60m.","حصة بيتا = الضريبة × 20 مليوناً ÷ 60 مليوناً."],"x":"2268000*20000000/60000000","v":756000,"u":"SAR"},{"t":["Gamma has no DMT Income, so nothing is allocated to it.","لا دخل لغاما، فلا يُخصص لها شيء."],"v":0,"u":"SAR"}],"ans":["Alpha SAR 1,512,000 and Beta SAR 756,000; Gamma nil. All three are group taxpayers, though, so they are jointly liable for the full SAR 2,268,000 unless ZATCA approves limiting that liability. Note the divisor: total DMT Income (60m), not Net DMT Income (50m).","ألفا 1,512,000 ريال وبيتا 756,000 ريال، وغاما صفر. لكن الثلاثة مكلفون أعضاء في المجموعة، فهم مسؤولون بالتضامن عن كامل مبلغ 2,268,000 ريال ما لم توافق الهيئة على قصر هذه المسؤولية. ولاحظ المقسوم عليه: مجموع الدخل (60 مليوناً) لا صافي الدخل (50 مليوناً)."],"r":["57(1)","73(2)","73(5)"]}],"quiz":[{"q":["What is the Minimum Rate under the draft DMT Law?","ما الحد الأدنى في مشروع نظام ضريبة الحد الأدنى المحلي؟"],"o":[["10%","10%"],["15%","15%"],["20%","20%"],["9%","9%"]],"a":1,"e":["Article 1 defines the Minimum Rate as fifteen percent (15%). 20% is the headline income tax rate, not the DMT benchmark.","تعرّف المادة 1 الحد الأدنى بأنه خمسة عشر بالمائة (15%). أما 20% فهو سعر ضريبة الدخل، وليس معيار ضريبة الحد الأدنى المحلي."],"r":[1]},{"q":["From which fiscal years does the draft Law apply?","اعتباراً من أي سنوات مالية يسري مشروع النظام؟"],"o":[["Fiscal years beginning on or after 1 January 2026","السنوات المالية التي تبدأ في 1 يناير 2026م أو بعده"],["Fiscal years ending on or after 1 January 2027","السنوات المالية التي تنتهي في 1 يناير 2027م أو بعده"],["Fiscal years beginning on or after 1 January 2027","السنوات المالية التي تبدأ في 1 يناير 2027م أو بعده"],["From the date it is published in the Official Gazette","من تاريخ نشره في الجريدة الرسمية"]],"a":2,"e":["Article 106(1): fiscal years beginning on or after 1 January 2027. A group with a July–June year is first caught for the year that starts on 1 July 2027.","المادة 106 (1): السنوات المالية التي تبدأ في 1 يناير 2027م أو بعده. فالمجموعة التي تبدأ سنتها في يوليو تخضع أول مرة عن السنة التي تبدأ في 1 يوليو 2027م."],"r":["106(1)"]},{"q":["Which revenue test brings a Saudi entity into scope?","ما اختبار الإيرادات الذي يُدخل الكيان الواقع في المملكة ضمن النطاق؟"],"o":[["The Saudi entity's own revenue is SAR 750m or more in the current year","تبلغ إيرادات الكيان نفسه 750 مليون ريال أو أكثر في السنة الحالية"] ة، بما فيها المناطق الاقتصادية الخاصة صراحةً، والكيانات التابعة عديمة الجنسية المنشأة بموجب أنظمة المملكة. فالوجود في منطقة خاصة لا يُخرج الكيان من النطاق."],"r":["2(1)","2(2)"]},{"q":["How is the effective tax rate measured?","كيف يُقاس معدل الضريبة الفعلي؟"],"o":[["Entity by entity, for each Saudi company","لكل كيان على حدة، لكل شركة في المملكة"],["For the Kingdom as a whole: total adjusted covered taxes of Saudi constituent entities ÷ the Kingdom's Net DMT Income","للمملكة ككل: إجمالي الضرائب المشمولة المعدلة للكيانات في المملكة ÷ صافي دخل ضريبة الحد الأدنى المحلي في المملكة"],["Worldwide, for the whole MNE group","على مستوى المجموعة المتعددة الجنسيات عالمياً"],["Covered taxes ÷ accounting revenue","الضرائب المشمولة ÷ الإيرادات المحاسبية"]],"a":1,"e":["Article 53(2) blends all Saudi constituent entities into one Kingdom ETR, so high-taxed and low-taxed Saudi entities average out.","تجمع المادة 53 (2) جميع الكيانات التابعة في المملكة في معدل فعلي واحد للمملكة، فتتوازن الكيانات مرتفعة الضريبة مع منخفضة الضريبة."],"r":["53(2)"]},{"q":["A group's Kingdom ETR is 11%. What is the top-up tax percentage?","معدل الضريبة الفعلي لمجموعة في المملكة 11%. فما نسبة الضريبة التكميلية؟"],"o":[["11%","11%"],["4%","4%"],["15%","15%"],["26%","26%"]],"a":1,"e":["Article 54: the positive difference between the 15% Minimum Rate and the ETR, so 15% − 11% = 4 percentage points.","المادة 54: الفرق الإيجابي بين الحد الأدنى 15% ومعدل الضريبة الفعلي، أي 15% − 11% = 4 نقاط مئوية."],"r":[54]},{"q":["Excess Profit for the Kingdom equals:","يساوي الربح الزائد للمملكة:"],"o":[["Net DMT Income minus the substance-based income exclusion","صافي دخل ضريبة الحد الأدنى المحلي ناقص الاستبعاد على أساس جوهر النشاط"],["Revenue minus the substance-based income exclusion","الإيرادات ناقص الاستبعاد على أساس جوهر النشاط"],["Net DMT Income minus adjusted covered taxes","صافي الدخل ناقص الضرائب المشمولة المعدلة"],["DMT Income × 15%","الدخل × 15%"]],"a":0,"e":["Article 55(1). The exclusion shields a routine return on payroll and tangible assets; only profit above it is topped up.","المادة 55 (1). يحمي الاستبعاد عائداً اعتيادياً على الرواتب والأصول الملموسة، ولا تُفرض الضريبة التكميلية إلا على الربح الذي يتجاوزه."],"r":["55(1)"]},{"q":["The Kingdom's Domestic Top-up Tax for a year is:","الضريبة التكميلية المحلية للمملكة عن سنة هي:"],"o":[["Top-up % × Net DMT Income","نسبة الضريبة التكميلية × صافي الدخل"],["Top-up % × Excess Profit + Additional Current Top-up Tax","نسبة الضريبة التكميلية × الربح الزائد + الضريبة التكميلية الحالية الإضافية"],["15% × Excess Profit","15% × الربح الزائد"],["(15% − ETR) × revenue","(15% − المعدل الفعلي) × الإيرادات"]],"a":1,"e":["Article 56: multiply the top-up % by excess profit, then add the additional current top-up tax under Article 63, which picks up recalculations of earlier years.","المادة 56: اضرب نسبة الضريبة التكميلية في الربح الزائد، ثم أضف الضريبة التكميلية الحالية الإضافية وفق المادة 63، التي تلتقط إعادة احتساب السنوات السابقة."],"r":[56,63]},{"q":["A Saudi entity in an in-scope group has a DMT Loss this year. How much of the Kingdom's tax is allocated to it under Article 57(1)?","كيان في المملكة ضمن مجموعة خاضعة لديه خسارة هذا العام. ما حصته من ضريبة المملكة وفق المادة 57 (1)؟"],"o":[["A share based on the size of its loss","حصة بحسب حجم خسارته"],["None: allocation follows each entity's DMT Income","لا شيء: التوزيع يتبع دخل كل كيان"],["An equal share with the other entities","حصة مساوية لبقية الكيانات"],["All of it, as the entity that pulled the rate down","كامل المبلغ لأنه خفّض المعدل"]],"a":1,"e":["Article 57(1) allocates only to entities with DMT Income, in proportion to that income. The loss-making entity is still jointly liable as a group taxpayer under Article 73(2).","توزع المادة 57 (1) الضريبة على الكيانات التي لديها دخل فقط وبنسبة دخلها. ومع ذلك يبقى الكيان الخاسر مسؤولاً بالتضامن بصفته مكلفاً عضواً في المجموعة وفق المادة 73 (2)."],"r":["57(1)","73(2)"]},{"q":["Which of these is NOT one of the DMT Safe Harbours listed in Article 66(4)?","أي مما يلي ليس من الملاذات الآمنة المذكورة في المادة 66 (4)؟"],"o":[["Transitional CbCR Safe Harbour","الملاذ الآمن الانتقالي للتقرير الخاص بكل دولة"],["Simplified ETR Safe Harbour","الملاذ الآمن لمعدل الضريبة الفعلي المبسط"],["NMCE Simplified Calculations Safe Harbour","الملاذ الآمن للاحتساب المبسط للكيانات غير الجوهرية"],["The de minimis exclusion","استبعاد المستوى الأدنى"]],"a":3,"e":["The de minimis exclusion is a separate election in Article 64. Article 66(4) lists four safe harbours: transitional CbCR, simplified ETR, NMCE simplified calculations and substance-based tax incentive.","استبعاد المستوى الأدنى اختيار مستقل في المادة 64. أما المادة 66 (4) فتذكر أربعة ملاذات: الانتقالي للتقرير الخاص بكل دولة، ومعدل الضريبة الفعلي المبسط، والاحتساب المبسط للكيانات غير الجوهرية، والحوافز الضريبية القائمة على الجوهر."],"r":["66(4)",64]},{"q":["ZATCA wants to challenge a safe harbour election. What timeline does Article 66(3) set?","تريد الهيئة الاعتراض على اختيار ملاذ آمن. ما المهلة التي تحددها المادة 66 (3)؟"],"o":[["Notice within 12 months of filing; 30 days to respond","إخطار خلال 12 شهراً من تقديم الإقرار، و30 يوماً للرد"],["Notice within 36 months after filing; 6 months to respond","إخطار خلال 36 شهراً بعد تقديم الإقرار، و6 أشهر للرد"],["Notice within 5 years; 90 days to respond","إخطار خلال 5 سنوات، و90 يوماً للرد"],["An election can never be challenged","لا يجوز الاعتراض على الاختيار مطلقاً"]],"a":1,"e":["Article 66(3)(b)–(c): ZATCA notifies specific facts within 36 months after the return is filed and invites a response within 6 months. The election falls away only if the entity cannot show those facts did not materially affect eligibility, and Saudi top-up could otherwise arise.","المادة 66 (3) (ب)–(ج): تُخطر الهيئة بحقائق محددة خلال 36 شهراً بعد تقديم الإقرار وتدعو إلى الرد خلال 6 أشهر. ولا يسقط الاختيار إلا إذا عجز الكيان عن إثبات أن تلك الحقائق لم تؤثر جوهرياً في الأهلية، وكان يمكن أن تنشأ ضريبة تكميلية في المملكة."],"r":["66(3)"]},{"q":["Who is liable to pay the Kingdom's Domestic Top-up Tax?","من المسؤول عن سداد الضريبة التكميلية المحلية للمملكة؟"],"o":[["Only the ultimate parent entity","الكيان الأم النهائي فقط"],["Each taxpayer, with group taxpayers jointly liable; ZATCA can approve limiting joint liability","كل مكلف، مع مسؤولية تضامنية على المكلفين في المجموعة، ويجوز بموافقة الهيئة قصرها"],["Only the filing constituent entity","الكيان التابع المعين لتقديم الإقرار فقط"],["Only Saudi-owned entities","الكيانات المملوكة لسعوديين فقط"]],"a":1,"e":["Article 73(1), (2) and (5). The filing entity files, but liability rests with all the group's Saudi taxpayers jointly unless ZATCA approves a limit.","المادة 73 (1) و(2) و(5). يقدّم الكيان المعين الإقرار، لكن المسؤولية تقع على جميع المكلفين في المجموعة في المملكة بالتضامن ما لم توافق الهيئة على قصرها."],"r":["73(1)","73(2)","73(5)"]}],"cards":[{"f":["Minimum Rate","الحد الأدنى"],"b":["15%","15% (خمسة عشر بالمائة)"],"r":[1]},{"f":["What tax does the DMT Law impose?","ما الضريبة التي يفرضها نظام ضريبة الحد الأدنى المحلي؟"],"b":["The Domestic Top-up Tax, designed as a qualified domestic minimum top-up tax (QDMTT).","الضريبة التكميلية المحلية، المصممة بوصفها ضريبة تكميلية محلية أدنى مؤهلة."],"r":[1]},{"f":["The revenue test","اختبار الإيرادات"],"b":["UPE consolidated revenue ≥ the SAR equivalent of €750m in at least 2 of the 4 fiscal years immediately before the tested year; prorated for years that are not 12 months.","إيرادات موحدة للكيان الأم النهائي توازي 750 مليون يورو بالريال أو أكثر في سنتين على الأقل من السنوات الأربع السابقة مباشرة، مع التعديل التناسبي للسنوات التي لا تساوي 12 شهراً."],"r":[2]},{"f":["First fiscal years covered","أول السنوات المالية الخاضعة"],"b":["Fiscal years beginning on or after 1 January 2027.","السنوات المالية التي تبدأ في 1 يناير 2027م أو بعده."],"r":["106(1)"]},{"f":["When must the Regulations be issued?","متى يجب إصدار اللائحة؟"],"b":["Within 180 days after the Law is issued; they take effect from the Law's effective date.","خلال 180 يوماً من صدور النظام، ويُعمل بها من تاريخ نفاذ النظام."],"r":["106(2)"]},{"f":["ETR formula","معادلة معدل الضريبة الفعلي"],"b":["Total adjusted covered taxes of Saudi constituent entities ÷ Net DMT Income of the Kingdom.","إجمالي الضرائب المشمولة المعدلة للكيانات التابعة في المملكة ÷ صافي دخل ضريبة الحد الأدنى المحلي في المملكة."],"r":["53(2)"]},{"f":["Net DMT Income","صافي دخل ضريبة الحد الأدنى المحلي"],"b":["DMT Income of all Saudi constituent entities minus their DMT Losses, if positive.","دخل جميع الكيانات التابعة في المملكة ناقص خسائرها، إن كان موجباً."],"r":["53(4)"]},{"f":["Top-up Tax Percentage","نسبة الضريبة التكميلية"],"b":["15% minus the Kingdom ETR, if positive.","15% ناقص معدل الضريبة الفعلي للمملكة، إن كان موجباً."],"r":[54]},{"f":["Excess Profit","الربح الزائد"],"b":["Net DMT Income minus the substance-based income exclusion of all Saudi constituent entities.","صافي الدخل ناقص الاستبعاد على أساس جوهر النشاط لجميع الكيانات التابعة في المملكة."],"r":["55(1)"]},{"f":["Domestic Top-up Tax formula","معادلة الضريبة التكميلية المحلية"],"b":["Top-up % × Excess Profit + Additional Current Top-up Tax.","نسبة الضريبة التكميلية × الربح الزائد + الضريبة التكميلية الحالية الإضافية."],"r":[56]},{"f":["How is the Kingdom's tax shared among entities?","كيف تُوزَّع ضريبة المملكة على الكيانات؟"],"b":["DTT × the entity's DMT Income ÷ total DMT Income of all Saudi constituent entities. Loss-makers get nothing.","الضريبة × دخل الكيان ÷ مجموع دخل جميع الكيانات التابعة في المملكة. ولا شيء للكيانات الخاسرة."],"r":["57(1)"]},{"f":["The four DMT Safe Harbours","الملاذات الآمنة الأربعة"],"b":["Transitional CbCR · Simplified ETR · NMCE Simplified Calculations · Substance-based Tax Incentive.","الانتقالي للتقرير الخاص بكل دولة · معدل الضريبة الفعلي المبسط · الاحتساب المبسط للكيانات غير الجوهرية · الحوافز الضريبية القائمة على الجوهر."],"r":["66(4)"]}],"reflect":{"ref":["Al-Mutaffifin 83:1–3","المطففين: 1–3"],"ayah":"ويل للمطففين","t":["These verses warn those who take full measure for themselves but give short measure to others. A minimum tax is at heart a rule about measuring fairly: one 15% line for every group's Saudi profit. Measure honestly on both sides of the scale, for the client and for the Kingdom.","تحذّر هذه الآيات من الذين يستوفون الكيل لأنفسهم وينقصونه لغيرهم. وضريبة الحد الأدنى في جوهرها قاعدة للقياس العادل: خط واحد عند 15% لأرباح كل مجموعة في المملكة. فلنقس بأمانة في كفتي الميزان، للعميل وللمملكة."]},"range":"1–2, 53–57, 66, 73, 106"},{"id":2,"title":["Scope I: MNE groups and the €750m test","النطاق (1): المجموعات المتعددة الجنسيات واختبار 750 مليون يورو"],"goal":["Decide whether a group and its Saudi entities are in scope: group, MNE group, ultimate parent, constituent entity and the revenue test.","تحديد ما إذا كانت المجموعة وكياناتها في المملكة ضمن النطاق: المجموعة، والمجموعة المتعددة الجنسيات، والكيان الأم النهائي، والكيان التابع، واختبار الإيرادات."],"parts":[1,2],"arts":[2,3,4,7,8,9,10],"time":30,"metaphor":{"title":["The family photo","الصورة العائلية"],"text":["The ultimate parent's consolidated financial statements are the group's family photo. Everyone consolidated line by line is in the photo, and so is anyone left out only because they are small, immaterial or held for sale: that is the Group. The one who is not in anybody else's photo is the ultimate parent.\nIf at least one family member lives outside the parent's country, it is an MNE family. The revenue test reads the caption under the photo (consolidated revenue), never the Saudi member's own income.","القوائم المالية الموحدة للكيان الأم النهائي هي الصورة العائلية للمجموعة. كل من يُوحَّد على أساس كل بند على حدة موجود في الصورة، وكذلك من استُبعد فقط بسبب الحجم أو الجوهر أو لأنه محتفظ به لغرض البيع: هذه هي المجموعة. ومن لا يظهر في صورة أي أحد آخر هو الكيان الأم النهائي.\nفإذا كان فرد واحد على الأقل من العائلة يعيش خارج دولة الكيان الأم، فهي عائلة متعددة الجنسيات. ويقرأ اختبار الإيرادات التعليق المكتوب أسفل الصورة (الإيرادات الموحدة)، لا دخل الفرد الموجود في المملكة."]},"anchors":[{"if":["You need to know who belongs to the group","تحتاج إلى معرفة من ينتمي إلى المجموعة"],"then":["Open the UPE's consolidated statements: consolidated line by line, or left out only for size, materiality or held for sale (Art 8(2))","افتح القوائم الموحدة للكيان الأم النهائي: من يُوحَّد بنداً بنداً، أو يُستبعد فقط بسبب الحجم أو الجوهر أو الاحتفاظ به للبيع (المادة 8 (2))"]},{"if":["Group revenue hovers around €750m","تتأرجح إيرادات المجموعة حول 750 مليون يورو"],"then":["Build a four-year table of UPE consolidated revenue in riyals and prorate any year that is not 12 months (Art 2(3))","أعد جدولاً للإيرادات الموحدة للكيان الأم النهائي بالريال لأربع سنوات، وعدّل تناسبياً أي سنة لا تساوي 12 شهراً (المادة 2 (3))"]},{"if":["The accounts show investment gains or one-off gains","تُظهر القوائم مكاسب استثمارية أو مكاسب غير متكررة"],"then":["Count them: revenue includes net investment gains and extraordinary or non-recurring items (Art 3(1)(b))","احتسبها: تشمل الإيرادات صافي المكاسب الاستثمارية والبنود الاستثنائية أو غير المتكررة (المادة 3 (1) (ب))"]},{"if":["A Saudi company is owned by a sovereign wealth fund","شركة سعودية مملوكة لصندوق ثروة سيادي"],"then":["Ignore the fund if it meets the Governmental Entity test; each company it directly controls is the UPE of its own group (Art 10(2))","تجاهل الصندوق إذا استوفى معيار الكيان الحكومي؛ فكل شركة يسيطر عليها مباشرة هي الكيان الأم النهائي لمجموعتها (المادة 10 (2))"]},{"if":["A purely domestic Saudi group, with no foreign entity or PE","مجموعة سعودية محلية بالكامل بلا كيان أو منشأة دائمة في الخارج"],"then":["Not an MNE group, so out of scope however large it is (Art 8(1))","ليست مجموعة متعددة الجنسيات، فهي خارج النطاق مهما كان حجمها (المادة 8 (1))"]}],"diagrams":[{"type":"tree","title":["Is this Saudi entity in scope?","هل يخضع هذا الكيان في المملكة للنظام؟"],"root":{"q":["Is it in a Group: consolidated, or left out only for size, materiality or held for sale?","هل هو ضمن مجموعة: موحّد، أو مستبعد فقط بسبب الحجم أو الجوهر أو الاحتفاظ به للبيع؟"],"yes":{"q":["Does the Group have at least one entity or PE outside the UPE's jurisdiction?","هل لدى المجموعة كيان أو منشأة دائمة واحدة على الأقل خارج ولاية الكيان الأم النهائي؟"],"yes":{"q":["UPE consolidated revenue ≥ SAR equivalent of €750m in 2 of the 4 preceding years?","هل بلغت الإيرادات الموحدة ما يوازي 750 مليون يورو بالريال في سنتين من السنوات الأربع السابقة؟"],"yes":{"q":["Is the entity an Excluded Entity (Art 12)?","هل الكيان كيان مستبعد (المادة 12)؟"],"yes":{"end":["Out of scope: excluded","خارج النطاق: مستبعد"],"tone":"out"},"no":{"end":["In scope: a Saudi constituent entity and taxpayer","ضمن النطاق: كيان تابع في المملكة ومكلف"],"tone":"in"}},"no":{"end":["Out of scope for this year","خارج النطاق لهذه السنة"],"tone":"out"}},"no":{"end":["Not an MNE group: out of scope","ليست مجموعة متعددة الجنسيات: خارج النطاق"],"tone":"out"}},"no":{"end":["Not a group member. An entity with a foreign PE can still form its own Group (Art 8(3)).","ليس عضواً في مجموعة. ويمكن للكيان الذي له منشأة دائمة في الخارج أن يشكّل مجموعة بذاته (المادة 8 (3))."],"tone":"na"}}},{"type":"table","title":["What counts as revenue for the €750m test","ما يُحتسب من الإيرادات لاختبار 750 مليون يورو"],"head":[["Item","البند"],["Treatment","المعالجة"]],"rows":[[["Sales of goods, services and other ordinary activities","بيع السلع وتقديم الخدمات والأنشطة الاعتيادية الأخرى"],["Included (Art 3(1)(a))","تُدرج (المادة 3 (1) (أ))"]],[["Net investment gains, realised or unrealised, in the consolidated P&L","صافي المكاسب الاستثمارية المحققة وغير المحققة في قائمة الأرباح والخسائر الموحدة"],["Included (Art 3(1)(b))","تُدرج (المادة 3 (1) (ب))"]],[["Extraordinary or non-recurring income or gains shown separately","الدخل أو المكاسب المعروضة بشكل منفصل كبنود استثنائية أو غير متكررة"],["Included (Art 3(1)(b))","تُدرج (المادة 3 (1) (ب))"]],[["Discounts, returns and allowances","الخصومات والمرتجعات والمسموحات"],["May be netted if the accounting standard allows (Art 3(2))","تجوز مقاصتها إذا سمح بها المعيار المحاسبي (المادة 3 (2))"]],[["Cost of sales and other operating expenses","تكلفة المبيعات والمصاريف التشغيلية الأخرى"],["Never deducted (Art 3(2))","لا تُخصم (المادة 3 (2))"]],[["Gross investment losses shown separately","إجمالي خسائر الاستثمارات المعروضة بشكل منفصل"],["Reduce revenue only up to gross investment gains (Art 3(4))","تخفض الإيرادات بحدود إجمالي المكاسب الاستثمارية فقط (المادة 3 (4))"]],[["Financial entities","الكيانات المالية"],["Use the items similar to revenue under the UPE's accounting standards (Art 3(5))","تُستخدم البنود المماثلة للإيرادات وفق المعايير المحاسبية للكيان الأم النهائي (المادة 3 (5))"]]]}],"points":[{"h":["Group","المجموعة"],"t":["Entities related through ownership or control whose assets, liabilities, income, expenses and cash flows are in the ultimate parent's consolidated financial statements, or are left out of them solely on size or materiality grounds or because the entity is held for sale. An entity with PEs in other jurisdictions is also a Group, if it is not part of another Group.","كيانات مرتبطة بالملكية أو السيطرة تُدرج أصولها والتزاماتها ودخلها ومصاريفها وتدفقاتها النقدية في القوائم المالية الموحدة للكيان الأم النهائي، أو تُستبعد منها فقط على أساس الحجم أو الجوهر أو لكون الكيان محتفظاً به لغرض البيع. ويُعد مجموعةً أيضاً الكيانُ الذي له منشآت دائمة في ولايات أخرى ما لم يكن جزءاً من مجموعة أخرى."],"r":["8(2)","8(3)"]},{"h":["MNE group","المجموعة المتعددة الجنسيات"],"t":["A Group with at least one entity or permanent establishment that is not located in the ultimate parent's jurisdiction. A purely domestic Saudi group is not an MNE group.","مجموعة لديها كيان أو منشأة دائمة واحدة على الأقل لا تقع في ولاية الكيان الأم النهائي. والمجموعة السعودية المحلية بالكامل ليست مجموعة متعددة الجنسيات."],"r":["8(1)"]},{"h":["Constituent entity","الكيان التابع"],"t":["Any entity included in a Group, and any permanent establishment of such an entity. Each PE is treated as separate from its main entity and from the main entity's other PEs. Excluded entities are never constituent entities.","أي كيان مشمول في مجموعة، وأي منشأة دائمة لهذا الكيان. وتُعامل كل منشأة دائمة على أنها منفصلة عن الكيان الرئيسي وعن منشآته الدائمة الأخرى. ولا يكون الكيان المستبعد كياناً تابعاً أبداً."],"r":[9]},{"h":["Ultimate parent entity","الكيان الأم النهائي"],"t":["The entity that owns, directly or indirectly, a controlling interest in another entity and is not itself owned with a controlling interest by another entity; or the main entity of a Group formed by an entity and its foreign PEs.","الكيان الذي يمتلك بشكل مباشر أو غير مباشر حصة مسيطرة في كيان آخر، ولا يكون هو نفسه مملوكاً بحصة مسيطرة لكيان آخر؛ أو الكيان الرئيسي لمجموعة مكوّنة من كيان ومنشآته الدائمة في الخارج."],"r":["10(1)"]},{"h":["Controlling interest","الحصة المسيطرة"],"t":["An ownership interest such that the holder consolidates the entity line by line under an Acceptable Financial Accounting Standard, or would have to if it prepared consolidated statements. A main entity is deemed to hold the controlling interest in its PEs.","حصة ملكية تجعل مالكها يوحّد الكيان على أساس كل بند على حدة وفقاً للمعايير المحاسبية المالية المقبولة، أو كان سيتعين عليه ذلك لو أعدّ قوائم موحدة. ويُعد الكيان الرئيسي مالكاً للحصص المسيطرة في منشآته الدائمة."],"r":[7]},{"h":["Which financial statements","أي قوائم مالية"],"t":["Consolidated statements prepared under an Acceptable Financial Accounting Standard. If the parent uses another standard, its statements count after adjustments to prevent material competitive distortions, which are corrected to the IFRS treatment under ZATCA guidance. If it prepares none, use those it would have prepared.","القوائم الموحدة المعدة وفق المعايير المحاسبية المالية المقبولة. فإذا استخدم الكيان الأم معياراً آخر، تُعتمد قوائمه بعد التعديلات اللازمة لمنع أي تباينات تنافسية جوهرية، والتي تُصحح إلى معالجة المعايير الدولية للتقرير المالي وفق إرشادات الهيئة. وإذا لم يُعد قوائم، تُستخدم القوائم التي كان سيعدها."],"r":["4(1)","4(2)"]},{"h":["The accepted standards","المعايير المقبولة"],"t":["IFRS, plus the GAAP of Australia, Brazil, Canada, EU and EEA member states, Hong Kong (China), Japan, Mexico, New Zealand, China, India, Korea, Russia, Singapore, Switzerland, the UK and the USA.","المعايير الدولية للتقرير المالي، والمبادئ المحاسبية المقبولة عموماً في أستراليا والبرازيل وكندا والدول الأعضاء في الاتحاد الأوروبي والمنطقة الاقتصادية الأوروبية وهونغ كونغ (الصين) واليابان والمكسيك ونيوزيلندا والصين والهند وكوريا وروسيا وسنغافورة وسويسرا والمملكة المتحدة والولايات المتحدة."],"r":[1]},{"h":["Sovereign wealth funds","صناديق الثروة السيادية"],"t":["A sovereign wealth fund that meets the Governmental Entity criterion of managing or investing the government's assets is not treated as an ultimate parent and is ignored. Each entity in which it holds a controlling interest through direct ownership is the ultimate parent of its own group, and each group is tested on its own.","لا يُعد صندوق الثروة السيادي الذي يستوفي معيار الكيان الحكومي (إدارة أصول الحكومة أو استثمارها) كياناً أماً نهائياً ويتم تجاهله. ويُعد كل كيان يملك فيه الصندوق حصة مسيطرة نتيجة حصص ملكية مباشرة الكيانَ الأم النهائي لمجموعته، وتُختبر كل مجموعة على حدة."],"r":["10(2)","13(2)"]},{"h":["Short and long years","السنوات القصيرة والطويلة"],"t":["If any of the four test years is not 12 months long, the €750m threshold for that year is adjusted in proportion to its length.","إذا كانت أي من سنوات الاختبار الأربع لا تساوي 12 شهراً، يُعدّل حد 750 مليون يورو لتلك السنة بما يتناسب مع مدتها."],"r":["2(3)"]}],"oecd":[{"t":["The scope test matches GloBE Article 1.1: €750m in the UPE's consolidated financial statements in at least two of the four preceding fiscal years. The draft measures the threshold in riyals.","يطابق اختبار النطاق المادة 1.1 من القواعد النموذجية: 750 مليون يورو في القوائم المالية الموحدة للكيان الأم النهائي في سنتين على الأقل من السنوات المالية الأربع السابقة. ويقيس المشروع الحد بالريال السعودي."],"src":["Model Rules Art 1.1","القواعد النموذجية: المادة 1.1"]},{"t":["The sovereign wealth fund rule follows OECD Administrative Guidance (February 2023): a fund that meets the Governmental Entity definition is not the UPE of the companies it controls, so they are tested as separate groups.","تتبع قاعدة صناديق الثروة السيادية الإرشادات الإدارية للمنظمة (فبراير 2023م): فالصندوق الذي يستوفي تعريف الكيان الحكومي لا يُعد الكيان الأم النهائي للشركات التي يسيطر عليها، فتُختبر كمجموعات منفصلة."],"src":["OECD Administrative Guidance, February 2023","الإرشادات الإدارية للمنظمة، فبراير 2023م"]}],"cases":[{"t":["The short year that tipped the test","السنة القصيرة التي حسمت الاختبار"],"facts":["A group's French UPE moved its year-end from 30 June to 31 December. It has a Saudi subsidiary. Consolidated revenue:\n• Year to 30 Jun 2024 (12 months): €760m\n• Year to 30 Jun 2025 (12 months): €730m\n• 1 Jul–31 Dec 2025 (6 months): €390m\n• Calendar 2026 (12 months): €745m\nIs the Saudi subsidiary in scope for FY2027?","نقل الكيان الأم النهائي الفرنسي لمجموعة نهاية سنته المالية من 30 يونيو إلى 31 ديسمبر، وللمجموعة شركة تابعة في المملكة. الإيرادات الموحدة:\n• السنة المنتهية في 30 يونيو 2024م (12 شهراً): 760 مليون يورو\n• السنة المنتهية في 30 يونيو 2025م (12 شهراً): 730 مليون يورو\n• من 1 يوليو إلى 31 ديسمبر 2025م (6 أشهر): 390 مليون يورو\n• السنة التقويمية 2026م (12 شهراً): 745 مليون يورو\nهل تخضع الشركة التابعة في المملكة للنظام عن السنة المالية 2027م؟"],"steps":[{"t":["The four fiscal years immediately before FY2027 are the four periods listed.","السنوات المالية الأربع السابقة مباشرة للسنة المالية 2027م هي الفترات الأربع المذكورة."]},{"t":["Prorate the threshold for the 6-month year: €750m × 6 ÷ 12.","عدّل الحد تناسبياً للسنة ذات الأشهر الستة: 750 مليون يورو × 6 ÷ 12."],"x":"750000000*6/12","v":375000000,"u":"EUR"},{"t":["Compare each year: €760m meets €750m; €730m fails; €390m meets the prorated €375m; €745m fails.","قارن كل سنة: 760 مليوناً تستوفي 750 مليوناً؛ و730 مليوناً لا تستوفي؛ و390 مليوناً تستوفي الحد المعدل 375 مليوناً؛ و745 مليوناً لا تستوفي."],"v":2},{"t":["Two of the four years meet the threshold, so the test is met.","سنتان من الأربع تستوفيان الحد، فيتحقق الاختبار."]}],"ans":["In scope for FY2027. Without proration the short year would fail (€390m is below €750m) and the group would stay out. In practice each year's threshold is the riyal equivalent of €750m.","تخضع عن السنة المالية 2027م. ولولا التعديل التناسبي لفشلت السنة القصيرة (390 مليوناً أقل من 750 مليوناً) وبقيت المجموعة خارج النطاق. وعملياً يكون حد كل سنة ما يوازي 750 مليون يورو بالريال."],"r":["2(1)","2(3)"]},{"t":["Who is the UPE, and who is in the Group?","من الكيان الأم النهائي، ومن ضمن المجموعة؟"],"facts":["Najd Holding (Saudi) owns 60% of Najd Steel (Saudi, consolidated), 100% of Najd Egypt (consolidated) and 30% of Gulf Logistics (UAE, equity-accounted associate). No one holds a controlling interest in Najd Holding. Consolidated revenue has been about €900m in each of the last four years.","تملك شركة نجد القابضة (سعودية) 60% من نجد للصلب (سعودية، موحّدة) و100% من نجد مصر (موحّدة) و30% من الخليج للخدمات اللوجستية (إماراتية، شركة زميلة بطريقة حقوق الملكية). ولا يملك أحد حصة مسيطرة في نجد القابضة. وبلغت الإيرادات الموحدة نحو 900 مليون يورو في كل من السنوات الأربع الأخيرة."],"steps":[{"t":["UPE: Najd Holding owns controlling interests and is not owned with a controlling interest by anyone.","الكيان الأم النهائي: نجد القابضة تملك حصصاً مسيطرة ولا يملكها أحد بحصة مسيطرة."]},{"t":["Group: Najd Holding, Najd Steel and Najd Egypt are consolidated. Gulf Logistics is equity-accounted, not consolidated, so it is outside the Group.","المجموعة: نجد القابضة ونجد للصلب ونجد مصر موحّدة. أما الخليج للخدمات اللوجستية فتُحتسب بطريقة حقوق الملكية ولا تُوحَّد، فهي خارج المجموعة."]},{"t":["MNE group: yes, because Najd Egypt is located outside the UPE's jurisdiction.","مجموعة متعددة الجنسيات: نعم، لأن نجد مصر تقع خارج ولاية الكيان الأم النهائي."]},{"t":["Revenue test: about €900m in every test year, so at least two of four years meet the threshold.","اختبار الإيرادات: نحو 900 مليون يورو في كل سنة اختبار، فتستوفي سنتان على الأقل من أربع الحد."]}],"ans":["Najd Holding (the UPE is also a constituent entity) and Najd Steel are Saudi constituent entities in scope. Najd Egypt is a constituent entity located in Egypt, outside the Saudi DMT. Gulf Logistics is not a constituent entity at all.","نجد القابضة (فالكيان الأم النهائي كيان تابع أيضاً) ونجد للصلب كيانان تابعان في المملكة ضمن النطاق. ونجد مصر كيان تابع يقع في مصر خارج ضريبة الحد الأدنى المحلي السعودية. أما الخليج للخدمات اللوجستية فليست كياناً تابعاً أصلاً."],"r":["7(1)","8(1)","8(2)","9(1)","10(1)"]},{"t":["A state fund's portfolio","محفظة صندوق حكومي"],"facts":["Watani Fund is a state investment fund that meets the Governmental Entity criterion of investing the government's assets. It directly holds controlling stakes in three Saudi companies, each with steady revenue over the last four years:\n• Company A: subsidiaries in KSA and Egypt; group revenue €1.2bn\n• Company B: operations only in KSA; revenue €2bn\n• Company C: a subsidiary in the UAE; group revenue €0.5bn","صندوق وطني صندوق استثماري حكومي يستوفي معيار الكيان الحكومي المتمثل في استثمار أصول الحكومة. ويملك مباشرة حصصاً مسيطرة في ثلاث شركات سعودية، ولكل منها إيرادات مستقرة خلال السنوات الأربع الأخيرة:\n• الشركة أ: شركات تابعة في المملكة ومصر؛ إيرادات المجموعة 1.2 مليار يورو\n• الشركة ب: عمليات في المملكة فقط؛ إيرادات 2 مليار يورو\n• الشركة ج: شركة تابعة في الإمارات؛ إيرادات المجموعة 0.5 مليار يورو"],"steps":[{"t":["Had the fund been the UPE, all three would form one group with this revenue:","لو كان الصندوق الكيان الأم النهائي، لشكلت الشركات الثلاث مجموعة واحدة بهذه الإيرادات:"],"x":"1200000000+2000000000+500000000","v":3700000000,"u":"EUR"},{"t":["But the fund meets the Governmental Entity criterion, so it is ignored. A, B and C are each the UPE of their own group.","لكن الصندوق يستوفي معيار الكيان الحكومي، فيتم تجاهله. وتُعد كل من أ وب وج الكيان الأم النهائي لمجموعتها."]},{"t":["Group A: an MNE group (Egypt) with €1.2bn, above €750m. In scope.","مجموعة أ: متعددة الجنسيات (مصر) بإيرادات 1.2 مليار يورو تتجاوز 750 مليوناً. ضمن النطاق."]},{"t":["Group B: purely domestic, so not an MNE group. Out of scope despite €2bn.","مجموعة ب: محلية بالكامل، فليست متعددة الجنسيات. خارج النطاق رغم إيراداتها البالغة 2 مليار يورو."]},{"t":["Group C: an MNE group (UAE) but €0.5bn is below €750m. Out of scope.","مجموعة ج: متعددة الجنسيات (الإمارات) لكن 0.5 مليار يورو أقل من 750 مليوناً. خارج النطاق."]}],"ans":["Only Company A's Saudi entities are in scope. Without the sovereign fund rule all three would be one €3.7bn MNE group, and B's and C's Saudi entities would be caught too.","الكيانات السعودية للشركة أ وحدها ضمن النطاق. ولولا قاعدة صناديق الثروة السيادية لكانت الشركات الثلاث مجموعة متعددة الجنسيات واحدة بإيرادات 3.7 مليار يورو، ولخضعت كيانات ب وج في المملكة أيضاً."],"r":["10(2)","13(2)","8(1)","2(1)"]}],"quiz":[{"q":["What turns a Group into an MNE Group?","ما الذي يجعل المجموعة مجموعة متعددة الجنسيات؟"],"o":[["Revenue of €750m or more","إيرادات تبلغ 750 مليون يورو أو أكثر"],["At least one entity or PE located outside the UPE's jurisdiction","كيان أو منشأة دائمة واحدة على الأقل تقع خارج ولاية الكيان الأم النهائي"],["A foreign shareholder in the UPE","مساهم أجنبي في الكيان الأم النهائي"],["Listing on a foreign stock exchange","الإدراج في سوق مالية أجنبية"]],"a":1,"e":["Article 8(1). Foreign shareholders or listings do not matter; what matters is an entity or PE located outside the UPE's jurisdiction.","المادة 8 (1). لا عبرة بالمساهمين الأجانب أو الإدراج، بل بوجود كيان أو منشأة دائمة خارج ولاية الكيان الأم النهائي."],"r":["8(1)"]},{"q":["A subsidiary is left out of the UPE's consolidated statements only because it is immaterial. Is it part of the Group?","استُبعدت شركة تابعة من القوائم الموحدة للكيان الأم النهائي فقط لعدم أهميتها النسبية. هل هي جزء من المجموعة؟"],"o":[["No, only consolidated entities count","لا، الكيانات الموحدة فقط هي التي تُحتسب"],["Yes, exclusion solely on size or materiality grounds keeps it in the Group","نعم، فالاستبعاد على أساس الحجم أو الجوهر فقط يُبقيها في المجموعة"],["Only if ZATCA approves","فقط إذا وافقت الهيئة"],["Only if it is Saudi","فقط إذا كانت سعودية"]],"a":1,"e":["Article 8(2)(b): entities excluded solely on size or materiality grounds, or because they are held for sale, are still Group members.","المادة 8 (2) (ب): الكيانات المستبعدة فقط على أساس الحجم أو الجوهر، أو لكونها محتفظاً بها لغرض البيع، تبقى أعضاء في المجموعة."],"r":["8(2)"]},{"q":["What is a Controlling Interest?","ما الحصة المسيطرة؟"],"o":[["Any holding of 50% or more of the votes","أي ملكية لـ50% أو أكثر من حقوق التصويت"],["An ownership interest that requires (or would require) line-by-line consolidation under an Acceptable Financial Accounting Standard","حصة ملكية تستوجب (أو كانت ستستوجب) التوحيد على أساس كل بند على حدة وفق المعايير المحاسبية المالية المقبولة"],["Any holding of 10% or more","أي ملكية لـ10% أو أكثر"],["A board seat","مقعد في مجلس الإدارة"]],"a":1,"e":["Article 7(1) is an accounting test: line-by-line consolidation, actual or hypothetical. A voting percentage alone does not decide it.","المادة 7 (1) اختبار محاسبي: التوحيد على أساس كل بند على حدة، فعلياً أو افتراضياً. ولا تكفي نسبة التصويت وحدها."],"r":["7(1)"]},{"q":["Which of these is NOT an Acceptable Financial Accounting Standard under Article 1?","أي مما يلي ليس من المعايير المحاسبية المالية المقبولة وفق المادة 1؟"],"o":[["IFRS","المعايير الدولية للتقرير المالي"],["US GAAP","المبادئ المحاسبية الأمريكية"],["Indian GAAP","المبادئ المحاسبية الهندية"],["Indonesian GAAP","المبادئ المحاسبية الإندونيسية"]],"a":3,"e":["Article 1 lists IFRS and the GAAP of named jurisdictions, including India and the USA. Indonesia is not on the list, so statements under its GAAP need adjusting for material competitive distortions (Art 4).","تذكر المادة 1 المعايير الدولية ومبادئ ولايات محددة منها الهند والولايات المتحدة. وإندونيسيا ليست في القائمة، فتحتاج القوائم المعدة وفق مبادئها إلى تعديلات لمنع التباينات التنافسية الجوهرية (المادة 4)."],"r":[1,"4(1)"]},{"q":["Do net investment gains count towards the €750m revenue test?","هل يُحتسب صافي المكاسب الاستثمارية ضمن اختبار إيرادات 750 مليون يورو؟"],"o":[["No, only sales of goods and services count","لا، تُحتسب مبيعات السلع والخدمات فقط"],["Yes, realised or unrealised, if in the consolidated P&L","نعم، المحققة وغير المحققة، إذا كانت في قائمة الأرباح والخسائر الموحدة"],["Only realised gains","المكاسب المحققة فقط"],["Only if they exceed 10% of sales","فقط إذا تجاوزت 10% من المبيعات"]],"a":1,"e":["Article 3(1)(b) includes net investment gains, realised or unrealised, shown in the consolidated P&L, and income or gains presented separately as extraordinary or non-recurring.","تُدرج المادة 3 (1) (ب) صافي المكاسب الاستثمارية المحققة وغير المحققة الظاهرة في قائمة الأرباح والخسائر الموحدة، والدخل أو المكاسب المعروضة كبنود استثنائية أو غير متكررة."],"r":["3(1)"]},{"q":["The consolidated P&L shows gross investment gains of €40m and gross investment losses of €55m separately. How do the losses affect revenue?","تُظهر قائمة الأرباح والخسائر الموحدة إجمالي مكاسب استثمارية 40 مليون يورو وإجمالي خسائر 55 مليوناً بشكل منفصل. كيف تؤثر الخسائر في الإيرادات؟"],"o":[["They reduce revenue by €55m","تخفض الإيرادات بـ55 مليوناً"],["They reduce revenue by €40m, the amount of the gains","تخفض الإيرادات بـ40 مليوناً، أي بمقدار المكاسب"],["They are ignored","يتم تجاهلها"],["They reduce revenue by €15m","تخفض الإيرادات بـ15 مليوناً"]],"a":1,"e":["Article 3(4): gross investment losses reduce revenue only to the extent of gross investment gains, so the reduction is capped at €40m.","المادة 3 (4): تخفض إجمالي خسائر الاستثمارات الإيرادات بحدود إجمالي المكاسب الاستثمارية فقط، فيكون التخفيض بحد أقصى 40 مليوناً."],"r":["3(4)"]},{"q":["One of the four test years was a 9-month period. What threshold applies to it?","كانت إحدى سنوات الاختبار الأربع فترة من 9 أشهر. ما الحد الذي ينطبق عليها؟"],"o":[["€750m","750 مليون يورو"],["€562.5m","562.5 مليون يورو"],["€1,000m","1,000 مليون يورو"],["The year is ignored","يتم تجاهل السنة"]],"a":1,"e":["Article 2(3) adjusts the threshold in proportion to the year's length: €750m × 9 ÷ 12 = €562.5m (in riyal terms).","تعدّل المادة 2 (3) الحد بما يتناسب مع مدة السنة: 750 مليوناً × 9 ÷ 12 = 562.5 مليون يورو (بما يوازيها بالريال)."],"r":["2(3)"]},{"q":["Which entity is the Ultimate Parent Entity?","أي كيان هو الكيان الأم النهائي؟"],"o":[["The largest company in the group by revenue","أكبر شركة في المجموعة من حيث الإيرادات"],["The entity that owns a controlling interest in another entity and is not owned with a controlling interest by another entity","الكيان الذي يملك حصة مسيطرة في كيان آخر ولا يملكه كيان آخر بحصة مسيطرة"],["The entity that files the return","الكيان الذي يقدّم الإقرار"],["The listed entity, if any","الكيان المدرج، إن وجد"]],"a":1,"e":["Article 10(1)(a). Size and listing are irrelevant; the filing entity may be a different entity.","المادة 10 (1) (أ). لا عبرة بالحجم أو الإدراج، وقد يكون الكيان المعين لتقديم الإقرار كياناً آخر."],"r":["10(1)"]},{"q":["A state fund that meets the Governmental Entity criterion of investing government assets directly controls several companies. How are they tested?","صندوق حكومي يستوفي معيار الكيان الحكومي المتمثل في استثمار أصول الحكومة يسيطر مباشرة على عدة شركات. كيف تُختبر؟"],"o":[["As one MNE group headed by the fund","كمجموعة متعددة الجنسيات واحدة يرأسها الصندوق"],["The fund is ignored; each directly controlled company is the UPE of its own group","يتم تجاهل الصندوق؛ وكل شركة يسيطر عليها مباشرة هي الكيان الأم النهائي لمجموعتها"],["All are excluded entities","جميعها كيانات مستبعدة"],["Only the largest company is tested","تُختبر أكبر شركة فقط"]],"a":1,"e":["Article 10(2): the fund is not treated as a UPE and is ignored. Its portfolio companies are not excluded entities by that fact; each heads its own group for the scope test.","المادة 10 (2): لا يُعامل الصندوق كياناً أماً نهائياً ويتم تجاهله. ولا تصب
