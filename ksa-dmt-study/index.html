بقة؛ ويُعاد احتساب السنوات السابقة."],"r":[34]},{"f":["Intragroup financing arrangement rule","قاعدة الترتيب التمويلي ضمن المجموعة"],"b":["Disallows a low-tax entity's expense where the high-tax group counterparty gets no matching taxable income.","تمنع حسم مصروف الكيان منخفض الضريبة حين لا يقابله دخل خاضع للضريبة لدى الطرف المقابل مرتفع الضريبة في المجموعة."],"r":[35]}],"terms":[{"t":["Five-year election","اختيار الخمس سنوات"],"d":["A choice that binds for the year it is made and the next four.","اختيار يُلزم لسنة إجرائه والسنوات الأربع التالية."]},{"t":["Annual election","الاختيار السنوي"],"d":["A choice made, or not, year by year.","اختيار يُجرى أو لا يُجرى سنة بسنة."]},{"t":["Functional currency","العملة الوظيفية"],"d":["The main currency an entity operates in.","العملة الرئيسية التي يعمل بها الكيان."]},{"t":["Arm's length","السعر المحايد"],"d":["The price two unrelated parties would agree.","السعر الذي يتفق عليه طرفان غير مرتبطين."]},{"t":["Qualified refundable tax credit","الائتمان الضريبي القابل للاسترداد المؤهل"],"d":["A credit paid out in cash within four years. It counts as income, not as less tax.","ائتمان يُدفع نقداً خلال أربع سنوات. ويُحتسب دخلاً، لا تخفيضاً للضريبة."]},{"t":["Realisation principle","مبدأ التحقق"],"d":["Counting a gain or loss only when the asset is sold, not as its value moves.","احتساب المكسب أو الخسارة عند بيع الأصل فقط، لا مع تغير قيمته."]},{"t":["Look-back period","فترة المراجعة"],"d":["The election year and the four years before it.","سنة الاختيار والسنوات الأربع السابقة لها."]}],"range":"25–26, 28–35"},{"id":7,"title":["DMT Income III: tax groups, sectors and allocations","دخل الضريبة (3): المجموعات الضريبية والقطاعات والتخصيص"],"goal":["Apply the sector rules (insurance, bank capital, international shipping) and allocate income between head offices, PEs and flow-through entities.","تطبيق القواعد القطاعية (التأمين، ورأس مال البنوك، والشحن الدولي) وتخصيص الدخل بين المراكز الرئيسية والمنشآت الدائمة والكيانات الشفافة مالياً."],"parts":[3],"arts":[36,37,38,39,40,41],"time":35,"metaphor":{"title":["Sorting parcels at a depot","فرز الطرود في المستودع"],"text":["By now every entity has a parcel of income. This module is the sorting depot: some parcels are opened and re-weighed (insurance and bank capital), some go straight onto a ship and leave the system (international shipping income), and some are re-addressed to the right owner: a branch's parcel goes to the branch, a transparent partnership's parcel goes to its partners.\nThe depot's rule is simple: income lands once, with the entity the law says earned it, never twice and never nowhere.","أصبح لكل كيان الآن طرد من الدخل، وهذه الوحدة هي مستودع الفرز: بعض الطرود يُفتح ويُعاد وزنه (التأمين ورأس مال البنوك)، وبعضها يُشحن مباشرة ويخرج من النظام (دخل الشحن الدولي)، وبعضها يُعاد توجيهه إلى مالكه الصحيح: فطرد الفرع يذهب إلى الفرع، وطرد الشراكة الشفافة يذهب إلى شركائها.\nوقاعدة المستودع بسيطة: يصل الدخل مرة واحدة، إلى الكيان الذي يعدّه النظام قد حققه، لا مرتين ولا إلى لا أحد."]},"anchors":[{"if":["Saudi group entities belong to the same tax consolidation group","كيانات المجموعة في المملكة ضمن مجموعة ضريبية موحدة واحدة"],"then":["Consider the five-year election to eliminate their intra-group transactions (Art 36)","فكّر في اختيار الخمس سنوات لاستبعاد معاملاتها البينية (المادة 36)"]},{"if":["A Saudi shipping company earns freight from ships in international traffic","شركة شحن في المملكة تحقق إيرادات نقل من سفن في النقل الدولي"],"then":["Exclude it, cap ancillary income at 50% of shipping income, and prove strategic or commercial management in the Kingdom (Art 39)","استبعده، واجعل الدخل المساند بحد أقصى 50% من دخل الشحن، وأثبت أن الإدارة الاستراتيجية أو التجارية في المملكة (المادة 39)"]},{"if":["A Saudi company has a branch abroad, or a foreign company a branch in the Kingdom","لشركة في المملكة فرع في الخارج، أو لشركة أجنبية فرع في المملكة"],"then":["Give the branch its own accounts' income; keep it out of the head office, except recaptured branch losses (Art 40)","اعطِ الفرع دخل حساباته الخاصة؛ وأبقِه خارج المركز الرئيسي، باستثناء خسائر الفرع المستردة (المادة 40)"]},{"if":["Income sits in a fiscally transparent partnership","الدخل في شراكة شفافة مالياً"],"then":["Allocate first to its PEs, then to its group owners that are reference entities, by ownership; a UPE or reverse hybrid keeps the rest (Art 41)","خصصه أولاً لمنشآتها الدائمة، ثم لملاكها في المجموعة الذين هم كيانات مرجعية بحسب الملكية؛ ويحتفظ الكيان الأم النهائي أو الكيان الهجين العكسي بالباقي (المادة 41)"]}],"diagrams":[{"type":"flow","title":["Where a flow-through entity's income goes","أين يذهب دخل الكيان الشفاف مالياً"],"nodes":[{"t":["1. Its PEs","1. منشآته الدائمة"],"s":["income of any PE through which it does business · Art 41(1)(a)","دخل أي منشأة دائمة يمارس عملاً من خلالها · المادة 41 (1) (أ)"]},{"t":["2. Reference-entity owners","2. الملاك من الكيانات المرجعية"],"s":["tax transparent, not the UPE: by ownership · Art 41(1)(b)","شفاف ضريبياً وليس الكيان الأم النهائي: بحسب الملكية · المادة 41 (1) (ب)"]},{"t":["3. Itself","3. الكيان نفسه"],"s":["if it is the UPE or a reverse hybrid · Art 41(1)(c)","إذا كان الكيان الأم النهائي أو كياناً هجيناً عكسياً · المادة 41 (1) (ج)"]}],"quick":true},{"type":"table","title":["International shipping: in or out?","الشحن الدولي: داخل الاحتساب أم خارجه؟"],"head":[["Income","الدخل"],["Treatment (Art 39)","المعالجة (المادة 39)"]],"rows":[[["Carrying passengers or cargo on ships it operates in international traffic","نقل الركاب أو البضائع بسفن يشغّلها في النقل الدولي"],["Excluded (international shipping income)","مستبعد (دخل الشحن الدولي)"]],[["Slot charters, fully equipped time charters, pools and joint operating agencies","استئجار المساحات، والتأجير المجهز بالكامل، والاتحادات والوكالات التشغيلية المشتركة"],["Excluded","مستبعد"]],[["Bareboat charter to another constituent entity","التأجير دون طاقم لكيان تابع آخر"],["Excluded","مستبعد"]],[["Selling a ship held for at least one year","بيع سفينة محتفظ بها سنة على الأقل"],["Excluded","مستبعد"]],[["Container leasing, short-term storage and detention charges; services to other shipping enterprises by engineers, maintenance staff, cargo handlers, catering and customer-service staff; ticket sales for the domestic leg; integral investment income; bareboat charters to third parties for up to 3 years","تأجير الحاويات وتخزينها لفترة قصيرة ورسوم الاحتجاز؛ وخدمات المهندسين وموظفي الصيانة ومناولة البضائع والتموين وخدمة العملاء لمؤسسات الشحن الأخرى؛ وبيع تذاكر المرحلة المحلية؛ ودخل الاستثمار المرتبط؛ والتأجير دون طاقم لغير الكيانات التابعة لمدة لا تتجاوز 3 سنوات"],["Excluded as ancillary income, capped at 50% of international shipping income","مستبعد كدخل مساند، بحد أقصى 50% من دخل الشحن الدولي"]],[["Transport on inland waterways within one jurisdiction","النقل عبر الممرات المائية الداخلية في ولاية واحدة"],["Stays in DMT income","يبقى ضمن الدخل"]]],"note":["The exclusion needs proof that the strategic or commercial management of all the ships is carried on in the jurisdiction where the entity is located (Art 39(9)).","يتطلب الاستبعاد إثبات أن الإدارة الاستراتيجية أو التجارية لجميع السفن تتم في الولاية التي يقع فيها الكيان (المادة 39 (9))."]}],"points":[{"h":["Tax consolidation group election","اختيار المجموعة الضريبية الموحدة"],"t":["By a five-year election, the UPE's consolidation treatment is applied to eliminate income, expenses, gains and losses on transactions between constituent entities that are all located in the Kingdom and in the same tax consolidation group. Making or revoking it must not duplicate or omit any item.","باختيار خمس سنوات، تُطبق معالجة التوحيد لدى الكيان الأم النهائي لاستبعاد الدخل والمصاريف والمكاسب والخسائر الناتجة عن المعاملات بين كيانات تابعة تقع كلها في المملكة وضمن المجموعة الضريبية الموحدة نفسها. ويجب ألا يؤدي إجراؤه أو إلغاؤه إلى ازدواج أي بند أو إغفاله."],"r":[36],"p":["Saudi entities in one tax group can strip out deals between themselves, by a five-year election.","يجوز للكيانات السعودية في مجموعة ضريبية واحدة استبعاد المعاملات فيما بينها، باختيار خمس سنوات."]},{"h":["Insurance companies","شركات التأمين"],"t":["An insurer excludes amounts charged to policyholders for taxes it pays on policyholder returns, and includes policyholder returns missing from its accounts where the matching change in the policyholder liability is in its accounts.","تستبعد شركة التأمين المبالغ المفروضة على حاملي وثائق التأمين مقابل الضرائب التي تسددها عن عوائدهم، وتُدرج عوائد حاملي الوثائق غير الظاهرة في حساباتها إذا ظهر التغير المقابل في التزامها تجاههم في حساباتها."],"r":[37],"p":["Insurers adjust for taxes and returns that belong to policyholders.","تعدّل شركات التأمين ما يخص حملة الوثائق من ضرائب وعوائد."]},{"h":["Bank and insurance capital","رأس مال البنوك والتأمين"],"t":["Distributions on Additional Tier One capital (banks) or Restricted Tier One capital (insurers) recorded in equity are treated as an expense for the issuer and as income for the holder.","تُعامل التوزيعات على الشريحة الإضافية الأولى لرأس المال (البنوك) أو الشريحة المقيدة الأولى (التأمين) المقيدة في حقوق الملكية كمصروف للمُصدر ودخل للحائز."],"r":[38],"p":["Coupons on bank and insurer capital booked in equity: expense for the issuer, income for the holder.","توزيعات رأسمال البنوك وشركات التأمين المقيدة في حقوق الملكية: مصروف للمُصدر ودخل للحائز."]},{"h":["International shipping","الشحن الدولي"],"t":["International shipping income and qualified ancillary income are excluded, and so is a net loss from them. Ancillary income across the jurisdiction is capped at 50% of international shipping income. Direct costs are deducted, indirect costs are allocated by revenue, and all of them leave the computation with the income.","يُستبعد دخل الشحن الدولي ودخل الشحن الدولي المساند المؤهل، وكذلك صافي الخسارة منهما. ويُحدّ الدخل المساند في الولاية بـ50% من دخل الشحن الدولي. وتُخصم التكاليف المباشرة، وتُوزَّع التكاليف غير المباشرة بحسب الإيرادات، وتخرج جميعها من الاحتساب مع الدخل."],"r":[39],"p":["Shipping profit leaves the computation; side income joins it, up to half the shipping income.","يخرج ربح الشحن الدولي من الاحتساب؛ ويلحق به الدخل المساند بحد أقصى نصف دخل الشحن."]},{"h":["PE income comes from the PE's accounts","دخل المنشأة الدائمة من حساباتها"],"t":["A PE's financial accounting income is what its separate accounts show. Without separate accounts, use what standalone accounts would show under the UPE's consolidation standard. For an exempt-income PE, it is the income the head office country exempts and the expenses it does not deduct.","الدخل المحاسبي للمنشأة الدائمة هو ما تُظهره حساباتها المنفصلة. وإذا لم تكن لها حسابات منفصلة، فيُستخدم ما كانت ستُظهره حسابات مستقلة وفق معيار التوحيد لدى الكيان الأم النهائي. وللمنشأة ذات الدخل المعفى، هو الدخل الذي تعفيه دولة المركز الرئيسي والمصاريف التي لا تحسمها."],"r":["40(1)","40(2)","40(4)"],"p":["A branch's income is what its own accounts show.","دخل الفرع هو ما تظهره حساباته الخاصة."]},{"h":["Branch losses and recapture","خسائر الفرع واستردادها"],"t":["A PE's income is kept out of its head office. But a PE's DMT Loss is treated as the head office's expense to the extent the head office deducts it for tax and it is not set against income taxed in both countries. Later PE income is then treated as the head office's, up to that loss.","يبقى دخل المنشأة الدائمة خارج مركزها الرئيسي. لكن خسارة المنشأة تُعامل كمصروف للمركز الرئيسي بقدر ما يحسمها ضريبياً ولا تُقابَل بدخل خاضع للضريبة في الدولتين. ثم يُعامل دخل المنشأة اللاحق كدخل للمركز الرئيسي حتى مبلغ تلك الخسارة."],"r":["40(5)","40(6)"],"p":["A branch loss the head office deducts is its expense; later branch profit comes back, up to that loss.","خسارة الفرع التي يحسمها المركز الرئيسي مصروف له؛ ويعود إليه ربح الفرع اللاحق بقدر تلك الخسارة."]},{"h":["Flow-through entities","الكيانات الشفافة مالياً"],"t":["A flow-through entity's accounting income goes first to any PE through which it operates; the rest of a tax transparent entity's income goes to its group owners that are reference entities, by ownership interest. If it is the UPE or a reverse hybrid, it keeps the rest itself.","يُخصص الدخل المحاسبي للكيان الشفاف مالياً أولاً لأي منشأة دائمة يعمل من خلالها؛ ويُخصص باقي دخل الكيان الشفاف ضريبياً لملاكه في المجموعة الذين هم كيانات مرجعية بحسب حصص ملكيتهم. وإذا كان الكيان الأم النهائي أو كياناً هجيناً عكسياً، احتفظ بالباقي لنفسه."],"r":["41(1)"],"p":["A transparent entity's income goes to its branches first, then to its group owners.","يذهب دخل الكيان الشفاف إلى منشآته الدائمة أولاً، ثم إلى ملاكه في المجموعة."]},{"h":["Reverse hybrids","الكيانات الهجينة العكسية"],"t":["A flow-through entity is a reverse hybrid to the extent the reference entity's jurisdiction does not treat it (and each entity in between) as fiscally transparent: the owner's country does not tax the income, so the entity keeps it.","يُعد الكيان الشفاف مالياً كياناً هجيناً عكسياً بقدر ما لا تعامله ولاية الكيان المرجعي (وكل كيان وسيط) بوصفه شفافاً مالياً: فدولة المالك لا تفرض الضريبة على الدخل، فيبقى لدى الكيان."],"r":["41(2)"],"p":["If the owner's country does not see through it, the entity keeps the income itself.","إذا لم تعامله دولة المالك كشفاف، احتفظ الكيان بالدخل لنفسه."]}],"oecd":[{"t":["The tax consolidation, insurance, Additional Tier One and international shipping rules follow GloBE Articles 3.2.8 to 3.3. The PE and flow-through allocation rules follow Articles 3.4 and 3.5.","تتبع قواعد التوحيد الضريبي والتأمين والشريحة الإضافية الأولى والشحن الدولي المواد من 3.2.8 إلى 3.3 من القواعد النموذجية. وتتبع قواعد تخصيص دخل المنشأة الدائمة والكيان الشفاف المادتين 3.4 و3.5."],"src":["Model Rules Arts 3.2.8–3.5","القواعد النموذجية: المواد 3.2.8–3.5"]},{"t":["KSA angle: the Income Tax Law computes each capital company's tax base separately, even when its accounts are consolidated (Art 6(e)). The Zakat Implementing Regulations 2024 (Art 16) do allow a consolidated Zakat declaration for a holding company and its fully owned subsidiaries. Whether that counts as a 'tax consolidation group' for Article 36 is not settled by the draft law; watch the Regulations.","من منظور المملكة: يحتسب نظام ضريبة الدخل وعاء كل شركة أموال بشكل مستقل حتى لو كانت حساباتها موحدة (المادة 6 (هـ)). وتسمح اللائحة التنفيذية لجباية الزكاة لعام 2024م (المادة 16) بتقديم إقرار زكوي موحد للشركة القابضة وشركاتها التابعة المملوكة بالكامل. أما هل يُعد ذلك «مجموعة ضريبية موحدة» لأغراض المادة 36 فلم يحسمه مشروع النظام؛ فراقب اللائحة."],"src":["Income Tax Law Art 6(e); Zakat Regulations 2024 Art 16","نظام ضريبة الدخل م 6 (هـ)؛ اللائحة التنفيذية لجباية الزكاة 2024م م 16"]}],"cases":[{"t":["A Saudi shipping line and the 50% cap","خط شحن سعودي وحد 50%"],"facts":["Red Sea Lines (Saudi) operates container ships in international traffic and manages them strategically and commercially from Jeddah. FY2027 net figures after allocating costs:\n• International shipping income: SAR 80m\n• Qualified ancillary income (container leasing, storage, detention charges): SAR 50m\n• Rent from an office building it owns in Jeddah: SAR 5m","تشغّل شركة خطوط البحر الأحمر (سعودية) سفن حاويات في النقل الدولي وتديرها استراتيجياً وتجارياً من جدة. الأرقام الصافية للسنة المالية 2027م بعد توزيع التكاليف:\n• دخل الشحن الدولي: 80 مليون ريال\n• دخل الشحن المساند المؤهل (تأجير الحاويات وتخزينها ورسوم الاحتجاز): 50 مليون ريال\n• إيجار مبنى مكاتب تملكه في جدة: 5 ملايين ريال"],"steps":[{"t":["Management test: strategic and commercial management is in the Kingdom, so the exclusion is available.","اختبار الإدارة: الإدارة الاستراتيجية والتجارية في المملكة، فالاستبعاد متاح."]},{"t":["Cap on ancillary income: 50% of international shipping income.","حد الدخل المساند: 50% من دخل الشحن الدولي."],"x":"80000000*50/100","v":40000000,"u":"SAR"},{"t":["Total excluded: shipping income plus capped ancillary income.","إجمالي المستبعد: دخل الشحن مع الدخل المساند المحدود."],"x":"80000000+40000000","v":120000000,"u":"SAR"},{"t":["Stays in DMT income: ancillary income above the cap plus the office rent, which is not shipping income at all.","يبقى في الدخل: الدخل المساند الزائد عن الحد مع إيجار المكاتب، وهو ليس دخل شحن أصلاً."],"x":"(50000000-40000000)+5000000","v":15000000,"u":"SAR"}],"ans":["SAR 120m is excluded and SAR 15m stays in DMT income (SAR 10m of ancillary income above the cap and SAR 5m of rent). The 50% cap is tested for all Saudi constituent entities together, so a group with several shipping entities pools them for the cap.","يُستبعد 120 مليون ريال ويبقى 15 مليون ريال في الدخل (10 ملايين من الدخل المساند الزائد عن الحد و5 ملايين من الإيجار). ويُختبر حد 50% لجميع الكيانات التابعة في المملكة مجتمعة، فالمجموعة التي لديها عدة كيانات شحن تجمعها لأغراض الحد."],"r":["39(1)","39(3)","39(5)","39(9)"],"p":["SAR 120m leaves the computation; SAR 15m stays: ancillary income above the cap, and the rent.","يخرج 120 مليون ريال من الاحتساب؛ ويبقى 15 مليوناً: الدخل المساند فوق الحد، والإيجار."],"diagrams":[{"type":"bars","at":"answer","title":["Where each riyal goes","أين يذهب كل ريال"],"u":"SAR","items":[{"l":["Out: shipping income","يخرج: دخل الشحن الدولي"],"v":80000000},{"l":["Out: ancillary income within the cap","يخرج: الدخل المساند ضمن الحد"],"v":40000000},{"l":["Stays in: ancillary income above the cap","يبقى: الدخل المساند فوق الحد"],"v":10000000,"tone":"g"},{"l":["Stays in: office rent","يبقى: إيجار المكاتب"],"v":5000000,"tone":"g"}],"note":["The cap is half of the SAR 80m shipping income: SAR 40m.","الحد نصف دخل الشحن البالغ 80 مليون ريال: 40 مليوناً."]}]},{"t":["A branch loss that comes home, then goes back","خسارة فرع تعود إلى الوطن ثم ترجع"],"facts":["Arabian Engineering (Saudi head office) has a branch in Country P that is a PE. Assume the branch's loss is deductible in the head office's Saudi taxable income and is not set against income taxed in both countries.\n• FY2027: branch DMT Loss SAR 5m\n• FY2028: branch DMT Income SAR 8m","لشركة الهندسة العربية (مركز رئيسي في المملكة) فرع في الدولة (ف) يُعد منشأة دائمة. افترض أن خسارة الفرع قابلة للحسم من الدخل الخاضع للضريبة للمركز الرئيسي في المملكة ولا تُقابَل بدخل خاضع للضريبة في الدولتين.\n• 2027م: خسارة الفرع 5 ملايين ريال\n• 2028م: دخل الفرع 8 ملايين ريال"],"steps":[{"t":["FY2027: the SAR 5m branch loss is treated as the Saudi head office's expense, not the branch's.","2027م: تُعامل خسارة الفرع البالغة 5 ملايين ريال كمصروف للمركز الرئيسي في المملكة لا للفرع."],"v":5000000,"u":"SAR"},{"t":["FY2028: branch income up to the earlier loss is treated as the head office's income (recapture).","2028م: يُعامل دخل الفرع حتى مبلغ الخسارة السابقة كدخل للمركز الرئيسي (استرداد)."],"x":"min(8000000,5000000)","v":5000000,"u":"SAR"},{"t":["The rest of FY2028's branch income stays with the branch, in Country P:","يبقى باقي دخل الفرع لعام 2028م لدى الفرع في الدولة (ف):"],"x":"8000000-5000000","v":3000000,"u":"SAR"}],"ans":["The loss used in the Kingdom in FY2027 is clawed back into the Kingdom's DMT income in FY2028 (SAR 5m); only SAR 3m is the branch's own income in Country P. This keeps the Kingdom's ETR from benefiting twice from the same branch loss.","تُسترد الخسارة المستخدمة في المملكة في 2027م إلى دخل المملكة في 2028م (5 ملايين ريال)، ولا يبقى دخلاً خاصاً بالفرع في الدولة (ف) إلا 3 ملايين ريال. وهذا يمنع معدل المملكة الفعلي من الاستفادة مرتين من خسارة الفرع نفسها."],"r":["40(5)","40(6)"],"p":["FY2027: the SAR 5m loss is the head office's. FY2028: SAR 5m comes back; the branch keeps SAR 3m.","2027م: خسارة 5 ملايين ريال للمركز الرئيسي. 2028م: يعود إليه 5 ملايين؛ ويبقى للفرع 3 ملايين."],"diagrams":[{"type":"org","at":"facts","title":["Head office and branch","المركز الرئيسي والفرع"],"nodes":[{"id":"h","t":["Arabian Engineering","الهندسة العربية"],"s":["Saudi head office","مركز رئيسي في المملكة"],"tone":"in"},{"id":"b","t":["Branch in Country P","الفرع في الدولة (ف)"],"s":["a PE","منشأة دائمة"]}],"edges":[{"f":"h","to":"b"}]},{"type":"table","at":"answer","title":["Who takes the result","لمن تُنسب النتيجة"],"head":[["Year","السنة"],["Branch result","نتيجة الفرع"],["Saudi head office","المركز الرئيسي في المملكة"],["Branch, Country P","الفرع في الدولة (ف)"]],"rows":[[["FY2027","2027م"],["loss SAR 5m","خسارة 5 ملايين"],["SAR 5m expense","مصروف 5 ملايين"],["nil","صفر"]],[["FY2028","2028م"],["income SAR 8m","دخل 8 ملايين"],["SAR 5m recaptured","استرداد 5 ملايين"],["SAR 3m","3 ملايين"]]]}]},{"t":["Splitting a transparent partnership's profit","تقسيم ربح شراكة شفافة"],"facts":["A partnership that the Kingdom treats as fiscally transparent is owned 60% by Saudi group company A and 40% by Saudi group company B. It is not the UPE, and A and B are reference entities. FY2027 accounting profit: SAR 10m, of which SAR 2m is earned through its PE in the UAE.","شراكة تعاملها المملكة بوصفها شفافة مالياً، تملك شركة المجموعة السعودية (أ) 60% منها وشركة المجموعة السعودية (ب) 40%. وليست الكيان الأم النهائي، و(أ) و(ب) كيانان مرجعيان. الربح المحاسبي للسنة المالية 2027م: 10 ملايين ريال، منها مليونا ريال تحققت عبر منشأتها الدائمة في الإمارات."],"steps":[{"t":["First, the UAE PE takes its own income.","أولاً، تأخذ المنشأة الدائمة في الإمارات دخلها."],"v":2000000,"u":"SAR"},{"t":["Remaining income to allocate to the owners:","الدخل المتبقي للتخصيص على الملاك:"],"x":"10000000-2000000","v":8000000,"u":"SAR"},{"t":["A's share (60%):","حصة (أ) (60%):"],"x":"8000000*60/100","v":4800000,"u":"SAR"},{"t":["B's share (40%):","حصة (ب) (40%):"],"x":"8000000*40/100","v":3200000,"u":"SAR"}],"ans":["The UAE PE has SAR 2m, A SAR 4.8m and B SAR 3.2m; the partnership itself keeps nothing. Had the partnership been the UPE, or a reverse hybrid because the owners' country did not see through it, it would have kept the SAR 8m itself.","للمنشأة الدائمة في الإمارات مليونا ريال، ولـ(أ) 4.8 ملايين ريال، ولـ(ب) 3.2 ملايين ريال، ولا يبقى للشراكة شيء. ولو كانت الشراكة الكيان الأم النهائي، أو كياناً هجيناً عكسياً لأن دولة الملاك لا تعاملها بشفافية، لاحتفظت بالثمانية ملايين لنفسها."],"r":["41(1)","41(2)"],"p":["The UAE PE takes SAR 2m first; A gets SAR 4.8m and B SAR 3.2m; the partnership keeps nothing.","تأخذ المنشأة الدائمة في الإمارات مليوني ريال أولاً؛ وتحصل (أ) على 4.8 مليون و(ب) على 3.2 مليون؛ ولا يبقى للشراكة شيء."],"diagrams":[{"type":"org","at":"answer","title":["Where the SAR 10m goes","أين تذهب الـ10 ملايين ريال"],"nodes":[{"id":"p","t":["Transparent partnership","الشراكة الشفافة"],"s":["profit SAR 10m; keeps nil","ربح 10 ملايين؛ يبقى لها صفر"]},{"id":"u","t":["UAE PE","المنشأة الدائمة في الإمارات"],"s":["SAR 2m","مليونا ريال"]},{"id":"a","t":["Company A","الشركة (أ)"],"s":["SAR 4.8m","4.8 مليون ريال"],"tone":"in"},{"id":"b","t":["Company B","الشركة (ب)"],"s":["SAR 3.2m","3.2 مليون ريال"],"tone":"in"}],"edges":[{"f":"p","to":"u","l":["first, its own income","أولاً، دخلها الخاص"]},{"f":"p","to":"a","l":["60% of the rest","60% من الباقي"]},{"f":"p","to":"b","l":["40% of the rest","40% من الباقي"]}]}]}],"quiz":[{"q":["When can the tax consolidation group election eliminate intra-group transactions?","متى يمكن لاختيار المجموعة الضريبية الموحدة استبعاد المعاملات البينية؟"],"o":[["Where the entities are in the same tax consolidation group, in any country","حين تكون الكيانات في المجموعة الضريبية الموحدة نفسها، في أي دولة"],["Where all the entities are located in the Kingdom, whatever their tax grouping","حين تقع جميع الكيانات في المملكة، أياً كان تجميعها الضريبي"],["Always, for all group entities in any country, whatever their tax grouping","دائماً، لجميع كيانات المجموعة في أي دولة، أياً كان تجميعها الضريبي"],["Where all are located in the Kingdom and in the same tax consolidation group","حين تقع جميعها في المملكة وضمن المجموعة الضريبية الموحدة نفسها"]],"a":3,"e":["Article 36(1). It is a five-year election, and making or revoking it must not duplicate or omit items (Art 36(2)).","المادة 36 (1). وهو اختيار خمس سنوات، ويجب ألا يؤدي إجراؤه أو إلغاؤه إلى ازدواج البنود أو إغفالها (المادة 36 (2))."],"r":[36]},{"q":["An insurer charges policyholders for taxes it pays on their returns. How are those charges treated?","تفرض شركة تأمين على حاملي الوثائق مبالغ مقابل الضرائب التي تسددها عن عوائدهم. كيف تُعامل هذه المبالغ؟"],"o":[["Included in the insurer's DMT income as revenue","تُدرج في دخل شركة التأمين كإيرادات"],["Excluded from the insurer's DMT income","تُستبعد من دخل شركة التأمين"],["Treated as covered taxes of the insurer","تُعامل كضرائب مشمولة لشركة التأمين"],["Included, but only above the riyal equivalent of €1m","تُدرج، ولكن فقط فيما يزيد على ما يوازي مليون يورو"]],"a":1,"e":["Article 37(1): amounts charged to policyholders for taxes on their returns are excluded, just as those taxes are not covered taxes (Art 42(2)(d)).","المادة 37 (1): تُستبعد المبالغ المحمّلة على حملة الوثائق مقابل الضرائب على عوائدهم، كما أن هذه الضرائب ليست ضرائب مشمولة (المادة 42 (2) (د))."],"r":["37"]},{"q":["A bank pays a distribution on Additional Tier One capital recorded as a reduction of equity. What is the DMT treatment for the bank?","يدفع بنك توزيعات على الشريحة الإضافية الأولى لرأس المال مقيدة كتخفيض لحقوق الملكية. ما المعالجة لأغراض النظام لدى البنك؟"],"o":[["Ignored, because it is recorded in equity, not profit","تُتجاهل، لأنها مقيدة في حقوق الملكية لا في الأرباح"],["Treated as an excluded dividend paid by the bank","تُعامل كتوزيعات أرباح مستبعدة يدفعها البنك"],["Treated as an addition to the bank's covered taxes","تُعامل كإضافة إلى الضرائب المشمولة للبنك"],["Treated as an expense in the bank's DMT income","تُعامل كمصروف في دخل البنك"]],"a":3,"e":["Article 38(1). The holder includes the matching receipt as income (Art 38(2)).","المادة 38 (1). ويُدرج الحائز المبلغ المقابل المستلم كدخل (المادة 38 (2))."],"r":[38]},{"q":["Which income stays IN DMT income for a shipping company?","أي دخل يبقى داخل الاحتساب لشركة الشحن؟"],"o":[["Freight from ships it operates in international traffic","أجور الشحن من السفن التي تشغلها في النقل الدولي"],["A gain on selling a ship held for use for three years","مكسب بيع سفينة احتُفظ بها للاستخدام ثلاث سنوات"],["Transport on inland waterways within the same jurisdiction","النقل عبر الممرات المائية الداخلية في الولاية نفسها"],["Slot-charter income from international voyages","دخل استئجار المساحات على الرحلات الدولية"]],"a":2,"e":["Article 39(3) excludes inland waterway transport within the same jurisdiction from international shipping income.","تستثني المادة 39 (3) النقل عبر الممرات المائية الداخلية في الولاية نفسها من دخل الشحن الدولي."],"r":["39(3)"]},{"q":["What is the cap on qualified ancillary international shipping income?","ما الحد الأقصى لدخل الشحن الدولي المساند المؤهل؟"],"o":[["25% of the international shipping income of each entity separately","25% من دخل الشحن الدولي لكل كيان على حدة"],["50% of the total revenue of all entities in the jurisdiction","50% من إجمالي إيرادات جميع الكيانات في الولاية"],["50% of the international shipping income of each constituent entity, separately","50% من دخل الشحن الدولي لكل كيان تابع، كلٌّ على حدة"],["50% of the international shipping income of all entities in the jurisdiction","50% من دخل الشحن الدولي لجميع الكيانات في الولاية"]],"a":3,"e":["Article 39(5): the cap is tested for all the constituent entities in the jurisdiction together, at 50% of their international shipping income.","المادة 39 (5): يُختبر الحد لجميع الكيانات التابعة في الولاية مجتمعة، بنسبة 50% من دخل الشحن الدولي."],"r":["39(5)"]},{"q":["What must a shipping company show to use the exclusion?","ماذا يجب أن تُثبت شركة الشحن للاستفادة من الاستبعاد؟"],"o":[["Strategic or commercial management of all its ships is carried on in its jurisdiction","تتم الإدارة الاستراتيجية أو التجارية لجميع سفنها من داخل ولايتها"],["Its ships fly the Saudi flag and are registered in a Saudi port","ترفع سفنها العلم السعودي ومسجلة في ميناء سعودي"],["Most of its crew are employed through an entity in its jurisdiction","يُوظَّف معظم طاقمها عبر كيان في ولايتها"],["Strategic or commercial management of at least half of its ships is carried on in its jurisdiction","تتم الإدارة الاستراتيجية أو التجارية لنصف سفنها على الأقل من داخل ولايتها"]],"a":0,"e":["Article 39(9): the strategic or commercial management of all the ships must be carried on from within the jurisdiction. Flag and crew do not decide it.","المادة 39 (9): يجب أن تتم الإدارة الاستراتيجية أو التجارية لجميع السفن من داخل الولاية. ولا يحسم ذلك العلم ولا الطاقم."],"r":["39(9)"]},{"q":["A ship used in international traffic is sold after eight months. Is the gain international shipping income?","بيعت سفينة مستخدمة في النقل الدولي بعد ثمانية أشهر. هل المكسب دخل شحن دولي؟"],"o":[["Yes: any gain on a ship used in international traffic qualifies","نعم: فأي مكسب على سفينة مستخدمة في النقل الدولي يؤهل"],["No: a ship sale counts only if the ship was held for use for at least one year","لا: لا يُحتسب بيع السفينة إلا إذا احتُفظ بها للاستخدام سنة على الأقل"],["No: a ship sale counts only if the ship was held for use for at least three years","لا: لا يُحتسب بيع السفينة إلا إذا احتُفظ بها للاستخدام ثلاث سنوات على الأقل"],["Yes, provided the buyer is a group entity in the same jurisdiction","نعم، شريطة أن يكون المشتري كياناً في المجموعة في الولاية نفسها"]],"a":1,"e":["Article 39(2)(f): a gain on selling a ship counts only if the ship was held for use for at least one year.","المادة 39 (2) (و): لا يُحتسب مكسب بيع السفينة إلا إذا احتُفظ بها للاستخدام سنة على الأقل."],"r":["39(2)"]},{"q":["A Saudi branch of a foreign company has no separate accounts. What is its accounting income?","لا توجد حسابات منفصلة لفرع شركة أجنبية في المملكة. ما دخله المحاسبي؟"],"o":[["What standalone accounts would show under Saudi local accounting standards","ما كانت ستُظهره حسابات مستقلة وفق المعايير المحاسبية المحلية في المملكة"],["Its share of group revenue, multiplied by the group's profit margin","حصته من إيرادات المجموعة مضروبة في هامش ربح المجموعة"],["What standalone accounts would show under the UPE's consolidation standard","ما كانت ستُظهره حسابات مستقلة وفق معيار التوحيد لدى الكيان الأم النهائي"],["Its Saudi taxable income as shown in its income tax return","دخله الخاضع للضريبة في المملكة كما يظهر في إقراره الضريبي"]],"a":2,"e":["Article 40(2). The Regulations can set further adjustments (Art 40(3)).","المادة 40 (2). ويجوز للائحة تحديد تعديلات إضافية (المادة 40 (3))."],"r":["40(2)"]},{"q":["Is a PE's income included in its head office's DMT income?","هل يُدرج دخل المنشأة الدائمة في دخل مركزها الرئيسي؟"],"o":[["No, except for the recapture of PE losses that the head office used","لا، باستثناء استرداد خسائر المنشأة التي استخدمها المركز الرئيسي"],["Yes, because the PE and its head office are the same legal person","نعم، لأن المنشأة ومركزها الرئيسي شخص قانوني واحد"],["No, and PE losses never affect the head office's DMT income either","لا، ولا تؤثر خسائر المنشأة في دخل المركز الرئيسي أبداً"],["Yes, if the PE is in a country that taxes branch profits","نعم، إذا كانت المنشأة في دولة تفرض الضريبة على أرباح الفروع"]],"a":0,"e":["Article 40(5) and (6): PE income stays out of the head office, except that later PE income comes back to the extent the head office used the PE's losses.","المادة 40 (5) و(6): يبقى دخل المنشأة الدائمة خارج دخل المركز الرئيسي، إلا أن دخلها اللاحق يعود إليه بقدر ما استخدم من خسائرها."],"r":["40(5)","40(6)"]},{"q":["A transparent partnership (not the UPE) has income after allocating to its PEs. Who gets it?","شراكة شفافة (ليست الكيان الأم النهائي) لديها دخل بعد التخصيص لمنشآتها. لمن يذهب؟"],"o":[["The partnership keeps it, as a stateless constituent entity","تحتفظ به الشراكة، بصفتها كياناً تابعاً عديم الجنسية"],["All its owners, including third-party investors, by ownership interest","جميع ملاكها، بمن فيهم المستثمرون من خارج المجموعة، بحسب حصص الملكية"],["Its group owners that are reference entities, by ownership interest","ملاكها في المجموعة الذين هم كيانات مرجعية، بحسب حصص ملكيتهم"],["Its group owners in equal shares, not by ownership interest","ملاكها في المجموعة بالتساوي، لا بحسب حصص الملكية"]],"a":2,"e":["Article 41(1)(b): after its PEs take their share, a tax transparent entity's income goes to its group owners that are reference entities, in proportion to their ownership interests.","المادة 41 (1) (ب): بعد أن تأخذ المنشآت الدائمة حصتها، يذهب دخل الكيان الشفاف ضريبياً إلى ملاكه في المجموعة الذين هم كيانات مرجعية، بنسبة حصص ملكيتهم."],"r":["41(1)"]},{"q":["When does a flow-through entity keep its remaining income itself?","متى يحتفظ الكيان الشفاف مالياً بدخله المتبقي لنفسه؟"],"o":[["When it is located in the Kingdom","عندما يكون موجوداً في المملكة العربية السعودية"],["When it is the UPE or a reverse hybrid","عندما يكون هو الكيان الأم النهائي أو هجيناً عكسياً"],["When all its group owners are reference entities","عندما يكون جميع ملاكه في المجموعة كيانات مرجعية"],["When it has a PE in another jurisdiction","عندما تكون له منشأة دائمة في ولاية أخرى"]],"a":1,"e":["Article 41(1)(c) and (2): a flow-through entity keeps the rest of its income only if it is the UPE or a reverse hybrid.","المادة 41 (1) (ج) و(2): لا يحتفظ الكيان الشفاف ببقية دخله إلا إذا كان الكيان الأم النهائي أو كياناً هجيناً عكسياً."],"r":["41(1)","41(2)"]},{"q":["What makes a flow-through entity a reverse hybrid?","ما الذي يجعل الكيان الشفاف مالياً كياناً هجيناً عكسياً؟"],"o":[["Its owner's country does not treat it, or any entity in between, as transparent","لا تعامله دولة مالكه، ولا أي كيان وسيط، بوصفه شفافاً"],["Every country concerned treats it as fiscally transparent","تعامله كل الدول المعنية بوصفه شفافاً مالياً"],["Its own country taxes it as a company on all of its income","تفرض عليه دولته الضريبة كشركة على كامل دخله"],["Its owner's country treats it as transparent, but its own country does not","تعامله دولة مالكه بوصفه شفافاً، بينما لا تعامله دولته كذلك"]],"a":0,"e":["Article 41(2): it is a reverse hybrid to the extent the reference entity's jurisdiction does not see through it (or any entity in between), so the owner is not taxed on the income.","المادة 41 (2): يكون كياناً هجيناً عكسياً بقدر ما لا تعامله ولاية الكيان المرجعي (ولا أي كيان وسيط) كشفاف، فلا يخضع المالك للضريبة على الدخل."],"r":["41(2)"]}],"cards":[{"f":["Tax consolidation group election","اختيار المجموعة الضريبية الموحدة"],"b":["Five-year: eliminate transactions between Saudi entities in the same tax consolidation group.","خمس سنوات: استبعاد المعاملات بين الكيانات في المملكة ضمن المجموعة الضريبية الموحدة نفسها."],"r":[36]},{"f":["Insurance: policyholder taxes","التأمين: ضرائب حاملي الوثائق"],"b":["Exclude amounts charged to policyholders for taxes on their returns; include missing policyholder returns.","تُستبعد المبالغ المفروضة على حاملي الوثائق مقابل ضرائب عوائدهم؛ وتُدرج عوائدهم غير الظاهرة."],"r":[37]},{"f":["AT1 and RT1 distributions","توزيعات الشريحة الإضافية والمقيدة الأولى"],"b":["Expense for the issuer, income for the holder, even though booked in equity.","مصروف للمُصدر ودخل للحائز، رغم قيدها في حقوق الملكية."],"r":[38]},{"f":["International shipping income","دخل الشحن الدولي"],"b":["Excluded (losses too), if strategic or commercial management is in the entity's jurisdiction.","مستبعد (وكذلك الخسائر)، إذا كانت الإدارة الاستراتيجية أو التجارية في ولاية الكيان."],"r":[39]},{"f":["Ancillary shipping income cap","حد دخل الشحن المساند"],"b":["50% of the jurisdiction's international shipping income.","50% من دخل الشحن الدولي في الولاية."],"r":["39(5)"]},{"f":["Shipping costs","تكاليف الشحن"],"b":["Direct costs deducted, indirect costs allocated by revenue; all excluded with the income.","تُخصم التكاليف المباشرة، وتُوزَّع غير المباشرة بحسب الإيرادات؛ وتُستبعد جميعها مع الدخل."],"r":["39(6)","39(7)","39(8)"]},{"f":["PE income source","مصدر دخل المنشأة الدائمة"],"b":["Its separate accounts; otherwise standalone accounts under the UPE's consolidation standard.","حساباتها المنفصلة؛ وإلا فحسابات مستقلة وفق معيار التوحيد لدى الكيان الأم النهائي."],"r":["40(1)","40(2)"]},{"f":["Exempt-income PE","المنشأة الدائمة ذات الدخل المعفى"],"b":["Income the head office country exempts, less expenses it does not deduct.","الدخل الذي تعفيه دولة المركز الرئيسي ناقص المصاريف التي لا تحسمها."],"r":["40(4)"]},{"f":["PE loss used by head office","خسارة المنشأة التي استخدمها المركز الرئيسي"],"b":["Treated as head office expense; later PE income up to that loss is recaptured as head office income.","تُعامل كمصروف للمركز الرئيسي؛ ويُسترد لاحقاً دخل المنشأة حتى مبلغ تلك الخسارة كدخل للمركز الرئيسي."],"r":["40(6)"]},{"f":["Flow-through allocation order","ترتيب تخصيص دخل الكيان الشفاف"],"b":["PEs first, then reference-entity owners by ownership; UPE or reverse hybrid keeps the rest.","المنشآت الدائمة أولاً، ثم الملاك من الكيانات المرجعية بحسب الملكية؛ ويحتفظ الكيان الأم النهائي أو الهجين العكسي بالباقي."],"r":["41(1)"]},{"f":["Reverse hybrid","الكيان الهجين العكسي"],"b":["Transparent where created, but not treated as transparent by the reference entity's jurisdiction.","شفاف حيث أُنشئ، لكن ولاية الكيان المرجعي لا تعامله بوصفه شفافاً."],"r":["41(2)"]},{"f":["Reference Entity","الكيان المرجعي"],"b":["The closest group owner in the chain that is not a flow-through entity (or a flow-through UPE).","أقرب مالك في المجموعة ضمن سلسلة الملكية لا يكون كياناً شفافاً مالياً (أو كيان أم نهائي شفاف)."],"r":[1]}],"terms":[{"t":["Tax consolidation group","المجموعة الضريبية الموحدة"],"d":["Saudi entities that file together as one tax group.","كيانات سعودية تقدّم إقرارها معاً كمجموعة ضريبية واحدة."]},{"t":["Additional Tier One capital","الشريحة الإضافية الأولى لرأس المال"],"d":["Bank capital that sits in equity but pays interest-like distributions.","رأسمال بنكي يُقيد في حقوق الملكية لكنه يدفع توزيعات تشبه الفوائد."]},{"t":["International shipping income","دخل الشحن الدولي"],"d":["Profit from carrying passengers or cargo by ship between countries.","ربح نقل الركاب أو البضائع بالسفن بين الدول."]},{"t":["Qualified ancillary income","دخل الشحن المساند المؤهل"],"d":["Side income tied to shipping, such as container leasing; capped at half the shipping income.","دخل جانبي مرتبط بالشحن، مثل تأجير الحاويات؛ بحد أقصى نصف دخل الشحن."]},{"t":["Recapture","الاسترداد"],"d":["Pulling later branch profit back to the head office, up to a branch loss it used.","إعادة ربح الفرع اللاحق إلى المركز الرئيسي، بقدر خسارة الفرع التي استخدمها."]},{"t":["Tax transparent entity","الكيان الشفاف ضريبياً"],"d":["An entity whose owners, not the entity, are taxed on its income.","كيان يخضع ملاكه، لا هو، للضريبة على دخله."]},{"t":["Reverse hybrid","الكيان الهجين العكسي"],"d":["Transparent at home, but its owner's country does not see through it, so it keeps its income.","شفاف في دولته، لكن دولة مالكه لا تعامله كشفاف، فيحتفظ بدخله."]}],"range":"36–41"},{"id":8,"title":["Covered taxes: what counts, Zakat included","الضرائب المشمولة: ما يُحتسب، والزكاة منها"],"goal":["Identify covered taxes (Zakat included), build Adjusted Covered Taxes from the current tax line, and deal with refunds, unpaid taxes and negative tax expense.","تحديد الضرائب المشمولة (ومنها الزكاة)، وبناء الضرائب المشمولة المعدلة من بند الضريبة الحالية، ومعالجة الاستردادات والضرائب غير المسددة والمصروف الضريبي السالب."],"parts":[4],"arts":[42,43,44,45,46,47,48,52],"time":35,"metaphor":{"title":["The numerator's guest list","قائمة ضيوف البسط"],"text":["The ETR is a fraction. Modules 5 to 7 built the bottom line (DMT income); this module builds the top line. Think of covered taxes as a guest list at the door: income taxes, taxes charged instead of income tax, and taxes on retained earnings and equity. Zakat is named on the list.\nSome people are turned away at the door: top-up taxes themselves, an insurer's tax on its policyholders' returns, disputed amounts, and tax that will not really be paid within three years. Every guest is counted once, in the year they belong.","معدل الضريبة الفعلي كسرٌ. بنت الوحدات من 5 إلى 7 المقام (الدخل)، وهذه الوحدة تبني البسط. تخيّل الضرائب المشمولة قائمة ضيوف عند الباب: ضرائب الدخل، والضرائب المفروضة بدلاً من ضريبة الدخل، والضرائب على الأرباح المحتجزة وحقوق الملكية، والزكاة مذكورة بالاسم في القائمة.\nويُردّ بعضهم عند الباب: الضرائب التكميلية نفسها، وضريبة شركة التأمين على عوائد حاملي وثائقها، والمبالغ المتنازع عليها، والضريبة التي لن تُسدد فعلاً خلال ثلاث سنوات. ويُعدّ كل ضيف مرة واحدة، في السنة التي ينتمي إليها."]},"anchors":[{"if":["A Saudi company books Zakat","شركة في المملكة تقيّد الزكاة"],"then":["Count it as a covered tax and add it back in DMT income as part of net taxes expense (Arts 42(1)(c), 19(1)(a))","احسبها ضريبة مشمولة وأعدها إلى الدخل ضمن صافي مصروف الضرائب (المادتان 42 (1) (ج) و19 (1) (أ))"]},{"if":["The tax charge includes a provision for a ZATCA dispute","يتضمن مصروف الضريبة مخصصاً لنزاع مع الهيئة"],"then":["Take it out now as an uncertain tax position; put it back in the year it is paid (Arts 46(1)(d), 45(1)(b))","استبعده الآن كمركز ضريبي غير مؤكد، وأعده في سنة سداده (المادتان 46 (1) (د) و45 (1) (ب))"]},{"if":["Tax relates to income already excluded from DMT income","الضريبة تتعلق بدخل مستبعد أصلاً من الدخل"],"then":["Remove that tax too: numerator and denominator must match (Art 46(1)(a))","استبعد تلك الضريبة أيضاً، فالبسط والمقام يجب أن يتطابقا (المادة 46 (1) (أ))"]},{"if":["ZATCA refunds or reduces a prior year's tax","الهيئة تردّ أو تخفض ضريبة سنة سابقة"],"then":["Recalculate that year's ETR and top-up, unless the decrease is under €1m and the annual election is made (Art 52(2), 52(4))","أعد احتساب معدل تلك السنة وضريبتها التكميلية، ما لم يقل التخفيض عن مليون يورو ويُجرَ الاختيار السنوي (المادة 52 (2) و(4))"]}],"diagrams":[{"type":"flow","title":["From the tax line to Adjusted Covered Taxes","من بند الضريبة إلى الضرائب المشمولة المعدلة"],"nodes":[{"t":["Current tax expense","مصروف الضريبة الحالية"],"s":["covered taxes in the accounts: income tax and Zakat","الضرائب المشمولة في الحسابات: ضريبة الدخل والزكاة"]},{"t":["+ Additions","+ الإضافات"],"s":["Art 45","المادة 45"]},{"t":["− Reductions","− التخفيضات"],"s":["Art 46","المادة 46"]},{"t":["± Deferred tax","± الضريبة المؤجلة"],"s":["Arts 49–51 (Module 9)","المواد 49–51 (الوحدة 9)"]},{"t":["± Equity and OCI","± حقوق الملكية والدخل الشامل الآخر"],"s":["taxes on included items taxed in the Kingdom · Art 44(1)(c)","ضرائب بنود مدرجة تخضع للضريبة في المملكة · المادة 44 (1) (ج)"]},{"t":["= Adjusted Covered Taxes","= الضرائب المشمولة المعدلة"],"s":["counted once only · Art 44(3)","تُحتسب مرة واحدة فقط · المادة 44 (3)"]}],"quick":true},{"type":"table","title":["Covered or not?","مشمولة أم لا؟"],"head":[["Item","البند"],["Treatment","المعالجة"]],"rows":[[["Saudi corporate income tax on the foreign shareholders' share","ضريبة الدخل في المملكة على حصة الشركاء الأجانب"],["Covered (Art 42(1)(a))","مشمولة (المادة 42 (1) (أ))"]],[["Zakat levied by the Kingdom on companies","الزكاة التي تفرضها المملكة على الشركات"],["Covered (Art 42(1)(c))","مشمولة (المادة 42 (1) (ج))"]],[["A tax charged instead of a general corporate income tax","ضريبة تُفرض بدلاً من ضريبة الدخل العامة على الشركات"],["Covered (Art 42(1)(b))","مشمولة (المادة 42 (1) (ب))"]],[["Domestic top-up tax accrued under a QDMTT, or top-up tax under an IIR","الضريبة التكميلية المستحقة بموجب ضريبة تكميلية محلية مؤهلة، أو بموجب قاعدة تضمين الدخل"],["Not covered (Art 42(2)(a)–(b))","غير مشمولة (المادة 42 (2) (أ)–(ب))"]],[["Taxes from an adjustment under a qualified UTPR","الضرائب الناتجة عن تعديل بموجب قاعدة الأرباح الخاضعة لمعدل منخفض المؤهلة"],["Not covered (Art 42(2)(c))","غير مشمولة (المادة 42 (2) (ج))"]],[["Taxes an insurer pays on its policyholders' returns","الضرائب التي تسددها شركة التأمين عن عوائد حاملي وثائقها"],["Not covered (Art 42(2)(d))","غير مشمولة (المادة 42 (2) (د))"]],[["VAT, customs duty and other taxes not on income, profits, retained earnings or equity","ضريبة القيمة المضافة والرسوم الجمركية وغيرها مما لا يُفرض على الدخل أو الأرباح أو الأرباح المحتجزة أو حقوق الملكية"],["Not covered: outside Art 42(1)","غير مشمولة: خارج نطاق المادة 42 (1)"]]]}],"points":[{"h":["Three kinds of covered tax","ثلاثة أنواع من الضرائب المشمولة"],"t":["Covered taxes are taxes recorded in an entity's accounts on its income or profits (or its share of another constituent entity's); taxes imposed in lieu of a general corporate income tax; and taxes levied by reference to retained earnings and corporate equity, expressly including Zakat levied by the Kingdom on companies.","الضرائب المشمولة هي الضرائب المسجلة في حسابات الكيان على دخله أو أرباحه (أو حصته في دخل كيان تابع آخر)؛ والضرائب المفروضة بدلاً من ضريبة الدخل العامة على الشركات؛ والضرائب المفروضة بالرجوع إلى الأرباح المحتجزة وحقوق ملكية الشركات، ومنها صراحةً الزكاة التي تفرضها المملكة على الشركات."],"r":["42(1)"],"p":["Covered taxes: income taxes, taxes in place of them, and taxes on equity, Zakat included.","الضرائب المشمولة: ضرائب الدخل، والضرائب البديلة عنها، والضرائب على حقوق الملكية، ومنها الزكاة."]},{"h":["What is a tax, and what is kept out","ما الضريبة، وما المستبعد"],"t":["A tax is a compulsory unrequited payment to General Government. Top-up taxes under an IIR or a QDMTT, taxes from a UTPR adjustment and an insurer's taxes on policyholder returns are not covered taxes.","الضريبة سداد إلزامي بلا مقابل للإدارات الحكومية. ولا تُعد ضرائب مشمولة: الضرائب التكميلية بموجب قاعدة تضمين الدخل أو الضريبة التكميلية المحلية المؤهلة، والضرائب الناتجة عن تعديل قاعدة الأرباح الخاضعة لمعدل منخفض، وضرائب شركة التأمين على عوائد حاملي الوثائق."],"r":["42(2)","42(3)"],"p":["Top-up taxes themselves, and insurers' taxes on policyholder returns, are not covered taxes.","الضرائب التكميلية نفسها، وضرائب شركات التأمين على عوائد حملة الوثائق، ليست ضرائب مشمولة."]},{"h":["Adjusted Covered Taxes","الضرائب المشمولة المعدلة"],"t":["Start with the current tax expense for covered taxes in the accounts. Add the additions, take off the reductions, apply the total deferred tax adjustment, and bring in covered taxes recorded in equity or OCI on items included in DMT income that are taxed in the Kingdom. No tax may be counted twice.","ابدأ بمصروف الضريبة الحالية للضرائب المشمولة في الحسابات، ثم أضف الإضافات واطرح التخفيضات، وطبّق إجمالي تعديل الضريبة المؤجلة، وأدرج الضرائب المشمولة المقيدة في حقوق الملكية أو الدخل الشامل الآخر عن بنود مدرجة في الدخل وخاضعة للضريبة في المملكة. ولا تُحتسب أي ضريبة مرتين."],"r":["44(1)","44(3)"],"p":["Start from the current tax in the accounts, then add, subtract and adjust for deferred tax.","ابدأ من الضريبة الحالية في القوائم، ثم أضف واطرح وعدّل بالضريبة المؤجلة."]},{"h":["Additions","الإضافات"],"t":["Add covered taxes booked as an expense above profit before tax; uncertain-position taxes paid this year that were reduced in an earlier year; and qualified refundable or marketable transferable tax credits booked as a reduction of current tax (they count as income instead).","أضف الضرائب المشمولة المقيدة كمصروف قبل الربح قبل الضريبة؛ وضرائب المراكز غير المؤكدة المسددة هذه السنة التي خُفضت في سنة سابقة؛ والائتمانات الضريبية المؤهلة القابلة للاسترداد أو القابلة للتحويل والتداول المقيدة كتخفيض للضريبة الحالية (لأنها تُعامل كدخل بدلاً من ذلك)."],"r":["45(1)","32(1)"],"p":["Add taxes booked elsewhere in the P&L, and disputed tax in the year it is paid.","أضف الضرائب المقيدة في مواضع أخرى من قائمة الدخل، والضريبة المتنازع عليها في سنة سدادها."]},{"h":["Reductions","التخفيضات"],"t":["Take off tax on income excluded from DMT income; non-qualifying tax credits not booked in current tax; refunds or credits not booked in current tax (unless they are post-filing adjustments); taxes on uncertain tax positions; and current tax not expected to be paid within three years of year-end.","اطرح الضريبة على الدخل المستبعد من الدخل؛ والائتمانات الضريبية غير المؤهلة غير المقيدة في الضريبة الحالية؛ والاستردادات أو الائتمانات غير المقيدة في الضريبة الحالية (ما لم تكن تعديلات لاحقة للإقرار)؛ وضرائب المراكز الضريبية غير المؤكدة؛ والضريبة الحالية التي لا يُتوقع سدادها خلال ثلاث سنوات من نهاية السنة."],"r":["46(1)"],"p":["Take off tax on excluded income, disputed tax, and tax not expected to be paid within three years.","اطرح ضريبة الدخل المستبعد، والضريبة المتنازع عليها، والضريبة التي لا يُتوقع سدادها خلال ثلاث سنوات."]},{"h":["Excess negative tax expense","المصروف الضريبي السالب الزائد"],"t":["If Adjusted Covered Taxes turn negative, the group may elect, and must where the top-up percentage would exceed 15%, to exclude the excess negative tax expense and carry it forward to reduce later years' covered taxes. In a year with net DMT income the excess is the whole negative amount; in a year without, it is the shortfall below expected covered taxes (15% of the Kingdom's net DMT loss).","إذا أصبحت الضرائب المشمولة المعدلة سالبة، يجوز للمجموعة أن تختار، ويجب عليها إذا تجاوزت نسبة الضريبة التكميلية 15%، استبعاد المصروف الضريبي السالب الزائد وترحيله لتخفيض الضرائب المشمولة في السنوات اللاحقة. وفي سنة فيها صافي دخل يكون الزائد هو المبلغ السالب كله؛ وفي سنة بلا صافي دخل يكون النقص عن الضرائب المتوقعة (15% من صافي خسارة المملكة)."],"r":["44(2)","47(1)","47(2)","63(4)"],"p":["If taxes turn negative, the excess can be carried forward to reduce later years' taxes.","إذا أصبحت الضرائب سالبة، يجوز ترحيل الزائد لتخفيض ضرائب السنوات اللاحقة."]},{"h":["Refunds and assessments for past years","الاستردادات والربوط عن سنوات سابقة"],"t":["An increase in a past year's covered taxes goes into the year it is booked. A decrease reopens the past year: its ETR and top-up tax are recalculated and any extra becomes additional current top-up tax. A group may elect each year to book an immaterial decrease (under €1m in aggregate for the Kingdom) in the current year instead.","تُدرج الزيادة في ضرائب سنة سابقة في السنة التي تُقيد فيها. أما التخفيض فيعيد فتح السنة السابقة: يُعاد احتساب معدلها الفعلي وضريبتها التكميلية، وتصبح أي زيادة ضريبة تكميلية حالية إضافية. ويجوز للمجموعة أن تختار سنوياً إدراج التخفيض غير الجوهري (أقل من مليون يورو إجمالاً للمملكة) في السنة الحالية."],"r":["52(1)","52(2)","52(4)","52(5)","63(2)"],"p":["Extra tax for a past year counts when booked; a refund reopens that year.","الضريبة الإضافية عن سنة سابقة تُحتسب عند قيدها؛ أما الاسترداد فيعيد فتح تلك السنة."]},{"h":["Tax that is never paid","الضريبة التي لا تُسدد"],"t":["If more than €1m of current tax claimed in a year is still unpaid three years after that year-end, the year is recalculated without the unpaid amount. Expected non-payment is dealt with up front as a reduction.","إذا بقي أكثر من مليون يورو من الضريبة الحالية المطالب بها في سنة ما دون سداد بعد ثلاث سنوات من نهاية تلك السنة، يُعاد احتساب السنة دون المبلغ غير المسدد. أما عدم السداد المتوقع فيُعالج مسبقاً كتخفيض."],"r":["52(8)","46(1)"],"p":["Tax claimed but still unpaid three years later (over €1m) reopens the year.","الضريبة المطالب بها التي تبقى دون سداد بعد ثلاث سنوات (فوق مليون يورو) تعيد فتح السنة."]}],"oecd":[{"t":["Articles 42 to 48 follow GloBE Articles 4.1 and 4.2. The draft names Zakat expressly within taxes on retained earnings and equity, and it leaves out GloBE Article 4.2's inclusion of taxes under an eligible distribution tax system, a regime the Kingdom does not operate.","تتبع المواد من 42 إلى 48 المادتين 4.1 و4.2 من القواعد النموذجية. ويذكر مشروع النظام الزكاة صراحةً ضمن الضرائب على الأرباح المحتجزة وحقوق الملكية، ويُسقط ما تشمله المادة 4.2 من القواعد النموذجية من ضرائب نظام ضريبة التوزيعات المؤهل، وهو نظام لا تطبقه المملكة."],"src":["Model Rules Arts 4.1–4.2","القواعد النموذجية: المادتان 4.1–4.2"]},{"t":["Watch point: Article 43 defines Disqualified Refundable Imputation Tax, but the exclusions in Article 42(2) do not list it, whereas GloBE Article 4.2 excludes it from covered taxes. Expect the final law or the Regulations to close the gap.","نقطة للمتابعة: تعرّف المادة 43 ضريبة الإسناد غير المؤهلة القابلة للاسترداد، لكن الاستثناءات في المادة 42 (2) لا تذكرها، بينما تستبعدها المادة 4.2 من القواعد النموذجية من الضرائب المشمولة. والمتوقع أن يعالج النظام النهائي أو اللائحة هذه الفجوة."],"src":["Model Rules Art 4.2","القواعد النموذجية: المادة 4.2"]}],"cases":[{"t":["Building covered taxes for a mixed Saudi company","بناء الضرائب المشمولة لشركة سعودية مختلطة"],"facts":["Najd Industrial is 60% Saudi-owned and 40% foreign-owned. Its FY2027 'Zakat and income tax' line shows:\n• Income tax on the foreign shareholders' share: SAR 24m, of which SAR 3m is a provision for a disputed ZATCA assessment and SAR 1m is tax on a gain from selling shares in an a
