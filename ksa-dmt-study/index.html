ح شركات محفظته كيانات مستبعدة لهذا السبب، بل ترأس كل منها مجموعتها لأغراض اختبار النطاق."],"r":["10(2)"]},{"q":["How is the Saudi branch (PE) of a group company treated?","كيف يُعامل الفرع (المنشأة الدائمة) في المملكة لشركة من المجموعة؟"],"o":[["As part of its head office","كجزء من المركز الرئيسي"],["As a separate constituent entity, separate from its main entity","ككيان تابع منفصل عن الكيان الرئيسي"],["It is ignored","يتم تجاهله"],["As an excluded entity","ككيان مستبعد"]],"a":1,"e":["Article 9(1)(b) and 9(2): a PE of a group entity is a constituent entity in its own right, separate from the main entity and its other PEs.","المادة 9 (1) (ب) و9 (2): المنشأة الدائمة لكيان في المجموعة كيان تابع بذاتها، منفصلة عن الكيان الرئيسي ومنشآته الأخرى."],"r":["9(1)","9(2)"]},{"q":["An accounting principle under a local GAAP gives a material competitive distortion. What happens?","أدى مبدأ محاسبي في معايير محلية إلى تباين تنافسي جوهري. ماذا يحدث؟"],"o":[["Nothing, local GAAP always applies","لا شيء، فالمعايير المحلية تُطبق دائماً"],["The item is adjusted to the IFRS treatment, under guidance issued by ZATCA","يُعدّل البند إلى معالجة المعايير الدولية للتقرير المالي وفق إرشادات تصدرها الهيئة"],["The group is excluded","تُستبعد المجموعة"],["The UPE must restate under US GAAP","يجب على الكيان الأم إعادة العرض وفق المبادئ الأمريكية"]],"a":1,"e":["Article 4(2): the treatment of the item is adjusted to conform with IFRS, in accordance with guidance issued by the Authority.","المادة 4 (2): تُعدّل معالجة البند لتتوافق مع المعايير الدولية للتقرير المالي، وفق الإرشادات الصادرة عن الهيئة."],"r":["4(2)"]},{"q":["A group of Saudi companies has no entity or PE outside the Kingdom and revenue of €3bn. Is it in scope?","مجموعة شركات سعودية ليس لها أي كيان أو منشأة دائمة خارج المملكة، وإيراداتها 3 مليارات يورو. هل تخضع للنظام؟"],"o":[["Yes, revenue exceeds €750m","نعم، فالإيرادات تتجاوز 750 مليون يورو"],["No, it is not an MNE group","لا، فهي ليست مجموعة متعددة الجنسيات"],["Yes, but only its largest company","نعم، لكن أكبر شركاتها فقط"],["Only if it is listed","فقط إذا كانت مدرجة"]],"a":1,"e":["Articles 2(1) and 8(1): the law reaches members of an MNE group. A group with every entity and PE in the UPE's jurisdiction is not one, whatever its size.","المادتان 2 (1) و8 (1): يشمل النظام أعضاء المجموعات المتعددة الجنسيات. والمجموعة التي تقع جميع كياناتها ومنشآتها في ولاية الكيان الأم النهائي ليست كذلك مهما كان حجمها."],"r":["2(1)","8(1)"]}],"cards":[{"f":["Group","المجموعة"],"b":["Entities in the UPE's consolidated statements, or left out only for size, materiality or held for sale; or an entity with foreign PEs not in another Group.","كيانات في القوائم الموحدة للكيان الأم النهائي أو مستبعدة منها فقط بسبب الحجم أو الجوهر أو الاحتفاظ بها للبيع؛ أو كيان له منشآت دائمة في الخارج وليس ضمن مجموعة أخرى."],"r":["8(2)","8(3)"]},{"f":["MNE Group","المجموعة المتعددة الجنسيات"],"b":["A Group with at least one entity or PE outside the UPE's jurisdiction.","مجموعة لديها كيان أو منشأة دائمة واحدة على الأقل خارج ولاية الكيان الأم النهائي."],"r":["8(1)"]},{"f":["Constituent Entity","الكيان التابع"],"b":["Any entity included in a Group and any PE of such an entity; never an Excluded Entity.","أي كيان مشمول في مجموعة وأي منشأة دائمة له؛ ولا يكون كياناً مستبعداً أبداً."],"r":[9]},{"f":["Ultimate Parent Entity","الكيان الأم النهائي"],"b":["Owns a controlling interest in another entity and is not owned with a controlling interest by anyone else.","يملك حصة مسيطرة في كيان آخر ولا يملكه غيره بحصة مسيطرة."],"r":["10(1)"]},{"f":["Controlling Interest","الحصة المسيطرة"],"b":["An interest requiring line-by-line consolidation under an Acceptable Financial Accounting Standard, or that would if consolidated statements were prepared.","حصة تستوجب التوحيد على أساس كل بند على حدة وفق المعايير المحاسبية المالية المقبولة، أو كانت ستستوجبه لو أُعدت قوائم موحدة."],"r":[7]},{"f":["Which statements does the revenue test use?","ما القوائم التي يعتمد عليها اختبار الإيرادات؟"],"b":["The UPE's consolidated financial statements, in riyal terms.","القوائم المالية الموحدة للكيان الأم النهائي، مقوّمة بالريال."],"r":["2(1)",4]},{"f":["What does revenue include?","ماذا تشمل الإيرادات؟"],"b":["Goods, services and ordinary activities, plus net investment gains (realised or unrealised) and extraordinary or non-recurring items.","السلع والخدمات والأنشطة الاعتيادية، إضافة إلى صافي المكاسب الاستثمارية (المحققة وغير المحققة) والبنود الاستثنائية أو غير المتكررة."],"r":["3(1)"]},{"f":["What is never deducted from revenue?","ما الذي لا يُخصم من الإيرادات أبداً؟"],"b":["Cost of sales and other operating expenses. Discounts, returns and allowances may be netted if the standard allows.","تكلفة المبيعات والمصاريف التشغيلية الأخرى. أما الخصومات والمرتجعات والمسموحات فتجوز مقاصتها إذا سمح المعيار."],"r":["3(2)"]},{"f":["Test year that is not 12 months","سنة اختبار لا تساوي 12 شهراً"],"b":["Adjust the €750m threshold in proportion to the year's length.","عدّل حد 750 مليون يورو بما يتناسب مع مدة السنة."],"r":["2(3)"]},{"f":["Sovereign wealth fund rule","قاعدة صناديق الثروة السيادية"],"b":["A fund meeting the Governmental Entity investing criterion is ignored; each company it directly controls is the UPE of its own group.","يُتجاهل الصندوق الذي يستوفي معيار الكيان الحكومي في الاستثمار؛ وكل شركة يسيطر عليها مباشرة هي الكيان الأم النهائي لمجموعتها."],"r":["10(2)"]},{"f":["Material competitive distortion","التباين التنافسي الجوهري"],"b":["Adjust the item to the IFRS treatment, following ZATCA guidance.","عدّل البند إلى معالجة المعايير الدولية للتقرير المالي وفق إرشادات الهيئة."],"r":["4(2)"]},{"f":["A main entity and its PEs","الكيان الرئيسي ومنشآته الدائمة"],"b":["The main entity is deemed to hold the controlling interest in its PEs; each PE is a separate constituent entity.","يُعد الكيان الرئيسي مالكاً للحصة المسيطرة في منشآته الدائمة؛ وكل منشأة دائمة كيان تابع منفصل."],"r":["7(2)","9(2)"]}],"reflect":{"ref":["An-Nisa 4:135","النساء: 135"],"ayah":"كونوا قوامين بالقسط شهداء لله ولو على أنفسكم","t":["Stand firm for justice, as witnesses for Allah, even against yourselves. The scope test is where this bites in practice: read the consolidated statements as they are, even when the honest answer brings your own group into scope.","كونوا قائمين بالعدل شهداء لله ولو على أنفسكم. وهنا يظهر أثر ذلك عملياً في اختبار النطاق: اقرأ القوائم الموحدة كما هي، حتى لو كانت الإجابة الأمينة تُدخل مجموعتك ضمن النطاق."]},"range":"2–4, 7–10"},{"id":3,"title":["Scope II: where an entity is located","النطاق (2): أين يقع الكيان"],"goal":["Locate any entity or PE for DMT purposes: residence, place of creation, flow-through entities, the four kinds of PE, dual-residence tie-breakers and stateless entities.","تحديد موقع أي كيان أو منشأة دائمة لأغراض النظام: الإقامة، ومكان الإنشاء، والكيانات الشفافة مالياً، وأنواع المنشأة الدائمة الأربعة، وقواعد الترجيح عند ازدواج الإقامة، والكيانات عديمة الجنسية."],"parts":[2],"arts":[5,6,9,11],"time":30,"metaphor":{"title":["An address for every entity","عنوان لكل كيان"],"text":["The DMT only taxes profits with a Saudi address, so every entity and branch needs exactly one address. Most get it from where they are tax resident; if they are resident nowhere, it is where they were created. Branches (PEs) get the address of the country that taxes them as a branch.\nWhen two countries both claim the same company, the draft runs a tie-break ladder: the treaty first, then who collected more covered taxes, then who hosts more substance. If it is still a tie, the entity is homeless (stateless) and is taxed in a box of its own.","لا تفرض ضريبة الحد الأدنى المحلي إلا على الأرباح التي عنوانها في المملكة، لذا يحتاج كل كيان وكل فرع إلى عنوان واحد فقط. يأخذ معظم الكيانات عنوانها من مكان إقامتها الضريبية؛ فإن لم تكن مقيمة في أي مكان، فعنوانها حيث أُنشئت. أما الفروع (المنشآت الدائمة) فعنوانها الدولة التي تفرض عليها الضريبة بوصفها فرعاً.\nوعندما تطالب دولتان بالشركة نفسها، يطبّق المشروع سلّماً للترجيح: الاتفاقية أولاً، ثم من حصّل ضرائب مشمولة أكثر، ثم من يستضيف جوهراً أكبر. فإن بقي التعادل، يصبح الكيان بلا عنوان (عديم الجنسية) ويُعامل في صندوق مستقل."]},"anchors":[{"if":["A company is Saudi-incorporated or managed from the Kingdom","شركة مؤسسة في المملكة أو تُدار منها"],"then":["It is tax resident under the Income Tax Law, so it is located in the Kingdom unless another country also claims it (Arts 5(1), 6)","فهي مقيمة ضريبياً وفق نظام ضريبة الدخل، فتقع في المملكة ما لم تطالب بها دولة أخرى أيضاً (المادتان 5 (1) و6)"]},{"if":["Two countries both treat the company as resident","تعامل دولتان الشركة على أنها مقيمة فيهما"],"then":["Climb the ladder: treaty tie-breaker → more covered taxes (ignore CFC tax) → more SBIE → stateless (Art 5(4))","اصعد السلّم: ترجيح الاتفاقية ← ضرائب مشمولة أكثر (دون ضريبة الشركات الأجنبية الخاضعة للسيطرة) ← استبعاد جوهر أكبر ← عديم الجنسية (المادة 5 (4))"]},{"if":["A foreign group company has a Saudi branch","شركة أجنبية في المجموعة لها فرع في المملكة"],"then":["Treat the branch as its own constituent entity located in the Kingdom if the Kingdom taxes it as a PE (Arts 5(3), 9(2), 11)","عامل الفرع ككيان تابع مستقل يقع في المملكة إذا كانت المملكة تفرض عليه الضريبة كمنشأة دائمة (المواد 5 (3) و9 (2) و11)"]},{"if":["A partnership or other transparent vehicle is created in Saudi Arabia","شراكة أو أداة شفافة أخرى أُنشئت في المملكة"],"then":["Unless it is the UPE or must apply an IIR, it is stateless; stateless entities created under Saudi law are still in scope (Arts 5(2), 2(2))","ما لم تكن الكيان الأم النهائي أو ملزمة بتطبيق قاعدة تضمين الدخل، فهي عديمة الجنسية؛ والكيانات عديمة الجنسية المنشأة بموجب أنظمة المملكة تبقى ضمن النطاق (المادتان 5 (2) و2 (2))"]},{"if":["An entity moves its residence mid-year","ينقل كيان إقامته خلال السنة"],"then":["For that year it stays located where it was at the start of the year (Art 5(5))","يبقى موقعه لتلك السنة حيث كان في بدايتها (المادة 5 (5))"]}],"diagrams":[{"type":"flow","title":["The tie-break ladder for a dual-resident constituent entity","سلّم الترجيح للكيان التابع مزدوج الإقامة"],"nodes":[{"t":["1. Treaty","1. الاتفاقية"],"s":["deemed residence under the treaty · Art 5(4)(a)","الإقامة الاعتبارية بموجب الاتفاقية · المادة 5 (4) (أ)"]},{"t":["2. Covered taxes","2. الضرائب المشمولة"],"s":["where it paid more, ignoring CFC tax · Art 5(4)(b)(1)","حيث سدد أكثر، دون ضريبة الشركات الأجنبية الخاضعة للسيطرة · المادة 5 (4) (ب) (1)"]},{"t":["3. Substance","3. الجوهر"],"s":["where its entity-level SBIE is greater · Art 5(4)(b)(2)","حيث يكون الاستبعاد على أساس الجوهر على مستوى الكيان أكبر · المادة 5 (4) (ب) (2)"]},{"t":["4. Stateless","4. عديم الجنسية"],"s":["unless it is the UPE: then where created · Art 5(4)(b)(3)","ما لم يكن الكيان الأم النهائي: فحيث أُنشئ · المادة 5 (4) (ب) (3)"]}],"note":["Go straight to step 2 if there is no treaty, if the treaty needs a mutual agreement that has not been reached, or if the treaty gives no relief because the entity is resident in both states.","انتقل مباشرة إلى الخطوة 2 إذا لم توجد اتفاقية، أو إذا تطلبت الاتفاقية اتفاقاً متبادلاً لم يتم التوصل إليه، أو إذا لم تمنح الاتفاقية إعفاءً لأن الكيان مقيم في الدولتين."]},{"type":"table","title":["The four kinds of PE and where each is located","أنواع المنشأة الدائمة الأربعة وموقع كل منها"],"head":[["Kind of PE (Art 11)","نوع المنشأة الدائمة (المادة 11)"],["Located in (Art 5(3))","تقع في (المادة 5 (3))"]],"rows":[[["(1) A PE under an applicable treaty, taxed like Article 7 of the OECD Model","(1) منشأة دائمة بموجب اتفاقية سارية، تخضع للضريبة وفق حكم مماثل للمادة 7 من النموذج"],["The jurisdiction that treats it as a PE and taxes it under the treaty","الولاية التي تعاملها كمنشأة دائمة وتفرض عليها الضريبة بموجب الاتفاقية"]],[["(2) No treaty: a place of business taxed on a net basis like a resident","(2) لا اتفاقية: مكان عمل يخضع للضريبة على صافي الأرباح كالمقيمين"],["The jurisdiction that taxes it on a net basis","الولاية التي تفرض عليه الضريبة على أساس الصافي"]],[["(3) A jurisdiction with no corporate income tax: would be a PE under the OECD Model","(3) ولاية بلا ضريبة دخل على الشركات: كان سيُعد منشأة دائمة وفق النموذج"],["The jurisdiction where it is situated","الولاية التي يتواجد فيها"]],[["(4) Any other place of business whose income the head office country exempts","(4) أي مكان عمل آخر تعفي دولة المركز الرئيسي دخله"],["Stateless PE","منشأة دائمة عديمة الجنسية"]]]}],"points":[{"h":["Ordinary entities","الكيانات العادية"],"t":["An entity that is not a flow-through entity is located where it is tax resident because of its place of management, place of creation or a similar criterion. If it is not resident anywhere on such a basis, it is located where it was created.","يقع الكيان الذي لا يُعد كياناً شفافاً مالياً في الولاية التي يكون مقيماً ضريبياً فيها بناءً على مكان إدارته أو مكان إنشائه أو أي معيار مماثل. فإن لم يكن مقيماً على هذا الأساس في أي مكان، فإنه يقع حيث أُنشئ."],"r":["5(1)"]},{"h":["Saudi tax residence","الإقامة الضريبية في المملكة"],"t":["An entity is tax resident in the Kingdom if it meets the residency conditions of the Income Tax Law. Under the current Income Tax Law (Article 3), a company is resident if it is formed under the Companies Law or its central management is in the Kingdom.","يُعد الكيان مقيماً ضريبياً في المملكة إذا استوفى شروط الإقامة في نظام ضريبة الدخل. ووفق نظام ضريبة الدخل الحالي (المادة 3)، تكون الشركة مقيمة إذا أُسست وفق نظام الشركات أو كانت إدارتها المركزية في المملكة."],"r":[6]},{"h":["Flow-through entities","الكيانات الشفافة مالياً"],"t":["A flow-through entity is located where it was created only if it is the UPE or must apply an IIR. Otherwise it is stateless. Stateless constituent entities created under Saudi law, including in the Special Economic Zones, are within the law's scope.","لا يقع الكيان الشفاف مالياً حيث أُنشئ إلا إذا كان الكيان الأم النهائي أو كان ملزماً بتطبيق قاعدة تضمين الدخل. وفي غير ذلك يكون عديم الجنسية. وتخضع للنظام الكيانات التابعة عديمة الجنسية المنشأة بموجب أنظمة المملكة، بما في ذلك المناطق الاقتصادية الخاصة."],"r":["5(2)","2(2)"]},{"h":["Permanent establishments","المنشآت الدائمة"],"t":["Article 11 recognises four kinds of PE: a treaty PE taxed like Article 7 of the OECD Model; without a treaty, a place of business taxed on a net basis like a resident; in a country with no corporate income tax, a place that would be a PE under the OECD Model; and any other place of business whose income the head office country exempts, which is stateless.","تعترف المادة 11 بأربعة أنواع من المنشأة الدائمة: منشأة بموجب اتفاقية تخضع للضريبة وفق حكم مماثل للمادة 7 من النموذج؛ وفي غياب الاتفاقية، مكان عمل يخضع للضريبة على أساس الصافي كالمقيمين؛ وفي دولة بلا ضريبة دخل على الشركات، مكان كان سيُعد منشأة دائمة وفق النموذج؛ وأي مكان عمل آخر تعفي دولة المركز الرئيسي دخله، ويكون عديم الجنسية."],"r":[11,"5(3)"]},{"h":["Each PE stands alone","كل منشأة دائمة مستقلة"],"t":["A PE is a constituent entity separate from its main entity and from the main entity's other PEs. A Saudi branch of a foreign group company is therefore a Saudi constituent entity in its own right.","المنشأة الدائمة كيان تابع منفصل عن الكيان الرئيسي وعن منشآته الدائمة الأخرى. لذا يكون الفرع في المملكة لشركة أجنبية في المجموعة كياناً تابعاً في المملكة بذاته."],"r":["9(2)"]},{"h":["Dual residence: the ladder","ازدواج الإقامة: سلّم الترجيح"],"t":["With a treaty, the entity is located where the treaty deems it resident. If the treaty needs a mutual agreement that has not been reached, or gives no relief, use the no-treaty rules: where it paid more covered taxes for the year (ignoring CFC regime taxes), then where its entity-level SBIE is greater, and otherwise it is stateless unless it is the UPE, which is located where it was created.","مع وجود اتفاقية، يقع الكيان حيث تعدّه الاتفاقية مقيماً. فإن تطلبت الاتفاقية اتفاقاً متبادلاً لم يتم التوصل إليه أو لم تمنح إعفاءً، تُطبق قواعد غياب الاتفاقية: حيث سدد ضرائب مشمولة أكثر عن السنة (دون ضرائب نظام الشركات الأجنبية الخاضعة للسيطرة)، ثم حيث يكون الاستبعاد على أساس الجوهر على مستوى الكيان أكبر، وإلا كان عديم الجنسية ما لم يكن الكيان الأم النهائي فيقع حيث أُنشئ."],"r":["5(4)","5(6)"]},{"h":["Moving mid-year","الانتقال خلال السنة"],"t":["An entity that changes its location during a fiscal year is located, for that whole year, where it was at the beginning of the year.","الكيان الذي يغيّر موقعه خلال السنة المالية يقع، طوال تلك السنة، حيث كان في بدايتها."],"r":["5(5)"]},{"h":["Why stateless matters","لماذا يهم انعدام الجنسية"],"t":["Each stateless constituent entity is treated as a single entity in a separate jurisdiction for the ETR computation, so its low-taxed income is not blended with the Kingdom's other entities.","يُعامل كل كيان تابع عديم الجنسية ككيان واحد في ولاية قضائية منفصلة عند احتساب معدل الضريبة الفعلي، فلا يُمزج دخله منخفض الضريبة مع كيانات المملكة الأخرى."],"r":["53(3)"]}],"oecd":[{"t":["The location rules and the four kinds of PE closely follow GloBE Article 10.3 and the PE definition in Article 10.1, including the tie-breakers that start with the treaty, then covered taxes, then the substance-based income exclusion.","تتبع قواعد الموقع وأنواع المنشأة الدائمة الأربعة عن كثب المادة 10.3 من القواعد النموذجية وتعريف المنشأة الدائمة في المادة 10.1، بما في ذلك قواعد الترجيح التي تبدأ بالاتفاقية ثم الضرائب المشمولة ثم الاستبعاد على أساس الجوهر."],"src":["Model Rules Arts 10.1 (Permanent Establishment) and 10.3","القواعد النموذجية: المادة 10.1 (المنشأة الدائمة) والمادة 10.3"]},{"t":["The draft brings stateless constituent entities created under Saudi law into scope expressly. Under the Model Rules, a stateless constituent entity's top-up tax is computed on its own, separately from any jurisdiction.","يُدخل المشروع صراحةً الكيانات التابعة عديمة الجنسية المنشأة بموجب أنظمة المملكة ضمن النطاق. وفي القواعد النموذجية تُحتسب الضريبة التكميلية للكيان التابع عديم الجنسية بشكل مستقل عن أي ولاية قضائية."],"src":["Model Rules Art 5.1","القواعد النموذجية: المادة 5.1"]}],"reflect":{"ref":["Al-Hadid 57:4","الحديد: 4"],"ayah":"وهو معكم أين ما كنتم","t":["He is with you wherever you are. The draft spends pages fixing an entity's address; the believer's integrity has no address. The same honesty applies to a Riyadh head office, a free-zone branch or a stateless vehicle.","وهو معكم أينما كنتم. يخصص المشروع صفحات لتحديد عنوان الكيان، أما أمانة المؤمن فلا عنوان لها؛ فالصدق نفسه يلزم في مقر الرياض وفي فرع المنطقة الحرة وفي الأداة عديمة الجنسية."]},"cases":[{"t":["Two countries claim Desert Holdings","دولتان تطالبان بشركة الصحراء القابضة"],"facts":["Desert Holdings was created in Country Y and is resident there by incorporation. Its board and senior management sit in Riyadh, so it is also resident in the Kingdom (central management). There is no tax treaty between the Kingdom and Y. Covered taxes paid for FY2027: Kingdom SAR 12m; Country Y SAR 7m, of which SAR 3m is Y's CFC tax on the profits of a foreign subsidiary.","أُنشئت شركة الصحراء القابضة في الدولة (ص) وهي مقيمة فيها بحكم التأسيس. ويجتمع مجلس إدارتها وإدارتها العليا في الرياض، فهي مقيمة في المملكة أيضاً (الإدارة المركزية). ولا توجد اتفاقية ضريبية بين المملكة و(ص). الضرائب المشمولة المسددة للسنة المالية 2027م: المملكة 12 مليون ريال؛ والدولة (ص) 7 ملايين ريال، منها 3 ملايين ريال ضريبة تفرضها (ص) وفق نظام الشركات الأجنبية الخاضعة للسيطرة على أرباح شركة تابعة أجنبية."],"steps":[{"t":["Resident in two jurisdictions under Article 5(1), so apply the dual-residence rules. No treaty: go to the covered-taxes test.","مقيمة في ولايتين وفق المادة 5 (1)، فتُطبق قواعد ازدواج الإقامة. لا توجد اتفاقية: ننتقل إلى اختبار الضرائب المشمولة."]},{"t":["Country Y's covered taxes, ignoring the CFC tax:","الضرائب المشمولة في (ص) دون ضريبة الشركات الأجنبية الخاضعة للسيطرة:"],"x":"7000000-3000000","v":4000000,"u":"SAR"},{"t":["Compare: the Kingdom SAR 12m against Country Y SAR 4m. The Kingdom is higher.","قارن: المملكة 12 مليون ريال مقابل (ص) 4 ملايين ريال. المملكة أعلى."],"x":"12000000-4000000","v":8000000,"u":"SAR"}],"ans":["Located in the Kingdom for FY2027. Had Y counted its CFC tax, the gap would have narrowed to SAR 5m, but the result would not change. If the taxes had been equal, the entity-level SBIE would decide.","تقع في المملكة للسنة المالية 2027م. ولو احتُسبت ضريبة الشركات الأجنبية الخاضعة للسيطرة في (ص) لضاق الفارق إلى 5 ملايين ريال، لكن النتيجة لا تتغير. ولو تساوت الضرائب لحسم الأمرَ الاستبعادُ على أساس الجوهر على مستوى الكيان."],"r":["5(1)","5(4)","5(6)",6]},{"t":["A treaty that needs an agreement nobody reached","اتفاقية تتطلب اتفاقاً لم يتحقق"],"facts":["Med Logistics is resident in the Kingdom (central management) and in Country T (incorporation). The Kingdom–T treaty settles company dual residence by mutual agreement, and the competent authorities have not agreed. FY2027 covered taxes paid: Kingdom SAR 2m; T SAR 2m. Entity-level SBIE: Kingdom SAR 1.5m; T SAR 0.6m.","شركة متوسط للخدمات اللوجستية مقيمة في المملكة (الإدارة المركزية) وفي الدولة (ت) (التأسيس). وتحسم الاتفاقية بين المملكة و(ت) ازدواج إقامة الشركات باتفاق متبادل، ولم تتفق السلطات المختصة. الضرائب المشمولة المسددة للسنة المالية 2027م: المملكة 2 مليون ريال؛ و(ت) 2 مليون ريال. الاستبعاد على أساس الجوهر على مستوى الكيان: المملكة 1.5 مليون ريال؛ و(ت) 0.6 مليون ريال."],"steps":[{"t":["A treaty applies, but it needs a mutual agreement and there is none, so Article 5(4)(a)(2) sends us to the no-treaty rules.","توجد اتفاقية لكنها تتطلب اتفاقاً متبادلاً لم يتحقق، فتحيلنا المادة 5 (4) (أ) (2) إلى قواعد غياب الاتفاقية."]},{"t":["Covered taxes: equal, so the first test does not decide.","الضرائب المشمولة متساوية، فلا يحسم الاختبار الأول."],"x":"2000000-2000000","v":0,"u":"SAR"},{"t":["Compare entity-level SBIE: the Kingdom is higher by:","قارن الاستبعاد على أساس الجوهر على مستوى الكيان: المملكة أعلى بمقدار:"],"x":"1500000-600000","v":900000,"u":"SAR"}],"ans":["Located in the Kingdom, where its substance is greater. If the SBIE had also been equal, Med Logistics would be stateless (it is not the UPE), and its ETR would be computed on its own.","تقع في المملكة حيث جوهرها أكبر. ولو تساوى الاستبعاد أيضاً لكانت عديمة الجنسية (فهي ليست الكيان الأم النهائي)، ولاحتُسب معدلها الفعلي بشكل مستقل."],"r":["5(4)","53(3)"]},{"t":["The Saudi branch of a Korean contractor","الفرع في المملكة لمقاول كوري"],"facts":["HanBuild, a Korean company in an in-scope MNE group, has a licensed branch in the Kingdom. Under the Kingdom–Korea treaty the branch is a PE, and the Kingdom taxes its business profits under the treaty's business-profits article.","شركة هان للبناء شركة كورية ضمن مجموعة متعددة الجنسيات خاضعة للنظام، ولها فرع مرخص في المملكة. والفرع منشأة دائمة بموجب الاتفاقية بين المملكة وكوريا، وتفرض المملكة الضريبة على أرباحه التجارية وفق مادة الأرباح التجارية في الاتفاقية."],"steps":[{"t":["Kind of PE: a place of business treated as a PE under an applicable treaty and taxed like Article 7 of the OECD Model.","نوع المنشأة: مكان عمل يُعامل كمنشأة دائمة بموجب اتفاقية سارية ويخضع للضريبة وفق حكم مماثل للمادة 7 من النموذج."]},{"t":["Location: the jurisdiction that treats it as a PE and taxes it under the treaty, so the Kingdom.","الموقع: الولاية التي تعامله كمنشأة دائمة وتفرض عليه الضريبة بموجب الاتفاقية، أي المملكة."]},{"t":["Status: a constituent entity separate from HanBuild's Korean head office.","الوضع: كيان تابع منفصل عن المركز الرئيسي لهان للبناء في كوريا."]}],"ans":["The branch is a Saudi constituent entity and a taxpayer in its own right. Its income and covered taxes join the Kingdom's blended ETR with the group's other Saudi entities. Without a treaty, the result would be the same if the Kingdom taxes the branch on a net basis like a resident.","الفرع كيان تابع في المملكة ومكلف بذاته. ويدخل دخله وضرائبه المشمولة في معدل الضريبة الفعلي المجمّع للمملكة مع كيانات المجموعة الأخرى فيها. ولو لم توجد اتفاقية لكانت النتيجة نفسها ما دامت المملكة تفرض الضريبة على الفرع على أساس الصافي كالمقيمين."],"r":["11","5(3)","9(2)","53(2)"]}],"quiz":[{"q":["A company is tax resident only in the Kingdom, because its central management is there. Where is it located?","شركة مقيمة ضريبياً في المملكة وحدها لأن إدارتها المركزية فيها. أين تقع؟"],"o":[["Where it was incorporated","حيث تأسست"],["In the Kingdom","في المملكة"],["Where its parent is located","حيث يقع الكيان الأم"],["It is stateless","عديمة الجنسية"]],"a":1,"e":["Article 5(1)(a): an entity that is tax resident on the basis of its place of management, place of creation or similar criteria is located there. Saudi residence follows the Income Tax Law (Art 6).","المادة 5 (1) (أ): يقع الكيان المقيم ضريبياً على أساس مكان إدارته أو إنشائه أو معيار مماثل في تلك الولاية. وتتبع الإقامة في المملكة نظام ضريبة الدخل (المادة 6)."],"r":["5(1)",6]},{"q":["An entity is not tax resident anywhere on a management or creation basis. Where is it located?","كيان غير مقيم ضريبياً في أي مكان على أساس الإدارة أو الإنشاء. أين يقع؟"],"o":[["Nowhere: it is stateless","لا مكان: هو عديم الجنسية"],["Where it was created","حيث أُنشئ"],["Where its largest customer is","حيث يوجد أكبر عملائه"],["In the UPE's jurisdiction","في ولاية الكيان الأم النهائي"]],"a":1,"e":["Article 5(1)(b): in other cases, an entity that is not a flow-through entity is located in the jurisdiction where it was created. Statelessness is for flow-through entities and the end of the dual-residence ladder.","المادة 5 (1) (ب): في الحالات الأخرى يقع الكيان غير الشفاف مالياً حيث أُنشئ. أما انعدام الجنسية فللكيانات الشفافة مالياً ولنهاية سلّم الترجيح."],"r":["5(1)"]},{"q":["A flow-through entity is the group's ultimate parent. Where is it located?","كيان شفاف مالياً هو الكيان الأم النهائي للمجموعة. أين يقع؟"],"o":[["It is stateless","عديم الجنسية"],["Where it was created","حيث أُنشئ"],["Where its partners live","حيث يقيم شركاؤه"],["In the Kingdom","في المملكة"]],"a":1,"e":["Article 5(2)(a): a flow-through entity that is the UPE, or must apply an IIR, is located where it was created. Any other flow-through entity is stateless.","المادة 5 (2) (أ): يقع الكيان الشفاف مالياً الذي يكون الكيان الأم النهائي، أو الملزم بتطبيق قاعدة تضمين الدخل، حيث أُنشئ. وأي كيان شفاف آخر عديم الجنسية."],"r":["5(2)"]},{"q":["A transparent partnership created under Saudi law is neither the UPE nor applying an IIR. What follows?","شراكة شفافة أُنشئت وفق أنظمة المملكة، وليست الكيان الأم النهائي ولا تطبّق قاعدة تضمين الدخل. ما النتيجة؟"],"o":[["It is located in the Kingdom","تقع في المملكة"],["It is stateless, and as a stateless entity created under Saudi law it is within scope","عديمة الجنسية، وبصفتها منشأة وفق أنظمة المملكة فهي ضمن النطاق"],["It is excluded from the law","مستبعدة من النظام"],["It is located where its main partner is","تقع حيث يوجد شريكها الرئيسي"]],"a":1,"e":["Article 5(2)(b) makes it stateless, and Article 2(2) applies the law to stateless constituent entities created under Saudi law. Its ETR is computed as a separate jurisdiction (Art 53(3)).","تجعلها المادة 5 (2) (ب) عديمة الجنسية، وتطبّق المادة 2 (2) النظام على الكيانات التابعة عديمة الجنسية المنشأة وفق أنظمة المملكة. ويُحتسب معدلها الفعلي كولاية منفصلة (المادة 53 (3))."],"r":["5(2)","2(2)","53(3)"]},{"q":["Where is a treaty PE located?","أين تقع المنشأة الدائمة بموجب اتفاقية؟"],"o":[["Where the head office is resident","حيث يقيم المركز الرئيسي"],["In the jurisdiction that treats it as a PE and taxes it under the applicable treaty","في الولاية التي تعاملها كمنشأة دائمة وتفرض عليها الضريبة بموجب الاتفاقية السارية"],["Where its customers are","حيث عملاؤها"],["It is always stateless","دائماً عديمة الجنسية"]],"a":1,"e":["Article 5(3)(a), read with Article 11(1).","المادة 5 (3) (أ) مقروءة مع المادة 11 (1)."],"r":["5(3)","11"]},{"q":["Without a treaty, when is a place of business a PE located in the Kingdom?","في غياب اتفاقية، متى يكون مكان العمل منشأة دائمة واقعة في المملكة؟"],"o":[["Whenever it has employees in the Kingdom","كلما كان له موظفون في المملكة"],["When the Kingdom taxes its income on a net basis, as it taxes its own residents","عندما تفرض المملكة الضريبة على دخله على أساس الصافي كما تفعل مع المقيمين"],["Only if it is registered with the Ministry of Commerce","فقط إذا كان مسجلاً لدى وزارة التجارة"],["Never","أبداً"]],"a":1,"e":["Articles 11(2) and 5(3)(b): with no treaty, it is the jurisdiction that taxes the income on a net basis on account of the business presence.","المادتان 11 (2) و5 (3) (ب): في غياب الاتفاقية، العبرة بالولاية التي تفرض الضريبة على الدخل على أساس الصافي بسبب التواجد التجاري."],"r":["11","5(3)"]},{"q":["A dual-resident company and no treaty applies. What is the first test?","شركة مزدوجة الإقامة ولا توجد اتفاقية سارية. ما الاختبار الأول؟"],"o":[["Where it has more employees","حيث يوجد موظفون أكثر"],["Where it paid more covered taxes for the year, ignoring CFC regime taxes","حيث سددت ضرائب مشمولة أكثر عن السنة، دون ضرائب نظام الشركات الأجنبية الخاضعة للسيطرة"],["Where it was created","حيث أُنشئت"],["Where its UPE is","حيث الكيان الأم النهائي"]],"a":1,"e":["Article 5(4)(b)(1). Taxes paid under a CFC tax regime (defined in Art 5(6)) are left out of the comparison.","المادة 5 (4) (ب) (1). وتُستبعد من المقارنة الضرائب المسددة وفق نظام الشركات الأجنبية الخاضعة للسيطرة (المعرّف في المادة 5 (6))."],"r":["5(4)","5(6)"]},{"q":["Covered taxes paid in both jurisdictions are equal. What decides location next?","تساوت الضرائب المشمولة المسددة في الولايتين. ما الذي يحسم الموقع بعد ذلك؟"],"o":[["Revenue","الإيرادات"],["The greater substance-based income exclusion computed on an entity basis","الاستبعاد على أساس الجوهر الأكبر محتسباً على مستوى الكيان"],["The older incorporation","التأسيس الأقدم"],["ZATCA decides","تقرر الهيئة"]],"a":1,"e":["Article 5(4)(b)(2), using the SBIE computed under Article 58 on an entity basis.","المادة 5 (4) (ب) (2)، باستخدام الاستبعاد على أساس الجوهر المحتسب وفق المادة 58 على مستوى الكيان."],"r":["5(4)",58]},{"q":["Covered taxes and SBIE are both equal, and the entity is not the UPE. Where is it located?","تساوت الضرائب المشمولة والاستبعاد على أساس الجوهر، والكيان ليس الكيان الأم النهائي. أين يقع؟"],"o":[["In the Kingdom","في المملكة"],["It is a stateless constituent entity","كيان تابع عديم الجنسية"],["Where it was created","حيث أُنشئ"],["Where it has more assets","حيث أصوله أكثر"]],"a":1,"e":["Article 5(4)(b)(3). Only a UPE in that position is located where it was created.","المادة 5 (4) (ب) (3). ولا يقع حيث أُنشئ في هذه الحالة إلا الكيان الأم النهائي."],"r":["5(4)"]},{"q":["A company moves its management from Dubai to Riyadh on 1 July 2027 (calendar fiscal year). Where is it located for FY2027?","نقلت شركة إدارتها من دبي إلى الرياض في 1 يوليو 2027م (سنة مالية تقويمية). أين تقع للسنة المالية 2027م؟"],"o":[["In the Kingdom, from 1 July","في المملكة اعتباراً من 1 يوليو"],["Where it was at the beginning of the year","حيث كانت في بداية السنة"],["Split between both","مقسّمة بين الاثنتين"],["It is stateless for the year","عديمة الجنسية لتلك السنة"]],"a":1,"e":["Article 5(5): an entity that changes location during the year is located, for that year, where it was at the beginning of the year. The move counts from FY2028.","المادة 5 (5): الكيان الذي يغيّر موقعه خلال السنة يقع لتلك السنة حيث كان في بدايتها. ويُعتد بالانتقال اعتباراً من السنة المالية 2028م."],"r":["5(5)"]},{"q":["How is a Saudi branch of a foreign group company treated for the DMT?","كيف يُعامل فرع في المملكة لشركة أجنبية في المجموعة لأغراض النظام؟"],"o":[["As part of the foreign head office","كجزء من المركز الرئيسي الأجنبي"],["As a separate constituent entity located in the Kingdom, if the Kingdom taxes it as a PE","ككيان تابع منفصل يقع في المملكة، إذا كانت المملكة تفرض عليه الضريبة كمنشأة دائمة"],["As an excluded entity","ككيان مستبعد"],["It is ignored","يتم تجاهله"]],"a":1,"e":["Articles 9(2), 11 and 5(3). The branch is a Saudi taxpayer and joins the Kingdom's blended ETR.","المواد 9 (2) و11 و5 (3). الفرع مكلف في المملكة ويدخل في معدلها الفعلي المجمّع."],"r":["9(2)","11","5(3)"]},{"q":["Why does it matter that an entity is stateless?","لماذا يهم أن يكون الكيان عديم الجنسية؟"],"o":[["It pays no tax at all","لا يدفع أي ضريبة"],["Its ETR is computed as a separate jurisdiction, without blending with other Saudi entities","يُحتسب معدله الفعلي كولاية منفصلة دون مزجه مع كيانات المملكة الأخرى"],["It must file in every country","يجب أن يقدّم إقرارات في كل دولة"],["It becomes an excluded entity","يصبح كياناً مستبعداً"]],"a":1,"e":["Article 53(3) treats each stateless constituent entity as a single entity located in a separate jurisdiction. A zero-taxed stateless entity cannot hide behind high-taxed Saudi affiliates.","تعامل المادة 53 (3) كل كيان تابع عديم الجنسية ككيان واحد في ولاية منفصلة. فلا يمكن للكيان عديم الجنسية غير الخاضع للضريبة أن يحتمي بكيانات المملكة مرتفعة الضريبة."],"r":["53(3)"]}],"cards":[{"f":["Location of an ordinary entity","موقع الكيان العادي"],"b":["Where it is tax resident by place of management, creation or similar criterion; otherwise where it was created.","حيث يكون مقيماً ضريبياً بحكم مكان الإدارة أو الإنشاء أو معيار مماثل؛ وإلا فحيث أُنشئ."],"r":["5(1)"]},{"f":["Saudi tax residence for the DMT","الإقامة الضريبية في المملكة لأغراض النظام"],"b":["Meets the Income Tax Law conditions: for a company, formed under the Companies Law or centrally managed in the Kingdom.","استيفاء شروط نظام ضريبة الدخل: للشركة، التأسيس وفق نظام الشركات أو وجود الإدارة المركزية في المملكة."],"r":[6]},{"f":["Location of a flow-through entity","موقع الكيان الشفاف مالياً"],"b":["Where created if it is the UPE or applies an IIR; otherwise stateless.","حيث أُنشئ إذا كان الكيان الأم النهائي أو يطبّق قاعدة تضمين الدخل؛ وإلا فهو عديم الجنسية."],"r":["5(2)"]},{"f":["Stateless entities created under Saudi law","الكيانات عديمة الجنسية المنشأة وفق أنظمة المملكة"],"b":["Within scope, including in the Special Economic Zones.","ضمن النطاق، بما في ذلك المناطق الاقتصادية الخاصة."],"r":["2(2)"]},{"f":["The four kinds of PE","أنواع المنشأة الدائمة الأربعة"],"b":["Treaty PE · no-treaty net-basis PE · PE in a no-CIT country · exempt-income PE (stateless).","منشأة بموجب اتفاقية · منشأة تخضع للضريبة على الصافي دون اتفاقية · منشأة في دولة بلا ضريبة دخل على الشركات · منشأة دخلها معفى (عديمة الجنسية)."],"r":[11]},{"f":["Location of a treaty PE","موقع المنشأة الدائمة بموجب اتفاقية"],"b":["Where it is treated as a PE and taxed under the applicable treaty.","حيث تُعامل كمنشأة دائمة وتخضع للضريبة بموجب الاتفاقية السارية."],"r":["5(3)"]},{"f":["Is a PE part of its head office?","هل المنشأة الدائمة جزء من مركزها الرئيسي؟"],"b":["No. Each PE is a constituent entity separate from its main entity and its other PEs.","لا. كل منشأة دائمة كيان تابع منفصل عن الكيان الرئيسي ومنشآته الأخرى."],"r":["9(2)"]},{"f":["Dual residence with a treaty","ازدواج الإقامة مع وجود اتفاقية"],"b":["Located where the treaty deems it resident; if a needed mutual agreement is missing or no relief is given, use the no-treaty ladder.","يقع حيث تعدّه الاتفاقية مقيماً؛ وإن غاب الاتفاق المتبادل المطلوب أو لم يُمنح إعفاء، فيُطبق سلّم غياب الاتفاقية."],"r":["5(4)"]},{"f":["The no-treaty ladder","سلّم الترجيح دون اتفاقية"],"b":["More covered taxes (ignore CFC tax) → greater entity-level SBIE → stateless, unless UPE (then where created).","ضرائب مشمولة أكثر (دون ضريبة الشركات الأجنبية الخاضعة للسيطرة) ← استبعاد جوهر أكبر على مستوى الكيان ← عديم الجنسية، ما لم يكن الكيان الأم النهائي (فحيث أُنشئ)."],"r":["5(4)"]},{"f":["CFC tax regime","نظام الشركات الأجنبية الخاضعة للسيطرة"],"b":["Rules (other than an IIR) taxing a shareholder currently on a foreign entity's income, whether or not distributed.","قواعد (غير قاعدة تضمين الدخل) تفرض الضريبة على المساهم حالياً على دخل كيان أجنبي، سواء وُزّع أم لا."],"r":["5(6)"]},{"f":["Change of location mid-year","تغيير الموقع خلال السنة"],"b":["Located for that year where it was at the beginning of the year.","يقع لتلك السنة حيث كان في بدايتها."],"r":["5(5)"]},{"f":["Stateless entity and the ETR","الكيان عديم الجنسية ومعدل الضريبة الفعلي"],"b":["Treated as a single entity in a separate jurisdiction: no blending with Saudi entities.","يُعامل ككيان واحد في ولاية منفصلة: لا مزج مع كيانات المملكة."],"r":["53(3)"]}],"range":"5–6, 9, 11"},{"id":4,"title":["Scope III: excluded entities","النطاق (3): الكيانات المستبعدة"],"goal":["Recognise the six kinds of excluded entity, apply the 95% and 85% ownership tests to their holding vehicles, and use the five-year election.","التعرف على الأنواع الستة للكيانات المستبعدة، وتطبيق اختباري الملكية 95% و85% على أدواتها القابضة، واستخدام اختيار الخمس سنوات."],"parts":[1,2],"arts":[1,12,13,14,15,16,17],"time":25,"metaphor":{"title":["Exempt number plates","لوحات معفاة"],"text":["On the DMT road some vehicles carry exempt plates: government cars, diplomatic cars (international organisations), charity vans and pension-fund buses. Investment funds and real estate vehicles get the plate only when they lead the convoy as the ultimate parent.\nA small van that does nothing but carry an exempt owner's cargo gets the same plate if the owner holds at least 95% of it, or 85% if almost all it carries is exempt dividends and equity gains. The plate covers the vehicle, not the convoy behind it: an exempt owner's operating companies still pay the toll.","على طريق ضريبة الحد الأدنى المحلي تحمل بعض المركبات لوحات معفاة: سيارات الحكومة، والسيارات الدبلوماسية (المنظمات الدولية)، وحافلات الجمعيات الخيرية وصناديق التقاعد. ولا تحصل صناديق الاستثمار والأدوات العقارية على اللوحة إلا إذا قادت القافلة بصفتها الكيان الأم النهائي.\nوالشاحنة الصغيرة التي لا تحمل إلا بضاعة مالك معفى تحصل على اللوحة نفسها إذا ملك المالك 95% منها على الأقل، أو 85% إذا كان كل ما تحمله تقريباً توزيعات أرباح ومكاسب حقوق ملكية مستبعدة. واللوحة تغطي المركبة لا القافلة خلفها: فالشركات التشغيلية المملوكة لمالك معفى تدفع الرسوم."]},"anchors":[{"if":["A group entity is owned by the state","كيان في المجموعة مملوك للدولة"],"then":["Run all four Governmental Entity tests; one commercial trade or business fails it (Art 13)","طبّق اختبارات الكيان الحكومي الأربعة كلها؛ فممارسة تجارة أو نشاط تجاري واحد تُسقطه (المادة 13)"]},{"if":["A holding vehicle sits under a pension fund, charity or state body","أداة قابضة تحت صندوق تقاعد أو جمعية خيرية أو جهة حكومية"],"then":["Test ownership by value: 95% and passive or ancillary, or 85% and almost all income excluded dividends or equity gains (Art 12(2))","اختبر الملكية بالقيمة: 95% ونشاط سلبي أو مساند، أو 85% وكل الدخل تقريباً توزيعات أو مكاسب حقوق ملكية مستبعدة (المادة 12 (2))"]},{"if":["The UPE is a regulated fund or a REIT-type vehicle","الكيان الأم النهائي صندوق منظم أو أداة عقارية"],"then":["Only the fund itself is excluded, and only as UPE; its portfolio companies are still tested (Art 12(1)(e)–(f))","لا يُستبعد إلا الصندوق نفسه، وبصفته كياناً أماً نهائياً فقط؛ وتبقى شركات محفظته خاضعة للاختبار (المادة 12 (1) (هـ)–(و))"]},{"if":["A charity runs a business unrelated to its purpose","جمعية خيرية تمارس نشاطاً تجارياً لا يتصل بغرضها"],"then":["It is not a non-profit organisation for the DMT (Art 15(2))","لا تُعد منظمة غير ربحية لأغراض النظام (المادة 15 (2))"]},{"if":["The group prefers to keep a 95% or 85% vehicle inside the computation","تفضّل المجموعة إبقاء أداة 95% أو 85% داخل الاحتساب"],"then":["Make the five-year election; it is locked for that year and the next four (Arts 12(3), 1)","قم باختيار الخمس سنوات؛ وهو ملزم لتلك السنة والسنوات الأربع التالية (المادتان 12 (3) و1)"]}],"diagrams":[{"type":"tree","title":["Is this entity excluded?","هل هذا الكيان مستبعد؟"],"root":{"q":["Is it a Governmental Entity, International Organisation, Non-profit Organisation or Pension Fund?","هل هو كيان حكومي أو منظمة دولية أو منظمة غير ربحية أو صندوق تقاعد؟"],"yes":{"end":["Excluded (Art 12(1)(a)–(d))","مستبعد (المادة 12 (1) (أ)–(د))"],"tone":"out"},"no":{"q":["Is it an Investment Fund or Real Estate Investment Vehicle that is the UPE?","هل هو صندوق استثمار أو أداة استثمارية عقارية بصفته الكيان الأم النهائي؟"],"yes":{"end":["Excluded (Art 12(1)(e)–(f))","مستبعد (المادة 12 (1) (هـ)–(و))"],"tone":"out"},"no":{"q":["Is ≥95% of its value held by excluded entities (not via a pension services entity), and does it only hold assets or invest for them, or do ancillary work?","هل تملك كيانات مستبعدة 95% على الأقل من قيمته (لا عبر كيان خدمات التقاعد)، ولا يقوم إلا بحيازة الأصول أو الاستثمار لها أو بأعمال مساندة؟"],"yes":{"end":["Excluded (Art 12(2)(a)), unless the five-year election is made","مستبعد (المادة 12 (2) (أ))، ما لم يُجرَ اختيار الخمس سنوات"],"tone":"out"},"no":{"q":["Is ≥85% held by excluded entities, with almost all income excluded dividends or excluded equity gains?","هل تملك كيانات مستبعدة 85% منه على الأقل، وكل دخله تقريباً توزيعات أرباح أو مكاسب حقوق ملكية مستبعدة؟"],"yes":{"end":["Excluded (Art 12(2)(b)), unless the five-year election is made","مستبعد (المادة 12 (2) (ب))، ما لم يُجرَ اختيار الخمس سنوات"],"tone":"out"},"no":{"end":["Not excluded: a constituent entity if it is in a Group","غير مستبعد: كيان تابع إذا كان ضمن مجموعة"],"tone":"in"}}}}}},{"type":"table","title":["The four Governmental Entity tests: all must be met","اختبارات الكيان الحكومي الأربعة: يجب استيفاؤها كلها"],"head":[["Test","الاختبار"],["What it requires (Art 13)","ما يتطلبه (المادة 13)"]],"rows":[[["Ownership","الملكية"],["Part of, or wholly owned by, a government, including a political subdivision or local authority","جزء من حكومة أو مملوك لها بالكامل، بما في ذلك أي تقسيم سياسي أو سلطة محلية"]],[["Purpose","الغرض"],["No trade or business; principal purpose is a government function, or managing or investing the government's or the jurisdiction's assets","لا يمارس تجارة أو نشاطاً تجارياً؛ وغرضه الرئيسي أداء وظيفة حكومية، أو إدارة أصول الحكومة أو الولاية أو استثمارها"]],[["Accountability","المساءلة"],["Accountable to the government on overall performance, with annual information reporting","مسؤول أمام الحكومة عن أدائه العام، مع تقديم تقارير معلومات سنوية"]],[["Assets and earnings","الأصول والأرباح"],["Assets vest in the government on dissolution; net earnings go only to the government, never to a private person","تؤول الأصول إلى الحكومة عند الحل؛ ولا يُوزَّع صافي الأرباح إلا على الحكومة، ولا يعود أي جزء منه بالنفع على شخص خاص"]]]}],"points":[{"h":["The six excluded entities","الكيانات المستبعدة الستة"],"t":["A Governmental Entity, an International Organisation, a Non-profit Organisation, a Pension Fund, an Investment Fund that is the UPE, and a Real Estate Investment Vehicle that is the UPE.","الكيان الحكومي، والمنظمة الدولية، والمنظمة غير الربحية، وصندوق التقاعد، وصندوق الاستثمار الذي يكون الكيان الأم النهائي، والأداة الاستثمارية العقارية التي تكون الكيان الأم النهائي."],"r":["12(1)"]},{"h":["The 95% vehicle","أداة الـ95%"],"t":["An entity at least 95% of whose value is owned, directly or through a chain of excluded entities, by those excluded entities (ownership through a pension services entity does not count), and that operates exclusively or almost exclusively to hold assets or invest funds for them, or only carries out activities ancillary to theirs.","كيان تملك الكيانات المستبعدة 95% على الأقل من قيمته، بشكل مباشر أو عبر سلسلة من الكيانات المستبعدة (ولا تُحتسب الملكية عبر كيان خدمات التقاعد)، ويعمل حصرياً أو شبه حصري لحيازة الأصول أو استثمار الأموال لصالحها، أو لا يمارس إلا أنشطة مساندة لأنشطتها."],"r":["12(2)"]},{"h":["The 85% vehicle","أداة الـ85%"],"t":["An entity at least 85% of whose value is owned the same way, provided that substantially all of its income is excluded dividends or excluded equity gains or losses that are left out of DMT income.","كيان تملك الكيانات المستبعدة 85% على الأقل من قيمته بالطريقة نفسها، شريطة أن يكون كل دخله تقريباً توزيعات أرباح مستبعدة أو مكاسب أو خسائر حقوق ملكية مستبعدة لا تدخل في دخل ضريبة الحد الأدنى المحلي."],"r":["12(2)","19(1)"]},{"h":["Opting back in","خيار العودة إلى الاحتساب"],"t":["The filing constituent entity may elect not to treat a 95% or 85% vehicle as excluded. It is a five-year election: it cannot be revoked for the election year or the next four; after a revocation, no new election for the next four years.","يجوز للكيان التابع المعين لتقديم الإقرار أن يختار عدم معاملة أداة الـ95% أو الـ85% ككيان مستبعد. وهو اختيار خمس سنوات: لا يجوز إلغاؤه لسنة الاختيار والسنوات الأربع التالية، وبعد الإلغاء لا يجوز إجراء اختيار جديد للسنوات الأربع التالية."],"r":["12(3)",1]},{"h":["Governmental entities and sovereign funds","الكيانات الحكومية والصناديق السيادية"],"t":["A Governmental Entity must pass four tests together: government ownership, no trade or business with a government or investment purpose, accountability with annual reporting, and assets and earnings that go only to the government. A sovereign wealth fund meeting the investment criterion is also ignored as a UPE.","يجب أن يستوفي الكيان الحكومي أربعة اختبارات معاً: الملكية الحكومية، وعدم ممارسة تجارة أو نشاط تجاري مع غرض حكومي أو استثماري، والمساءلة مع تقارير سنوية، وأن تؤول الأصول والأرباح إلى الحكومة وحدها. ويتم أيضاً تجاهل صندوق الثروة السيادي الذي يستوفي معيار الاستثمار بصفته كياناً أماً نهائياً."],"r":[13,"10(2)"]},{"h":["International organisations","المنظمات الدولية"],"t":["An intergovernmental or supranational organisation (or its wholly owned agency) that is made up primarily of governments, has a headquarters or similar agreement with its host jurisdiction, and whose income cannot benefit private persons.","منظمة حكومية دولية أو فوق وطنية (أو وكالة مملوكة لها بالكامل) تتألف أساساً من حكومات، ولها اتفاقية مقر أو ما يماثلها مع الولاية المضيفة، ولا يجوز أن يعود دخلها بالنفع على أشخاص خاصين."],"r":[14]},{"h":["Non-profit organisations","المنظمات غير الربحية"],"t":["Established and run exclusively for religious, charitable, scientific, artistic, cultural, athletic, educational or similar purposes (or as a professional body, chamber of commerce and the like), with income substantially exempt, no owners with a beneficial interest, no private benefit, and assets that pass to another non-profit or the government on dissolution. Running an unrelated trade or business takes it out.","تُنشأ وتُدار حصرياً لأغراض دينية أو خيرية أو علمية أو فنية أو ثقافية أو رياضية أو تعليمية أو ما يماثلها (أو كهيئة مهنية أو غرفة تجارية ونحوها)، ويكون دخلها معفى في معظمه، ولا ملاك لهم مصلحة انتفاعية، ولا منفعة خاصة، وتؤول أصولها عند الحل إلى منظمة غير ربحية أو إلى الحكومة. وممارسة نشاط تجاري لا يتصل بأغراضها تُخرجها من هذا الوصف."],"r":[15]},{"h":["Pension funds, investment funds and REIVs","صناديق التقاعد وصناديق الاستثمار والأدوات العقارية"],"t":["A Pension Fund includes a pension services entity. An Investment Fund must meet seven tests, including pooled assets from unconnected investors, a defined investment policy, regulation and professional management. A REIV is widely held, mainly holds immovable property, and is taxed once with at most one year's deferral.","يشمل صندوق التقاعد كيان خدمات التقاعد. ويجب أن يستوفي صندوق الاستثمار سبعة اختبارات، منها تجميع الأصول من مستثمرين بعضهم غير مرتبطين، وسياسة استثمار محددة، والخضوع للتنظيم، والإدارة المهنية. أما الأداة الاستثمارية العقارية فهي واسعة الملكية، وتحوز أساساً ممتلكات غير منقولة، وتخضع لمستوى واحد من الضريبة مع تأجيل لا يتجاوز سنة."],"r":[16,17,1]},{"h":["What exclusion means","ماذا يعني الاستبعاد"],"t":["An excluded entity is not a constituent entity, so its own income and taxes stay out of the computation. It does not take the companies it owns out with it.","الكيان المستبعد ليس كياناً تابعاً، فيبقى دخله وضرائبه خارج الاحتساب. لكنه لا يُخرج معه الشركات التي يملكها."],"r":["9(3)"]}],"oecd":[{"t":["The list of excluded entities, the 95% and 85% tests and the five-year election to opt out follow GloBE Article 1.5. The definitions of each kind of entity follow Article 10.1.","تتبع قائمة الكيانات المستبعدة واختبارا 95% و85% واختيار الخمس سنوات للعدول عن الاستبعاد المادة 1.5 من القواعد النموذجية، وتتبع تعريفات كل نوع المادة 10.1."],"src":["Model Rules Arts 1.5 and 10.1","القواعد النموذجية: المادتان 1.5 و10.1"]}],"reflect":{"ref":["An-Nisa 4:58","النساء: 58"],"ayah":"إن الله يأمركم أن تؤدوا الأمانات إلى أهلها","t":["Allah commands you to render trusts to those they are due. The draft excludes pension funds, charities and state funds because what they hold is held for others: retirees, beneficiaries, the public. An exemption built on a trust is itself a trust; claim it only where the facts truly fit.","إن الله يأمركم أن تؤدوا الأمانات إلى أهلها. يستبعد المشروع صناديق التقاعد والجمعيات الخيرية والصناديق الحكومية لأن ما تحوزه محفوظ لغيرها: المتقاعدين والمستفيدين وعموم الناس. والإعفاء القائم على الأمانة أمانة بذاته، فلا يُطالَب به إلا حيث تنطبق الوقائع حقاً."]},"cases":[{"t":["The pension fund's investment vehicle","الأداة الاستثمارية لصندوق التقاعد"],"facts":["A Saudi pension fund that meets Article 16 owns 97% (by value) of PF Invest Co; an unrelated investor owns the other 3%. PF Invest only holds a portfolio of listed shares and bonds for the pension fund and has no other activity.","يملك صندوق تقاعد سعودي يستوفي المادة 16 نسبة 97% (بالقيمة) من شركة صندوق الاستثمار، ويملك مستثمر غير مرتبط نسبة 3% الباقية. ولا تقوم الشركة إلا بحيازة محفظة من الأسهم المدرجة والسندات لصالح صندوق التقاعد، ولا نشاط آخر لها."],"steps":[{"t":["The owner is an excluded entity: a Pension Fund (Art 12(1)(d)).","المالك كيان مستبعد: صندوق تقاعد (المادة 12 (1) (د))."]},{"t":["Ownership by value against the 95% threshold, in percentage points above it:","الملكية بالقيمة مقارنة بحد 95%، بالنقاط المئوية التي تتجاوزه:"],"x":"97-95","v":2,"u":"%"},{"t":["Activity: it operates exclusively to hold assets and invest funds for the pension fund.","النشاط: تعمل حصرياً لحيازة الأصول واستثمار الأموال لصالح صندوق التقاعد."]}],"ans":["PF Invest is an excluded entity under the 95% rule, so it is not a constituent entity. The filing entity could elect (a five-year election) to treat it as not excluded. At 90% ownership it would fail the 95% test and would have to pass the 85% test instead, which needs substantially all income to be excluded dividends or equity gains; bond interest would make that hard.","شركة صندوق الاستثمار كيان مستبعد وفق قاعدة 95%، فليست كياناً تابعاً. ويجوز للكيان المعين لتقديم الإقرار أن يختار (اختيار خمس سنوات) معاملتها ككيان غير مستبعد. ولو كانت الملكية 90% لفشلت في اختبار 95% ولتعيّن عليها اجتياز اختبار 85%، الذي يتطلب أن يكون كل الدخل تقريباً توزيعات أو مكاسب حقوق ملكية مستبعدة؛ وفوائد السندات تجعل ذلك صعباً."],"r":["12(1)","12(2)","12(3)"]},{"t":["Two state-owned entities, two answers","كيانان مملوكان للدولة ونتيجتان مختلفتان"],"facts":["Both are 100% owned by a government:\n• National Investment Authority: no trade or business; it manages and invests the state's assets, reports annually to the government, and its assets and earnings belong only to the state.\n• National Air Co: runs commercial passenger flights for profit.","كلاهما مملوك بالكامل لحكومة:\n• هيئة الاستثمار الوطنية: لا تمارس تجارة أو نشاطاً تجارياً؛ تدير أصول الدولة وتستثمرها، وتقدّم تقارير سنوية إلى الحكومة، وأصولها وأرباحها للدولة وحدها.\n• شركة الطيران الوطنية: تشغّل رحلات ركاب تجارية بهدف الربح."],"steps":[{"t":["National Investment Authority: ownership ✓, purpose ✓ (investing government assets, no business), accountability ✓, assets and earnings ✓.","هيئة الاستثمار الوطنية: الملكية ✓، والغرض ✓ (استثمار أصول الحكومة دون نشاط تجاري)، والمساءلة ✓، والأصول والأرباح ✓."]},{"t":["So it is a Governmental Entity and excluded. As a sovereign fund meeting the investment criterion, it is also ignored as a UPE.","فهي كيان حكومي مستبعد. وبصفتها صندوقاً سيادياً يستوفي معيار الاستثمار، يتم تجاهلها أيضاً بوصفها كياناً أماً نهائياً."]},{"t":["National Air Co: it carries on a trade or business, so it fails the purpose test.","شركة الطيران الوطنية: تمارس نشاطاً تجارياً، فتفشل في اختبار الغرض."]}],"ans":["The Authority is excluded; the airline is not. The airline is an ordinary company: if it heads, or belongs to, an MNE group over the threshold, its Saudi entities are in scope. State ownership alone never excludes a commercial company.","الهيئة مستبعدة، وشركة الطيران ليست كذلك. فهي شركة عادية: إذا ترأست مجموعة متعددة الجنسيات تتجاوز الحد أو انتمت إليها، خضعت كياناتها في المملكة للنظام. والملكية الحكومية وحدها لا تستبعد أي شركة تجارية."],"r":[13,"12(1)","10(2)"]},{"t":["The five-year election clock","ساعة اختيار الخمس سنوات"],"facts":["In FY2027 the filing entity elects not to treat a 96%-owned holding vehicle as excluded. In FY2031 the group wants to revoke the election. Calendar fiscal years.","في السنة المالية 2027م اختار الكيان المعين لتقديم الإقرار عدم معاملة أداة قابضة مملوكة بنسبة 96% ككيان مستبعد. وفي السنة المالية 2031م تريد المجموعة إلغاء الاختيار. السنوات المالية تقويمية."],"steps":[{"t":["A five-year election cannot be revoked for the election year or the four years after it. Last locked year:","لا يجوز إلغاء اختيار الخمس سنوات لسنة الاختيار أو السنوات الأربع التالية لها. آخر سنة ملزمة:"],"x":"2027+4","v":2031,"u":"yr"},{"t":["So the first year it can be revoked for:","فأول سنة يجوز الإلغاء عنها:"],"x":"2031+1","v":2032,"u":"yr"},{"t":["After revoking for FY2032, no new election for the four years after the revocation year. Earliest new election:","بعد الإلغاء للسنة المالية 2032م، لا يجوز إجراء اختيار جديد للسنوات الأربع التالية لسنة الإلغاء. أقرب اختيار جديد:"],"x":"2032+4+1","v":2037,"u":"yr"}],"ans":["Not for FY2031: the election is locked from 2027 to 2031. The group can revoke for FY2032 at the earliest, and could then make a new election only from FY2037, unless the Law or Regulations set other revocation rules.","لا يجوز للسنة المالية 2031م، فالاختيار ملزم من 2027م إلى 2031م. ويجوز للمجموعة الإلغاء للسنة المالية 2032م كأقرب موعد، ولا يجوز لها بعد ذلك إجراء اختيار جديد إلا اعتباراً من السنة المالية 2037م، ما لم ينص النظام أو اللائحة على قواعد أخرى للإلغاء."],"r":["12(3)",1]}],"quiz":[{"q":["Which of these is NOT an excluded entity under Article 12(1)?","أي مما يلي ليس كياناً مستبعداً وفق المادة 12 (1)؟"],"o":[["A Governmental Entity","كيان حكومي"],["A Pension Fund","صندوق تقاعد"],["An Investment Fund that is a subsidiary in the group, not the UPE","صندوق استثمار تابع في المجموعة وليس الكيان الأم النهائي"],["A Non-profit Organisation","منظمة غير ربحية"]],"a":2,"e":["Investment funds and REIVs are excluded only when they are the UPE (Art 12(1)(e)–(f)). A fund lower down the chain is tested like any other entity.","لا تُستبعد صناديق الاستثمار والأدوات العقارية إلا إذا كانت الكيان الأم النهائي (المادة 12 (1) (هـ)–(و)). أما الصندوق الأدنى في السلسلة فيُختبر كأي كيان آخر."],"r":["12(1)"]},{"q":["What two things does the 95% rule require?","ما الأمران اللذان تتطلبهما قاعدة 95%؟"],"o":[["95% of votes held by any shareholders, and a profit","95% من حقوق التصويت لأي مساهمين، وتحقيق ربح"],["At least 95% of value held by excluded entities (not via a pension services entity), and only holding assets or investing for them, or ancillary activity","تملك الكيانات المستبعدة 95% على الأقل من القيمة (لا عبر كيان خدمات التقاعد)، ولا نشاط إلا حيازة الأصول أو الاستثمار لها أو نشاط مساند"],["95% of income from dividends, and a listing","95% من الدخل من توزيعات، والإدراج"],["95% Saudi ownership, and ZATCA approval","ملكية سعودية بنسبة 95%، وموافقة الهيئة"]],"a":1,"e":["Article 12(2)(a): an ownership-by-value test plus an activity test.","المادة 12 (2) (أ): اختبار للملكية بالقيمة واختبار للنشاط."],"r":["12(2)"]},{"q":["An entity is 88% owned by a charity. What lets it be excluded?","كيان تملك جمعية خيرية 88% منه. ما الذي يجعله مستبعداً؟"],"o":[["Nothing; it is below 95%","لا شيء؛ فهو دون 95%"],["Substantially all of its income being excluded dividends or excluded equity gains or losses","أن يكون كل دخله تقريباً توزيعات أرباح أو مكاسب أو خسائر حقوق ملكية مستبعدة"],["Being Saudi-resident","أن يكون مقيماً في المملكة"],["Paying Zakat","أن يدفع الزكاة"]],"a":1,"e":["Article 12(2)(b): at 85% or more, the entity is excluded if substantially all its income is excluded dividends or excluded equity gains or losses left out of DMT income.","المادة 12 (2) (ب): عند 85% أو أكثر يُستبعد الكيان إذا كان كل دخله تقريباً توزيعات أو مكاسب أو خسائر حقوق ملكية مستبعدة لا تدخل في الدخل."],"r":["12(2)"]},{"q":["Who can elect not to treat a 95% or 85% vehicle as excluded, and for how long?","من يحق له اختيار عدم معاملة أداة 95% أو 85% ككيان مستبعد، ولأي مدة؟"],"o":[["ZATCA, for one year","الهيئة، لسنة واحدة"],["The filing constituent entity, as a five-year election","الكيان التابع المعين لتقديم الإقرار، كاختيار خمس سنوات"],["The vehicle's board, permanently","مجلس إدارة الأداة، بشكل دائم"],["The UPE, as an annual election","الكيان الأم النهائي، كاختيار سنوي"]],"a":1,"e":["Article 12(3): the election belongs to the filing constituent entity and is a five-year election as defined in Article 1.","المادة 12 (3): الاختيار للكيان التابع المعين لتقديم الإقرار، وهو اختيار خمس سنوات كما تعرّفه المادة 1."],"r":["12(3)",1]},{"q":["A five-year election is revoked for FY2032. When is a new election possible?","أُلغي اختيار خمس سنوات للسنة المالية 2032م. متى يمكن إجراء اختيار جديد؟"],"o":[["FY2033","السنة المالية 2033م"],["FY2037","السنة المالية 2037م"],["Never","أبداً"],["FY2035","السنة المالية 2035م"]],"a":1,"e":["Article 1: after revocation, no new election for the four fiscal years after the revocation year (2033–2036), so FY2037, unless specific provisions say otherwise.","المادة 1: بعد الإلغاء، لا يجوز إجراء اختيار جديد للسنوات المالية الأربع التالية لسنة الإلغاء (2033–2036)، فيكون ذلك في السنة المالية 2037م، ما لم تنص أحكام خاصة على غير ذلك."],"r":[1]},{"q":["A 100% state-owned company runs a commercial business. Is it a Governmental Entity?","شركة مملوكة بالكامل للدولة تمارس نشاطاً تجارياً. هل هي كيان حكومي؟"],"o":[["Yes, full state ownership is enough","نعم، فالملكية الحكومية الكاملة تكفي"],["No, carrying on a trade or business fails the test","لا، فممارسة تجارة أو نشاط تجاري تُسقط الاختبار"],["Only if it is loss-making","فقط إذا كانت خاسرة"],["Only if ZATCA agrees","فقط إذا وافقت الهيئة"]],"a":1,"e":["Article 13(2) requires that the entity does not carry on a trade or business. All four tests must be met together.","تتطلب المادة 13 (2) ألا يمارس الكيان تجارة أو نشاطاً تجارياً، ويجب استيفاء الاختبارات الأربعة معاً."],"r":[13]},{"q":["A charity also runs a hotel business unrelated to its charitable purposes. Is it a Non-profit Organisation for the DMT?","جمعية خيرية تدير أيضاً نشاطاً فندقياً لا يتصل بأغراضها
