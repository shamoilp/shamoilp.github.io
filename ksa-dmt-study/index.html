x claimed in a return stays in covered taxes","لا شيء: فالضريبة المطالب بها في الإقرار تبقى في الضرائب المشمولة"],["The unpaid amount is deducted from FY2030 covered taxes instead","يُخصم المبلغ غير المسدد من الضرائب المشمولة لعام 2030م بدلاً من ذلك"],["FY2027 is recalculated once ZATCA issues an assessment","يُعاد احتساب 2027م عندما تصدر الهيئة ربطاً"],["FY2027's ETR and top-up tax are recalculated without the unpaid amount","يُعاد احتساب معدل 2027م وضريبتها التكميلية دون المبلغ غير المسدد"]],"a":3,"e":["Article 52(8); any extra top-up is additional current top-up tax (Art 63(2)).","المادة 52 (8)؛ وأي زيادة ضريبة تكميلية حالية إضافية (المادة 63 (2))."],"r":["52(8)","63(2)"]},{"q":["When must excess negative tax expense be excluded and carried forward?","متى يجب استبعاد المصروف الضريبي السالب الزائد وترحيله؟"],"o":[["Only by election, and only where the top-up percentage would exceed 15%","بالاختيار فقط، وفقط إذا كانت نسبة الضريبة التكميلية ستتجاوز 15%"],["By election only; it is never compulsory under the draft","بالاختيار فقط؛ ولا يكون إلزامياً أبداً وفق المشروع"],["Always, whatever the top-up percentage, with ZATCA's approval","دائماً، أياً كانت نسبة الضريبة التكميلية، بموافقة الهيئة"],["By election, and always where the top-up percentage would exceed 15%","بالاختيار، ودائماً إذا كانت نسبة الضريبة التكميلية ستتجاوز 15%"]],"a":3,"e":["Article 44(2): the group may elect to exclude excess negative tax expense and carry it forward, and must do so where the Kingdom's top-up percentage would exceed 15%. Article 47 measures the amount.","المادة 44 (2): يجوز للمجموعة اختيار استبعاد المصروف الضريبي السالب الزائد وترحيله، ويجب ذلك إذا كانت نسبة الضريبة التكميلية للمملكة ستتجاوز 15%. وتحدد المادة 47 المبلغ."],"r":["44(2)",47]}],"cards":[{"f":["Covered taxes: three kinds","الضرائب المشمولة: ثلاثة أنواع"],"b":["On income or profits; in lieu of corporate income tax; on retained earnings and equity, Zakat included.","على الدخل أو الأرباح؛ وبدلاً من ضريبة الدخل على الشركات؛ وعلى الأرباح المحتجزة وحقوق الملكية، ومنها الزكاة."],"r":["42(1)"]},{"f":["Not covered taxes","ضرائب غير مشمولة"],"b":["IIR and QDMTT top-up tax, UTPR adjustment taxes, insurers' taxes on policyholder returns.","الضرائب التكميلية بموجب قاعدة تضمين الدخل والضريبة المحلية المؤهلة، وضرائب تعديل قاعدة الأرباح منخفضة الضريبة، وضرائب شركات التأمين على عوائد حاملي الوثائق."],"r":["42(2)"]},{"f":["Tax (definition)","الضريبة (تعريف)"],"b":["A compulsory unrequited payment to General Government.","سداد إلزامي بلا مقابل للإدارات الحكومية."],"r":["42(3)"]},{"f":["Adjusted Covered Taxes","الضرائب المشمولة المعدلة"],"b":["Current tax expense + additions − reductions ± deferred tax adjustment ± equity/OCI taxes; once only.","مصروف الضريبة الحالية + الإضافات − التخفيضات ± تعديل الضريبة المؤجلة ± ضرائب حقوق الملكية والدخل الشامل الآخر؛ مرة واحدة فقط."],"r":["44(1)","44(3)"]},{"f":["Additions to covered taxes","الإضافات إلى الضرائب المشمولة"],"b":["Taxes above profit before tax; uncertain positions paid later; QRTCs and MTTCs booked against tax.","الضرائب قبل الربح قبل الضريبة؛ والمراكز غير المؤكدة المسددة لاحقاً؛ والائتمانات المؤهلة والقابلة للتداول المقيدة مقابل الضريبة."],"r":["45(1)"]},{"f":["Reductions to covered taxes","التخفيضات من الضرائب المشمولة"],"b":["Tax on excluded income; non-qualifying credits; off-line refunds; uncertain positions; tax unpaid within 3 years.","ضريبة الدخل المستبعد؛ والائتمانات غير المؤهلة؛ والاستردادات خارج بند الضريبة؛ والمراكز غير المؤكدة؛ والضريبة غير المسددة خلال 3 سنوات."],"r":["46(1)"]},{"f":["Excess negative tax expense","المصروف الضريبي السالب الزائد"],"b":["Excluded and carried forward, at election or where the top-up % would exceed 15%.","يُستبعد ويُرحّل، باختيار أو إذا تجاوزت نسبة الضريبة التكميلية 15%."],"r":["44(2)",47]},{"f":["Disqualified Refundable Imputation Tax","ضريبة الإسناد غير المؤهلة القابلة للاسترداد"],"b":["Tax refundable or creditable to a dividend's owner (beyond that dividend), or refundable to the payer on distribution.","ضريبة قابلة للاسترداد أو الخصم لمالك التوزيعات (خارج تلك التوزيعات)، أو قابلة للاسترداد للموزِّع عند التوزيع."],"r":[43]},{"f":["Post-filing increase","زيادة لاحقة للإقرار"],"b":["Booked as a covered-tax adjustment in the year it is made.","تُدرج كتعديل للضرائب المشمولة في سنة إجرائها."],"r":["52(1)"]},{"f":["Post-filing decrease","تخفيض لاحق للإقرار"],"b":["Reopens the earlier year's ETR and top-up; immaterial (< €1m) may go to the current year by annual election.","يعيد فتح معدل السنة السابقة وضريبتها التكميلية؛ ويجوز إدراج غير الجوهري (أقل من مليون يورو) في السنة الحالية باختيار سنوي."],"r":["52(2)","52(4)","52(5)"]},{"f":["Unpaid tax rule","قاعدة الضريبة غير المسددة"],"b":["Over €1m of current tax unpaid after 3 years: recalculate that year without it.","أكثر من مليون يورو من الضريبة الحالية غير مسدد بعد 3 سنوات: يُعاد احتساب تلك السنة دونه."],"r":["52(8)"]},{"f":["Allocating covered taxes between entities","تخصيص الضرائب المشمولة بين الكيانات"],"b":["Left to the Regulations.","متروك للائحة."],"r":[48]}],"terms":[{"t":["Covered taxes","الضرائب المشمولة"],"d":["Taxes on income and profits, taxes in place of them, and taxes on equity such as Zakat.","الضرائب على الدخل والأرباح، والضرائب البديلة عنها، والضرائب على حقوق الملكية مثل الزكاة."]},{"t":["Zakat","الزكاة"],"d":["Levied by the Kingdom on companies; the draft lists it as a covered tax.","تفرضها المملكة على الشركات؛ وينص المشروع على أنها من الضرائب المشمولة."]},{"t":["Adjusted covered taxes","الضرائب المشمولة المعدلة"],"d":["The tax figure on top of the ETR fraction, after the adjustments.","رقم الضرائب في بسط كسر المعدل الفعلي، بعد التعديلات."]},{"t":["Deferred tax","الضريبة المؤجلة"],"d":["Tax booked now for timing differences that reverse later.","ضريبة تُقيد الآن عن فروق توقيت تنعكس لاحقاً."]},{"t":["Uncertain tax position","المركز الضريبي غير المؤكد"],"d":["A disputed tax amount held as a provision; it counts only once paid.","مبلغ ضريبي متنازع عليه ومكوَّن له مخصص؛ لا يُحتسب إلا عند سداده."]},{"t":["Excess negative tax expense","المصروف الضريبي السالب الزائد"],"d":["Negative taxes set aside and carried forward to later years.","ضرائب سالبة تُجنَّب وتُرحَّل إلى السنوات اللاحقة."]},{"t":["Top-up tax","الضريبة التكميلية"],"d":["The extra tax that lifts the rate to 15%.","الضريبة الإضافية التي ترفع المعدل إلى 15%."]}],"range":"42–48, 52"},{"id":9,"title":["Deferred tax: timing without double counting","الضريبة المؤجلة: التوقيت دون ازدواج"],"goal":["Compute the total deferred tax adjustment at no more than 15%, apply the exclusions and the five-year recapture, and bring deferred tax attributes in on transition.","احتساب إجمالي تعديل الضريبة المؤجلة بما لا يتجاوز 15%، وتطبيق الاستثناءات والاسترداد بعد خمس سنوات، وإدخال السمات الضريبية المؤجلة عند الانتقال."],"parts":[4,11],"arts":[49,50,51,103],"time":35,"metaphor":{"title":["A promissory note","سند لأمر"],"text":["A deferred tax liability is a promise to pay tax later. The draft accepts the promise today, so a timing difference does not make the Kingdom look low-taxed, but on three conditions: the promise is valued at no more than 15%, it is the right kind of promise, and it is kept within five years. Some promises are trusted without a deadline, such as tax depreciation on plant and machinery.\nA deferred tax asset is the mirror image: tax already paid, or a loss already suffered, that will lower tax later.","الالتزام الضريبي المؤجل وعدٌ بسداد الضريبة لاحقاً. ويقبل مشروع النظام الوعد اليوم، حتى لا يجعل فرق التوقيت المملكة تبدو منخفضة الضريبة، ولكن بثلاثة شروط: أن يُقيَّم الوعد بما لا يزيد على 15%، وأن يكون من النوع الصحيح، وأن يُوفى به خلال خمس سنوات. وبعض الوعود يوثق بها دون أجل، مثل الاستهلاك الضريبي للمصانع والآلات.\nأما الأصل الضريبي المؤجل فهو الصورة المقابلة: ضريبة سُددت أو خسارة وقعت، وستخفض الضريبة لاحقاً."]},"anchors":[{"if":["Deferred tax is booked at the 20% Saudi income tax rate","الضريبة المؤجلة مقيدة بمعدل ضريبة الدخل في المملكة 20%"],"then":["Recast it at 15% (Art 49(2))","أعد احتسابها بنسبة 15% (المادة 49 (2))"]},{"if":["A deferred tax liability has not reversed after five years","التزام ضريبي مؤجل لم ينعكس بعد خمس سنوات"],"then":["Unless it is a recapture exception accrual, cut covered taxes of the year it was claimed and recalculate (Arts 49(5)–(7), 50)","ما لم يكن من الاستحقاقات المستثناة من الاسترداد، اخفض ضرائب السنة التي طولب به فيها وأعد الاحتساب (المادتان 49 (5)–(7) و50)"]},{"if":["Deferred tax relates to an uncertain tax position or to distributions","الضريبة المؤجلة تتعلق بمركز ضريبي غير مؤكد أو بتوزيعات"],"then":["Leave it out: it is a disallowed accrual (Arts 49(3)(b), 51)","استبعدها: فهي استحقاق غير مسموح به (المادتان 49 (3) (ب) و51)"]},{"if":["The group enters the law with deferred tax on its balance sheet","تدخل المجموعة النظام وفي ميزانيتها ضرائب مؤجلة"],"then":["Bring it in at the lower of 15% and the domestic rate, ignoring valuation allowances (Art 103)","أدخلها بالأقل من 15% والمعدل المحلي، متجاهلاً مخصصات التقييم (المادة 103)"]}],"diagrams":[{"type":"table","title":["Deferred tax items: in, out or recaptured?","بنود الضريبة المؤجلة: داخلة أم مستبعدة أم مستردة؟"],"head":[["Item","البند"],["Treatment","المعالجة"]],"rows":[[["Deferred tax expense at 15% or less","مصروف ضريبة مؤجلة بنسبة 15% أو أقل"],["Taken as booked (Art 49(1))","يؤخذ كما هو مقيد (المادة 49 (1))"]],[["Deferred tax expense above 15%, such as Saudi CIT at 20%","مصروف ضريبة مؤجلة بأكثر من 15%، مثل ضريبة الدخل في المملكة 20%"],["Recast at 15% (Art 49(2))","يُعاد احتسابه بنسبة 15% (المادة 49 (2))"]],[["Deferred tax on items excluded from DMT income","الضريبة المؤجلة على بنود مستبعدة من الدخل"],["Out (Art 49(3)(a))","مستبعدة (المادة 49 (3) (أ))"]],[["Disallowed accruals and unclaimed accruals","الاستحقاقات غير المسموح بها وغير المطالب بها"],["Out (Arts 49(3)(b), 49(8), 51)","مستبعدة (المواد 49 (3) (ب) و49 (8) و51)"]],[["Valuation allowances and recognition adjustments on deferred tax assets","مخصصات التقييم وتعديلات الإثبات على الأصول الضريبية المؤجلة"],["Out (Art 49(3)(c))","مستبعدة (المادة 49 (3) (ج))"]],[["Remeasurement after a change in the domestic tax rate","إعادة القياس بعد تغيير معدل الضريبة المحلي"],["Out here; dealt with under Art 52(6)–(7)","مستبعدة هنا؛ وتُعالج وفق المادة 52 (6)–(7)"]],[["Deferred tax on generating and using tax credits","الضريبة المؤجلة على نشوء الائتمانات الضريبية واستخدامها"],["Out (Art 49(3)(e))","مستبعدة (المادة 49 (3) (هـ))"]],[["A liability not reversed within five years that is not a recapture exception accrual","التزام لم ينعكس خلال خمس سنوات وليس من الاستحقاقات المستثناة"],["Recaptured (Art 49(5)–(7))","يُسترد (المادة 49 (5)–(7))"]]]},{"type":"flow","title":["The five-year recapture clock","ساعة الاسترداد ذات السنوات الخمس"],"nodes":[{"t":["FY2027","2027م"],"s":["a deferred tax liability increase is counted in covered taxes","تُحتسب زيادة الالتزام الضريبي المؤجل ضمن الضرائب المشمولة"]},{"t":["FY2028 to FY2032","من 2028م إلى 2032م"],"s":["the five subsequent years to reverse","السنوات الخمس اللاحقة للانعكاس"]},{"t":["End of FY2032","نهاية 2032م"],"s":["any unreversed part, unless an exception, is recaptured","أي جزء لم ينعكس، ما لم يكن مستثنى، يُسترد"]},{"t":["Back to FY2027","العودة إلى 2027م"],"s":["reduce its covered taxes, recalculate ETR and top-up","تخفيض ضرائبها المشمولة وإعادة احتساب المعدل والضريبة التكميلية"]},{"t":["Charge in FY2032","التحميل في 2032م"],"s":["extra top-up is additional current top-up tax","الزيادة ضريبة تكميلية حالية إضافية"]}],"quick":true}],"points":[{"h":["The basic rule","القاعدة الأساسية"],"t":["The total deferred tax adjustment is the deferred tax expense in the accounts for covered taxes. If it was computed at 15% or less, take it as booked; if at more than 15%, recalculate it at 15%. A Saudi income tax payer books deferred tax at 20%, so it is recast.","إجمالي تعديل الضريبة المؤجلة هو مصروف الضريبة المؤجلة في الحسابات للضرائب المشمولة. فإن احتُسب بنسبة 15% أو أقل يؤخذ كما قُيد، وإن احتُسب بأكثر من 15% يُعاد احتسابه بنسبة 15%. ودافع ضريبة الدخل في المملكة يقيد الضريبة المؤجلة بنسبة 20%، فيُعاد احتسابها."],"r":["49(1)","49(2)"],"p":["Count deferred tax as booked, capped at 15%; Saudi figures at 20% are recalculated.","احتسب الضريبة المؤجلة كما قُيدت، بحد أقصى 15%؛ ويُعاد احتساب الأرقام السعودية المقيدة بنسبة 20%."]},{"h":["Five things left out","خمسة أمور مستبعدة"],"t":["Leave out deferred tax on items excluded from DMT income; on disallowed and unclaimed accruals; valuation allowances and recognition adjustments on deferred tax assets; remeasurement after a domestic rate change; and deferred tax on generating and using tax credits.","تُستبعد الضريبة المؤجلة على البنود المستبعدة من الدخل؛ وعلى الاستحقاقات غير المسموح بها وغير المطالب بها؛ ومخصصات التقييم وتعديلات الإثبات على الأصول الضريبية المؤجلة؛ وإعادة القياس بعد تغيير المعدل المحلي؛ والضريبة المؤجلة على نشوء الائتمانات الضريبية واستخدامها."],"r":["49(3)"],"p":["Leave out five items, such as deferred tax on excluded income and write-downs of tax assets.","استبعد خمسة أمور، مثل الضريبة المؤجلة على الدخل المستبعد وتخفيضات الأصول الضريبية."]},{"h":["Loss assets at a low rate","أصول الخسائر بمعدل منخفض"],"t":["A deferred tax asset recorded at below 15% may be recalculated at 15% in the same year if the entity shows that it is attributable to a DMT loss.","يجوز إعادة احتساب الأصل الضريبي المؤجل المقيد بأقل من 15% بنسبة 15% في السنة نفسها إذا أثبت الكيان أنه منسوب إلى خسارة لأغراض النظام."],"r":["49(4)"],"p":["A loss asset booked below 15% can be lifted to 15%.","يجوز رفع أصل الخسارة المقيد بأقل من 15% إلى 15%."]},{"h":["The five-year recapture","الاسترداد بعد خمس سنوات"],"t":["A deferred tax liability counted in covered taxes that has not reversed by the end of the fifth following year is recaptured: it reduces the covered taxes of that earlier year, whose ETR and top-up tax are recalculated, unless it is a recapture exception accrual.","الالتزام الضريبي المؤجل المحتسب ضمن الضرائب المشمولة الذي لم ينعكس بنهاية السنة الخامسة التالية يُسترد: فيخفض الضرائب المشمولة لتلك السنة السابقة، ويُعاد احتساب معدلها وضريبتها التكميلية، ما لم يكن من الاستحقاقات المستثناة من الاسترداد."],"r":["49(5)","49(6)","49(7)"],"p":["A liability not reversed within five years is taken back, and the old year is recalculated.","الالتزام الذي لا ينعكس خلال خمس سنوات يُسترد، ويُعاد احتساب السنة الأصلية."]},{"h":["Recapture exception accruals","الاستحقاقات المستثناة من الاسترداد"],"t":["No recapture applies to deferred tax liabilities from: cost recovery on tangible assets; government licences for immovable property or natural resources with significant tangible investment; research and development; decommissioning and remediation; fair value net gains; foreign exchange net gains; insurance reserves and deferred acquisition costs; reinvested gains on local tangible property; and accounting changes on these.","لا يُطبق الاسترداد على الالتزامات الضريبية المؤجلة الناشئة عن: استرداد تكلفة الأصول الملموسة؛ والتراخيص الحكومية لاستخدام العقارات أو استغلال الموارد الطبيعية المتضمنة استثماراً كبيراً في أصول ملموسة؛ والبحث والتطوير؛ وإيقاف التشغيل والإصلاح البيئي؛ وصافي مكاسب القيمة العادلة؛ وصافي مكاسب الصرف الأجنبي؛ واحتياطيات التأمين وتكاليف الاقتناء المؤجلة؛ ومكاسب الممتلكات الملموسة المحلية المعاد استثمارها؛ والتغييرات المحاسبية في هذه الفئات."],"r":[50],"p":["Some long-lived items, such as plant depreciation, are never taken back.","بعض البنود طويلة الأجل، مثل استهلاك المصانع، لا تُسترد أبداً."]},{"h":["Disallowed and unclaimed accruals","الاستحقاقات غير المسموح بها وغير المطالب بها"],"t":["A disallowed accrual is a deferred tax movement relating to an uncertain tax position or to distributions from a constituent entity. An unclaimed accrual is a liability increase not expected to be paid within the five-year window, which the filing entity elects each year to leave out.","الاستحقاق غير المسموح به حركة في الضريبة المؤجلة تتعلق بمركز ضريبي غير مؤكد أو بتوزيعات من كيان تابع. والاستحقاق غير المطالب به زيادة في الالتزام لا يُتوقع سدادها خلال فترة السنوات الخمس، ويختار الكيان المقدم للإقرار سنوياً عدم إدراجها."],"r":[51,"49(8)"],"p":["Disputed and distribution-related items stay out; so can accruals not paid within five years, by election.","تبقى البنود المتنازع عليها والمرتبطة بالتوزيعات خارج الاحتساب؛ وكذلك الاستحقاقات غير المسددة خلال خمس سنوات، بالاختيار."]},{"h":["Tax rate changes","تغيير معدلات الضريبة"],"t":["If the domestic rate is cut below 15% and that creates deferred tax expense, the expense adjusts covered taxes of the earlier years. Deferred tax expense from a rate increase adjusts earlier years only when paid, and only up to the amount recalculated at 15%.","إذا خُفض المعدل المحلي إلى أقل من 15% ونشأ عن ذلك مصروف ضريبة مؤجلة، فإنه يعدّل الضرائب المشمولة للسنوات السابقة. أما مصروف الضريبة المؤجلة الناتج عن زيادة المعدل فيعدّل السنوات السابقة عند سداده فقط، وبما لا يتجاوز المبلغ المعاد احتسابه بنسبة 15%."],"r":["52(6)","52(7)"],"p":["A rate cut below 15% adjusts earlier years; a rate rise does so only when paid.","خفض السعر إلى ما دون 15% يعدّل السنوات السابقة؛ أما رفعه فلا يعدّلها إلا عند السداد."]},{"h":["Entering the law: tax attributes","دخول النظام: السمات الضريبية"],"t":["In the transition year the group takes into account all deferred tax assets and liabilities reflected or disclosed in the accounts of its Saudi entities, at the lower of 15% and the domestic rate, ignoring valuation and recognition adjustments. A loss asset recorded below 15% can be taken at 15% if the loss would have been a DMT loss.","في سنة الانتقال تأخذ المجموعة في الاعتبار جميع الأصول والالتزامات الضريبية المؤجلة الظاهرة أو المفصح عنها في حسابات كياناتها في المملكة، بالأقل من 15% والمعدل المحلي، متجاهلة تعديلات التقييم والإثبات. ويجوز أخذ أصل الخسائر المقيد بأقل من 15% بنسبة 15% إذا كانت الخسارة ستُعد خسارة لأغراض النظام."],"r":["103(1)","103(2)"],"p":["On entry, bring in existing deferred tax at the lower of 15% and the local rate.","عند الدخول، أدرج الضريبة المؤجلة القائمة بالأقل من 15% والسعر المحلي."]},{"h":["The 30 November 2021 cut-off","تاريخ 30 نوفمبر 2021م الفاصل"],"t":["Deferred tax assets from items excluded from DMT income are ignored if they were generated in a transaction after 30 November 2021. Assets (other than inventory) moved between group entities after that date and before the transition year keep the seller's carrying value as their basis.","تُتجاهل الأصول الضريبية المؤجلة الناشئة عن بنود مستبعدة من الدخل إذا نشأت في معاملة بعد 30 نوفمبر 2021م. وتحتفظ الأصول (عدا المخزون) المنقولة بين كيانات المجموعة بعد ذلك التاريخ وقبل سنة الانتقال بالقيمة الدفترية لدى البائع أساساً لها."],"r":["103(3)","103(4)"],"p":["Tax assets created after 30 November 2021 on excluded items are ignored.","تُتجاهل الأصول الضريبية الناشئة بعد 30 نوفمبر 2021م عن بنود مستبعدة."]}],"oecd":[{"t":["Articles 49 to 51 follow GloBE Article 4.4 and Article 103 follows Article 9.1. The draft has no equivalent of the GloBE Loss Election in Article 4.5.","تتبع المواد من 49 إلى 51 المادة 4.4 من القواعد النموذجية، وتتبع المادة 103 المادة 9.1. ولا يتضمن مشروع النظام ما يقابل اختيار خسائر القواعد العالمية في المادة 4.5."],"src":["Model Rules Arts 4.4, 4.5, 9.1","القواعد النموذجية: المواد 4.4 و4.5 و9.1"]},{"t":["KSA angle: Saudi entities generally treat Zakat as outside IAS 12 and record no deferred Zakat, so for a Zakat-only entity the deferred tax adjustment is usually nil and Zakat enters covered taxes as booked each year.","من منظور المملكة: تعامل الكيانات في المملكة الزكاة عادةً بوصفها خارج نطاق معيار المحاسبة الدولي 12 ولا تقيد زكاة مؤجلة، لذا يكون تعديل الضريبة المؤجلة للكيان الخاضع للزكاة وحدها صفراً في الغالب، وتدخل الزكاة الضرائب المشمولة كما تُقيد كل سنة."],"src":["IAS 12; Saudi practice","معيار المحاسبة الدولي 12؛ الممارسة في المملكة"]}],"cases":[{"t":["Recasting 20% deferred tax at 15%","إعادة احتساب ضريبة مؤجلة بنسبة 20% إلى 15%"],"facts":["Gulf Petrochem (Saudi, wholly foreign-owned, income tax at 20%) books FY2027 deferred tax expense of SAR 8m, all at 20%:\n• SAR 6m from tax depreciation on plant running ahead of book depreciation\n• SAR 2m on fair value gains on a 25% shareholding, which are excluded equity gains","تقيد شركة الخليج للبتروكيماويات (سعودية، مملوكة بالكامل لأجانب، وتخضع لضريبة الدخل 20%) مصروف ضريبة مؤجلة لعام 2027م قدره 8 ملايين ريال، كله بنسبة 20%:\n• 6 ملايين من الاستهلاك الضريبي للمصنع الذي يسبق الاستهلاك الدفتري\n• مليونا ريال على مكاسب القيمة العادلة لحصة 25%، وهي مكاسب ملكية مستبعدة"],"steps":[{"t":["Remove deferred tax on the excluded equity gains:","استبعد الضريبة المؤجلة على مكاسب الملكية المستبعدة:"],"x":"8000000-2000000","v":6000000,"u":"SAR"},{"t":["Recast the rest from 20% to 15%:","أعد احتساب الباقي من 20% إلى 15%:"],"x":"6000000*15/20","v":4500000,"u":"SAR"}],"ans":["The total deferred tax adjustment is SAR 4.5m. The plant liability is cost recovery on tangible assets, a recapture exception accrual, so it is not exposed to the five-year recapture.","إجمالي تعديل الضريبة المؤجلة 4.5 ملايين ريال. والتزام المصنع ناشئ عن استرداد تكلفة أصول ملموسة، وهو من الاستحقاقات المستثناة، فلا يخضع للاسترداد بعد خمس سنوات."],"r":["49(2)","49(3)","50"],"p":["Deferred tax adjustment: SAR 4.5m. Drop the SAR 2m on excluded gains, then recast SAR 6m from 20% to 15%.","تعديل الضريبة المؤجلة 4.5 مليون ريال: استبعد مليوني الريال على المكاسب المستبعدة، ثم أعد احتساب 6 ملايين من 20% إلى 15%."],"diagrams":[{"type":"waterfall","at":"answer","title":["From booked deferred tax to the adjustment","من الضريبة المؤجلة المقيدة إلى التعديل"],"cap":["SAR million","بملايين الريالات"],"rows":[{"l":["Deferred tax booked at 20%","الضريبة المؤجلة المقيدة بنسبة 20%"],"v":8,"k":"add"},{"l":["On excluded equity gains","على مكاسب الملكية المستبعدة"],"v":2,"k":"sub"},{"l":["Recast from 20% to 15%","إعادة الاحتساب من 20% إلى 15%"],"v":1.5,"k":"sub"},{"l":["Total deferred tax adjustment","إجمالي تعديل الضريبة المؤجلة"],"v":4.5,"k":"sum"}],"note":["The plant liability is a recapture exception accrual, so the five-year clock does not apply.","التزام المصنع من الاستحقاقات المستثناة، فلا تسري عليه ساعة السنوات الخمس."]}]},{"t":["A liability that does not reverse","التزام لا ينعكس"],"facts":["In FY2027 a Saudi company counted a SAR 10m increase (at 15%) in a deferred tax liability on an intangible asset, which is not a recapture exception category. At 31 December 2032, SAR 6m of it has not reversed. FY2027 figures for the Kingdom: net DMT income SAR 400m, Adjusted Covered Taxes SAR 62m, substance-based income exclusion SAR 100m.","في 2027م احتسبت شركة في المملكة زيادة قدرها 10 ملايين ريال (بنسبة 15%) في التزام ضريبي مؤجل على أصل غير ملموس، وهو ليس من الفئات المستثناة من الاسترداد. وفي 31 ديسمبر 2032م لم ينعكس منها 6 ملايين ريال. أرقام المملكة لعام 2027م: صافي الدخل 400 مليون ريال، والضرائب المشمولة المعدلة 62 مليون ريال، والاستبعاد على أساس جوهر النشاط 100 مليون ريال."],"steps":[{"t":["Original FY2027 ETR:","المعدل الفعلي الأصلي لعام 2027م:"],"x":"62000000/400000000*100","v":15.5,"u":"%"},{"t":["Recalculated ETR after recapturing SAR 6m:","المعدل المعاد احتسابه بعد استرداد 6 ملايين ريال:"],"x":"(62000000-6000000)/400000000*100","v":14,"u":"%"},{"t":["Top-up percentage:","نسبة الضريبة التكميلية:"],"x":"15-14","v":1,"u":"%"},{"t":["Additional current top-up tax, charged in FY2032:","الضريبة التكميلية الحالية الإضافية، وتُحمّل في 2032م:"],"x":"1/100*(400000000-100000000)","v":3000000,"u":"SAR"}],"ans":["FY2027 drops below 15% and SAR 3m of additional current top-up tax arises in FY2032. Had the liability come from tax depreciation on tangible assets, nothing would have been recaptured.","ينخفض معدل 2027م إلى ما دون 15% وتنشأ ضريبة تكميلية حالية إضافية قدرها 3 ملايين ريال في 2032م. ولو نشأ الالتزام عن الاستهلاك الضريبي لأصول ملموسة لما استُرد شيء."],"r":["49(5)","49(6)","49(7)","63(2)"],"p":["SAR 6m not reversed by the end of 2032 is taken back: FY2027 drops from 15.5% to 14%, with SAR 3m of top-up in FY2032.","تُسترد 6 ملايين ريال لم تنعكس بنهاية 2032م: ينخفض معدل 2027م من 15.5% إلى 14%، مع 3 ملايين ضريبة تكميلية في 2032م."],"diagrams":[{"type":"columns","at":"answer","title":["FY2027 before and after the recapture","2027م قبل الاسترداد وبعده"],"cap":["Kingdom ETR, %","معدل المملكة الفعلي، %"],"items":[{"l":["As filed","كما قُدّم"],"v":15.5},{"l":["After the recapture","بعد الاسترداد"],"v":14}],"line":{"v":15,"l":["15% minimum","الحد الأدنى 15%"]},"verdict":["Now below 15%: 1% top-up on SAR 300m of excess profit = SAR 3m, charged in FY2032.","أصبح دون 15%: ضريبة تكميلية 1% على ربح زائد قدره 300 مليون ريال = 3 ملايين، تُحمَّل في 2032م."],"vt":"out"}]},{"t":["Bringing deferred tax into the transition year","إدخال الضريبة المؤجلة في سنة الانتقال"],"facts":["At the start of FY2027, its transition year, a Saudi income tax payer shows (at 20%):\n• Deferred tax asset on tax losses carried forward: SAR 20m, with a valuation allowance of SAR 5m against it; the losses would have been DMT losses\n• Deferred tax liability on accelerated tax depreciation: SAR 12m","في بداية 2027م، سنة الانتقال، يُظهر دافع لضريبة الدخل في المملكة (بنسبة 20%):\n• أصل ضريبي مؤجل على خسائر ضريبية مرحّلة: 20 مليون ريال، وعليه مخصص تقييم 5 ملايين ريال؛ وكانت الخسائر ستُعد خسائر لأغراض النظام\n• التزام ضريبي مؤجل على الاستهلاك الضريبي المعجل: 12 مليون ريال"],"steps":[{"t":["Ignore the valuation allowance and take the asset at 15% (lower of 15% and 20%):","تجاهل مخصص التقييم وخذ الأصل بنسبة 15% (الأقل من 15% و20%):"],"x":"20000000*15/20","v":15000000,"u":"SAR"},{"t":["Take the liability at 15%:","خذ الالتزام بنسبة 15%:"],"x":"12000000*15/20","v":9000000,"u":"SAR"},{"t":["Net deferred tax asset brought into the law:","صافي الأصل الضريبي المؤجل المُدخل في النظام:"],"x":"15000000-9000000","v":6000000,"u":"SAR"}],"ans":["A net SAR 6m deferred tax asset at 15% comes in. As the losses are used, the asset reverses into covered taxes, so years sheltered by old losses do not look low-taxed.","يدخل صافي أصل ضريبي مؤجل قدره 6 ملايين ريال بنسبة 15%. ومع استخدام الخسائر ينعكس الأصل في الضرائب المشمولة، فلا تبدو السنوات المحمية بالخسائر القديمة منخفضة الضريبة."],"r":["103(1)","103(2)"],"p":["A net SAR 6m deferred tax asset comes in: the SAR 15m loss asset less the SAR 9m liability, both at 15%.","يدخل صافي أصل ضريبي مؤجل قدره 6 ملايين ريال: أصل الخسائر 15 مليوناً ناقص الالتزام 9 ملايين، وكلاهما بنسبة 15%."],"diagrams":[{"type":"waterfall","at":"answer","title":["What comes into the transition year","ما يدخل في سنة الانتقال"],"cap":["SAR million, at 15%","بملايين الريالات، بنسبة 15%"],"rows":[{"l":["Loss asset, allowance ignored","أصل الخسائر، دون مخصص التقييم"],"v":15,"k":"add"},{"l":["Depreciation liability","التزام الاستهلاك"],"v":9,"k":"sub"},{"l":["Net deferred tax asset","صافي الأصل الضريبي المؤجل"],"v":6,"k":"sum"}]}]}],"quiz":[{"q":["A Saudi company books deferred tax at 20%. What enters the total deferred tax adjustment?","تقيد شركة في المملكة الضريبة المؤجلة بنسبة 20%. ما الذي يدخل إجمالي تعديل الضريبة المؤجلة؟"],"o":[["The full amount, recalculated at 20% as booked","كامل المبلغ، معاداً احتسابه بنسبة 20% كما قُيد"],["The amount recalculated at 17%","المبلغ المعاد احتسابه بنسبة 17%"],["Nothing: deferred tax booked above the minimum rate is ignored","لا شيء: فالضريبة المؤجلة المقيدة فوق الحد الأدنى تُتجاهل"],["The amount recalculated at 15%","المبلغ المعاد احتسابه بنسبة 15%"]],"a":3,"e":["Article 49(2): deferred tax booked above 15% is recast at 15%. At 15% or below it is taken as booked (Art 49(1)).","المادة 49 (2): تُعاد احتساب الضريبة المؤجلة المقيدة بأكثر من 15% بنسبة 15%. أما بنسبة 15% أو أقل فتؤخذ كما قُيدت (المادة 49 (1))."],"r":["49(2)"]},{"q":["Deferred tax is booked at 10% in a low-tax jurisdiction. What enters?","قُيدت الضريبة المؤجلة بنسبة 10% في ولاية منخفضة الضريبة. ما الذي يدخل؟"],"o":[["The amount grossed up to 15%","المبلغ مرفوعاً إلى 15%"],["Nothing, as the rate is below 15%","لا شيء، لأن المعدل دون 15%"],["The amount recast at the Saudi rate of 20%","المبلغ معاداً احتسابه بالسعر السعودي 20%"],["The amount as booked, at 10%","المبلغ كما قُيد، بنسبة 10%"]],"a":3,"e":["Article 49(1): deferred tax booked at or below 15% enters the total deferred tax adjustment as booked. Only rates above 15% are recalculated down to 15% (Art 49(2)).","المادة 49 (1): تدخل الضريبة المؤجلة المقيدة بنسبة 15% أو أقل في إجمالي تعديل الضريبة المؤجلة كما قُيدت. ولا يُعاد إلى 15% إلا ما قُيد بأكثر منها (المادة 49 (2))."],"r":["49(1)"]},{"q":["Which of these is left out of the total deferred tax adjustment?","أي مما يلي يُستبعد من إجمالي تعديل الضريبة المؤجلة؟"],"o":[["Deferred tax on accelerated tax depreciation of plant","الضريبة المؤجلة على الاستهلاك الضريبي المعجل للمصانع"],["Deferred tax on a provision for employees' end-of-service benefits","الضريبة المؤجلة على مخصص مكافأة نهاية الخدمة للموظفين"],["A change in the valuation allowance on a deferred tax asset","تغير مخصص التقييم على أصل ضريبي مؤجل"],["Deferred tax on right-of-use assets and lease liabilities","الضريبة المؤجلة على أصول حق الاستخدام والتزامات الإيجار"]],"a":2,"e":["Article 49(3)(c): valuation allowances and recognition adjustments on deferred tax assets are left out. Timing differences on depreciation, provisions and leases stay in.","المادة 49 (3) (ج): تُستبعد مخصصات التقييم وتعديلات الإثبات على الأصول الضريبية المؤجلة. أما فروق التوقيت على الاستهلاك والمخصصات والإيجارات فتبقى."],"r":["49(3)"]},{"q":["A deferred tax asset for a DMT loss is recorded at 10%. What may the entity do?","قُيد أصل ضريبي مؤجل لخسارة لأغراض النظام بنسبة 10%. ماذا يجوز للكيان؟"],"o":[["Leave it: an asset booked below 15% stays at its booked rate","تركه: فالأصل المقيد بأقل من 15% يبقى بمعدله المقيد"],["Recalculate it at 15% in the same year, if it shows the loss is a DMT loss","إعادة احتسابه بنسبة 15% في السنة نفسها، إن أثبت أنها خسارة لأغراض النظام"],["Recalculate it at the Saudi rate of 20%, the domestic headline rate","إعادة احتسابه بالسعر السعودي 20%، وهو السعر الأساسي المحلي"],["Recalculate it at 15%, but only in the later year the loss is actually used","إعادة احتسابه بنسبة 15%، ولكن فقط في السنة اللاحقة التي تُستخدم فيها الخسارة"]],"a":1,"e":["Article 49(4): the recast to 15% is allowed in the same year, if the entity shows the asset is attributable to a DMT loss.","المادة 49 (4): تجوز إعادة الاحتساب بنسبة 15% في السنة نفسها، إذا أثبت الكيان أن الأصل منسوب إلى خسارة لأغراض النظام."],"r":["49(4)"]},{"q":["A deferred tax liability counted in FY2027 (not an exception) is partly unreversed at the end of FY2032. What happens?","التزام ضريبي مؤجل احتُسب في 2027م (ليس مستثنى) لم ينعكس جزء منه بنهاية 2032م. ماذا يحدث؟"],"o":[["The unreversed part reduces FY2027 covered taxes and FY2027 is recalculated","يخفض الجزء غير المنعكس الضرائب المشمولة لعام 2027م ويُعاد احتساب 2027م"],["The unreversed part reduces FY2032 covered taxes, the year it is found","يخفض الجزء غير المنعكس الضرائب المشمولة لعام 2032م، سنة اكتشافه"],["Nothing, as long as it is expected to reverse within ten years","لا شيء، ما دام يُتوقع انعكاسه خلال عشر سنوات"],["The whole liability, reversed or not, is taken out of FY2027","يُستبعد الالتزام كله، منعكساً كان أم لا، من 2027م"]],"a":0,"e":["Article 49(5)–(7); any extra top-up is additional current top-up tax in FY2032 (Art 63(2)).","المادة 49 (5)–(7)؛ وأي زيادة ضريبة تكميلية حالية إضافية في 2032م (المادة 63 (2))."],"r":["49(5)","49(6)","49(7)"]},{"q":["Which deferred tax liability is a recapture exception accrual?","أي التزام ضريبي مؤجل يُعد من الاستحقاقات المستثناة من الاسترداد؟"],"o":[["Cost recovery allowances on tangible assets","مخصصات استرداد تكلفة الأصول الملموسة"],["Amortisation of an acquired customer list","إطفاء قائمة عملاء مستحوذ عليها"],["Deferred revenue on long-term service contracts","إيرادات مؤجلة على عقود خدمات طويلة الأجل"],["Tax amortisation of goodwill on an acquisition","الإطفاء الضريبي للشهرة على عملية استحواذ"]],"a":0,"e":["Article 50(1): cost recovery on tangible assets is a recapture exception. Liabilities on intangibles, goodwill and deferred revenue are not on the list.","المادة 50 (1): استرداد تكلفة الأصول الملموسة من الاستثناءات. أما الالتزامات على الأصول غير الملموسة والشهرة والإيرادات المؤجلة فليست في القائمة."],"r":["50"]},{"q":["Which of these is NOT on the recapture exception list?","أي مما يلي ليس ضمن قائمة الاستحقاقات المستثناة؟"],"o":[["Research and development expenses of the entity","مصاريف البحث والتطوير للكيان"],["Foreign exchange net gains of the entity","صافي مكاسب العملات الأجنبية للكيان"],["Deferred tax from an uncertain tax position","ضريبة مؤجلة ناشئة عن مركز ضريبي غير مؤكد"],["Decommissioning and remediation expenses","مصاريف إزالة الأصول وإصلاح المواقع"]],"a":2,"e":["An uncertain tax position is a disallowed accrual (Art 51), left out altogether; the others are in Article 50.","المركز الضريبي غير المؤكد استحقاق غير مسموح به (المادة 51) ويُستبعد كلياً؛ والبقية في المادة 50."],"r":[50,51]},{"q":["What is a disallowed accrual?","ما الاستحقاق غير المسموح به؟"],"o":[["Any deferred tax accrual above the riyal equivalent of €1m in a year","أي استحقاق ضريبي مؤجل يتجاوز ما يوازي مليون يورو في السنة"],["Deferred tax on an uncertain tax position or on distributions from a group entity","ضريبة مؤجلة على مركز ضريبي غير مؤكد أو على توزيعات من كيان في المجموعة"],["An accrual the external auditor rejects in the year-end audit","استحقاق يرفضه المراجع الخارجي في مراجعة نهاية السنة"],["Deferred tax on a timing difference expected to reverse within five years","ضريبة مؤجلة على فرق توقيت يُتوقع انعكاسه خلال خمس سنوات"]],"a":1,"e":["Article 51: a disallowed accrual is a deferred tax movement relating to an uncertain tax position or to distributions from a constituent entity. It is left out of the adjustment (Art 49(3)).","المادة 51: الاستحقاق غير المسموح به حركة في الضريبة المؤجلة تتعلق بمركز ضريبي غير مؤكد أو بتوزيعات من كيان تابع. ويُستبعد من التعديل (المادة 49 (3))."],"r":[51]},{"q":["What is an unclaimed accrual?","ما الاستحقاق غير المطالب به؟"],"o":[["A tax refund the entity is entitled to but has not yet claimed","استرداد ضريبي يستحقه الكيان ولم يطالب به بعد"],["An increase not expected to be paid within five years, left out by annual election","زيادة لا يُتوقع سدادها خلال خمس سنوات، تُستبعد باختيار سنوي"],["A tax credit the entity earned but has not yet used against tax","ائتمان ضريبي اكتسبه الكيان ولم يستخدمه بعد"],["An increase expected to be paid within five years, left out by a five-year election","زيادة يُتوقع سدادها خلال خمس سنوات، تُستبعد باختيار خمس سنوات"]],"a":1,"e":["Article 49(8): an unclaimed accrual is a liability increase not expected to be paid within the five-year window, which the filing entity elects each year to leave out.","المادة 49 (8): الاستحقاق غير المطالب به زيادة في الالتزام لا يُتوقع سدادها خلال فترة السنوات الخمس، ويختار الكيان المقدم للإقرار كل سنة عدم إدراجها."],"r":["49(8)"]},{"q":["At transition, at what rate are deferred tax assets and liabilities brought in?","عند الانتقال، بأي معدل تُدخل الأصول والالتزامات الضريبية المؤجلة؟"],"o":[["The higher of 15% and the applicable domestic rate","الأعلى من 15% والمعدل المحلي المطبق"],["Always 15%, whatever the domestic rate","15% دائماً، أياً كان المعدل المحلي"],["The domestic rate as booked, even above 15%","المعدل المحلي كما قُيد، حتى لو تجاوز 15%"],["The lower of 15% and the applicable domestic rate","الأقل من 15% والمعدل المحلي المطبق"]],"a":3,"e":["Article 103(2)(a): at the lower of 15% and the domestic rate, ignoring valuation and recognition adjustments.","المادة 103 (2) (أ): بالأقل من 15% والمعدل المحلي، مع تجاهل تعديلات التقييم والإثبات."],"r":["103(2)"]},{"q":["At transition, a deferred tax asset arose in 2023 from an item excluded from DMT income. What happens?","عند الانتقال، نشأ أصل ضريبي مؤجل في 2023م من بند مستبعد من الدخل. ماذا يحدث؟"],"o":[["It is excluded, since it arose in a transaction after 30 November 2021","يُستبعد لأنه نشأ في معاملة بعد 30 نوفمبر 2021م"],["It is brought in at 15%, like other deferred tax assets at transition","يُدخل بنسبة 15%، شأنه شأن الأصول الضريبية المؤجلة الأخرى عند الانتقال"],["It is excluded only if it was generated on or after 1 January 2027","يُستبعد فقط إذا نشأ في 1 يناير 2027م أو بعده"],["It is brought in at the Saudi rate of 20%, as booked","يُدخل بالسعر السعودي 20% كما قُيد في الحسابات"]],"a":0,"e":["Article 103(3): deferred tax assets from items excluded from DMT income are ignored if generated in a transaction after 30 November 2021.","المادة 103 (3): تُتجاهل الأصول الضريبية المؤجلة الناشئة عن بنود مستبعدة من الدخل إذا نشأت في معاملة بعد 30 نوفمبر 2021م."],"r":["103(3)"]},{"q":["A plant was sold between two group companies in 2024. At transition, what is the buyer's basis?","بيع مصنع بين شركتين في المجموعة في 2024م. عند الانتقال، ما أساس المشتري؟"],"o":[["The price the buyer paid in 2024","السعر الذي دفعه المشتري في 2024م"],["Its market value at the start of the transition year","قيمته السوقية في بداية سنة الانتقال"],["The seller's carrying value at disposal","القيمة الدفترية لدى البائع عند التصرف"],["The buyer's carrying value, as in its own accounts","القيمة الدفترية لدى المشتري، كما في حساباته"]],"a":2,"e":["Article 103(4) covers transfers after 30 November 2021 and before the transition year.","تغطي المادة 103 (4) النقل بعد 30 نوفمبر 2021م وقبل سنة الانتقال."],"r":["103(4)"]}],"cards":[{"f":["Total deferred tax adjustment","إجمالي تعديل الضريبة المؤجلة"],"b":["Deferred tax expense for covered taxes: as booked if at 15% or less, recast at 15% if higher.","مصروف الضريبة المؤجلة للضرائب المشمولة: كما قُيد إن كان بنسبة 15% أو أقل، ويُعاد احتسابه بنسبة 15% إن زاد."],"r":["49(1)","49(2)"]},{"f":["Five exclusions","خمسة استثناءات"],"b":["Excluded items; disallowed and unclaimed accruals; valuation and recognition adjustments; rate remeasurement; tax credits.","البنود المستبعدة؛ والاستحقاقات غير المسموح بها وغير المطالب بها؛ وتعديلات التقييم والإثبات؛ وإعادة القياس لتغير المعدل؛ والائتمانات الضريبية."],"r":["49(3)"]},{"f":["Loss asset uplift","رفع أصل الخسائر"],"b":["A deferred tax asset below 15% may be taken at 15% if attributable to a DMT loss.","يجوز أخذ الأصل الضريبي المؤجل المقيد بأقل من 15% بنسبة 15% إذا كان منسوباً إلى خسارة لأغراض النظام."],"r":["49(4)"]},{"f":["Recapture rule","قاعدة الاسترداد"],"b":["Liability not reversed by the end of the fifth following year: reduce that year's covered taxes and recalculate.","التزام لم ينعكس بنهاية السنة الخامسة التالية: تُخفض ضرائب تلك السنة ويُعاد الاحتساب."],"r":["49(5)","49(6)","49(7)"]},{"f":["Recapture exceptions (1)","الاستثناءات من الاسترداد (1)"],"b":["Tangible asset cost recovery; government licences with significant tangible investment; research and development.","استرداد تكلفة الأصول الملموسة؛ والتراخيص الحكومية ذات الاستثمار الملموس الكبير؛ والبحث والتطوير."],"r":["50"]},{"f":["Recapture exceptions (2)","الاستثناءات من الاسترداد (2)"],"b":["Decommissioning and remediation; fair value and FX net gains; insurance reserves; reinvested local tangible gains; related accounting changes.","إيقاف التشغيل والإصلاح؛ وصافي مكاسب القيمة العادلة والصرف؛ واحتياطيات التأمين؛ والمكاسب الملموسة المحلية المعاد استثمارها؛ والتغييرات المحاسبية المرتبطة."],"r":["50"]},{"f":["Disallowed accrual","الاستحقاق غير المسموح به"],"b":["Deferred tax on uncertain tax positions or on distributions from a constituent entity.","الضريبة المؤجلة على المراكز الضريبية غير المؤكدة أو على التوزيعات من كيان تابع."],"r":[51]},{"f":["Unclaimed accrual","الاستحقاق غير المطالب به"],"b":["Liability increase not expected to be paid within five years, left out by annual election.","زيادة في الالتزام لا يُتوقع سدادها خلال خمس سنوات، تُستبعد باختيار سنوي."],"r":["49(8)"]},{"f":["Rate cut below 15%","خفض المعدل إلى أقل من 15%"],"b":["The resulting deferred tax expense adjusts earlier years' covered taxes.","يعدّل مصروف الضريبة المؤجلة الناتج الضرائب المشمولة للسنوات السابقة."],"r":["52(6)"]},{"f":["Rate increase","زيادة المعدل"],"b":["Deferred tax expense from the increase adjusts earlier years when paid, capped at the 15% amount.","يعدّل مصروف الضريبة المؤجلة الناتج عن الزيادة السنوات السابقة عند سداده، بحد أقصى مبلغ الـ15%."],"r":["52(7)"]},{"f":["Transition attributes","السمات الضريبية عند الانتقال"],"b":["All deferred tax in the Saudi accounts, at the lower of 15% and the domestic rate; valuation allowances ignored.","جميع الضرائب المؤجلة في حسابات المملكة، بالأقل من 15% والمعدل المحلي؛ مع تجاهل مخصصات التقييم."],"r":["103(1)","103(2)"]},{"f":["30 November 2021","30 نوفمبر 2021م"],"b":["Cut-off for ignoring excluded-item assets and for carrying over the seller's basis on intra-group transfers.","التاريخ الفاصل لتجاهل أصول البنود المستبعدة ولنقل أساس البائع في عمليات النقل داخل المجموعة."],"r":["103(3)","103(4)"]}],"terms":[{"t":["Timing difference","فرق التوقيت"],"d":["Income or expense counted in different years for tax and in the books.","دخل أو مصروف يُحتسب في سنوات مختلفة للضريبة وفي الدفاتر."]},{"t":["Deferred tax liability","الالتزام الضريبي المؤجل"],"d":["A promise to pay tax later on a timing difference.","وعد بسداد الضريبة لاحقاً عن فرق توقيت."]},{"t":["Deferred tax asset","الأصل الضريبي المؤجل"],"d":["Tax already paid, or a loss already suffered, that will lower tax later.","ضريبة سُددت أو خسارة وقعت، وستخفض الضريبة لاحقاً."]},{"t":["Recapture","الاسترداد"],"d":["Taking back a counted liability that has not reversed within five years.","استرجاع التزام محتسب لم ينعكس خلال خمس سنوات."]},{"t":["Recapture exception accrual","الاستحقاق المستثنى من الاسترداد"],"d":["A long-lived item, such as plant depreciation, that is never taken back.","بند طويل الأجل، مثل استهلاك المصانع، لا يُسترد أبداً."]},{"t":["Valuation allowance","مخصص التقييم"],"d":["A write-down of a tax asset the company may not use; ignored here.","تخفيض لأصل ضريبي قد لا تستخدمه الشركة؛ ويُتجاهل هنا."]},{"t":["Transition year","سنة الانتقال"],"d":["The first year the group falls within the law.","السنة الأولى التي تدخل فيها المجموعة نطاق النظام."]}],"range":"49–51, 103"},{"id":10,"title":["The Kingdom's ETR and the top-up tax","معدل المملكة الفعلي والضريبة التكميلية"],"goal":["Blend the Saudi entities into one ETR, turn any shortfall into domestic top-up tax, allocate it to entities, and handle recalculations, negative covered taxes and minority-owned entities.","مزج الكيانات في المملكة في معدل فعلي واحد، وتحويل أي نقص إلى ضريبة تكميلية محلية، وتخصيصها على الكيانات، ومعالجة إعادة الاحتساب والضرائب المشمولة السالبة والكيانات ذات الملكية الأقلية."],"parts":[5],"arts":[53,54,55,56,57,63,65],"time":40,"metaphor":{"title":["One pot, one thermometer","قدرٌ واحد وميزان حرارة واحد"],"text":["Every Saudi entity pours its income and its taxes into one pot, and you take the temperature once: that is the Kingdom's ETR. If it reads below 15, you add heat only to the part that is not routine substance (the excess profit). Then the bill is served to each entity in proportion to the income it put in; an entity that put in a loss pays nothing.\nA few pots are kept on a separate stove: investment entities, minority-owned entities and stateless entities.","يصبّ كل كيان في المملكة دخله وضرائبه في قدر واحد، وتُقاس الحرارة مرة واحدة: هذا هو معدل المملكة الفعلي. فإن قلّ عن 15 تُضاف الحرارة إلى الجزء الذي لا يمثل الجوهر الاعتيادي فقط (الربح الزائد). ثم تُوزع الفاتورة على كل كيان بنسبة الدخل الذي أسهم به؛ أما الكيان الذي أسهم بخسارة فلا يدفع شيئاً.\nوبعض القدور تُطهى على موقد مستقل: كيانات الاستثمار، والكيانات ذات الملكية الأقلية، والكيانات عديمة الجنسية."]},"anchors":[{"if":["One Saudi entity is low-taxed and another is high-taxed","كيان في المملكة منخفض الضريبة وآخر مرتفعها"],"then":["Blend them: there is one ETR for the Kingdom (Art 53(2))","امزجهما: للمملكة معدل فعلي واحد (المادة 53 (2))"]},{"if":["The blended ETR is below 15%","المعدل الممزوج أقل من 15%"],"then":["Top-up % × (net DMT income − SBIE), plus any additional current top-up tax (Arts 54–56)","نسبة الضريبة التكميلية × (صافي الدخل − الاستبعاد على أساس الجوهر)، مع أي ضريبة تكميلية حالية إضافية (المواد 54–56)"]},{"if":["The Kingdom's top-up tax must be split among entities","يجب توزيع الضريبة التكميلية للمملكة على الكيانات"],"then":["Share it by DMT income among the entities that have income (Art 57(1))","وزّعها بحسب الدخل على الكيانات التي لديها دخل (المادة 57 (1))"]},{"if":["An earlier year is reopened by an ETR adjustment article","أُعيد فتح سنة سابقة بموجب إحدى مواد تعديل المعدل الفعلي"],"then":["Recalculate it; the extra top-up is additional current top-up tax this year (Art 63(1)–(2))","أعد احتسابها؛ والزيادة ضريبة تكميلية حالية إضافية هذه السنة (المادة 63 (1)–(2))"]},{"if":["The UPE owns 30% or less of a Saudi entity","يملك الكيان الأم النهائي 30% أو أقل من كيان في المملكة"],"then":["Compute it (or its minority-owned subgroup) separately from the rest (Art 65)","احسبه (أو مجموعته الفرعية ذات الملكية الأقلية) بمعزل عن البقية (المادة 65)"]}],"diagrams":[{"type":"formula","title":["The computation in six lines","الاحتساب في ستة أسطر"],"rows":[{"l":["Net DMT Income","صافي الدخل"],"r":["DMT income of the Saudi entities − their DMT losses (if positive) · Art 53(4)","دخل الكيانات في المملكة − خسائرها (إن كان موجباً) · المادة 53 (4)"]},{"l":["ETR","المعدل الفعلي"],"r":["Σ Adjusted Covered Taxes ÷ Net DMT Income · Art 53(2)","مجموع الضرائب المشمولة المعدلة ÷ صافي الدخل · المادة 53 (2)"]},{"l":["Top-up %","نسبة الضريبة التكميلية"],"r":["15% − ETR (if positive) · Art 54","15% − المعدل الفعلي (إن كان موجباً) · المادة 54"]},{"l":["Excess Profit","الربح الزائد"],"r":["Net DMT Income − SBIE (if positive) · Art 55","صافي الدخل − الاستبعاد على أساس الجوهر (إن كان موجباً) · المادة 55"]},{"l":["Domestic Top-up Tax","الضريبة التكميلية المحلية"],"r":["Top-up % × Excess Profit + Additional Current Top-up Tax · Art 56","النسبة × الربح الزائد + الضريبة التكميلية الحالية الإضافية · المادة 56"]},{"l":["Entity's share","حصة الكيان"],"r":["Kingdom top-up × entity's DMT income ÷ total DMT income of entities with income · Art 57","الضريبة التكميلية للمملكة × دخل الكيان ÷ إجمالي دخل الكيانات ذات الدخل · المادة 57"]}],"quick":true},{"type":"tree","title":["Which pot does this entity go in?","في أي قدر يوضع هذا الكيان؟"],"root":{"q":["Is it an investment entity or insurance investment entity?","هل هو كيان استثمار أو كيان تأمين استثماري؟"],"yes":{"end":["Own ETR (Art 85), outside the Kingdom blend (Art 53(5))","معدل خاص (المادة 85)، خارج مزيج المملكة (المادة 53 (5))"],"tone":"out"},"no":{"q":["Does the UPE hold 30% or less of it?","هل يملك الكيان الأم النهائي 30% أو أقل منه؟"],"yes":{"end":["Minority-owned: separate computation, as a subgroup or alone (Art 65)","ملكية أقلية: احتساب مستقل، كمجموعة فرعية أو منفرداً (المادة 65)"],"tone":"out"},"no":{"q":["Is it a stateless constituent entity?","هل هو كيان تابع عديم الجنسية؟"],"yes":{"end":["A single entity in a separate jurisdiction (Art 53(3))","كيان منفرد في ولاية مستقلة (المادة 53 (3))"],"tone":"out"},"no":{"end":["Into the Kingdom's single blended ETR","يدخل في معدل المملكة الممزوج الواحد"],"tone":"in"}}}}}],"points":[{"h":["One blended ETR for the Kingdom","معدل ممزوج واحد للمملكة"],"t":["The ETR is calculated every year for the Kingdom as a whole: the Adjusted Covered Taxes of all Saudi constituent entities divided by the Kingdom's net DMT income.","يُحتسب المعدل الفعلي كل سنة للمملكة ككل: مجموع الضرائب المشمولة المعدلة لجميع الكيانات التابعة في المملكة مقسوماً على صافي دخل المملكة."],"r":["53(1)","53(2)"],"p":["All Saudi entities share one rate: their total taxes over their total income.","تشترك كل الكيانات السعودية في معدل واحد: مجموع ضرائبها على مجموع دخلها."]},{"h":["Net DMT income","صافي الدخل"],"t":["Net DMT income is the DMT income of all Saudi constituent entities minus their DMT losses, if the result is positive. If it is not, there is no ETR for the year, but Article 63(3) can still bite.","صافي الدخل هو دخل جميع الكيانات التابعة في المملكة ناقصاً خسائرها، إن كانت النتيجة موجبة. وإن لم تكن، فلا معدل فعلي للسنة، لكن المادة 63 (3) قد تنطبق مع ذلك."],"r":["53(4)","63(3)"],"p":["Net income is profits minus losses. If that is nil or negative, there is no rate that year.","صافي الدخل هو الأرباح ناقصاً الخسائر. فإن كان صفراً أو سالباً فلا معدل لتلك السنة."]},{"h":["Entities kept out of the blend","كيانات تُبقى خارج المزيج"],"t":["Investment entities and insurance investment entities are left out of the Kingdom's ETR and net DMT income; each stateless entity is treated as a single entity in a separate jurisdiction; minority-owned entities are computed separately.","تُستبعد كيانات الاستثمار وكيانات التأمين الاستثماري من معدل المملكة وصافي دخلها؛ ويُعامل كل كيان عديم الجنسية ككيان منفرد في ولاية مستقلة؛ وتُحتسب الكيانات ذات الملكية الأقلية بشكل مستقل."],"r":["53(3)","53(5)",65],"p":["Investment entities, stateless entities and minority-owned entities are computed apart.","تُحتسب كيانات الاستثمار والكيانات عديمة الجنسية والكيانات ذات الملكية الأقلية بمعزل عن غيرها."]},{"h":["Top-up percentage and excess profit","نسبة الضريبة التكميلية والربح الزائد"],"t":["The top-up percentage is 15% minus the ETR, if positive. Excess profit is net DMT income minus the substance-based income exclusion of the Saudi entities, if positive.","نسبة الضريبة التكميلية هي 15% ناقصاً المعدل الفعلي، إن كانت موجبة. والربح الزائد هو صافي الدخل ناقصاً الاستبعاد على أساس جوهر النشاط للكيانات في المملكة، إن كان موجباً."],"r":[54,55],"p":["Top-up percentage = 15% minus the rate. Excess profit = income minus the substance allowance.","نسبة الضريبة التكميلية = 15% ناقصاً المعدل. والربح الزائد = الدخل ناقصاً بدل الجوهر."]},{"h":["Domestic top-up tax","الضريبة التكميلية المحلية"],"t":["The Kingdom's domestic top-up tax is the top-up percentage times excess profit, plus any additional current top-up tax for the year.","الضريبة التكميلية المحلية للمملكة هي نسبة الضريبة التكميلية مضروبة في الربح الزائد، مضافاً إليها أي ضريبة تكميلية حالية إضافية للسنة."],"r":[56],"p":["Top-up tax = top-up percentage × excess profit, plus any top-up from reopened years.","الضريبة التكميلية = النسبة × الربح الزائد، مضافاً إليها أي ضريبة من السنوات المعاد فتحها."]},{"h":["Who carries it","من يتحملها"],"t":["Each Saudi entity with DMT income takes a share in proportion to its DMT income over the total DMT income of the Saudi entities. Loss-making entities take none. If the top-up comes from a recalculation and the current year has no net income, the split follows the DMT income of the recalculated years.","يتحمل كل كيان في المملكة لديه دخل حصةً بنسبة دخله إلى إجمالي دخل الكيانات في المملكة، ولا يتحمل الكيان الخاسر شيئاً. وإذا نشأت الضريبة عن إعادة احتساب ولم يكن في السنة الحالية صافي دخل، فيتبع التوزيع دخل السنوات المعاد احتسابها."],"r":["57(1)","57(2)"],"p":["Each profitable entity pays a share by its income; loss-makers pay nothing.","يدفع كل كيان رابح حصة بحسب دخله؛ ولا يدفع الخاسر شيئاً."]},{"h":["Additional current top-up tax","الضريبة التكميلية الحالية الإضافية"],"t":["When an ETR adjustment article reopens an earlier year (Art 34, Art 49(5)–(7), Art 52(1)–(5) or Art 52(8)), that year's ETR and top-up are recalculated, and the increase is charged as additional current top-up tax in the current year.","عندما تعيد إحدى مواد تعديل المعدل الفعلي فتح سنة سابقة (المادة 34، والمادة 49 (5)–(7)، والمادة 52 (1)–(5) أو 52 (8))، يُعاد احتساب معدل تلك السنة وضريبتها التكميلية، وتُحمّل الزيادة كضريبة تكميلية حالية إضافية في السنة الحالية."],"r":["63(1)","63(2)","63(7)"],"p":["When an earlier year is reopened, its extra top-up is charged this year.","عند إعادة فتح سنة سابقة، تُحمَّل ضريبتها التكميلية الإضافية في هذه السنة."]},{"h":["Negative covered taxes in a year without net income","الضرائب المشمولة السالبة في سنة بلا صافي دخل"],"t":["If the Kingdom has no net DMT income and its Adjusted Covered Taxes are negative and below expected covered taxes (15% of the net DMT loss), the difference is additional current top-up tax, allocated to entities whose covered taxes are below 15% of their own result.","إذا لم يكن للمملكة صافي دخل وكانت ضرائبها المشمولة المعدلة سالبة وأقل من الضرائب المتوقعة (15% من صافي الخسارة)، فالفرق ضريبة تكميلية حالية إضافية، تُخصص على الكيانات التي تقل ضرائبها المشمولة عن 15% من نتيجتها."],"r":["63(3)","63(4)","63(6)"],"p":["In a loss year, negative taxes beyond 15% of the loss still create a top-up.","في سنة الخسارة، تُنشئ الضرائب السالبة التي تتجاوز 15% من الخسارة ضريبة تكميلية مع ذلك."]},{"h":["Minority-owned entities","الكيانات ذات الملكية الأقلية"],"t":["A minority-owned constituent entity is one in which the UPE has a direct or indirect interest of 30% or less. A minority-owned subgroup is computed as if it were a separate MNE group; a standalone minority-owned entity is computed on its own. Both are left out of the rest of the group's ETR.","الكيان التابع ذو الملكية الأقلية هو الذي تكون حصة الكيان الأم النهائي فيه، مباشرة أو غير مباشرة، 30% أو أقل. وتُحتسب المجموعة الفرعية ذات الملكية الأقلية كأنها مجموعة متعددة الجنسيات مستقلة، ويُحتسب الكيان المنفرد وحده. ويُستبعد كلاهما من معدل بقية المجموعة."],"r":["65(1)","65(2)","65(3)","65(4)"],"p":["Entities the ultimate parent owns 30% or less of are computed on their own.","الكيانات التي يملك الكيان الأم النهائي 30% أو أقل منها تُحتسب وحدها."]}],"oecd":[{"t":["Articles 53 to 57 mirror GloBE Articles 5.1 and 5.2, Article 63 mirrors 5.4 and Article 65 mirrors 5.6. The output differs: GloBE's jurisdictional top-up tax is collected from parents through the IIR or UTPR and is reduced by any QDMTT payable; here the tax is the QDMTT, charged directly to the Saudi entities.","تقابل المواد من 53 إلى 57 المادتين 5.1 و5.2 من القواعد النموذجية، وتقابل المادة 63 المادة 5.4، والمادة 65 المادة 5.6. والفرق في المخرجات: فالضريبة التكميلية للولاية في القواعد العالمية تُحصّل من الكيانات الأم عبر قاعدة تضمين الدخل أو قاعدة الأرباح الخاضعة لمعدل منخفض وتُخفض بأي ضريبة تكميلية محلية مؤهلة مستحقة؛ أما هنا فالضريبة هي نفسها الضريبة المحلية المؤهلة، وتُفرض مباشرة على الكيانات في المملكة."],"src":["Model Rules Arts 5.1, 5.2, 5.4, 5.6","القواعد النموذجية: المواد 5.1 و5.2 و5.4 و5.6"]},{"t":["KSA angle: blending puts Zakat payers and 20% income tax payers in one pot. Zakat is about 2.5% of a base built mainly from the balance sheet, not profit, so a profitable Zakat-only entity can sit far below 15% on its own, while income tax payers lift the Kingdom's average.","من منظور المملكة: يضع المزج دافعي الزكاة ودافعي ضريبة الدخل بنسبة 20% في قدر واحد. والزكاة نحو 2.5% من وعاء يُبنى أساساً من الميزانية لا من الربح، لذا قد يقع الكيان الرابح الخاضع للزكاة وحدها دون 15% بكثير منفرداً، بينما يرفع دافعو ضريبة الدخل متوسط المملكة."],"src":["Zakat Regulations 2024; Income Tax Law Art 7(a)","اللائحة التنفيذية لجباية الزكاة 2024م؛ نظام ضريبة الدخل م 7 (أ)"]}],"cases":[{"t":["Three Saudi entities, one ETR","ثلاثة كيانات في المملكة ومعدل واحد"],"facts":["FY2027, Saudi constituent entities of an in-scope group:\n• A (income tax payer): DMT income SAR 300m, Adjusted Covered Taxes SAR 48m\n• B (Zakat payer): DMT income SAR 200m, Adjusted Covered Taxes SAR 6m\n• C: DMT loss SAR 50m, no covered taxes\nSubstance-based income exclusion for the Kingdom: SAR 90m.","السنة المالية 2027م، الكيانات التابعة في المملكة لمجموعة خاضعة للنظام:\n• (أ) (تدفع ضريبة الدخل): الدخل 300 مليون ريال، والضرائب المشمولة المعدلة 48 مليون ريال\n• (ب) (تدفع الزكاة): الدخل 200 مليون ريال، والضرائب المشمولة المعدلة 6 ملايين ريال\n• (ج): خسارة 50 مليون ريال، ولا ضرائب مشمولة\nالاستبعاد على أساس جوهر النشاط للمملكة: 90 مليون ريال."],"steps":[{"t":["Net DMT income of the Kingdom:","صافي دخل المملكة:"],"x":"300000000+200000000-50000000","v":450000000,"u":"SAR"},{"t":["Blended ETR:","المعدل الممزوج:"],"x":"(48000000+6000000)/450000000*100","v":12,"u":"%"},{"t":["Top-up percentage:","نسبة الضريبة التكميلية:"],"x":"15-12","v":3,"u":"%"},{"t":["Excess profit:","الربح الزائد:"],"x":"450000000-90000000","v":360000000,"u":"SAR"},{"t":["Domestic top-up tax for the Kingdom:","الضريبة التكميلية المحلية للمملكة:"],"x":"3/100*360000000","v":10800000,"u":"SAR"},{"t":["A's share (300 of 500 of DMT income):","حصة (أ) (300 من 500 من الدخل):"],"x":"10800000*300000000/(300000000+200000000)","v":6480000,"u":"SAR"},{"t":["B's share (200 of 500):","حصة (ب) (200 من 500):"],"x":"10800000*200000000/(300000000+200000000)","v":4320000,"u":"SAR"}],"ans":["The Kingdom owes SAR 10.8m: A SAR 6.48m, B SAR 4.32m, C nothing. On its own B's ETR is only 3%; blending with A lifts it, but B still carries a share of the top-up by income.","على المملكة 10.8 ملايين ريال: (أ) 6.48 ملايين، و(ب) 4.32 ملايين، و(ج) لا شيء. ومعدل (ب) منفرداً 3% فقط؛ والمزج مع (أ) يرفعه، لكن (ب) يتحمل مع ذلك حصة من الضريبة بحسب الدخل."],"r":["53(2)","53(4)",54,55,56,"57(1)"],"p":["Blended ETR 12%: the Kingdom owes SAR 10.8m. A pays SAR 6.48m, B SAR 4.32m, C nothing.","المعدل الممزوج 12%: على المملكة 10.8 مليون ريال. تدفع (أ) 6.48 مليون، و(ب) 4.32 مليون، و(ج) لا شيء."],"diagrams":[{"type":"columns","at":"facts","title":["Each entity's own rate","معدل كل كيان منفرداً"],"cap":["ETR, %","المعدل الفعلي، %"],"items":[{"l":["A","(أ)"],"v":16},{"l":["B","(ب)"],"v":3}],"line":{"v":15,"l":["15% minimum","الحد الأدنى 15%"]},"note":["C made a loss, so it has no rate of its own.","(ج) خاسرة، فلا معدل لها منفردة."]},{"type":"gauge","at":"answer","v":12,"target":15,"max":20,"title":["The Kingdom's blended rate","المعدل الممزوج للمملكة"],"l":["Kingdom ETR","معدل المملكة الفعلي"],"tl":["minimum rate","الحد الأدنى"],"gap":["3% top-up on SAR 360m of excess profit = SAR 10.8m","ضريبة تكميلية 3% على ربح زائد قدره 360 مليون ريال = 10.8 مليون"]},{"type":"bars","at":"answer","title":["Who pays what","من يدفع كم"],"u":"SAR","items":[{"l":["A","(أ)"],"v":6480000},{"l":["B","(ب)"],"v":4320000,"tone":"g"},{"l":["C","(ج)"],"v":0}],"note":["Shares follow DMT income: A 300m and B 200m out of 500m. C made a loss, so it takes no share.","تتبع الحصص الدخل: (أ) 300 مليون و(ب) 200 مليون من 500 مليون. و(ج) خاسرة، فلا حصة لها."]}]},{"t":["Negative covered taxes in a loss year","ضرائب مشمولة سالبة في سنة خسارة"],"facts":["FY2028: the Kingdom has a net DMT loss of SAR 40m, and Adjusted Covered Taxes are −SAR 10m because of a large deferred tax credit.","السنة المالية 2028م: لدى المملكة صافي خسارة 40 مليون ريال، والضرائب المشمولة المعدلة سالبة بمقدار 10 ملايين ريال بسبب قيد دائن كبير في الض
