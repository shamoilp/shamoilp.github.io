وعات منفصلة."],"src":["OECD Administrative Guidance, February 2023","الإرشادات الإدارية للمنظمة، فبراير 2023م"]}],"cases":[{"t":["The short year that tipped the test","السنة القصيرة التي حسمت الاختبار"],"facts":["A group's French UPE moved its year-end from 30 June to 31 December. It has a Saudi subsidiary. Consolidated revenue:\n• Year to 30 Jun 2024 (12 months): €760m\n• Year to 30 Jun 2025 (12 months): €730m\n• 1 Jul–31 Dec 2025 (6 months): €390m\n• Calendar 2026 (12 months): €745m\nIs the Saudi subsidiary in scope for FY2027?","نقل الكيان الأم النهائي الفرنسي لمجموعة نهاية سنته المالية من 30 يونيو إلى 31 ديسمبر، وللمجموعة شركة تابعة في المملكة. الإيرادات الموحدة:\n• السنة المنتهية في 30 يونيو 2024م (12 شهراً): 760 مليون يورو\n• السنة المنتهية في 30 يونيو 2025م (12 شهراً): 730 مليون يورو\n• من 1 يوليو إلى 31 ديسمبر 2025م (6 أشهر): 390 مليون يورو\n• السنة التقويمية 2026م (12 شهراً): 745 مليون يورو\nهل تخضع الشركة التابعة في المملكة للنظام عن السنة المالية 2027م؟"],"steps":[{"t":["The four fiscal years immediately before FY2027 are the four periods listed.","السنوات المالية الأربع السابقة مباشرة للسنة المالية 2027م هي الفترات الأربع المذكورة."]},{"t":["Prorate the threshold for the 6-month year: €750m × 6 ÷ 12.","عدّل الحد تناسبياً للسنة ذات الأشهر الستة: 750 مليون يورو × 6 ÷ 12."],"x":"750000000*6/12","v":375000000,"u":"EUR"},{"t":["Compare each year: €760m meets €750m; €730m fails; €390m meets the prorated €375m; €745m fails.","قارن كل سنة: 760 مليوناً تستوفي 750 مليوناً؛ و730 مليوناً لا تستوفي؛ و390 مليوناً تستوفي الحد المعدل 375 مليوناً؛ و745 مليوناً لا تستوفي."],"v":2},{"t":["Two of the four years meet the threshold, so the test is met.","سنتان من الأربع تستوفيان الحد، فيتحقق الاختبار."]}],"ans":["In scope for FY2027. Without proration the short year would fail (€390m is below €750m) and the group would stay out. In practice each year's threshold is the riyal equivalent of €750m.","تخضع عن السنة المالية 2027م. ولولا التعديل التناسبي لفشلت السنة القصيرة (390 مليوناً أقل من 750 مليوناً) وبقيت المجموعة خارج النطاق. وعملياً يكون حد كل سنة ما يوازي 750 مليون يورو بالريال."],"r":["2(1)","2(3)"],"p":["In scope: scaling the threshold for the 6-month year makes it count.","خاضعة: تعديل العتبة لسنة الأشهر الستة يجعلها تُحتسب."],"diagrams":[{"type":"columns","at":"answer","title":["Each year against its own threshold","كل سنة مقارنةً بعتبتها"],"cap":["Revenue as % of that year's threshold (€750m, or €375m for the 6-month year)","الإيرادات كنسبة من عتبة السنة (750 مليون يورو، أو 375 مليوناً لسنة الأشهر الستة)"],"items":[{"l":["Jun 2024","يونيو 2024م"],"v":101.3},{"l":["Jun 2025","يونيو 2025م"],"v":97.3},{"l":["Dec 2025 (6 months)","ديسمبر 2025م (6 أشهر)"],"v":104},{"l":["Dec 2026","ديسمبر 2026م"],"v":99.3}],"line":{"v":100,"l":["100% = the year's threshold","100% = عتبة السنة"]},"verdict":["2 of 4 years meet their threshold: in scope for FY2027","سنتان من أربع تبلغان عتبتهما: خاضعة لعام 2027م"],"vt":"in"}]},{"t":["Who is the UPE, and who is in the Group?","من الكيان الأم النهائي، ومن ضمن المجموعة؟"],"facts":["Najd Holding (Saudi) owns 60% of Najd Steel (Saudi, consolidated), 100% of Najd Egypt (consolidated) and 30% of Gulf Logistics (UAE, equity-accounted associate). No one holds a controlling interest in Najd Holding. Consolidated revenue has been about €900m in each of the last four years.","تملك شركة نجد القابضة (سعودية) 60% من نجد للصلب (سعودية، موحّدة) و100% من نجد مصر (موحّدة) و30% من الخليج للخدمات اللوجستية (إماراتية، شركة زميلة بطريقة حقوق الملكية). ولا يملك أحد حصة مسيطرة في نجد القابضة. وبلغت الإيرادات الموحدة نحو 900 مليون يورو في كل من السنوات الأربع الأخيرة."],"steps":[{"t":["UPE: Najd Holding owns controlling interests and is not owned with a controlling interest by anyone.","الكيان الأم النهائي: نجد القابضة تملك حصصاً مسيطرة ولا يملكها أحد بحصة مسيطرة."]},{"t":["Group: Najd Holding, Najd Steel and Najd Egypt are consolidated. Gulf Logistics is equity-accounted, not consolidated, so it is outside the Group.","المجموعة: نجد القابضة ونجد للصلب ونجد مصر موحّدة. أما الخليج للخدمات اللوجستية فتُحتسب بطريقة حقوق الملكية ولا تُوحَّد، فهي خارج المجموعة."]},{"t":["MNE group: yes, because Najd Egypt is located outside the UPE's jurisdiction.","مجموعة متعددة الجنسيات: نعم، لأن نجد مصر تقع خارج ولاية الكيان الأم النهائي."]},{"t":["Revenue test: about €900m in every test year, so at least two of four years meet the threshold.","اختبار الإيرادات: نحو 900 مليون يورو في كل سنة اختبار، فتستوفي سنتان على الأقل من أربع الحد."]}],"ans":["Najd Holding (the UPE is also a constituent entity) and Najd Steel are Saudi constituent entities in scope. Najd Egypt is a constituent entity located in Egypt, outside the Saudi DMT. Gulf Logistics is not a constituent entity at all.","نجد القابضة (فالكيان الأم النهائي كيان تابع أيضاً) ونجد للصلب كيانان تابعان في المملكة ضمن النطاق. ونجد مصر كيان تابع يقع في مصر خارج ضريبة الحد الأدنى المحلي السعودية. أما الخليج للخدمات اللوجستية فليست كياناً تابعاً أصلاً."],"r":["7(1)","8(1)","8(2)","9(1)","10(1)"],"p":["Najd Holding is the UPE; it and Najd Steel are the Saudi entities in scope.","نجد القابضة هي الكيان الأم النهائي؛ وهي ونجد للصلب الكيانان الخاضعان في المملكة."],"diagrams":[{"type":"org","at":"facts","title":["The structure","الهيكل"],"nodes":[{"id":"h","t":["Najd Holding","نجد القابضة"],"s":["Saudi Arabia · no controlling owner","المملكة · لا مالك مسيطر"],"tone":"in"},{"id":"s","t":["Najd Steel","نجد للصلب"],"s":["Saudi Arabia · consolidated","المملكة · موحّدة"],"tone":"in"},{"id":"e","t":["Najd Egypt","نجد مصر"],"s":["Egypt · consolidated","مصر · موحّدة"]},{"id":"g","t":["Gulf Logistics","الخليج للخدمات اللوجستية"],"s":["UAE · associate","الإمارات · شركة زميلة"],"tone":"out"}],"edges":[{"f":"h","to":"s","l":["60%","60%"]},{"f":"h","to":"e","l":["100%","100%"]},{"f":"h","to":"g","l":["30%","30%"]}]}]},{"t":["A state fund's portfolio","محفظة صندوق حكومي"],"facts":["Watani Fund is a state investment fund that meets the Governmental Entity criterion of investing the government's assets. It directly holds controlling stakes in three Saudi companies, each with steady revenue over the last four years:\n• Company A: subsidiaries in KSA and Egypt; group revenue €1.2bn\n• Company B: operations only in KSA; revenue €2bn\n• Company C: a subsidiary in the UAE; group revenue €0.5bn","صندوق وطني صندوق استثماري حكومي يستوفي معيار الكيان الحكومي المتمثل في استثمار أصول الحكومة. ويملك مباشرة حصصاً مسيطرة في ثلاث شركات سعودية، ولكل منها إيرادات مستقرة خلال السنوات الأربع الأخيرة:\n• الشركة أ: شركات تابعة في المملكة ومصر؛ إيرادات المجموعة 1.2 مليار يورو\n• الشركة ب: عمليات في المملكة فقط؛ إيرادات 2 مليار يورو\n• الشركة ج: شركة تابعة في الإمارات؛ إيرادات المجموعة 0.5 مليار يورو"],"steps":[{"t":["Had the fund been the UPE, all three would form one group with this revenue:","لو كان الصندوق الكيان الأم النهائي، لشكلت الشركات الثلاث مجموعة واحدة بهذه الإيرادات:"],"x":"1200000000+2000000000+500000000","v":3700000000,"u":"EUR"},{"t":["But the fund meets the Governmental Entity criterion, so it is ignored. A, B and C are each the UPE of their own group.","لكن الصندوق يستوفي معيار الكيان الحكومي، فيتم تجاهله. وتُعد كل من أ وب وج الكيان الأم النهائي لمجموعتها."]},{"t":["Group A: an MNE group (Egypt) with €1.2bn, above €750m. In scope.","مجموعة أ: متعددة الجنسيات (مصر) بإيرادات 1.2 مليار يورو تتجاوز 750 مليوناً. ضمن النطاق."]},{"t":["Group B: purely domestic, so not an MNE group. Out of scope despite €2bn.","مجموعة ب: محلية بالكامل، فليست متعددة الجنسيات. خارج النطاق رغم إيراداتها البالغة 2 مليار يورو."]},{"t":["Group C: an MNE group (UAE) but €0.5bn is below €750m. Out of scope.","مجموعة ج: متعددة الجنسيات (الإمارات) لكن 0.5 مليار يورو أقل من 750 مليوناً. خارج النطاق."]}],"ans":["Only Company A's Saudi entities are in scope. Without the sovereign fund rule all three would be one €3.7bn MNE group, and B's and C's Saudi entities would be caught too.","الكيانات السعودية للشركة أ وحدها ضمن النطاق. ولولا قاعدة صناديق الثروة السيادية لكانت الشركات الثلاث مجموعة متعددة الجنسيات واحدة بإيرادات 3.7 مليار يورو، ولخضعت كيانات ب وج في المملكة أيضاً."],"r":["10(2)","13(2)","8(1)","2(1)"],"p":["Only Company A's group is in: B is purely domestic and C is under €750m.","لا تخضع إلا مجموعة الشركة (أ): فـ(ب) محلية فقط، و(ج) دون 750 مليون يورو."],"diagrams":[{"type":"org","at":"facts","title":["The fund and its companies","الصندوق وشركاته"],"nodes":[{"id":"f","t":["Watani Fund","صندوق وطني"],"s":["state fund · ignored as parent","صندوق حكومي · لا يُعد كياناً أماً"],"tone":"out"},{"id":"a","t":["Company A","الشركة أ"],"s":["KSA + Egypt · €1.2bn","المملكة ومصر · 1.2 مليار يورو"],"tone":"in"},{"id":"b","t":["Company B","الشركة ب"],"s":["KSA only · €2bn","المملكة فقط · 2 مليار يورو"]},{"id":"c","t":["Company C","الشركة ج"],"s":["KSA + UAE · €0.5bn","المملكة والإمارات · 0.5 مليار يورو"]}],"edges":[{"f":"f","to":"a"},{"f":"f","to":"b"},{"f":"f","to":"c"}]},{"type":"table","at":"answer","title":["Each company is its own group","كل شركة مجموعة مستقلة"],"head":[["Group","المجموعة"],["Outside the parent's country?","خارج دولة الكيان الأم؟"],["Revenue","الإيرادات"],["Result","النتيجة"]],"rows":[[["A","أ"],["Yes (Egypt)","نعم (مصر)"],["€1.2bn","1.2 مليار يورو"],["In scope","خاضعة"]],[["B","ب"],["No","لا"],["€2bn","2 مليار يورو"],["Out: not an MNE group","غير خاضعة: ليست مجموعة متعددة الجنسيات"]],[["C","ج"],["Yes (UAE)","نعم (الإمارات)"],["€0.5bn","0.5 مليار يورو"],["Out: below €750m","غير خاضعة: دون 750 مليون يورو"]]]}]}],"quiz":[{"q":["What turns a Group into an MNE Group?","ما الذي يجعل المجموعة مجموعة متعددة الجنسيات؟"],"o":[["At least one entity or PE located outside the UPE's jurisdiction","كيان أو منشأة دائمة واحدة على الأقل تقع خارج ولاية الكيان الأم النهائي"],["Consolidated revenue of €750m or more in 2 of the 4 prior years","إيرادات موحدة تبلغ 750 مليون يورو أو أكثر في سنتين من السنوات الأربع السابقة"],["At least one shareholder of the UPE resident outside its jurisdiction","مساهم واحد على الأقل في الكيان الأم النهائي مقيم خارج ولايته"],["At least one group entity listed on a stock exchange outside the Kingdom","كيان واحد على الأقل من المجموعة مدرج في سوق مالية خارج المملكة"]],"a":0,"e":["Article 8(1). Foreign shareholders or listings do not matter; what matters is an entity or PE located outside the UPE's jurisdiction.","المادة 8 (1). لا عبرة بالمساهمين الأجانب أو الإدراج، بل بوجود كيان أو منشأة دائمة خارج ولاية الكيان الأم النهائي."],"r":["8(1)"]},{"q":["A subsidiary is left out of the UPE's consolidated statements only because it is immaterial. Is it part of the Group?","استُبعدت شركة تابعة من القوائم الموحدة للكيان الأم النهائي فقط لعدم أهميتها النسبية. هل هي جزء من المجموعة؟"],"o":[["Yes, if size or materiality was the only reason for leaving it out","نعم، إذا كان الحجم أو الأهمية النسبية السبب الوحيد لاستبعادها"],["No, only entities consolidated line by line are Group members","لا، فلا يُعد عضواً في المجموعة إلا الكيان الموحد بنداً بنداً"],["Yes, but only if it is located in the Kingdom or another GCC state","نعم، ولكن فقط إذا كانت تقع في المملكة أو في دولة خليجية أخرى"],["No, unless ZATCA approves its inclusion before the return is filed","لا، ما لم توافق الهيئة على إدراجها قبل تقديم الإقرار"]],"a":0,"e":["Article 8(2)(b): entities excluded solely on size or materiality grounds, or because they are held for sale, are still Group members.","المادة 8 (2) (ب): الكيانات المستبعدة فقط على أساس الحجم أو الجوهر، أو لكونها محتفظاً بها لغرض البيع، تبقى أعضاء في المجموعة."],"r":["8(2)"]},{"q":["What is a Controlling Interest?","ما الحصة المسيطرة؟"],"o":[["An interest carrying more than 50% of the votes, whatever the accounting treatment","حصة تمنح أكثر من 50% من الأصوات، أياً كانت المعالجة المحاسبية"],["An interest that requires, or would require, line-by-line consolidation of the entity","حصة تستوجب، أو كانت ستستوجب، توحيد الكيان بنداً بنداً"],["An interest of 10% or more, held for at least one year at the year-end","حصة نسبتها 10% أو أكثر، محتفظ بها سنة على الأقل في نهاية السنة"],["An interest accounted for under the equity method in the consolidated accounts","حصة تُحاسب بطريقة حقوق الملكية في القوائم الموحدة"]],"a":1,"e":["Article 7(1) is an accounting test: line-by-line consolidation, actual or hypothetical. A voting percentage alone does not decide it.","المادة 7 (1) اختبار محاسبي: التوحيد على أساس كل بند على حدة، فعلياً أو افتراضياً. ولا تكفي نسبة التصويت وحدها."],"r":["7(1)"]},{"q":["Which of these is NOT an Acceptable Financial Accounting Standard under Article 1?","أي مما يلي ليس من المعايير المحاسبية المالية المقبولة وفق المادة 1؟"],"o":[["New Zealand GAAP","المبادئ المحاسبية النيوزيلندية"],["US GAAP","المبادئ المحاسبية الأمريكية"],["Indonesian GAAP","المبادئ المحاسبية الإندونيسية"],["Indian GAAP","المبادئ المحاسبية الهندية"]],"a":2,"e":["Article 1 lists IFRS and the GAAP of named jurisdictions, including New Zealand, India and the USA. Indonesia is not on the list, so statements under its GAAP need adjusting for material competitive distortions (Art 4).","تسرد المادة 1 المعايير الدولية والمبادئ المحاسبية لولايات محددة، منها نيوزيلندا والهند والولايات المتحدة. وليست إندونيسيا من بينها، فتحتاج القوائم المعدة وفق مبادئها إلى تعديل التباينات التنافسية الجوهرية (المادة 4)."],"r":[1,"4(1)"]},{"q":["Do net investment gains count towards the €750m revenue test?","هل يُحتسب صافي المكاسب الاستثمارية ضمن اختبار إيرادات 750 مليون يورو؟"],"o":[["Yes, provided they are realised and shown in the consolidated P&L","نعم، شريطة أن تكون محققة وظاهرة في قائمة الأرباح والخسائر الموحدة"],["No, revenue means sales of goods and services only","لا، فالإيرادات تقتصر على بيع السلع وتقديم الخدمات"],["Yes, if recognised in other comprehensive income","نعم، إذا كانت مثبتة في الدخل الشامل الآخر"],["Yes, realised or unrealised, if in the consolidated P&L","نعم، المحققة وغير المحققة، إذا كانت في قائمة الأرباح والخسائر الموحدة"]],"a":3,"e":["Article 3(1)(b) includes net investment gains, realised or unrealised, shown in the consolidated P&L, and income or gains presented separately as extraordinary or non-recurring.","تُدرج المادة 3 (1) (ب) صافي المكاسب الاستثمارية المحققة وغير المحققة الظاهرة في قائمة الأرباح والخسائر الموحدة، والدخل أو المكاسب المعروضة كبنود استثنائية أو غير متكررة."],"r":["3(1)"]},{"q":["The consolidated P&L shows gross investment gains of €40m and gross investment losses of €55m separately. How do the losses affect revenue?","تُظهر قائمة الأرباح والخسائر الموحدة إجمالي مكاسب استثمارية 40 مليون يورو وإجمالي خسائر 55 مليوناً بشكل منفصل. كيف تؤثر الخسائر في الإيرادات؟"],"o":[["They reduce revenue by €55m, the full amount of the losses","تخفض الإيرادات بـ55 مليوناً، أي بكامل مبلغ الخسائر"],["They reduce revenue by €15m, the net loss on investments","تخفض الإيرادات بـ15 مليوناً، أي بصافي خسارة الاستثمارات"],["They reduce revenue by €95m, the gains and losses added together","تخفض الإيرادات بـ95 مليوناً، أي بمجموع المكاسب والخسائر"],["They reduce revenue by €40m, the amount of the gains","تخفض الإيرادات بـ40 مليوناً، أي بمقدار المكاسب"]],"a":3,"e":["Article 3(4): gross investment losses reduce revenue only to the extent of gross investment gains, so the reduction is capped at €40m.","المادة 3 (4): تخفض إجمالي خسائر الاستثمارات الإيرادات بحدود إجمالي المكاسب الاستثمارية فقط، فيكون التخفيض بحد أقصى 40 مليوناً."],"r":["3(4)"]},{"q":["One of the four test years was a 9-month period. What threshold applies to it?","كانت إحدى سنوات الاختبار الأربع فترة من 9 أشهر. ما الحد الذي ينطبق عليها؟"],"o":[["€750m","750 مليون يورو"],["€562.5m","562.5 مليون يورو"],["€1,000m","1,000 مليون يورو"],["€500m","500 مليون يورو"]],"a":1,"e":["Article 2(3) adjusts the threshold in proportion to the year's length: €750m × 9 ÷ 12 = €562.5m (in riyal terms).","تعدّل المادة 2 (3) الحد بما يتناسب مع مدة السنة: 750 مليوناً × 9 ÷ 12 = 562.5 مليون يورو (بما يوازيها بالريال)."],"r":["2(3)"]},{"q":["Which entity is the Ultimate Parent Entity?","أي كيان هو الكيان الأم النهائي؟"],"o":[["The entity that controls another entity and is listed on a stock exchange","الكيان الذي يسيطر على كيان آخر ويكون مدرجاً في سوق مالية"],["The entity with the largest consolidated revenue in the group in the tested year","الكيان صاحب أكبر إيرادات موحدة في المجموعة في سنة الاختبار"],["The entity that controls another entity and is not controlled by any other entity","الكيان الذي يسيطر على كيان آخر ولا يسيطر عليه أي كيان آخر"],["The entity the group appoints to file its GloBE information return","الكيان الذي تعيّنه المجموعة لتقديم إقرار معلومات القواعد العالمية"]],"a":2,"e":["Article 10(1)(a). Size and listing are irrelevant; the filing entity may be a different entity.","المادة 10 (1) (أ). لا عبرة بالحجم أو الإدراج، وقد يكون الكيان المعين لتقديم الإقرار كياناً آخر."],"r":["10(1)"]},{"q":["A state fund that meets the Governmental Entity criterion of investing government assets directly controls several companies. How are they tested?","صندوق حكومي يستوفي معيار الكيان الحكومي المتمثل في استثمار أصول الحكومة يسيطر مباشرة على عدة شركات. كيف تُختبر؟"],"o":[["The fund is the UPE, and the companies it controls form one MNE group","الصندوق هو الكيان الأم النهائي، وتشكل الشركات التي يسيطر عليها مجموعة واحدة"],["The fund is ignored, and each company it controls is an excluded entity","يتم تجاهل الصندوق، وتُعد كل شركة يسيطر عليها كياناً مستبعداً"],["The fund is the UPE, but only its Saudi companies are tested","الصندوق هو الكيان الأم النهائي، لكن لا تُختبر إلا شركاته في المملكة"],["The fund is ignored; each directly controlled company is the UPE of its own group","يتم تجاهل الصندوق؛ وكل شركة يسيطر عليها مباشرة هي الكيان الأم النهائي لمجموعتها"]],"a":3,"e":["Article 10(2): the fund is not treated as a UPE and is ignored. Its portfolio companies are not excluded entities by that fact; each heads its own group for the scope test.","المادة 10 (2): لا يُعامل الصندوق كياناً أماً نهائياً ويتم تجاهله. ولا تصبح شركات محفظته كيانات مستبعدة لهذا السبب، بل ترأس كل منها مجموعتها لأغراض اختبار النطاق."],"r":["10(2)"]},{"q":["How is the Saudi branch (PE) of a group company treated?","كيف يُعامل الفرع (المنشأة الدائمة) في المملكة لشركة من المجموعة؟"],"o":[["As part of its main entity, which reports the branch's income","كجزء من كيانه الرئيسي، الذي يُدرج دخل الفرع في نتائجه"],["As a constituent entity only if it keeps separate audited accounts","ككيان تابع فقط إذا كانت له حسابات منفصلة مراجَعة"],["As its own constituent entity, separate from its main entity","ككيان تابع مستقل بذاته، منفصل عن كيانه الرئيسي"],["As its own excluded entity, separate from its main entity","ككيان مستبعد مستقل بذاته، منفصل عن كيانه الرئيسي"]],"a":2,"e":["Article 9(1)(b) and 9(2): a PE of a group entity is a constituent entity in its own right, separate from the main entity and its other PEs.","المادة 9 (1) (ب) و9 (2): المنشأة الدائمة لكيان في المجموعة كيان تابع بذاتها، منفصلة عن الكيان الرئيسي ومنشآته الأخرى."],"r":["9(1)","9(2)"]},{"q":["An accounting principle under a local GAAP gives a material competitive distortion. What happens?","أدى مبدأ محاسبي في معايير محلية إلى تباين تنافسي جوهري. ماذا يحدث؟"],"o":[["The item is adjusted to the US GAAP treatment, under guidance issued by ZATCA","يُعدّل البند إلى معالجة المبادئ المحاسبية الأمريكية وفق إرشادات تصدرها الهيئة"],["The item is adjusted to the IFRS treatment, under guidance issued by ZATCA","يُعدّل البند إلى معالجة المعايير الدولية وفق إرشادات تصدرها الهيئة"],["Nothing: an acceptable local GAAP always applies without adjustment","لا شيء: تُطبق المعايير المحلية المقبولة دائماً دون تعديل"],["The whole consolidated accounts must be restated under IFRS for that year","يجب إعادة إصدار القوائم الموحدة كاملة وفق المعايير الدولية لتلك السنة"]],"a":1,"e":["Article 4(2): the treatment of the item is adjusted to conform with IFRS, in accordance with guidance issued by the Authority.","المادة 4 (2): تُعدّل معالجة البند لتتوافق مع المعايير الدولية للتقرير المالي، وفق الإرشادات الصادرة عن الهيئة."],"r":["4(2)"]},{"q":["A group of Saudi companies has no entity or PE outside the Kingdom and revenue of €3bn. Is it in scope?","مجموعة شركات سعودية ليس لها أي كيان أو منشأة دائمة خارج المملكة، وإيراداتها 3 مليارات يورو. هل تخضع للنظام؟"],"o":[["No: with no entity or PE abroad, it is not an MNE group","لا: فلا كيان ولا منشأة دائمة لها في الخارج، فليست متعددة الجنسيات"],["Yes: its revenue is far above the €750m scope threshold","نعم: فإيراداتها تتجاوز كثيراً حد النطاق البالغ 750 مليون يورو"],["Yes, if any of its shareholders is resident outside the Kingdom","نعم، إذا كان أحد مساهميها مقيماً خارج المملكة"],["No, because Saudi-parented groups fall outside the draft","لا، لأن المجموعات ذات الكيان الأم السعودي خارج نطاق المشروع"]],"a":0,"e":["Articles 2(1) and 8(1): the law reaches members of an MNE group. A group with every entity and PE in the UPE's jurisdiction is not one, whatever its size.","المادتان 2 (1) و8 (1): يشمل النظام أعضاء المجموعات المتعددة الجنسيات. والمجموعة التي تقع جميع كياناتها ومنشآتها في ولاية الكيان الأم النهائي ليست كذلك مهما كان حجمها."],"r":["2(1)","8(1)"]}],"cards":[{"f":["Group","المجموعة"],"b":["Entities in the UPE's consolidated statements, or left out only for size, materiality or held for sale; or an entity with foreign PEs not in another Group.","كيانات في القوائم الموحدة للكيان الأم النهائي أو مستبعدة منها فقط بسبب الحجم أو الجوهر أو الاحتفاظ بها للبيع؛ أو كيان له منشآت دائمة في الخارج وليس ضمن مجموعة أخرى."],"r":["8(2)","8(3)"]},{"f":["MNE Group","المجموعة المتعددة الجنسيات"],"b":["A Group with at least one entity or PE outside the UPE's jurisdiction.","مجموعة لديها كيان أو منشأة دائمة واحدة على الأقل خارج ولاية الكيان الأم النهائي."],"r":["8(1)"]},{"f":["Constituent Entity","الكيان التابع"],"b":["Any entity included in a Group and any PE of such an entity; never an Excluded Entity.","أي كيان مشمول في مجموعة وأي منشأة دائمة له؛ ولا يكون كياناً مستبعداً أبداً."],"r":[9]},{"f":["Ultimate Parent Entity","الكيان الأم النهائي"],"b":["Owns a controlling interest in another entity and is not owned with a controlling interest by anyone else.","يملك حصة مسيطرة في كيان آخر ولا يملكه غيره بحصة مسيطرة."],"r":["10(1)"]},{"f":["Controlling Interest","الحصة المسيطرة"],"b":["An interest requiring line-by-line consolidation under an Acceptable Financial Accounting Standard, or that would if consolidated statements were prepared.","حصة تستوجب التوحيد على أساس كل بند على حدة وفق المعايير المحاسبية المالية المقبولة، أو كانت ستستوجبه لو أُعدت قوائم موحدة."],"r":[7]},{"f":["Which statements does the revenue test use?","ما القوائم التي يعتمد عليها اختبار الإيرادات؟"],"b":["The UPE's consolidated financial statements, in riyal terms.","القوائم المالية الموحدة للكيان الأم النهائي، مقوّمة بالريال."],"r":["2(1)",4]},{"f":["What does revenue include?","ماذا تشمل الإيرادات؟"],"b":["Goods, services and ordinary activities, plus net investment gains (realised or unrealised) and extraordinary or non-recurring items.","السلع والخدمات والأنشطة الاعتيادية، إضافة إلى صافي المكاسب الاستثمارية (المحققة وغير المحققة) والبنود الاستثنائية أو غير المتكررة."],"r":["3(1)"]},{"f":["What is never deducted from revenue?","ما الذي لا يُخصم من الإيرادات أبداً؟"],"b":["Cost of sales and other operating expenses. Discounts, returns and allowances may be netted if the standard allows.","تكلفة المبيعات والمصاريف التشغيلية الأخرى. أما الخصومات والمرتجعات والمسموحات فتجوز مقاصتها إذا سمح المعيار."],"r":["3(2)"]},{"f":["Test year that is not 12 months","سنة اختبار لا تساوي 12 شهراً"],"b":["Adjust the €750m threshold in proportion to the year's length.","عدّل حد 750 مليون يورو بما يتناسب مع مدة السنة."],"r":["2(3)"]},{"f":["Sovereign wealth fund rule","قاعدة صناديق الثروة السيادية"],"b":["A fund meeting the Governmental Entity investing criterion is ignored; each company it directly controls is the UPE of its own group.","يُتجاهل الصندوق الذي يستوفي معيار الكيان الحكومي في الاستثمار؛ وكل شركة يسيطر عليها مباشرة هي الكيان الأم النهائي لمجموعتها."],"r":["10(2)"]},{"f":["Material competitive distortion","التباين التنافسي الجوهري"],"b":["Adjust the item to the IFRS treatment, following ZATCA guidance.","عدّل البند إلى معالجة المعايير الدولية للتقرير المالي وفق إرشادات الهيئة."],"r":["4(2)"]},{"f":["A main entity and its PEs","الكيان الرئيسي ومنشآته الدائمة"],"b":["The main entity is deemed to hold the controlling interest in its PEs; each PE is a separate constituent entity.","يُعد الكيان الرئيسي مالكاً للحصة المسيطرة في منشآته الدائمة؛ وكل منشأة دائمة كيان تابع منفصل."],"r":["7(2)","9(2)"]}],"terms":[{"t":["Group","المجموعة"],"d":["The companies in the parent's consolidated accounts, plus any left out only for size, materiality or because they are held for sale.","الشركات الواردة في القوائم الموحدة للكيان الأم، ومعها ما استُبعد منها فقط لصغر حجمه أو عدم أهميته النسبية أو للاحتفاظ به للبيع."]},{"t":["MNE group","المجموعة متعددة الجنسيات"],"d":["A group with at least one company or branch outside the parent's country.","مجموعة لها شركة أو فرع واحد على الأقل خارج دولة الكيان الأم."]},{"t":["Constituent entity","الكيان التابع"],"d":["Any group company, and any branch (PE), each counted on its own.","أي شركة في المجموعة، وأي فرع (منشأة دائمة)، ويُحتسب كلٌّ منها بمفرده."]},{"t":["Ultimate parent entity (UPE)","الكيان الأم النهائي"],"d":["The company at the top: it controls others and nobody controls it.","الشركة في القمة: تسيطر على غيرها ولا يسيطر عليها أحد."]},{"t":["Controlling interest","الحصة المسيطرة"],"d":["A stake that makes the owner consolidate the company line by line.","حصة تجعل المالك يوحّد الشركة بنداً بنداً."]},{"t":["Acceptable accounting standard","المعيار المحاسبي المقبول"],"d":["IFRS, or one of the national GAAPs listed in the draft.","المعايير الدولية للتقرير المالي، أو أحد المعايير الوطنية المذكورة في المشروع."]},{"t":["Sovereign wealth fund","صندوق الثروة السيادي"],"d":["A state fund that invests government assets. It is ignored as a parent.","صندوق حكومي يستثمر أصول الحكومة، ولا يُعد كياناً أماً."]}],"range":"2–4, 7–10"},{"id":3,"title":["Scope II: where an entity is located","النطاق (2): أين يقع الكيان"],"goal":["Locate any entity or PE for DMT purposes: residence, place of creation, flow-through entities, the four kinds of PE, dual-residence tie-breakers and stateless entities.","تحديد موقع أي كيان أو منشأة دائمة لأغراض النظام: الإقامة، ومكان الإنشاء، والكيانات الشفافة مالياً، وأنواع المنشأة الدائمة الأربعة، وقواعد الترجيح عند ازدواج الإقامة، والكيانات عديمة الجنسية."],"parts":[2],"arts":[5,6,9,11],"time":30,"metaphor":{"title":["An address for every entity","عنوان لكل كيان"],"text":["The DMT only taxes profits with a Saudi address, so every entity and branch needs exactly one address. Most get it from where they are tax resident; if they are resident nowhere, it is where they were created. Branches (PEs) get the address of the country that taxes them as a branch.\nWhen two countries both claim the same company, the draft runs a tie-break ladder: the treaty first, then who collected more covered taxes, then who hosts more substance. If it is still a tie, the entity is homeless (stateless) and is taxed in a box of its own.","لا تفرض ضريبة الحد الأدنى المحلي إلا على الأرباح التي عنوانها في المملكة، لذا يحتاج كل كيان وكل فرع إلى عنوان واحد فقط. يأخذ معظم الكيانات عنوانها من مكان إقامتها الضريبية؛ فإن لم تكن مقيمة في أي مكان، فعنوانها حيث أُنشئت. أما الفروع (المنشآت الدائمة) فعنوانها الدولة التي تفرض عليها الضريبة بوصفها فرعاً.\nوعندما تطالب دولتان بالشركة نفسها، يطبّق المشروع سلّماً للترجيح: الاتفاقية أولاً، ثم من حصّل ضرائب مشمولة أكثر، ثم من يستضيف جوهراً أكبر. فإن بقي التعادل، يصبح الكيان بلا عنوان (عديم الجنسية) ويُعامل في صندوق مستقل."]},"anchors":[{"if":["A company is Saudi-incorporated or managed from the Kingdom","شركة مؤسسة في المملكة أو تُدار منها"],"then":["It is tax resident under the Income Tax Law, so it is located in the Kingdom unless another country also claims it (Arts 5(1), 6)","فهي مقيمة ضريبياً وفق نظام ضريبة الدخل، فتقع في المملكة ما لم تطالب بها دولة أخرى أيضاً (المادتان 5 (1) و6)"]},{"if":["Two countries both treat the company as resident","تعامل دولتان الشركة على أنها مقيمة فيهما"],"then":["Climb the ladder: treaty tie-breaker → more covered taxes (ignore CFC tax) → more SBIE → stateless (Art 5(4))","اصعد السلّم: ترجيح الاتفاقية ← ضرائب مشمولة أكثر (دون ضريبة الشركات الأجنبية الخاضعة للسيطرة) ← استبعاد جوهر أكبر ← عديم الجنسية (المادة 5 (4))"]},{"if":["A foreign group company has a Saudi branch","شركة أجنبية في المجموعة لها فرع في المملكة"],"then":["Treat the branch as its own constituent entity located in the Kingdom if the Kingdom taxes it as a PE (Arts 5(3), 9(2), 11)","عامل الفرع ككيان تابع مستقل يقع في المملكة إذا كانت المملكة تفرض عليه الضريبة كمنشأة دائمة (المواد 5 (3) و9 (2) و11)"]},{"if":["A partnership or other transparent vehicle is created in Saudi Arabia","شراكة أو أداة شفافة أخرى أُنشئت في المملكة"],"then":["Unless it is the UPE or must apply an IIR, it is stateless; stateless entities created under Saudi law are still in scope (Arts 5(2), 2(2))","ما لم تكن الكيان الأم النهائي أو ملزمة بتطبيق قاعدة تضمين الدخل، فهي عديمة الجنسية؛ والكيانات عديمة الجنسية المنشأة بموجب أنظمة المملكة تبقى ضمن النطاق (المادتان 5 (2) و2 (2))"]},{"if":["An entity moves its residence mid-year","ينقل كيان إقامته خلال السنة"],"then":["For that year it stays located where it was at the start of the year (Art 5(5))","يبقى موقعه لتلك السنة حيث كان في بدايتها (المادة 5 (5))"]}],"diagrams":[{"type":"flow","title":["The tie-break ladder for a dual-resident constituent entity","سلّم الترجيح للكيان التابع مزدوج الإقامة"],"nodes":[{"t":["1. Treaty","1. الاتفاقية"],"s":["deemed residence under the treaty · Art 5(4)(a)","الإقامة الاعتبارية بموجب الاتفاقية · المادة 5 (4) (أ)"]},{"t":["2. Covered taxes","2. الضرائب المشمولة"],"s":["where it paid more, ignoring CFC tax · Art 5(4)(b)(1)","حيث سدد أكثر، دون ضريبة الشركات الأجنبية الخاضعة للسيطرة · المادة 5 (4) (ب) (1)"]},{"t":["3. Substance","3. الجوهر"],"s":["where its entity-level SBIE is greater · Art 5(4)(b)(2)","حيث يكون الاستبعاد على أساس الجوهر على مستوى الكيان أكبر · المادة 5 (4) (ب) (2)"]},{"t":["4. Stateless","4. عديم الجنسية"],"s":["unless it is the UPE: then where created · Art 5(4)(b)(3)","ما لم يكن الكيان الأم النهائي: فحيث أُنشئ · المادة 5 (4) (ب) (3)"]}],"note":["Go straight to step 2 if there is no treaty, if the treaty needs a mutual agreement that has not been reached, or if the treaty gives no relief because the entity is resident in both states.","انتقل مباشرة إلى الخطوة 2 إذا لم توجد اتفاقية، أو إذا تطلبت الاتفاقية اتفاقاً متبادلاً لم يتم التوصل إليه، أو إذا لم تمنح الاتفاقية إعفاءً لأن الكيان مقيم في الدولتين."],"quick":true},{"type":"table","title":["The four kinds of PE and where each is located","أنواع المنشأة الدائمة الأربعة وموقع كل منها"],"head":[["Kind of PE (Art 11)","نوع المنشأة الدائمة (المادة 11)"],["Located in (Art 5(3))","تقع في (المادة 5 (3))"]],"rows":[[["(1) A PE under an applicable treaty, taxed like Article 7 of the OECD Model","(1) منشأة دائمة بموجب اتفاقية سارية، تخضع للضريبة وفق حكم مماثل للمادة 7 من النموذج"],["The jurisdiction that treats it as a PE and taxes it under the treaty","الولاية التي تعاملها كمنشأة دائمة وتفرض عليها الضريبة بموجب الاتفاقية"]],[["(2) No treaty: a place of business taxed on a net basis like a resident","(2) لا اتفاقية: مكان عمل يخضع للضريبة على صافي الأرباح كالمقيمين"],["The jurisdiction that taxes it on a net basis","الولاية التي تفرض عليه الضريبة على أساس الصافي"]],[["(3) A jurisdiction with no corporate income tax: would be a PE under the OECD Model","(3) ولاية بلا ضريبة دخل على الشركات: كان سيُعد منشأة دائمة وفق النموذج"],["The jurisdiction where it is situated","الولاية التي يتواجد فيها"]],[["(4) Any other place of business whose income the head office country exempts","(4) أي مكان عمل آخر تعفي دولة المركز الرئيسي دخله"],["Stateless PE","منشأة دائمة عديمة الجنسية"]]]}],"points":[{"h":["Ordinary entities","الكيانات العادية"],"t":["An entity that is not a flow-through entity is located where it is tax resident because of its place of management, place of creation or a similar criterion. If it is not resident anywhere on such a basis, it is located where it was created.","يقع الكيان الذي لا يُعد كياناً شفافاً مالياً في الولاية التي يكون مقيماً ضريبياً فيها بناءً على مكان إدارته أو مكان إنشائه أو أي معيار مماثل. فإن لم يكن مقيماً على هذا الأساس في أي مكان، فإنه يقع حيث أُنشئ."],"r":["5(1)"],"p":["A company is located where it is tax resident; if nowhere, where it was created.","تقع الشركة حيث تكون مقيمة ضريبياً؛ فإن لم تكن مقيمة في أي مكان، فحيث أُنشئت."]},{"h":["Saudi tax residence","الإقامة الضريبية في المملكة"],"t":["An entity is tax resident in the Kingdom if it meets the residency conditions of the Income Tax Law. Under the current Income Tax Law (Article 3), a company is resident if it is formed under the Companies Law or its central management is in the Kingdom.","يُعد الكيان مقيماً ضريبياً في المملكة إذا استوفى شروط الإقامة في نظام ضريبة الدخل. ووفق نظام ضريبة الدخل الحالي (المادة 3)، تكون الشركة مقيمة إذا أُسست وفق نظام الشركات أو كانت إدارتها المركزية في المملكة."],"r":[6],"p":["Formed under Saudi company law, or managed from the Kingdom, means Saudi resident.","التأسيس وفق نظام الشركات السعودي، أو الإدارة من المملكة، يعني الإقامة في المملكة."]},{"h":["Flow-through entities","الكيانات الشفافة مالياً"],"t":["A flow-through entity is located where it was created only if it is the UPE or must apply an IIR. Otherwise it is stateless. Stateless constituent entities created under Saudi law, including in the Special Economic Zones, are within the law's scope.","لا يقع الكيان الشفاف مالياً حيث أُنشئ إلا إذا كان الكيان الأم النهائي أو كان ملزماً بتطبيق قاعدة تضمين الدخل. وفي غير ذلك يكون عديم الجنسية. وتخضع للنظام الكيانات التابعة عديمة الجنسية المنشأة بموجب أنظمة المملكة، بما في ذلك المناطق الاقتصادية الخاصة."],"r":["5(2)","2(2)"],"p":["A see-through entity is stateless unless it is the UPE or applies an IIR.","الكيان الشفاف عديم الجنسية ما لم يكن الكيان الأم النهائي أو يطبق قاعدة تضمين الدخل."]},{"h":["Permanent establishments","المنشآت الدائمة"],"t":["Article 11 recognises four kinds of PE: a treaty PE taxed like Article 7 of the OECD Model; without a treaty, a place of business taxed on a net basis like a resident; in a country with no corporate income tax, a place that would be a PE under the OECD Model; and any other place of business whose income the head office country exempts, which is stateless.","تعترف المادة 11 بأربعة أنواع من المنشأة الدائمة: منشأة بموجب اتفاقية تخضع للضريبة وفق حكم مماثل للمادة 7 من النموذج؛ وفي غياب الاتفاقية، مكان عمل يخضع للضريبة على أساس الصافي كالمقيمين؛ وفي دولة بلا ضريبة دخل على الشركات، مكان كان سيُعد منشأة دائمة وفق النموذج؛ وأي مكان عمل آخر تعفي دولة المركز الرئيسي دخله، ويكون عديم الجنسية."],"r":[11,"5(3)"],"p":["A branch usually takes the address of the country that taxes it as a branch.","يأخذ الفرع عادةً عنوان الدولة التي تفرض عليه الضريبة بصفته فرعاً."]},{"h":["Each PE stands alone","كل منشأة دائمة مستقلة"],"t":["A PE is a constituent entity separate from its main entity and from the main entity's other PEs. A Saudi branch of a foreign group company is therefore a Saudi constituent entity in its own right.","المنشأة الدائمة كيان تابع منفصل عن الكيان الرئيسي وعن منشآته الدائمة الأخرى. لذا يكون الفرع في المملكة لشركة أجنبية في المجموعة كياناً تابعاً في المملكة بذاته."],"r":["9(2)"],"p":["A Saudi branch of a foreign company is a Saudi entity in its own right.","فرع الشركة الأجنبية في المملكة كيان سعودي قائم بذاته."]},{"h":["Dual residence: the ladder","ازدواج الإقامة: سلّم الترجيح"],"t":["With a treaty, the entity is located where the treaty deems it resident. If the treaty needs a mutual agreement that has not been reached, or gives no relief, use the no-treaty rules: where it paid more covered taxes for the year (ignoring CFC regime taxes), then where its entity-level SBIE is greater, and otherwise it is stateless unless it is the UPE, which is located where it was created.","مع وجود اتفاقية، يقع الكيان حيث تعدّه الاتفاقية مقيماً. فإن تطلبت الاتفاقية اتفاقاً متبادلاً لم يتم التوصل إليه أو لم تمنح إعفاءً، تُطبق قواعد غياب الاتفاقية: حيث سدد ضرائب مشمولة أكثر عن السنة (دون ضرائب نظام الشركات الأجنبية الخاضعة للسيطرة)، ثم حيث يكون الاستبعاد على أساس الجوهر على مستوى الكيان أكبر، وإلا كان عديم الجنسية ما لم يكن الكيان الأم النهائي فيقع حيث أُنشئ."],"r":["5(4)","5(6)"],"p":["Two countries claim it? Treaty first, then more tax paid, then more substance, else stateless.","تطالب به دولتان؟ الاتفاقية أولاً، ثم الأكثر ضريبة مسددة، ثم الأكثر جوهراً، وإلا فهو عديم الجنسية."]},{"h":["Moving mid-year","الانتقال خلال السنة"],"t":["An entity that changes its location during a fiscal year is located, for that whole year, where it was at the beginning of the year.","الكيان الذي يغيّر موقعه خلال السنة المالية يقع، طوال تلك السنة، حيث كان في بدايتها."],"r":["5(5)"],"p":["An entity that moves during the year stays where it was at the start.","الكيان الذي ينتقل خلال السنة يبقى حيث كان في بدايتها."]},{"h":["Why stateless matters","لماذا يهم انعدام الجنسية"],"t":["Each stateless constituent entity is treated as a single entity in a separate jurisdiction for the ETR computation, so its low-taxed income is not blended with the Kingdom's other entities.","يُعامل كل كيان تابع عديم الجنسية ككيان واحد في ولاية قضائية منفصلة عند احتساب معدل الضريبة الفعلي، فلا يُمزج دخله منخفض الضريبة مع كيانات المملكة الأخرى."],"r":["53(3)"],"p":["A stateless entity's rate is worked out alone, not blended with the Kingdom.","يُحتسب معدل الكيان عديم الجنسية بمفرده، ولا يُمزج مع المملكة."]}],"oecd":[{"t":["The location rules and the four kinds of PE closely follow GloBE Article 10.3 and the PE definition in Article 10.1, including the tie-breakers that start with the treaty, then covered taxes, then the substance-based income exclusion.","تتبع قواعد الموقع وأنواع المنشأة الدائمة الأربعة عن كثب المادة 10.3 من القواعد النموذجية وتعريف المنشأة الدائمة في المادة 10.1، بما في ذلك قواعد الترجيح التي تبدأ بالاتفاقية ثم الضرائب المشمولة ثم الاستبعاد على أساس الجوهر."],"src":["Model Rules Arts 10.1 (Permanent Establishment) and 10.3","القواعد النموذجية: المادة 10.1 (المنشأة الدائمة) والمادة 10.3"]},{"t":["The draft brings stateless constituent entities created under Saudi law into scope expressly. Under the Model Rules, a stateless constituent entity's top-up tax is computed on its own, separately from any jurisdiction.","يُدخل المشروع صراحةً الكيانات التابعة عديمة الجنسية المنشأة بموجب أنظمة المملكة ضمن النطاق. وفي القواعد النموذجية تُحتسب الضريبة التكميلية للكيان التابع عديم الجنسية بشكل مستقل عن أي ولاية قضائية."],"src":["Model Rules Art 5.1","القواعد النموذجية: المادة 5.1"]}],"cases":[{"t":["Two countries claim Desert Holdings","دولتان تطالبان بشركة الصحراء القابضة"],"facts":["Desert Holdings was created in Country Y and is resident there by incorporation. Its board and senior management sit in Riyadh, so it is also resident in the Kingdom (central management). There is no tax treaty between the Kingdom and Y. Covered taxes paid for FY2027: Kingdom SAR 12m; Country Y SAR 7m, of which SAR 3m is Y's CFC tax on the profits of a foreign subsidiary.","أُنشئت شركة الصحراء القابضة في الدولة (ص) وهي مقيمة فيها بحكم التأسيس. ويجتمع مجلس إدارتها وإدارتها العليا في الرياض، فهي مقيمة في المملكة أيضاً (الإدارة المركزية). ولا توجد اتفاقية ضريبية بين المملكة و(ص). الضرائب المشمولة المسددة للسنة المالية 2027م: المملكة 12 مليون ريال؛ والدولة (ص) 7 ملايين ريال، منها 3 ملايين ريال ضريبة تفرضها (ص) وفق نظام الشركات الأجنبية الخاضعة للسيطرة على أرباح شركة تابعة أجنبية."],"steps":[{"t":["Resident in two jurisdictions under Article 5(1), so apply the dual-residence rules. No treaty: go to the covered-taxes test.","مقيمة في ولايتين وفق المادة 5 (1)، فتُطبق قواعد ازدواج الإقامة. لا توجد اتفاقية: ننتقل إلى اختبار الضرائب المشمولة."]},{"t":["Country Y's covered taxes, ignoring the CFC tax:","الضرائب المشمولة في (ص) دون ضريبة الشركات الأجنبية الخاضعة للسيطرة:"],"x":"7000000-3000000","v":4000000,"u":"SAR"},{"t":["Compare: the Kingdom SAR 12m against Country Y SAR 4m. The Kingdom is higher.","قارن: المملكة 12 مليون ريال مقابل (ص) 4 ملايين ريال. المملكة أعلى."],"x":"12000000-4000000","v":8000000,"u":"SAR"}],"ans":["Located in the Kingdom for FY2027. Had Y counted its CFC tax, the gap would have narrowed to SAR 5m, but the result would not change. If the taxes had been equal, the entity-level SBIE would decide.","تقع في المملكة للسنة المالية 2027م. ولو احتُسبت ضريبة الشركات الأجنبية الخاضعة للسيطرة في (ص) لضاق الفارق إلى 5 ملايين ريال، لكن النتيجة لا تتغير. ولو تساوت الضرائب لحسم الأمرَ الاستبعادُ على أساس الجوهر على مستوى الكيان."],"r":["5(1)","5(4)","5(6)",6],"p":["Located in the Kingdom: it paid more covered tax here (SAR 12m against SAR 4m).","تقع في المملكة: سددت فيها ضرائب مشمولة أكثر (12 مليون ريال مقابل 4 ملايين)."],"diagrams":[{"type":"bars","at":"answer","title":["Covered taxes paid for FY2027","الضرائب المشمولة المسددة لعام 2027م"],"u":"SAR","items":[{"l":["Kingdom","المملكة"],"v":12000000},{"l":["Country Y, without CFC tax","الدولة (ص) دون ضريبة الشركات الأجنبية الخاضعة للسيطرة"],"v":4000000,"tone":"g"}],"note":["Y's SAR 3m CFC tax on a foreign subsidiary's profit does not count for this test.","لا تُحتسب ضريبة (ص) البالغة 3 ملايين ريال على أرباح شركة تابعة أجنبية في هذا الاختبار."]}]},{"t":["A treaty that needs an agreement nobody reached","اتفاقية تتطلب اتفاقاً لم يتحقق"],"facts":["Med Logistics is resident in the Kingdom (central management) and in Country T (incorporation). The Kingdom–T treaty settles company dual residence by mutual agreement, and the competent authorities have not agreed. FY2027 covered taxes paid: Kingdom SAR 2m; T SAR 2m. Entity-level SBIE: Kingdom SAR 1.5m; T SAR 0.6m.","شركة متوسط للخدمات اللوجستية مقيمة في المملكة (الإدارة المركزية) وفي الدولة (ت) (التأسيس). وتحسم الاتفاقية بين المملكة و(ت) ازدواج إقامة الشركات باتفاق متبادل، ولم تتفق السلطات المختصة. الضرائب المشمولة المسددة للسنة المالية 2027م: المملكة 2 مليون ريال؛ و(ت) 2 مليون ريال. الاستبعاد على أساس الجوهر على مستوى الكيان: المملكة 1.5 مليون ريال؛ و(ت) 0.6 مليون ريال."],"steps":[{"t":["A treaty applies, but it needs a mutual agreement and there is none, so Article 5(4)(a)(2) sends us to the no-treaty rules.","توجد اتفاقية لكنها تتطلب اتفاقاً متبادلاً لم يتحقق، فتحيلنا المادة 5 (4) (أ) (2) إلى قواعد غياب الاتفاقية."]},{"t":["Covered taxes: equal, so the first test does not decide.","الضرائب المشمولة متساوية، فلا يحسم الاختبار الأول."],"x":"2000000-2000000","v":0,"u":"SAR"},{"t":["Compare entity-level SBIE: the Kingdom is higher by:","قارن الاستبعاد على أساس الجوهر على مستوى الكيان: المملكة أعلى بمقدار:"],"x":"1500000-600000","v":900000,"u":"SAR"}],"ans":["Located in the Kingdom, where its substance is greater. If the SBIE had also been equal, Med Logistics would be stateless (it is not the UPE), and its ETR would be computed on its own.","تقع في المملكة حيث جوهرها أكبر. ولو تساوى الاستبعاد أيضاً لكانت عديمة الجنسية (فهي ليست الكيان الأم النهائي)، ولاحتُسب معدلها الفعلي بشكل مستقل."],"r":["5(4)","53(3)"],"p":["Located in the Kingdom: the taxes tie, so the greater substance decides.","تقع في المملكة: تعادلت الضرائب، فحسم الجوهر الأكبر."],"diagrams":[{"type":"flow","at":"answer","title":["Down the ladder","نزولاً على السلّم"],"nodes":[{"t":["1. Treaty","1. الاتفاقية"],"s":["needs an agreement that was never reached: skip","تتطلب اتفاقاً لم يتحقق: تُتجاوز"]},{"t":["2. Covered taxes","2. الضرائب المشمولة"],"s":["SAR 2m each: a tie","مليونا ريال لكلٍّ منهما: تعادل"]},{"t":["3. Substance (SBIE)","3. الجوهر (الاستبعاد)"],"s":["Kingdom SAR 1.5m, T SAR 0.6m: the Kingdom","المملكة 1.5 مليون، و(ت) 0.6 مليون: المملكة"]}]}]},{"t":["The Saudi branch of a Korean contractor","الفرع في المملكة لمقاول كوري"],"facts":["HanBuild, a Korean company in an in-scope MNE group, has a licensed branch in the Kingdom. Under the Kingdom–Korea treaty the branch is a PE, and the Kingdom taxes its business profits under the treaty's business-profits article.","شركة هان للبناء شركة كورية ضمن مجموعة متعددة الجنسيات خاضعة للنظام، ولها فرع مرخص في المملكة. والفرع منشأة دائمة بموجب الاتفاقية بين المملكة وكوريا، وتفرض المملكة الضريبة على أرباحه التجارية وفق مادة الأرباح التجارية في الاتفاقية."],"steps":[{"t":["Kind of PE: a place of business treated as a PE under an applicable treaty and taxed like Article 7 of the OECD Model.","نوع المنشأة: مكان عمل يُعامل كمنشأة دائمة بموجب اتفاقية سارية ويخضع للضريبة وفق حكم مماثل للمادة 7 من النموذج."]},{"t":["Location: the jurisdiction that treats it as a PE and taxes it under the treaty, so the Kingdom.","الموقع: الولاية التي تعامله كمنشأة دائمة وتفرض عليه الضريبة بموجب الاتفاقية، أي المملكة."]},{"t":["Status: a constituent entity separate from HanBuild's Korean head office.","الوضع: كيان تابع منفصل عن المركز الرئيسي لهان للبناء في كوريا."]}],"ans":["The branch is a Saudi constituent entity and a taxpayer in its own right. Its income and covered taxes join the Kingdom's blended ETR with the group's other Saudi entities. Without a treaty, the result would be the same if the Kingdom taxes the branch on a net basis like a resident.","الفرع كيان تابع في المملكة ومكلف بذاته. ويدخل دخله وضرائبه المشمولة في معدل الضريبة الفعلي المجمّع للمملكة مع كيانات المجموعة الأخرى فيها. ولو لم توجد اتفاقية لكانت النتيجة نفسها ما دامت المملكة تفرض الضريبة على الفرع على أساس الصافي كالمقيمين."],"r":["11","5(3)","9(2)","53(2)"],"p":["The Saudi branch is a Saudi constituent entity and taxpayer in its own right.","الفرع في المملكة كيان تابع سعودي ومكلف قائم بذاته."],"diagrams":[{"type":"org","at":"facts","title":["Head office and branch","المركز الرئيسي والفرع"],"nodes":[{"id":"k","t":["HanBuild","هان للبناء"],"s":["Korea · head office","كوريا · المركز الرئيسي"]},{"id":"b","t":["Saudi branch","الفرع في المملكة"],"s":["a PE under the treaty","منشأة دائمة وفق الاتفاقية"],"tone":"in"}],"edges":[{"f":"k","to":"b"}]}]}],"quiz":[{"q":["A company is tax resident only in the Kingdom, because its central management is there. Where is it located?","شركة مقيمة ضريبياً في المملكة وحدها لأن إدارتها المركزية فيها. أين تقع؟"],"o":[["Where it was incorporated, whatever its residence","حيث أُسست، أياً كانت إقامتها الضريبية"],["Where its parent entity is located","حيث يقع كيانها الأم"],["In the Kingdom, where it is tax resident","في المملكة، حيث هي مقيمة ضريبياً"],["Nowhere: it is a stateless entity","لا مكان: فهي كيان عديم الجنسية"]],"a":2,"e":["Article 5(1)(a): an entity that is tax resident on the basis of its place of management, place of creation or similar criteria is located there. Saudi residence follows the Income Tax Law (Art 6).","المادة 5 (1) (أ): يقع الكيان المقيم ضريبياً على أساس مكان إدارته أو إنشائه أو معيار مماثل في تلك الولاية. وتتبع الإقامة في المملكة نظام ضريبة الدخل (المادة 6)."],"r":["5(1)",6]},{"q":["An entity is not tax resident anywhere on a management or creation basis. Where is it located?","كيان غير مقيم ضريبياً في أي مكان على أساس الإدارة أو الإنشاء. أين يقع؟"],"o":[["Nowhere: it is stateless","لا مكان: فهو عديم الجنسية"],["In the jurisdiction where it was created","في الولاية التي أُنشئ فيها"],["Where its main operations are carried on","حيث يمارس عملياته الرئيسية"],["Where its ultimate parent is located","حيث يقع كيانه الأم النهائي"]],"a":1,"e":["Article 5(1)(b): in other cases, an entity that is not a flow-through entity is located in the jurisdiction where it was created. Statelessness is for flow-through entities and the end of the dual-residence ladder.","المادة 5 (1) (ب): في الحالات الأخرى يقع الكيان غير الشفاف مالياً حيث أُنشئ. أما انعدام الجنسية فللكيانات الشفافة مالياً ولنهاية سلّم الترجيح."],"r":["5(1)"]},{"q":["A flow-through entity is the group's ultimate parent. Where is it located?","كيان شفاف مالياً هو الكيان الأم النهائي للمجموعة. أين يقع؟"],"o":[["Where it was created, as it is the UPE","حيث أُنشئ، لكونه الكيان الأم النهائي"],["Where most of its partners are tax resident","حيث يقيم معظم الشركاء فيه لأغراض الضريبة"],["Nowhere: every flow-through entity is stateless","لا مكان: فكل كيان شفاف عديم الجنسية"],["Where its effective management sits","حيث تقع إدارته الفعلية ومقر قراراته"]],"a":0,"e":["Article 5(2)(a): a flow-through entity that is the UPE, or must apply an IIR, is located where it was created. Any other flow-through entity is stateless.","المادة 5 (2) (أ): يقع الكيان الشفاف مالياً الذي يكون الكيان الأم النهائي، أو الملزم بتطبيق قاعدة تضمين الدخل، حيث أُنشئ. وأي كيان شفاف آخر عديم الجنسية."],"r":["5(2)"]},{"q":["A transparent partnership created under Saudi law is neither the UPE nor applying an IIR. What follows?","شراكة شفافة أُنشئت وفق أنظمة المملكة، وليست الكيان الأم النهائي ولا تطبّق قاعدة تضمين الدخل. ما النتيجة؟"],"o":[["It is located in the Kingdom, as it was created under Saudi law","تقع في المملكة، لأنها أُنشئت وفق أنظمة المملكة"],["It is stateless, but within scope because it was created under Saudi law","عديمة الجنسية، لكنها ضمن النطاق لأنها أُنشئت وفق أنظمة المملكة"],["It is stateless, and stateless entities fall outside the law","عديمة الجنسية، والكيانات عديمة الجنسية تقع خارج نطاق هذا النظام"],["It is located where its largest partner is tax resident","تقع حيث يقيم ضريبياً أكبر الشركاء فيها"]],"a":1,"e":["Article 5(2)(b) makes it stateless, and Article 2(2) applies the law to stateless constituent entities created under Saudi law. Its ETR is computed as a separate jurisdiction (Art 53(3)).","تجعلها المادة 5 (2) (ب) عديمة الجنسية، وتطبّق المادة 2 (2) النظام على الكيانات التابعة عديمة الجنسية المنشأة وفق أنظمة المملكة. ويُحتسب معدلها الفعلي كولاية منفصلة (المادة 53 (3))."],"r":["5(2)","2(2)","53(3)"]},{"q":["Where is a treaty PE located?","أين تقع المنشأة الدائمة بموجب اتفاقية؟"],"o":[["Where it is treated as a PE under the treaty, even if not taxed there","حيث تُعامل كمنشأة دائمة بموجب الاتفاقية، حتى لو لم تخضع للضريبة هناك"],["In the jurisdiction that treats it as a PE, whether or not it taxes it","في الولاية التي تعاملها كمنشأة دائمة، سواء فرضت عليها الضريبة أم لا"],["Where it is treated as a PE and taxed under the treaty","حيث تُعامل كمنشأة دائمة وتخضع للضريبة بموجب الاتفاقية"],["Nowhere: a treaty PE is always a stateless entity","لا مكان: فالمنشأة الدائمة بموجب اتفاقية عديمة الجنسية دائماً"]],"a":2,"e":["Article 5(3)(a), read with Article 11(1): a treaty PE sits in the country that treats it as a PE and taxes it under the treaty, not with its head office.","المادة 5 (3) (أ) مع المادة 11 (1): تقع المنشأة الدائمة بموجب اتفاقية في الدولة التي تعاملها كمنشأة دائمة وتفرض عليها الضريبة بموجب الاتفاقية، لا مع مركزها الرئيسي."],"r":["5(3)","11"]},{"q":["Without a treaty, when is a place of business a PE located in the Kingdom?","في غياب اتفاقية، متى يكون مكان العمل منشأة دائمة واقعة في المملكة؟"],"o":[["When the Kingdom taxes its income on a net basis, as for residents","عندما تفرض المملكة الضريبة على دخله على أساس الصافي كالمقيمين"],["Whenever it has employees working in the Kingdom for over 183 days","متى كان لديه موظفون يعملون في المملكة أكثر من 183 يوماً"],["When the Kingdom taxes its income on a gross basis through withholding","عندما تفرض المملكة الضريبة على دخله على أساس الإجمالي عبر الاستقطاع"],["Only once it is registered with the Ministry of Commerce as a branch","فقط بعد تسجيله فرعاً لدى وزارة التجارة"]],"a":0,"e":["Articles 11(2) and 5(3)(b): without a treaty, the PE is located where its income is taxed on a net basis, as residents are. Withholding tax on gross payments does not do it.","المادتان 11 (2) و5 (3) (ب): في غياب اتفاقية تقع المنشأة الدائمة حيث يُفرض على دخلها الضريبة على أساس الصافي كالمقيمين. ولا يكفي الاستقطاع على المدفوعات الإجمالية."],"r":["11","5(3)"]},{"q":["A dual-resident company and no treaty applies. What is the first test?","شركة مزدوجة الإقامة ولا توجد اتفاقية سارية. ما الاختبار الأول؟"],"o":[["Where it paid more covered taxes, including CFC regime taxes","حيث سددت ضرائب مشمولة أكثر، بما فيها ضرائب نظام الشركات الأجنبية الخاضعة للسيطرة"],["Where its entity-level substance-based income exclusion is greater","حيث يكون الاستبعاد على أساس الجوهر على مستوى الكيان أكبر"],["Where it paid more covered taxes for the year, ignoring CFC regime taxes","حيث سددت ضرائب مشمولة أكثر عن السنة، دون ضرائب نظام الشركات الأجنبية الخاضعة للسيطرة"],["Where it was created, unless its board meets mostly elsewhere","حيث أُنشئت، ما لم يجتمع مجلس إدارتها غالباً في مكان آخر"]],"a":2,"e":["Article 5(4)(b)(1). Taxes paid under a CFC tax regime (defined in Art 5(6)) are left out of the comparison.","المادة 5 (4) (ب) (1). وتُستبعد من المقارنة الضرائب المسددة وفق نظام الشركات الأجنبية الخاضعة للسيطرة (المعرّف في المادة 5 (6))."],"r":["5(4)","5(6)"]},{"q":["Covered taxes paid in both jurisdictions are equal. What decides location next?","تساوت الضرائب المشمولة المسددة في الولايتين. ما الذي يحسم الموقع بعد ذلك؟"],"o":[["The greater revenue in each jurisdiction","الإيرادات الأكبر في كل ولاية"],["The greater number of board meetings held in each jurisdiction","العدد الأكبر لاجتماعات مجلس الإدارة في كل ولاية"],["The greater SBIE computed for each jurisdiction as a whole","الاستبعاد على أساس الجوهر الأكبر محتسباً لكل ولاية ككل"],["The greater SBIE, computed for the entity alone","الاستبعاد على أساس الجوهر الأكبر، محتسباً للكيان وحده"]],"a":3,"e":["Article 5(4)(b)(2) uses the SBIE under Article 58 computed for the entity alone. Revenue and board meetings play no part.","تعتمد المادة 5 (4) (ب) (2) الاستبعاد على أساس الجوهر وفق المادة 58 محتسباً للكيان وحده. ولا دور للإيرادات ولا لاجتماعات المجلس."],"r":["5(4)",58]},{"q":["Covered taxes and SBIE are both equal, and the entity is not the UPE. Where is it located?","تساوت الضرائب المشمولة والاستبعاد على أساس الجوهر، والكيان ليس الكيان الأم النهائي. أين يقع؟"],"o":[["Where it was created, as for a UPE in that position","حيث أُنشئ، كما في حالة الكيان الأم النهائي"],["In the Kingdom, because the Kingdom's residence rule prevails","في المملكة، لأن قاعدة الإقامة في المملكة هي الغالبة"],["Where its assets are larger","حيث تكون أصوله أكبر"],["It becomes a stateless constituent entity","يصبح كياناً تابعاً عديم الجنسية"]],"a":3,"e":["Article 5(4)(b)(3). Only a UPE in that position is located where it was created.","المادة 5 (4) (ب) (3). ولا يقع حيث أُنشئ في هذه الحالة إلا الكيان الأم النهائي."],"r":["5(4)"]},{"q":["A company moves its management from Dubai to Riyadh on 1 July 2027 (calendar fiscal year). Where is it located for FY2027?","نقلت شركة إدارتها من دبي إلى الرياض في 1 يوليو 2027م (سنة مالية تقويمية). أين تقع للسنة المالية 2027م؟"],"o":[["In the Kingdom, where it is at the end of the year","في المملكة، حيث تكون في نهاية السنة"],["Where it was at the beginning of the year","حيث كانت في بداية السنة"],["Split by time: Dubai to 30 June, the Kingdom after","مقسمة زمنياً: دبي حتى 30 يونيو، ثم المملكة"],["Stateless for that year","عديمة الجنسية لتلك السنة"]],"a":1,"e":["Article 5(5): an entity that changes location during the year is located, for that year, where it was at the beginning of the year. The move counts from FY2028.","المادة 5 (5): الكيان الذي يغيّر موقعه خلال السنة يقع لتلك السنة حيث كان في بدايتها. ويُعتد بالانتقال اعتباراً من السنة المالية 2028م."],"r":["5(5)"]},{"q":["How is a Saudi branch of a foreign group company treated for the DMT?","كيف يُعامل فرع في المملكة لشركة أجنبية في المجموعة لأغراض النظام؟"],"o":[["As its own Saudi constituent entity, where the Kingdom taxes it as a PE","ككيان تابع سعودي مستقل، حين تفرض عليه المملكة الضريبة كمنشأة دائمة"],["As part of its foreign head office, which reports the branch's results","كجزء من مركزه الرئيسي الأجنبي، الذي يُدرج نتائج الفرع في حساباته"],["As a separate entity, but located where its head office is tax resident","ككيان منفصل، لكنه يقع في الولاية التي يقيم فيها مركزه الرئيسي"],["As an excluded entity, since a branch has no separate legal personality","ككيان مستبعد، لأن الفرع ليست له شخصية قانونية مستقلة"]],"a":0,"e":["Articles 9(2), 11 and 5(3). The branch is a Saudi taxpayer and joins the Kingdom's blended ETR.","المواد 9 (2) و11 و5 (3). الفرع مكلف في المملكة ويدخل في معدلها الفعلي المجمّع."],"r":["9(2)","11","5(3)"]},{"q":["Why does it matter that an entity is stateless?","لماذا يهم أن يكون الكيان عديم الجنسية؟"],"o":[["It pays no top-up tax, because no jurisdiction can claim it","لا يدفع أي ضريبة تكميلية، لأنه لا توجد ولاية يمكنها المطالبة به"],["Its income is blended into the Kingdom's ETR with all other entities","يُمزج دخله في معدل المملكة مع جميع الكيانات الأخرى"],["It becomes an excluded entity, so its income and taxes are ignored","يصبح كياناً مستبعداً، فيُتجاهل دخله وضرائبه"],["Its ETR is computed on its own, not blended with other Saudi entities","يُحتسب معدله الفعلي وحده، دون مزجه مع الكيانات الأخرى في المملكة"]],"a":3,"e":["Article 53(3) treats each stateless constituent entity as a single entity located in a separate jurisdiction. A zero-taxed stateless entity cannot hide behind high-taxed Saudi affiliates.","تعامل المادة 53 (3) كل كيان تابع عديم الجنسية ككيان واحد في ولاية منفصلة. فلا يمكن للكيان عديم الجنسية غير الخاضع للضريبة أن يحتمي بكيانات المملكة مرتفعة الضريبة."],"r":["53(3)"]}],"cards":[{"f":["Location of an ordinary entity","موقع الكيان العادي"],"b":["Where it is tax resident by place of management, creation or similar criterion; otherwise where it was created.","حيث يكون مقيماً ضريبياً بحكم مكان الإدارة أو الإنشاء أو معيار مماثل؛ وإلا فحيث أُنشئ."],"r":["5(1)"]},{"f":["Saudi tax residence for the DMT","الإقامة الضريبية في المملكة لأغراض النظام"],"b":["Meets the Income Tax Law conditions: for a company, formed under the Companies Law or centrally managed in the Kingdom.","استيفاء شروط نظام ضريبة الدخل: للشركة، التأسيس وفق نظام الشركات أو وجود الإدارة المركزية في المملكة."],"r":[6]},{"f":["Location of a flow-through entity","موقع الكيان الشفاف مالياً"],"b":["Where created if it is the UPE or applies an IIR; otherwise stateless.","حيث أُنشئ إذا كان الكيان الأم النهائي أو يطبّق قاعدة تضمين الدخل؛ وإلا فهو عديم الجنسية."],"r":["5(2)"]},{"f":["Stateless entities created under Saudi law","الكيانات عديمة الجنسية المنشأة وفق أنظمة المملكة"],"b":["Within scope, including in the Special Economic Zones.","ضمن النطاق، بما في ذلك المناطق الاقتصادية الخاصة."],"r":["2(2)"]},{"f":["The four kinds of PE","أنواع المنشأة الدائمة الأربعة"],"b":["Treaty PE · no-treaty net-basis PE · PE in a no-CIT country · exempt-income PE (stateless).","منشأة بموجب اتفاقية · منشأة تخضع للضريبة على الصافي دون اتفاقية · منشأة في دولة بلا ضريبة دخل على الشركات · منشأة دخلها معفى (عديمة الجنسية)."],"r":[11]},{"f":["Location of a treaty PE","موقع المنشأة الدائمة بموجب اتفاقية"],"b":["Where it is treated as a PE and taxed under the applicable treaty.","حيث تُعامل كمنشأة دائمة وتخضع للضريبة بموجب الاتفاقية السارية."],"r":["5(3)"]},{"f":["Is a PE part of its head office?","هل المنشأة الدائمة جزء من مركزها الرئيسي؟"],"b":["No. Each PE is a constituent entity separate from its main entity and its other PEs.","لا. كل منشأة دائمة كيان تابع منفصل عن الكيان الرئيسي ومنشآته الأخرى."],"r":["9(2)"]},{"f":["Dual residence with a treaty","ازدواج الإقامة مع وجود اتفاقية"],"b":["Located where the treaty deems it resident; if a needed mutual agreement is missing or no relief is given, use the no-treaty ladder.","يقع حيث تعدّه الاتفاقية مقيماً؛ وإن غاب الاتفاق المتبادل المطلوب أو لم يُمنح إعفاء، فيُطبق سلّم غياب الاتفاقية."],"r":["5(4)"]},{"f":["The no-treaty ladder","سلّم الترجيح دون اتفاقية"],"b":["More covered taxes (ignore CFC tax) → greater entity-level SBIE → stateless, unless UPE (then where created).","ضرائب مشمولة أكثر (دون ضريبة الشركات الأجنبية الخاضعة للسيطرة) ← استبعاد جوهر أكبر على مستوى الكيان ← عديم الجنسية، ما لم يكن الكيان الأم النهائي (فحيث أُنشئ)."],"r":["5(4)"]},{"f":["CFC tax regime","نظام الشركات الأجنبية الخاضعة للسيطرة"],"b":["Rules (other than an IIR) taxing a shareholder currently on a foreign entity's income, whether or not distributed.","قواعد (غير قاعدة تضمين الدخل) تفرض الضريبة على المساهم حالياً على دخل كيان أجنبي، سواء وُزّع أم لا."],"r":["5(6)"]},{"f":["Change of location mid-year","تغيير الموقع خلال السنة"],"b":["Located for that year where it was at the beginning of the year.","يقع لتلك السنة حيث كان في بدايتها."],"r":["5(5)"]},{"f":["Stateless entity and the ETR","الكيان عديم الجنسية ومعدل الضريبة الفعلي"],"b":["Treated as a single entity in a separate jurisdiction: no blending with Saudi entities.","يُعامل ككيان واحد في ولاية منفصلة: لا مزج مع كيانات المملكة."],"r":["53(3)"]}],"terms":[{"t":["Location","الموقع"],"d":["The country where an entity counts for this tax.","الدولة التي يُحتسب فيها الكيان لأغراض هذه الضريبة."]},{"t":["Tax resident","المقيم ضريبياً"],"d":["Taxed as a local because of where it is managed or created.","يُعامل كمقيم بسبب مكان إدارته أو تأسيسه."]},{"t":["Flow-through entity","الكيان الشفاف مالياً"],"d":["An entity whose income is taxed in its owners' hands, like many partnerships.","كيان يُفرض الضريبة على دخله لدى ملاكه، مثل كثير من شركات الأشخاص."]},{"t":["Permanent establishment (PE)","المنشأة الدائمة"],"d":["A branch or fixed place of business in another country, treated here as an entity of its own.","فرع أو مقر عمل ثابت في دولة أخرى، يُعامل هنا ككيان مستقل."]},{"t":["Stateless entity","الكيان عديم الجنسية"],"d":["An entity with no country for this tax; its rate is worked out on its own.","كيان بلا دولة لأغراض هذه الضريبة؛ ويُحتسب معدله بمفرده."]},{"t":["Dual residence","ازدواج الإقامة"],"d":["Two countries both treat the entity as resident. The tie-break ladder decides.","تعدّ دولتان الكيان مقيماً لديهما، ويحسم الأمر سلّم الترجيح."]}],"range":"5–6, 9, 11"},{"id":4,"title":["Scope III: excluded entities","النطاق (3): الكيانات المستبعدة"],"goal":["Recognise the six kinds of excluded entity, apply the 95% and 85% ownership tests to their holding vehicles, and use the five-year election.","التعرف على الأنواع الستة للكيانات المستبعدة، وتطبيق اختباري الملكية 95% و85% على أدواتها القابضة، واستخدام اختيار الخمس سنوات."],"parts":[1,2],"arts":[1,12,13,14,15,16,17],"time":25,"metaphor":{"title":["Exempt number plates","لوحات معفاة"],"text":["On the DMT road some vehicles carry exempt plates: government cars, diplomatic cars (international organisations), charity vans and pension-fund buses. Investment funds and real estate vehicles get the plate only when they lead the convoy as the ultimate parent.\nA small van that does nothing but carry an exempt owner's cargo gets the same plate if the owner holds at least 95% of it, or 85% if almost all it carries is exempt dividends and equity gains. The plate covers the vehicle, not the convoy behind it: an exempt owner's operating companies still pay the toll.","على طريق ضريبة الحد الأدنى المحلي تحمل بعض المركبات لوحات معفاة: سيارات الحكومة، والسيارات الدبلوماسية (المنظمات الدولية)، وحافلات الجمعيات الخيرية وصناديق التقاعد. ولا تحصل صناديق الاستثمار والأدوات العقارية على اللوحة إلا إذا قادت القافلة بصفتها الكيان الأم النهائي.\nوالشاحنة الصغيرة التي لا تحمل إلا بضاعة مالك معفى تحصل على اللوحة نفسها إذا ملك المالك 95% منها على الأقل، أو 85% إذا كان كل ما تحمله تقريباً توزيعات أرباح ومكاسب حقوق ملكية مستبعدة. واللوحة تغطي المركبة لا القافلة خلفها: فالشركات التشغيلية المملوكة لمالك معفى تدفع الرسوم."]},"anchors":[{"if":["A group entity is owned by the state","كيان في المجموعة مملوك للدولة"],"then":["Run all four Governmental Entity tests; one commercial trade or business fails it (Art 13)","طبّق اختبارات الكيان الحكومي الأربعة كلها؛ فممارسة تجارة أو نشاط تجاري واحد تُسقطه (المادة 13)"]},{"if":["A holding vehicle sits under a pension fund, charity or state body","أداة قابضة تحت صندوق تقاعد أو جمعية خيرية أو جهة حكومية"],"then":["Test ownership by value: 95% and passive or ancillary, or 85% and almost all income excluded dividends or equity gains (Art 12(2))","اختبر الملكية بالقيمة: 95% ونشاط سلبي أو مساند، أو 85% وكل الدخل تقريباً توزيعات أو مكاسب حقوق ملكية مستبعدة (المادة 12 (2))"]},{"if":["The UPE is a regulated fund or a REIT-type vehicle","الكيان الأم النهائي صندوق منظم أو أداة عقارية"],"then":["Only the fund itself is excluded, and only as UPE; its portfolio companies are still tested (Art 12(1)(e)–(f))","لا يُستبعد إلا الصندوق نفسه، وبصفته كياناً أماً نهائياً فقط؛ وتبقى شركات محفظته خاضعة للاختبار (المادة 12 (1) (هـ)–(و))"]},{"if":["A charity runs a business unrelated to its purpose","جمعية خيرية تمارس نشاطاً تجارياً لا يتصل بغرضها"],"then":["It is not a non-profit organisation for the DMT (Art 15(2))","لا تُعد منظمة غير ربحية لأغراض النظام (المادة 15 (2))"]},{"if":["The group prefers to keep a 95% or 85% vehicle inside the computation","تفضّل المجموعة إبقاء أداة 95% أو 85% داخل الاحتساب"],"then":["Make the five-year election; it is locked for that year and the next four (Arts 12(3), 1)","قم باختيار الخمس سنوات؛ وهو ملزم لتلك السنة والسنوات الأربع التالية (المادتان 12 (3) و1)"]}],"diagrams":[{"type":"tree","title":["Is this entity excluded?","هل هذا الكيان مستبعد؟"],"root":{"q":["Is it a Governmental Entity, International Organisation, Non-profit Organisation or Pension Fund?","هل هو كيان حكومي أو منظمة دولية أو منظمة غير ربحية أو صندوق تقاعد؟"],"yes":{"end":["Excluded (Art 12(1)(a)–(d))","مستبعد (المادة 12 (1) (أ)–(د))"],"tone":"out"},"no":{"q":["Is it an Investment Fund or Real Estate Investment Vehicle that is the UPE?","هل هو صندوق استثمار أو أداة استثمارية عقارية بصفته الكيان الأم النهائي؟"],"yes":{"end":["Excluded (Art 12(1)(e)–(f))","مستبعد (المادة 12 (1) (هـ)–(و))"],"tone":"out"},"no":{"q":["Is ≥95% of its value held by excluded entities (not via a pension services entity), and does it only hold assets or invest for them, or do ancillary work?","هل تملك كيانات مستبعدة 95% على الأقل من قيمته (لا عبر كيان خدمات التقاعد)، ولا يقوم إلا بحيازة الأصول أو الاستثمار لها أو بأعمال مساندة؟"],"yes":{"end":["Excluded (Art 12(2)(a)), unless the five-year election is made","مستبعد (المادة 12 (2) (أ))، ما لم يُجرَ اختيار الخمس سنوات"],"tone":"out"},"no":{"q":["Is ≥85% held by excluded entities, with almost all income excluded dividends or excluded equity gains?","هل تملك كيانات مستبعدة 85% منه على الأقل، وكل دخله تقريباً توزيعات أرباح أو مكاسب حقوق ملكية مستبعدة؟"],"yes":{"end":["Excluded (Art 12(2)(b)), unless the five-year election is made","مستبعد (المادة 12 (2) (ب))، ما لم يُجرَ اختيار الخمس سنوات"],"tone":"out"},"no":{"end":["Not excluded: a constituent entity if it is in a Group","غير مستبعد: كيان تابع إذا كان ضمن مجموعة"],"tone":"in"}}}}},"quick":true},{"type":"table","title":["The four Governmental Entity tests: all must be met","اختبارات الكيان الحكومي الأربعة: يجب استيفاؤها كلها"],"head":[["Test","الاختبار"],["What it requires (Art 13)","ما يتطلبه (المادة 13)"]],"rows":[[["Ownership","الملكية"],["Part of, or wholly owned by, a government, including a political subdivision or local authority","جزء من حكومة أو مملوك لها بالكامل، بما في ذلك أي تقسيم سياسي أو سلطة محلية"]],[["Purpose","الغرض"],["No trade or business; principal purpose is a government function, or managing or investing the government's or the jurisdiction's assets","لا يمارس تجارة أو نشاطاً تجارياً؛ وغرضه الرئيسي أداء وظيفة حكومية، أو إدارة أصول الحكومة أو الولاية أو استثمارها"]],[["Accountability","المساءلة"],["Accountable to the government on overall performance, with annual information reporting","مسؤول أمام الحكومة عن أدائه العام، مع تقديم تقارير معلومات سنوية"]],[["Assets and earnings","الأصول والأرباح"],["Assets vest in the government on dissolution; net earnings go only to the government, never to a private person","تؤول الأصول إلى الحكومة عند الحل؛ ولا يُوزَّع صافي الأرباح إلا على الحكومة، ولا يعود أي جزء منه بالنفع على شخص خاص"]]]}],"points":[{"h":["The six excluded entities","الكيانات المستبعدة الستة"],"t":["A Governmental Entity, an International Organisation, a Non-profit Organisation, a Pension Fund, an Investment Fund that is the UPE, and a Real Estate Investment Vehicle that is the UPE.","الكيان الحكومي، والمنظمة الدولية، والمنظمة غير الربحية، وصندوق التقاعد، وصندوق الاستثمار الذي يكون الكيان الأم النهائي، والأداة الاستثمارية العقارية التي تكون الكيان الأم النهائي."],"r":["12(1)"],"p":["Six kinds are out: government, international bodies, non-profits, pension funds, and top-level funds or REIVs.","ستة أنواع خارج النطاق: الحكومة، والمنظمات الدولية، وغير الربحية، وصناديق التقاعد، والصناديق والأدوات العقارية في القمة."]},{"h":["The 95% vehicle","أداة الـ95%"],"t":["An entity at least 95% of whose value is owned, directly or through a chain of excluded entities, by those excluded entities (ownership through a pension services entity does not count), and that operates exclusively or almost exclusively to hold assets or invest funds for them, or only carries out activities ancillary to theirs.","كيان تملك الكيانات المستبعدة 95% على الأقل من قيمته، بشكل مباشر أو عبر سلسلة من الكيانات المستبعدة (ولا تُحتسب الملكية عبر كيان خدمات التقاعد)، ويعمل حصرياً أو شبه حصري لحيازة الأصول أو استثمار الأموال لصالحها، أو لا يمارس إلا أنشطة مساندة لأنشطتها."],"r":["12(2)"],"p":["A company 95% owned by excluded entities, and only investing for them, is out too.","الشركة التي تملك الكيانات المستبعدة 95% منها، وتستثمر لصالحها فقط، مستبعدة أيضاً."]},{"h":["The 85% vehicle","أداة الـ85%"],"t":["An entity at least 85% of whose value is owned the same way, provided that substantially all of its income is excluded dividends or excluded equity gains or losses that are left out of DMT income.","كيان تملك الكيانات المستبعدة 85% على الأقل من قيمته بالطريقة نفسها، شريطة أن يكون كل دخله تقريباً توزيعات أرباح مستبعدة أو مكاسب أو خسائر حقوق ملكية مستبعدة لا تدخل في دخل ضريبة الحد الأدنى المحلي."],"r":["12(2)","19(1)"],"p":["At 85% it is out only if nearly all its income is exempt dividends and share gains.","عند 85% تُستبعد فقط إذا كان كل دخلها تقريباً توزيعات ومكاسب أسهم مستبعدة."]},{"h":["Opting back in","خيار العودة إلى الاحتساب"],"t":["The filing constituent entity may elect not to treat a 95% or 85% vehicle as excluded. It is a five-year election: it cannot be revoked for the election year or the next four; after a revocation, no new election for the next four years.","يجوز للكيان التابع المعين لتقديم الإقرار أن يختار عدم معاملة أداة الـ95% أو الـ85% ككيان مستبعد. وهو اختيار خمس سنوات: لا يجوز إلغاؤه لسنة الاختيار والسنوات الأربع التالية، وبعد الإلغاء لا يجوز إجراء اختيار جديد للسنوات الأربع التالية."],"r":["12(3)",1],"p":["The group may choose to keep such a vehicle in; the choice locks for five years.","يجوز للمجموعة أن تختار إبقاء هذه الأداة ضمن الاحتساب؛ ويُلزمها الاختيار خمس سنوات."]},{"h":["Governmental entities and sovereign funds","الكيانات الحكومية والصناديق السيادية"],"t":["A Governmental Entity must pass four tests together: government ownership, no trade or business with a government or investment purpose, accountability with annual reporting, and assets and earnings that go only to the government. A sovereign wealth fund meeting the investment criterion is also ignored as a UPE.","يجب أن يستوفي الكيان الحكومي أربعة اختبارات معاً: الملكية الحكومية، وعدم ممارسة تجارة أو نشاط تجاري مع غرض حكومي أو استثماري، والمساءلة مع تقارير سنوية، وأن تؤول الأصول والأرباح إلى الحكومة وحدها. ويتم أيضاً تجاهل صندوق الثروة السيادي الذي يستوفي معيار الاستثمار بصفته كياناً أماً نهائياً."],"r":[13,"10(2)"],"p":["A government body is out only if it runs no business. A state-owned company is not.","الجهة الحكومية مستبعدة فقط إذا لم تمارس نشاطاً تجارياً. أما الشركة المملوكة للدولة فلا."]},{"h":["International organisations","المنظمات الدولية"],"t":["An intergovernmental or supranational organisation (or its wholly owned agency) that is made up primarily of governments, has a headquarters or similar agreement with its host jurisdiction, and whose income cannot benefit private persons.","منظمة حكومية دولية أو فوق وطنية (أو وكالة مملوكة لها بالكامل) تتألف أساساً من حكومات، ولها اتفاقية مقر أو ما يماثلها مع الولاية المضيفة، ولا يجوز أن يعود دخلها بالنفع على أشخاص خاصين."],"r":[14],"p":["Bodies of governments with a host agreement, whose income cannot reach private people, are out.","الهيئات المكوّنة من حكومات ولها اتفاقية مقر، ولا يصل دخلها إلى أشخاص خاصين، مستبعدة."]},{"h":["Non-profit organisations","المنظمات غير الربحية"],"t":["Established and run exclusively for religious, charitable, scientific, artistic, cultural, athletic, educational or similar purposes (or as a professional body, chamber of commerce and the like), with income substantially exempt, no owners with a beneficial interest, no private benefit, and assets that pass to another non-profit or the government on dissolution. Running an unrelated trade or business takes it out.","تُنشأ وتُدار حصرياً لأغراض دينية أو خيرية أو علمية أو فنية أو ثقافية أو رياضية أو تعليمية أو ما يماثلها (أو كهيئة مهنية أو غرفة تجارية ونحوها)، ويكون دخلها معفى في معظمه، ولا ملاك لهم مصلحة انتفاعية، ولا منفعة خاصة، وتؤول أصولها عند الحل إلى منظمة غير ربحية أو إلى الحكومة. وممارسة نشاط تجاري لا يتصل بأغراضها تُخرجها من هذا الوصف."],"r":[15],"p":["Charities and similar bodies are out, unless they run an unrelated business.","الجمعيات الخيرية وما يماثلها مستبعدة، ما لم تمارس نشاطاً تجارياً غير مرتبط بغرضها."]},{"h":["Pension funds, investment funds and REIVs","صناديق التقاعد وصناديق الاستثمار والأدوات العقارية"],"t":["A Pension Fund includes a pension services entity. An Investment Fund must meet seven tests, including pooled assets from unconnected investors, a defined investment policy, regulation and professional management. A REIV is widely held, mainly holds immovable property, and is taxed once with at most one year's deferral.","يشمل صندوق التقاعد كيان خدمات التقاعد. ويجب أن يستوفي صندوق الاستثمار سبعة اختبارات، منها تجميع الأصول من مستثمرين بعضهم غير مرتبطين، وسياسة استثمار محددة، والخضوع للتنظيم، والإدارة المهنية. أما الأداة الاستثمارية العقارية فهي واسعة الملكية، وتحوز أساساً ممتلكات غير منقولة، وتخضع لمستوى واحد من الضريبة مع تأجيل لا يتجاوز سنة."],"r":[16,17,1],"p":["Qualifying pension funds are out; investment funds and REIVs only when they are the ultimate parent.","صناديق التقاعد المستوفية مستبعدة؛ وصناديق الاستثمار والأدوات العقارية فقط إذا كانت الكيان الأم النهائي."]},{"h":["What exclusion means","ماذا يعني الاستبعاد"],"t":["An excluded entity is not a constituent entity, so its own income and taxes stay out of the computation. It does not take the companies it owns out with it.","الكيان المستبعد ليس كياناً تابعاً، فيبقى دخله وضرائبه خارج الاحتساب. لكنه لا يُخرج معه الشركات التي يملكها."],"r":["9(3)"],"p":["Exclusion covers the entity itself, not the companies it owns.","الاستبعاد يشمل الكيان نفسه، لا الشركات التي يملكها."]}],"oecd":[{"t":["The list of excluded entities, the 95% and 85% tests and the five-year election to opt out follow GloBE Article 1.5. The definitions of each kind of entity follow Article 10.1.","تتبع قائمة الكيانات المستبعدة واختبارا 95% و85% واختيار الخمس سنوات للعدول عن الاستبعاد المادة 1.5 من القواعد النموذجية، وتتبع تعريفات كل نوع المادة 10.1."],"src":["Model Rules Arts 1.5 and 10.1","القواعد النموذجية: المادتان 1.5 و10.1"]}],"cases":[{"t":["The pension fund's investment vehicle","الأداة الاستثمارية لصندوق التقاعد"],"facts":["A Saudi pension fund that meets Article 16 owns 97% (by value) of PF Invest Co; an unrelated investor owns the other 3%. PF Invest only holds a portfolio of listed shares and bonds for the pension fund and has no other activity.","يملك صندوق تقاعد سعودي يستوفي المادة 16 نسبة 97% (بالقيمة) من شركة صندوق الاستثمار، ويملك مستثمر غير مرتبط نسبة 3% الباقية. ولا تقوم الشركة إلا بحيازة محفظة من الأسهم المدرجة والسندات لصالح صندوق التقاعد، ولا نشاط آخر لها."],"steps":[{"t":["The owner is an excluded entity: a Pension Fund (Art 12(1)(d)).","المالك كيان مستبعد: صندوق تقاعد (المادة 12 (1) (د))."]},{"t":["Ownership by value against the 95% threshold, in percentage points above it:","الملكية بالقيمة مقارنة بحد 95%، بالنقاط المئوية التي تتجاوزه:"],"x":"97-95","v":2,"u":"%"},{"t":["Activity: it operates exclusively to hold assets and invest funds for the pension fund.","النشاط: تعمل حصرياً لحيازة الأصول واستثمار الأموال لصالح صندوق التقاعد."]}],"ans":["PF Invest is an excluded entity under the 95% rule, so it is not a constituent entity. The filing entity could elect (a five-year election) to treat it as not excluded. At 90% ownership it would fail the 95% test and would have to pass the 85% test instead, which needs substantially all income to be excluded dividends or equity gains; bond interest would make that hard.","شركة صندوق الاستثمار كيان مستبعد وفق قاعدة 95%، فليست كياناً تابعاً. ويجوز للكيان المعين لتقديم الإقرار أن يختار (اختيار خمس سنوات) معاملتها ككيان غير مستبعد. ولو كانت الملكية 90% لفشلت في اختبار 95% ولتعيّن عليها اجتياز اختبار 85%، الذي يتطلب أن يكون كل الدخل تقريباً توزيعات أو مكاسب حقوق ملكية مستبعدة؛ وفوائد السندات تجعل ذلك صعباً."],"r":["12(1)","12(2)","12(3)"],"p":["PF Invest is excluded: the pension fund owns 97% and it only invests for the fund.","شركة صندوق الاستثمار مستبعدة: يملك صندوق التقاعد 97% منها وتستثمر لصالحه فقط."],"diagrams":[{"type":"org","at":"facts","title":["Who owns PF Invest","من يملك شركة صندوق الاستثمار"],"nodes":[{"id":"pf","t":["Saudi pension fund","صندوق تقاعد سعودي"],"s":["meets Article 16","يستوفي المادة 16"]},{"id":"pi","t":["PF Invest Co","شركة صندوق الاستثمار"],"s":["holds shares and bonds","تحوز أسهماً وسندات"]}],"edges":[{"f":"pf","to":"pi","l":["97% by value","97% بالقيمة"]}],"note":["An unrelated investor holds the other 3%.","يملك مستثمر غير مرتبط نسبة 3% الباقية."]},{"type":"flow","at":"answer","title":["The 95% test, step by step","اختبار 95% خطوة بخطوة"],"nodes":[{"t":["Owner excluded?","المالك مستبعد؟"],"s":["a pension fund ✓","صندوق تقاعد ✓"]},{"t":["At least 95% by value?","95% على الأقل بالقيمة؟"],"s":["97% ✓","97% ✓"]},{"t":["Only holds and invests for it?","يحوز ويستثمر لصالحه فقط؟"],"s":["✓","✓"]},{"t":["Result","النتيجة"],"s":["excluded: not a constituent entity","مستبعدة: ليست كياناً تابعاً"]}]}]},{"t":["Two state-owned entities, two answers","كيانان مملوكان للدولة ونتيجتان مختلفتان"],"facts":["Both are 100% owned by a government:\n• National Investment Authority: no trade or business; it manages and invests the state's assets, reports annually to the government, and its assets and earnings belong only to the state.\n• National Air Co: runs commercial passenger flights for profit.","كلاهما مملوك بالكامل لحكومة:\n• هيئة الاستثمار الوطنية: لا تمارس تجارة أو نشاطاً تجارياً؛ تدير أصول الدولة وتستثمرها، وتقدّم تقارير سنوية إلى الحكومة، وأصولها وأرباحها للدولة وحدها.\n• شركة الطيران الوطنية: تشغّل رحلات ركاب تجارية بهدف الربح."],"steps":[{"t":["National Investment Authority: ownership ✓, purpose ✓ (investing government assets, no business), accountability ✓, assets and earnings ✓.","هيئة الاستثمار الوطنية: الملكية ✓، والغرض ✓ (استثمار أصول الحكومة دون نشاط تجاري)، والمساءلة ✓، والأصول والأرباح ✓."]},{"t":["So it is a Governmental Entity and excluded. As a sovereign fund meeting the investment criterion, it is also ignored as a UPE.","فهي كيان حكومي مستبعد. وبصفتها صندوقاً سيادياً يستوفي معيار الاستثمار، يتم تجاهلها أيضاً بوصفها كياناً أماً نهائياً."]},{"t":["National Air Co: it carries on a trade or business, so it fails the purpose test.","شركة الطيران الوطنية: تمارس نشاطاً تجارياً، فتفشل في اختبار الغرض."]}],"ans":["The Authority is excluded; the airline is not. The airline is an ordinary company: if it heads, or belongs to, an MNE group over the threshold, its Saudi entities are in scope. State ownership alone never excludes a commercial company.","الهيئة مستبعدة، وشركة الطيران ليست كذلك. فهي شركة عادية: إذا ترأست مجموعة متعددة الجنسيات تتجاوز الحد أو انتمت إليها، خضعت كياناتها في المملكة للنظام. والملكية الحكومية وحدها لا تستبعد أي شركة تجارية."],"r":[13,"12(1)","10(2)"],"p":["The Authority is excluded. The airline runs a business, so it is an ordinary company.","الهيئة مستبعدة. وشركة الطيران تمارس نشاطاً تجارياً، فهي شركة عادية."],"diagrams":[{"type":"org","at":"facts","title":["Two state-owned entities","كيانان مملوكان للدولة"],"nodes":[{"id":"g","t":["Government","الحكومة"]},{"id":"a","t":["National Investment Authority","هيئة الاستثمار الوطنية"],"s":["invests state assets","تستثمر أصول الدولة"]},{"id":"c","t":["National Ai
