r Co","شركة الطيران الوطنية"],"s":["commercial flights for profit","رحلات تجارية بهدف الربح"]}],"edges":[{"f":"g","to":"a","l":["100%","100%"]},{"f":"g","to":"c","l":["100%","100%"]}]},{"type":"table","at":"answer","title":["Where they part ways","أين يفترقان"],"head":[["Test","الاختبار"],["Investment Authority","هيئة الاستثمار"],["National Air Co","شركة الطيران"]],"rows":[[["Owned by the government","مملوك للحكومة"],["✓","✓"],["✓","✓"]],[["No trade or business","لا تجارة ولا نشاط تجاري"],["✓","✓"],["✗ runs flights for profit","✗ تشغّل رحلات بهدف الربح"]],[["Result","النتيجة"],["excluded","مستبعدة"],["not excluded: an ordinary company","غير مستبعدة: شركة عادية"]]]}]},{"t":["The five-year election clock","ساعة اختيار الخمس سنوات"],"facts":["In FY2027 the filing entity elects not to treat a 96%-owned holding vehicle as excluded. In FY2031 the group wants to revoke the election. Calendar fiscal years.","في السنة المالية 2027م اختار الكيان المعين لتقديم الإقرار عدم معاملة أداة قابضة مملوكة بنسبة 96% ككيان مستبعد. وفي السنة المالية 2031م تريد المجموعة إلغاء الاختيار. السنوات المالية تقويمية."],"steps":[{"t":["A five-year election cannot be revoked for the election year or the four years after it. Last locked year:","لا يجوز إلغاء اختيار الخمس سنوات لسنة الاختيار أو السنوات الأربع التالية لها. آخر سنة ملزمة:"],"x":"2027+4","v":2031,"u":"yr"},{"t":["So the first year it can be revoked for:","فأول سنة يجوز الإلغاء عنها:"],"x":"2031+1","v":2032,"u":"yr"},{"t":["After revoking for FY2032, no new election for the four years after the revocation year. Earliest new election:","بعد الإلغاء للسنة المالية 2032م، لا يجوز إجراء اختيار جديد للسنوات الأربع التالية لسنة الإلغاء. أقرب اختيار جديد:"],"x":"2032+4+1","v":2037,"u":"yr"}],"ans":["Not for FY2031: the election is locked from 2027 to 2031. The group can revoke for FY2032 at the earliest, and could then make a new election only from FY2037, unless the Law or Regulations set other revocation rules.","لا يجوز للسنة المالية 2031م، فالاختيار ملزم من 2027م إلى 2031م. ويجوز للمجموعة الإلغاء للسنة المالية 2032م كأقرب موعد، ولا يجوز لها بعد ذلك إجراء اختيار جديد إلا اعتباراً من السنة المالية 2037م، ما لم ينص النظام أو اللائحة على قواعد أخرى للإلغاء."],"r":["12(3)",1],"p":["Locked for 2027 to 2031. Revoke from FY2032 at the earliest; no new election before FY2037.","ملزم من 2027م إلى 2031م. يجوز الإلغاء اعتباراً من 2032م؛ ولا اختيار جديد قبل 2037م."],"diagrams":[{"type":"flow","at":"answer","title":["The election clock","ساعة الاختيار"],"nodes":[{"t":["FY2027","2027م"],"s":["election made","إجراء الاختيار"]},{"t":["FY2028–2031","2028–2031م"],"s":["still locked","لا يزال ملزماً"]},{"t":["FY2032","2032م"],"s":["earliest revocation","أقرب سنة للإلغاء"]},{"t":["FY2033–2036","2033–2036م"],"s":["no new election","لا اختيار جديد"]},{"t":["FY2037","2037م"],"s":["a new election is possible","يجوز اختيار جديد"]}]}]}],"quiz":[{"q":["Which of these is NOT an excluded entity under Article 12(1)?","أي مما يلي ليس كياناً مستبعداً وفق المادة 12 (1)؟"],"o":[["A Governmental Entity that meets all four Article 13 tests","كيان حكومي يستوفي اختبارات المادة 13 الأربعة"],["An Investment Fund that sits below the UPE in the group","صندوق استثمار يقع دون الكيان الأم النهائي في المجموعة"],["A Pension Fund, including a pension services entity","صندوق تقاعد، بما فيه كيان خدمات التقاعد"],["A Real Estate Investment Vehicle that is the group's UPE","أداة استثمار عقاري تكون هي الكيان الأم النهائي للمجموعة"]],"a":1,"e":["Investment funds and REIVs are excluded only when they are the UPE (Art 12(1)(e)–(f)). A fund lower down the chain is tested like any other entity.","لا تُستبعد صناديق الاستثمار والأدوات العقارية إلا إذا كانت الكيان الأم النهائي (المادة 12 (1) (هـ)–(و)). أما الصندوق الأدنى في السلسلة فيُختبر كأي كيان آخر."],"r":["12(1)"]},{"q":["What two things does the 95% rule require?","ما الأمران اللذان تتطلبهما قاعدة 95%؟"],"o":[["At least 95% of votes owned by excluded entities, and any activity at all, trading included","تملك الكيانات المستبعدة 95% على الأقل من الأصوات، مع جواز أي نشاط، بما فيه التجارة"],["At least 95% of value owned by excluded entities, and at least 95% of income from dividends","تملك الكيانات المستبعدة 95% على الأقل من القيمة، وأن يكون 95% على الأقل من الدخل توزيعات أرباح"],["At least 95% of value owned by Saudi residents, and activity limited to holding investments","يملك مقيمون في المملكة 95% على الأقل من القيمة، ويقتصر النشاط على حيازة الاستثمارات"],["95% or more of value owned by excluded entities, and only holding or investing for them","تملك الكيانات المستبعدة 95% فأكثر من القيمة، ويقتصر نشاطه على الحيازة أو الاستثمار لها"]],"a":3,"e":["Article 12(2)(a): ownership of at least 95% by value by excluded entities (not through a pension services entity), plus an activity test. Votes, residence and the income mix are not the tests.","المادة 12 (2) (أ): ملكية الكيانات المستبعدة 95% على الأقل بالقيمة (لا عبر كيان خدمات التقاعد)، مع اختبار النشاط. وليست الأصوات ولا الإقامة ولا تركيبة الدخل هي المعيار."],"r":["12(2)"]},{"q":["An entity is 88% owned by a charity. What lets it be excluded?","كيان تملك جمعية خيرية 88% منه. ما الذي يجعله مستبعداً؟"],"o":[["Substantially all its income being excluded dividends or equity gains","أن يكون كل دخله تقريباً توزيعات أرباح أو مكاسب حقوق ملكية مستبعدة"],["Nothing: below 95% ownership, there is no route to exclusion","لا شيء: فدون ملكية 95% لا يوجد سبيل للاستبعاد"],["At least 85% of its income being interest on bonds held for the charity","أن يكون 85% على الأقل من دخله فوائد سندات محتفظ بها لصالح الجمعية"],["Its activity being limited to holding assets for the charity, as at 95%","أن يقتصر نشاطه على حيازة الأصول للجمعية الخيرية، كما في قاعدة 95%"]],"a":0,"e":["Article 12(2)(b): at 85% or more, the entity is excluded if substantially all its income is excluded dividends or excluded equity gains or losses left out of DMT income.","المادة 12 (2) (ب): عند 85% أو أكثر يُستبعد الكيان إذا كان كل دخله تقريباً توزيعات أو مكاسب أو خسائر حقوق ملكية مستبعدة لا تدخل في الدخل."],"r":["12(2)"]},{"q":["Who can elect not to treat a 95% or 85% vehicle as excluded, and for how long?","من يحق له اختيار عدم معاملة أداة 95% أو 85% ككيان مستبعد، ولأي مدة؟"],"o":[["The filing constituent entity, as a five-year election","الكيان التابع المعين لتقديم الإقرار، كاختيار خمس سنوات"],["The filing constituent entity, as an annual election","الكيان التابع المعين لتقديم الإقرار، كاختيار سنوي"],["The vehicle itself, as a five-year election made by its board","الأداة نفسها، كاختيار خمس سنوات يتخذه مجلس إدارتها بقرار"],["The vehicle itself, as an annual election made by its board","الأداة نفسها، كاختيار سنوي يتخذه مجلس إدارتها بقرار"]],"a":0,"e":["Article 12(3): the election belongs to the filing constituent entity and is a five-year election as defined in Article 1.","المادة 12 (3): الاختيار للكيان التابع المعين لتقديم الإقرار، وهو اختيار خمس سنوات كما تعرّفه المادة 1."],"r":["12(3)",1]},{"q":["A five-year election is revoked for FY2032. When is a new election possible?","أُلغي اختيار خمس سنوات للسنة المالية 2032م. متى يمكن إجراء اختيار جديد؟"],"o":[["FY2033","السنة المالية 2033م"],["FY2036","السنة المالية 2036م"],["FY2037","السنة المالية 2037م"],["FY2035","السنة المالية 2035م"]],"a":2,"e":["Article 1: after revocation, no new election for the four fiscal years after the revocation year (2033–2036), so FY2037, unless specific provisions say otherwise.","المادة 1: بعد الإلغاء، لا يجوز إجراء اختيار جديد للسنوات المالية الأربع التالية لسنة الإلغاء (2033–2036)، فيكون ذلك في السنة المالية 2037م، ما لم تنص أحكام خاصة على غير ذلك."],"r":[1]},{"q":["A 100% state-owned company runs a commercial business. Is it a Governmental Entity?","شركة مملوكة بالكامل للدولة تمارس نشاطاً تجارياً. هل هي كيان حكومي؟"],"o":[["Yes, 100% state ownership is enough on its own","نعم، فالملكية الحكومية الكاملة تكفي وحدها"],["Yes, if all its profits go to the government","نعم، إذا كانت أرباحها كلها تُدفع إلى الحكومة وحدها"],["No, carrying on a trade or business fails the test","لا، فممارسة تجارة أو نشاط تجاري تُسقط الاختبار"],["No, unless it reports to the government yearly","لا، ما لم تقدم تقارير سنوية إلى الحكومة"]],"a":2,"e":["Article 13(2) requires that the entity does not carry on a trade or business. All four tests must be met together.","تتطلب المادة 13 (2) ألا يمارس الكيان تجارة أو نشاطاً تجارياً، ويجب استيفاء الاختبارات الأربعة معاً."],"r":[13]},{"q":["A charity also runs a hotel business unrelated to its charitable purposes. Is it a Non-profit Organisation for the DMT?","جمعية خيرية تدير أيضاً نشاطاً فندقياً لا يتصل بأغراضها الخيرية. هل هي منظمة غير ربحية لأغراض النظام؟"],"o":[["Yes: its main purpose is charitable, so the hotel does not matter","نعم: فغرضها الرئيسي خيري، فلا أثر للفندق"],["Yes, if the hotel's profits are spent on charitable purposes","نعم، إذا أُنفقت أرباح الفندق على أغراضها الخيرية"],["No, but only for the years in which the hotel makes a profit","لا، ولكن فقط في السنوات التي يحقق فيها الفندق ربحاً"],["No: an unrelated trade or business takes it outside the definition","لا: فممارسة نشاط تجاري لا يتصل بأغراضها تخرجها من التعريف"]],"a":3,"e":["Article 15(2): a non-profit organisation does not include an entity carrying on a trade or business not directly related to its purposes. Where the profits go does not change that.","المادة 15 (2): لا تشمل المنظمة غير الربحية الكيان الذي يمارس تجارة أو نشاطاً تجارياً لا يتصل مباشرة بأغراضه. ولا يغيّر ذلك أين تذهب الأرباح."],"r":["15(2)"]},{"q":["Which is a requirement for an International Organisation?","أي مما يلي من متطلبات المنظمة الدولية؟"],"o":[["Membership made up mainly of private companies and their associations","عضوية تتألف أساساً من شركات خاصة وجمعياتها"],["A headquarters agreement with the Kingdom specifically, even if based abroad","اتفاقية مقر مع المملكة تحديداً، حتى لو كان مقرها في الخارج"],["Income that may be paid out to its private members each year","دخل يجوز توزيعه على أعضائها من القطاع الخاص كل سنة"],["A headquarters or similar agreement with its host jurisdiction","اتفاقية مقر أو ما يماثلها مع الولاية المضيفة"]],"a":3,"e":["Article 14: comprised primarily of governments, a headquarters or similar agreement, and governing law or documents that stop its income benefiting private persons.","المادة 14: تتألف أساساً من حكومات، ولها اتفاقية مقر أو ما يماثلها، وتمنع أنظمتها أو وثائقها أن يعود دخلها بالنفع على أشخاص خاصين."],"r":[14]},{"q":["Which of these is NOT one of the Investment Fund criteria in Article 17?","أي مما يلي ليس من معايير صندوق الاستثمار في المادة 17؟"],"o":[["Has its units listed on a recognised stock exchange","تكون وحداته مدرجة في سوق مالية معترف بها"],["Pools assets from investors, some of whom are not connected","يجمع أصولاً من مستثمرين بعضهم غير مرتبطين"],["Invests under a defined investment policy","يستثمر وفق سياسة استثمار محددة"],["Is managed by investment fund professionals for the investors","يديره مختصون في إدارة صناديق الاستثمار لصالح المستثمرين"]],"a":0,"e":["Listing is not required. Article 17's seven tests also include investor returns based on contributions and regulation that includes anti-money laundering and investor protection.","الإدراج ليس شرطاً. ومن معايير المادة 17 السبعة أيضاً حصول المستثمرين على عوائد بحسب مساهماتهم، والخضوع لتنظيم يشمل مكافحة غسل الأموال وحماية المستثمرين."],"r":[17]},{"q":["What does a Pension Fund include under Article 16?","ماذا يشمل صندوق التقاعد وفق المادة 16؟"],"o":[["Only government pension schemes run by a state agency","أنظمة التقاعد الحكومية التي تديرها جهة حكومية فقط"],["A pension services entity, and a regulated retirement-benefits entity","كيان خدمات التقاعد، والكيان المنظَّم الذي يقدم مزايا التقاعد"],["An insurance company that sells retirement savings products to the public","شركة تأمين تبيع منتجات ادخار للتقاعد للجمهور"],["An employee savings plan, whether or not it is regulated as a pension","خطة ادخار للموظفين، سواء خضعت للتنظيم كصندوق تقاعد أم لم تخضع"]],"a":1,"e":["Article 16(1): a pension services entity, or an entity that administers or provides retirement benefits and is regulated as such or has benefits secured by national regulations and funded through a fiduciary arrangement.","المادة 16 (1): كيان خدمات التقاعد، أو كيان يدير أو يقدم مزايا التقاعد ويخضع للتنظيم بهذه الصفة، أو تكون مزاياه مضمونة بأنظمة وطنية وممولة عبر ترتيب ائتماني."],"r":["16(1)"]},{"q":["A REIV is excluded when:","تُستبعد الأداة الاستثمارية العقارية عندما:"],"o":[["It holds property in the Kingdom, wherever it sits in the group","تحوز عقارات في المملكة، أينما كان موقعها في المجموعة"],["It is the UPE, widely held, mainly holding property and taxed only once","الكيان الأم النهائي، واسعة الملكية، عقارية أساساً، وتُفرض ضريبتها مرة واحدة"],["It is widely held and listed, even as a subsidiary in the group","تكون واسعة الملكية ومدرجة، حتى لو كانت تابعة في المجموعة"],["It is the UPE and its consolidated revenue is below €750m","تكون الكيان الأم النهائي وتقل إيراداتها الموحدة السنوية عن 750 مليون يورو"]],"a":1,"e":["Article 12(1)(f): only a REIV that is the UPE is excluded. Article 1 defines a REIV as widely held, mainly holding immovable property, and taxed at a single level, with no more than one year's deferral.","المادة 12 (1) (و): لا تُستبعد إلا الأداة الاستثمارية العقارية التي تكون الكيان الأم النهائي. وتعرّفها المادة 1 بأنها واسعة الملكية، تحوز عقارات في الغالب، وتخضع لمستوى واحد من الضريبة بتأجيل لا يتجاوز سنة."],"r":["12(1)",1]},{"q":["Is an Excluded Entity a Constituent Entity?","هل الكيان المستبعد كيان تابع؟"],"o":[["Yes, but its own income and taxes are kept out of the Kingdom's ETR","نعم، لكن دخله وضرائبه تُستبعد من المعدل الفعلي للمملكة"],["No, and the entities it owns are excluded along with it","لا، وتُستبعد معه الكيانات التي يملكها"],["No: a constituent entity does not include an excluded entity","لا: الكيان التابع لا يشمل الكيان المستبعد"],["Only if it is located in the Kingdom and pays Zakat","فقط إذا كان واقعاً في المملكة ويدفع الزكاة"]],"a":2,"e":["Article 9(3). Its own income and taxes stay out of the computation, but entities it owns are tested on their own facts.","المادة 9 (3). يبقى دخله وضرائبه خارج الاحتساب، لكن الكيانات التي يملكها تُختبر وفق وقائعها."],"r":["9(3)"]}],"cards":[{"f":["The six excluded entities","الكيانات المستبعدة الستة"],"b":["Governmental Entity · International Organisation · Non-profit Organisation · Pension Fund · Investment Fund as UPE · REIV as UPE.","الكيان الحكومي · المنظمة الدولية · المنظمة غير الربحية · صندوق التقاعد · صندوق الاستثمار بصفته الكيان الأم النهائي · الأداة العقارية بصفتها الكيان الأم النهائي."],"r":["12(1)"]},{"f":["The 95% rule","قاعدة 95%"],"b":["≥95% of value held by excluded entities (not via a pension services entity) + only holding assets or investing for them, or ancillary activity.","تملك الكيانات المستبعدة 95% على الأقل من القيمة (لا عبر كيان خدمات التقاعد) + لا نشاط إلا حيازة الأصول أو الاستثمار لها أو نشاط مساند."],"r":["12(2)"]},{"f":["The 85% rule","قاعدة 85%"],"b":["≥85% of value held by excluded entities + substantially all income is excluded dividends or excluded equity gains or losses.","تملك الكيانات المستبعدة 85% على الأقل من القيمة + كل الدخل تقريباً توزيعات أو مكاسب أو خسائر حقوق ملكية مستبعدة."],"r":["12(2)"]},{"f":["Opting a 95% or 85% vehicle back in","إعادة أداة 95% أو 85% إلى الاحتساب"],"b":["Filing constituent entity's five-year election.","اختيار خمس سنوات من الكيان التابع المعين لتقديم الإقرار."],"r":["12(3)"]},{"f":["Five-Year Election","اختيار الخمس سنوات"],"b":["Locked for the election year and the next four; after revocation, no new election for the next four years.","ملزم لسنة الاختيار والسنوات الأربع التالية؛ وبعد الإلغاء لا اختيار جديد للسنوات الأربع التالية."],"r":[1]},{"f":["Governmental Entity: the four tests","الكيان الحكومي: الاختبارات الأربعة"],"b":["Government-owned · no trade or business, government or investment purpose · accountable with annual reporting · assets and earnings only to the government.","مملوك للحكومة · لا نشاط تجاري، وغرض حكومي أو استثماري · مساءلة مع تقارير سنوية · الأصول والأرباح للحكومة وحدها."],"r":[13]},{"f":["International Organisation","المنظمة الدولية"],"b":["Mainly governments · headquarters or similar agreement · income cannot benefit private persons.","تتألف أساساً من حكومات · اتفاقية مقر أو ما يماثلها · لا يعود دخلها بالنفع على أشخاص خاصين."],"r":[14]},{"f":["When is a charity not a Non-profit Organisation?","متى لا تكون الجمعية الخيرية منظمة غير ربحية؟"],"b":["When it carries on a trade or business not directly related to its purposes.","عندما تمارس تجارة أو نشاطاً لا يتصل مباشرة بأغراضها."],"r":["15(2)"]},{"f":["Pension Fund","صندوق التقاعد"],"b":["A pension services entity, or an entity providing retirement benefits that is regulated or whose benefits are protected by national regulations.","كيان خدمات التقاعد، أو كيان يقدم مزايا التقاعد ويخضع للتنظيم أو تحمي الأنظمة الوطنية مزاياه."],"r":[16]},{"f":["Investment Fund: three of the seven tests","صندوق الاستثمار: ثلاثة من الاختبارات السبعة"],"b":["Pools assets from partly unconnected investors · defined investment policy · regulated and professionally managed.","يجمع أصولاً من مستثمرين بعضهم غير مرتبطين · سياسة استثمار محددة · خاضع للتنظيم وتديره جهة مهنية."],"r":[17]},{"f":["Real Estate Investment Vehicle","الأداة الاستثمارية العقارية"],"b":["Widely held, mainly immovable property, one level of tax, deferral of at most one year. Excluded only as UPE.","واسعة الملكية، تحوز أساساً ممتلكات غير منقولة، مستوى واحد من الضريبة، تأجيل لا يتجاوز سنة. لا تُستبعد إلا بصفتها الكيان الأم النهائي."],"r":[1,"12(1)"]},{"f":["Does exclusion pass down to subsidiaries?","هل ينتقل الاستبعاد إلى الشركات التابعة؟"],"b":["No. The excluded entity is not a constituent entity, but the companies it owns are tested on their own facts.","لا. الكيان المستبعد ليس كياناً تابعاً، لكن الشركات التي يملكها تُختبر وفق وقائعها."],"r":["9(3)"]}],"terms":[{"t":["Excluded entity","الكيان المستبعد"],"d":["An entity left out of the DMT: its own income and taxes do not count.","كيان خارج احتساب الضريبة: لا يُحتسب دخله ولا ضرائبه."]},{"t":["Governmental entity","الكيان الحكومي"],"d":["A state body that runs no business and works only for the government.","جهة مملوكة للدولة لا تمارس نشاطاً تجارياً وتعمل لصالح الحكومة وحدها."]},{"t":["International organisation","المنظمة الدولية"],"d":["A body made up mainly of governments, with a host-country agreement.","هيئة تتألف أساساً من حكومات، ولها اتفاقية مع الدولة المضيفة."]},{"t":["Non-profit organisation","المنظمة غير الربحية"],"d":["A charity-type body: no owners, no private benefit, income mostly exempt.","جهة من نوع الجمعيات الخيرية: لا ملاك ولا منفعة خاصة، ودخلها معفى في معظمه."]},{"t":["Pension fund","صندوق التقاعد"],"d":["A fund that pays retirement benefits; its pension services entity counts too.","صندوق يدفع منافع التقاعد؛ ويُحتسب معه كيان خدمات التقاعد."]},{"t":["Investment fund and REIV","صندوق الاستثمار والأداة الاستثمارية العقارية"],"d":["Pooled funds and property vehicles; excluded only when they are the ultimate parent.","صناديق مجمّعة وأدوات عقارية؛ تُستبعد فقط إذا كانت الكيان الأم النهائي."]},{"t":["95% and 85% vehicles","أداتا الـ95% والـ85%"],"d":["Companies owned almost wholly by excluded entities and working only for them.","شركات تملكها الكيانات المستبعدة بالكامل تقريباً وتعمل لصالحها فقط."]}],"range":"1, 12–17"},{"id":5,"title":["DMT Income I: the starting point and core adjustments","دخل الضريبة (1): نقطة البداية والتعديلات الأساسية"],"goal":["Start from the right accounts, then make the core adjustments: taxes, dividends, equity gains, revaluation gains and policy-disallowed expenses.","البدء من الحسابات الصحيحة، ثم إجراء التعديلات الأساسية: الضرائب، وتوزيعات الأرباح، ومكاسب حقوق الملكية، ومكاسب إعادة التقييم، والمصاريف غير جائزة الحسم."],"parts":[3],"arts":[18,19,20,21,22,23,24,27],"time":35,"metaphor":{"title":["Filtering crude oil","تكرير النفط الخام"],"text":["Accounting profit is crude oil: valuable, but full of things the DMT engine cannot burn. Article 18 tells you which well to draw from (local audited accounts, if every Saudi entity has them on the group's year-end). Article 19 is the refinery: it filters out taxes (they are measured separately), dividends and equity gains already taxed elsewhere, and puts back expenses the law will not subsidise, such as bribes and large fines.\nWhat comes out of the refinery is DMT Income or Loss: the fuel the 15% gauge actually measures.","الربح المحاسبي نفط خام: ثمين، لكنه مليء بما لا يستطيع محرك ضريبة الحد الأدنى المحلي حرقه. تحدد المادة 18 البئر الذي تسحب منه (الحسابات المحلية المدققة إذا كانت لكل كيان في المملكة بنهاية السنة نفسها للمجموعة). والمادة 19 هي المصفاة: تستبعد الضرائب (فهي تُقاس بشكل منفصل)، وتوزيعات الأرباح ومكاسب حقوق الملكية التي خضعت للضريبة في مكان آخر، وتُعيد المصاريف التي لا يدعمها النظام، كالرشاوى والغرامات الكبيرة.\nوما يخرج من المصفاة هو دخل أو خسارة ضريبة الحد الأدنى المحلي: الوقود الذي يقيسه مؤشر 15% فعلاً."]},"anchors":[{"if":["You open a Saudi entity's DMT computation","تفتح احتساب ضريبة الحد الأدنى المحلي لكيان في المملكة"],"then":["Check first: do all Saudi entities have Saudi-standard accounts on the group's year-end, required by the Income Tax Law or audited? If yes, start there (Art 18(2))","تحقق أولاً: هل لدى كل الكيانات في المملكة حسابات وفق المعيار السعودي بنهاية سنة المجموعة، مطلوبة بموجب نظام ضريبة الدخل أو مدققة؟ إن كان نعم فابدأ منها (المادة 18 (2))"]},{"if":["The P&L shows a tax charge","تُظهر قائمة الدخل مصروف ضريبة"],"then":["Add back all covered taxes, current and deferred, and any DMT accrued; they feed the ETR numerator instead (Art 20)","أعد إضافة كل الضرائب المشمولة، الحالية والمؤجلة، وأي ضريبة حد أدنى محلي مستحقة؛ فمكانها بسط معدل الضريبة الفعلي (المادة 20)"]},{"if":["A dividend comes in","تُستلم توزيعات أرباح"],"then":["Ask: is it a short-term portfolio shareholding (<10%, held <1 year)? Only then does it stay in income (Art 21)","اسأل: هل هي حصة ملكية محدودة قصيرة الأجل (أقل من 10% ومحتفظ بها أقل من سنة)؟ عندها فقط تبقى في الدخل (المادة 21)"]},{"if":["You see fair value gains, equity-method profit or a gain on selling shares","ترى مكاسب قيمة عادلة أو ربحاً بطريقة حقوق الملكية أو مكسباً من بيع أسهم"],"then":["Exclude them unless the stake is a portfolio shareholding below 10% (Art 22)","استبعدها ما لم تكن الحصة حصة ملكية محدودة دون 10% (المادة 22)"]},{"if":["You see a fine, penalty or improper payment","ترى غرامة أو عقوبة أو دفعة غير مشروعة"],"then":["Add back bribes and illegal payments of any size, and fines of €50,000 or more (Art 27)","أعد إضافة الرشاوى والمدفوعات غير المشروعة أياً كان حجمها، والغرامات التي تبلغ 50,000 يورو أو أكثر (المادة 27)"]}],"diagrams":[{"type":"flow","title":["From accounting profit to DMT Income","من الربح المحاسبي إلى دخل ضريبة الحد الأدنى المحلي"],"nodes":[{"t":["Financial Accounting Net Income or Loss","صافي الدخل أو الخسارة المحاسبية"],"s":["local or group standard · Art 18","المعيار المحلي أو معيار المجموعة · المادة 18"]},{"t":["+ Net Taxes Expense","+ صافي المصاريف الضريبية"],"s":["Art 20","المادة 20"]},{"t":["− Excluded Dividends","− توزيعات الأرباح المستبعدة"],"s":["Art 21","المادة 21"]},{"t":["± Excluded Equity Gain or Loss","± مكاسب أو خسائر حقوق الملكية المستبعدة"],"s":["Art 22","المادة 22"]},{"t":["± Revaluation, FX, errors, pensions…","± إعادة التقييم والعملات والأخطاء والتقاعد…"],"s":["Arts 19, 24–29","المواد 19 و24–29"]},{"t":["+ Policy Disallowed Expenses","+ المصاريف غير جائزة الحسم"],"s":["Art 27","المادة 27"]},{"t":["= DMT Income or Loss","= دخل أو خسارة ضريبة الحد الأدنى المحلي"],"s":["per constituent entity","لكل كيان تابع"]}],"quick":true},{"type":"table","title":["Dividends and share gains at a glance","توزيعات الأرباح ومكاسب الأسهم بنظرة سريعة"],"head":[["Stake","الحصة"],["Dividends","توزيعات الأرباح"],["Fair value and disposal gains","مكاسب القيمة العادلة والبيع"]],"rows":[[["10% or more (or equity-accounted)","10% أو أكثر (أو بطريقة حقوق الملكية)"],["Excluded","مستبعدة"],["Excluded (equity-method profit too)","مستبعدة (وكذلك ربح طريقة حقوق الملكية)"]],[["Below 10%, held 1 year or more","دون 10%، محتفظ بها سنة أو أكثر"],["Excluded, unless the five-year portfolio election is made","مستبعدة، ما لم يُجرَ اختيار الخمس سنوات للحصص المحدودة"],["Included","مُدرجة"]],[["Below 10%, held less than 1 year","دون 10%، محتفظ بها أقل من سنة"],["Included","مُدرجة"],["Included","مُدرجة"]]],"note":["Below 10% means a Portfolio Shareholding: rights to less than 10% of profits, capital, reserves or votes (Art 1).","دون 10% تعني حصة ملكية محدودة: حقوق في أقل من 10% من الأرباح أو رأس المال أو الاحتياطيات أو حقوق التصويت (المادة 1)."]}],"points":[{"h":["The starting point","نقطة البداية"],"t":["Each constituent entity's DMT Income or Loss is its Financial Accounting Net Income or Loss for the year, adjusted for the items in Articles 19 to 41.","دخل أو خسارة ضريبة الحد الأدنى المحلي لكل كيان تابع هو صافي دخله أو خسارته المحاسبية للسنة، معدلاً بالبنود الواردة في المواد من 19 إلى 41."],"r":["18(1)"],"p":["Start from the accounting profit, then make the adjustments the law lists.","ابدأ من الربح المحاسبي، ثم أجرِ التعديلات التي يحددها النظام."]},{"h":["Local accounts first","الحسابات المحلية أولاً"],"t":["If every Saudi constituent entity keeps accounts under the Kingdom's authorised accounting standard on the same fiscal year as the group's consolidated statements, use those accounts, before intra-group eliminations. This applies where all of them must keep or use those accounts under the Income Tax Law, or the accounts are externally audited. Otherwise, another standard applies under conditions set by the Regulations.","إذا كان لكل كيان تابع في المملكة حسابات وفق المعايير المحاسبية المعتمدة في المملكة وبالسنة المالية نفسها للقوائم الموحدة للمجموعة، تُستخدم تلك الحسابات قبل استبعاد المعاملات داخل المجموعة. ويسري ذلك إذا كانت جميعها ملزمة بمسك تلك الحسابات أو استخدامها بموجب نظام ضريبة الدخل، أو كانت الحسابات مدققة تدقيقاً خارجياً. وفي غير ذلك يُطبق معيار آخر وفق شروط تحددها اللائحة."],"r":["18(2)","18(3)"],"p":["Use the Saudi accounts if all Saudi entities keep them, required or audited, on the group's year-end.","استخدم القوائم السعودية إذا احتفظت بها كل الكيانات السعودية، إلزاماً أو مع مراجعتها، على نهاية سنة المجموعة."]},{"h":["The adjustment list","قائمة التعديلات"],"t":["Net taxes expense; excluded dividends; excluded equity gain or loss; included revaluation method gain or loss; gains or losses on asset transfers excluded under Article 76; asymmetric FX gains or losses; policy disallowed expenses; prior period errors and accounting changes; accrued pension expense provided through a pension fund; bad debts in the Article 29 cases; and any other adjustment set by the Regulations.","صافي المصاريف الضريبية؛ وتوزيعات الأرباح المستبعدة؛ ومكاسب أو خسائر حقوق الملكية المستبعدة؛ والمكاسب أو الخسائر وفق طريقة إعادة التقييم؛ ومكاسب أو خسائر التصرف في الأصول والالتزامات المستبعدة بموجب المادة 76؛ ومكاسب أو خسائر العملات الأجنبية غير المتماثلة؛ والمصاريف غير جائزة الحسم؛ وأخطاء الفترات السابقة والتغيرات المحاسبية؛ ومصاريف التقاعد المستحقة المقدمة عبر صندوق تقاعد؛ والديون المعدومة في حالات المادة 29؛ وأي تعديلات أخرى تحددها اللائحة."],"r":["19(1)"],"p":["A list of eleven adjustments turns accounting profit into DMT income.","قائمة من أحد عشر تعديلاً تحوّل الربح المحاسبي إلى دخل الضريبة."]},{"h":["Net taxes expense","صافي المصاريف الضريبية"],"t":["Add back covered taxes accrued as an expense, current and deferred (including those on excluded income), any deferred tax asset for the year's loss, and any tax under this Law accrued as an expense. The ETR measures taxes separately, so they must not reduce the income they are measured against.","تُعاد إضافة الضرائب المشمولة المستحقة كمصروف، الحالية والمؤجلة (بما فيها تلك المتعلقة بالدخل المستبعد)، وأي أصل ضريبي مؤجل مرتبط بخسارة السنة، وأي ضريبة بموجب هذا النظام مستحقة كمصروف. فمعدل الضريبة الفعلي يقيس الضرائب بشكل منفصل، فلا يجوز أن تُنقص الدخل الذي تُقاس مقابله."],"r":[20],"p":["Add back tax expense: taxes are measured on their own, not deducted from the profit.","أعد إضافة مصروف الضرائب: فالضرائب تُقاس وحدها، ولا تُخصم من الربح."]},{"h":["Excluded dividends","توزيعات الأرباح المستبعدة"],"t":["Dividends on ownership interests are excluded, except on a short-term portfolio shareholding (under 10% and held for less than a year at the distribution date) and on an investment entity under the Article 88 election. The filing entity can make a five-year election to include all dividends on portfolio shareholdings.","تُستبعد توزيعات الأرباح المتعلقة بحصص الملكية، باستثناء حصة الملكية المحدودة قصيرة الأجل (دون 10% ومحتفظ بها أقل من سنة في تاريخ التوزيع) والكيان الاستثماري الخاضع لاختيار المادة 88. ويجوز للكيان المعين لتقديم الإقرار إجراء اختيار خمس سنوات لإدراج جميع توزيعات الحصص المحدودة."],"r":[21],"p":["Take out dividends on shareholdings, except stakes under 10% held less than a year.","استبعد توزيعات الأرباح على الحصص، إلا الحصص دون 10% المحتفظ بها أقل من سنة."]},{"h":["Excluded equity gain or loss","مكاسب أو خسائر حقوق الملكية المستبعدة"],"t":["Fair value changes and disposal gains or losses on ownership interests, and equity-method profit or loss, are excluded. Portfolio shareholdings are the exception for fair value and disposals: their gains stay in.","تُستبعد تغيرات القيمة العادلة ومكاسب أو خسائر التصرف في حصص الملكية، والربح أو الخسارة بطريقة حقوق الملكية. وتُستثنى الحصص المحدودة في القيمة العادلة والتصرف: فمكاسبها تبقى في الدخل."],"r":[22],"p":["Take out share gains and equity-method profit; small portfolio stakes keep their gains in.","استبعد مكاسب الأسهم وأرباح طريقة حقوق الملكية؛ وتبقى مكاسب الحصص المحدودة ضمن الدخل."]},{"h":["The equity investment inclusion election","اختيار إدراج الاستثمار في حقوق الملكية"],"t":["A five-year election to include gains, losses and the related taxes on ownership interests where the tax system already taxes them (mark-to-market, deferred tax on revaluations, transparent entities, taxable disposals). It does not apply to portfolio shareholdings, and it cannot be revoked for an interest whose loss has been used.","اختيار خمس سنوات لإدراج المكاسب والخسائر والضرائب المرتبطة بها على حصص الملكية حين يفرض النظام الضريبي الضريبة عليها أصلاً (التقييم بسعر السوق، والضريبة المؤجلة على إعادة التقييم، والكيانات الشفافة، والتصرفات الخاضعة للضريبة). ولا ينطبق على الحصص المحدودة، ولا يجوز إلغاؤه لحصة استُخدمت خسارتها."],"r":[23],"p":["Where a country already taxes share gains, the group may elect to keep them in, for five years.","إذا كانت الدولة تفرض الضريبة على مكاسب الأسهم، يجوز للمجموعة اختيار إبقائها ضمن الدخل لخمس سنوات."]},{"h":["Revaluation gains","مكاسب إعادة التقييم"],"t":["Where property, plant and equipment is revalued to fair value through Other Comprehensive Income and never recycled to profit or loss, the net gain or loss (adjusted for associated covered taxes) is brought into DMT income.","حيث يُعاد تقييم العقارات والآلات والمعدات بالقيمة العادلة عبر الدخل الشامل الآخر دون إعادة تصنيفها لاحقاً إلى الربح أو الخسارة، يُدرج صافي المكسب أو الخسارة (معدلاً بالضرائب المشمولة المرتبطة) في الدخل."],"r":[24],"p":["Revaluation gains on fixed assets booked in OCI are brought into DMT income.","تُدرج في دخل الضريبة مكاسب إعادة تقييم الأصول الثابتة المسجلة في الدخل الشامل الآخر."]},{"h":["Policy disallowed expenses","المصاريف غير جائزة الحسم"],"t":["Bribes, kickbacks and other illegal payments are added back whatever the amount. Fines and penalties are added back if they equal or exceed the riyal equivalent of €50,000.","تُعاد إضافة الرشاوى والعمولات غير المشروعة وسائر المدفوعات غير القانونية أياً كان مبلغها. وتُعاد إضافة الغرامات والعقوبات إذا ساوت أو تجاوزت ما يوازي 50,000 يورو بالريال."],"r":[27],"p":["Add back bribes always, and fines of €50,000 or more.","أعد إضافة الرشاوى دائماً، والغرامات البالغة 50,000 يورو أو أكثر."]}],"oecd":[{"t":["Article 18(2) uses the local accounting standard, as the OECD's February 2023 Administrative Guidance allows a QDMTT to do, so a Saudi computation can start from audited Saudi statutory accounts rather than the parent's consolidation package.","تستخدم المادة 18 (2) المعيار المحاسبي المحلي، كما تسمح الإرشادات الإدارية للمنظمة الصادرة في فبراير 2023م للضريبة التكميلية المحلية المؤهلة، فيمكن أن يبدأ الاحتساب في المملكة من الحسابات النظامية السعودية المدققة بدلاً من حزمة توحيد الكيان الأم."],"src":["OECD Administrative Guidance, February 2023 (QDMTT accounting standard)","الإرشادات الإدارية للمنظمة، فبراير 2023م (المعيار المحاسبي للضريبة التكميلية المحلية المؤهلة)"]},{"t":["The adjustment list mirrors GloBE Article 3.2.1. The draft adds bad debt releases (Art 29) and a catch-all for adjustments set by the Regulations.","تحاكي قائمة التعديلات المادة 3.2.1 من القواعد النموذجية، ويضيف المشروع الإعفاء من الديون (المادة 29) وبنداً عاماً للتعديلات التي تحددها اللائحة."],"src":["Model Rules Art 3.2.1","القواعد النموذجية: المادة 3.2.1"]}],"cases":[{"t":["From net profit to DMT Income","من صافي الربح إلى دخل ضريبة الحد الأدنى المحلي"],"facts":["Najd Trading's FY2027 profit after tax is SAR 40m. The P&L includes:\n• Current tax SAR 8m and deferred tax SAR 1m (all covered taxes)\n• Dividend of SAR 3m and a fair value gain of SAR 1.5m on a 30% stake carried at fair value\n• Equity-method share of a joint venture's profit: SAR 2m\n• Dividend of SAR 0.4m on a 2% stake held for three years\n• Dividend of SAR 0.2m on a 5% stake bought six months ago\nNo portfolio dividend election has been made.","صافي ربح شركة نجد التجارية بعد الضريبة للسنة المالية 2027م يبلغ 40 مليون ريال. وتتضمن قائمة الدخل:\n• ضريبة حالية 8 ملايين ريال وضريبة مؤجلة مليون ريال (كلها ضرائب مشمولة)\n• توزيعات 3 ملايين ريال ومكسب قيمة عادلة 1.5 مليون ريال على حصة 30% مقيمة بالقيمة العادلة\n• حصة من ربح مشروع مشترك بطريقة حقوق الملكية: مليونا ريال\n• توزيعات 0.4 مليون ريال على حصة 2% محتفظ بها ثلاث سنوات\n• توزيعات 0.2 مليون ريال على حصة 5% اشتُريت قبل ستة أشهر\nولم يُجرَ اختيار توزيعات الحصص المحدودة."],"steps":[{"t":["Add back net taxes expense (current + deferred covered taxes).","أعد إضافة صافي المصاريف الضريبية (الضرائب المشمولة الحالية والمؤجلة)."],"x":"40000000+8000000+1000000","v":49000000,"u":"SAR"},{"t":["Remove excluded dividends: the 30% stake (SAR 3m) and the long-held 2% stake (SAR 0.4m).","استبعد توزيعات الأرباح المستبعدة: حصة 30% (3 ملايين) وحصة 2% طويلة الأجل (0.4 مليون)."],"x":"49000000-3000000-400000","v":45600000,"u":"SAR"},{"t":["Remove excluded equity gains: the JV's equity-method profit (SAR 2m) and the fair value gain on the 30% stake (SAR 1.5m).","استبعد مكاسب حقوق الملكية المستبعدة: ربح المشروع المشترك بطريقة حقوق الملكية (مليونان) ومكسب القيمة العادلة على حصة 30% (1.5 مليون)."],"x":"45600000-2000000-1500000","v":42100000,"u":"SAR"},{"t":["Keep the SAR 0.2m dividend on the 5% stake held six months: a short-term portfolio shareholding.","أبقِ توزيعات 0.2 مليون ريال على حصة 5% المحتفظ بها ستة أشهر: حصة ملكية محدودة قصيرة الأجل."]}],"ans":["DMT Income is SAR 42.1m. The SAR 9m of covered taxes is not lost: it becomes the starting point for adjusted covered taxes in the ETR (Module 8).","دخل ضريبة الحد الأدنى المحلي 42.1 مليون ريال. ولا تضيع الضرائب المشمولة البالغة 9 ملايين ريال، بل تصبح نقطة البداية للضرائب المشمولة المعدلة في معدل الضريبة الفعلي (الوحدة 8)."],"r":[20,21,22],"p":["DMT income is SAR 42.1m: add back SAR 9m of tax, take out SAR 6.9m of excluded items.","دخل الضريبة 42.1 مليون ريال: نضيف 9 ملايين من الضرائب، ونستبعد 6.9 مليون من البنود المستبعدة."],"diagrams":[{"type":"waterfall","at":"answer","title":["From profit after tax to DMT income","من الربح بعد الضريبة إلى دخل الضريبة"],"cap":["SAR million","بملايين الريالات"],"rows":[{"l":["Profit after tax","الربح بعد الضريبة"],"v":40,"k":"add"},{"l":["Covered taxes added back","الضرائب المشمولة المعادة"],"v":9,"k":"add"},{"l":["Excluded dividends","توزيعات الأرباح المستبعدة"],"v":3.4,"k":"sub"},{"l":["Excluded equity gains","مكاسب حقوق الملكية المستبعدة"],"v":3.5,"k":"sub"},{"l":["DMT income","دخل الضريبة"],"v":42.1,"k":"sum"}],"note":["The SAR 0.2m dividend on the 5% stake bought six months ago stays in.","تبقى توزيعات 0.2 مليون ريال على حصة 5% المشتراة قبل ستة أشهر ضمن الدخل."]}]},{"t":["Statutory accounts or the consolidation package?","الحسابات النظامية أم حزمة التوحيد؟"],"facts":["A group reports under IFRS with a December year-end. Its three Saudi entities each prepare audited statutory accounts under the Kingdom's authorised standard, also to December. For FY2027 one entity's statutory profit is SAR 25m, while its consolidation package shows SAR 24.2m because of a different provisioning policy. Before consolidation eliminations.","تعد مجموعة قوائمها وفق المعايير الدولية للتقرير المالي بنهاية سنة في ديسمبر. ولكل من كياناتها الثلاثة في المملكة حسابات نظامية مدققة وفق المعايير المعتمدة في المملكة، بنهاية ديسمبر أيضاً. وللسنة المالية 2027م يبلغ الربح النظامي لأحد الكيانات 25 مليون ريال، بينما تُظهر حزمة التوحيد 24.2 مليون ريال بسبب اختلاف سياسة المخصصات. والأرقام قبل استبعادات التوحيد."],"steps":[{"t":["Do all Saudi entities have accounts under the Kingdom's standard on the same fiscal year as the consolidated statements? Yes, all to December.","هل لدى جميع الكيانات في المملكة حسابات وفق معيار المملكة بالسنة المالية نفسها للقوائم الموحدة؟ نعم، كلها بنهاية ديسمبر."]},{"t":["Is one of the conditions met (required under the Income Tax Law, or externally audited)? Yes, they are audited.","هل تحقق أحد الشرطين (الإلزام بموجب نظام ضريبة الدخل أو التدقيق الخارجي)؟ نعم، فهي مدققة."]},{"t":["So start from statutory profit, before intra-group eliminations. Difference from the package:","فنبدأ من الربح النظامي قبل استبعاد المعاملات داخل المجموعة. الفرق عن الحزمة:"],"x":"25000000-24200000","v":800000,"u":"SAR"}],"ans":["The starting point is SAR 25m, the statutory figure. If any one of the three Saudi entities had a March year-end, the condition would fail for all of them, and the Regulations would set which other standard applies.","نقطة البداية 25 مليون ريال، أي الرقم النظامي. ولو كانت نهاية سنة أحد الكيانات الثلاثة في مارس لفشل الشرط بالنسبة لها جميعاً، ولحددت اللائحة المعيار الآخر الواجب التطبيق."],"r":["18(2)","18(3)"],"p":["Start from the statutory SAR 25m: all three Saudi entities have audited December accounts.","ابدأ من الرقم النظامي 25 مليون ريال: لدى الكيانات السعودية الثلاثة قوائم مراجَعة لشهر ديسمبر."],"diagrams":[{"type":"flow","at":"answer","title":["Which accounts to start from","من أي حسابات نبدأ"],"nodes":[{"t":["Same year-end as the group?","نهاية السنة نفسها للمجموعة؟"],"s":["all three to December ✓","الثلاثة لشهر ديسمبر ✓"]},{"t":["Required or audited?","إلزامية أو مراجَعة؟"],"s":["audited ✓","مراجَعة ✓"]},{"t":["Starting point","نقطة البداية"],"s":["statutory SAR 25m, not the package's SAR 24.2m","الرقم النظامي 25 مليون ريال، لا 24.2 مليون في الحزمة"]}]}]},{"t":["Fines, bribes and the €50,000 line","الغرامات والرشاوى وحد 50,000 يورو"],"facts":["In FY2027 a Saudi entity expensed:\n• Municipal and traffic fines: SAR 120,000 in total\n• One competition-authority penalty: SAR 2,000,000\n• A facilitation payment to an official, unlawful under the applicable law: SAR 50,000\nAssume €1 = SAR 4.2 for this case.","في السنة المالية 2027م قيّد كيان في المملكة كمصروف:\n• غرامات بلدية ومرورية: 120,000 ريال إجمالاً\n• عقوبة واحدة من هيئة المنافسة: 2,000,000 ريال\n• دفعة تسهيل لموظف، غير مشروعة وفق النظام المطبق: 50,000 ريال\nافترض أن اليورو = 4.2 ريال لهذه الحالة."],"steps":[{"t":["The €50,000 threshold in riyals:","حد 50,000 يورو بالريال:"],"x":"50000*4.2","v":210000,"u":"SAR"},{"t":["Fines totalling SAR 120,000 are below the threshold: they stay deducted.","الغرامات البالغة 120,000 ريال دون الحد: تبقى مخصومة."]},{"t":["The SAR 2m penalty exceeds it, and the facilitation payment is illegal whatever its size. Add both back:","عقوبة المليوني ريال تتجاوزه، ودفعة التسهيل غير مشروعة أياً كان حجمها. أعد إضافتهما:"],"x":"2000000+50000","v":2050000,"u":"SAR"}],"ans":["Add back SAR 2,050,000 as policy disallowed expenses. The small fines remain deductible. The bribe is added back even though it is far below €50,000: the threshold only applies to fines and penalties.","تُعاد إضافة 2,050,000 ريال كمصاريف غير جائزة الحسم. وتبقى الغرامات الصغيرة قابلة للحسم. وتُعاد إضافة الرشوة رغم أنها أقل بكثير من 50,000 يورو، لأن الحد لا ينطبق إلا على الغرامات والعقوبات."],"r":[27],"p":["Add back SAR 2,050,000: the big penalty and the bribe. The small fines stay deducted.","أعد إضافة 2,050,000 ريال: الغرامة الكبيرة والرشوة. وتبقى الغرامات الصغيرة مخصومة."],"diagrams":[{"type":"table","at":"answer","title":["Against the €50,000 line (SAR 210,000)","مقارنةً بحد 50,000 يورو (210,000 ريال)"],"head":[["Item","البند"],["SAR","ريال"],["Treatment","المعالجة"]],"rows":[[["Municipal and traffic fines","الغرامات البلدية والمرورية"],["120,000","120,000"],["below the line: stays deducted","دون الحد: تبقى مخصومة"]],[["Competition-authority penalty","غرامة هيئة المنافسة"],["2,000,000","2,000,000"],["above the line: add back","فوق الحد: تُعاد إضافتها"]],[["Facilitation payment","دفعة التسهيل"],["50,000","50,000"],["illegal, so no threshold: add back","غير مشروعة فلا حد لها: تُعاد إضافتها"]],[["Total added back","إجمالي ما يُعاد إضافته"],["2,050,000","2,050,000"],["policy disallowed expenses","مصاريف غير جائزة الحسم"]]]}]}],"quiz":[{"q":["What is the starting point for a constituent entity's DMT Income or Loss?","ما نقطة البداية لدخل أو خسارة ضريبة الحد الأدنى المحلي للكيان التابع؟"],"o":[["Its taxable income under the Income Tax Law, adjusted under Articles 19 to 41","دخله الخاضع للضريبة وفق نظام ضريبة الدخل، معدلاً وفق المواد من 19 إلى 41"],["Its accounting net income or loss for the year, adjusted under Articles 19 to 41","صافي دخله أو خسارته المحاسبية للسنة، معدلاً وفق المواد من 19 إلى 41"],["Its Zakat base for the year, after Zakat additions and deductions","وعاؤه الزكوي للسنة، بعد الإضافات والحسومات الزكوية"],["Its share of consolidated group profit, apportioned by revenue","حصته من ربح المجموعة الموحد، موزعاً بحسب الإيرادات"]],"a":1,"e":["Article 18(1). The DMT is accounts-based: taxable income and the Zakat base are not the starting point.","المادة 18 (1). تقوم الضريبة على الحسابات المحاسبية: فلا الدخل الخاضع للضريبة ولا الوعاء الزكوي نقطة البداية."],"r":["18(1)"]},{"q":["When must the Saudi local accounts be used as the starting point?","متى يجب استخدام الحسابات المحلية السعودية نقطةً للبداية؟"],"o":[["When any one Saudi entity has local accounts, for that entity alone, audited or not","عندما تتوفر لكيان واحد في المملكة، لذلك الكيان وحده، مراجَعة أو غير مراجَعة"],["When all Saudi entities keep them on the group's year-end and they are required or audited","عندما تحتفظ بها جميع الكيانات في المملكة على نهاية سنة المجموعة، وتكون إلزامية أو مراجَعة"],["When all Saudi entities have them, whatever their fiscal year, provided they are audited","عندما تتوفر لجميع الكيانات في المملكة، أياً كانت سنتها المالية، شريطة أن تكون مراجَعة"],["When any one Saudi entity keeps them on the group's year-end, for that entity alone","عندما يحتفظ بها كيان واحد في المملكة على نهاية سنة المجموعة، لذلك الكيان وحده"]],"a":1,"e":["Article 18(2). If the conditions are not met, another standard applies under conditions in the Regulations (Art 18(3)).","المادة 18 (2). فإن لم تتحقق الشروط، يُطبق معيار آخر وفق شروط تحددها اللائحة (المادة 18 (3))."],"r":["18(2)","18(3)"]},{"q":["Which of these is NOT on the Article 19(1) adjustment list?","أي مما يلي ليس في قائمة التعديلات بالمادة 19 (1)؟"],"o":[["Depreciation expense on plant and equipment","مصروف استهلاك المصانع والمعدات"],["Net taxes expense, current and deferred","صافي المصاريف الضريبية، الحالية والمؤجلة"],["Policy disallowed expenses, such as bribes","المصاريف غير جائزة الحسم، مثل الرشاوى"],["Accrued pension expense provided through a Pension Fund","مصروف التقاعد المستحق المقدم عبر صندوق تقاعد"]],"a":0,"e":["Depreciation follows the accounts; it is not an Article 19 adjustment. The list also covers dividends, equity gains, revaluation gains, FX, prior period errors, bad debts and anything the Regulations add.","يتبع الاستهلاك الحسابات وليس من تعديلات المادة 19. وتشمل القائمة أيضاً التوزيعات ومكاسب حقوق الملكية وإعادة التقييم والعملات وأخطاء الفترات السابقة والديون المعدومة وما تضيفه اللائحة."],"r":["19(1)"]},{"q":["Why is Net Taxes Expense added back?","لماذا يُعاد إضافة صافي المصاريف الضريبية؟"],"o":[["Because tax expense is not a real cost under IFRS, so it is reversed out","لأن مصروف الضريبة ليس تكلفة حقيقية وفق المعايير الدولية، فيُعكس من الدخل"],["Only deferred tax is added back; current tax stays deducted from income","يُضاف المؤجل فقط؛ أما الضريبة الحالية فتبقى مخصومة من الدخل"],["To align DMT income with taxable income under the Income Tax Law","لمواءمة الدخل لأغراض النظام مع الدخل الخاضع وفق نظام ضريبة الدخل"],["Taxes are measured separately in the ETR, so deducting them would double count","لأن الضرائب تُقاس بشكل منفصل في المعدل الفعلي، فخصمها يؤدي إلى ازدواج الاحتساب"]],"a":3,"e":["Article 20: covered taxes accrued as an expense (current and deferred), deferred tax assets for the year's loss, and DMT accrued as an expense are all reversed out of income.","المادة 20: تُستبعد من الدخل الضرائب المشمولة المستحقة كمصروف (الحالية والمؤجلة)، والأصول الضريبية المؤجلة لخسارة السنة، وضريبة الحد الأدنى المحلي المستحقة كمصروف."],"r":[20]},{"q":["A dividend is received on a 6% stake bought four months ago. How is it treated?","استُلمت توزيعات على حصة 6% اشتُريت قبل أربعة أشهر. كيف تُعامل؟"],"o":[["Excluded: dividends on any ownership interest are excluded","مستبعدة: فالتوزيعات على أي حصة ملكية مستبعدة"],["Included in full: it is a short-term portfolio shareholding","مدرجة بالكامل: فهي حصة ملكية محدودة قصيرة الأجل"],["Excluded, because a stake under 10% is treated as minor","مستبعدة، لأن الحصة دون 10% تُعد غير مؤثرة"],["Included only if the group has made the portfolio dividend election","مدرجة فقط إذا أجرت المجموعة اختيار توزيعات الحصص المحدودة"]],"a":1,"e":["Article 21(1)(a) and (3): a portfolio shareholding (under 10%) held for less than one year at the distribution date is short-term, so its dividends are not excluded.","المادة 21 (1) (أ) و(3): ا المعاملات داخل المجموعة."],"r":["18(2)"]},{"f":["Net Taxes Expense includes","يشمل صافي المصاريف الضريبية"],"b":["Covered taxes expensed (current and deferred), deferred tax assets for the year's loss, and DMT accrued as an expense.","الضرائب المشمولة المقيدة كمصروف (الحالية والمؤجلة)، والأصول الضريبية المؤجلة لخسارة السنة، والضريبة المستحقة بموجب النظام كمصروف."],"r":[20]},{"f":["Excluded Dividends: the two exceptions","توزيعات الأرباح المستبعدة: الاستثناءان"],"b":["Short-term portfolio shareholdings, and investment entities under the Article 88 election.","الحصص المحدودة قصيرة الأجل، والكيانات الاستثمارية الخاضعة لاختيار المادة 88."],"r":["21(1)"]},{"f":["Short-term Portfolio Shareholding","حصة الملكية المحدودة قصيرة الأجل"],"b":["Under 10% and economically held for less than one year at the distribution date.","دون 10% ومحتفظ بها اقتصادياً أقل من سنة في تاريخ التوزيع."],"r":["21(3)",1]},{"f":["Portfolio dividend election","اختيار توزيعات الحصص المحدودة"],"b":["Five-year election to include all dividends on portfolio shareholdings.","اختيار خمس سنوات لإدراج جميع توزيعات الحصص المحدودة."],"r":["21(2)"]},{"f":["Excluded Equity Gain or Loss","مكاسب أو خسائر حقوق الملكية المستبعدة"],"b":["Fair value and disposal gains or losses on non-portfolio interests, and equity-method profit or loss.","مكاسب أو خسائر القيمة العادلة والبيع على الحصص غير المحدودة، والربح أو الخسارة بطريقة حقوق الملكية."],"r":[22]},{"f":["Equity investment inclusion election","اختيار إدراج الاستثمار في حقوق الملكية"],"b":["Five-year; brings in gains, losses and related taxes on non-portfolio interests already taxed locally; locked once a loss is used.","خمس سنوات؛ يُدرج المكاسب والخسائر والضرائب المرتبطة على الحصص غير المحدودة الخاضعة للضريبة محلياً؛ ويصبح ملزماً بعد استخدام خسارة."],"r":[23]},{"f":["Included Revaluation Method Gain or Loss","المكاسب أو الخسائر وفق طريقة إعادة التقييم"],"b":["PP&E revaluation through OCI that is never recycled: included, net of associated covered taxes.","إعادة تقييم العقارات والآلات والمعدات عبر الدخل الشامل الآخر دون إعادة تصنيف: تُدرج صافيةً من الضرائب المشمولة المرتبطة."],"r":[24]},{"f":["Policy Disallowed Expenses","المصاريف غير جائزة الحسم"],"b":["Illegal payments (any amount) and fines or penalties of €50,000 or more in riyal terms.","المدفوعات غير المشروعة (أياً كان مبلغها) والغرامات أو العقوبات التي تبلغ 50,000 يورو أو أكثر بما يوازيها بالريال."],"r":[27]},{"f":["Who decides extra adjustments?","من يحدد التعديلات الإضافية؟"],"b":["The Regulations, under Article 19(1)(k).","اللائحة، بموجب المادة 19 (1) (ك)."],"r":["19(1)"]}],"terms":[{"t":["Financial accounting net income","صافي الدخل المحاسبي"],"d":["The profit or loss in the accounts: the starting point before any DMT adjustment.","الربح أو الخسارة في القوائم المالية: نقطة البداية قبل أي تعديل."]},{"t":["DMT income or loss","دخل أو خسارة ضريبة الحد الأدنى المحلي"],"d":["The adjusted profit that the 15% test measures.","الربح المعدّل الذي يقيسه اختبار 15%."]},{"t":["Covered taxes","الضرائب المشمولة"],"d":["Taxes on income and profits; they count on the tax side of the 15% test.","الضرائب على الدخل والأرباح؛ وتُحتسب في جانب الضرائب من اختبار 15%."]},{"t":["Portfolio shareholding","حصة الملكية المحدودة"],"d":["A small stake, under 10%. Held under a year, its dividends stay in income.","حصة صغيرة دون 10%. وإذا احتُفظ بها أقل من سنة بقيت توزيعاتها ضمن الدخل."]},{"t":["Equity method","طريقة حقوق الملكية"],"d":["Booking your share of an associate's or joint venture's profit as one line.","تسجيل حصتك من ربح الشركة الزميلة أو المشروع المشترك في بند واحد."]},{"t":["Policy disallowed expenses","المصاريف غير جائزة الحسم"],"d":["Bribes and large fines: the law will not let them reduce income.","الرشاوى والغرامات الكبيرة: لا يسمح النظام بأن تخفض الدخل."]}],"range":"18–24, 27"},{"id":6,"title":["DMT Income II: special adjustments and elections","دخل الضريبة (2): التعديلات الخاصة والاختيارات"],"goal":["Handle the special adjustments (FX, prior-period errors, arm's length, tax credits, intragroup financing) and know when each election helps and what it locks in.","معالجة التعديلات الخاصة (العملات، وأخطاء الفترات السابقة، ومبدأ السعر المحايد، والائتمانات الضريبية، والتمويل داخل المجموعة) ومعرفة متى يفيد كل اختيار وما الذي يُلزم به."],"parts":[3],"arts":[25,26,28,29,30,31,32,33,34,35],"time":40,"metaphor":{"title":["Gears on the gearbox","تروس علبة السرعات"],"text":["Module 5 was the engine; this module is the gearbox. Some gears are automatic: arm's length corrections, asymmetric FX, the intragroup financing brake. Others are gears you choose: five-year elections that stay engaged for five years, and annual elections you can change each year.\nChoose a gear for the road ahead, not just the next bend. A five-year election that saves tax this year can cost more in years two to five.","كانت الوحدة الخامسة هي المحرك، وهذه الوحدة هي علبة السرعات. بعض التروس آلية: تصحيحات السعر المحايد، والعملات غير المتماثلة، وكابح التمويل داخل المجموعة. وبعضها تختاره بنفسك: اختيارات خمس سنوات تبقى معشّقة خمس سنوات، واختيارات سنوية يمكن تغييرها كل سنة.\nاختر الترس للطريق كله، لا للمنعطف القريب فقط. فاختيار الخمس سنوات الذي يوفّر ضريبة هذا العام قد يكلّف أكثر في السنوات من الثانية إلى الخامسة."]},"anchors":[{"if":["Two group entities in different countries record a transaction at different amounts or off arm's length","كيانان في المجموعة في دولتين مختلفتين يقيدان معاملة بمبلغين مختلفين أو بغير السعر المحايد"],"then":["Adjust it to the same amount and to arm's length for the DMT (Art 31(1))","عدّلها إلى المبلغ نفسه وإلى السعر المحايد لأغراض النظام (المادة 31 (1))"]},{"if":["The entity gets a tax credit","يحصل الكيان على ائتمان ضريبي"],"then":["Refundable in cash within 4 years, or marketable and transferable? Treat it as income. Otherwise it reduces covered taxes (Arts 32, 46)","هل يُسترد نقداً خلال 4 سنوات، أو هو قابل للتسويق والتحويل؟ عامله كدخل. وإلا فهو يخفض الضرائب المشمولة (المادتان 32 و46)"]},{"if":["Opening equity changes because of an error fix or a policy change","تتغير حقوق الملكية الافتتاحية بسبب تصحيح خطأ أو تغيير سياسة"],"then":["Bring it into this year's DMT income, unless it cuts a covered tax liability by €1m or more (that goes to Art 52) (Art 28)","أدرجه في دخل هذه السنة، ما لم يخفض التزام ضريبة مشمولة بمليون يورو أو أكثر (فيُعالج وفق المادة 52) (المادة 28)"]},{"if":["Saudi land or buildings are sold at a big gain","بيعت أراضٍ أو مبانٍ في المملكة بمكسب كبير"],"then":["Consider the annual aggregate asset gain election to spread the gain over 5 years (Art 34)","فكّر في الاختيار السنوي لمكاسب الأصول المجمعة لتوزيع المكسب على 5 سنوات (المادة 34)"]},{"if":["A low-taxed Saudi entity pays interest to a group lender that is not taxed on it","كيان منخفض الضريبة في المملكة يدفع فوائد لمقرض في المجموعة لا يخضع للضريبة عليها"],"then":["Disallow the expense under the intragroup financing rule (Art 35)","لا تسمح بالمصروف وفق قاعدة الترتيب التمويلي ضمن المجموعة (المادة 35)"]}],"diagrams":[{"type":"table","title":["The gearbox at a glance","علبة السرعات بنظرة سريعة"],"head":[["Gear","الترس"],["What sits there","ما يندرج تحته"]],"rows":[[["Automatic: always on","آلي: يعمل دائماً"],["asymmetric FX · prior-year fixes · arm's length · tax credits · intragroup financing","العملات غير المتماثلة · تصحيحات السنوات السابقة · السعر المحايد · الائتمانات الضريبية · التمويل داخل المجموعة"]],[["Five-year election","اختيار الخمس سنوات"],["portfolio dividends · equity inclusion · FX hedges · stock-based pay · fair value · tax consolidation group","توزيعات الحصص المحدودة · إدراج حقوق الملكية · تحوّط العملات · التعويض بالأسهم · القيمة العادلة · المجموعة الضريبية الموحدة"]],[["Annual election","الاختيار السنوي"],["debt release · aggregate asset gain","الإعفاء من الدين · مكاسب الأصول المجمعة"]]],"pos":"picture"},{"type":"table","title":["The elections in Part 3","الاختيارات في الجزء الثالث"],"head":[["Election","الاختيار"],["Type","النوع"],["What it does","أثره"]],"rows":[[["Portfolio dividends (Art 21(2))","توزيعات الحصص المحدودة (المادة 21 (2))"],["Five-year","خمس سنوات"],["Includes all portfolio dividends","يُدرج جميع توزيعات الحصص المحدودة"]],[["Equity investment inclusion (Art 23)","إدراج الاستثمار في حقوق الملكية (المادة 23)"],["Five-year","خمس سنوات"],["Includes taxed equity gains and their taxes","يُدرج مكاسب حقوق الملكية الخاضعة للضريبة وضرائبها"]],[["FX on hedged ownership interests (Art 26)","العملات على حصص الملكية المحوّطة (المادة 26)"],["Five-year","خمس سنوات"],["Treats the FX as an excluded equity gain or loss","يعامل فروق العملة كمكسب أو خسارة حقوق ملكية مستبعدة"]],[["Debt release (Art 29)","الإعفاء من الديون (المادة 29)"],["Annual","سنوي"],["Excludes the release income and its taxes","يستبعد دخل الإعفاء وضرائبه"]],[["Stock-based compensation (Art 30)","التعويض على أساس الأسهم (المادة 30)"],["Five-year","خمس سنوات"],["Uses the tax-deductible amount instead of the book expense","يستخدم المبلغ القابل للحسم ضريبياً بدلاً من المصروف المحاسبي"]],[["Fair value or impairment (Art 33)","القيمة العادلة أو انخفاض القيمة (المادة 33)"],["Five-year","خمس سنوات"],["Uses the realisation principle","يستخدم مبدأ التحقق"]],[["Aggregate asset gain (Art 34)","مكاسب الأصول المجمعة (المادة 34)"],["Annual","سنوي"],["Spreads Saudi property gains over 5 years","يوزّع مكاسب العقارات في المملكة على 5 سنوات"]],[["Tax consolidation group (Art 36)","المجموعة الضريبية الموحدة (المادة 36)"],["Five-year","خمس سنوات"],["Eliminates transactions within a Saudi tax group","يستبعد المعاملات داخل مجموعة ضريبية في المملكة"]]],"note":["All these elections are made by the filing constituent entity.","يُجري جميع هذه الاختيارات الكيان التابع المعين لتقديم الإقرار."]}],"points":[{"h":["Asymmetric FX","العملات غير المتماثلة"],"t":["Where an entity's accounting and tax functional currencies differ, foreign exchange gains or losses that appear on only one side (or arise from a third currency) are adjusted so the DMT measures them consistently.","حين تختلف العملة الوظيفية المحاسبية عن العملة الوظيفية الضريبية للكيان، تُعدّل مكاسب أو خسائر العملات التي تظهر في جانب واحد فقط (أو تنشأ عن عملة ثالثة) لكي تقيسها الضريبة بشكل متسق."],"r":[25],"p":["Currency gains that show up only in the books, or only for tax, are evened out.","تُوحَّد معالجة مكاسب العملات التي تظهر في الدفاتر وحدها أو للضريبة وحدها."]},{"h":["Hedges of investments","تحوّط الاستثمارات"],"t":["Where the group hedges currency movements on ownership interests, the filing entity may make a five-year election to treat the FX gains or losses in an entity's accounts as excluded equity gains or losses.","حين تحوّط المجموعة تحركات العملة على حصص الملكية، يجوز للكيان المعين إجراء اختيار خمس سنوات لمعاملة مكاسب أو خسائر العملات في حسابات الكيان كمكاسب أو خسائر حقوق ملكية مستبعدة."],"r":[26],"p":["FX on hedges of shareholdings can be treated as excluded share gains, by a five-year election.","يمكن معاملة فروق العملة على تحوّط الحصص كمكاسب أسهم مستبعدة، باختيار خمس سنوات."]},{"h":["Prior period errors and accounting changes","أخطاء الفترات السابقة والتغيرات المحاسبية"],"t":["Changes in opening equity from correcting earlier errors, or from changes in accounting policy, are taken into the current year. An error correction that cuts a covered tax liability materially (the riyal equivalent of €1m or more) is dealt with under Article 52 instead.","تُدرج في السنة الحالية التغيرات في حقوق الملكية الافتتاحية الناتجة عن تصحيح أخطاء سابقة أو تغيير السياسات المحاسبية. أما تصحيح الخطأ الذي يخفض التزام ضريبة مشمولة تخفيضاً جوهرياً (ما يوازي مليون يورو أو أكثر) فيُعالج وفق المادة 52."],"r":[28,52],"p":["Fixes to earlier years go into this year; large tax cuts from fixes go to Article 52.","تُدرج تصحيحات السنوات السابقة في هذه السنة؛ وتُعالج التخفيضات الضريبية الكبيرة منها وفق المادة 52."]},{"h":["Debt releases","الإعفاء من الديون"],"t":["By an annual election, income from a bad debt release can be excluded from the borrower's DMT income, together with the related current and deferred tax, if the Regulations' conditions are met.","يجوز باختيار سنوي استبعاد دخل الإعفاء من الدين المعدوم من دخل الكيان المقترض، مع الضريبة الحالية والمؤجلة المرتبطة، إذا تحققت شروط اللائحة."],"r":[29],"p":["Income from a forgiven bad debt can be left out, by an annual election.","يجوز استبعاد دخل الإعفاء من الدين المعدوم، باختيار سنوي."]},{"h":["Stock-based compensation","التعويض على أساس الأسهم"],"t":["A five-year election substitutes the amount deductible for tax for the book expense, applied to all Saudi entities. If an option expires unexercised, the amount previously deducted comes back into income that year.","يستبدل اختيار خمس سنوات المصروف المحاسبي بالمبلغ القابل للحسم ضريبياً، ويُطبق على جميع الكيانات في المملكة. وإذا انقضى خيار دون ممارسة، يُعاد المبلغ المحسوم سابقاً إلى الدخل في تلك السنة."],"r":[30],"p":["Share-based pay can follow the tax deduction instead of the book cost, by a five-year election.","يجوز أن يتبع التعويض بالأسهم الحسم الضريبي بدلاً من المصروف الدفتري، باختيار خمس سنوات."]},{"h":["Arm's length","مبدأ السعر المحايد"],"t":["Cross-border transactions between constituent entities must be recorded at the same amount on both sides and at arm's length. A loss on transferring an asset between two entities in the same jurisdiction is recomputed at arm's length if it enters DMT income.","يجب قيد المعاملات العابرة للحدود بين الكيانات التابعة بالمبلغ نفسه في الطرفين وبالسعر المحايد. وتُعاد احتساب الخسارة الناتجة عن نقل أصل بين كيانين في الولاية نفسها بالسعر المحايد إذا دخلت في الدخل."],"r":[31],"p":["Deals between group companies use arm's-length prices, the same amount on both sides.","تُقيد المعاملات بين شركات المجموعة بالسعر المحايد، وبالمبلغ نفسه في الطرفين."]},{"h":["Tax credits","الائتمانات الضريبية"],"t":["Qualified refundable tax credits (payable in cash or cash equivalents within four years) and marketable transferable tax credits are income. Any other credit is not income; it reduces covered taxes instead, which pushes the ETR down much harder.","الائتمانات الضريبية القابلة للاسترداد المؤهلة (المستحقة نقداً أو بما يعادله خلال أربع سنوات) والائتمانات القابلة للتسويق والتحويل تُعامل كدخل. وأي ائتمان آخر لا يُعد دخلاً، بل يخفض الضرائب المشمولة، فيُنزل معدل الضريبة الفعلي بشدة أكبر."],"r":[32,"46(1)"],"p":["Cash-refundable credits count as income; other credits cut taxes, which hurts the rate far more.","الائتمانات القابلة للاسترداد نقداً تُحتسب دخلاً؛ وغيرها يخفض الضرائب، وهو أشد أثراً على المعدل."]},{"h":["Fair value and impairment","القيمة العادلة وانخفاض القيمة"],"t":["A five-year election lets the group use the realisation principle for assets and liabilities held at fair value or tested for impairment. It covers all Saudi entities unless the filing entity specifies otherwise.","يسمح اختيار خمس سنوات للمجموعة باستخدام مبدأ التحقق للأصول والالتزامات المقيسة بالقيمة العادلة أو الخاضعة لاختبار انخفاض القيمة. ويشمل جميع الكيانات في المملكة ما لم يحدد الكيان المعين غير ذلك."],"r":[33],"p":["Fair value swings can be counted only on sale, by a five-year election.","يجوز احتساب تقلبات القيمة العادلة عند البيع فقط، باختيار خمس سنوات."]},{"h":["Aggregate asset gains","مكاسب الأصول المجمعة"],"t":["When Saudi entities make a net gain on disposing of immovable property in the Kingdom (ignoring intra-group transfers), an annual election re-runs the look-back period (the election year and the four prior years): the gain first absorbs net asset losses of earlier loss years, and the rest is spread over the period. Earlier years are then recalculated under Article 63.","حين تحقق الكيانات في المملكة صافي مكسب من التصرف في ممتلكات غير منقولة في المملكة (دون التحويلات داخل المجموعة)، يعيد اختيار سنوي احتساب فترة المراجعة (سنة الاختيار والسنوات الأربع السابقة): يُقابَل المكسب أولاً بصافي خسائر الأصول في سنوات الخسارة السابقة، ويُوزَّع الباقي على الفترة. ثم يُعاد احتساب السنوات السابقة وفق المادة 63."],"r":[34,63],"p":["A Saudi property gain can be spread over this year and the four before, by an annual election.","يجوز توزيع مكسب العقارات في المملكة على هذه السنة والسنوات الأربع السابقة، باختيار سنوي."]},{"h":["Intragroup financing","التمويل داخل المجموعة"],"t":["A low-tax entity cannot deduct expenses on a financing arrangement with a high-tax group counterparty if the arrangement is expected to raise the low-tax entity's expenses without a matching rise in the counterparty's taxable income.","لا يجوز للكيان منخفض الضريبة حسم مصاريف ترتيب تمويلي مع طرف مقابل مرتفع الضريبة في المجموعة إذا كان متوقعاً أن يزيد الترتيب مصاريف الكيان منخفض الضريبة دون زيادة مماثلة في الدخل الخاضع للضريبة لدى الطرف المقابل."],"r":[35],"p":["A low-taxed entity cannot deduct group interest that the lender is not taxed on.","لا يجوز للكيان منخفض الضريبة حسم فوائد مجموعة لا يخضع المقرض للضريبة عليها."]}],"oecd":[{"t":["Stock-based compensation, arm's length, qualified refundable credits, the fair value election, aggregate asset gains and intragroup financing follow GloBE Articles 3.2.2 to 3.2.7. Treating marketable transferable tax credits as income comes from the OECD's July 2023 Administrative Guidance.","تتبع أحكامُ التعويض على أساس الأسهم والسعر المحايد والائتمانات القابلة للاسترداد المؤهلة واختيار القيمة العادلة ومكاسب الأصول المجمعة والتمويل داخل المجموعة الموادَّ من 3.2.2 إلى 3.2.7 من القواعد النموذجية. أما معاملة الائتمانات القابلة للتسويق والتحويل كدخل فمصدرها الإرشادات الإدارية للمنظمة الصادرة في يوليو 2023م."],"src":["Model Rules Arts 3.2.2–3.2.7; OECD Administrative Guidance, July 2023","القواعد النموذجية: المواد 3.2.2–3.2.7؛ الإرشادات الإدارية للمنظمة، يوليو 2023م"]}],"cases":[{"t":["Two credits, two very different ETRs","ائتمانان ومعدلان فعليان مختلفان جداً"],"facts":["A Saudi entity has DMT Income of SAR 100m and adjusted covered taxes of SAR 12m before any credit. It earns a SAR 5m investment tax credit. Compare two designs:\n(A) the credit is refundable in cash within three years (a qualified refundable tax credit);\n(B) the credit can only reduce tax payable and is not refundable or transferable.","لكيان في المملكة دخل قدره 100 مليون ريال وضرائب مشمولة معدلة قدرها 12 مليون ريال قبل أي ائتمان. ويحصل على ائتمان ضريبي استثماري قدره 5 ملايين ريال. قارن بين تصميمين:\n(أ) الائتمان قابل للاسترداد نقداً خلال ثلاث سنوات (ائتمان ضريبي قابل للاسترداد مؤهل)؛\n(ب) الائتمان لا يُستخدم إلا لتخفيض الضريبة المستحقة ولا يُسترد ولا يُحوَّل."],"steps":[{"t":["Design A: the credit is income, so DMT Income becomes:","التصميم (أ): الائتمان دخل، فيصبح الدخل:"],"x":"100000000+5000000","v":105000000,"u":"SAR"},{"t":["Design A ETR: taxes unchanged ÷ the larger income.","معدل التصميم (أ): الضرائب دون تغيير ÷ الدخل الأكبر."],"x":"12000000/105000000*100","v":11.43,"u":"%"},{"t":["Design B: the credit reduces covered taxes instead.","التصميم (ب): الائتمان يخفض الضرائب المشمولة بدلاً من ذلك."],"x":"12000000-5000000","v":7000000,"u":"SAR"},{"t":["Design B ETR:","معدل التصميم (ب):"],"x":"7000000/100000000*100","v":7,"u":"%"}],"ans":["The same SAR 5m credit leaves the ETR at 11.43% if it is a qualified refundable credit, but drops it to 7% if it is not. That is why incentive design matters so much under a minimum tax: refundable or transferable credits hold up the ETR.","يُبقي الائتمان نفسه البالغ 5 ملايين ريال المعدلَ الفعلي عند 11.43% إذا كان ائتماناً قابلاً للاسترداد مؤهلاً، لكنه يُنزله إلى 7% إذا لم يكن كذلك. ولهذا يهم تصميم الحوافز كثيراً في ظل ضريبة الحد الأدنى: فالائتمانات القابلة للاسترداد أو التحويل تحافظ على المعدل الفعلي."],"r":[32,"46(1)"],"p":["The same SAR 5m credit: 11.43% if refundable in cash, only 7% if not.","الائتمان نفسه البالغ 5 ملايين ريال: 11.43% إذا كان قابلاً للاسترداد نقداً، و7% فقط إذا لم يكن."],"diagrams":[{"type":"columns","at":"answer","title":["ETR under each design","المعدل الفعلي في كل تصميم"],"cap":["ETR, %","المعدل الفعلي، %"],"items":[{"l":["A: refundable","(أ): قابل للاسترداد"],"v":11.43},{"l":["B: not refundable","(ب): غير قابل للاسترداد"],"v":7}],"line":{"v":15,"l":["15% minimum","الحد الأدنى 15%"]},"verdict":["Both fall short of 15%, but design B more than doubles the gap: 8% against 3.57%.","كلاهما دون 15%، لكن التصميم (ب) يضاعف الفجوة بأكثر من مرتين: 8% مقابل 3.57%."],"vt":"out"}]},{"t":["Spreading a property gain","توزيع مكسب عقاري"],"facts":["In FY2031 the group's Saudi entities sell buildings in the Kingdom to third parties for a net gain of SAR 50m. In FY2029 they had a net loss of SAR 10m on property disposals (a loss year). The filing entity makes the aggregate asset gain election for FY2031. Assume the remaining gain is spread evenly, as the Model Rules do; the draft leaves the details to the Regulations.","في السنة المالية 2031م باعت كيانات المجموعة في المملكة مباني داخل المملكة لأطراف ثالثة بصافي مكسب قدره 50 مليون ريال. وفي السنة المالية 2029م كان لديها صافي خسارة قدرها 10 ملايين ريال من التصرف في عقارات (سنة خسارة). ويُجري الكيان المعين اختيار مكاسب الأصول المجمعة للسنة المالية 2031م. افترض أن المكسب المتبقي يُوزَّع بالتساوي كما في القواعد النموذجية، إذ يترك المشروع التفاصيل للائحة."],"steps":[{"t":["Look-back period: the election year and the four prior years, FY2027 to FY2031.","فترة المراجعة: سنة الاختيار والسنوات الأربع السابقة، من 2027م إلى 2031م."],"x":"2031-4","v":2027,"u":"yr"},{"t":["First set the gain against FY2029's net asset loss. Adjusted asset gain left:","قابل المكسب أولاً بصافي خسارة الأصول في 2029م. مكسب الأصول المعدل المتبقي:"],"x":"50000000-10000000","v":40000000,"u":"SAR"},{"t":["Spread the rest over the five years of the look-back period:","وزّع الباقي على السنوات الخمس لفترة المراجعة:"],"x":"40000000/5","v":8000000,"u":"SAR"}],"ans":["FY2031 keeps only SAR 8m of the gain; SAR 8m goes to each earlier year and FY2029's loss is wiped out. ETRs and top-up for FY2027–FY2030 are recalculated, and any extra tax is collected as additional current top-up tax under Article 63. The election helps when the earlier years had spare covered taxes.","لا يبقى في 2031م إلا 8 ملايين ريال من المكسب؛ ويُخصص لكل سنة سابقة 8 ملايين ريال وتُمحى خسارة 2029م. ويُعاد احتساب المعدلات الفعلية والضريبة التكميلية للسنوات من 2027م إلى 2030م، وتُحصَّل أي ضريبة إضافية كضريبة تكميلية حالية إضافية وفق المادة 63. ويفيد الاختيار حين يكون في السنوات السابقة ضرائب مشمولة فائضة."],"r":[34,63],"p":["FY2029's SAR 10m loss is wiped out first; each look-back year then takes SAR 8m.","تُمحى خسارة 2029م البالغة 10 ملايين ريال أولاً؛ ثم تأخذ كل سنة من فترة المراجعة 8 ملايين."],"diagrams":[{"type":"waterfall","at":"answer","title":["What is left to spread","ما يتبقى للتوزيع"],"cap":["SAR million","بملايين الريالات"],"rows":[{"l":["Net gain, FY2031","صافي المكسب، 2031م"],"v":50,"k":"add"},{"l":["FY2029 net asset loss","صافي خسارة الأصول، 2029م"],"v":10,"k":"sub"},{"l":["Gain left to spread","المكسب المتبقي للتوزيع"],"v":40,"k":"sum"}]},{"type":"columns","at":"answer","title":["The spread over the look-back period","التوزيع على فترة المراجعة"],"cap":["SAR million of gain per year","ملايين الريالات من المكسب لكل سنة"],"items":[{"l":["2027","2027م"],"v":8},{"l":["2028","2028م"],"v":8},{"l":["2029","2029م"],"v":8},{"l":["2030","2030م"],"v":8},{"l":["2031","2031م"],"v":8}],"note":["FY2029 also absorbs SAR 10m first, which turns its loss to nil. Earlier years are then recalculated under Article 63.","وتستوعب 2029م أيضاً 10 ملايين ريال أولاً، فتصبح خسارتها صفراً. ثم يُعاد احتساب السنوات السابقة وفق المادة 63."]}]},{"t":["The loan that the lender does not pay tax on","القرض الذي لا يدفع المقرض ضريبة عليه"],"facts":["Gulf Assembly (Saudi) has DMT Income of SAR 30m and adjusted covered taxes of SAR 2.7m, so the Kingdom ETR is 9%. It pays SAR 6m interest to a group finance company in Country H, which has a 25% tax rate but treats the instrument as equity and exempts the return. The arrangement was expected to work this way from the start.","لشركة الخليج للتجميع (في المملكة) دخل قدره 30 مليون ريال وضرائب مشمولة معدلة قدرها 2.7 مليون ريال، فمعدل المملكة الفعلي 9%. وتدفع 6 ملايين ريال فوائد لشركة تمويل في المجموعة في الدولة (هـ)، التي يبلغ سعر ضريبتها 25% لكنها تعامل الأداة كحقوق ملكية وتعفي العائد. وكان متوقعاً منذ البداية أن يعمل الترتيب بهذه الطريقة."],"steps":[{"t":["Gulf Assembly is a low-tax entity (Kingdom ETR below 15%); the lender is a high-tax counterparty. Its taxable income does not rise with the interest.","شركة الخليج للتجميع كيان منخفض الضريبة (معدل المملكة دون 15%)، والمقرض طرف مقابل مرتفع الضريبة لا يزيد دخله الخاضع للضريبة بالفوائد."]},{"t":["Exclude the SAR 6m interest expense, so DMT Income becomes:","استبعد مصروف الفوائد البالغ 6 ملايين ريال، فيصبح الدخل:"],"x":"30000000+6000000","v":36000000,"u":"SAR"},{"t":["New ETR, with covered taxes unchanged:","المعدل الفعلي الجديد مع بقاء الضرائب المشمولة:"],"x":"2700000/36000000*100","v":7.5,"u":"%"},{"t":["Top-up percentage rises from 6% to:","ترتفع نسبة الضريبة التكميلية من 6% إلى:"],"x":"15-7.5","v":7.5,"u":"%"}],"ans":["The interest is disallowed for the DMT: income rises to SAR 36m and the top-up percentage from 6% to 7.5%. The rule stops a group from shifting deductions into a low-taxed Saudi entity through an instrument that creates no matching taxable income elsewhere.","لا يُسمح بالفوائد لأغراض النظام: يرتفع الدخل إلى 36 مليون ريال وترتفع نسبة الضريبة التكميلية من 6% إلى 7.5%. وتمنع القاعدة المجموعة من نقل الحسومات إلى كيان منخفض الضريبة في المملكة عبر أداة لا تُنشئ دخلاً خاضعاً للضريبة مقابلاً في مكان آخر."],"r":[35,53,54],"p":["The SAR 6m interest is disallowed: income rises to SAR 36m and the top-up rate to 7.5%.","لا يُسمح بفوائد 6 ملايين ريال: يرتفع الدخل إلى 36 مليوناً ونسبة الضريبة التكميلية إلى 7.5%."],"diagrams":[{"type":"flow","at":"facts","title":["The interest that nobody taxes","فوائد لا يخضعها أحد للضريبة"],"nodes":[{"t":["Gulf Assembly (Saudi)","الخليج للتجميع (المملكة)"],"s":["deducts SAR 6m of interest; Kingdom ETR 9%","تحسم فوائد 6 ملايين ريال؛ معدل المملكة 9%"]},{"t":["Group finance company (Country H)","شركة التمويل في المجموعة (الدولة هـ)"],"s":["25% rate, but treats it as equity and exempts the return","سعر 25%، لكنها تعاملها كحقوق ملكية وتعفي العائد"]}]},{"type":"gauge","at":"answer","v":7.5,"target":15,"max":20,"title":["The Kingdom's rate aft more in a covered tax liability is material and goes through Article 52.","المادة 28 (1) (أ) و(2): التخفيض بمليون يورو أو أكثر في التزام ضريبة مشمولة جوهري ويُعالج وفق المادة 52."],"r":[28,52]},{"q":["What kind of election is the debt release election?","ما نوع اختيار الإعفاء من الديون؟"],"o":[["A five-year election, subject to conditions in the Regulations","اختيار خمس سنوات يخضع لشروط اللائحة"],["An annual election, subject to conditions in the Regulations","اختيار سنوي يخضع لشروط اللائحة"],["A five-year election, open to banks and insurers","اختيار خمس سنوات متاح للبنوك وشركات التأمين"],["An annual election open to banks and insurers only","اختيار سنوي متاح للبنوك وشركات التأمين فقط"]],"a":1,"e":["Article 29(1). It excludes the release income and the related current and deferred tax from the borrower's computation.","المادة 29 (1). يستبعد دخل الإعفاء والضريبة الحالية والمؤجلة المرتبطة من احتساب المقترض."],"r":[29]},{"q":["Under the stock-based compensation election, what happens when an option expires unexercised?","في اختيار التعويض على أساس الأسهم، ماذا يحدث إذا انقضى خيار دون ممارسة؟"],"o":[["The amount previously deducted is included in income in the year it expires","يُدرج المبلغ المحسوم سابقاً في الدخل في سنة انقضاء الخيار"],["Nothing: amounts already deducted in earlier years stay deducted","لا شيء: فالمبالغ المحسومة في السنوات السابقة تبقى محسومة"],["Earlier years are reopened and recalculated without the deduction","يُعاد فتح السنوات السابقة وإعادة احتسابها دون الحسم"],["The election is revoked, and the book expense applies from that year","يُلغى الاختيار، ويُطبق المصروف الدفتري من تلك السنة"]],"a":0,"e":["Article 30(2). The election is a five-year election applied consistently to all Saudi entities (Art 30(3)).","المادة 30 (2). والاختيار اختيار خمس سنوات يُطبق باتساق على جميع الكيانات في المملكة (المادة 30 (3))."],"r":[30]},{"q":["A Saudi entity sells goods to a group distributor abroad below arm's length, and the two record different amounts. What does Article 31 require?","يبيع كيان في المملكة بضائع لموزّع في المجموعة بالخارج بأقل من السعر المحايد، ويقيد الطرفان مبلغين مختلفين. ماذا تتطلب المادة 31؟"],"o":[["Adjust the Saudi side; the foreign side keeps its own figure","تعديل الجانب السعودي؛ ويحتفظ الطرف الأجنبي بالمبلغ الذي قيده"],["Nothing: each entity's own accounts govern its DMT income","لا شيء: فحسابات كل كيان هي التي تحكم دخله لأغراض النظام"],["Adjust both to the same amount, consistent with arm's length","تعديل الطرفين إلى المبلغ نفسه وبما يتفق مع السعر المحايد"],["Disallow the sale and remove both entries from DMT income","رفض عملية البيع وحذف القيدين كليهما من الدخل"]],"a":2,"e":["Article 31(1) and (3): a cross-border transaction between group entities must be recorded at the same amount on both sides, consistent with arm's length.","المادة 31 (1) و(3): يجب قيد المعاملة العابرة للحدود بين كيانات المجموعة بالمبلغ نفسه في الطرفين، وبما يتفق مع السعر المحايد."],"r":[31]},{"q":["Two Saudi group entities transfer an asset at a non-arm's length price, producing a loss. What happens?","ينقل كيانان في المجموعة في المملكة أصلاً بسعر غير محايد، فتنشأ خسارة. ماذا يحدث؟"],"o":[["If the loss enters DMT income, it is recomputed at arm's length","إذا دخلت الخسارة في الدخل، يُعاد احتسابها بالسعر المحايد"],["Nothing: the rule applies only to cross-border transactions","لا شيء: فالقاعدة تنطبق على المعاملات العابرة للحدود فقط"],["The loss is disallowed, as the price was not at arm's length","تُرفض الخسارة، لأن السعر لم يكن محايداً"],["Gains are recomputed, but the loss is left as booked","يُعاد احتساب المكاسب، لكن تبقى الخسارة كما قُيدت"]],"a":0,"e":["Article 31(2) applies to losses on transfers between entities in the same jurisdiction.","تنطبق المادة 31 (2) على الخسائر الناتجة عن النقل بين كيانات في الولاية نفسها."],"r":["31(2)"]},{"q":["When is a refundable tax credit 'qualified'?","متى يكون الائتمان الضريبي القابل للاسترداد 'مؤهلاً'؟"],"o":[["When it must be paid in cash within five years of meeting the conditions","
