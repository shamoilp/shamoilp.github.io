n where it is located.\nExcess Negative Tax Expense Carryforward: Excess Negative Tax Expense carried forward to the next Fiscal Year as per the provisions of ARTICLE 44 of this Law.\nIncome Tax Law: The income tax law applicable in the Kingdom.","text_ar":"يقصد بالكلمات والعبارات الآتية أينما وردت في هذا النظام المعاني الموضحة أمام كل منها ما لم يقتض السياق معنى آخر: النظام: نظام ضريبة الحد الأدنى المحلي.\nاللائحة: اللائحة التنفيذية لهذا النظام.\nالمملكة: إقليم المملكة العربية السعودية، ويشمل ذلك أراضيها ومياهها الإقليمية والفضاء الجوي الذي يعلوهما والمناطق الواقعة خارج المياه الإقليمية التي تمارس المملكة على مياهها وقاع بحارها وطبقات تربتها ومواردها الطبيعية سيادتها، بمقتضى أنظمتها، وأحكام القانون الدولي.\nالهيئة: هيئة الزكاة والضريبة والجمارك.\nالمجلس: مجلس إدارة الهيئة.\nالمحافظ: محافظ الهيئة.\nالاتفاقية الضريبية: اتفاقية لتجنب الازدواج الضريبي فيما يتعلق بالضرائب المفروضة على الدخل ورأس المال.\nاتفاقية سلطة مختصة مؤهلة: اتفاقية أو ترتيب ثنائي أو متعدد الأطراف بين السلطات المختصة ينص على التبادل التلقائي لإقرارات معلومات قواعد مكافحة تآكل الوعاء الضريبي العالمي السنوية.\nالاختيار السنوي: الاختيار الذي يقوم به الكيان التابع المعين لتقديم الإقرار والذي ينطبق فقط على السنة المالية التي يتم إجراء الاختيار بشأنها.\nاختيار الخمس سنوات: الاختيار الذي يجريه الكيان التابع المعين لتقديم الإقرار فيما يتعلق بسنة مالية -السنة التي تم فيها الاختيار - والذي لا يمكن إلغاؤه خلال تلك السنة أو السنوات المالية الأربع اللاحقة. في حال إلغاء اختيار الخمس سنوات بالنسبة لسنة مالية (سنة الإلغاء)، فلا يمكن إجراء اختيار جديد خلال السنوات المالية الأربع التي تلي سنة الإلغاء، ما لم ينص النظام أو اللائحة على قواعد أخرى خاصة للإلغاء.\nالأداة الاستثمارية العقارية: كيان ذو ملكية واسعة النطاق ويمتلك في الغالب ممتلكات غير منقولة، ويخضع لنظام ضريبي مصمم لتحقيق الغرضين الآتيين معاً:\n(أ) إخضاع دخل الكيان أو مكاسبه أو أرباحه لمستوى واحد من الضريبة ، سواء على مستوى الكيان أو على مستوى أصحاب الحصص فيه.\n(ب) السماح بتأجيل الضريبة لمدة لا تتجاوز سنة واحدة من نهاية الفترة المحاسبية التي ينشأ فيها الدخل أو الأرباح أو المكاسب.\nالجهة المحاسبية المعتمدة: الجهة التي تتمتع بسلطة قانونية في ولاية قضائية لتحديد أو إنشاء أو قبول المعايير المحاسبية لأغراض إعداد التقارير المالية.\nالحد الأدنى: خمسة عشر بالمائة (15%).\nالدخل الشامل الآخر: بنود الدخل والمصاريف التي لم يتم الاعتراف بها في بند الربح أو الخسارة كما هو مطلوب أو مسموح به بموجب المعايير المحاسبية المالية المعتمدة المستخدمة في القوائم المالية الموحدة. يتم عادةً إدراج الدخل الشامل الآخر كتعديل لحقوق الملكية في قائمة المركز المالي (ا لميزانية العمومية).\nالسنة الانتقالية: السنة المالية الأولى التي تدخل فيها المجموعة المتعددة الجنسيات ضمن نطاق النظام.\nالسنة المالية: كما تم تعريفها في المادة (الثالثة والتسعين) من هذا النظام. السنة المالية لتقديم الإقرار السنة المالية التي يقدم عنها إقرار الضريبة التكميلية المحلية أو إقرار معلومات قواعد مكافحة تآكل الوعاء الضريبي العالمي.\nالشركة التابعة لمشروع مشترك: كيان يتم توحيد أصوله، والتزاماته، ودخله، ومصاريفه، وتدفقاته النقدية من قبل مشروع مشترك بموجب معايير محاسبية مالية مقبولة، أو الذي كان من الممكن أن يكون ذلك مطلوباً لو كان ينبغي توحيد هذه البنود وفقاً لمعايير محاسبية مالية مقبولة. يجب التعامل مع المنشأة الدائمة التي يكون كيانها الرئيسي هو المشروع المشترك أو الشركة التابعة لمشروع مشترك، على أنها شركة تابعة لمشروع مشترك منفصلة.\nالضريبة التكميلية المحلية الأدنى المؤهلة: ضريبة حد أدنى مدرجة في النظام المحلي لولاية قضائية و تتوافر فيها جميع الشروط الآتية:\n(أ) تحدد الأرباح الزائدة للكيانات التابعة الواقعة في الولاية القضائية (الأرباح الزائدة المحلية) بطريقة تعادل قواعد مكافحة تآكل الوعاء الضريبي العالمي.\n(ب) تعمل على زيادة الالتزام الضريبي المحلي فيما يتعلق بالأرباح الزائدة المحلية إلى الحد الأدنى للولاية القضائية والكيانات التابعة خلال سنة مالية.\n(ج) تُنفذ وتُدار بما يتماشى مع النتائج المقدمة بموجب قواعد مكافحة تآكل الوعاء الضريبي العالمي والتعليقات، شرط ألا توفر تلك الولاية القضائية أي مزايا تتعلق بهذه القواعد.\nالضريبة التكميلية المحلية: الضريبة المفروضة بموجب أحكام هذا النظام.\nالكيان التابع المالك: الكيان التابع الذي يملك بشكل مباشر أو غير مباشر حصة ملكية في كيان تابع آخر في نفس المجموعة المتعددة الجنسيات.\nالكيان التابع المعين لتقديم الإقرار: كيان يقدم إقرار الضريبة التكميلية المحلية أو إقرار معلومات قواعد مكافحة تآكل الوعاء الضريبي العالمي بموجب المادة (الرابعة والتسعين) من هذا النظام.\nالكيان الرئيسي: فيما يتعلق بالمنشأة الدائمة، هو الكيان الذي يدرج صافي الدخل المحاسبي أو الخسارة المحاسبية للمنشأة الدائمة في قوائمه المالية.\nالكيان الشفاف مالياً: يُعد الكيان كياناً شفافاً مالياً إلى الحد الذي يعامل فيه شفافا ماليا بالنسبة لدخله ، أو نفقاته ، أو أرباحه ، أو خسائره في الولاية القضائية التي أنشئ فيها ، ما لم يكن مقيما ضريبيا وخاضعا لضريبة مشمولة على دخله أو أرباحه في ولاية قضائية أخرى. ويقصد بالمعاملة الشفافة مالياً أن الولاية القضائية تعامل دخل أو نفقات أو أرباح أو خسائر كيان على أن ذلك الدخل أو تلك النفقات أو الأرباح أو الخسائر مكتسبة أو متكبدة من المالك المباشر لذلك الكيان بما يتناسب مع حصته فيه.\nالكيان الشفاف ضريبياً: يعتبر الكيان الشفاف مالياً كياناً شفافاً ضريبياً بالنسبة لدخله، أو نفقاته، أو أرباحه، أو خسائره إلى الحد الذي تتعامل فيه الولاية القضائية للكيان المرجعي مع الكيان المختبر، ومع كل كيان يمتلك من خلاله الكيان المرجعي حصة ملكية في الكيان المختبر، باعتباره شفافاً مالياً.\nالكيان المرجعي: الكيان التابع المالك الأقرب في سلسلة الملكية إلى الكيان المختبر والذي إما\n(أ) لا يُعد كياناً شفافا ماليا، أو\n(ب) في حال عدم وجود كيان تابع مالك، يكون كيان شفاف ماليا هو الكيان الأم النهائي للمجموعة المتعددة الجنسيات (كيان أم نهائي شفاف ماليا).\nالكيان في المجموعة: فيما يتعلق بأي كيان أو مجموعة، هو كيان يكون عضواً في نفس المجموعة.\nالكيان: أي شخص اعتباري، أو ترتيب يقوم بإعداد حسابات مالية منفصلة، مثل الشراكة أو العهدة. لا يشمل مصطلح الكيان الحكومة المركزية، أو حكومة الولاية، أو الحكومة المحلية، أو إداراتها، أو هيئاتها التي تمارس مهام حكومية.\nالمعايير المحاسبية المالية المعتمدة: مجموعة من المبادئ المحاسبية المقبولة عموماً والتي تسمح بها الجهة المحاسبية المعتمدة في الولاية القضائية التي يقع فيها الكيان.\nالمعايير المحاسبية المالية المقبولة: المعايير الدولية للتقارير المالية والمبادئ المحاسبية المقبولة عموماً في أستراليا، والبرازيل، وكندا، والدول الأعضاء في الاتحاد الأوروبي، والدول الأعضاء في المنطقة الاقتصادية الأوروبية، وهونغ كونغ (الصين)، واليابان، والمكسيك، ونيوزيلندا، وجمهورية الصين الشعبية، وجمهورية الهند، وجمهورية كوريا، وروسيا، وسنغافورة، وسويسرا، والمملكة المتحدة والولايات المتحدة الأمريكية.\nالمكلف: أي كيان تابع - بما في ذلك الكيان التابع عديم الجنسية المنشأ في المملكة أو أي كيان يعد كياناً تابعاً بموجب أحكام النظام - أو المشروع المشترك والشركات التابعة له، متى ما سرت عليها أحكام النظام.\nالولاية القضائية للكيان الأم النهائي: الولاية القضائية التي يقع فيها الكيان الأم النهائي.\nحصة الملكية المحدودة: حصص ملكية تملكها المجموعة المتعددة الجنسيات في كيان وتمنح حقوقاً في أقل من عشرة بالمائة (%10) من أرباح الكيان، أو رأس ماله، أو احتياطياته، أو حقوق التصويت في ذلك الكيان في تاريخ التوزيع أو التصرف.\nحصة الملكية: أي مشاركة في حقوق ملكية تمنح حقوقاً في أرباح الكيان أو رأس ماله أو احتياطياته، بما في ذلك الأرباح أو رأس المال أو الاحتياطيات الخاصة بالمنشأة (أو المنشآت) الدائمة التابعة للكيان الرئيسي.\nخسائر ضريبة الحد الأدنى المحلي لجميع الكيانات التابعة: إجمالي خسائر ضريبة الحد الأدنى المحلي لجميع الكيانات التابعة المعنية الواقعة في المملكة والمحدد للسنة المالية بموجب أحكام الجزء الثالث من هذا النظام.\nدخل ضريبة الحد الأدنى المحلي لجميع الكيانات التابعة: إجمالي دخل ضريبة الحد الأدنى المحلي لجميع الكيانات التابعة المعنية الواقعة في المملكة والمحدد للسنة المالية بموجب أحكام الجزء الثالث من هذا النظام.\nصافي خسائر ضريبة الحد الأدنى المحلي: المبلغ الصفري أو السلبي، إن وجد، الذي يحتسب من خلال خصم خسائر ضريبة الحد الأدنى المحلي لجميع الكيانات التابعة من دخل ضريبة الحد الأدنى المحلي لجميع الكيانات التابعة.\nضريبة الإسناد المؤهلة: الضريبة المشمولة المستحقة أو المسددة من قبل كيان تابع والتي تكون قابلة للاسترداد أو الائتمان للمالك المستفيد من توزيعات الأرباح الموزعة من قبل ذلك الكيان التابع (أو، في حال كانت الضريبة المشمولة مستحقة أو مسددة من قبل منشأة دائمة، توزيعات الأرباح الموزعة من قبل الكيان الرئيسي) شريطة أن يتوجب سداد الاسترداد، أو يتم تقديم الائتمان في أي من الحالات الآتية:\n(أ) من قبل ولاية قضائية غير الولاية القضائية التي فرضت الضرائب المشمولة بموجب نظام ائتمان ضريبي أجنبي.\n(ب) إلى مالك مستفيد من توزيعات الأرباح يخضع للضريبة بمعدل اسمي يساوي أو يتجاوز الحد الأدنى المفروض على توزيعات الأرباح على أساس جاري بموجب النظام المحلي للولاية القضائية التي فرضت الضرائب المشمولة على الكيان التابع.\n(ج) إلى مالك مستفيد فرد (شخص طبيعي) من توزيعات الأرباح يكون مقيماً ضريبياً في الولاية القضائية التي فرضت الضرائب المشمولة على الكيان التابع ويخضع للضريبة على توزيعات الأرباح كدخل عادي.\n(د) إلى كيان حكومي، أو منظمة دولية، أو منظمة غير ربحية مقيمة، أو صندوق تقاعد مقيم، أو كيان استثماري مقيم ليس كياناً في مجموعة، أو شركة تأمين على الحياة مقيمة شريطة أن يتم استلام توزيعات الأرباح فيما يخص أعمال صندوق التقاعد وتخضع التوزيعات للضريبة بطريقة مماثلة لتوزيعات الأرباح التي يستلمها صندوق التقاعد. ولأغراض الفقرة\n(د) أعلاه، تكون المنظمة غير الربحية أو صندوق التقاعد مقيمَين في ولاية قضائية إذا تم إنشاؤهما وإدارتهما في تلك الولاية القضائية، ويكون الكيان الاستثماري مقيما في ولاية قضائية إذا تم إنشاؤه وتنظيمه في تلك الولاية القضائية. وتكون شركة التأمين على الحياة مقيمة في الولاية القضائية التي تقع فيها.\nقاعدة الأرباح الخاضعة لمعدل ضريبي منخفض المؤهلة: مجموعة من القواعد المعادلة للمواد ذات الصلة من قواعد مكافحة تآكل الوعاء الضريبي العالمي، بما في ذلك أي أحكام من قواعد مكافحة تآكل الوعاء الضريبي العالمي المرتبطة بتلك المواد، والتي تم إدراجها في النظام المحلي لولاية قضائية ويتم تنفيذها وإدارتها بما يتفق مع النتائج المقدمة بموجب قواعد مكافحة تآكل الوعاء الضريبي العالمي والتعليقات، شرط ألا توفر الولاية القضائية أي مزايا تتعلق بهذه القواعد.\nقاعدة تضمين الدخل المؤهلة: مجموعة من القواعد المعادلة للمواد ذات الصلة من قواعد مكافحة تآكل الوعاء الضريبي العالمي، بما في ذلك أي أحكام مرتبطة بتلك المواد من قواعد مكافحة تآكل الوعاء الضريبي العالمي، والتي تم إدراجها في النظام المحلي للولاية القضائية والتي يتم تنفيذها وإدارتها بما يتفق مع النتائج المقدمة بموجب قواعد مكافحة تآكل الوعاء الضريبي العالمي والتعليقات، شرط ألا توفر تلك الولاية القضائية أي مزايا تتعلق بهذه القواعد.\nقاعدة تضمين الدخل: القواعد المدرجة في النظام المحلي لولاية قضائية التي تُسدد بموجبها ضريبة الحد الأدنى على مستوى كيان أم وفقاً لنسب حصص ملكيته في الكيانات التي لها دخل خاضع لمعدل ضريبي منخفض والتي يتم تنفيذها وإدارتها بطريقة تتماشى مع الأحكام ذات الصلة المنصوص عليها في قواعد مكافحة تآكل الوعاء الضريبي العالمي.\nقواعد مكافحة تآكل الوعاء الضريبي العالمي: مجموعة القواعد الصادرة عن الإطار الشامل لمنظمة التعاون الاقتصادي والتنمية/مجموعة العشرين بشأن تآكل الأوعية وتحويل الأرباح في ديسمبر 2021م، وما يطرأ عليها من تعديلات.\nكيان التأمين الاستثماري: كيان ينطبق عليه تعريف صندوق الاستثمار أو الأداة الاستثمارية العقارية باستثناء أنه تم تأسيسه خصيصاً فيما يتعلق بالتزامات ناشئة عن عقد تأمين أو عقد أقساط و يملكه بالكامل كيان خاضع لأنظمة شركات التأمين في الولاية القضائية التي يقع فيها.\nمصاريف الضريبة السلبية الزائدة المرحّلة: مصاريف الضريبة السلبية الزائدة المرحّلة إلى السنة المالية التالية وفقاً لأحكام المادة (الرابعة والأربعين) من هذا النظام.\nنظام ضريبة الدخل: نظام ضريبة الدخل الساري في المملكة."},{"n":2,"part":2,"part_en":"DMT Scope","part_ar":"نطاق ضريبة الحد الأدنى المحلي","title_en":"Persons in Scope of this Law","title_ar":"الأشخاص الخاضعون لأحكام النظام","page":8,"text_en":"1- This Law applies to Constituent Entities located in the Kingdom in accordance with ARTICLE (5) of this Law, including in the Special Economic Zones, and that are members of an MNE Group that has annual Revenue amounting to, in Saudi Riyals, the equivalent of seven hundred and fifty (750) million euros or more in the Consolidated Financial Statements of the Ultimate Parent Entity in at least two of the four Fiscal Years immediately preceding the tested Fiscal Year.\n2- Without prejudice to paragraph (1) of this Article, this Law applies to Stateless Constituent Entities created under the laws of the Kingdom, including in the Special Economic Zones, and that are members of an MNE Group that has annual Revenue amounting to, in Saudi Riyals, the equivalent of seven hundred and fifty (750) million euros or more in the Consolidated Financial Statements of the Ultimate Parent Entity in at least two of the four Fiscal Years immediately preceding the tested Fiscal Year.\n3- If one or more of the Fiscal Years of the MNE Group taken into account for the purposes of paragraphs (1) and (2) of this Article is of a period other than twelve (12) months, for each of those Fiscal Years the revenue threshold amounting to, in Saudi Riyals, the equivalent of seven hundred and fifty (750) million euros shall be adjusted proportionally to correspond with the length of the relevant Fiscal Year.\n4- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- تسري أحكام النظام على الكيانات التابعة الواقعة في المملكة بموجب المادة (الخامسة) من هذا النظام، بما في ذلك المناطق الاقتصادية الخاصة، والتي تكون أعضاء في مجموعة متعددة الجنسيات تبلغ أو تتجاوز قيمة إيراداتها، بالريال السعودي، ما يوازي سبعمائة وخمسين (750) مليون يورو وفق القوائم المالية الموحدة للكيان الأم النهائي خلال سنتين على الأقل من السنوات المالية الأربع التي تسبق بشكل مباشر السنة المالية الخاضعة للاختبار.\n2- دون الإخلال بالفقرة (1) من هذه المادة، تسري أحكام النظام على الكيانات التابعة عديمة الجنسية التي تم إنشاؤها في المملكة بموجب أنظمة المملكة، بما في ذلك المناطق الاقتصادية الخاصة، والتي تكون أعضاء في مجموعة متعددة الجنسيات تبلغ أو تتجاوز قيمة إيراداتها، بالريال السعودي، ما يوازي سبعمائة وخمسين (750) مليون يورو وفق القوائم المالية الموحدة للكيان الأم النهائي خلال سنتين على الأقل من السنوات المالية الأربع التي تسبق بشكل مباشر السنة المالية الخاضعة للاختبار.\n3- في حال كانت سنة أو أكثر من السنوات المالية للمجموعة المتعددة الجنسيات المأخوذة بالاعتبار لأغراض الفقرتين (1) و (2) من هذه المادة فترة تختلف عن اثني عشر (12) شهراً، يتوجب تعديل حد الإيرادات البالغ، بالريال السعودي، ما يوازي سبعمائة وخمسين (750) مليون يورو بالنسبة لكل من تلك السنوات بشكل يتناسب مع مدة السنة المالية المعنية.\n4- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":3,"part":2,"part_en":"DMT Scope","part_ar":"نطاق ضريبة الحد الأدنى المحلي","title_en":"Revenue","title_ar":"الإيرادات","page":9,"text_en":"1- For the purpose of ARTICLES (2) and (74) of this Law, revenue includes the following:\n(a) The inflow of economic benefits arising from any of the following:\n(1) Delivering or producing goods;\n(2) Rendering services;\n(3) Other activities that constitute the MNE Group’s ordinary activities.\n(b) Net gains from investments, whether realised or unrealised, reflected in the profit and loss statement of the Consolidated Financial Statements and income or gains separately presented as extraordinary or non-recurring items.\n2- The Revenue amounts shall be determined in line with the relevant accounting standard, which may allow for netting for discounts, returns and allowances, but in any event before deducting cost of sales and other operating expenses.\n3- In reference to paragraph (2) of this Article, different types of Revenue shall be aggregated if they are separately presented in the consolidated profit and loss statement of the Consolidated Financial Statements.\n4- If the MNE Group’s consolidated profit and loss statement presents gross gains from investments and gross losses from investments separately, the MNE Group shall reduce the Revenue by the amount of such gross losses to the extent of gross gains from investments.\n5- In accordance with the financial reporting requirements applicable to financial Entities, wherein the inclusion of gross transaction amounts pertaining to specific items may not be mandated in their financial statements, the item(s) deemed similar to Revenue in accordance with the Financial Accounting Standards of the Ultimate Parent Entity shall be utilized within the context of financial activities.\n6- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- لأغراض المادتين (الثانية) و (الرابعة والسبعين) من هذا النظام، تتضمن الإيرادات ما يلي:\n(أ) تدفق المنافع الاقتصادية التي تنشأ عن أي مما يلي: (1) تسليم أو إنتاج السلع والبضائع. (2) تقديم الخدمات. (3) أي نشاط آخر يعد ضمن نطاق الأنشطة العادية للمجموعة المتعددة الجنسيات.\n(ب) صافي المكاسب الاستثمارية، سواء كانت محققة أو غير محققة، المدرجة في قائمة الأرباح والخسائر في القوائم المالية الموحدة وكذلك الدخل أو المكاسب التي تدرج بشكل منفصل كبنود استثنائية أو غير متكررة.\n2- يتم تحديد مبلغ الإيرادات وفقاً للمعايير المحاسبية المعنية التي قد تسمح بعرض الإيرادات بالصافي بعد الخصومات والعوائد والمخصصات، ولكن في أي حال قبل خصم تكلفة المبيعات ومصاريف التشغيل الأخرى.\n3- فيما يتعلق بأحكام الفقرة (2) من هذه المادة، يتوجب تجميع مختلف أنواع الإيرادات في حال تم عرضها بشكل منفصل في قائمة الأرباح والخسائر الموحدة في القوائم المالية الموحدة.\n4- إذا كانت قائمة الأرباح والخسائر الموحدة للمجموعة المتعددة الجنسيات تعرض بشكل منفصل إجمالي المكاسب الاستثمارية وإجمالي الخسائر الاستثمارية، يتوجب على المجموعة المتعددة الجنسيات تخفيض الإيرادات بمبلغ إجمالي الخسائر في حدود إجمالي المكاسب الاستثمارية.\n5- إذا كانت متطلبات إعداد التقارير المالية المطبقة على الكيانات المالية لا تستلزم تضمين إجمالي مبالغ المعاملات المتعلقة ببنود معينة في قوائمها المالية، يجب استخدام البند أو البنود التي تُعد مشابهة للإيرادات وفقاً للمعايير المحاسبية المالية للكيان الأم النهائي في سياق الأنشطة المالية المعنية للكيان. 6 - تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":4,"part":2,"part_en":"DMT Scope","part_ar":"نطاق ضريبة الحد الأدنى المحلي","title_en":"Consolidated Financial Statements","title_ar":"القوائم المالية الموحدة","page":10,"text_en":"1- Consolidated Financial Statements shall mean:\n(a) The financial statements prepared by an Entity in accordance with an Acceptable Financial Accounting Standard, in which the assets, liabilities, income, expenses and cash flows of that Entity and the Entities in which it has a Controlling Interest are presented as those of a single economic unit;\n(b) Where an Entity meets the definition of a Group under paragraph (3) of ARTICLE (8) of this Law, the financial statements of the Entity that are prepared in accordance with an Acceptable Financial Accounting Standard;\n(c) Where the Ultimate Parent Entity has financial statements described in sub-paragraphs (a) or\n(b) of this paragraph that are not prepared in accordance with an Acceptable Financial Accounting Standard, the financial statements that have been prepared subject to adjustments to prevent any Material Competitive Distortions; and\n(d) Where the Ultimate Parent Entity does not prepare financial statements described in subparagraphs (a) to (c) of this paragraph, the Consolidated Financial Statements of the Ultimate Parent Entity are those that would have been prepared if such Entity were required to prepare such statements in accordance with an Authorised Financial Accounting Standard that is either an Acceptable Financial Accounting Standard or another financial accounting standard that is adjusted to prevent any Material Competitive Distortions.\n2- Where the application of a specific principle or procedure under a set of generally accepted accounting principles results in a material competitive distortion, the accounting treatment of any item or transaction subject to that principle or procedure shall be adjusted to conform with the treatment required for such item or transaction under International Financial Reporting Standards (IFRS), in accordance with guidance issued by the Authority.\n3- The Regulations shall specify the controls and the implementing provisions for this Article.","text_ar":"1 - يُقصد بالقوائم المالية الموحدة ما يلي:\n(أ) القوائم المالية الم عدة من قبل الكيان وفقاً للمعايير المحاسبية المالية المقبولة ، والتي تعرض فيها الأصول والالتزامات والدخل والمصاريف والتدفقات النقدية العائدة لذلك الكيان وللكيانات التي يمتلك فيها حصة مسيطرة على أنها أصول والتزامات و دخل و مصاريف وتدفقات نقدية عائدة لوحدة اقتصادية واحدة.\n(ب) في حال استيفاء الكيان لتعريف المجموعة وفقاً للفقرة (3) من المادة (الثامنة) من هذا النظام، القوائم المالية المُعدة للكيان وفقاً للمعايير المحاسبية المالية المقبولة.\n(ج) إذا كان للكيان الأم النهائي قوائم مالية منصوص عليها في الفقرة الفرعية\n(أ) أو الفقرة الفرعية\n(ب) من هذه الفقرة ولم يتم إعدادها وفقاً للمعايير المحاسبية المالية المقبولة، تكون القوائم المالية التي تم إعدادها وذلك مع مراعاة التعديلات اللازمة لمنع أي تباينات تنافسية جوهرية.\n(د) إذا كان الكيان الأم النهائي لا يقوم بإعداد القوائم المالية المنصوص عليها في الفقرات الفرعية\n(أ) إلى\n(ج) من هذه الفقرة، فإن القوائم المالية الموحدة للكيان الأم النهائي هي تلك التي يمكن إعدادها لو كان هذا الكيان ملزماً بإعداد مثل هذه القوائم وفقاً للمعايير المحاسبية المالية المعتمدة والتي تكون إما معايير محاسبية مالية مقبولة أو معايير محاسبية مالية أخرى يتم تعديلها لمنع أي تباينات تنافسية جوهرية. 2 - إذا أدى تطبيق مبدأ أو إجراء محدد بموجب مجموعة ضمن المبادئ المحاسبية لا مقبولة عموماً إلى تباين تنافسي جوهري ، تُعدَّل المعالجة المحاسبية لأي بند أو معاملة تخضع لذلك المبدأ أو الإجراء لتتوافق مع المعالجة المطلوبة للبند أو المعاملة بموجب المعايير الدولية للتقارير المالية ، وفقا لإلرش اد ات التي تصدرها الهيئة.\n3- تحدد اللائحة الضوابط والأحكام التنفيذية اللازمة لتطبيق هذه المادة."},{"n":5,"part":2,"part_en":"DMT Scope","part_ar":"نطاق ضريبة الحد الأدنى المحلي","title_en":"Location of an Entity and a Permanent Establishment","title_ar":"موقع الكيان والمنشأة الدائمة","page":11,"text_en":"1- The location of an Entity that is not a Flowthrough Entity shall be determined as follows:\n(a) If it is a tax resident in a jurisdiction based on its place of management, place of creation or similar criteria, it is located in that jurisdiction; and\n(b) In other cases, it is located in the jurisdiction in which it was created.\n2- The location of an Entity that is a Flow-through Entity shall be determined as follows:\n(a) If it is the Ultimate Parent Entity of the MNE Group or it is required to apply an Income Inclusion Rule, it is located in the jurisdiction where it was created; and\n(b) In other cases, it shall be treated as a stateless Entity.\n3- The location of a Permanent Establishment shall be determined as follows:\n(a) In the cases described in paragraph (1) of ARTICLE (11) of this Law, the Permanent Establishment is located in the jurisdiction where it is treated as a permanent establishment and is taxed under the applicable Tax Treaty in force;\n(b) In the cases described in paragraph (2) of ARTICLE (11) of this Law, the Permanent Establishment is located in the jurisdiction where it is subject to net basis taxation based on its business presence;\n(c) In the cases described in paragraph (3) of ARTICLE (11) of this Law, the Permanent Establishment is located in the jurisdiction where it is situated; and\n(d) In the cases described in paragraph (4) of ARTICLE (11) of this Law, the Permanent Establishment shall be considered as a stateless Permanent Establishment.\n4- Where, by reason of paragraph (1) of this Article, a Constituent Entity is located in more than one jurisdiction, then its status for the purposes of this Law shall be determined as follows:\n(a) If the Constituent Entity is located in two jurisdictions that have an applicable Tax Treaty in force: (1) It shall be located in the jurisdiction where it is considered as a deemed tax resident for the purposes of the Tax Treaty;\n(2) If the Tax Treaty requires the Competent Authorities to reach a mutual agreement on the deemed residence of the Constituent Entity for the purposes of the Tax Treaty and no agreement exists, then sub-paragraph (b) of this paragraph shall apply;\n(3) If the Tax Treaty does not provide relief or exemption from tax because the Constituent Entity is a tax resident of both contracting Parties, then sub-paragraph (b) of this paragraph shall apply.\n(b) If no Tax Treaty applies:\n(1) The Constituent Entity shall be located in the jurisdiction where it paid the greater amount of Covered Taxes for the Fiscal Year, without considering the ones paid in accordance with a CFC Tax Regime in case such a regime is in effect;\n(2) If the amount of Covered Taxes paid in both jurisdictions is the same or zero, the Constituent Entity shall be located in the jurisdiction where it has the greater amount of Substance-based Income Exclusion computed on an Entity basis in accordance with ARTICLE\n(58) of this Law;\n(3) If the amount of the Substance-based Income Exclusion in both jurisdictions is the same or zero, then the Constituent Entity shall be considered a Stateless Constituent Entity unless it is the Ultimate Parent Entity of the MNE Group in which case it shall be located in the jurisdiction where it was created.\n5- Where an Entity has changed its location during the Fiscal Year, it shall be located in the jurisdiction where it was located at the beginning of that year.\n6- For the purpose of sub-paragraph (b)(1) of paragraph (4) of this Article, Controlled Foreign Company Tax Regime means a set of tax rules (other than an IIR) under which a direct or indirect shareholder of a foreign entity (the controlled foreign company or CFC) is subject to current taxation on its share of part or all of the income earned by the CFC, irrespective of whether that income is distributed currently to the shareholder.\n7- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يتم تحديد موقع الكيان الذي لا يُعد كياناً شفافاً ماليا وفقا لما يلي\n(أ) إذا كان مقيما ضريبيا في ولاية قضائية بناءً على مكان إدارته أو مكان إنشائه أو أي معيار مماثل، ف يقع الكيان في تلك الولاية القضائية.\n(ب) في الحالات الأخرى، يقع الكيان في الولاية القضائية التي أنشئ فيها.\n2- يتم تحديد موقع الكيان الذي يُعد كيانا شفافا مالياً وفقاً لما يلي:\n(أ) إذا كان الكيان هو الكيان الأم النهائي للمجموعة المتعددة الجنسيات أو يتوجب عليه تطبيق قاعدة تضمين الدخل، يقع هذا الكيان في الولاية القضائية التي أُنشئ فيها.\n(ب) في الحالات الأخرى، يعامل الكيان على أنه كيان عديم الجنسية.\n3- يتم تحديد م وقع المنشأة الدائمة وفقا لما يلي\n(أ) في الحالات المنصوص عليها في الفقرة (1) من المادة (الحادية عشرة) من هذا النظام، تقع المنشأة الدائمة في الولاية القضائية التي تعامل فيها كمنشأة دائمة وتخضع فيها للضريبة بموجب الاتفاقية الضريبية السارية\n(ب) في الحالات المنصوص عليها في الفقرة (2) من المادة (الحادية عشرة) من هذا النظام، تقع المنشأة الدائمة في الولاية القضائية التي تخضع فيها للضرائب على صافي أرباحها على أساس تواجدها التجاري\n(ج) في الحالات المنصوص عليها في الفقرة (3) من المادة (الحادية عشرة) من هذا النظام، تقع المنشأة الدائمة في الولاية القضائية المتواجدة بها.\n(د) في الحالات المنصوص عليها في الفقرة (4) من المادة (الحادية عشرة) من هذا النظام، تُ عدا لمنشأة الدائمة منشأة دائمة عديمة الجنسية.\n4- في حال وقوع الكيان التابع في أكثر من ولاية قضائية وا حدة وفقاً لأحكام الفقرة (1) من هذه المادة، يتم تحديد وضعه لأغراض هذا النظام وفقا لما يلي\n(أ) إذا كان الكيان التابع واقعا في ولا ي تين قضائيتين بينهما اتفاقية ضريبية سارية: (1) يقع هذا الكيان في الولاية القضائية التي يُعد مقيماً ضريبياً فيها لأغراض الاتفاقية الضريبية. (2) إذا كانت الاتفاقية الضريبية تتطلب من السلطات المختصة التوصل إلى اتفاق متبادل بشأن الإقامة الاعتبارية للكيان التابع لأغراض الاتفاقية الضريبية، ولم يتم الاتفاق حول ذلك، عندها تُطبق أحكام الفقرة الفرعية\n(ب) من هذه الفقرة. (3) إذا كانت الاتفاقية الضريبية لا تتيحخص ما أو إعفاءً ضريبياً بسبب كون الكيان التابع مقيماً ضريبياً في كلتا الدولتين المتعاقدتين، عندها تُطبق أحكام الفقرة الفرعية\n(ب) من هذه الفقرة.\n(ب) في حال عدم تطبيق اتفاقية ضريبية: (1) يقع الكيان التابع في الولاية القضائية التي سدد فيها المبلغ الأعلى من الضرائب المشمولة للسنة المالية، دون النظر فيما تم تسديده وفقاً للنظام الضريبي المطبق على الشركة الأجنبية الخاضعة للسيطرة في حال وجود هذا النظام. (2) إذا كان مبلغ الضرائب المشمولة المسددة في كلتا الولايتين القضائيتين متساوياً أو صفراً ، يقع الكيان التابع في الولاية القضائية التي لديه فيها لا مبلغ الأعلى من الاستبعاد على أساس جوهر النشاط كما هو محتسب على مستوى الكيان بموجب أحكام المادة (الثامنة والخمسين) من هذا النظام. (3) إذا كان مبلغ الاستبعاد على أساس جوهر النشاط في كلتا الولايتين القضائيتين متساوياً أو صفراً، يُعد الكيان التابع كياناً تابعاً عديم الجنسية ما لم يكن هو الكيان الأم النهائي للمجموعة المتعددة الجنسيات، وفي هذه الحالة يقع في الولاية القضائية التي أنشئ فيها 5 - إذا تغير موقع الكيان التابع خلال السنة المالية ، يُعد واقعاً في الولاية القضائية التي كان واقعاً فيها في بداية تلك السنة 6 - لأغراض البند (1) من الفقرة الفرعية\n(ب) من الفقرة (4) من هذه المادة، يقصد بالنظام الضريبي المطبق على الشركة الأجنبية الخاضعة للسيطرة مجموعة قواعد ضريبية (باستثناء قاعدة تضمين الدخل) التي يخضع بموجبها المساهم المباشر أو غير المباشر في كيان أجنبي (الشركة الأجنبية الخاضعة للسيطرة) للضريبة الحالية على حصته في جزء أو كامل الدخل الذي تحصل عليه الشركة الأجنبية الخاضعة للسيطرة، بغض النظر عما إذا كان هذا الدخل موزعا حاليا على المساهمين.\n7- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":6,"part":2,"part_en":"DMT Scope","part_ar":"نطاق ضريبة الحد الأدنى المحلي","title_en":"Tax Resident","title_ar":"المقيم الضريبي","page":12,"text_en":"An Entity shall be deemed to be a tax resident in the Kingdom if it satisfies the residency conditions stipulated in the Income Tax Law.","text_ar":"يعد الكيان مقيماً ضريبياً في المملكة عندما تنطبق عليه شروط الإقامة المنصوص عليها في نظام ضريبة الدخل."},{"n":7,"part":2,"part_en":"DMT Scope","part_ar":"نطاق ضريبة الحد الأدنى المحلي","title_en":"Controlling Interest","title_ar":"الحصة المسيطرة","page":13,"text_en":"1- Controlling Interest means an Ownership Interest in an Entity such that the interest holder meets at least one of the following conditions:\n(a) The interest holder is required to consolidate the assets, liabilities, income, expenses, and cash flows of the Entity on a line-by-line basis in accordance with an Acceptable Financial Accounting Standard; or\n(b) The interest holder would have been required to consolidate the assets, liabilities, income, expenses, and cash flows of the Entity on a line-by-line basis if the interest holder had prepared Consolidated Financial Statements.\n2- A Main Entity shall be deemed to have the Controlling Interests of its Permanent Establishments.","text_ar":"1- يقصد بالحصة المسيطرة حصة الملكية في كيان حيث يستوفي مالك الحصة أحد الشروط الآتية على الأقل:\n(أ) يتوجب على مالك الحصة توحيد أصول الكيان والتزاماته ودخله ومصاريفه وتدفقاته النقدية على أساس كل بند على حدة وفقاً للمعايير المحاسبية المالية المقبولة.\n(ب) كان يتوجب على مالك الحصة توحيد أصول الكيان والتزاماته ودخله ومصاريفه وتدفقاته النقدية على أساس كل بند على حدة إذا كان مالك الحصة قد أعد قوائم مالية موحدة.\n2- يُعد الكيان الرئيسي على أنه يملك الحصص المسيطرة على منشآته الدائمة."},{"n":8,"part":2,"part_en":"DMT Scope","part_ar":"نطاق ضريبة الحد الأدنى المحلي","title_en":"MNE Group and Group","title_ar":"المجموعة المتعددة الجنسيات والمجموعة","page":13,"text_en":"1- An MNE Group is any Group that includes at least one Entity or Permanent Establishment that is not located in the jurisdiction of the Ultimate Parent Entity.\n2- A Group is a collection of Entities that are related through ownership or control such that the assets, liabilities, income, expenses, and cash flows of those Entities are either:\n(a) Included in the Consolidated Financial Statements of the Ultimate Parent Entity; or\n(b) Excluded from the Consolidated Financial Statements of the Ultimate Parent Entity solely on size or materiality grounds, or on the grounds that the Entity is held for sale.\n3- Without prejudice to paragraph (2) of this Article, a Group also means an Entity that is located in one jurisdiction and has one or more Permanent Establishments located in other jurisdictions provided that the Entity is not a part of another Group described in paragraph\n(2) of this Article.","text_ar":"1- المجموعة المتعددة الجنسيات هي أي مجموعة تضم كياناً واحداً على الأقل أو منشأة دائمة واحدة على الأقل لا تقع في الولاية القضائية للكيان الأم النهائي.\n2- المجموعة هي كيانات متعددة مرتبطة من خلال الملكية أو السيطرة، حيث تكون أصول هذه الكيانات والتزاماتها ودخلها ومصاريفها وتدفقاتها النقدية إما:\n(أ) مدرجة في القوائم المالية الموحدة للكيان الأم النهائي. أو\n(ب) مستبعدة من القوائم المالية الموحدة للكيان الأم النهائي وذلك فقط على أساس الحجم أو الجوهر، أو بسبب كون الكيان مُحتفظاً به لغرض البيع.\n3- دون الإخلال بأحكام الفقرة (2) من هذه المادة، يقصد بالمجموعة أيضاً الكيان الواقع في ولاية قضائية واحدة ولديه منشأة دائمة واحدة أو منشآت دائمة متعددة واقعة في ولايات قضائية أخرى، شريطة ألا يكون الكيان جزءاً من مجموعة أخرى كما هو منصوص عليه في الفقرة (2) من هذه المادة."},{"n":9,"part":2,"part_en":"DMT Scope","part_ar":"نطاق ضريبة الحد الأدنى المحلي","title_en":"Constituent Entity","title_ar":"الكيان التابع","page":13,"text_en":"1- A Constituent Entity means any of the following:\n(a) Any Entity that is included in a Group;\n(b) Any Permanent Establishment of a Main Entity that is within sub-paragraph (a). 2- A Permanent Establishment that is a Constituent Entity under sub-paragraph (b) of paragraph (1) of this Article shall be treated as separate from the Main Entity and any other Permanent Establishment of that Main Entity.\n3- A Constituent Entity does not include an Entity that is an Excluded Entity as per the provisions of ARTICLE (12) of this Law.","text_ar":"1- يُقصد بالكيان التابع أي مما يلي:\n(أ) أي كيان ضمن مجموعة.\n(ب) أي منشأة دائمة لكيان رئيسي مشمول في الفقرة الفرعية\n(أ) من هذه الفقرة.\n2- تُعامل المنشأة الدائمة التي هي كيان تابع وفقاً للفقرة الفرعية\n(ب) من الفقرة (1) من هذه المادة على أنها منفصلة عن الكيان الرئيسي وأي منشأة دائمة أخرى تابعة لذلك الكيان الرئيسي.\n3- لا يشمل الكيان التابع أي كيان يعتبر كيانا مستبعدا وفقا لأحكام المادة (الثانية عشرة) من هذا النظام."},{"n":10,"part":2,"part_en":"DMT Scope","part_ar":"نطاق ضريبة الحد الأدنى المحلي","title_en":"Ultimate Parent Entity","title_ar":"الكيان الأم النهائي","page":14,"text_en":"1- Ultimate Parent Entity means either:\n(a) An Entity that owns directly or indirectly a Controlling Interest in any other Entity and is not owned, with a Controlling Interest, directly or indirectly by another Entity; or\n(b) The Main Entity of a Group as specified in paragraph (3) of ARTICLE (8) of this Law.\n2- Without prejudice to paragraphs (2) and (3) of ARTICLE (12) of this Law, a sovereign wealth fund - which meets the Governmental Entity criterion set out in sub-paragraph (b) of paragraph (2) of ARTICLE (13) - shall not be regarded as the Ultimate Parent Entity of an MNE Group and shall be ignored for the purposes of this Law. An Entity in which such a sovereign wealth fund has a Controlling Interest as a result of direct Ownership Interests shall be deemed to be the Ultimate Parent Entity of the Group consisting of itself and the entities that it has a Controlling Interest in.\n3- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يُقصد بالكيان الأم النهائي إما:\n(أ) الكيان الذي يمتلك بشكل مباشر أو غير مباشر حصة مسيطرة في أي كيان آخر، ولا يكون هو نفسه مملوك اب حصة مسيطرة من كيان آخر بشكل مباشر أو غير مباشر. أو\n(ب) الكيان الرئيسي لمجموعة كما هو محدد في الفقرة (3) من المادة (الثامنة) من هذا النظام.\n2- دون الإخلال بأحكام الفقرتين (2) و (3) من المادة (الثانية عشرة) من هذا النظام، لا يُعد صندوق الثروة السيادي - الذي يستوفي معيار الكيان الحكومي الوارد في الفقرة الفرعية\n(ب) من الفقرة (2) من المادة (الثالثة عشرة) - على أنه الكيان الأم النهائي لمجموعة متعددة الجنسيات ويتم تجاهله لأغراض النظام. و يُعد الكيان الذي يملك فيه صندوق الثروة السيادي حصة مسيطرة نتيجة حصص ملكية مباشرة، على أنه الكيان الأم النهائي للمجموعة المتعددة الجنسيات التي تتكون منه ومن الكيانات التي يكون له حصة مسيطرة فيها.\n3- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":11,"part":2,"part_en":"DMT Scope","part_ar":"نطاق ضريبة الحد الأدنى المحلي","title_en":"Permanent Establishment","title_ar":"المنشأة الدائمة","page":14,"text_en":"A Permanent Establishment is any of the following:\n1- A place of business, or a deemed place of business, situated in a jurisdiction and treated as a permanent establishment in accordance with an applicable Tax Treaty in force provided that such jurisdiction taxes the income attributable to it in accordance with a provision similar to Article (7) of the OECD Model Tax Convention on Income and on Capital;\n2- If there is no applicable Tax Treaty in force, a place of business, or a deemed place of business, in respect of which a jurisdiction taxes under its domestic law the income attributable to such place of business on a net basis similar to the manner in which it taxes its own tax residents; 3- If a jurisdiction has no corporate income tax system, a place of business, or a deemed place of business, situated in that jurisdiction that would be treated as a permanent establishment in accordance with the OECD Model Tax Convention on Income and on Capital provided that such jurisdiction would have had the right to tax the income attributable to it in accordance with Article (7) of that model;\n4- A place of business, or a deemed place of business, that is not already described in paragraphs (1) to (3) of this Article through which operations are conducted outside the jurisdiction where the Entity is located provided that such jurisdiction exempts the income attributable to such operations.","text_ar":"يقصد بالمنشأة الدائمة أي مما يلي:\n1- مكان العمل أو مكان العمل الاعتباري المتواجد في ولاية قضائية والذي يعامل كمنشأة دائمة وفقاً لاتفاقية ضريبية سارية، شريطة أن تفرض الولاية القضائية ضرائب على الدخل المنسوب إليه وفقا لحكم مماثل للمادة (السابعة) من الاتفاقية الضريبية النموذجية لمنظمة التعاون الاقتصادي والتنمية بشأن الدخل ورأس المال\n2- في حال عدم وجود اتفاقية ضريبية سارية، مكان العمل، أو مكان العمل الاعتباري، الذي تفرض فيه ولاية قضائية بموجب نظامها المحلي ضريبة على الدخل المنسوب إلى مكان ا لعم له ذا ، وذلك وفقالأ ساس الصافي على نحو مشابه للطريقة التي تفرض بها الضريبة على المقيمين الخاضعين للضريبة\n3- في حال لا تطبق الولاية القضائية نظام ضريبة الدخل على الشركات، مكان العمل أو مكان العمل الاعتباري الواقع في تلك الولاية القضائية والذي كان سيتم التعامل معه على أنه منشأة دائمة وفقاً للاتفاقية الضريبية النموذجية لمنظمة التعاون الاقتصادي والتنمية بشأن الدخل ورأس المال، شريطة أنه كان سيحق لهذه الولاية القضائية فرض الضريبة على الدخل المنسوب إليه بموجب المادة (السابعة) من الاتفاقية الضريبية النموذجية.\n4- مكان العمل أو مكان العمل الاعتباري غير المنصوص عليه ضمن الفقرات (1) إلى (3) من هذه المادة و الذي تجري من خلاله عمليات خارج الولاية القضائية التي يقع فيها الكيان، شريطة أن تعفي هذه الولاية القضائية الدخل المنسوب لتلك العمليات."},{"n":12,"part":2,"part_en":"DMT Scope","part_ar":"نطاق ضريبة الحد الأدنى المحلي","title_en":"Excluded Entity","title_ar":"الكيان المستبعد","page":15,"text_en":"1- An Excluded Entity is any of the following Entities:\n(a) A Governmental Entity;\n(b) An International Organisation;\n(c) A Non-profit Organisation;\n(d) A Pension Fund;\n(e) An Investment Fund that is an Ultimate Parent Entity;\n(f) A Real Estate Investment Vehicle that is an Ultimate Parent Entity.\n2- An Excluded Entity is also an Entity that meets any of the following conditions:\n(a) At least ninety-five percent (95%) of the value of the Entity is owned, directly or through a chain of Excluded Entities, by one or more Excluded Entities referred to in paragraph (1) of this Article, other than a Pension Services Entity, and where that Entity meets any of the following criteria:\n(1) The Entity operates exclusively or almost exclusively to hold assets or invest funds for the benefit of the Excluded Entity or Excluded Entities;\n(2) The Entity only carries out activities that are ancillary to those carried out by the Excluded Entity or Excluded Entities.\n(b) At least eighty-five percent (85%) of the value of the Entity is owned, directly or through a chain of Excluded Entities, by one or more Excluded Entities referred to in paragraph (1) of this Article, other than a Pension Services Entity, provided that substantially all of the Entity’s income is Excluded Dividends or Excluded Equity Gain or Loss that is excluded from the calculation of the DMT Income or Loss in accordance with sub-paragraphs (b) or\n(c) of paragraph (1) of ARTICLE (19) of this Law.\n3- A Filing Constituent Entity may elect not to treat an Entity as an Excluded Entity under paragraph (2) of this Article. An election under this paragraph shall be a Five-Year Election.\n4- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يُعد أي كيان من الكيانات الآتية بمثابة كيان مستبعد:\n(أ) كيان حكومي.\n(ب) منظمة دولية\n(ج) منظمة غير ربحية\n(د) صندوق تقاعد.\n(هـ) صندوق استثمار يُعد كيانا أما نهائيا.\n(و) أداة استثمارية عقارية تُعد كيانا أما نهائيا.\n2- يُعد أيضا بمثابة كيان مست بعد الكيان الذي تتوافر فيه أي من الشروط الآتية:\n(أ) تكون على الأقل خمسة وتسعون بالمائة من قيمة الكيان مملوكة، بشكل مباشر أو من خلال سلسلة من الكيانات المستبعدة، من واحد أو أكثر من الكيانات المستبعدة المشار إليها في الفقرة من هذه المادة، فيما عدا كيان خدمات التقاعد، في حال توفر في هذا الكيان أيٌّ من الشروط الآتية: (1) يعمل الكيان بشكل حصري أو شبه حصري من أجل الاحتفاظ بالأصول أو استثمار الأموال لمصلحة الكيان المستبعد أو الكيانات المستبعدة (2) ينفذ الكيان فقط الأنشطة المساندة للأنشطة التي ينفذها الكيان المستبعد أو الكيانات المستبعدة\n(ب) تكون على الأقل خمسة وثمانون بالمائة (85%) من قيمة الكيان مملوكة، بشكل مباشر أو من خلال سلسلة من الكيانات المستبعدة ، من واحد أو أكثر من الكيانات المستبعدة المشار إليها في الفقرة من هذه المادة، فيما عدا كيان خدمات التقاعد، شريطة أن يكون ، إلى حد كبير، جميع دخل الكيان من توزيعات الأرباح المستبعدة أو من مكاسب أو خسائر حقوق ملكية مستبعدة من احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي بموجب الفقرتين الفرعيتين\n(ب) أو\n(ج) من الفقرة (1) من المادة (التاسعة عشرة) من هذا النظام.\n3- يجوز للكيان التابع المعين لتقديم الإقرار أن يختار عدم معاملة كيان ما على أنه كيان مستبعد وفقاً للفقرة (2) من هذه المادة. ويكون الاختيار بموجب هذه الفقرة اختياراً لخمس سنوات.\n4- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":13,"part":2,"part_en":"DMT Scope","part_ar":"نطاق ضريبة الحد الأدنى المحلي","title_en":"Governmental Entity","title_ar":"الكيان الحكومي","page":16,"text_en":"A Governmental Entity is an Entity that meets all of the following criteria:\n1- It is part of or wholly owned by a government, including any political subdivision or local authority thereof;\n2- Does not carry on a trade or business and has the principal purpose of either:\n(a) Fulfilling a government function; or\n(b) Managing or investing that government’s or jurisdiction’s assets through the making and holding of investments, asset management, and related investment activities for the government’s or jurisdiction’s assets.\n3- It is accountable to the government on its overall performance, and provides annual information reporting to the government;\n4- Its assets vest in such government upon dissolution and to the extent it distributes net earnings, such net earnings are distributed solely to such government with no portion of its net earnings inuring to the benefit of any private person.","text_ar":"يُعد بمثابة كيان حكومي الكيان الذي يستوفي جميع المعايير الآتية:\n1- يكون جزءاً من حكومة أو مملوكاً بالكامل من قبل حكومة، بما في ذلك أي قسم سياسي فرعي أو سلطة محلية تابعة لها.\n2- لا يمارس تجارة أو أعمالاً تجارية ويكون الغرض الرئيسي منه إما:\n(أ) أداء وظيفة حكومية. أو\n(ب) إدارة أو استثمار أصول تلك الحكومة أو الولاية القضائية من خلال إنشاء الاستثمارات والاحتفاظ بها، وإدارة الأصول، ومزاولة الأنشطة الاستثمارية المعنية المتعلقة بأصول الحكومة أو الولاية القضائية.\n3- يكون مسؤولاً أمام الحكومة عن أدائه العام، ويقدم تقارير معلومات سنوية إلى الحكومة.\n4- تؤول أصوله إلى الحكومة عند حله وفي حال قام بتوزيع صافي الأرباح، يتم توزيع هذه الأرباح فقط إلى هذه الحكومة دون أن يعود أي جزء من صافي أرباحه لصالح أي شخص خاص."},{"n":14,"part":2,"part_en":"DMT Scope","part_ar":"نطاق ضريبة الحد الأدنى المحلي","title_en":"International Organisation","title_ar":"المنظمة الدولية","page":16,"text_en":"International Organisation is any intergovernmental organisation, including a supranational organisation, or wholly owned agency or instrumentality thereof that meets all of the following criteria:\n1- It is comprised primarily of governments;\n2- It has in effect a headquarters or substantially similar agreement with the jurisdiction in which it is established;\n3- Law, including establishment law or its governing documents prevent its income benefitting private persons.","text_ar":"المنظمة الدولية هي أي منظمة حكومية دولية، بما في ذلك منظمة تتجاوز حدود الولاية الوطنية، أو وكالة مملوكة بالكامل أو أداة تابعة لها تستوفي جميع المعايير الآتية:\n1- تتألف بشكل أساسي من حكومات.\n2- يكون لها اتفاقية مقر سارية أو اتفاقية مشابهة لها إلى حد كبير، في الولاية القضائية التي أنشئت فيها\n3- يمنع النظام، بما في ذلك نظام إنشائها ، أو المستندات التي تحكمها، استفادة الأشخاص الخاصين من دخل تلك المنظمة."},{"n":15,"part":2,"part_en":"DMT Scope","part_ar":"نطاق ضريبة الحد الأدنى المحلي","title_en":"Non-Profit Organisation","title_ar":"المنظمة غير الربحية","page":16,"text_en":"1- A Non-profit Organisation is an Entity that meets all of the following criteria:\n(a) It is established and operated in its jurisdiction of residence either:\n(1) Exclusively for religious, charitable, scientific, artistic, cultural, athletic, educational, or other similar purposes; or\n(2) As a professional organisation, business league, chamber of commerce, labour organisation, agricultural or horticultural organisation, civic league or an organisation operated exclusively for the promotion of social welfare.\n(b) Substantially all of the income from the activities mentioned in sub-paragraph (a) of this paragraph is exempt from income tax in its jurisdiction of residence;\n(c) It has no shareholders or members who have a proprietary or beneficial interest in its income or assets;\n(d) The income or assets of the Entity may not be distributed to, or applied for the benefit of, a private person or non-charitable Entity other than for any of the following reasons:\n(1) Pursuant to the conduct of the Entity’s charitable activities;\n(2) As payment of reasonable compensation for services rendered or for the use of property or capital;\n(3) As payment representing the fair market value of property which the Entity has purchased.\n(e) Upon termination, liquidation, or dissolution of the Entity, all of its assets must be distributed or revert to a Non-profit Organisation or to the government (including any Governmental Entity) of the jurisdiction of residence or any political subdivision thereof.\n2- Without prejudice to the provisions of paragraph (1) of this Article, a Non-Profit Organisation does not include any Entity carrying on a trade or business that is not directly related to the purposes for which it was established.\n3- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- المنظمة غير الربحية هي كيان يستوفي جميع المعايير الآتية:\n(أ) تم تأسيسه وتشغيله ضمن نطاق ولاية إقامته القضائية إما: (1) بشكل حصري لأغراض دينية، أو خيرية، أو علمية، أو فنية، أو ثقافية، أو رياضية، أو تعليمية، أو لأي أغراض أخرى مماثلة. أو (2) كمنظمة مهنية، أو رابطة أعمال، أو غرفة تجارة، أو منظمة عمل، أو منظمة زراعية، أو بستانية، أو رابطة مدنية، أو منظمة تعمل حصرياً لتعزيز الرعاية الاجتماعية.\n(ب) يكون إلى حد كبير جميع الدخل الناتج عن الأنشطة المنصوص عليها في الفقرة الفرعية\n(أ) من هذه الفقرة معفى من ضريبة الدخل في ولاية إقامة الكيان القضائية.\n(ج) ليس لديه مساهمون أو أعضاء لديهم حصص ملكية أو منفعة في دخله أو أصوله.\n(د) لا يمكن توزيع دخله أو أصوله إلى شخص خاص، أو كيان غير خيري، أو استخدام هذا الدخل، أو الأصول لصالحهم، إلا للأسباب الآتية: (1) وفقا لطبيعة الأنشطة الخيرية التي يقوم بها الكيان (2) مدفوعات تمثل تعويضا معقولا مقابل الخدمات المقدمة أو مقابل استخدام الممتلكات أو رأس المال. (3) مدفوعات تمثل القيمة السوقية العادلة للممتلكات التي اشتراها الكيان\n(هـ) عند إنهاء الكيان أو تصفيته أو حله، يجب توزيع جميع أصوله أو ردها إلى منظمة غير ربحية أو إلى الحكومة (بما في ذلك أي كيان حكومي) في ولاية إقامته القضائية أو أي قسم سياسي فرعي تابع لها.\n2- دون الإخلال بأحكام الفقرة (1) من هذه المادة، لا تشمل المنظمة غير الربحية أي كيان يمارس تجارة أو أعمالاً تجارية لا ترتبط بشكل مباشر بالأغراض التي تم تأسيس المنظمة غير الربحية من أجلها.\n3- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":16,"part":2,"part_en":"DMT Scope","part_ar":"نطاق ضريبة الحد الأدنى المحلي","title_en":"Pension Fund","title_ar":"صندوق التقاعد","page":17,"text_en":"1- A Pension Fund is any of the following:\n(a) A Pension Services Entity; An Entity that is established and operated in a\n(b) jurisdiction exclusively or almost exclusively to administer or provide retirement benefits and ancillary or incidental benefits to individuals that meets any of the following conditions: Is regulated as such by that jurisdiction or one\n(1) of its political subdivisions or local authorities; Those benefits are secured or otherwise protected by national regulations and funded by a pool of assets held through a fiduciary (2) arrangement or trustor to secure the fulfilment of the corresponding pension obligations against a case of insolvency of the MNE Group.\n2- Pension Services Entity means an Entity that is established and operated exclusively or almost exclusively:\n(a) To invest funds for the benefit of Entities referred to in sub-paragraph (b) of paragraph\n(1) of this Article; or\n(b) To carry out activities that are ancillary to those regulated activities carried out by the Entities referred to in sub-paragraph (b) of paragraph (1) of this Article, provided that they are members of the same Group.","text_ar":"1- صندوق التقاعد هو أي مما يلي:\n(أ) كيان خدمات التقاعد. كيان تم إنشاؤه وتشغيله في ولاية قضائية بشكل\n(ب) حصري أو شبه حصري من أجل إدارة أو توفير مزايا التقاعد أو مزايا إضافية أو عرضية للأشخاص الطبيعيين وتتوفر فيه أي من الشروط الآتية: يتم تنظيمه على هذا الأساس من قبل تلك الولاية (1) القضائية أو أحد أقسامها السياسية الفرعية أو سلطاتها المحلية. يتم تأمين هذه المزايا أو حمايتها بموجب الأنظمة المحلية ويتم تمويلها من قبل مجموعة من الأصول (2) المحتفظ بها من خلال ترتيبات ائتمانية أو وصي لضمان الوفاء بالتزامات معاشات التقاعد المقابلة في حال إفلاس المجموعة المتعددة الجنسيات.\n2- يقصد بكيان خدمات التقاعد الجهة التي يتم تأسيسها وتشغيلها بشكل حصري أو شبه حصري لأحد الأغراض الآتية:\n(أ) استثمار الأموال لصالح الكيانات المشار إليها في الفقرة الفرعية\n(ب) من الفقرة (1) من هذه المادة.\n(ب) مزاولة الأنشطة المساندة للأنشطة الخاضعة للتنظيم والتي تقوم بها الكيانات المشار إليها في الفقرة الفرعية\n(ب) من الفقرة (1) من هذه المادة، شريطة أن تكون تلك الكيانات أعضاء في نفس المجموعة."},{"n":17,"part":2,"part_en":"DMT Scope","part_ar":"نطاق ضريبة الحد الأدنى المحلي","title_en":"Investment Fund","title_ar":"صندوق الاستثمار","page":18,"text_en":"An Investment Fund is an Entity that meets all of the following criteria:\n1- It is designed to pool assets, which may be financial and non-financial, from a number of investors, some of which are not connected;\n2- It invests in accordance with a defined investment policy;\n3- It allows investors to reduce transaction, research, and analytical costs, or to spread risk collectively;\n4- It is primarily designed to generate investment income or gains, or protection against a particular or general event or outcome;\n5- Investors have a right to return from the assets of the fund or income earned on those assets, based on the contributions made by those investors;\n6- The Entity or its management is subject to a regulatory regime in the jurisdiction in which it is established or managed, including appropriate anti-money laundering and investor protection regulation;\n7- It is managed by investment fund management professionals on behalf of the investors.","text_ar":"صندوق الاستثمار هو الكيان الذي يستوفي جميع المعايير الآتية:\n1- تم تصميمه لجمع الأصول، التي قد تكون أصولاً مالية وغير مالية، من عدد من المستثمرين يكون بعضهم غير مرتبطين.\n2- يقوم بالاستثمار وفقاً لسياسة استثمار محددة\n3- يسمح للمستثمرين بتخفيض تكاليف المعاملات والبحث والتحليل أو توزيع المخاطر بشكلٍ جماعي.\n4- تم تصميمه بشكل أساسي لتحقيق دخل، أو مكاسب استثمارية، أو الحماية من حدث، أو نتيجة محددة أو عامة.\n5- يحق للمستثمرين الحصول على عائد من أصول الصندوق أو على دخل مكتسب من تلك الأصول، بناءً على المساهمات المقدمة من هؤلاء المستثمرين.\n6- يخضع الكيان أو إدارته لسلطة نظامية في الولاية القضائية التي يتم إنشاؤه أو إدارته فيها، بما في ذلك التنظيم المناسب وفق قواعد مكافحة غسل الأموال وحماية المستثمر.\n7- تتم إدارة الكيان من قبل مختصين في إدارة صناديق الاستثمار نيابة عن المستثمرين."},{"n":18,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Financial Accounts","title_ar":"الحسابات المالية","page":19,"text_en":"1- The DMT Income or Loss of each Constituent Entity shall be the Financial Accounting Net Income or Loss determined for the Constituent Entity for the Fiscal Year adjusted for the items described in articles from ARTICLE (19) to ARTICLE (41) of this Law.\n2- Where all of the Constituent Entities located in the Kingdom have financial accounts based on the Authorised Financial Accounting Standard of the Kingdom and the fiscal year of such accounts is the same fiscal year as the one used for the Consolidated Financial Statements of the MNE Group, the Financial Accounting Net Income or Loss shall be the net income or loss determined for a Constituent Entity prepared in accordance with the Authorised Financial Accounting Standard of the Kingdom before such net income or loss is adjusted during consolidation by eliminating intra-group transactions. The provisions of this paragraph shall apply where any of the following conditions are met:\n(a) All of the Constituent Entities located in the Kingdom are required to keep or use such accounts under the Income Tax Law;\n(b) Such financial accounts are subject to an external financial audit.\n3- Where the conditions under paragraph (2) of this Article are not met, the Financial Accounting Net Income or Loss for the Constituent Entity for the Fiscal Year shall be determined using another financial accounting standard subject to conditions as stipulated in the Regulations.\n4- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يكون دخل أو خسارة ضريبة الحد الأدنى المحلي لكل كيان تابع هو صافي لا دخل المحاسبي أو الخسارة المحاسبية المحدد للكيان التابع للسنة المالية التي عُدلت بنودها وفقاً للمواد من المادة (التاسعة عشرة) إلى المادة (الحادية والأربعين) من هذا النظام\n2- إذا كان لجميع الكيانات التابعة الواقعة في المملكة حسابات مالية وفقا للمعايير المحاسبية المالية المعتمدة في المملكة والسنة المالية لهذه الحسابات هي نفس السنة المالية المستخدمة في القوائم المالية الموحدة للمجموعة المتعددة الجنسيات، يكون صافي الدخل المحاسبي أو الخسارة المحاسبية هو صافي الدخل أو الخسارة المحدد للكيان التابع وفقاً للمعايير المحاسبية المالية المعتمدة في المملكة قبل أي تعديلات لصافي الدخل أو الخسارة خلال توحيد الحسابات عبر إلغاء المعاملات ضمن المجموعة. تطبق أحكام هذه الفقرة عند توافر أي من الشروط التالية:\n(أ) أن تكون جميع الكيانات التابعة الواقعة في المملكة ملزمة بالاحتفاظ بهذه الحسابات أو استخدامها بموجب نظام ضريبة الدخل\n(ب) أن تخضع تلك الحسابات المالية للتدقيق المالي الخارجي.\n3- إذا لم يتم استيفاء الشروط المنصوص عليها في الفقرة (2) من هذه المادة، يُحدد صافي الدخل المحاسبي أو الخسارة المحاسبية للكيان التابع للسنة المالية باستخدام معايير محاسبية مالية أخرى، بشرط توافر الشروط المنصوص عليها في اللائحة.\n4- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":19,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Adjustments to Determine DMT Income or Loss","title_ar":"التعديلات لتحديد دخل أو خسارة ضريبة الحد الأدنى المحلي","page":19,"text_en":"1- A Constituent Entity’s Financial Accounting Net Income or Loss shall be adjusted for all the following items to arrive at that Entity’s DMT Income or Loss:\n(a) Net Taxes Expense;\n(b) Excluded Dividends;\n(c) Excluded Equity Gain or Loss;\n(d) Included Revaluation Method Gain or Loss; (e) Gain or loss from disposition of assets and liabilities excluded under ARTICLE (76) of this Law;\n(f) Asymmetric Foreign Currency Gains or Losses;\n(g) Policy Disallowed Expenses;\n(h) Prior Period Errors and Changes in Accounting Principles;\n(i) Accrued Pension Expense that are provided through a Pension Fund;\n(j) Bad Debt under circumstances stipulated in ARTICLE (29) of this Law;\n(k) Any other adjustments as determined in the Regulations.\n2- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يجب تعديل صافي الدخل المحاسبي أو الخسارة المحاسبية للكيان التابع بالنسبة لجميع البنود الآتية من أجل الوصول إلى دخل أو خسارة ضريبة الحد الأدنى المحلي لذلك الكيان:\n(أ) صافي المصاريف الضريبية\n(ب) توزيعات الأرباح المستبعدة.\n(ج) مكاسب أو خسائر حقوق الملكية المستبعدة\n(د) المكاسب أو الخسائر المدرجة وفق طريقة إعادة التقييم\n(هـ) المكاسب أو الخسائر الناتجة عن التصرف في الأصول والالتزامات المستبعدة بموجب المادة (السادسة والسبعين) من هذا النظام.\n(و) مكاسب أو خسائر تحويل العملات الأجنبية.\n(ز) المصاريف غير جائزة الحسم وفقاً للنظام\n(ح) أخطاء الفترات السابقة والتغيرات في المبادئ المحاسبية.\n(ط) مصاريف التقاعد المستحقة المقدمة من خلال صندوق التقاعد.\n(ي) الديون المعدومة وفقاً للحالات المنصوص عليها في المادة (التاسعة والعشرين) من هذا النظام.\n(ك) أي تعديلات أخرى تحددها اللائحة. 2 - تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":20,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Net Taxes Expense","title_ar":"صافي المصاريف الضريبية","page":20,"text_en":"1- Net Taxes Expense means the net amount of the following:\n(a) Any Covered Taxes accrued as an expense and any current and deferred Covered Taxes included in the income tax expense, including Covered Taxes on income that is excluded from the DMT Income or Loss calculation;\n(b) Any deferred tax asset attributable to a loss for the Fiscal Year;\n(c) Any taxes arising pursuant to this Law accrued as an expense.\n2- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يقصد بصافي المصاريف الضريبية المبلغ الصافي للآتي:\n(أ) أي ضرائب مشمولة مستحقة كمصاريف وأي ضرائب مشمولة حالية ومؤجلة مدرجة في مصاريف ضريبة الدخل، بما في ذلك الضرائب المشمولة على الدخل المستبعد من احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي\n(ب) أي أصل ضريبي مؤجل منسوب إلى خسارة في السنة المالية.\n(ج) أي ضرائب تنشأ وفقاً لهذا النظام تكون مستحقة كمصاريف.\n2- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":21,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Excluded Dividends","title_ar":"توزيعات الأرباح المستبعدة","page":20,"text_en":"1- Excluded Dividends means dividends or other distributions received or accrued in respect of an Ownership Interest, except for the following:\n(a) An Ownership Interest that is a Short-term Portfolio Shareholding at the date of distribution;\n(b) An Ownership Interest in an Investment Entity that is subject to an election under ARTICLE\n(88) of this Law.\n2- Notwithstanding the provisions of paragraph\n(1) of this Article, at the election of the Filing Constituent Entity, a Constituent Entity shall include in the calculation of its DMT Income or Loss for a Fiscal Year all dividends received by the Constituent Entity with respect to a Portfolio Shareholding. This election shall be a Five-Year Election.\n3- Short-term Portfolio Shareholding means a Portfolio Shareholding that has been economically held by the Constituent Entity that receives or accrues the dividends or other distributions for less than one year at the date of the distribution.\n4- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يقصد بتوزيعات الأرباح المستبعدة توزيعات الأرباح أو التوزيعات الأخرى المستلمة أو المستحقة فيما يتعلق بحصة الملكية، باستثناء الآتي:\n(أ) حصة ملكية تكون حصة ملكية محدودة قصيرة الأجل عند تاريخ لا توزيع\n(ب) حصة ملكية في كيان استثماري يخضع للاختيار بموجب المادة (الثامنة والثمانين) من هذا النظام.\n2- استثناءً من أحكام الفقرة (1) من هذه المادة، عند اختيار الكيان التابع المعين لتقديم الإقرار، يجب على الكيان التابع أن يدرج في احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي للسنة المالية جميع توزيعات الأرباح التي يتلقاها الكيان التابع فيما يتعلق بحصة الملكية المحدودة. ويُعد هذا الاختيار اختياراً لخمس سنوات.\n3- يُقصد بحصة الملكية المحدودة قصيرة الأجل حصة الملكية المحدودة المحتفظ بها اقتصاديا - لمدة تقل عن سنة واحدة من تاريخ التوزيع - من قبل الكيان التابع الذي يستلم أو يستحق له توزيعات الأرباح أو التوزيعات.\n4- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":22,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Excluded Equity Gain or Loss","title_ar":"مكاسب أو خسائر حقوق الملكية المستبعدة","page":21,"text_en":"1- Excluded Equity Gain or Loss means the gain, profit or loss included in the Financial Accounting Net Income or Loss of the Constituent Entity arising from the following:\n(a) Gains and losses from changes in fair value of an Ownership Interest, except for a Portfolio Shareholding;\n(b) Profit or loss in respect of an Ownership Interest included under the equity method of accounting; and\n(c) Gains and losses from disposition of an Ownership Interest, except for a disposition of a Portfolio Shareholding.\n2- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يقصد بمكاسب أو خسائر حقوق الملكية المستبعدة المكاسب أو الأرباح أو الخسائر المدرجة في صافي الدخل المحاسبي أو الخسارة المحاسبية للكيان التابع الناتجة عن الآتي:\n(أ) المكاسب والخسائر الناتجة عن التغيرات في القيمة العادلة لحصة ملكية، باستثناء حصة الملكية المحدودة.\n(ب) الأرباح أو الخسائر المتعلقة بحصة ملكية مدرجة وفق طريقة حقوق الملكية المحاسبية.\n(ج) المكاسب والخسائر الناتجة عن التصرف في حصة لا ملكية، باستثناء التصرف في حصة ملكية محدودة.\n2- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":23,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Equity Investment Inclusion Election","title_ar":"اختيار إدراج الاستثمار في حقوق الملكية","page":21,"text_en":"1- At the election of the Filing Constituent Entity, all Constituent Entities located in the Kingdom, and holding Ownership Interest, other than a Qualified Ownership Interest, shall include in their DMT Income or Loss the accounting gain, profit, or loss, adjusted as required by ARTICLE (19) of this Law, except for adjustments related to Excluded Equity Gain or Loss, with respect to any of the following:\n(a) Fair value gains and losses and impairments on that Ownership Interest, where the owner is taxable on a mark-to-market basis or on the impairment on the Ownership Interest, and the tax consequences of the mark-to-market movements or impairments on the Ownership Interest are reflected in income tax expense;\n(b) Fair value gains and losses and impairments on that Ownership Interest, where the owner is taxable on a realisation basis and its income tax expense includes deferred tax expense on the mark-to-market movement or impairments on the Ownership Interest;\n(c) Profit and loss attributable to that Ownership Interest, where the Ownership Interest is in a Tax Transparent Entity and the owner accounts for the interest using the equity method; (d) Dispositions of that Ownership Interest which give rise to gains or losses that are included in the owner’s domestic taxable income, excluding any gain fully offset, and the proportionate share of any gain partially offset, by any deduction or other similar relief on that gain.\n2- Notwithstanding sub-paragraph (a) of paragraph (1) of ARTICLE (46) and subparagraph (a) of paragraph (3) of ARTICLE\n(49) of this Law, and pursuant to an election made as per paragraph (1) of this Article, all Constituent Entities located in the Kingdom, and holding Ownership Interest, other than a Qualified Ownership Interest, shall include all current and deferred tax expense in respect of the amounts referred to in paragraph (1) of this Article in the calculation of their Adjusted Covered Taxes, subject to the provisions of this Law.\n3- An election pursuant to paragraph (1) of this Article shall be a Five-Year Election and cannot be revoked with respect to an Ownership Interest if a loss with respect to that Ownership Interest has been taken into account in the calculation of the DMT Income or Loss during the period in which the election was in effect.\n4- An election pursuant to paragraph (1) of this Article does not apply to a Portfolio Shareholding.\n5- The direct or indirect owner of an Ownership Interest in a Tax Transparent Entity shall treat any tax credits that flow through the Tax Transparent Entity in accordance with the ordinary requirements specified in this Law based on the nature of the credit received.\n6- The Regulations shall specify the implementing provisions and requirements for this Article.","text_ar":"1- عند القيام بالاختيار من قبل الكيان التابع المعين لتقديم الإقرار، يجب على جميع الكيانات التابعة الواقعة في المملكة والتي تحتفظ بحصة ملكية غير حصة ملكية مؤهلة، أن تدرج في دخل أو خسارة ضريبة الحد الأدنى المحلي العائد لها المكاسب أو الأرباح أو الخسائر المحاسبية المعدلة وفقاً للمادة (التاسعة عشرة) من هذا النظام، باستثناء التعديلات في مكاسب أو خسائر حقوق الملكية المستبعدة، وذلك فيما يتعلق بأي من الآتي:\n(أ) مكاسب وخسائر وانخفاض القيمة العادلة لحصة الملكية تلك، حيث يكون المالك خاضعاً للضريبة حسب سعر السوق أو على أساس انخفاض قيمة حصة الملكية، وتنعكس الآثار الضريبية الناتجة عن حركات سعر السوق أو انخفاض قيمة حصة الملكية في مصاريف ضريبة الدخل.\n(ب) مكاسب وخسائر وانخفاض القيمة العادلة لحصة الملكية، حيث يكون المالك خاضعاً للضريبة على أساس التحقق وتتضمن مصاريف ضريبة الدخل التابعة له المصاريف الضريبية المؤجلة على حركة سعر السوق أو انخفاض قيمة حصة الملكية.\n(ج) الأرباح والخسائر المنسوبة إلى حصة الملكية، حيث تكون حصة الملكية في كيان شفاف ضريبيا ويقوم المالك باحتساب الحصة وفقا لطريقة حقوق الملكية.\n(د) التصرف في حصة الملكية الذي يحقق مكاسب أو خسائر مدرجة في دخل المالك المحلي الخاضع للضريبة، باستثناء أي مكاسب تم تعويضها بالكامل، والحصة المتناسبة لأي مكاسب تم تعويضها جزئياً، وذلك بموجب خصم هذه المكاسب أو تطبيق أي إعفاء مماثل عليها.\n2- استثناءً من أحكام الفقرة الفرعية\n(أ) من الفقرة من المادة (السادسة والأربعين) ، والفقرة الفرعية\n(أ) من الفقرة (3) من المادة (التاسعة والأربعين) من هذا النظام، ووفقاً للاختيار المطبق بموجب الفقرة (1) من هذه المادة، يجب على جميع الكيانات التابعة الواقعة في المملكة والتي تحتفظ بحصة ملكية غير حصة ملكية مؤهلة، إدراج جميع المصاريف الضريبية الحالية والمؤجلة فيما يتعلق بالمبالغ المنصوص عليها في الفقرة (1) من هذه المادة عند احتساب الضرائب المشمولة المعدلة العائدة لها، وذلك مع مراعاة أحكام هذا النظام.\n3- يكون الاختيار وفقا للفقرة (1) من هذه المادة اختيارا لخمس سنوات ولا يجوز إلغاؤه بالنسبة لحصة ملكية في حال أُ خذت خسائر حصة الملكية بالاعتبار عند احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي خلال فترة سريان الاختيار.\n4- لا ينطبق الاختيار وفقا للفقرة (1) من هذه المادة على حصة الملكية المحدودة.\n5- يقوم المالك المباشر أو غير المباشر لحصة ملكية في كيان شفاف ضريبيا بمعاملة أي ائتمانات ضريبية تتدفق عبر الكيان الشفاف ضريبيا وفقا للمتطلبات العادية المنصوص عليها في هذا النظام حسب طبيعة الائتمان المستلم.\n6- تحدد اللائحة الأحكام والضوابط التنفيذية لتطبيق هذه المادة."},{"n":24,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Included Revaluation Method Gain or Loss","title_ar":"المكاسب أو الخسائر المدرجة وفق طريقة إعادة التقييم","page":22,"text_en":"1- Included Revaluation Method Gain or Loss means the net gain or loss, increased, or decreased by any associated Covered Taxes, for the Fiscal Year in respect of all property, plant and equipment that arises under an accounting method or practice that meets all of the following conditions:\n(a) Periodically adjusts the carrying value of such property to its fair value;\n(b) Records the changes in value in Other Comprehensive Income; (c) Does not subsequently report the gains or losses recorded in Other Comprehensive Income through profit and loss.\n2- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يقصد بالمكاسب أو الخسائر المدرجة وفق طريقة إعادة التقييم للسنة المالية، صافي المكاسب أو الخسائر بعد زيادة أو نقصان أي ضرائب مشمولة مرتبطة بها، المتعلقة بجميع الممتلكات والمنشآت والمعدات التي تنشأ بموجب طريقة أو ممارسة محاسبية تستوفي جميع الشروط الآتية:\n(أ) القيام بشكل دوري بتعديل القيمة الدفترية لهذه الممتلكات على أساس قيمتها العادلة.\n(ب) تسجيل التغيرات في القيمة تحت بند الدخل الشامل الآخر.\n(ج) عدم القيام لاحقاً بالاعتراف بالمكاسب أو الخسائر المسجلة في الدخل الشامل الآخر من خلال الربح والخسارة.\n2- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":25,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Asymmetric Foreign Currency Gains or Losses","title_ar":"مكاسب أو خسائر تحويل العملات الأجنبية","page":23,"text_en":"1- Asymmetric Foreign Currency Gains or Losses means foreign currency gains or losses of an entity whose Accounting Functional Currency and Tax Functional Currency are different and that are:\n(a) Included in the calculation of a Constituent Entity’s taxable income or loss and attributable to fluctuations in the exchange rate between its Accounting Functional Currency and its Tax Functional Currency;\n(b) Included in the calculation of a Constituent Entity’s Financial Accounting Net Income or Loss and attributable to fluctuations in the exchange rate between its Tax Functional Currency and its Accounting Functional Currency;\n(c) Included in the calculation of a Constituent Entity’s Financial Accounting Net Income or Loss and attributable to fluctuations in the exchange rate between a third foreign currency and its Accounting Functional Currency; or\n(d) Attributable to fluctuations in the exchange rate between a Third Foreign Currency and its Tax Functional Currency, whether or not such foreign currency gain or loss is included in taxable income.\n2- For the purpose of this Article, the following phrases shall have the meanings set out against each of them:\n(a) Tax Functional Currency: the functional currency used to determine the Constituent Entity’s taxable income or loss for a Covered Tax in the Kingdom.\n(b) Accounting Functional Currency: the functional currency used to determine the Constituent Entity’s Financial Accounting Net Income or Loss.\n(c) Third Foreign Currency: Currency that does not meet any of the definitions set out in subparagraphs (a) and (b) of this paragraph.\n3- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يقصد بمكاسب أو خسائر تحويل العملات الأجنبية مكاسب أو خسائر العملة الأجنبية للكيان الذي تختلف عملته الوظيفية المحاسبية عن عملته الوظيفية الضريبية، وتكون هذه المكاسب والخسائر أياً مما يأتي:\n(أ) مدرجة في احتساب دخل أو خسارة الكيان التابع الخاضعة للضريبة ومنسوبة إلى تقلبات في سعر الصرف بين العملة الوظيفية المحاسبية والعملة الوظيفية الضريبية الخاصة به.\n(ب) مدرجة في احتساب صافي الدخل المحاسبي أو الخسارة المحاسبية للكيان التابع ومنسوبة إلى تقلبات في سعر الصرف بين العملة الوظيفية الضريبية والعملة الوظيفية المحاسبية\n(ج) مدرجة في احتساب صافي الدخل المحاسبي أو الخسارة المحاسبية للكيان التابع ومنسوبة إلى التقلبات في سعر الصرف بين عملة أجنبية أخرى والعملة الوظيفية المحاسبية الخاصة به.\n(د) منسوبة إلى التقلبات في سعر الصرف بين عملة أجنبية أخرى وعملته الوظيفية الضريبية، سواء كانت مكاسب أو خسائر العملة الأجنبية هذه مدرجة في الدخل الخاضع للضريبة أم لا.\n2- لأغراض هذه المادة، يقصد بالعبارات الآتية المعاني الموضحة أمام كلٍ منها:\n(أ) العملة الوظيفية الضريبية: العملة الوظيفية المستخدمة لتحديد دخل أو خسارة الكيان التابع الخاضع للضريبة بالنسبة لضريبة مشمولة في المملكة\n(ب) العملة الوظيفية المحاسبية: العملة الوظيفية المستخدمة لتحديد صافي الدخل المحاسبي أو الخسارة المحاسبية للكيان التابع.\n(ج) ا لعم ل ة الأجنبية الأخرى : أي عملة لا ينطبق عليها أي من التعريفات المشار لها في الفقرتين الفرعيتين\n(أ) و\n(ب) من هذه الفقرة.\n3- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":26,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Treatment of Foreign Currency Exchange Gains or Losses as an Excluded Equity Gain or Loss Election","title_ar":"اختيار معالجة مكاسب أو خسائر تحويل العملات الأجنبية كمكاسب أو خسائر حقوق الملكية المستبعدة","page":24,"text_en":"1- Where an MNE Group hedges foreign currency movements in Ownership Interests in one or more Constituent Entities, a Filing Constituent Entity may make a Five-Year Election to treat foreign exchange gains or losses reflected in a Constituent Entity’s Financial Accounting Net Income or Loss as an Excluded Equity Gain or Loss for the purposes of sub-paragraph (c) of paragraph (1) of ARTICLE (19) of this Law.\n2- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- في لا حالات التي تقوم فيها مجموعة متعددة الجنسيات بالتحوط من تحويلات العملات الأجنبية المتعلقة بحصص ملكية في كيان تابع واحد أو أكثر، يجوز للكيان التابع المعين لتقديم الإقرار أن يقوم باختيار لخمس سنوات لمعالجة مكاسب أو خسائر تحويل العملات الأجنبية المنعكسة في صافي الدخل المحاسبي أو الخسارة المحاسبية للكيان التابع كمكاسب أو خسائر حقوق ملكية مستبعدة لأغراض الفقرة الفرعية\n(ج) من الفقرة (1) من المادة (التاسعة عشرة) من هذا النظام.\n2- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":27,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Policy Disallowed Expenses","title_ar":"المصاريف غير جائزة الحسم وفقاً للنظام","page":24,"text_en":"1- Policy Disallowed Expenses means any of the following:\n(a) Expenses accrued by the Constituent Entity for payments that are illegal or made, directly or indirectly, for an unlawful purpose in accordance with the applicable relevant laws and regulations, including bribes and unlawful kickbacks; and\n(b) Expenses accrued by the Constituent Entity for fines and penalties that equal or exceed the equivalent of, in Saudi Riyals, fifty (50) thousand euros or an equivalent in the currency in which the Constituent Entity’s Financial Accounting Net Income or Loss was calculated.\n2- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يقصد بالمصاريف غير جائزة الحسم وفقاً للنظام أيٌّ مما يلي:\n(أ) المصاريف المستحقة على الكيان التابع مقابل مدفوعات غير قانونية أو مدفوعات تمت، بشكل مباشر أو غير مباشر، لأغراض غير مشروعة بموجب الأنظمة واللوائح المعنية، بما في ذلك الرشاوى والعمولات غير المشروعة.\n(ب) المصاريف المستحقة على الكيان التابع من غرامات وجزاءات تعادل أو تتجاوز ، بالريال السعودي، ما يوازي خمسين (50) ألف يورو، أو ما يعادلها بالعملة التي تم بها احتساب صافي الدخل المحاسبي أو الخسارة المحاسبية للكيان التابع.\n2- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":28,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Prior Period Errors and Changes in Accounting Principles","title_ar":"أخطاء الفترات السابقة والتغيرات في المبادئ المحاسبية","page":24,"text_en":"1- Prior Period Errors and Changes in Accounting Principles means all changes in the opening equity of a Constituent Entity at the beginning of a Fiscal Year that are attributable to any of the following: A correction of an error in the determination of Financial Accounting Net Income of the Constituent Entity in a previous Fiscal Year that affected the income or expenses includible in the calculation of the DMT Income (a) or Loss of the Constituent Entity for that previous Fiscal Year, except to the extent such error correction resulted in a material decrease to a liability for Covered Taxes subject to ARTICLE (52) of this Law; A change in accounting principles or policy that affects income or expenses includible in the (b) calculation of the DMT Income or Loss of the Constituent Entity.\n2- For the purposes of this Article, material decrease to a liability for Covered Taxes shall mean a decrease that equals or exceeds, in Saudi Riyals, the equivalent of one (1) million euros.","text_ar":"1- يقصد بأخطاء الفترات السابقة والتغيرات في المبادئ المحاسبية جميع التغييرات في أرصدة حقوق الملكية الافتتاحية للكيان التابع بتاريخ بداية السنة المالية، التي تُنسب إلى أي من الآتي: تصحيح خطأ في تحديد صافي الدخل المحاسبي للكيان التابع في سنة مالية سابقة مما أثر على الدخل أو المصاريف التي يمكن إدراجها في احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي للكيان\n(أ) التابع عن تلك السنة المالية السابقة، إلا إذا أدى تصحيح الخطأ إلى انخفاض جوهري في الالتزام بالضرائب المشمولة بموجب المادة (الثانية والخمسين) من هذا النظام. تغيير في المبادئ أو السياسة المحاسبية يؤثر على\n(ب) الدخل أو المصاريف التي يمكن إدراجها في احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي للكيان التابع.\n2- لأغراض هذه المادة، فإن الانخفاض الجوهري في الالتزام بالضرائب المشمولة يعني انخفاضاً يساوي أو يتجاوز، بالريال السعودي، ما يوازي مليون (1,000,000) يورو."},{"n":29,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Debt Releases under Prescribed Circumstances","title_ar":"الحالات المحددة للإعفاء من الديون","page":25,"text_en":"1- The Filing Constituent Entity may make an Annual Election to exclude from the calculation of a Constituent Entity’s DMT Income or Loss the amount of a bad debt release included in the Financial Accounting Net Income or Loss of such Constituent Entity, subject to meeting the conditions specified in the Regulations.\n2- Where an election is made pursuant to the provisions of paragraph (1) of this Article, and where all necessary conditions are met, all the following shall apply:\n(a) Income from the debt release in the Financial Accounting Net Income or Loss shall be excluded from the borrowing Constituent Entity’s DMT Income or Loss;\n(b) Any current tax expense in relation to the debt release and any related deferred tax expense arising from a reduction in domestic tax attributes in relation to the debt release shall be excluded from the borrowing Constituent Entity’s Adjusted Covered Taxes.\n3- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يجوز للكيان التابع المعين لتقديم الإقرار إجراء اختيار سنوي لاستبعاد الدخل الناتج عن الإعفاء من الديون ، المدرج في صافي الدخل المحاسبي أو الخسارة المحاسبية لكيان تابع، من احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي العائد لذلك الكيان التابع متى ما توافرت الشروط المنصوص عليها في اللائحة.\n2- إذا تم الاختيار وفقاً لأحكام الفقرة (1) من هذه المادة، وفي حال توافر جميع الشروط الضرورية، يُطبق كل ما يلي\n(أ) يتم استبعاد الدخل الناتج عن الإعفاء من الديون المدرج في صافي الدخل المحاسبي أو الخسارة المحاسبية من دخل أو خسارة ضريبة الحد الأدنى المحلي للكيان التابع المقترض.\n(ب) يتم استبعاد أي مصاريف ضريبية حالية متعلقة بالإعفاء من الديون وأي مصاريف ضريبية مؤجلة ذات صلة وناجمة عن تخفيض في الأصول والالتزامات الضريبية المحلية و المتعلقة بالإعفاء من الديون، من الضرائب المشمولة المعدلة للكيان التابع المقترض.\n3- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":30,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Stock-Based Compensation Expense Election","title_ar":"اختيار مصاريف التعويض على أساس الأسهم","page":25,"text_en":"1- For the purposes of computing the DMT Income or Loss, and at the election of the Filing Constituent Entity, a Constituent Entity may substitute the amount allowed as a deduction in the calculation of its taxable income in its location for the amount expensed in its financial accounts for a cost or expense of such Constituent Entity that was paid with stock-based compensation.\n2- If the stock-based compensation expense arises in connection with an option that expires without exercise, the Constituent Entity must include the total amount previously deducted in the calculation of its DMT Income or Loss for the Fiscal Year in which the option expires. 3- The election under this Article shall be a FiveYear Election and must be applied consistently to the stock-based compensation of all Constituent Entities located in the Kingdom for the year in which the election is made and all subsequent Fiscal Years.\n4- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- لأغراض احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي، وعند القيام بالاختيار من قبل الكيان التابع المعين لتقديم الإقرار، يجوز للكيان التابع أن يستبدل المبلغ المسموح به كخصم لاحتساب دخله الخاضع للضريبة في موقعه، مقابل مبلغ المصاريف في حساباته المالية، بتكلفة أو مصاريف هذا الكيان التابع المسددة بتعويضات على أساس الأ
