ctive Tax Rate","part_ar":"احتساب معدل الضريبة الفعلي والضريبة التكميلية","title_en":"Eligible Tangible Assets","title_ar":"الأصول الملموسة المؤهلة","page":45,"text_en":"1- Eligible Tangible Assets means the following:\n(a) Property, plant, and equipment located in the jurisdiction;\n(b) Natural resources located in the jurisdiction;\n(c) A lessee’s right of use of tangible assets located in the jurisdiction; or\n(d) A licence or similar arrangement from the government for the use of immovable property or exploitation of natural resources that entails significant investment in tangible assets.\n2- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يُقصد بالأصول الملموسة المؤهلة أي مما يلي:\n(أ) الممتلكات والمنشآت والمعدات الواقعة في الولاية القضائية.\n(ب) الموارد الطبيعية الواقعة في الولاية القضائية.\n(ج) حق المستأجر في استخدام الأصول الملموسة الواقعة في الولاية القضائية.\n(د) ترخيص أو أي ترتيب مماثل يحصل عليه من الحكومة لاستخدام الممتلكات غير المنقولة أو استغلال الموارد الطبيعية الذي يستلزم استثمارا كبيراً في أصول ملموسة.\n2- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":62,"part":5,"part_en":"Computation of Effective Tax Rate","part_ar":"احتساب معدل الضريبة الفعلي والضريبة التكميلية","title_en":"Eligible Payroll Costs and Eligible Tangible Assets of a Permanent Establishment or Flow-Through Entity","title_ar":"تكاليف الرواتب المؤهلة والأصول الملموسة المؤهلة لمنشأة دائمة أو كيان شفاف مالياً","page":45,"text_en":"1- For the purposes of ARTICLES (59) and (60) of this Law, the Eligible Payroll Costs and Eligible Tangible Assets of a Constituent Entity that is a Permanent Establishment shall be those included in its separate financial accounts as determined by paragraph (1) of ARTICLE (40) of this Law and adjusted in accordance with paragraph (2) of ARTICLE\n(40) of this Law, provided that the Eligible Employees and Eligible Tangible Assets are located in the jurisdiction where the Permanent Establishment is located.\n2- Eligible Employees means employees, including part-time employees, of a Constituent Entity that is a member of the MNE Group and independent contractors participating in the ordinary operating activities of the MNE Group under the direction and control of the MNE Group.\n3- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- لأغراض المادتين (التاسعة والخمسين) و(الستين) من هذا النظام، فإن تكاليف الرواتب المؤهلة والأصول الملموسة المؤهلة لكيان تابع يكون منشأة دائمة، هي تلك المدرجة في حساباته المالية المنفصلة بموجب الفقرة (1) من المادة (الأربعين) من هذا النظام والمعدلة بموجب الفقرة (2) من المادة (الأربعين) من هذا النظام، شريطة أن يكون الموظفون المؤهلون والأصول الملموسة المؤهلة واقعين في الولاية القضائية التي تقع فيها المنشأة الدائمة.\n2- يقصد بالموظفين المؤهلين كافة الموظفين، بما في ذلك الموظفون بدوام جزئي، في كيان تابع عضو في مجموعة متعددة الجنسيات والمقاولين المستقلين المشاركين في أنشطة التشغيل العادية للمجموعة المتعددة الجنسيات تحت توجيهها وسيطرتها.\n3- تحدد اللائحة الأحكام والضوابط التنفيذية اللازمة لتطبيق هذه المادة."},{"n":63,"part":5,"part_en":"Computation of Effective Tax Rate","part_ar":"احتساب معدل الضريبة الفعلي والضريبة التكميلية","title_en":"Additional Current Top-Up Tax","title_ar":"الضريبة التكميلية الحالية الإضافية","page":46,"text_en":"1- If it is required or permitted to recalculate the Effective Tax Rate and Domestic Top-up Tax for a prior Fiscal Year pursuant to the ETR Adjustment Articles, the Effective Tax Rate and Domestic Top-up Tax for the prior Fiscal Year shall be recalculated in accordance with articles from ARTICLE (53) to ARTICLE (62) of this Law after taking into account the adjustments to Adjusted Covered Taxes and DMT Income or Loss required by the relevant ETR Adjustment Articles.\n2- Any amount of incremental Domestic Top-up Tax resulting from the recalculation described in paragraph (1) of this Article shall be treated as Additional Current Top-up Tax under ARTICLE (56) of this Law arising in the current Fiscal Year.\n3- In a Fiscal Year in which there is no Net DMT Income for the Kingdom, if the Adjusted Covered Taxes for the Kingdom are less than zero and less than the Expected Adjusted Covered Taxes Amount, the Constituent Entities in the Kingdom shall be treated as having Additional Current Top-up Tax for the Kingdom under paragraphs (1) and (2) of this Article arising in the current Fiscal Year equal to the difference between these amounts.\n4- For the purposes of paragraph (3) of this Article, the Expected Adjusted Covered Taxes Amount shall be equal to the Net DMT Income or Loss for the Kingdom multiplied by the Minimum Rate.\n5- If there is Additional Current Top-up Tax attributable to a recalculation under paragraph\n(1) of this Article and the Kingdom does not have a Net DMT Income for the current Fiscal Year, the DMT Income of each Constituent Entity located in the Kingdom shall be equal to the result of the Domestic Top-up Tax allocated to such Entity under paragraphs (1) and (2) of ARTICLE (57) of this Law divided by the Minimum Rate.\n6- The amount of Additional Current Top-up Tax allocated to each Constituent Entity for the purposes of this Article shall be allocated only to Constituent Entities that record an Adjusted Covered Taxes amount that is less than zero and less than the DMT Income or Loss of such Constituent Entity multiplied by the Minimum Rate. The allocation for each of those Constituent Entities shall be made pro-rata based upon an amount calculated by:\n(a) Multiplying DMT Income or Loss by the Minimum Rate;\n(b) Then deducting Adjusted Covered Taxes from the product resulting from sub-paragraph (a) of this paragraph.\n7- ETR Adjustment Articles are ARTICLE (34), paragraphs (5) to (7) of ARTICLE (49), paragraphs (1) to (5) of ARTICLE (52) and paragraph (8) of ARTICLE (52) of this Law.","text_ar":"1- إذا كان مطلوباً أو مسموحاً بإعادة احتساب معدل الضريبة الفعلي والضريبة التكميلية المحلية لسنة مالية سابقة وفقاً لمواد تعديل معدل الضريبة الفعلي، يتم إعادة احتساب معدل الضريبة الفعلي والضريبة التكميلية المحلية للسنة المالية السابقة بموجب المواد من المادة (الثالثة والخمسين) إلى المادة (الثانية والستين) من هذا النظام بعد الأخذ بالاعتبار التعديلات على الضرائب المشمولة المعدلة ودخل أو خسارة ضريبة الحد الأدنى المحلي المطلوبة وفقاً لمواد تعديل معدل الضريبة الفعلي المعني ة.\n2- يُعد أي مبلغ من الضريبة التكميلية المحلية الناتج عن إعادة الاحتساب المنصوص عليه في الفقرة من هذه المادة ضريبة تكميلية حالية إضافية وفقاً للمادة (السادسة والخمسين) من هذا النظام ناشئة في السنة المالية الحالية.\n3- في السنة المالية التي لا يكون فيها صافي دخل ضريبة الحد الأدنى المحلي للمملكة، إذا كانت الضرائب المشمولة المعدلة للمملكة أقل من الصفر وأقل من مبلغ الضرائب المشمولة المعدلة المتوقعة، تُعامل الكيانات التابعة الواقعة في المملكة على أن لديها ضريبة تكميلية حالية إضافية في المملكة بموجب الفقرتين (1) و (2) من هذه المادة تنشأ خلال السنة المالية الحالية مساوية للفرق بين هذيْن المبلغيْن.\n4- لأغراض الفقرة (3) من هذه المادة، يساوي مبلغ الضرائب المشمولة المعدلة المتوقعة صافي دخل أو خسارة ضريبة الحد الأدنى المحلي للمملكة مضروبا في الحد الأدنى.\n5- في حال وجود ضريبة تكميلية حالية إضافية منسوبة إلى إعادة الاحتساب بموجب الفقرة (1) من هذه المادة، وليس للمملكة صافي دخل ضريبة حد أدنى محلي للسنة المالية الحالية، يجب أن يساوي دخل ضريبة الحد الأدنى المحلي لكل كيان تابع واقع في المملكة نتيجة الضريبة التكميلية المحلية المخصصة لذلك الكيان بموجب الفقرتين (1) و (2) من المادة (السابعة والخمسين) من هذا النظام مقسومة على الحد الأدنى.\n6- يتم تخصيص مبلغ الضريبة التكميلية الحالية الإضافية المخصص لكل كيان تابع لأغراض هذه المادة فقط إلى الكيانات التابعة التي تسجل مبلغ ضرائب مشمولة معدلة يساوي أقل من الصفر وأقل من دخل أو خسارة ضريبة الحد الأدنى المحلي لذلك الكيان التابع مضروباً في الحد الأدنى. يتم التخصيص لكل من تلك الكيانات التابعة بالتناسب حسب مبلغ محتسب وفقا للآتي\n(أ) ضرب دخل أو خسارة ضريبة الحد الأدنى المحلي في الحد الأدنى.\n(ب) ومن ثم خصم الضرائب المشمولة المعدلة من النتيجة الناجمة من الفقرة الفرعية\n(أ) من هذه الفقرة.\n7- يُقصد بمواد تعديل معدل الضريبة الفعلي: المادة (الرابعة والثلاثون)، والفقرات (5) إلى (7) من المادة (التاسعة والأربعين)، والفقرات (1) إلى (5) والفقرة (8) من المادة (الثانية والخمسين) من هذا النظام."},{"n":64,"part":5,"part_en":"Computation of Effective Tax Rate","part_ar":"احتساب معدل الضريبة الفعلي والضريبة التكميلية","title_en":"De Minimis Exclusion","title_ar":"استبعاد المستوى الأدنى","page":47,"text_en":"1- At the election of the Filing Constituent Entity, and notwithstanding the requirements otherwise stipulated in Part Five (5) of this Law, the Domestic Top-up Tax for the Constituent Entities located in the Kingdom shall be deemed to be zero for a Fiscal Year where the following applies for such Fiscal Year:\n(a) The Average DMT Revenue of the Kingdom is less than, in Saudi Riyals, the equivalent of ten\n(10) million euros; and\n(b) The Average DMT Income or Loss of the Kingdom is a loss or is less than, in Saudi Riyals, the equivalent of one (1) million euros.\n2- The election under this Article shall be an Annual Election.\n3- For the purposes of paragraph (1) of this Article:\n(a) The Average DMT Revenue of the Kingdom shall be the average DMT Revenue of the Kingdom for the current and the two preceding Fiscal Years;\n(b) The Average DMT Income or Loss of the Kingdom shall be the average DMT Income or Loss of the Kingdom for the current and the two preceding Fiscal Years.\n4- If there were no Constituent Entities with DMT Revenue or DMT Losses that were located in the Kingdom in the first or second preceding Fiscal Year, such year or years shall be excluded from the calculation of the Average DMT Revenue and the Average DMT Income or Loss of the Kingdom.\n5- For the purposes of paragraphs (3) and (4) of this Article: (a) The DMT Revenue of the Kingdom for a Fiscal Year shall be the sum of the Revenue of all Constituent Entities located in the Kingdom for such Fiscal Year, taking into account the adjustments calculated in accordance with Part Three (3) of this Law; and\n(b) The DMT Income or Loss of the Kingdom for a Fiscal Year shall be the Net DMT Income of the Kingdom, if any, or the Net DMT Loss of the Kingdom.\n6- An election under this Article shall not apply to a Constituent Entity that is a Stateless Constituent Entity or an Investment Entity.\n7- The Revenue and DMT Income or Loss of a Stateless Constituent Entity and the Revenue and DMT Income or Loss of an Investment Entity shall be excluded from the calculation in paragraph (5) of this Article.\n8- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- استثناءً من المتطلبات المنصوص عليها في الجزء الخامس من هذا النظام، وتبعاً لاختيار الكيان التابع المعين لتقديم الإقرار، تُعد الضريبة التكميلية المحلية للكيانات التابعة الواقعة في المملكة على أنها صفر للسنة المالية في حال تحقق جميع ما يأتي خلال تلك السنة المالية:\n(أ) يقل متوسط إيرادات ضريبة الحد الأدنى المحلي للمملكة عن، بالريال السعودي، ما يوازي عشرة (10) ملايين يورو.\n(ب) يكون متوسط دخل أو خسارة ضريبة الحد الأدنى المحلي للمملكة خسارة أو مبلغاً يقل عن، بالريال السعودي، ما يوازي مليون (1,000,000) يورو.\n2- يكون الاختيار بموجب هذه المادة اختياراً سنوياً.\n3- لأغراض الفقرة (1) من هذه المادة:\n(أ) يكون متوسط إيرادات ضريبة الحد الأدنى المحلي للمملكة هو متوسط إيرادات ضريبة الحد الأدنى المحلي للمملكة للسنة المالية الحالية والسنتيْن الماليتيْن السابقتيْن.\n(ب) يكون متوسط دخل أو خسارة ضريبة الحد الأدنى المحلي للمملكة هو متوسط دخل أو خسارة ضريبة الحد الأدنى المحلي للمملكة للسنة المالية الحالية والسنتيْن الماليتيْن السابقتيْن.\n4- في حال لم تكن هناك كيانات تابعة ذات إيرادات ضريبة حد أدنى محلي أو خسائر ضريبة حد أدنى محلي واقعة في المملكة في السنة المالية الأولى أو الثانية السابقة، تُستبعد تلك السنة أو السنتان من احتساب متوسط إيرادات ضريبة الحد الأدنى المحلي ومتوسط دخل أو خسارة ضريبة الحد الأدنى المحلي للمملكة.\n5- لأغراض الفقرتين (3) و (4) من هذه المادة:\n(أ) تساوي إيرادات ضريبة الحد الأدنى المحلي في المملكة لسنة مالية إجمالي إيرادات جميع الكيانات التابعة الواقعة في المملكة لتلك السنة المالية، أخذاً بالاعتبار التعديلات المحتسبة وفقاً للجزء الثالث من هذا النظام.\n(ب) يكون دخل أو خسارة ضريبة الحد الأدنى المحلي لسنة مالية صافي دخل ضريبة الحد الأدنى المحلي للمملكة، إن وجد، أو صافي خسائر ضريبة الحد الأدنى المحلي للمملكة.\n6- لا ينطبق الاختيار بموجب هذه المادة على كيان تابع عديم الجنسية أو كيان استثماري.\n7- يجب استبعاد الإيرادات ودخل أو خسائر ضريبة الحد الأدنى المحلي العائدة للكيان التابع عديم الجنسية وكذلك إيرادات ودخل أو خسائر ضريبة الحد الأدنى المحلي العائدة للكيان الاستثماري من الاحتساب المنصوص عليه في الفقرة (5) من هذه المادة.\n8- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":65,"part":5,"part_en":"Computation of Effective Tax Rate","part_ar":"احتساب معدل الضريبة الفعلي والضريبة التكميلية","title_en":"Minority-Owned Constituent Entities","title_ar":"الكيان التابع المملوك من خلال حصة أقلية","page":48,"text_en":"1- The calculations of the Effective Tax Rate and Domestic Top-up Tax for the Kingdom in accordance with Parts Three (3) to Five (5), Parts Eight (8) and Nine (9) of this Law with respect to members of a Minority-Owned Subgroup shall apply as if they were a separate MNE Group. The Adjusted Covered Taxes and DMT Income or Loss of members of a Minority-Owned Subgroup shall be excluded from the determination of the remainder of the MNE Group’s Effective Tax Rate and Net DMT Income in ARTICLE (53) of this Law.\n2- The Effective Tax Rate and Domestic Top-up Tax of a Minority-Owned Constituent Entity that is not a member of a Minority-Owned Subgroup shall be calculated on an entity basis in accordance with Parts Three (3) to Five (5), Parts Eight (8) and Nine (9) of this Law. The Adjusted Covered Taxes and DMT Income or Loss of the Minority-Owned Constituent Entity shall be excluded from the determination of the remainder of the MNE Group’s Effective Tax Rate and Net DMT Income in ARTICLE\n(53) of this Law. This provision does not apply if the Minority-Owned Constituent Entity is an Investment Entity.\n3- Minority-Owned Constituent Entity is a Constituent Entity where the Ultimate Parent Entity has a direct or indirect Ownership Interest in that Entity of thirty percent (30%) or less. 4- Minority-Owned Subgroup means a MinorityOwned Parent Entity and its Minority-Owned Subsidiaries, where:\n(a) Minority-Owned Parent Entity is a MinorityOwned Constituent Entity that holds, directly or indirectly, the Controlling Interests of another Minority-Owned Constituent Entity, except where the Controlling Interests of the first-mentioned Entity are held, directly or indirectly, by another Minority-Owned Constituent Entity.\n(b) Minority-Owned Subsidiary is a MinorityOwned Constituent Entity whose Controlling Interests are held, directly or indirectly, by a Minority-Owned Parent Entity.","text_ar":"1- يطبق احتساب معدل الضريبة الفعلي والضريبة التكميلية المحلية للمملكة وفقاً للأجزاء من الثالث إلى الخامس والجزأين الثامن والتاسع من هذا النظام بالنسبة لأعضاء مجموعة فرعية مملوكة من خلال حصة أقلية كما لو كانت مجموعة متعددة الجنسيات منفصلة. كما تُستبعد الضرائب المشمولة المعدلة ودخل أو خسارة ضريبة الحد الأدنى المحلي لأعضاء مجموعة فرعية مملوكة من خلال حصة أقلية من تحديد ما تبقى من معدل الضريبة الفعلي وصافي دخل ضريبة الحد الأدنى المحلي للمجموعة المتعددة الجنسيات بموجب المادة (الثالثة والخمسين) من هذا النظام.\n2- يتم احتساب معدل الضريبة الفعلي والضريبة التكميلية المحلية لكيان تابع مملوك من خلال حصة أقلية ليس عضواً في مجموعة فرعية مملوكة من خلال حصة أقلية، على مستوى الكيان وفقاً للأجزاء من الثالث إلى الخامس والجزأين الثامن والتاسع من هذا النظام . كما تُستبعد الضرائب المشمولة المعدلة ودخل أو خسارة ضريبة الحد الأدنى المحلي لكيان تابع مملوك من خلال حصة أقلية من تحديد ما تبقى من معدل الضريبة الفعلي وصافي دخل ضريبة الحد الأدنى المحلي للمجموعة المتعددة الجنسيات وفقا للمادة (الثالثة والخمسين) من هذا النظام. ولا ينطبق هذا الحكم إذا كان الكيان التابع المملوك من خلال حصة أقلية هو كيان استثمار ي.\n3- الكيان التابع المملوك من خلال حصة أقلية هو الكيان التابع الذي تكون فيه حصة الملكية المباشرة أو غير المباشرة للكيان الأم النهائي ثلاثين بالمائة (%30) أو أقل.\n4- يُقصد بالمجموعة الفرعية المملوكة من خال لحصة أقلية الكيان الأم المملوك من خلال حصة أقلية والشركات التابعة المملوكة من خلال حصة أقلية، مع مراعاة ما يلي: الكيان الأم المملوك من خلال حصة أقلية هو الكيان التابع المملوك من خلال حصة أقلية الذي يمتلك، بشكل مباشر أو غير مباشر، الحصص المسيطرة\n(أ) لكيان تابع آخر مملوك من خلال حصة أقلية، باستثناء الحالات التي تكون فيها الحصص ا لمس يطرةللكيانالمذكورأ ولاً مملوكة ، بشكل مباشر أو غير مباشر، من قبل كيان تابع آخر مملوك من خلال حصة أقلية. الشركة التابعة المملوكة من خلال حصة أقلية هي\n(ب) الكيان التابع المملوك من خلال حصة أقلية الذي يمتلك كيان أم مملوك من خلال حصة أقلية حصصه المسيطرة بشكل مباشر أو غير مباشر."},{"n":66,"part":6,"part_en":"Safe Harbour and Transitional Penalty Relief Period","part_ar":"الملاذ الآمن والمرحلة الانتقالية لتخفيض العقوبات","title_en":"DMT Safe Harbour","title_ar":"الملاذ الآمن لضريبة الحد الأدنى المحلي","page":49,"text_en":"1- At the election of the Filing Constituent Entity, and notwithstanding Part Five (5) of this Law, the Domestic Top-up Tax for the Kingdom shall be deemed to be zero for a Fiscal Year when the Constituent Entities located in the Kingdom are eligible for a DMT Safe Harbour pursuant to the conditions stipulated in ARTICLES (67), )69(, or (70) of this Law and applicable for that Fiscal Year.\n2- At the election of the Filing Constituent Entity, and notwithstanding Part Five (5) of this Law, the amount of the Domestic Top-up Tax for the Kingdom that corresponds to Qualified Tax Incentives for the Fiscal Year shall be deemed to be zero for a Fiscal Year when the Constituent Entities located in the Kingdom are eligible for a DMT Safe Harbour pursuant to the conditions stipulated in ARTICLE (71) of this Law and applicable for that Fiscal Year.\n3- An election made for the Kingdom under paragraph (1) or paragraph (2) of this Article shall not apply in case all of the following apply:\n(a) The Kingdom could be allocated Domestic Top-up Tax under this Law if the Effective Tax Rate in the Kingdom computed in accordance with Part Five (5) of this Law was below the Minimum Rate;\n(b) The Authority notifies the Liable Constituent Entity or Entities, within thirty six (36) months after the filing of the Domestic Top-up Tax Return or GloBE Information Return of specific facts and circumstances that may have materially affected the eligibility of the Constituent Entities located in the Kingdom for the relevant safe harbour and invites the Liable Constituent Entity or Entities to clarify within six (6) months the effect of those facts and circumstances on the eligibility of those Constituent Entities for that safe harbour;\n(c) The Liable Constituent Entity or Entities fail(s) to demonstrate within the response period that those facts and circumstances did not materially affect the eligibility of the Constituent Entities for the relevant safe harbour.\n4- For the purpose of this Law, a DMT Safe Harbour includes the Transitional CbCR Safe Harbour, the Simplified ETR Safe Harbour, the NMCE Simplified Calculations Safe Harbour or the Substance-based Tax Incentive Safe Harbour.\n5- Liable Constituent Entity (or Entities) means one or several Constituent Entities located in the Kingdom that could be liable for Top-up Tax in the event that the Domestic Minimum Tax Safe Harbour provided for in this Article is not applied.\n6- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- تبعاً لاختيار الكيان التابع المعين لتقديم الإقرار، واستثناءً من أحكام الجزء الخامس من هذا النظام، تُعد الضريبة التكميلية المحلية للمملكة صفرا للسنة المالية عندما تكون الكيانات التابعة الواقعة في المملكة مؤهلة للحصول على ملاذ آمن لضريبة الحد الأدنى المحلي وفقا للشروط المنصوص عليها في المواد (السابعة والستين) أو (التاسعة والستين) أو (السبعين) من هذا النظام والمطبقة على تلك السنة المالية.\n2- تبعاً لاختيار الكيان التابع المعين لتقديم الإقرار، واستثناءً من أحكام الجزء الخامس من هذا النظام، يُعد مبلغ الضريبة التكميلية المحلية للمملكة الموازية للحوافز الضريبية القائمة على الجوهر المؤهلة للسنة المالية صفراً للسنة المالية إذا كان الكيان التابع الواقع في المملكة مؤهلاً للحصول على ملاذ آمن لضريبة الحد الأدنى المحلي وفقا للشروط المنصوص عليها في المادة (الحادية والسبعين) من هذا النظام والمطبقة على تلك السنة المالية. - 3 لا يسري الاختيار الذي تم إجراؤه للمملكة بموجب الفقرة (1) أو الفقرة (2) من هذه المادة في حال توفر جميع ما يأتي:\n(أ) يمكن تخصيص ضريبة تكميلية محلية للمملكة بموجب هذا النظام إذا كان معدل الضريبة الفعلي في المملكة المحتسب وفقاً للجزء الخامس من هذا النظام يقل عن الحد الأدنى.\n(ب) تقوم الهيئة بإخطار الكيان أو الكيانات التابعة المسؤولة عن الضريبة، خلال ستة وثلاثين شهراً بعد تقديم إقرار الضريبة التكميلية المحلية أو إقرار معلومات قواعد مكافحة تآكل الوعاء الضريبي العالمي، بحقائق وظروف محددة قد يكون لها تأثير جوهري على أهلية الكيانات التابعة الواقعة في المملكة للحصول على الملاذ الآمن المعني وتدعو الكيان أو الكيانات التابعة المسؤولة عن الضريبة، إلى تقديم توضيح خلال مدة ستة (6) أشهر عن تأثير تلك الحقائق والظروف على أهلية تلك الكيانات التابعة للحصول على ذلك الملاذ الآمن.\n(ج) عدم قيام الكيان أو الكيانات التابعة المسؤولة عن الضريبة، خلال فترة الاستجابة، بإثبات عدم تأثير الحقائق والظروف بشكل جوهري على أهلية الكيانات التابعة للحصول على الملاذ الآمن المعني.\n4- لأغراض النظام، يشمل الملاذ الآمن لضريبة الحد الأدنى المحلي الملاذ الآمن الانتقالي للتقرير الخاص بكل دولة أو الملاذ الآمن لمعدل الضريبة الفعلي المبسط أو الملاذ الآمن للاحتساب المبسط للكيانات غير الجوهرية أو الملاذ الآمن للحوافز الضريبية القائمة على الجوهر.\n5- يقصد بالكيان أو الكيانات التابعة المسؤولة عن الضريبة كيان تابع أو عدة كيانات تابعة واقعة في المملكة والتي يمكن أن تكون خاضعة للضريبة التكميلية المحلية في حال عدم تطبيق الملاذ الآمن لضريبة الحد الأدنى المحلي المنصوص عليه في هذه المادة.\n6- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":67,"part":6,"part_en":"Safe Harbour and Transitional Penalty Relief Period","part_ar":"الملاذ الآمن والمرحلة الانتقالية لتخفيض العقوبات","title_en":"Transitional CbCR Safe Harbour","title_ar":"الملاذ الآمن الانتقالي للتقرير الخاص بكل دولة","page":50,"text_en":"1- Notwithstanding ARTICLE (56) of this Law, and for the purposes of the election under paragraph (1) of ARTICLE (66) of this Law, Constituent Entities located in the Kingdom shall be eligible for the Transitional CbCR Safe Harbour, during the Transition Period where:\n(a) The MNE Group reports CbCR Total Revenue of less than, in Saudi Riyals, the equivalent of ten (10) million euros and Profit (or Loss) before Income Tax of less than, in Saudi Riyals, the equivalent of one (1) million euros in the Kingdom on its Qualified CbC Report for the Fiscal Year;\n(b) The MNE Group has a Simplified ETR that is equal to or greater than the Transition Rate in the Kingdom for the Fiscal Year; or\n(c) The MNE Group’s Profit (or Loss) before Income Tax in the Kingdom is equal to or less than the Substance-based Income Exclusion amount, as calculated under this Law, for constituent entities that are resident in the Kingdom for the purposes of its Qualified CbC Report for the Fiscal Year, and located in the Kingdom as per the provisions of ARTICLE (5) of this Law.\n2- The Transition Rate is seventeen percent (17%) for Fiscal Years beginning in 2027.\n3- The election under paragraph (1) of this Article shall only apply if the MNE Group prepares a Qualified CbC Report.\n4- Qualified CbC Report means a CbC Report prepared using Qualified Financial Statements. Qualified Financial Statements means either:\n(a) The accounts used to prepare the Consolidated Financial Statements of the Ultimate Parent Entity for all Entities located in the Kingdom; or\n(b) Separate financial statements of each Constituent Entity, for all Entities located in the Kingdom, provided they are prepared in accordance with either an Acceptable Financial Accounting Standard or an Authorised Financial Accounting Standard if the information contained in such statements is maintained based on that accounting standard and it is reliable; or\n(c) In the case of a Constituent Entity that is not included in an MNE Group’s Consolidated Financial Statements on a line-by-line basis solely due to size or materiality grounds, the financial accounts of that Constituent Entity that are used for preparation of the MNE Group’s CbC Report.\n5- For the purposes of this Law, CbCR Total Revenue means an MNE Group’s Total Revenues in the Kingdom as reported on its Qualified CbC Report.\n6- Profit (or Loss) before Income Tax means an MNE Group’s Profit (or Loss) before Income Tax in the Kingdom as reported in its Qualified CbC Report.\n7- For the purpose of sub-paragraph (b) of paragraph (1) of this Article, the Simplified ETR is the amount calculated by dividing the Kingdom’s Simplified Covered Taxes by the Profit (or Loss) before Income Tax for the Kingdom, where Simplified Covered Taxes means the income tax and Zakat expense as reported on the MNE Group’s Qualified Financial Statements for the Kingdom, after eliminating any taxes that are not Covered Taxes and uncertain tax positions reported in the MNE Group’s Qualified Financial Statements. 8- Transition Period means any Fiscal Year beginning on or before 31 December 2027 but not including a Fiscal Year that ends after 30 June 2029.\n9- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- استثناءً من أحكام المادة (السادسة والخمسين) من هذا النظام، ولأغراض الاختيار بموجب الفقرة من المادة (السادسة والستين) من هذا النظام، تكون الكيانات التابعة الواقعة في المملكة مؤهلة للملاذ الآمن الانتقالي للتقرير الخاص بكل دولة، خلال الفترة الانتقالية التي تتحقق فيها أي من الحالات الآتية:\n(أ) تصرح المجموعة المتعددة الجنسيات عن إجمالي إيرادات التقرير الخاص بكل دولة يقل عن، بالريال السعودي، ما يوازي عشرة (10) ملايين يورو وأرباح (أو خسائر) قبل فرض ضريبة الدخل تقل عن، بالريال السعودي، ما يوازي مليون (1,000,000) يورو في المملكة في التقرير الخاص بكل دولة المؤهل الخاص بها للسنة المالية.\n(ب) لدى المجموعة المتعددة الجنسيات معدل ضريبة فعلي مبسط يساوي أو يتجاوز المعدل الانتقالي في المملكة للسنة المالية.\n(ج) الأرباح (أو الخسائر) قبل فرض ضريبة الدخل التابعة للمجموعة المتعددة الجنسيات تساوي أو تقل عن مبلغ الاستبعاد على أساس جوهر النشاط، كما هو محتسب بموجب هذا النظام، لكيانات تابعة مقيمة في المملكة لأغراض التقرير الخاص بكل دولة المؤهل -الخاص بها - للسنة المالية، وواقعة في المملكة بموجب أحكام المادة (الخامسة) من هذا النظام.\n2- المعدل الانتقالي هو سبعة عشر بالمائة للسنوات المالية التي تبدأ في سنة 2027م.\n3- لا يسري الاختيار المشار إليه في الفقرة (1) من هذه المادة إلا إذا كان التقرير الخاص بكل دولة الذي تستند إليه المجموعة المتعددة الجنسيات مؤهلاً.\n4- يُعد التقرير الخاص بكل دولة مؤهلاً إذا أُعد باستخدام القوائم المالية المؤهلة ، ويُقصد بالقوائم المالية المؤهلة أي مما يلي:\n(أ) الحسابات المستخدمة لإعداد القوائم المالية الموحدة للكيان الأم النهائي لجميع الكيانات الواقعة في المملكة.\n(ب) القوائم المالية المنفصلة لكل كيان تابع، لجميع الكيانات الواقعة في المملكة، شريطة أن يتم إعدادها إما وفقاً للمعايير المحاسبية المالية المقبولة ، أو وفقاً للمعايير المحاسبية المالية المعتمدة متى كانت المعلومات الواردة في القوائم موثوقة ومعدة وفقاً لتلك المعايير المحاسبية.\n(ج) إذا لم يُدرج كيان تابع في القوائم المالية الموحدة للمجموعة المتعددة الجنسيات على أساس كل بند على حدة بسبب الحجم أو الجوهر فقط، تُستخدم الحسابات المالية لذلك الكيان التابع لإعداد التقرير الخاص بكل دولة للمجموعة المتعددة الجنسيات.\n5- لأغراض النظام، يُقصد بإجمالي إيرادات التقرير الخاص بكل دولة إجمالي إيرادات المجموعة المتعددة الجنسيات في المملكة كما هي معروضة في التقرير الخاص بكل دولة المؤهل الخاص بها.\n6- يُقصد ب الأرباح (أ والخسائر) قبل فرض ضريبة الدخل أرباح (أو خسائر) المجموعة المتعددة الجنسيات قبل فرض ضريبة الدخل في المملكة كما هي مسجلة في التقرير الخاص بكل دولة المؤهل الخاص بها.\n7- لأغراض الفقرة الفرعية\n(ب) من الفقرة (1) من هذه المادة، يحتسب معدل الضريبة الفعلي المبسط من خلال قسمة الضرائب المشمولة المبسطة في المملكة على الأرباح (أو الخسائر) قبل فرض ضريبة الدخل الخاصة بالمملكة، ويقصد بالضرائب المشمولة المبسطة مصاريف ضريبة الدخل والزكا ة كما هي مسجلة في القوائم المالية المؤهلة للمجموعة المتعددة الجنسيات في المملكة، بعد استبعاد أي ضرائب غير الضرائب المشمولة وأوضاع ضريبية غير مؤكدة مسجلة في القوائم المالية المؤهلة للمجموعة المتعددة الجنسيات.\n8- يقصد بالفترة الانتقالية أي سنة مالية تبدأ في أو قبل 31 ديسمبر 2027م ولا تشمل سنة مالية تنتهي بعد 30 يونيو 2029م.\n9- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":68,"part":6,"part_en":"Safe Harbour and Transitional Penalty Relief Period","part_ar":"الملاذ الآمن والمرحلة الانتقالية لتخفيض العقوبات","title_en":"Exclusions from Transitional CbCR Safe Harbour","title_ar":"الاستبعادات من الملاذ الآمن الانتقالي للتقرير الخاص بكل دولة","page":52,"text_en":"The following Constituent Entities and MNE Groups shall be excluded from the Transitional CbCR Safe Harbour:\n1- Stateless Constituent Entities;\n2- Multi-parented MNE Groups where a single Qualified CbC Report does not include the information of the combined groups;\n3- MNE Groups that have not benefited in the Kingdom from the Transitional CbCR Safe Harbour in a previous Fiscal Year in which the MNE Group is subject to this Law or the GloBE Rules, unless the MNE Group did not have any Constituent Entities in the Kingdom in the previous year.","text_ar":"تُستبعد الكيانات التابعة والمجموعات المتعددة الجنسيات الآتية من الملاذ الآمن الانتقالي للتقرير الخاص بكل دولة:\n1- الكيانات التابعة عديمة الجنسية.\n2- المجموعات المتعددة الجنسيات ذات كيانات أم متعددة في حال كان التقرير الخاص بكل دولة المؤهل المنفرد لا يتضمن معلومات المجموعات المجمعة.\n3- المجموعة المتعددة الجنسيات التي لم تستفد من الملاذ الآمن الانتقالي للتقرير الخاص بكل دولة في المملكة عن سنة مالية سابقة كانت خاضعة فيها لهذا النظام أو قواعد مكافحة تآكل الوعاء الضريبي العالمي، ما لم يكن ذلك لعدم وجود كيانات تابعة لها في المملكة في تلك السنة."},{"n":69,"part":6,"part_en":"Safe Harbour and Transitional Penalty Relief Period","part_ar":"الملاذ الآمن والمرحلة الانتقالية لتخفيض العقوبات","title_en":"Simplified ETR Safe Harbour","title_ar":"الملاذ الآمن لمعدل الضريبة الفعلي المبسط","page":52,"text_en":"1- Notwithstanding ARTICLE (56) of this Law, and for the purposes of the election under paragraph (1) of ARTICLE (66) of this Law, Constituent Entities located in the Kingdom shall be eligible for the Simplified ETR Safe Harbour, subject to conditions specified in the Regulations.\n2- The Regulations shall specify the controls and implementing provisions for this Article.","text_ar":"1- استثناءً من أحكام المادة (السادسة والخمسين من هذا النظام، ولأغراض الاختيار بموجب الفقرة من المادة (السادسة والستين) من هذا النظام، تكون الكيانات التابعة الواقعة في المملكة مؤهلة للملاذ الآمن لمعدل الضريبة الفعلي المبسط، مع مراعاة الشروط المحددة في اللائحة.\n2- تحدد اللائحة الضوابط و الأحكام التنفيذية اللازمة لتطبيق هذه المادة."},{"n":70,"part":6,"part_en":"Safe Harbour and Transitional Penalty Relief Period","part_ar":"الملاذ الآمن والمرحلة الانتقالية لتخفيض العقوبات","title_en":"NMCE Simplified Calculations Safe Harbour","title_ar":"الملاذ الآمن للاحتساب المبسط للكيانات غير الجوهرية","page":52,"text_en":"1- Notwithstanding ARTICLE (56) of this Law, and for the purposes of the election under paragraph (1) of ARTICLE (66) of this Law, Constituent Entities located in the Kingdom shall be eligible for the NMCE Simplified Calculations Safe Harbour, subject to conditions specified in the Regulations.\n2- The Regulations shall specify the controls and implementing provisions for this Article.","text_ar":"1- استثناءً من أحكام المادة (السادسة والخمسين) من هذا النظام، ولأغراض الاختيار بموجب الفقرة من المادة (السادسة والستين) من هذا النظام، تكون الكيانات التابعة الواقعة في المملكة مؤهلة للملاذ الآمن للاحتساب المبسط للكيانات غير الجوهرية، مع مراعاة الشروط المحددة في اللائحة.\n2- تحدد اللائحة الضوابط و الأحكام التنفيذية اللازمة لتطبيق هذه المادة."},{"n":71,"part":6,"part_en":"Safe Harbour and Transitional Penalty Relief Period","part_ar":"الملاذ الآمن والمرحلة الانتقالية لتخفيض العقوبات","title_en":"Substance-Based Tax Incentive Safe Harbour","title_ar":"الملاذ الآمن للحوافز الضريبية القائمة على الجوهر","page":52,"text_en":"1- Notwithstanding ARTICLE (56) of this Law, and for the purposes of the election under paragraph (2) of ARTICLE (66) of this Law, Constituent Entities located in the Kingdom shall be eligible for the Substance-based Tax Incentive Safe Harbour, subject to conditions specified in the Regulations.\n2- The Regulations shall specify the controls and implementing provisions for this Article.","text_ar":"1- استثناءً من أحكام المادة (السادسة والخمسين) من هذا النظام، ولأغراض الاختيار بموجب الفقرة من المادة (السادسة والستين) من النظام، تكون الكيانات التابعة الواقعة في المملكة مؤهلة للملاذ الآمن للحوافز الضريبية القائمة على الجوهر، مع مراعاة الشروط المحددة في اللائحة.\n2- تحدد اللائحة الضوابط والأحكام التنفيذية اللازمة لتطبيق هذه المادة."},{"n":72,"part":6,"part_en":"Safe Harbour and Transitional Penalty Relief Period","part_ar":"الملاذ الآمن والمرحلة الانتقالية لتخفيض العقوبات","title_en":"Penalty Relief Transitional Phase","title_ar":"المرحلة الانتقالية لتخفيض العقوبات","page":53,"text_en":"1- During the Transition Period, no penalties or sanctions should apply in connection with the filing of a Domestic Top-up Tax Return and GloBE Information Return where the Authority considers that an MNE Group has taken “reasonable measures” to ensure the correct application of this Law.\n2- The Authority may consider that an MNE Group has taken reasonable measures where the MNE Group can demonstrate that it has acted in good faith to understand and comply with this Law.","text_ar":"1- خلال الفترة الانتقالية، لا تنطبق أي غرامات أو عقوبات تتعلق بتقديم إقرار الضريبة التكميلية المحلية وإقرار معلومات قواعد مكافحة تآكل الوعاء الضريبي العالمي في حال اعتبرت الهيئة أن المجموعة المتعددة الجنسيات اتخذت \"تدابير معقولة\" لضمان التطبيق الصحيح لهذا الن ظام.\n2- يجوز للهيئة اعتبار أن المجموعة المتعددة الجنسيات اتخذت تدابير معقولة إذا أثبتت تلك المجموعة أنها تصرفت بحسن نية لفهم أحكام النظام والامتثال لها."},{"n":73,"part":7,"part_en":"Tax Liability","part_ar":"الالتزامات الضريبية","title_en":"Taxpayer Liability","title_ar":"التزامات المكلف","page":53,"text_en":"1- Each Taxpayer shall be liable for the Domestic Top-up Tax and other related amounts payable by that Taxpayer in the Kingdom as per the provisions of this Law.\n2- Taxpayers that are members of an MNE Group shall be jointly liable for the Domestic Top-up Tax and other related amounts payable in the Kingdom as per the provisions of this Law, for the Fiscal Years when these Entities are members of the MNE Group.\n3- Each Joint Venture located in the Kingdom and Joint Venture Subsidiary of a Joint Venture Group located in the Kingdom shall be jointly liable to pay a Domestic Top-up Tax for each Fiscal Year of the MNE Group that includes the Joint Venture or Joint Venture Subsidiary. The Domestic Top-up Tax for the Fiscal Year shall be equal to the Domestic Top-up Tax for the Joint Venture Group determined for the Joint Venture Group. Joint Venture Group means a Joint Venture and its Joint Venture Subsidiaries.\n4- Members that are partners in a partnership, other than a member that is a limited partner and is not a general partner, that is located in the Kingdom and that is part of an MNE Group shall be jointly and severally liable for the Domestic Top-up Tax and other related amounts payable in the Kingdom by the MNE Group as per the provisions of this Law, for the Fiscal Years when the partnership is a member of the MNE Group.\n5- The joint liability under this Article for a Fiscal Year can be limited to one or more Entities of the MNE Group following approval by the Authority.","text_ar":"1- يكون كل مكلف مسؤولاً عن الضريبة التكميلية المحلية والمبالغ الأخرى ذات الصلة الواجبة السداد من قبل ذلك المكلف في المملكة وفقاً لأحكام هذا النظام.\n2- يكون المكلفون الأعضاء في مجموعة متعددة الجنسيات مسؤولين بالتضامن عن الضريبة التكميلية المحلية والمبالغ الأخرى المرتبطة الواجبة السداد في المملكة بموجب أحكام هذا النظام، وذلك عن السنوات المالية التي تكون خلالها تلك الكيانات أعضاء في المجموعة المتعددة الجنسيات.\n3- يكون كل مشروع مشترك واقع في المملكة، وكل شركة تابعة لمشروع مشترك عضو في مجموعة المشروع المشترك واقع في المملكة، مسؤولاً بالتضامن عن سداد الضريبة التكميلية المحلية المحددة لمجموعة المشروع المشترك عن كل سنة مالية للمجموعة المتعددة الجنسيات التي تشمل المشروع المشترك أو الشركة التابعة له. ويقصد بمجموعة المشروع المشترك المشروع المشترك والشركات التابعة له.\n4- يكون الشركاء في الشراكة الواقعة في المملكة التي تُعد جزءا من مجموعة متعددة الجنسيات، باستثناء الشريك الموصي في الشراكة وليس شريكاً متضامناً، مسؤولين بالتضامن عن الضريبة التكميلية المحلية والمبالغ الأخرى الواجبة السداد في المملكة من قبل المجموعة المتعددة الجنسيات بموجب أحكام هذا النظام، وذلك عن السنوات المالية التي تكون خلالها الشراكة عضواً في المجموعة المتعددة الجنسيات.\n5- يجوز أن تقتصر المسؤولية التضامنية لسنة مالية وفقاً لأحكام هذه المادة على كيان واحد أو أكثر من المجموعة المتعددة الجنسيات تبعاً لموافقة الهيئة."},{"n":74,"part":8,"part_en":"Corporate Restructurings and Holding Structures","part_ar":"إعادة هيكلة الشركات وهيكلة الشركات القابضة","title_en":"Application of Consolidated Revenue Threshold to Group Mergers and Demergers","title_ar":"تطبيق حد الإيرادات الموحد على عمليات الاندماج والفصل بين المجموعات","page":54,"text_en":"1- For the purposes of ARTICLE (2) of this Law:\n(a) If two or more Groups merge to form a single Group in any of the four Fiscal Years prior to the tested Fiscal Year, the consolidated revenue threshold of the MNE Group for any Fiscal Year prior to the merger shall be deemed to be met for that year, provided the sum of the Revenue included in each of their Consolidated Financial Statements for that same year is equal to or greater than, in Saudi Riyals, the equivalent of seven hundred and fifty (750) million euros.\n(b) Where an Entity that is not a member of any Group (the target) merges with an Entity or Group (the acquirer) in the tested Fiscal Year and the target or acquirer does not have Consolidated Financial Statements in any of the four Fiscal Years prior to the tested Fiscal Year due to the fact that it was not a member of any Group in that year, the consolidated revenue threshold of the MNE Group shall be deemed to be met for that year, provided the sum of the Revenue included in each of their Financial Statements or Consolidated Financial Statements for that year is equal to or greater than, in Saudi Riyals, the equivalent of seven hundred and fifty (750) million euros.\n(c) Where a single MNE Group within the scope of this Law demerges into two or more Groups, the consolidated revenue threshold shall be deemed to be met by a demerged Group where the following conditions are met:\n(1) With respect to the first tested Fiscal Year ending after the demerger, the demerged Group has annual Revenues amounting to, in Saudi Riyals, the equivalent of seven hundred and fifty (750) million euros or more in that year;\n(2) With respect to the second to fourth tested Fiscal Years ending after the demerger, the demerged Group has annual Revenues amounting to, in Saudi Riyals, the equivalent of seven hundred and fifty (750) million euros or more in at least two of the Fiscal Years following the year of the demerger.\n2- For the purposes of paragraph (1) of this Article, a merger is any arrangement where any of the following applies:\n(a) All or substantially all of the Group Entities of two or more separate Groups are brought under common control such that they constitute Group Entities of a combined Group;\n(b) An Entity that is not a member of any Group is brought under common control with another Entity or Group such that they constitute Group Entities of a combined Group.\n3- For the purposes of paragraph (1) of this Article, a demerger is any arrangement where the Group Entities of a single Group are separated into two or more Groups that are no longer consolidated by the same Ultimate Parent Entity.","text_ar":"1- لأغراض المادة (الثانية) من هذا النظام:\n(أ) في حال دمج مجموعتين أو أكثر لتكوين مجموعة مفردة في أي من السنوات المالية الأربع (4) التي تسبق السنة المالية المختبرة، يعتبر حد الإيرادات الموحد للمجموعة المتعددة الجنسيات لأي سنة مالية قبل عملية الدمج مست وفي الت لك السنة ، شريطة أن يكون إجمالي الإيرادات المدرجة في كل من القوائم المالية الموحدة للمجموعات المدمجة لتلك السنة يساوي أو يتجاوز، بالريال السعودي، ما يوازي سبعمائة وخمسين (750) مليون يورو.\n(ب) في حال دمج كيان ليس عضواً في أي مجموعة (المستهدف) مع كيان أو مجموعة (المستحوذ) في السنة المالية المختبرة ولم يكن لدى لا مست هدف أو المستحوذ قوائم مالية موحدة في أي من السنوات المالية الأربع (4) التي تسبق السنة المالية المختبرة بسبب أنه لم يكن عضوا في أي مجموعة خلال تلك السنة، يُعتبر حد الإيرادات الموحد للمجموعة المتعددة الجنسيات مستوفياً عن تلك السنة، شريطة أن يكون إجمالي الإيرادات المدرجة في القوائم المالية أو القوائم المالية الموحدة العائدة لكل منهما لتلك السنة يساوي أو يتجاوز، بالريال السعودي، ما يوازي سبعمائة وخمسين مليون يورو.\n(ج) في حال قيام مجموعة منفردة متعددة الجنسيات ضمن نطاق هذا النظام بالانفصال إلى مجموعتين أو أكثر، تُعد المجموعة المنفصلة مستوفية لحد الإيرادات الموحد إذا توافرت الشروط الآتية: (1) فيما يتعلق بالسنة المالية المختبرة الأولى والتي تنتهي بعد عملية الانفصال، يجب أن تبلغ أو تتجاوز الإيرادات السنوية للمجموعة المنفصلة ، بالريال السعودي، ما يوازي سبعمائة وخمسين مليون يورو في تلك السنة. (2) فيما يتعلق بالسنوات المالية المختبرة من الثانية إلى الرابعة التي تنتهي بعد عملية الانفصال، يجب أن تبلغ أو تتجاوز الإيرادات السنوية للمجموعة المنفصلة، بالريال السعودي، ما يوازي سبعمائة وخمسين (750) مليون يورو في سنتين ماليتين على الأقل بعد سنة الانفصال.\n2- لأغراض الفقرة (1) من هذه المادة، عملية الدمج هي أي ترتيب ينطبق عليه أي مما يأتي:\n(أ) أن تخضع جميع أو معظم كيانات المجموعة المتألفة من مجموعتين منفصلتين أو أكثر لسيطرة مشتركة حيث تشكل كيانات مجموعة ضمن مجموعة مندمجة.\n(ب) أن يخضع كيان ليس عضوا في أي مجموعة لسيطرة مشتركة مع كيان آخر أو مجموعة أخرى بحيث تصبح كيانات مجموعة ضمن مجموعة مندمجة.\n3- لأغراض الفقرة (1) من هذه المادة، يقصد بعملية الانفصال أي ترتيب تنقسم فيه كيانات المجموعة في مجموعة واحدة إلى مجموعتين أو أكثر لم تعد مندمجة تحت ذات الكيان الأم النهائي."},{"n":75,"part":8,"part_en":"Corporate Restructurings and Holding Structures","part_ar":"إعادة هيكلة الشركات وهيكلة الشركات القابضة","title_en":"Constituent Entities Joining and Leaving an MNE Group","title_ar":"الكيانات التابعة التي تنضم إلى مجموعة متعددة الجنسيات أو تغادرها","page":55,"text_en":"1- Except to the extent stipulated in paragraph\n(2) of this Article, where an Entity (the target) becomes or ceases to be a Constituent Entity of an MNE Group as a result of a transfer of direct or indirect Ownership Interests in such Entity during the Fiscal Year (the acquisition year), the following provisions shall apply:\n(a) Where the target joins or leaves a Group or the target becomes the Ultimate Parent Entity of a new Group, the target shall be treated as a member of the Group for the purposes of this Law if any portion of its assets, liabilities, income, expenses or cash flows are included on a line-by-line basis in the Consolidated Financial Statements of the Ultimate Parent Entity in the acquisition year;\n(b) In the acquisition year, an MNE Group shall take into account only the Financial Accounting Net Income or Loss and Adjusted Covered Taxes of the target that are taken into account in the Consolidated Financial Statements of the Ultimate Parent Entity;\n(c) In the acquisition year and each succeeding year, the target shall determine its DMT Income or Loss and Adjusted Covered Taxes using its historical carrying value of the assets and liabilities; (d) The calculation of the target’s Eligible Payroll Costs under ARTICLE (59) of this Law shall take into account only those costs reflected in the Consolidated Financial Statements of the Ultimate Parent Entity;\n(e) The calculation of the carrying value of the target’s Eligible Tangible Assets for the purposes of ARTICLE (60) of this Law shall be adjusted proportionally to correspond with the length of the relevant Fiscal Year that the target was a member of the MNE Group;\n(f) The deferred tax assets and deferred tax liabilities of a Constituent Entity that are transferred between MNE Groups shall be taken into account under this Law by the acquiring MNE Group in the same manner and to the same extent as if the acquiring MNE Group controlled the Constituent Entity when such assets and liabilities arose; and\n(g) The deferred tax liabilities of a target that have previously been included in its Total Deferred Tax Adjustment Amount shall be treated as reversed for the purposes of applying paragraphs (5) to (7) of ARTICLE (49) of this Law by the disposing MNE Group and treated as arising in the acquisition year for the purposes of applying paragraphs (5) to (7) of ARTICLE (49) of this Law by the acquiring MNE Group, except that in such cases any subsequent reduction to Covered Taxes under paragraphs (5) to (7) of ARTICLE (49) of this Law shall have effect in the year in which the amount is recaptured.\n2- For the purposes of this Law, the acquisition or disposal of a Controlling Interest in a Constituent Entity shall be treated as an acquisition or disposal of the assets and liabilities if the jurisdiction in which the target Constituent Entity is located, or in the case of a Tax Transparent Entity, the jurisdiction in which the assets are located, treats the acquisition or disposal of that Controlling Interest in the same or similar manner as an acquisition or disposition of the assets and liabilities and imposes a Covered Tax on the seller based on the difference between the tax basis and the consideration paid in exchange for the Controlling Interest or the fair value of the assets and liabilities.\n3- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- مع مراعاة أحكام الفقرة (2) من هذه المادة، تنطبق الأحكام الآتية عندما يصبح الكيان (المستهدف) أو لم يعد كياناً تابعاً لمجموعة متعددة الجنسيات نتيجة لنقل حصص الملكية المباشرة أو غير المباشرة في هذا الكيان خلال السنة المالية (سنة الاستحواذ)\n(أ) عندما ينضم المستهدف إلى مجموعة أو يغادرها أو عندما يصبح المستهدف الكيان الأم النهائي لمجموعة جديدة، يُعامل المستهدف كعضو في المجموعة لأغراض هذا النظام إذا كان أي جزء من أصوله، أو التزاماته، أو دخله، أو مصاريفه، أو تدفقاته النقدية مدرجاً على أساس كل بند على حدة في القوائم المالية الموحدة للكيان الأم النهائي في سنة الاستحواذ.\n(ب) على المجموعة المتعددة الجنسيات، في سنة الاستحواذ، أن تأخذ بالاعتبار فقط صافي الدخل المحاسبي أو الخسارة المحاسبية والضرائب المشمولة المعدلة للمستهدف التي تم أخذها بالاعتبار في القوائم المالية الموحدة للكيان الأم النهائي.\n(ج) على المستهدف أن يقوم في سنة الاستحواذ وكل سنة تالية، بتحديد دخل أو خسارة ضريبة الحد الأدنى المحلي والضرائب المشمولة المعدلة باستخدام القيمة الدفترية التاريخية للأصول والالتزامات.\n(د) عند احتساب تكاليف الرواتب المؤهلة للمستهدف بموجب المادة (التاسعة والخمسين) من هذا النظام، يجب الأخذ بالاعتبار فقط تلك التكاليف التي تنعكس في القوائم المالية الموحدة للكيان الأم النهائي.\n(هـ) لأغراض المادة (الستين) من هذا النظام، يجب تعديل احتساب القيمة الدفترية للأصول الملموسة المؤهلة للمستهدف بشكل تناسبي لتتوافق مع مدة السنة المالية المعنية التي كان من خلالها المستهدف عضواً في المجموعة المتعددة الجنسيات.\n(و) يجب على المجموعة المتعددة الجنسيات المستحوذة أن تأخذ بالاعتبار الأصول الضريبية المؤجلة والالتزامات الضريبية المؤجلة العائدة لكيان تابع والتي يتم نقلها بين مجموعات متعددة الجنسيات بموجب هذا النظام، بذات الطريقة وبذات القدر كما لو كانت المجموعة المتعددة الجنسيات المستحوذة تسيطر على الكيان التابع عند إنشاء هذه الأصول والالتزامات.\n(ز) يجب على المجموعة المتعددة الجنسيات المتصرفة أن تعامل الالتزامات الضريبية المؤجلة للمستهدف التي تم إدراجها سابقاً في إجمالي مبلغ تسوية الضريبة المؤجلة، على أنها معكوسة لأغراض تطبيق الفقرات من (5) إلى (7) من المادة (التاسعة والأربعين) من هذا النظام، وتعامل من قبل المجموعة المتعددة الجنسيات المستحوذة على أنها ناشئة في سنة الاستحواذ لأغراض تطبيق الفقرات من (5) إلى (7) من المادة (التاسعة والأربعين) من هذا النظام، إلا أنه في مثل هذه الحالات أي تخفيض الحق في الضرائب المشمولة بموجب الفقرات من (5) إلى (7) من المادة (التاسعة والأربعين) من هذا النظام يكون سارياً في السنة التي يتم فيها استرداد المبلغ.\n2- لأغراض هذا النظام، يجب معاملة الاستحواذ أو التصرف في الحصة المسيطرة في الكيان التابع على أنه استحواذ أو تصرف في الأصول والالتزامات، إذا كانت الولاية القضائية التي يقع فيها الكيان التابع المستهدف، أو الولاية القضائية التي تقع فيها الأصول في حالة كيان شفاف ضريبياً ، تعامل الاستحواذ أو التصرف في تلك الحصة المسيطرة بذات الطريقة أو بطريقة مشابهة للاستحواذ أو التصرف في الأصول والالتزامات وتفرض ضريبة مشمولة على البائع بناءً على الفرق بين الأساس الضريبي والمبلغ المسدد مقابل الحصة المسيطرة أو القيمة العادلة للأصول واللاتزا مات.\n3- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":76,"part":8,"part_en":"Corporate Restructurings and Holding Structures","part_ar":"إعادة هيكلة الشركات وهيكلة الشركات القابضة","title_en":"Transfer of Assets and Liabilities","title_ar":"تحويل الأصول والالتزامات","page":56,"text_en":"1- In the case of a disposition or acquisition of assets and liabilities, a disposing Constituent Entity shall include the gain or loss on disposition in the calculation of its DMT Income or Loss and an acquiring Constituent Entity shall determine its DMT Income or Loss using its carrying value of the acquired assets and liabilities determined under the accounting standard used in preparing Consolidated Financial Statements of the Ultimate Parent Entity.\n2- If the disposition or acquisition of assets and liabilities is part of a DMT Reorganisation, paragraph (1) of this Article shall not apply, and the following shall apply:\n(a) A disposing Constituent Entity shall exclude any gain or loss on the disposition from the calculation of its DMT Income or Loss; and\n(b) An acquiring Constituent Entity shall determine its DMT Income or Loss after the acquisition using the disposing Entity’s carrying values of the acquired assets and liabilities upon disposition.\n3- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- في حال التصرف أو الاستحواذ على الأصول والالتزامات يدرج الكيان التابع المتصرف المكاسب أو الخسارة الناتجة عن التصرف في احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي التابعة له ويحدد الكيان التابع المستحوذ قيمة دخل أو خسارة ضريبة الحد الأدنى المحلي التابعة له باستخدام القيمة الدفترية للأصول والالتزامات المستحوذ عليها والمحددة بموجب المعايير المحاسبية المستخدمة في إعداد القوائم المالية الموحدة للكيان الأم النهائي.\n2- إذا كان التصرف في الأصول والالتزامات أو الاستحواذ عليها جزءا من إعادة هيكلة ضريبة الحد الأدنى المحلي، فلا تنطبق أحكام الفقرة (1) من هذه المادة، وينطبق الآتي:\n(أ) يستبعد الكيان التابع المتصرف أي مكاسب أو خسارة ناتجة عن التصرف من احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي التابعة له.\n(ب) يحدد الكيان التابع المستحوذ دخل أو خسارة ضريبة الحد الأدنى المحلي التابعة له بعد الاستحواذ باستخدام القيم الدفترية للكيان المتصرف في الأصول والالتزامات المستحوذ عليها عند التصرف.\n3- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":77,"part":8,"part_en":"Corporate Restructurings and Holding Structures","part_ar":"إعادة هيكلة الشركات وهيكلة الشركات القابضة","title_en":"DMT Reorganisation","title_ar":"إعادة هيكلة ضريبة الحد الأدنى المحلي","page":57,"text_en":"-1 A DMT Reorganisation means a transformation or transfer of assets and liabilities such as in a merger, demerger, liquidation, or similar transaction where all of the following conditions apply:\n(a) The consideration for the transfer is, in whole or in significant part, equity interests issued by the acquiring Constituent Entity or by a person connected with the acquiring Constituent Entity, or, in the case of a liquidation, equity interests of the target, or, when no consideration is provided, where the issuance of an equity interest would have no economic significance;\n(b) The disposing Constituent Entity’s gain or loss on those assets is not subject to tax, in whole or in part;\n(c) The acquiring Constituent Entity is required, as per the tax laws of the jurisdiction in which it is located, to compute taxable income after the disposition or acquisition using the disposing Constituent Entity’s tax basis in the assets, adjusted for any Non-qualifying Gain or Loss on the disposition or acquisition. 2- For the purposes of this Article, Non-qualifying Gain or Loss means the lesser of the gain or loss of:\n(a) The disposing Constituent Entity arising in connection with a DMT Reorganisation that is subject to tax in the disposing Constituent Entity’s location and\n(b) The financial accounting gain or loss arising in connection with the DMT Reorganisation.","text_ar":"1- يُقصد بإعادة هيكلة ضريبة الحد الأدنى المحلي تحويل الأصول والالتزامات أو نقلها كما هو الحال في عمليات الدمج، أو الانفصال، أو التصفية، أو المعاملات المماثلة ، متى توافرت جميع الشروط الآتية:\n(أ) يجب أن يكون مقابل عملية النقل ، كليا أو بنسبة كبيرة، مشاركة في حقوق ملكية صادرة عن الكيان التابع المستحوذ أو عن شخص مرتبط بالكيان التابع المستحوذ، أو، في حال التصفية، مشاركة في حقوق ملكية المستهدف، أو، في حال عدم تقديم أي مقابل، حيث لا توجد أهمية اقتصادية لإصدار مشاركة في حقوق ملكية.\n(ب) لا تخضع للضريبة، كلياً أو جزئياً، مكاسب أو خسائر الكيان التابع المتصرف في تلك الأصول.\n(ج) يفرض على الكيان التابع المستحوذ وفقاً للأنظمة الضريبية للولاية القضائية التي يقع فيها، احتساب الدخل الخاضع للضريبة بعد التصرف أو الاستحواذ باستخدام الأساس الضريبي للكيان التابع المتصرف في الأصول، معدلاً لأي مكاسب أو خسائر غير مؤهلة نتيجة التصرف أو الاستحواذ.\n2- لأغراض تطبيق هذه المادة، يقصد بالمكاسب أو الخسائر غير المؤهلة، المكاسب أو الخسائر الأقل ما بين:\n(أ) مكاسب أو خسارة الكيان التابع المتصرف الناشئة فيما يتعلق بإعادة هيكلة ضريبة الحد الأدنى المحلي الخاضعة للضريبة في موقع الكيان التابع المتصرف. و\n(ب) المكاسب المحاسبية المالية أو الخسارة المحاسبية المالية الناشئة فيما يتعلق بإعادة هيكلة ضريبة الحد الأدنى المحلي."},{"n":78,"part":8,"part_en":"Corporate Restructurings and Holding Structures","part_ar":"إعادة هيكلة الشركات وهيكلة الشركات القابضة","title_en":"Joint Ventures Rules","title_ar":"قواعد المشاريع المشتركة","page":58,"text_en":"1- This Law shall apply to a Joint Venture and its Joint Venture Subsidiaries located in the Kingdom for each Fiscal Year.\n2- Parts Three (3) to Five (5), Parts Eight (8) and Nine (9), and ARTICLE (66) of this Law shall apply for the purposes of computing any Domestic Top-up Tax of the Joint Venture and its Joint Venture Subsidiaries as if they were Constituent Entities of a separate MNE Group and as if the Joint Venture was the Ultimate Parent Entity of that Group.","text_ar":"1- تسري أحكام هذا النظام على المشروع المشترك والشركات التابعة للمشروع المشترك الواقعة في المملكة عن كل سنة مالية.\n2- تطبق أحكام الأجزاء من الثالث إلى الخامس، والجزأين الثامن والتاسع، والمادة (السادسة والستين) من هذا النظام، لأغراض احتساب أي ضريبة تكميلية محلية للمشروع المشترك والشركات التابعة للمشروع المشترك، كما لو كانت كيانات تابعة لمجموعة متعددة الجنسيات منفصلة، وكان المشروع المشترك هو الكيان الأم النهائي لتلك المجموعة."},{"n":79,"part":8,"part_en":"Corporate Restructurings and Holding Structures","part_ar":"إعادة هيكلة الشركات وهيكلة الشركات القابضة","title_en":"Joint Venture","title_ar":"المشروع المشترك","page":58,"text_en":"A Joint Venture means an Entity whose financial results are reported under the equity method in the Consolidated Financial Statements of the Ultimate Parent Entity provided that the Ultimate Parent Entity holds directly or indirectly at least fifty percent (50%) of its Ownership Interests. A Joint Venture does not include any of the following:\n1- An Ultimate Parent Entity of an MNE Group that is subject to GloBE Rules or this Law;\n2- An Excluded Entity as defined by paragraph\n(1) of ARTICLE (12) of this Law;\n3- An Entity whose Ownership Interests held by the MNE Group are held directly through an Excluded Entity referred to in paragraph (1) of ARTICLE (12) of this Law and the Entity meets any of the following conditions:\n(a) The Entity operates exclusively or almost exclusively to hold assets or invest funds for the benefit of its investors;\n(b) The Entity carries out activities that are ancillary to those carried out by the Excluded Entity; (c) Substantially all of the Entity’s income is excluded from the calculation of the DMT Income or Loss in accordance with subparagraphs (b) and (c) of paragraph (1) of ARTICLE (19) of this Law.\n4- An Entity that is held by an MNE Group composed exclusively of Excluded Entities;\n5- A Joint Venture Subsidiary.","text_ar":"يُقصد بالمشروع المشترك الكيان الذي يتم التصريح عن نتائجه المالية وفق طريقة حقوق الملكية في القوائم المالية الموحدة للكيان الأم النهائي، شريطة أن يمتلك الكيان الأم النهائي بشكل مباشر أو غير مباشر ما لا يقل عن خمسين بالمائة (50%) من حصص الملكية فيه . لا يتضمن المشروع المشترك أي مما يلي:\n1- كيان أم نهائي لمجموعة متعددة الجنسيات خاضعة لقواعد مكافحة تآكل الوعاء الضريبي العالمي أو لأحكام هذا النظام.\n2- كيان مستبعد كما تم تعريفه في الفقرة (1) من المادة (الثانية عشرة) من هذا النظام.\n3- كيان تحتفظ المجموعة المتعددة الجنسيات بحصص ملكيته مباشرة من خلال كيان مستبعد مشار إليه في الفقرة (1) من المادة (الثانية عشرة) من هذا النظام ويستوفي الكيان أياً من الشروط الآتية:\n(أ) يعمل الكيان بشكل حصري أو شبه حصري للاحتفاظ بالأصول أو لاستثمار الأموال لصالح مستثمريه.\n(ب) ينفذ الكيان الأنشطة المساندة للأنشطة التي ينفذها الكيان المستبعد.\n(ج) يُستبعد معظم دخل الكيان من احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي بموجب الفقرتين الفرعيتين\n(ب) و(ج) من الفقرة (1) من المادة (التاسعة عشرة) من هذا النظام.\n4- الكيان الذي تملكه مجموعة متعددة الجنسيات تتألف حصرياً من كيانات مستبعدة.\n5- شركة تابعة لمشروع مشترك."},{"n":80,"part":8,"part_en":"Corporate Restructurings and Holding Structures","part_ar":"إعادة هيكلة الشركات وهيكلة الشركات القابضة","title_en":"Multi-Parented MNE Groups","title_ar":"المجموعات المتعددة الجنسيات ذات كيانات أم متعددة","page":59,"text_en":"The following provisions shall apply to MultiParented MNE Groups:\n1- The Entities and Constituent Entities of each Group shall be treated as members of a single MNE Group for the purposes of this Law, referred to as the Multi-Parented MNE Group;\n2- An Entity, other than an Excluded Entity, shall be treated as a Constituent Entity if it is consolidated on a line-by-line basis by the Multi-Parented MNE Group or its Controlling Interests are held by Entities in the MultiParented MNE Group;\n3- The Consolidated Financial Statements of the Multi-Parented MNE Group shall be the Consolidated Financial Statements referred to in the definition of Stapled Structure or Duallisted arrangement, as relevant, prepared under an Acceptable Financial Accounting Standard, which is deemed to be the accounting standard of the Ultimate Parent Entity;\n4- The Ultimate Parent Entities of the separate Groups that comprise the Multi-Parented MNE Group shall be the Ultimate Parent Entities of the Multi-Parented MNE Group. When applying this Law in respect of a Multi-Parented MNE Group, references to an Ultimate Parent Entity shall apply, as required, as if they were references to multiple Ultimate Parent Entities;\n5- All of the Constituent Entities of the MultiParented MNE Group located in the Kingdom shall apply the Domestic Top-up Tax in accordance with ARTICLE (56) and ARTICLE\n(57) of this Law taking into account the Domestic Top-up Tax of each Constituent Entity of the Multi-Parented MNE Group; and\n6- The Ultimate Parent Entities are required to submit the GloBE Information Return in accordance with ARTICLE (94) of this Law, unless they appoint a single Designated Filing Entity, and that return shall include the information concerning each of the Groups that comprise the Multi-Parented MNE Group.","text_ar":"تُطبق الأحكام الآتية على المجموعات المتعددة الجنسيات ذات كيانات أم متعددة:\n1- تُعامل الكيانات والكيانات التابعة لكل مجموعة كأعضاء مجموعة متعددة الجنسيات منفردة لأغراض هذا النظام، ويشار إليها كالمجموعة المتعددة الجنسيات ذات كيانات أم متعددة.\n2- يُعامل الكيان، غير الكيان المستبعد، على أنه كيان تابع في حال تم توحيده على أساس كل بند على حدة من قبل المجموعة المتعددة الجنسيات ذات كيانات أم متعددة، أو كانت حصصه المسيطرة مملوكة من كيانات في المجموعة المتعددة الجنسيات ذات كيانات أم متعددة.\n3- تكون القوائم المالية الموحدة للمجموعة المتعددة الجنسيات ذات كيانات أم متعددة هي القوائم المالية الموحدة المشار إليها في تعريف الهيكل المترابط أو ترتيب الإدراج المزدوج، حسب الاقتضاء، التي تم إعدادها بموجب معايير محاسبية مالية مقبولة، والتي تعتبر المعايير المحاسبية للكيان الأم النهائي\n4- تكون الكيانات الأم النهائية للمجموعات المنفصلة التي تتألف منها المجموعة المتعددة الجنسيات ذات كيانات أم متعددة هي الكيانات الأم النهائية للمجموعة المتعددة الجنسيات ذات كيانات أم متعددة. عند تطبيق هذا النظام فيما يتعلق بمجموعة متعددة الجنسيات ذات كيانات أم متعددة، تُطبق الإشارات إلى الكيان الأم النهائي، حسب الاقتضاء ، كما لو كانت إشارات إلى كيانات أم نهائية متعددة.\n5- على جميع الكيانات التابعة للمجموعة المتعددة الجنسيات ذات كيانات أم متعددة الواقعة في المملكة تطبيق الضريبة التكميلية المحلية بموجب المادتين (السادسة والخمسين) و (السابعة والخمسين) من هذا النظام مع مراعاة الضريبة التكميلية المحلية لكل كيان تابع للمجموعة المتعددة الجنسيات ذات كيانات أم متعددة.\n6- على الكيانات الأم النهائية تقديم إقرار معلومات قواعد مكافحة تآكل الوعاء الضريبي العالمي بموجب المادة (الرابعة والتسعين) من هذا النظام، ما لم تقم بتعيين كيان معين لتقديم الإقرار، ويجب أن يتضمن هذا الإقرار المعلومات المتعلقة بكل مجموعة من المجموعات التي تتألف منها المجموعة المتعددة الجنسيات ذات كيانات أم متعددة."},{"n":81,"part":8,"part_en":"Corporate Restructurings and Holding Structures","part_ar":"إعادة هيكلة الشركات وهيكلة الشركات القابضة","title_en":"Definition of a Multi-Parented MNE Group","title_ar":"تعريف المجموعة المتعددة الجنسيات ذات كيانات أم متعددة","page":60,"text_en":"A Multi-Parented MNE Group means two or more Groups where all of the following conditions apply:\n1- The Ultimate Parent Entities of those Groups enter into an arrangement that is a Stapled Structure or a Dual-listed Arrangement;\n2- At least one Entity or Permanent Establishment of the combined Group is located in a different jurisdiction from the location of the other Entities of the combined Group.","text_ar":"يُقصد بالمجموعة المتعددة الجنسيات ذات كيانات أم متعددة، مجموعتان أو أكثر يتحقق فيهما جميع الشروط الآتية:\n1- تدخل الكيانات الأم النهائية لتلك المجموعات في ترتيب يُعد هيكلاً مترابطاً أو ترتيب إدراج مزدوج.\n2- يقع كيان واحد على الأقل أو منشأة دائمة واحدة على الأقل للمجموعة المدمجة في ولاية قضائية مختلفة عن موقع الكيانات الأخرى للمجموعة المدمجة."},{"n":82,"part":8,"part_en":"Corporate Restructurings and Holding Structures","part_ar":"إعادة هيكلة الشركات وهيكلة الشركات القابضة","title_en":"Stapled Structure","title_ar":"الهيكل المترابط","page":60,"text_en":"1- Stapled Structure means an arrangement entered into by two or more Ultimate Parent Entities of separate Groups, under which all of the following conditions apply:\n(a) Fifty percent (50%) or more of the Ownership Interests in the Ultimate Parent Entities of the separate Groups are by reason of form of ownership, restrictions on transfer, or other terms or conditions combined with each other, and cannot be transferred or traded independently;\n(b) One of those Ultimate Parent Entities prepares Consolidated Financial Statements in which the assets, liabilities, income, expenses and cash flows of all the Entities of the Groups are presented together as those of a single economic unit and that are required by a regulatory regime to be externally audited.\n2- For the purposes of sub-paragraph (a) of paragraph (1) of this Article, where the combined Ownership Interests are listed, they are quoted at a single price.","text_ar":"1- يُقصد بالهيكل المترابط ترتيب تم إبرامه من قبل اثنين أو أكثر من الكيانات الأم النهائية لمجموعات منفصلة، تتوافر فيه جميع الشروط الآتية:\n(أ) أن تكون خمسون بالمائة (%50) أو أكثر من حصص الملكية في الكيانات الأم النهائية للمجموعات المنفصلة مقترنة ببعضها، نتيجة لطبيعة الملكية، أو القيود المفروضة على النقل ، أو غيرها من الأحكام أو الشروط، بحيث لا يمكن نقلها أو تداولها بشكل مستقل.\n(ب) تقوم إحدى تلك الكيانات الأم النهائية بإعداد قوائم مالية موحدة يتم فيها عرض الأصول وا اللتزامات والدخل والمصاريف والتدفقات النقدية لجميع كيانات المجموعات معا وكأنها عائدة لوحدة اقتصادية واحدة، والتي يتوجب تدقيقها من قبل طرف خارجي وفقا لسلطة نظامية.\n2- لأغراض الفقرة الفرعية\n(أ) من الفقرة (1) من هذه المادة، إذا كانت حصص الملكية المقترنة مدرجة في سوق مالية ، يجب عرضها بسعر واحد."},{"n":83,"part":8,"part_en":"Corporate Restructurings and Holding Structures","part_ar":"إعادة هيكلة الشركات وهيكلة الشركات القابضة","title_en":"Dual-Listed Arrangement","title_ar":"ترتيب الإدراج المزدوج","page":60,"text_en":"Dual-listed Arrangement means an arrangement entered by two or more Ultimate Parent Entities of separate Groups, under which all of the following conditions are met:\n1- The Ultimate Parent Entities agree to combine their business by contract alone;\n2- With respect to dividends and in liquidation, and pursuant to contractual arrangements, the Ultimate Parent Entities make distributions to their shareholders based on a fixed ratio; 3- The Ultimate Parent Entities’ activities are managed as a single economic entity under contractual arrangements while retaining their separate legal identities;\n4- The Ownership Interests in the Ultimate Parent Entities comprising the agreement are quoted, traded or transferred independently in different capital markets;\n5- The Ultimate Parent Entities prepare Consolidated Financial Statements in which the assets, liabilities, income, expenses, and cash flows of all the Entities of the Groups are presented together as those of a single economic unit and that are required by a regulatory regime to be externally audited.","text_ar":"يُقصد بترتيب الإدراج المزدوج ترتيب تم إبرامه من قبل اثنين أو أكثر من الكيانات الأم النهائية لمجموعات منفصلة، تتوافر فيه جميع الشروط الآتية:\n1- توافق الكيانات الأم النهائية على دمج أعمالها بموجب عقد فقط.\n2- فيما يتعلق بتوزيعات الأرباح وعمليات التصفية، ووفقاً للترتيبات التعاقدية، تقوم الكيانات الأم النهائية بإجراء التوزيعات إلى مساهميها على أساس نسبة ثابتة\n3- تُدار أنشطة الكيانات الأم النهائية كجهة اقتصادية واحدة بموجب ترتيبات تعاقدية مع الاحتفاظ بهوياتها النظامية المنفصلة.\n4- يتم تسعير حصص الملكية في الكيانات الأم النهائية التي تشملها الاتفاقية، وتداولها أو تحويلها بشكل مستقل في أسواق رأس مال مختلفة\n5- تقوم الكيانات الأم النهائية بإعداد قوائم مالية موحدة ت عرض فيها الأصول والالتزامات والدخل والمصاريف والتدفقات النقدية لجميع الكيانات في المجموعات معاً وكأنها عائدة لوحدة اقتصادية واحدة، والتي يتوجب تدقيقها من قبل طرف خارجي وفقاً لسلطة نظامية."},{"n":84,"part":9,"part_en":"Tax Neutrality and Distribution Regimes","part_ar":"أنظمة الحياد الضريبي والتوزيع","title_en":"Ultimate Parent Entity That is a Flow-Through Entity","title_ar":"الكيان الأم النهائي الذي يكون كياناً شفافاً مالياً","page":61,"text_en":"1- The DMT Income for a Fiscal Year of a Flowthrough Entity that is the Ultimate Parent Entity of an MNE Group shall be reduced by the amount of DMT Income attributable to each Ownership Interest if any of the following conditions is met:\n(a) The holder of the Ownership Interest is subject to tax on such income for a taxable period that ends within twelve (12) months of the end of the MNE Group’s Fiscal Year and the holder of the Ownership Interest is subject to tax on the full amount of such income at a nominal rate that equals or exceeds the Minimum Rate; or it can be reasonably expected that the aggregate amount of Adjusted Covered Taxes of the Ultimate Parent Entity and taxes of the holder of the Ownership Interest on such income equals or exceeds the amount that results from multiplying the full amount of such income by the Minimum Rate;\n(b) The holder is a natural person that is a tax resident in the UPE Jurisdiction and holds aggregate Ownership Interests that represent a right to five percent (5%) or less of the profits and assets of the Ultimate Parent Entity;\n(c) The holder is a Governmental Entity, an International Organisation, a Non-profit Organisation, or a Pension Fund where that holder is resident in the UPE Jurisdiction and holds aggregate Ownership Interests that represent a right to five percent (5%) or less of the profits and assets of the Ultimate Parent Entity.\n2- In computing its DMT Loss for a Fiscal Year, a Flow-through Entity that is the Ultimate Parent Entity of an MNE Group shall reduce its DMT Loss for such Fiscal Year by the amount of DMT Loss attributable to each Ownership Interest, except to the extent that the holders of Ownership Interests are not allowed to use the loss in computing their separate taxable income.\n3- A Flow-through Entity that reduces its DMT Income pursuant to paragraph (1) of this Article shall reduce its Covered Taxes proportionally.\n4- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يخفض دخل ضريبة الحد الأدنى المحلي للسنة المالية للكيان الشفاف مالياً الذي يُعد الكيان الأم النهائي لمجموعة متعددة الجنسيات بمبلغ دخل ضريبة الحد الأدنى المحلي المنسوب إلى كل حصة ملكية، في حال توافر أي من الشروط الآتية:\n(أ) إذا كان مالك حصة الملكية خاضعاً للضريبة على هذا الدخل عن فترة ضريبية تنتهي خلال اثني عشر (12) شهراً من نهاية السنة المالية للمجموعة المتعددة الجنسيات، وكان مالك حصة الملكية خاضعاً للضريبة على كامل مبلغ هذا الدخل بمعدل اسمي يساوي أو يتجاوز الحد الأدنى؛ أو يمكن التوقع بشكل معقول أن يكون مجموع الضرائب المشمولة المعدلة للكيان الأم النهائي وضرائب مالك حصة الملكية على هذا الدخل يساوي المبلغ الناتج عن ضرب كامل مبلغ الدخل في الحد الأدنى أو يتجاوزه.\n(ب) إذا كان المالك شخص ا طبيعيا مقيما ضريبيا في الولاية القضائية للكيان الأم النهائي، ويمتلك حصص ملكية مجمعة تمثل حق الحصول على خمسة بالمائة (5 %) أو أقل من أرباح وأصول الكيان الأم النهائي.\n(ج) إذا كان المالك كياناً حكومياً ، أو منظمة دولية، أو منظمة غير ربحية، أو صندوق تقاعد ، وكان ذلك المالك مقيماً في الولاية القضائية للكيان الأم النهائي، ويمتلك حصص ملكية مجمعة تمثل حق الحصول على خمسة بالمائة (%5) أو أقل من أرباح وأصول الكيان الأم النهائي.\n2- عند احتساب خسائر ضريبة الحد الأدنى المحلي لسنة مالية، على الكيان الشفاف مالياً الذي هو الكيان الأم النهائي لمجموعة متعددة الجنسيات أن يخفض خسائر ضريبة الحد الأدنى المحلي العائدة له عن تلك السنة المالية بمبلغ خسارة ضريبة الحد الأدنى المحلي المنسوبة إلى كل حصة ملكية، إلا إذا كان لا يسمح لمالكي حصص الملكية باستخدام الخسارة في احتساب دخلهم الخاضع للضريبة المنفصل.\n3- على الكيان الشفاف ماليا الذي يخفض دخل ضريبة الحد الأدنى المحلي العائد له وفقا للفقرة (1) من هذه المادة أن يخفض ضرائبه المشمولة بشكل تناسبي.\n4- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":85,"part":9,"part_en":"Tax Neutrality and Distribution Regimes","part_ar":"أنظمة الحياد الضريبي والتوزيع","title_en":"Effective Tax Rate and Domestic Top-Up Tax For Investment Entities","title_ar":"معدل الضريبة الفعلي والضريبة التكميلية المحلية للكيانات الاستثمارية","page":62,"text_en":"1- The rules of this Article shall apply to Constituent Entities that meet the definition of an Investment Entity, except Investment Entities that are Tax Transparent Entities or subject to an election under ARTICLE (87) or ARTICLE (88) of this Law.\n2- The Effective Tax Rate for an Investment Entity that is a Constituent Entity shall be calculated separately from the Effective Tax Rate of the Kingdom. The Effective Tax Rate for each such Investment Entity shall be equal to the Investment Entity’s Adjusted Covered Taxes divided by the MNE Group’s Allocable Share of the Investment Entity’s DMT Income. If there is more than one Investment Entity located in the Kingdom, the Adjusted Covered Taxes and the MNE Group’s Allocable Share of each Investment Entity’s DMT Income or Loss determined for each such Investment Entity shall be combined to compute the Effective Tax Rate of all such Investment Entities.\n3- An Investment Entity’s Adjusted Covered Taxes shall be the sum of the Adjusted Covered Taxes determined for the Investment Entity under articles from ARTICLE (44) to ARTICLE (46) of this Law attributable to the MNE Group’s Allocable Share of the Investment Entity’s DMT Income and the Covered Taxes allocated to the Investment Entity as per the provisions specified in the Regulations. The Investment Entity’s Adjusted Covered Taxes does not include any Covered Taxes accrued by the Investment Entity attributable to income that is not part of the MNE Group’s Allocable Share of the Investment Entity’s DMT Income.\n4- The MNE Group’s Allocable Share of the Investment Entity’s DMT Income shall be equal to the Investment Entity’s DMT Income or Loss as calculated under Part Three (3) of this Law for the Fiscal Year, multiplied by the Parent Entity’s Inclusion Ratio determined for the Ultimate Parent Entity for the Investment Entity for the Fiscal Year taking into account only interests that are not subject to an election under ARTICLE (87) and ARTICLE\n(88) of this Law.\n5- The Parent Entity’s Inclusion Ratio for a Fiscal Year is the ratio of the DMT Income of the Constituent Entity for the Fiscal Year, reduced by the amount of such income attributable to Ownership Interests held by other owners, to the DMT Income of the Constituent Entity for the Fiscal Year.\n6- The Domestic Top-up Tax of a Constituent Entity that is an Investment Entity shall be an amount equal to:\n(a) Top-up Tax Percentage for the Investment Entity;\n(b) Multiplied by the difference between the MNE Group’s Allocable Share of the Investment Entity’s DMT Income and the Substance-based Income Exclusion for the Investment Entity.\n7- The Top-up Tax Percentage for an Investment Entity shall be the percentage point difference, if any, between the Minimum Rate and the Effective Tax Rate of the Investment Entity.\n8- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- تُطبق أحكام هذه المادة على الكيانات التابعة التي تستوفي تعريف الكيان الاستثماري، باستثناء الكيانات الاستثمارية التي تُعتبر كيانات شفافة ضريبياً أو تخضع للاختيار بموجب المادة (السابعة والثمانين) أو المادة (الثامنة والثمانين) من هذا النظام.\n2- يتم احتساب معدل الضريبة الفعلي لكيان استثماري يعد كيانا تابعا بشكل منفصل عن معدل الضريبة الفعلي للمملكة . يجب أن يكون معدل الضريبة الفعلي لكل كيان استثماري مساوياً للضرائب المشمولة المعدلة للكيان الاستثماري مقسومة على الحصة القابلة للتخصيص من دخل ضريبة الحد الأدنى المحلي للكيان الاستثماري للمجموعة المتعددة الجنسيات. في حال كان هناك أكثر من كيان استثماري واحد واقع في المملكة ، يجب جمع الضرائب المشمولة المعدلة وحصة المجموعة المتعددة الجنسيات القابلة للتخصيص في دخل أو خسارة ضريبة الحد الأدنى المحلي لكل كيان استثماري والمحددة لكل كيان استثماري، لأغراض احتساب معدل الضريبة الفعلي لجميع هذه الكيانات الاستثمارية.\n3- الضرائب المشمولة المعدلة لكيان استثماري هي مجموع الضرائب المشمولة المعدلة المحددة للكيان الاستثماري بموجب أحكام المواد من المادة (الرابعة والأربعين) إلى المادة (السادسة والأربعين) من هذا النظام والمنسوبة إلى الحصة القابلة للتخصيص من دخل ضريبة الحد الأدنى المحلي للكيان الاستثماري للمجموعة المتعددة الجنسيات والضرائب المشمولة المخصصة للكيان الاستثماري وفق الأحكام المحددة في اللائحة. لا تتضمن الضرائب المشمولة المعدلة للكيان الاستثماري أي ضرائب مشمولة مستحقة على الكيان الاستثماري والمنسوبة إلى الدخل الذي لا يشكل جزءاً من الحصة القابلة للتخصيص من دخل ضريبة الحد الأدنى المحلي للكيان الاستثماري للمجموعة المتعددة الجنسيات.\n4- تساوي الحصة القابلة للتخصيص من دخل ضريبة الحد الأدنى المحلي للكيان الاستثماري للمجموعة المتعددة الجنسيات دخل أو خسارة ضريبة الحد الأدنى المحلي للكيان الاستثماري كما هو محتسب للسنة المالية بموجب الجزء الثالث من هذا النظام، مضروباً في نسبة التضمين للكيان الأم المحددة للكيان الأم النهائي بالنسبة للكيان الاستثماري للسنة المالية، أخذاً بالاعتبار فقط الحصص غير الخاضعة للاختيار بموجب المادة (السابعة والثمانين) والمادة (الثامنة والثمانين) من هذا النظام.\n5- تكون نسبة تضمين الكيان الأم لسنة مالية مساوية لنسبة دخل ضريبة الحد الأدنى المحلي للكيان التابع للسنة المالية بعد تخفيضه بمبلغ ذلك الدخل المنسوب إلى حصص الملكية التي يحتفظ بها مّلا ك آخرون، مقابل دخل ضريبة الحد الأدنى المحلي للكيان التابع للسنة المالية.\n6- تكون الضريبة التكميلية المحلية للكيان التابع الذي يمثل كياناً استثمارياً مبلغاً يساوي الآتي:\n(أ) نسبة الضريبة التكميلية للكيان الاستثماري.\n(ب) مضروبة في الفرق ما بين الحصة القابلة للتخصيص من دخل ضريبة الحد الأدنى المحلي للكيان الاستثماري للمجموعة المتعددة الجنسيات والاستبعاد على أساس جوهر النشاط للكيان الاستثماري.\n7- تكون نسبة الضريبة التكميلية للكيان الاستثماري هي النسبة المئوية المتبقية، إن وجدت، بين الحد الأدنى و معدل الضريبة الفعلي للكيان الاستثماري.\n8- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":86,"part":9,"part_en":"Tax Neutrality and Distribution Regimes","part_ar":"أنظمة الحياد الضريبي والتوزيع","title_en":"Investment Entity","title_ar":"الكيان الاستثماري","page":63,"text_en":"-1 Investment Entity means any of the following:\n(a) An Investment Fund or a Real Estate Investment Vehicle;\n(b) An Entity that is at least ninety-five percent (95%) owned directly by an Entity described in sub-paragraph (a) of this paragraph or through a chain of such Entities and that operates exclusively or almost exclusively to hold assets or invest funds for the benefit of such Investment Entities;\n(c) An Entity where at least eighty-five percent (85%) of its value is owned by an Entity referred to in sub-paragraph (a) of this paragraph provided that substantially all of the Entity’s income is Excluded Dividends or Excluded Equity Gain or Loss that is excluded from the calculation of the DMT Income or Loss in accordance with sub-paragraphs (b) and (c) of paragraph (1) of ARTICLE (19) of this Law.\n2- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يُقصد بالكيان الاستثماري أي مما يلي\n(أ) صندوق استثمار أو أداة استثمارية عقارية.\n(ب) كيان مملوك بشكل مباشر بنسبة لا تقل عن خمسة وتسعين بالمائة (%95) من قبل كيان منصوص عليه في الفقرة الفرعية\n(أ) من هذه الفقرة أو من خلال سلسلة من هذه الكيانات، والذي يعمل بشكل حصري أو شبه حصري للاحتفاظ بالأصول أو استثمار الأموال لصالح هذه الكيانات الاستثمارية.\n(ج) كيان تكون خمسة وثمانون بالمائة (%85) على الأقل من قيمته يمتلكها كيان مشار إليه في الفقرة الفرعية\n(أ) من هذه الفقرة، شريطة أن يكون، إلى حد كبير، كامل دخل الكيان من توزيعات الأرباح المستبعدة، أو مكاسب أو خسائر حقوق ملكية مستبعدة، تم استبعادها من احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي بموجب الفقرتين الفرعيتين\n(ب) و(ج) من الفقرة (1) من المادة (التاسعة عشرة) من هذا النظام.\n2- تحدد اللائحة الأحكام التنفيذية اللازمة لتطبيق هذه المادة."},{"n":87,"part":9,"part_en":"Tax Neutrality and Distribution Regimes","part_ar":"أنظمة الحياد الضريبي والتوزيع","title_en":"Investment Entity Tax Transparency Election","title_ar":"اختيار الكيان الاستثماري للشفافية الضريبية","page":64,"text_en":"1- A Filing Constituent Entity may elect to treat a Constituent Entity that is an Investment Entity or an Insurance Investment Entity as a Tax Transparent Entity if the Constituent Entityowner of that Investment Entity or Insurance Investment Entity is subject to tax in its location under a mark-to-market or similar regime based on the annual changes in the fair value of its Ownership Interest in the Investment Entity or Insurance Investment Entity and the tax rate applicable to the Constituent Entity-owner with respect to such income equals or exceeds the Minimum Rate.\n2- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- للكيان التابع المعين لتقديم الإقرار أن يختار معاملة الكيان التابع الذي يُعد كيان استثماري أو كيان تأمين استثماري على أنه كيان شفاف ضريبياً إذا كان الكيان التابع المالك لذلك الكيان الاستثماري أو كيان التأمين الاستثماري خاضعاً للضريبة في موقعه بموجب نظام يعتمد على سعر السوق أو نظام مماثل قائم على التغيرات السنوية في القيمة العادلة لحصة الملكية في الكيان الاستثماري أو كيان التأمين الاستثماري، ويكون معدل الضريبة المطبق على الكيان التابع المالك فيما يتعلق بهذا الدخل يساوي الحد الأدنى أو يتجاوزه.\n2- تحدد اللائحة الأحكام التنفيذية لتطبيق أحكام هذه المادة."},{"n":88,"part":9,"part_en":"Tax Neutrality and Distribution Regimes","part_ar":"أنظمة الحياد الضريبي والتوزيع","title_en":"Taxable Distribution Method Election","title_ar":"اختيار طريقة التوزيع الخاضعة للضريبة","page":64,"text_en":"1- At the election of the Filing Constituent Entity, a Constituent Entity-owner that is not an Investm
