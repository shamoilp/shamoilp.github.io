FY2027","ضريبة تكميلية حالية إضافية، تُحمّل بأثر رجعي في 2027م"],["Deferred top-up tax, charged back in FY2027","ضريبة تكميلية مؤجلة، تُحمّل بأثر رجعي في 2027م"],["Deferred top-up tax, in the current year","ضريبة تكميلية مؤجلة، في السنة الحالية"]],"a":0,"e":["Article 63(2): the earlier year's ETR and top-up are recalculated, and the increase is charged as additional current top-up tax in the current year.","المادة 63 (2): يُعاد احتساب معدل السنة السابقة وضريبتها التكميلية، وتُحمّل الزيادة كضريبة تكميلية حالية إضافية في السنة الحالية."],"r":["63(2)"]},{"q":["Which provisions are 'ETR adjustment articles'?","ما «مواد تعديل المعدل الفعلي»؟"],"o":[["Article 34, Article 49(1)–(4), Article 52(6)–(7) and Article 53","المادة 34، والمادة 49 (1)–(4)، والمادة 52 (6)–(7)، والمادة 53"],["Article 36, Article 49(5)–(7), Article 52(1)–(5) and Article 64","المادة 36، والمادة 49 (5)–(7)، والمادة 52 (1)–(5)، والمادة 64"],["Article 36, Article 49(1)–(4), Article 52(6)–(7) and Article 52(8)","المادة 36، والمادة 49 (1)–(4)، والمادة 52 (6)–(7)، والمادة 52 (8)"],["Article 34, Article 49(5)–(7), Article 52(1)–(5) and Article 52(8)","المادة 34، والمادة 49 (5)–(7)، والمادة 52 (1)–(5)، والمادة 52 (8)"]],"a":3,"e":["Article 63(7) names them: the aggregate asset gain election (Art 34), deferred tax recapture (Art 49(5)–(7)) and post-filing changes (Art 52(1)–(5) and (8)).","تسميها المادة 63 (7): اختيار مكاسب الأصول المجمعة (المادة 34)، واسترداد الضريبة المؤجلة (المادة 49 (5)–(7))، والتعديلات بعد الإقرار (المادة 52 (1)–(5) و(8))."],"r":["63(7)"]},{"q":["No net DMT income; covered taxes are −SAR 10m; expected covered taxes are −SAR 6m. What arises?","لا صافي دخل؛ والضرائب المشمولة سالب 10 ملايين ريال؛ والمتوقعة سالب 6 ملايين ريال. ماذا ينشأ؟"],"o":[["Nothing: with no net DMT income there is no ETR and so no top-up","لا شيء: فلا معدل فعلياً ولا ضريبة تكميلية في غياب صافي الدخل"],["SAR 4m of additional top-up, unless the carry-forward election is made","ضريبة تكميلية إضافية 4 ملايين، ما لم يُختر ترحيل المصروف الضريبي السالب"],["A SAR 10m refund of the negative covered taxes from ZATCA","استرداد 10 ملايين ريال من الهيئة عن الضرائب المشمولة السالبة"],["SAR 16m of additional top-up: the two amounts added together","ضريبة تكميلية إضافية قدرها 16 مليوناً: مجموع المبلغين"]],"a":1,"e":["Article 63(3)–(4): with no net DMT income, covered taxes below zero and below the expected amount (net DMT loss × 15%) give additional current top-up tax for the difference: −6 − (−10) = SAR 4m. The group can instead elect to carry the excess negative tax expense forward (Arts 44(2) and 47).","المادة 63 (3)–(4): في غياب صافي الدخل، إذا كانت الضرائب المشمولة أقل من صفر وأقل من المبلغ المتوقع (صافي الخسارة × 15%)، تنشأ ضريبة تكميلية حالية إضافية بالفرق: −6 − (−10) = 4 ملايين ريال. ويجوز للمجموعة بدلاً من ذلك اختيار ترحيل المصروف الضريبي السالب الزائد (المادتان 44 (2) و47)."],"r":["63(3)","63(4)","44(2)"]},{"q":["When is a Saudi entity a minority-owned constituent entity?","متى يكون الكيان في المملكة كياناً تابعاً ذا ملكية أقلية؟"],"o":[["When the UPE's direct or indirect interest in it is below 50%","عندما تقل حصة الكيان الأم النهائي فيه، مباشرة أو غير مباشرة، عن 50%"],["When the UPE's direct interest alone is 30% or less","عندما تكون الحصة المباشرة وحدها للكيان الأم النهائي 30% أو أقل"],["When the UPE's direct or indirect interest in it is 30% or less","عندما تكون حصة الكيان الأم النهائي فيه، مباشرة أو غير مباشرة، 30% أو أقل"],["When the UPE's direct interest alone is below 50%","عندما تقل الحصة المباشرة وحدها للكيان الأم النهائي عن 50%"]],"a":2,"e":["Article 65(3). It is then computed separately (Art 65(1)–(2)).","المادة 65 (3). ويُحتسب حينئذ بشكل مستقل (المادة 65 (1)–(2))."],"r":["65(3)"]}],"cards":[{"f":["Kingdom ETR","معدل المملكة الفعلي"],"b":["Σ Adjusted Covered Taxes of Saudi entities ÷ net DMT income of the Kingdom.","مجموع الضرائب المشمولة المعدلة للكيانات في المملكة ÷ صافي دخل المملكة."],"r":["53(2)"]},{"f":["Net DMT income","صافي الدخل"],"b":["DMT income of Saudi entities minus their DMT losses, if positive.","دخل الكيانات في المملكة ناقصاً خسائرها، إن كان موجباً."],"r":["53(4)"]},{"f":["Kept out of the blend","خارج المزيج"],"b":["Investment entities, stateless entities, minority-owned entities and subgroups.","كيانات الاستثمار، والكيانات عديمة الجنسية، والكيانات والمجموعات الفرعية ذات الملكية الأقلية."],"r":["53(3)","53(5)",65]},{"f":["Top-up percentage","نسبة الضريبة التكميلية"],"b":["15% − ETR, if positive.","15% − المعدل الفعلي، إن كانت موجبة."],"r":[54]},{"f":["Excess profit","الربح الزائد"],"b":["Net DMT income − substance-based income exclusion, if positive.","صافي الدخل − الاستبعاد على أساس جوهر النشاط، إن كان موجباً."],"r":[55]},{"f":["Domestic top-up tax","الضريبة التكميلية المحلية"],"b":["Top-up % × excess profit + additional current top-up tax.","النسبة × الربح الزائد + الضريبة التكميلية الحالية الإضافية."],"r":[56]},{"f":["Entity allocation","التخصيص على الكيانات"],"b":["Pro rata to DMT income among entities with income; loss entities take none.","بالتناسب مع الدخل بين الكيانات ذات الدخل؛ ولا شيء على الكيانات الخاسرة."],"r":["57(1)"]},{"f":["Recalculated top-up in a year without net income","ضريبة معاد احتسابها في سنة بلا صافي دخل"],"b":["Allocated by DMT income of the recalculated years.","تُخصص بحسب دخل السنوات المعاد احتسابها."],"r":["57(2)"]},{"f":["Additional current top-up tax","الضريبة التكميلية الحالية الإضافية"],"b":["The increase from recalculating an earlier year, charged in the current year.","الزيادة الناتجة عن إعادة احتساب سنة سابقة، وتُحمّل في السنة الحالية."],"r":["63(1)","63(2)"]},{"f":["ETR adjustment articles","مواد تعديل المعدل الفعلي"],"b":["Art 34; Art 49(5)–(7); Art 52(1)–(5); Art 52(8).","المادة 34؛ والمادة 49 (5)–(7)؛ والمادة 52 (1)–(5)؛ والمادة 52 (8)."],"r":["63(7)"]},{"f":["Negative covered taxes, no net income","ضرائب مشمولة سالبة بلا صافي دخل"],"b":["Additional top-up = expected covered taxes (15% × net loss) − actual covered taxes, if lower.","الضريبة الإضافية = الضرائب المتوقعة (15% × صافي الخسارة) − الضرائب الفعلية، إن كانت أقل."],"r":["63(3)","63(4)"]},{"f":["Minority-owned constituent entity","الكيان التابع ذو الملكية الأقلية"],"b":["UPE interest of 30% or less; computed separately, as a subgroup or alone.","حصة الكيان الأم النهائي 30% أو أقل؛ ويُحتسب بشكل مستقل، كمجموعة فرعية أو منفرداً."],"r":["65(1)","65(2)","65(3)"]}],"terms":[{"t":["Effective tax rate (ETR)","المعدل الفعلي"],"d":["Taxes divided by income, for all Saudi entities together.","الضرائب مقسومة على الدخل، لكل الكيانات السعودية معاً."]},{"t":["Net DMT income","صافي الدخل"],"d":["The Saudi entities' profits minus their losses.","أرباح الكيانات السعودية ناقصاً خسائرها."]},{"t":["Substance-based income exclusion","الاستبعاد على أساس جوهر النشاط"],"d":["An allowance for staff and assets, taken off before the top-up.","بدل عن الموظفين والأصول، يُطرح قبل الضريبة التكميلية."]},{"t":["Excess profit","الربح الزائد"],"d":["Net income above the substance allowance: the part that gets topped up.","صافي الدخل الزائد على بدل الجوهر: وهو الجزء الذي تُكمَّل ضريبته."]},{"t":["Top-up percentage","نسبة الضريبة التكميلية"],"d":["15% minus the ETR.","15% ناقصاً المعدل الفعلي."]},{"t":["Additional current top-up tax","الضريبة التكميلية الحالية الإضافية"],"d":["Extra top-up from reopening an earlier year, charged this year.","ضريبة تكميلية إضافية ناتجة عن إعادة فتح سنة سابقة، تُحمَّل في هذه السنة."]},{"t":["Minority-owned entity","الكيان ذو الملكية الأقلية"],"d":["One in which the ultimate parent's interest is 30% or less; computed on its own.","كيان تكون حصة الكيان الأم النهائي فيه 30% أو أقل؛ ويُحتسب وحده."]}],"range":"53–57, 63, 65"},{"id":11,"title":["Substance-based income exclusion: people and assets","الاستبعاد على أساس جوهر النشاط: الموظفون والأصول"],"goal":["Compute the payroll and tangible asset carve-outs at the transitional rates, and know who and what counts for each.","احتساب استبعاد تكاليف الرواتب واستبعاد الأصول الملموسة بالنسب الانتقالية، ومعرفة من وما يُحتسب في كل منهما."],"parts":[5,11],"arts":[58,59,60,61,62,104],"time":30,"metaphor":{"title":["An allowance for real presence","بدلٌ للوجود الحقيقي"],"text":["The top-up tax is aimed at profit that real activity does not explain. So before any top-up, every group gets a fixed allowance for its people and its plant in the Kingdom: so many halalas per riyal of payroll and per riyal of tangible assets. That routine return is never topped up.\nThe allowance starts generous (9.2% of payroll and 7.2% of assets for years beginning in 2027) and shrinks each year to 5% and 5% from 2033.","تستهدف الضريبة التكميلية الربح الذي لا يفسره نشاط حقيقي. لذا تحصل كل مجموعة قبل أي ضريبة تكميلية على بدل ثابت لموظفيها وأصولها في المملكة: هللات معينة عن كل ريال من الرواتب وعن كل ريال من الأصول الملموسة. وهذا العائد الاعتيادي لا تُفرض عليه ضريبة تكميلية أبداً.\nويبدأ البدل سخياً (9.2% من الرواتب و7.2% من الأصول للسنوات التي تبدأ في 2027م) ثم يتناقص كل سنة حتى يبلغ 5% و5% اعتباراً من 2033م."]},"anchors":[{"if":["The group has a large Saudi workforce","للمجموعة قوة عاملة كبيرة في المملكة"],"then":["Payroll carve-out = transitional rate × eligible payroll costs of eligible employees working in the Kingdom (Arts 59, 104(1))","استبعاد الرواتب = النسبة الانتقالية × تكاليف الرواتب المؤهلة للموظفين المؤهلين العاملين في المملكة (المادتان 59 و104 (1))"]},{"if":["Payroll was capitalised into a plant","رُسملت رواتب في مصنع"],"then":["Take it out of payroll: it earns its return through the asset carve-out (Art 59(1)(a))","أخرجها من الرواتب: فعائدها يأتي عبر استبعاد الأصول (المادة 59 (1) (أ))"]},{"if":["The asset is plant, natural resources, a right-of-use asset or a qualifying government licence in the Kingdom","الأصل مصنع أو موارد طبيعية أو حق استخدام أو ترخيص حكومي مؤهل في المملكة"],"then":["It is an eligible tangible asset (Art 61(1))","فهو أصل ملموس مؤهل (المادة 61 (1))"]},{"if":["The entity is an investment entity","الكيان كيان استثمار"],"then":["It is left out of the Kingdom's SBIE; it has its own under Article 85 (Art 58(1))","يُستبعد من استبعاد المملكة؛ وله استبعاده الخاص بموجب المادة 85 (المادة 58 (1))"]}],"diagrams":[{"type":"columns","title":["The payroll allowance glides down to 5%","بدل الرواتب ينخفض تدريجياً إلى 5%"],"cap":["Payroll carve-out rate, %, by fiscal year beginning in","نسبة استبعاد الرواتب، %، حسب سنة بداية السنة المالية"],"items":[{"l":["2027","2027م"],"v":9.2},{"l":["2028","2028م"],"v":9},{"l":["2029","2029م"],"v":8.2},{"l":["2030","2030م"],"v":7.4},{"l":["2031","2031م"],"v":6.6},{"l":["2032","2032م"],"v":5.8},{"l":["2033+","2033م+"],"v":5}],"line":{"v":5,"l":["5% from 2033","5% اعتباراً من 2033م"]},"note":["The asset rate follows the same path, from 7.2% down to 5%.","وتتبع نسبة الأصول المسار نفسه، من 7.2% إلى 5%."],"pos":"picture"},{"type":"table","title":["Carve-out rates by year (fiscal year beginning in)","نسب الاستبعاد حسب السنة (سنة مالية تبدأ في)"],"head":[["Year","السنة"],["Payroll","الرواتب"],["Tangible assets","الأصول الملموسة"]],"rows":[[["2027","2027م"],["9.2%","9.2%"],["7.2%","7.2%"]],[["2028","2028م"],["9.0%","9.0%"],["7.0%","7.0%"]],[["2029","2029م"],["8.2%","8.2%"],["6.6%","6.6%"]],[["2030","2030م"],["7.4%","7.4%"],["6.2%","6.2%"]],[["2031","2031م"],["6.6%","6.6%"],["5.8%","5.8%"]],[["2032","2032م"],["5.8%","5.8%"],["5.4%","5.4%"]],[["2033 onwards","2033م وما بعدها"],["5%","5%"],["5%","5%"]]],"note":["Source: Article 104 for 2027–2032; Articles 59 and 60 for the 5% steady state.","المصدر: المادة 104 للأعوام 2027–2032م؛ والمادتان 59 و60 لنسبة 5% الدائمة."]},{"type":"bars","title":["Same business, shrinking allowance (Cases 1 and 2)","النشاط نفسه وبدل يتناقص (الحالتان 1 و2)"],"u":"SAR","items":[{"l":["Payroll carve-out FY2027","استبعاد الرواتب 2027م"],"v":25760000},{"l":["Asset carve-out FY2027","استبعاد الأصول 2027م"],"v":72000000,"tone":"g"},{"l":["Payroll carve-out FY2033","استبعاد الرواتب 2033م"],"v":14000000},{"l":["Asset carve-out FY2033","استبعاد الأصول 2033م"],"v":50000000,"tone":"g"}]}],"points":[{"h":["Two carve-outs","استبعادان"],"t":["The substance-based income exclusion for the Kingdom is the sum of the payroll carve-out and the tangible asset carve-out of each Saudi constituent entity, except investment entities and insurance investment entities. It is deducted from net DMT income to give excess profit.","الاستبعاد على أساس جوهر النشاط للمملكة هو مجموع استبعاد الرواتب واستبعاد الأصول الملموسة لكل كيان تابع في المملكة، باستثناء كيانات الاستثمار وكيانات التأمين الاستثماري. ويُخصم من صافي الدخل للوصول إلى الربح الزائد."],"r":["58(1)","55(1)"],"p":["Before any top-up, take off an allowance for Saudi staff and assets.","قبل أي ضريبة تكميلية، اطرح بدلاً عن الموظفين والأصول في المملكة."]},{"h":["Payroll carve-out","استبعاد الرواتب"],"t":["5% (more during transition) of the eligible payroll costs of eligible employees who perform activities for the group in the Kingdom. Payroll capitalised into eligible tangible assets, and payroll attributable to excluded international shipping income, are left out.","5% (وأكثر خلال الفترة الانتقالية) من تكاليف الرواتب المؤهلة للموظفين المؤهلين الذين يؤدون أنشطة للمجموعة في المملكة. وتُستبعد الرواتب المرسملة في أصول ملموسة مؤهلة، والرواتب المنسوبة إلى دخل الشحن الدولي المستبعد."],"r":["59(1)"],"p":["Payroll allowance: a percentage of the pay of staff working for the group in the Kingdom.","بدل الرواتب: نسبة من رواتب الموظفين العاملين للمجموعة في المملكة."]},{"h":["What payroll costs count","تكاليف الرواتب التي تُحتسب"],"t":["Employee compensation (salaries, wages and other direct personal benefits such as health insurance and pension contributions), payroll and employment taxes, and employer social security contributions.","تعويضات الموظفين (الرواتب والأجور والمزايا الشخصية المباشرة الأخرى مثل التأمين الصحي واشتراكات التقاعد)، وضرائب الرواتب والتوظيف، واشتراكات صاحب العمل في التأمينات الاجتماعية."],"r":["59(2)"],"p":["Pay includes salaries, benefits like medical insurance, payroll taxes and employer social security.","تشمل الرواتب الأجور والمزايا مثل التأمين الطبي وضرائب الرواتب واشتراكات صاحب العمل في التأمينات الاجتماعية."]},{"h":["Who is an eligible employee","من الموظف المؤهل"],"t":["Employees of a group member, including part-time employees, and independent contractors who take part in the group's ordinary operating activities under the group's direction and control.","موظفو عضو في المجموعة، بمن فيهم موظفو الدوام الجزئي، والمقاولون المستقلون الذين يشاركون في الأنشطة التشغيلية الاعتيادية للمجموعة تحت توجيهها وإشرافها."],"r":["62(2)"],"p":["Part-timers count, and so do contractors working under the group's direction.","يُحتسب موظفو الدوام الجزئي، وكذلك المقاولون العاملون تحت توجيه المجموعة."]},{"h":["Tangible asset carve-out","استبعاد الأصول الملموسة"],"t":["5% (more during transition) of the carrying value of eligible tangible assets located in the Kingdom for the fiscal year. The Regulations will say how carrying value is measured.","5% (وأكثر خلال الفترة الانتقالية) من القيمة الدفترية للأصول الملموسة المؤهلة الواقعة في المملكة للسنة المالية. وستحدد اللائحة كيفية قياس القيمة الدفترية."],"r":["60(1)","60(2)"],"p":["Asset allowance: a percentage of the book value of physical assets in the Kingdom.","بدل الأصول: نسبة من القيمة الدفترية للأصول المادية في المملكة."]},{"h":["Eligible tangible assets","الأصول الملموسة المؤهلة"],"t":["Property, plant and equipment in the jurisdiction; natural resources there; a lessee's right of use of tangible assets there; and a government licence or similar arrangement for using immovable property or exploiting natural resources that entails significant investment in tangible assets.","الممتلكات والمصانع والمعدات في الولاية؛ والموارد الطبيعية فيها؛ وحق المستأجر في استخدام أصول ملموسة فيها؛ والترخيص الحكومي أو ما يماثله لاستخدام العقارات أو استغلال الموارد الطبيعية المتضمن استثماراً كبيراً في أصول ملموسة."],"r":["61(1)"],"p":["Plant, natural resources, leased assets and resource licences with big tangible investment qualify.","تؤهل المصانع والموارد الطبيعية والأصول المستأجرة وتراخيص الموارد ذات الاستثمار الملموس الكبير."]},{"h":["Branches","الفروع"],"t":["A PE's eligible payroll and assets are those in its separate accounts (as adjusted under Article 40), provided the employees and assets are located in the PE's jurisdiction.","الرواتب والأصول المؤهلة للمنشأة الدائمة هي الواردة في حساباتها المنفصلة (بعد تعديلها وفق المادة 40)، بشرط أن يكون الموظفون والأصول في ولاية المنشأة الدائمة."],"r":["62(1)"],"p":["A branch counts the staff and assets in its own accounts and in its own country.","يحتسب الفرع الموظفين والأصول الواردة في حساباته وفي دولته."]},{"h":["The transition glide path","مسار التدرج الانتقالي"],"t":["For fiscal years beginning in 2027 the rates are 9.2% for payroll and 7.2% for assets, falling each year to 5.8% and 5.4% in 2032; from 2033 both are 5%.","للسنوات المالية التي تبدأ في 2027م تبلغ النسبتان 9.2% للرواتب و7.2% للأصول، ثم تنخفضان كل سنة حتى 5.8% و5.4% في 2032م؛ واعتباراً من 2033م تصبح كلتاهما 5%."],"r":["104(1)","104(2)"],"p":["The rates start high, 9.2% and 7.2% in 2027, and fall to 5% from 2033.","تبدأ النسبتان مرتفعتين، 9.2% و7.2% في 2027م، وتنخفضان إلى 5% اعتباراً من 2033م."]}],"oecd":[{"t":["Articles 58 to 62 follow GloBE Article 5.3, and Article 104 reproduces the 2027–2032 part of the transition table in Article 9.2. GloBE also excludes property held for sale, lease or investment and international shipping assets from eligible tangible assets, and measures carrying value as the average of opening and closing values; the draft leaves those details to the Regulations.","تتبع المواد من 58 إلى 62 المادة 5.3 من القواعد النموذجية، وتنقل المادة 104 الجزء الخاص بالأعوام 2027–2032م من الجدول الانتقالي في المادة 9.2. وتستبعد القواعد العالمية أيضاً من الأصول الملموسة المؤهلة العقارات المحتفظ بها للبيع أو التأجير أو الاستثمار وأصول الشحن الدولي، وتقيس القيمة الدفترية بمتوسط رصيدي بداية السنة ونهايتها؛ ويترك مشروع النظام هذه التفاصيل للائحة."],"src":["Model Rules Arts 5.3, 9.2","القواعد النموذجية: المادتان 5.3 و9.2"]},{"t":["KSA angle: employer GOSI contributions are employer social security contributions, so they count as eligible payroll costs. Whether government fees charged per expatriate worker count as employment taxes is a point to confirm when the Regulations are issued.","من منظور المملكة: اشتراكات صاحب العمل في المؤسسة العامة للتأمينات الاجتماعية هي اشتراكات تأمينات اجتماعية لصاحب العمل، فتُحتسب ضمن تكاليف الرواتب المؤهلة. أما هل تُعد الرسوم الحكومية المفروضة عن كل عامل وافد ضرائب توظيف، فنقطة يلزم تأكيدها عند صدور اللائحة."],"src":["Draft Art 59(2)","المشروع م 59 (2)"]}],"cases":[{"t":["SBIE for FY2027","الاستبعاد للسنة المالية 2027م"],"facts":["The Saudi entities of a group (calendar year) report for FY2027:\n• Eligible payroll costs: SAR 300m (salaries, allowances, employer GOSI and medical insurance), of which SAR 20m was capitalised into a plant under construction\n• Carrying value of eligible tangible assets: SAR 1,000m (plant SAR 800m, right-of-use assets SAR 150m, a mining licence with significant tangible investment SAR 50m)","تُظهر الكيانات في المملكة لمجموعة (سنتها تقويمية) للسنة المالية 2027م:\n• تكاليف الرواتب المؤهلة: 300 مليون ريال (رواتب وبدلات واشتراكات التأمينات الاجتماعية والتأمين الطبي)، رُسمل منها 20 مليون ريال في مصنع تحت الإنشاء\n• القيمة الدفترية للأصول الملموسة المؤهلة: 1,000 مليون ريال (مصنع 800 مليون، وأصول حق استخدام 150 مليون، وترخيص تعدين باستثمار ملموس كبير 50 مليون)"],"steps":[{"t":["Payroll after taking out the capitalised part:","الرواتب بعد استبعاد الجزء المرسمل:"],"x":"300000000-20000000","v":280000000,"u":"SAR"},{"t":["Payroll carve-out at 9.2%:","استبعاد الرواتب بنسبة 9.2%:"],"x":"280000000*9.2/100","v":25760000,"u":"SAR"},{"t":["Tangible asset carve-out at 7.2%:","استبعاد الأصول الملموسة بنسبة 7.2%:"],"x":"1000000000*7.2/100","v":72000000,"u":"SAR"},{"t":["Substance-based income exclusion:","الاستبعاد على أساس جوهر النشاط:"],"x":"25760000+72000000","v":97760000,"u":"SAR"}],"ans":["The SBIE is SAR 97.76m. The SAR 20m of capitalised payroll is not lost: it sits in the plant's carrying value and earns its return through the asset carve-out.","الاستبعاد 97.76 مليون ريال. والعشرون مليوناً من الرواتب المرسملة لا تضيع: فهي ضمن القيمة الدفترية للمصنع وتحقق عائدها عبر استبعاد الأصول."],"r":["59(1)","59(2)","60(1)","61(1)","104(1)","104(2)"],"p":["SBIE is SAR 97.76m: SAR 25.76m for payroll plus SAR 72m for assets.","الاستبعاد 97.76 مليون ريال: 25.76 مليون للرواتب و72 مليوناً للأصول."],"diagrams":[{"type":"formula","at":"answer","title":["The allowance for FY2027","البدل لعام 2027م"],"rows":[{"l":["Payroll carve-out","استبعاد الرواتب"],"r":["SAR 280m × 9.2% = SAR 25.76m","280 مليون ريال × 9.2% = 25.76 مليون ريال"]},{"l":["Asset carve-out","استبعاد الأصول"],"r":["SAR 1,000m × 7.2% = SAR 72m","1,000 مليون ريال × 7.2% = 72 مليون ريال"]},{"l":["SBIE","الاستبعاد"],"r":["SAR 97.76m","97.76 مليون ريال"]}],"note":["The SAR 20m of capitalised payroll earns its return through the plant's carrying value instead.","تحقق الرواتب المرسملة البالغة 20 مليون ريال عائدها عبر القيمة الدفترية للمصنع بدلاً من ذلك."]}]},{"t":["The same business in FY2033","النشاط نفسه في 2033م"],"facts":["Assume the same eligible payroll (SAR 280m after capitalisation) and assets (SAR 1,000m) in FY2033, when both rates are 5%, and a top-up percentage of 3%.","افترض الرواتب المؤهلة نفسها (280 مليون ريال بعد الرسملة) والأصول نفسها (1,000 مليون ريال) في 2033م، حين تبلغ النسبتان 5%، ونسبة ضريبة تكميلية 3%."],"steps":[{"t":["Payroll carve-out at 5%:","استبعاد الرواتب بنسبة 5%:"],"x":"280000000*5/100","v":14000000,"u":"SAR"},{"t":["Asset carve-out at 5%:","استبعاد الأصول بنسبة 5%:"],"x":"1000000000*5/100","v":50000000,"u":"SAR"},{"t":["SBIE in FY2033:","الاستبعاد في 2033م:"],"x":"14000000+50000000","v":64000000,"u":"SAR"},{"t":["Fall in the allowance since FY2027:","انخفاض البدل منذ 2027م:"],"x":"97760000-64000000","v":33760000,"u":"SAR"},{"t":["Extra top-up tax from that fall at 3%:","الضريبة التكميلية الإضافية الناتجة عن ذلك بنسبة 3%:"],"x":"3/100*33760000","v":1012800,"u":"SAR"}],"ans":["With nothing else changing, excess profit rises by SAR 33.76m and the top-up tax by about SAR 1m a year. Models built on 2027 rates will understate later years.","مع ثبات كل شيء آخر يرتفع الربح الزائد بمقدار 33.76 مليون ريال، وترتفع الضريبة التكميلية بنحو مليون ريال سنوياً. والنماذج المبنية على نسب 2027م ستُقلّل تقدير السنوات اللاحقة."],"r":["59(1)","60(1)","104(1)","104(2)"],"p":["By FY2033 the allowance shrinks by SAR 33.76m, adding about SAR 1m of top-up a year.","بحلول 2033م يتقلص البدل بمقدار 33.76 مليون ريال، فتزيد الضريبة التكميلية بنحو مليون ريال سنوياً."],"diagrams":[{"type":"columns","at":"answer","title":["The same business, a smaller allowance","النشاط نفسه وبدل أصغر"],"cap":["SBIE, SAR million","الاستبعاد، بملايين الريالات"],"items":[{"l":["FY2027","2027م"],"v":97.76},{"l":["FY2033","2033م"],"v":64}],"note":["At a 3% top-up percentage, the SAR 33.76m fall costs about SAR 1m a year.","عند نسبة ضريبة تكميلية 3% يكلّف الانخفاض البالغ 33.76 مليون ريال نحو مليون ريال سنوياً."]}]},{"t":["Whose pay counts?","رواتب من تُحتسب؟"],"facts":["A Saudi company's FY2027 people costs:\n• Employees working in the Kingdom, including part-timers: SAR 200m\n• Independent contractors working in its plant under its direction and control: SAR 30m\n• Fees to an outside cleaning firm (its staff are not under the company's direction): SAR 5m\n• Employees working full-time in its UAE branch (a PE): SAR 15m","تكاليف الأفراد لشركة في المملكة للسنة المالية 2027م:\n• موظفون يعملون في المملكة، بمن فيهم موظفو الدوام الجزئي: 200 مليون ريال\n• مقاولون مستقلون يعملون في مصنعها تحت توجيهها وإشرافها: 30 مليون ريال\n• أتعاب شركة نظافة خارجية (موظفوها ليسوا تحت توجيه الشركة): 5 ملايين ريال\n• موظفون يعملون بدوام كامل في فرعها بالإمارات (منشأة دائمة): 15 مليون ريال"],"steps":[{"t":["The cleaning firm's staff are not under the group's direction and control, so its fees are out.","موظفو شركة النظافة ليسوا تحت توجيه المجموعة وإشرافها، فتُستبعد أتعابها."]},{"t":["The UAE staff work for the group in the UAE, so they count, if at all, for the UAE branch.","موظفو الإمارات يعملون للمجموعة في الإمارات، فيُحتسبون، إن احتُسبوا، لفرع الإمارات."]},{"t":["Eligible payroll for the Kingdom:","الرواتب المؤهلة للمملكة:"],"x":"200000000+30000000","v":230000000,"u":"SAR"},{"t":["Payroll carve-out at 9.2%:","استبعاد الرواتب بنسبة 9.2%:"],"x":"230000000*9.2/100","v":21160000,"u":"SAR"}],"ans":["SAR 230m is eligible, giving a SAR 21.16m payroll carve-out for FY2027. Part-timers and contractors under the group's direction count; outsourced services and staff working abroad do not count for the Kingdom.","يؤهل 230 مليون ريال، فيكون استبعاد الرواتب 21.16 مليون ريال لعام 2027م. ويُحتسب موظفو الدوام الجزئي والمقاولون تحت توجيه المجموعة؛ ولا تُحتسب للمملكة الخدمات الخارجية ولا الموظفون العاملون في الخارج."],"r":["59(1)","62(1)","62(2)"],"p":["SAR 230m is eligible: staff in the Kingdom and directed contractors. The cleaners and the UAE staff are out.","يؤهل 230 مليون ريال: الموظفون في المملكة والمقاولون تحت التوجيه. ويُستبعد عمال النظافة وموظفو الإمارات."],"diagrams":[{"type":"table","at":"answer","title":["Whose pay counts for the Kingdom","رواتب من تُحتسب للمملكة"],"head":[["People cost","تكلفة الأفراد"],["SAR","ريال"],["Counts?","تُحتسب؟"]],"rows":[[["Employees in the Kingdom, part-timers included","الموظفون في المملكة، ومنهم الدوام الجزئي"],["200m","200 مليون"],["✓","✓"]],[["Contractors under its direction","المقاولون تحت توجيهها"],["30m","30 مليون"],["✓","✓"]],[["Outside cleaning firm","شركة النظافة الخارجية"],["5m","5 ملايين"],["✗ not under the group's direction","✗ ليست تحت توجيه المجموعة"]],[["UAE branch staff","موظفو فرع الإمارات"],["15m","15 مليون"],["✗ for the UAE branch, if at all","✗ لفرع الإمارات إن احتُسبت"]]]}]}],"quiz":[{"q":["What makes up the substance-based income exclusion?","مِمّ يتكون الاستبعاد على أساس جوهر النشاط؟"],"o":[["Payroll carve-out plus intangible asset carve-out","استبعاد الرواتب مع استبعاد الأصول غير الملموسة"],["Payroll carve-out plus tangible asset carve-out","استبعاد الرواتب مع استبعاد الأصول الملموسة"],["Tangible asset carve-out plus a revenue carve-out","استبعاد الأصول الملموسة مع استبعاد للإيرادات"],["Intangible asset carve-out plus a revenue carve-out","استبعاد الأصول غير الملموسة مع استبعاد للإيرادات"]],"a":1,"e":["Article 58(1): the sum of each Saudi entity's payroll carve-out and tangible asset carve-out. There is no revenue or intangibles carve-out.","المادة 58 (1): مجموع استبعاد الرواتب واستبعاد الأصول الملموسة لكل كيان في المملكة. ولا يوجد استبعاد للإيرادات ولا للأصول غير الملموسة."],"r":["58(1)"]},{"q":["Which entities are left out of the Kingdom's SBIE?","أي الكيانات تُستبعد من استبعاد المملكة؟"],"o":[["Loss-making entities, whose payroll and assets do not count","الكيانات الخاسرة، التي لا تُحتسب رواتبها وأصولها"],["Investment entities and insurance investment entities","كيانات الاستثمار وكيانات التأمين الاستثماري"],["Permanent establishments, which lack separate legal personality","المنشآت الدائمة، التي ليست لها شخصية قانونية مستقلة"],["Zakat-paying entities, which are not taxed on income","الكيانات الدافعة للزكاة، التي لا تخضع لضريبة على الدخل"]],"a":1,"e":["Article 58(1) leaves out only investment entities and insurance investment entities. Loss-makers, PEs and Zakat payers all count.","تستبعد المادة 58 (1) كيانات الاستثمار وكيانات التأمين الاستثماري فقط. أما الكيانات الخاسرة والمنشآت الدائمة ودافعو الزكاة فتُحتسب جميعاً."],"r":["58(1)"]},{"q":["What are the carve-out rates for a fiscal year beginning in 2027?","ما نسب الاستبعاد لسنة مالية تبدأ في 2027م؟"],"o":[["9.0% payroll, 7.0% tangible assets","9.0% للرواتب و7.0% للأصول الملموسة"],["7.2% payroll, 9.2% tangible assets","7.2% للرواتب و9.2% للأصول الملموسة"],["10% payroll, 8% tangible assets","10% للرواتب و8% للأصول الملموسة"],["9.2% payroll, 7.2% tangible assets","9.2% للرواتب و7.2% للأصول الملموسة"]],"a":3,"e":["Article 104(1)–(2): 9.2% and 7.2% for years beginning in 2027. 9.0% and 7.0% are the 2028 rates.","المادة 104 (1)–(2): 9.2% و7.2% للسنوات التي تبدأ في 2027م. أما 9.0% و7.0% فهما نسبتا 2028م."],"r":["104(1)","104(2)"]},{"q":["What are the rates for a fiscal year beginning in 2030?","ما النسب لسنة مالية تبدأ في 2030م؟"],"o":[["8.2% payroll, 6.6% assets","8.2% للرواتب و6.6% للأصول"],["6.6% payroll, 5.8% assets","6.6% للرواتب و5.8% للأصول"],["7.4% payroll, 6.2% assets","7.4% للرواتب و6.2% للأصول"],["6.2% payroll, 7.4% assets","6.2% للرواتب و7.4% للأصول"]],"a":2,"e":["Article 104: 7.4% payroll and 6.2% assets for years beginning in 2030. 2029 is 8.2%/6.6% and 2031 is 6.6%/5.8%.","المادة 104: 7.4% للرواتب و6.2% للأصول للسنوات التي تبدأ في 2030م. ونسبتا 2029م هما 8.2% و6.6%، و2031م هما 6.6% و5.8%."],"r":[104]},{"q":["Which of these is NOT an eligible payroll cost?","أي مما يلي ليس من تكاليف الرواتب المؤهلة؟"],"o":[["Payroll capitalised into a plant under construction","رواتب مرسملة في مصنع تحت الإنشاء"],["Salaries and wages of eligible employees in the Kingdom","رواتب وأجور الموظفين المؤهلين في المملكة"],["Employer social security contributions, such as GOSI","اشتراكات صاحب العمل في التأمينات الاجتماعية"],["Health insurance and pension contributions for employees","التأمين الصحي واشتراكات التقاعد للموظفين"]],"a":0,"e":["Article 59(1)(a) excludes payroll capitalised into eligible tangible assets; the others are in Article 59(2).","تستبعد المادة 59 (1) (أ) الرواتب المرسملة في أصول ملموسة مؤهلة؛ والبقية في المادة 59 (2)."],"r":["59(1)","59(2)"]},{"q":["A shipping company's crew costs relate to excluded international shipping income. Do they count?","تكاليف طاقم شركة شحن تتعلق بدخل شحن دولي مستبعد. هل تُحتسب؟"],"o":[["Yes: crew are eligible employees, so their pay counts","نعم: فالطاقم موظفون مؤهلون، فتُحتسب رواتبهم"],["Only the pay of Saudi crew members, whatever the income","تُحتسب رواتب أفراد الطاقم السعوديين فقط، أياً كان الدخل"],["Yes, but at the 5% steady-state rate, not the 2027 rate","نعم، ولكن بالنسبة الدائمة 5%، لا بنسبة 2027م"],["No: payroll attributable to excluded shipping income is left out","لا: تُستبعد الرواتب المنسوبة إلى دخل الشحن المستبعد"]],"a":3,"e":["Article 59(1)(b): payroll attributable to excluded international shipping income is left out, so the carve-out does not shield income that is already excluded.","المادة 59 (1) (ب): تُستبعد الرواتب المنسوبة إلى دخل الشحن الدولي المستبعد، فلا يحمي الاستبعاد دخلاً مستبعداً أصلاً."],"r":["59(1)"]},{"q":["Who counts as an eligible employee?","من يُعد موظفاً مؤهلاً؟"],"o":[["Full-time employees on the payroll, but not contractors","موظفو الدوام الكامل على كشوف الرواتب، دون المقاولين"],["Anyone paid by the group, including outsourced service providers' staff","كل من تدفع له المجموعة، بمن فيهم موظفو مقدمي الخدمات الخارجيين"],["Employees and contractors, but only those who are Saudi nationals","الموظفون والمقاولون، ولكن من المواطنين السعوديين فقط"],["All employees, part-time too, and contractors working under the group's direction","جميع الموظفين، ومنهم موظفو الدوام الجزئي، والمقاولون العاملون تحت توجيه المجموعة"]],"a":3,"e":["Article 62(2): employees, including part-timers, and independent contractors in the group's ordinary operating activities under its direction and control.","المادة 62 (2): الموظفون، ومنهم موظفو الدوام الجزئي، والمقاولون المستقلون في الأنشطة التشغيلية الاعتيادية للمجموعة تحت توجيهها وإشرافها."],"r":["62(2)"]},{"q":["Which is NOT an eligible tangible asset?","أي مما يلي ليس أصلاً ملموساً مؤهلاً؟"],"o":[["A lessee's right of use of a warehouse in the Kingdom","حق المستأجر في استخدام مستودع في المملكة"],["A government mining licence with significant plant investment","ترخيص تعدين حكومي يتضمن استثماراً كبيراً في المصانع"],["Capitalised software used to run the business","برمجيات مرسملة تُستخدم في تشغيل النشاط"],["Natural resources located in the Kingdom","موارد طبيعية تقع في المملكة"]],"a":2,"e":["Article 61(1) is a closed list: PP&E, natural resources, a lessee's right of use of tangible assets, and qualifying government licences. Standalone software is an intangible, so it is es.","استبعاد الرواتب + استبعاد الأصول الملموسة للكيانات في المملكة، عدا كيانات الاستثمار."],"r":["58(1)"]},{"f":["Payroll carve-out","استبعاد الرواتب"],"b":["5% of eligible payroll costs of eligible employees working for the group in the Kingdom.","5% من تكاليف الرواتب المؤهلة للموظفين المؤهلين العاملين للمجموعة في المملكة."],"r":["59(1)"]},{"f":["Eligible payroll costs","تكاليف الرواتب المؤهلة"],"b":["Compensation incl. health and pension benefits; payroll and employment taxes; employer social security.","التعويضات ومنها مزايا الصحة والتقاعد؛ وضرائب الرواتب والتوظيف؛ والتأمينات الاجتماعية لصاحب العمل."],"r":["59(2)"]},{"f":["Payroll left out","رواتب مستبعدة"],"b":["Capitalised into eligible tangible assets; attributable to excluded international shipping income.","المرسملة في أصول ملموسة مؤهلة؛ والمنسوبة إلى دخل الشحن الدولي المستبعد."],"r":["59(1)"]},{"f":["Eligible employees","الموظفون المؤهلون"],"b":["Employees incl. part-time, plus independent contractors under the group's direction and control.","الموظفون ومنهم الدوام الجزئي، والمقاولون المستقلون تحت توجيه المجموعة وإشرافها."],"r":["62(2)"]},{"f":["Tangible asset carve-out","استبعاد الأصول الملموسة"],"b":["5% of the carrying value of eligible tangible assets located in the Kingdom.","5% من القيمة الدفترية للأصول الملموسة المؤهلة الواقعة في المملكة."],"r":["60(1)"]},{"f":["Eligible tangible assets","الأصول الملموسة المؤهلة"],"b":["PP&E, natural resources, right-of-use assets, qualifying government licences, all in the jurisdiction.","الممتلكات والمصانع والمعدات، والموارد الطبيعية، وأصول حق الاستخدام، والتراخيص الحكومية المؤهلة، كلها في الولاية."],"r":["61(1)"]},{"f":["PE carve-outs","استبعادات المنشأة الدائمة"],"b":["From the PE's separate accounts, if people and assets are in the PE's jurisdiction.","من حسابات المنشأة المنفصلة، إذا كان الأفراد والأصول في ولايتها."],"r":["62(1)"]},{"f":["2027 rates","نسب 2027م"],"b":["Payroll 9.2%, tangible assets 7.2%.","الرواتب 9.2%، والأصول الملموسة 7.2%."],"r":[104]},{"f": لكة: استثناء الحد الأدنى، والملاذ الآمن الانتقالي للتقرير حسب كل دولة واختباراته الثلاثة، والملاذات الآمنة الأخرى، والإعفاء من الغرامات في السنوات الأولى."],"parts":[5,6],"arts":[64,66,67,68,69,70,71,72],"time":35,"metaphor":{"title":["Express lanes at the border","مسارات سريعة عند المنفذ"],"text":["Most travellers queue for full inspection: the full DMT computation. A few lanes let you through quickly if you pass simple tests: a small presence (de minimis), country-by-country report tests in the early years (the transitional CbCR safe harbour), and newer lanes whose rules the Regulations will publish.\nThe express lanes have cameras: for 36 months ZATCA can ask whether the facts really fitted. And in the first years, a traveller who made honest, careful efforts is not fined for mistakes.","يقف معظم المسافرين في طابور التفتيش الكامل: الاحتساب الكامل. وبعض المسارات يسمح بالعبور السريع لمن يجتاز اختبارات بسيطة: الوجود المحدود (الحد الأدنى)، واختبارات التقرير حسب كل دولة في السنوات الأولى (الملاذ الآمن الانتقالي)، ومسارات أحدث ستنشر اللائحة شروطها.\nوللمسارات السريعة كاميرات: فللهيئة خلال 36 شهراً أن تسأل هل كانت الوقائع مطابقة فعلاً. وفي السنوات الأولى لا يُغرّم المسافر الذي بذل جهداً صادقاً وحريصاً على أخطائه."]},"anchors":[{"if":["Three-year average Saudi revenue is under €10m and average income is under €1m or a loss","متوسط إيرادات المملكة لثلاث سنوات أقل من 10 ملايين يورو ومتوسط الدخل أقل من مليون يورو أو خسارة"],"then":["Elect de minimis for the year: top-up tax deemed zero (Art 64)","اختر استثناء الحد الأدنى للسنة: تُعد الضريبة التكميلية صفراً (المادة 64)"]},{"if":["It is FY2027 and the group files a qualified CbC report","إنها السنة المالية 2027م والمجموعة تقدم تقريراً مؤهلاً حسب كل دولة"],"then":["Test the three CbCR safe harbour tests; passing any one is enough (Art 67(1))","طبّق اختبارات الملاذ الآمن الثلاثة؛ ويكفي اجتياز أي منها (المادة 67 (1))"]},{"if":["The group was under GloBE earlier but did not use the CbCR safe harbour for the Kingdom","كانت المجموعة خاضعة للقواعد العالمية سابقاً ولم تستخدم الملاذ الآمن للمملكة"],"then":["It cannot use it later: once out, always out (Art 68(3))","لا يمكنها استخدامه لاحقاً: من خرج لا يعود (المادة 68 (3))"]},{"if":["ZATCA questions a safe harbour within 36 months","الهيئة تستفسر عن ملاذ آمن خلال 36 شهراً"],"then":["You have six months to show the facts did not materially affect eligibility (Art 66(3))","لديك ستة أشهر لإثبات أن الوقائع لم تؤثر جوهرياً في الأهلية (المادة 66 (3))"]},{"if":["A filing error happens in the transition period despite good-faith efforts","وقع خطأ في الإقرار خلال الفترة الانتقالية رغم الجهد بحسن نية"],"then":["No penalties where ZATCA considers reasonable measures were taken (Art 72)","لا غرامات إذا رأت الهيئة أن تدابير معقولة قد اتُخذت (المادة 72)"]}],"diagrams":[{"type":"tree","title":["Transitional CbCR safe harbour for the Kingdom","الملاذ الآمن الانتقالي للتقرير حسب كل دولة للمملكة"],"root":{"q":["Is the fiscal year in the transition period, and does the group prepare a qualified CbC report?","هل السنة المالية ضمن الفترة الانتقالية، وهل تُعد المجموعة تقريراً مؤهلاً حسب كل دولة؟"],"no":{"end":["Not available","غير متاح"],"tone":"out"},"yes":{"q":["Was the group under this law or GloBE in an earlier year, with Saudi entities, without using this safe harbour for the Kingdom?","هل خضعت المجموعة لهذا النظام أو للقواعد العالمية في سنة سابقة، ولها كيانات في المملكة، دون أن تستخدم هذا الملاذ للمملكة؟"],"yes":{"end":["Not available: once out, always out (Art 68(3))","غير متاح: من خرج لا يعود (المادة 68 (3))"],"tone":"out"},"no":{"q":["Does any one test pass: (a) revenue < €10m and PBT < €1m; (b) simplified ETR ≥ 17%; (c) PBT ≤ SBIE?","هل يُجتاز أي اختبار: (أ) الإيرادات < 10 ملايين يورو والربح قبل الضريبة < مليون يورو؛ (ب) المعدل المبسط ≥ 17%؛ (ج) الربح قبل الضريبة ≤ الاستبعاد؟"],"yes":{"end":["Elect it: top-up tax deemed zero (Art 66(1))","اختره: تُعد الضريبة التكميلية صفراً (المادة 66 (1))"],"tone":"in"},"no":{"end":["Full computation (or another safe harbour)","احتساب كامل (أو ملاذ آمن آخر)"],"tone":"na"}}}},"quick":true},{"type":"table","title":["The menu of reliefs","قائمة أوجه التخفيف"],"head":[["Relief","وجه التخفيف"],["Conditions in","الشروط في"],["Effect","الأثر"]],"rows":[[["De minimis exclusion","استثناء الحد الأدنى"],["Art 64","المادة 64"],["Top-up tax deemed zero; annual election","تُعد الضريبة التكميلية صفراً؛ اختيار سنوي"]],[["Transitional CbCR safe harbour","الملاذ الآمن الانتقالي للتقرير حسب كل دولة"],["Arts 67–68 (17% for years beginning in 2027)","المادتان 67–68 (17% للسنوات التي تبدأ في 2027م)"],["Top-up tax deemed zero","تُعد الضريبة التكميلية صفراً"]],[["Simplified ETR safe harbour","الملاذ الآمن للمعدل الفعلي المبسط"],["Regulations (Art 69)","اللائحة (المادة 69)"],["Top-up tax deemed zero","تُعد الضريبة التكميلية صفراً"]],[["NMCE simplified calculations safe harbour","الملاذ الآمن للاحتساب المبسط للكيانات غير الجوهرية"],["Regulations (Art 70)","اللائحة (المادة 70)"],["Top-up tax deemed zero","تُعد الضريبة التكميلية صفراً"]],[["Substance-based tax incentive safe harbour","الملاذ الآمن للحوافز الضريبية القائمة على الجوهر"],["Regulations (Art 71)","اللائحة (المادة 71)"],["Top-up tax from qualified tax incentives deemed zero","تُعد الضريبة التكميلية الناتجة عن الحوافز الضريبية المؤهلة صفراً"]],[["Transitional penalty relief","الإعفاء الانتقالي من الغرامات"],["Art 72","المادة 72"],["No penalties on the returns if reasonable measures were taken","لا غرامات على الإقرارات إذا اتُخذت تدابير معقولة"]]]}],"points":[{"h":["De minimis exclusion","استثناء الحد الأدنى"],"t":["By annual election, the Kingdom's top-up tax is deemed zero if the three-year average DMT revenue of the Saudi entities is below the riyal equivalent of €10m and their three-year average DMT income is a loss or below €1m. Years with no Saudi entities are left out of the average. It does not apply to stateless or investment entities, whose figures are left out.","باختيار سنوي، تُعد الضريبة التكميلية للمملكة صفراً إذا كان متوسط إيرادات الكيانات في المملكة لثلاث سنوات أقل مما يعادل 10 ملايين يورو بالريال، وكان متوسط دخلها لثلاث سنوات خسارة أو أقل من مليون يورو. وتُستبعد من المتوسط السنوات التي لم تكن فيها كيانات في المملكة. ولا ينطبق على الكيانات عديمة الجنسية أو كيانات الاستثمار، وتُستبعد أرقامها."],"r":["64(1)","64(2)","64(3)","64(4)","64(6)","64(7)"],"p":["Small presence: revenue under €10m and income under €1m, averaged over three years, means a zero top-up.","الوجود المحدود: إيرادات دون 10 ملايين يورو ودخل دون مليون يورو، بمتوسط ثلاث سنوات، يعني ضريبة تكميلية صفرية."]},{"h":["What a DMT safe harbour does","ما يفعله الملاذ الآمن"],"t":["If the Saudi entities qualify and the filing entity elects, the Kingdom's top-up tax is deemed zero for the year. The substance-based tax incentive safe harbour works more narrowly: only the top-up tax that corresponds to qualified tax incentives is deemed zero.","إذا تأهلت الكيانات في المملكة واختار الكيان المقدم للإقرار، تُعد الضريبة التكميلية للمملكة صفراً عن السنة. ويعمل الملاذ الآمن للحوافز الضريبية القائمة على الجوهر بنطاق أضيق: فلا يُعد صفراً إلا ما يقابل الحوافز الضريبية المؤهلة من الضريبة التكميلية."],"r":["66(1)","66(2)","66(4)"],"p":["Pass a safe harbour and elect it: the top-up is treated as zero for the year.","اجتز ملاذاً آمناً واختره: تُعد الضريبة التكميلية صفراً للسنة."]},{"h":["The three CbCR tests","اختبارات التقرير حسب كل دولة الثلاثة"],"t":["In the transition period, the Saudi entities qualify if any one test is met: (a) CbCR total revenue under €10m and profit before income tax under €1m in the Kingdom; (b) a simplified ETR at or above the transition rate; or (c) profit before income tax no more than the substance-based income exclusion of the Saudi entities.","في الفترة الانتقالية تتأهل الكيانات في المملكة إذا تحقق أي اختبار واحد: (أ) إجمالي إيرادات أقل من 10 ملايين يورو وربح قبل ضريبة الدخل أقل من مليون يورو في المملكة وفق التقرير؛ (ب) معدل فعلي مبسط يساوي معدل الانتقال أو يزيد عليه؛ (ج) ربح قبل ضريبة الدخل لا يتجاوز الاستبعاد على أساس جوهر النشاط للكيانات في المملكة."],"r":["67(1)"],"p":["In the early years, pass any one of three tests built on the CbC report.","في السنوات الأولى، اجتز أياً من ثلاثة اختبارات مبنية على التقرير حسب كل دولة."]},{"h":["17% and the transition period","17% والفترة الانتقالية"],"t":["The transition rate is 17% for fiscal years beginning in 2027. The transition period covers fiscal years beginning on or before 31 December 2027, but not a fiscal year ending after 30 June 2029. As the law starts in 2027, this is in practice a one-year relief for the Kingdom.","معدل الانتقال 17% للسنوات المالية التي تبدأ في 2027م. وتشمل الفترة الانتقالية السنوات المالية التي تبدأ في 31 ديسمبر 2027م أو قبله، دون السنة المالية التي تنتهي بعد 30 يونيو 2029م. ولأن النظام يبدأ في 2027م، فهذا عملياً تخفيف لسنة واحدة في المملكة."],"r":["67(2)","67(8)","106(1)"],"p":["The rate test needs 17% for 2027; in practice the relief covers one year.","يتطلب اختبار المعدل 17% لعام 2027م؛ ويغطي التخفيف عملياً سنة واحدة."]},{"h":["Simplified covered taxes include Zakat","الضرائب المشمولة المبسطة تشمل الزكاة"],"t":["The simplified ETR divides simplified covered taxes, meaning the income tax and Zakat expense in the qualified financial statements for the Kingdom after removing taxes that are not covered taxes and uncertain tax positions, by profit before income tax per the qualified CbC report.","يقسم المعدل المبسط الضرائب المشمولة المبسطة، أي مصروف ضريبة الدخل والزكاة في القوائم المالية المؤهلة للمملكة بعد استبعاد الضرائب غير المشمولة والمراكز الضريبية غير المؤكدة، على الربح قبل ضريبة الدخل وفق التقرير المؤهل."],"r":["67(7)"],"p":["The simplified rate counts Zakat with income tax, less uncertain positions.","يحتسب المعدل المبسط الزكاة مع ضريبة الدخل، ناقصاً المراكز غير المؤكدة."]},{"h":["Qualified CbC report","التقرير المؤهل حسب كل دولة"],"t":["The safe harbour applies only if the group prepares a qualified CbC report: one prepared from qualified financial statements, meaning the consolidation accounts, separate statements under an acceptable or authorised standard, or the accounts used for the CbC report of an entity left out of consolidation for size or materiality.","لا يُطبق الملاذ إلا إذا أعدت المجموعة تقريراً مؤهلاً حسب كل دولة: أي معداً من قوائم مالية مؤهلة، وهي حسابات التوحيد، أو القوائم المنفصلة وفق معيار مقبول أو معتمد، أو الحسابات المستخدمة في التقرير لكيان مستبعد من التوحيد لأسباب الحجم أو الأهمية النسبية."],"r":["67(3)","67(4)"],"p":["The CbC report must be built from qualified financial statements.","يجب إعداد التقرير حسب كل دولة من قوائم مالية مؤهلة."]},{"h":["Who cannot use it","من لا يمكنه استخدامه"],"t":["Stateless entities; multi-parented groups whose single CbC report does not combine the groups; and groups that were under this law or GloBE in an earlier year, with Saudi entities, and did not benefit from the safe harbour in the Kingdom that year.","الكيانات عديمة الجنسية؛ والمجموعات متعددة الكيانات الأم التي لا يجمع تقريرها الواحد المجموعات؛ والمجموعات التي خضعت لهذا النظام أو للقواعد العالمية في سنة سابقة ولها كيانات في المملكة ولم تستفد من الملاذ في المملكة في تلك السنة."],"r":[68],"p":["Not for stateless entities or some multi-parented groups; and once out, always out.","لا يجوز للكيانات عديمة الجنسية ولا لبعض المجموعات متعددة الكيانات الأم؛ ومن لم يستفد منه في سنة سابقة لا يعود إليه."]},{"h":["The newer safe harbours","الملاذات الآمنة الأحدث"],"t":["The simplified ETR safe harbour, the NMCE simplified calculations safe harbour and the substance-based tax incentive safe harbour are in the law, but their conditions are left to the Regulations.","الملاذ الآمن للمعدل الفعلي المبسط، والملاذ الآمن للاحتساب المبسط للكيانات غير الجوهرية، والملاذ الآمن للحوافز الضريبية القائمة على الجوهر منصوص عليها في النظام، لكن شروطها متروكة للائحة."],"r":[69,70,71],"p":["Three newer safe harbours are in the law; the Regulations will set their tests.","ثلاثة ملاذات آمنة أحدث واردة في النظام؛ وستحدد اللائحة شروطها."]},{"h":["ZATCA's 36-month review","مراجعة الهيئة خلال 36 شهراً"],"t":["A safe harbour election falls away if: the Kingdom could have had top-up tax with an ETR below 15%; ZATCA notifies the liable entities, within 36 months of filing, of facts that may have materially affected eligibility and invites them to clarify within six months; and they fail to show that eligibility was not materially affected.","يسقط اختيار الملاذ الآمن إذا: كان يمكن أن تنشأ ضريبة تكميلية في المملكة بمعدل فعلي أقل من 15%؛ وأخطرت الهيئة الكيانات الملزمة خلال 36 شهراً من تقديم الإقرار بوقائع قد تكون أثرت جوهرياً في الأهلية ودعتها للإيضاح خلال ستة أشهر؛ وعجزت عن إثبات أن الأهلية لم تتأثر جوهرياً."],"r":["66(3)","66(5)"],"p":["ZATCA has 36 months from filing to question whether the group really qualified.","لدى الهيئة 36 شهراً من تقديم الإقرار للتحقق من أهلية المجموعة فعلاً."]},{"h":["Transitional penalty relief","الإعفاء الانتقالي من الغرامات"],"t":["During the transition period, no penalties apply to the domestic top-up tax return and GloBE information return where ZATCA considers that the group took reasonable measures, for example by showing it acted in good faith to understand and comply with the law.","خلال الفترة الانتقالية لا تُطبق غرامات على إقرار الضريبة التكميلية المحلية وإقرار معلومات القواعد العالمية إذا رأت الهيئة أن المجموعة اتخذت تدابير معقولة، كأن تثبت أنها تصرفت بحسن نية لفهم النظام والالتزام به."],"r":[72],"p":["No penalties in the early years if the group made reasonable, good-faith efforts.","لا غرامات في السنوات الأولى إذا اتخذت المجموعة تدابير معقولة بحسن نية."]}],"oecd":[{"t":["Articles 66 to 72 track the OECD's December 2022 safe harbour and penalty relief guidance and the Side-by-Side Package of 5 January 2026, which added a permanent simplified ETR safe harbour and a substance-based tax incentive safe harbour and extended the transitional CbCR safe harbour by one year to include 2027. The OECD's original transition rates were 15% for 2023 and 2024, 16% for 2025 and 17% for 2026; the draft applies 17% to years beginning in 2027.","تتبع المواد من 66 إلى 72 إرشادات المنظمة بشأن الملاذات الآمنة والإعفاء من الغرامات الصادرة في ديسمبر 2022م، وحزمة «جنباً إلى جنب» الصادرة في 5 يناير 2026م، التي أضافت ملاذاً آمناً دائماً للمعدل الفعلي المبسط وملاذاً آمناً للحوافز الضريبية القائمة على الجوهر، ومددت الملاذ الآمن الانتقالي للتقرير حسب كل دولة سنة واحدة ليشمل 2027م. وكانت معدلات الانتقال الأصلية لدى المنظمة 15% لعامي 2023 و2024م، و16% لعام 2025م، و17% لعام 2026م؛ ويطبق مشروع النظام 17% على السنوات التي تبدأ في 2027م."],"src":["OECD safe harbours guidance (Dec 2022); Side-by-Side Package (5 Jan 2026)","إرشادات المنظمة للملاذات الآمنة (ديسمبر 2022م)؛ حزمة «جنباً إلى جنب» (5 يناير 2026م)"]},{"t":["The same package's side-by-side and UPE safe harbours relieve only the IIR and UTPR. They do not switch off domestic minimum taxes, so US-parented groups with Saudi entities remain within the draft law.","أما الملاذان الآمنان «جنباً إلى جنب» والخاص بالكيان الأم النهائي في الحزمة نفسها فيخففان قاعدتي تضمين الدخل والأرباح الخاضعة لمعدل منخفض فقط، ولا يوقفان الضرائب المحلية الدنيا، لذا تبقى المجموعات الأمريكية الأم ذات الكيانات في المملكة ضمن مشروع النظام."],"src":["Side-by-Side Package (5 Jan 2026)","حزمة «جنباً إلى جنب» (5 يناير 2026م)"]},{"t":["KSA angle: Article 67(7) puts Zakat expense into simplified covered taxes. A Zakat-only entity whose Zakat is small relative to profit may fail the 17% test, so check the routine profits test as well.","من منظور المملكة: تُدخل المادة 67 (7) مصروف الزكاة في الضرائب المشمولة المبسطة. وقد يخفق الكيان الخاضع للزكاة وحدها، إذا كانت زكاته صغيرة نسبةً إلى ربحه، في اختبار 17%، فافحص اختبار الأرباح الاعتيادية أيضاً."],"src":["Draft Art 67","المشروع م 67"]}],"cases":[{"t":["Passing on the simplified ETR, with Zakat in","الاجتياز بالمعدل المبسط مع احتساب الزكاة"],"facts":["FY2027 qualified CbC report, Saudi Arabia: total revenues SAR 2,000m; profit before income tax SAR 300m. Qualified financial statements show income tax expense SAR 36m and Zakat expense SAR 18m, of which SAR 3m is an uncertain tax position. The SBIE under the law is SAR 120m.","التقرير المؤهل حسب كل دولة لعام 2027م، المملكة: إجمالي الإيرادات 2,000 مليون ريال؛ والربح قبل ضريبة الدخل 300 مليون ريال. وتُظهر القوائم المؤهلة مصروف ضريبة دخل 36 مليون ريال ومصروف زكاة 18 مليون ريال، منها 3 ملايين مركز ضريبي غير مؤكد. والاستبعاد على أساس جوهر النشاط وفق النظام 120 مليون ريال."],"steps":[{"t":["Test (a) fails: revenue is far above €10m.","يخفق الاختبار (أ): الإيرادات أعلى بكثير من 10 ملايين يورو."]},{"t":["Simplified covered taxes (income tax + Zakat − uncertain position):","الضرائب المشمولة المبسطة (ضريبة الدخل + الزكاة − المركز غير المؤكد):"],"x":"36000000+18000000-3000000","v":51000000,"u":"SAR"},{"t":["Simplified ETR; test (b) passes at 17% or more:","المعدل المبسط؛ يُجتاز الاختبار (ب) عند 17% أو أكثر:"],"x":"51000000/300000000*100","v":17,"u":"%"},{"t":["Sensitivity: had the uncertain position been SAR 6m, the ETR would be:","حساسية: لو كان المركز غير المؤكد 6 ملايين ريال لكان المعدل:"],"x":"(36000000+18000000-6000000)/300000000*100","v":16,"u":"%"}],"ans":["The group passes test (b) at exactly 17% and may elect a zero top-up tax for the Kingdom for FY2027. Test (c) would fail (PBT SAR 300m exceeds SBIE SAR 120m), but one test is enough. A slightly larger uncertain position would have pushed it to 16% and into the full computation.","تجتاز المجموعة الاختبار (ب) عند 17% تماماً، ولها أن تختار اعتبار الضريبة التكميلية للمملكة صفراً عن 2027م. ويخفق الاختبار (ج) (الربح 300 مليون أعلى من الاستبعاد 120 مليوناً)، لكن اختباراً واحداً يكفي. ولو زاد المركز غير المؤكد قليلاً لانخفض المعدل إلى 16% ولزم الاحتساب الكامل."],"r":["67(1)","67(2)","67(7)"],"p":["Simplified ETR exactly 17%, Zakat included: test (b) passes, so the top-up is zero for FY2027.","المعدل المبسط 17% تماماً مع احتساب الزكاة: يتحقق الاختبار (ب)، فتكون الضريبة التكميلية صفراً لعام 2027م."],"diagrams":[{"type":"waterfall","at":"answer","title":["Simplified covered taxes","الضرائب المشمولة المبسطة"],"cap":["SAR million","بملايين بة 40 مليون ريال لا يتجاوز الاستبعاد البالغ 49.2 مليون ريال، فيُجتاز."]}],"ans":["The Saudi entities qualify through the routine profits test even though their Zakat-based simplified ETR is only 5%. Real payroll and assets do the work.","تتأهل الكيانات في المملكة عبر اختبار الأرباح الاعتيادية رغم أن معدلها المبسط القائم على الزكاة 5% فقط. فالرواتب والأصول الحقيقية هي التي تؤدي المهمة."],"r":["67(1)","104(1)","104(2)"],"p":["Simplified ETR is only 5%, but profit (SAR 40m) is within the SBIE (SAR 49.2m): test (c) passes.","المعدل المبسط 5% فقط، لكن الربح (40 مليون ريال) ضمن الاستبعاد (49.2 مليون ريال): يتحقق الاختبار (ج)."],"diagrams":[{"type":"columns","at":"answer","title":["Routine profits test","اختبار الأرباح الاعتيادية"],"cap":["SAR million","بملايين الريالات"],"items":[{"l":["Profit before tax","الربح قبل الضريبة"],"v":40},{"l":["SBIE at 2027 rates","الاستبعاد بنسب 2027م"],"v":49.2}],"verdict":["Profit does not exceed the SBIE, so the routine profits test is met.","الربح لا يتجاوز الاستبعاد، فيتحقق اختبار الأرباح الاعتيادية."],"vt":"in"}]}],"quiz":[{"q":["When can the de minimis exclusion be elected?","متى يمكن اختيار استثناء الحد الأدنى؟"],"o":[["When this year's revenue is under €10m and this year's income under €1m","عندما تقل إيرادات هذه السنة عن 10 ملايين يورو ودخلها عن مليون يورو"],["When 3-year average revenue is under €10m and average income is a loss or under €1m","عندما يقل متوسط الإيرادات لثلاث سنوات عن 10 ملايين يورو ويكون متوسط الدخل خسارة أو دون مليون"],["When 3-year average revenue is under €10m, whatever the level of income","عندما يقل متوسط الإيرادات لثلاث سنوات عن 10 ملايين يورو، أياً كان الدخل"],["When 3-year average revenue is under €1m and average income under €10m","عندما يقل متوسط الإيرادات لثلاث سنوات عن مليون يورو ومتوسط الدخل عن 10 ملايين"]],"a":1,"e":["Article 64(1) and (3): both three-year averages must pass: revenue under €10m, and income a loss or under €1m.","المادة 64 (1) و(3): يجب اجتياز المتوسطين لثلاث سنوات معاً: إيرادات دون 1 ,"arts":[73,74,75,76,77,78,79,80,81,82,83],"time":40,"metaphor":{"title":["A family ledger","دفتر العائلة"],"text":["Think of the group as a family that keeps one ledger for the Kingdom, and every member signs for the family's bill. When two families marry, their past pages are added together to see whether they were big enough; when a family splits, each part must show it is big enough on its own.\nA member who moves in or out mid-year counts only for the pages while it lived at home, and it brings its own old book values with it. A joint venture is a cousin's household: it keeps a separate ledger, and its members sign for that one.","تخيّل المجموعة عائلة تمسك دفتراً واحداً للمملكة، ويوقّع كل فرد فيها على فاتورة العائلة. فإذا تزوجت عائلتان جُمعت صفحاتهما السابقة لمعرفة هل بلغتا الحجم المطلوب؛ وإذا انقسمت عائلة فعلى كل جزء أن يثبت أنه بلغ الحجم بمفرده.\nومن ينتقل إلى البيت أو يخرج منه في منتصف السنة لا يُحسب إلا للصفحات التي أقام فيها، ويحمل معه قيمه الدفترية القديمة. أما المشروع المشترك فبيت ابن العم: له دفتر مستقل، ويوقّع أفراده على ذلك الدفتر."]},"anchors":[{"if":["Several Saudi taxpayers belong to the same in-scope group","عدة مكلفين في المملكة ينتمون إلى المجموعة نفسها الخاضعة للنظام"],"then":["They are jointly liable; ZATCA may approve limiting this to one or more entities (Art 73(2), 73(5))","فهم متضامنون في المسؤولية؛ وللهيئة أن توافق على قصرها على كيان أو أكثر (المادة 73 (2) و(5))"]},{"if":["Two groups merged in the last four years","اندمجت مجموعتان خلال السنوات الأربع الماضية"],"then":["Add their revenues for pre-merger years when testing €750m (Art 74(1)(a))","اجمع إيراداتهما لسنوات ما قبل الاندماج عند اختبار 750 مليون يورو (المادة 74 (1) (أ))"]},{"if":["A Saudi company is bought or sold mid-year","شركة في المملكة اشتُريت أو بيعت في منتصف السنة"],"then":["Count only the results consolidated line by line, at historical carrying values (Art 75(1))","احتسب فقط النتائج الموحدة بنداً بنداً، وبالقيم الدفترية التاريخية (المادة 75 (1))"]},{"if":["Assets move in a share-for-share merger that is tax-neutral locally","تنتقل أصول في اندماج مقابل أسهم محايد ضريبياً محلياً"],"then":["Test the DMT reorganisation conditions: if met, no gain or loss and the buyer takes the seller's values (Arts 76(2), 77)","اختبر شروط إعادة التنظيم: فإن تحققت فلا مكسب ولا خسارة، ويأخذ المشتري قيم البائع (المادتان 76 (2) و77)"]},{"if":["The UPE holds 50% or more of an equity-accounted Saudi company","يملك الكيان الأم النهائي 50% أو أكثر من شركة في المملكة محاسبة بطريقة حقوق الملكية"],"then":["It is a joint venture: compute it as a separate group; it and its subsidiaries are jointly liable (Arts 78, 79, 73(3))","فهي مشروع مشترك: احسبها كمجموعة مستقلة؛ وهي وكياناتها التابعة متضامنة في المسؤولية (المواد 78 و79 و73 (3))"]}],"diagrams":[{"type":"table","title":["Restructurings at a glance","إعادة الهيكلة في لمحة"],"head":[["Event","الحدث"],["Rule","القاعدة"],["Where","الموضع"]],"rows":[[["Two groups merge","اندماج مجموعتين"],["For pre-merger years the €750m test uses their combined revenue","في سنوات ما قبل الاندماج يُستخدم مجموع إيراداتهما لاختبار 750 مليون يورو"],["Art 74(1)(a)","المادة 74 (1) (أ)"]],[["A standalone entity joins a group","انضمام كيان مستقل إلى مجموعة"],["Combined revenue for years without consolidated statements","مجموع الإيرادات للسنوات التي لا توجد فيها قوائم موحدة"],["Art 74(1)(b)","المادة 74 (1) (ب)"]],[["A group demerges","انفصال مجموعة"],["First year after: €750m that year; years 2–4: €750m in at least two years after the demerger","السنة الأولى بعده: 750 مليون يورو فيها؛ والسنوات 2–4: 750 مليوناً في سنتين على الأقل بعد الانفصال"],["Art 74(1)(c)","المادة 74 (1) (ج)"]],[["Entity joins or leaves mid-year","انضمام كيان أو خروجه في منتصف السنة"],["Member if any part is consolidated line by line; only consolidated results; historical carrying values","عضو إذا وُحّد أي جزء منه بنداً بنداً؛ النتائج الموحدة فقط؛ والقيم الدفترية التاريخية"],["Art 75(1)","المادة 75 (1)"]],[["Share deal taxed locally like an asset deal","صفقة أسهم تخضع محلياً للضريبة كصفقة أصول"],["Treated as an acquisition or disposal of the assets and liabilities","تُعامل كاقتناء الأصول والالتزامات أو التصرف فيها"],["Art 75(2)","المادة 75 (2)"]],[["Asset sale","بيع أصول"],["Seller includes the gain or loss; buyer uses its carrying values","يدرج البائع المكسب أو الخسارة؛ ويستخدم المشتري قيمه الدفترية"],["Art 76(1)","المادة 76 (1)"]],[["DMT reorganisation","إعادة تنظيم لأغراض النظام"],["No gain or loss; buyer takes the seller's carrying values","لا مكسب ولا خسارة؛ ويأخذ المشتري القيم الدفترية للبائع"],["Art 76(2), Art 77","المادة 76 (2)، المادة 77"]]],"quick":true},{"type":"tree","title":["Is this Saudi entity a joint venture?","هل هذا الكيان في المملكة مشروع مشترك؟"],"root":{"q":["Is it reported under the equity method in the UPE's consolidated statements?","هل يُعرض بطريقة حقوق الملكية في القوائم الموحدة للكيان الأم النهائي؟"],"no":{"end":["Not a joint venture","ليس مشروعاً مشتركاً"],"tone":"na"},"yes":{"q":["Does the UPE hold at least 50% of it, directly or indirectly?","هل يملك الكيان الأم النهائي 50% منه على الأقل، مباشرة أو غير مباشرة؟"],"no":{"end":["Not a joint venture","ليس مشروعاً مشتركاً"],"tone":"na"},"yes":{"q":["Is it an in-scope UPE, an excluded entity, an investment-type entity held through an excluded entity, held by a group of excluded entities only, or a JV subsidiary?","هل هو كيان أم نهائي خاضع، أو كيان مستبعد، أو كيان استثماري الطابع مملوك عبر كيان مستبعد، أو مملوك لمجموعة من كيانات مستبعدة فقط، أو كيان تابع لمشروع مشترك؟"],"yes":{"end":["Not a joint venture (Art 79(1)–(5))","ليس مشروعاً مشتركاً (المادة 79 (1)–(5))"],"tone":"out"},"no":{"end":["Joint venture: separate computation, joint liability with its subsidiaries","مشروع مشترك: احتساب مستقل، ومسؤولية تضامنية مع كياناته التابعة"],"tone":"in"}}}}}],"points":[{"h":["Each taxpayer, and the group jointly","كل مكلف، والمجموعة بالتضامن"],"t":["Each taxpayer is liable for the domestic top-up tax it owes. Taxpayers in the same MNE group are also jointly liable for the group's domestic top-up tax and related amounts in the Kingdom for the years in which they are group members.","كل مكلف مسؤول عن الضريبة التكميلية المحلية المستحقة عليه. والمكلفون في المجموعة نفسها متضامنون أيضاً في المسؤولية عن الضريبة التكميلية المحلية للمجموعة والمبالغ المرتبطة بها في المملكة عن السنوات التي يكونون فيها أعضاء في المجموعة."],"r":["73(1)","73(2)"],"p":["Each taxpayer pays its own top-up, and group members are jointly liable for the group's bill.","يدفع كل مكلف ضريبته التكميلية، وأعضاء المجموعة متضامنون في المسؤولية عن ضريبة المجموعة."]},{"h":["Joint ventures and partnerships","المشاريع المشتركة والشراكات"],"t":["Each Saudi joint venture and JV subsidiary is jointly liable for the JV group's top-up tax. Partners in a Saudi partnership that is part of an MNE group are jointly and severally liable for the group's tax in the Kingdom, except limited partners who are not general partners.","كل مشروع مشترك وكيان تابع له في المملكة متضامن في المسؤولية عن الضريبة التكميلية لمجموعة المشروع المشترك. والشركاء في شراكة في المملكة تنتمي إلى مجموعة متعددة الجنسيات متضامنون ومتكافلون في المسؤولية عن ضريبة المجموعة في المملكة، باستثناء الشريك الموصي الذي ليس شريكاً متضامناً."],"r":["73(3)","73(4)"],"p":["JV members answer for the JV group's tax; partners for the group's tax, except limited partners.","أعضاء المشروع المشترك مسؤولون عن ضريبة مجموعته؛ والشركاء عن ضريبة المجموعة، باستثناء الشريك الموصي."]},{"h":["Limiting joint liability","قصر المسؤولية التضامنية"],"t":["With ZATCA's approval, joint liability for a fiscal year can be limited to one or more group entities.","يجوز بموافقة الهيئة قصر المسؤولية التضامنية عن سنة مالية على كيان أو أكثر من كيانات المجموعة."],"r":["73(5)"],"p":["ZATCA can approve limiting joint liability to some group entities.","يجوز بموافقة الهيئة قصر المسؤولية التضامنية على بعض كيانات المجموعة."]},{"h":["Mergers and demergers and the €750m test","الاندماج والانفصال واختبار 750 مليون يورو"],"t":["After a merger, the threshold is met for a pre-merger year if the merging groups' combined revenue for that year reaches €750m; the same applies when a standalone entity joins. A demerged group meets it in the first year after the demerger if its own revenue that year is €750m or more, and in years two to four if it reaches €750m in at least two of the years after the demerger.","بعد الاندماج يتحقق الحد عن سنة ما قبل الاندماج إذا بلغ مجموع إيرادات المجموعات المندمجة لتلك السنة 750 مليون يورو، وكذلك عند انضمام كيان مستقل. وتستوفي المجموعة المنفصلة الحد في السنة الأولى بعد الانفصال إذا بلغت إيراداتها فيها 750 مليون يورو أو أكثر، وفي السنوات من الثانية إلى الرابعة إذا بلغت ذلك في سنتين على الأقل من السنوات التالية للانفصال."],"r":["74(1)","74(2)","74(3)"],"p":["After a merger, add the groups' past revenues to test €750m; after a demerger, each part tests alone.","بعد الاندماج تُجمع إيرادات المجموعات السابقة لاختبار 750 مليون يورو؛ وبعد الانفصال يُختبر كل جزء وحده."]},{"h":["Joining or leaving during the year","الانضمام أو الخروج خلال السنة"],"t":["A target is a member for the acquisition year if any of its results are consolidated line by line. Only the income, covered taxes and payroll in the consolidated statements count, tangible assets are prorated by time in the group, the target keeps its historical carrying values, and its deferred tax moves with it.","يكون الكيان المستهدف عضواً في سنة الاقتناء إذا وُحّد أي جزء من نتائجه بنداً بنداً. ولا يُحتسب إلا الدخل والضرائب المشمولة والرواتب الواردة في القوائم الموحدة، وتُحسب الأصول الملموسة تناسبياً بحسب مدة البقاء في المجموعة، ويحتفظ المستهدف بقيمه الدفترية التاريخية، وتنتقل ضرائبه المؤجلة معه."],"r":["75(1)"],"p":["A company bought mid-year counts only for its time in the group, at its old book values.","الشركة المشتراة خلال السنة تُحتسب عن مدة وجودها في المجموعة فقط، وبقيمها الدفترية التاريخية."]},{"h":["Share deals treated as asset deals","صفقات الأسهم المعاملة كصفقات أصول"],"t":["Buying or selling a controlling interest is treated as buying or selling the assets and liabilities if the target's jurisdiction treats it that way and taxes the seller on the gain measured against the tax basis.","يُعامل شراء حصة مسيطرة أو بيعها كشراء الأصول والالتزامات أو بيعها إذا كانت ولاية المستهدف تعامله كذلك وتفرض ضريبة على البائع على المكسب مقارنة بالأساس الضريبي."],"r":["75(2)"],"p":["A share deal taxed like an asset deal is treated as an asset deal.","صفقة الأسهم التي تُعامل ضريبياً كصفقة أصول تُعامل كصفقة أصول."]},{"h":["Asset transfers and DMT reorganisations","نقل الأصول وإعادة التنظيم"],"t":["On an ordinary transfer, the seller includes its gain or loss and the buyer uses its own carrying values. In a DMT reorganisation (mainly equity consideration, seller's gain not taxed in whole or part, buyer taking over the seller's tax basis), no gain or loss arises and the buyer takes the seller's carrying values, adjusted for any non-qualifying gain or loss.","في النقل العادي يدرج البائع مكسبه أو خسارته، ويستخدم المشتري قيمه الدفترية. أما في إعادة التنظيم (مقابل يغلب عليه حقوق الملكية، ومكسب البائع غير خاضع للضريبة كلياً أو جزئياً، والمشتري يأخذ الأساس الضريبي للبائع)، فلا ينشأ مكسب أو خسارة، ويأخذ المشتري القيم الدفترية للبائع معدلة بأي مكسب أو خسارة غير مؤهلة."],"r":["76(1)","76(2)","77"],"p":["Ordinary asset sales create a gain; tax-neutral reorganisations do not, and book values carry over.","بيع الأصول العادي يُنشئ مكسباً؛ أما إعادة التنظيم المحايدة ضريبياً فلا، وتنتقل القيم الدفترية."]},{"h":["Joint ventures are computed separately","تُحتسب المشاريع المشتركة بشكل مستقل"],"t":["A joint venture is an entity reported under the equity method in which the UPE holds at least 50%, subject to listed exceptions. A Saudi JV and its JV subsidiaries compute their top-up tax as if they were a separate MNE group with the JV as UPE.","المشروع المشترك كيان يُعرض بطريقة حقوق الملكية ويملك فيه الكيان الأم النهائي 50% على الأقل، مع استثناءات محددة. ويحتسب المشروع المشترك في المملكة وكياناته التابعة ضريبتهم التكميلية كأنهم مجموعة متعددة الجنسيات مستقلة يكون المشروع المشترك كيانها الأم النهائي."],"r":[78,79],"p":["A joint venture held 50% or more computes its own top-up, as a separate group.","يحتسب المشروع المشترك المملوك بنسبة 50% أو أكثر ضريبته التكميلية وحده، كمجموعة مستقلة."]},{"h":["Multi-parented groups","المجموعات متعددة الكيانات الأم"],"t":["Two or more groups whose UPEs form a stapled structure or a dual-listed arrangement, with at least one entity or PE in another jurisdiction, are treated as one multi-parented MNE group. Their Saudi entities compute the domestic top-up tax together, and the UPEs file one GloBE information return unless they appoint a designated filing entity.","تُعامل المجموعتان أو أكثر اللتان يشكل كياناهما الأم هيكلاً متلازماً أو ترتيب إدراج مزدوج، مع كيان أو منشأة دائمة واحدة على الأقل في ولاية أخرى، كمجموعة واحدة متعددة الكيانات الأم. وتحتسب كياناتها في المملكة الضريبة التكميلية المحلية معاً، ويقدم الكيانات الأم إقراراً واحداً لمعلومات القواعد العالمية ما لم يعيّنوا كياناً مقدماً للإقرار."],"r":[80,81,82,83],"p":["Stapled or dual-listed groups are treated as one group.","المجموعات ذات الهيكل المتلازم أو الإدراج المزدوج تُعامل كمجموعة واحدة."]}],"oecd":[{"t":["Articles 74 to 83 follow GloBE Chapter 6 (Articles 6.1 to 6.5). Article 73 is the Kingdom's own collection rule: GloBE has no joint liability across group members or partners, so it comes from domestic law design.","تتبع المواد من 74 إلى 83 الفصل السادس من القواعد النموذجية (المواد من 6.1 إلى 6.5). أما المادة 73 فقاعدة تحصيل خاصة بالمملكة: فلا تتضمن القواعد العالمية مسؤولية تضامنية بين أعضاء المجموعة أو الشركاء، فهي من تصميم النظام المحلي."],"src":["Model Rules Arts 6.1–6.5","القواعد النموذجية: المواد 6.1–6.5"]},{"t":["KSA angle: joint liability reaches every Saudi member, including Zakat-only entities that carry no allocated top-up. Factor it into acquisitions, disposals and minority investments: indemnities and the Article 73(5) limitation request are the tools.","من منظور المملكة: تمتد المسؤولية التضامنية إلى كل عضو في المملكة، بما في ذلك الكيانات الخاضعة للزكاة وحدها التي لم تُخصص لها ضريبة تكميلية. فراعها في عمليات الاقتناء والبيع والاستثمارات الأقلية: وأدواتها التعويضات التعاقدية وطلب القصر بموجب المادة 73 (5)."],"src":["Draft Art 73","المشروع م 73"]}],"cases":[{"t":["A merger that brings a group into scope","اندماج يُدخل مجموعة في النطاق"],"facts":["Group A and Group B merged in 2026; the combined group's FY2026 revenue was €900m. Before the merger:\n• Group A revenue: 2023 €400m, 2024 €420m, 2025 €450m\n• Group B revenue: 2023 €380m, 2024 €360m, 2025 €310m\nIs the combined group in scope for FY2027?","اندمجت المجموعتان (أ) و(ب) في 2026م، وبلغت إيرادات المجموعة المندمجة لعام 2026م 900 مليون يورو. وقبل الاندماج:\n• إيرادات (أ): 2023م 400 مليون، و2024م 420 مليوناً، و2025م 450 مليون يورو\n• إيرادات (ب): 2023م 380 مليوناً، و2024م 360 مليوناً، و2025م 310 ملايين يورو\nهل تخضع المجموعة المندمجة للنظام في 2027م؟"],"steps":[{"t":["2023 combined revenue:","مجموع إيرادات 2023م:"],"x":"400000000+380000000","v":780000000,"u":"EUR"},{"t":["2024 combined revenue:","مجموع إيرادات 2024م:"],"x":"420000000+360000000","v":780000000,"u":"EUR"},{"t":["2025 combined revenue:","مجموع إيرادات 2025م:"],"x":"450000000+310000000","v":760000000,"u":"EUR"},{"t":["2026 (post-merger) consolidated revenue is €900m. All four preceding years reach €750m.","إيرادات 2026م الموحدة (بعد الاندماج) 900 مليون يورو. فالسنوات الأربع السابقة كلها تبلغ 750 مليوناً."]}],"ans":["The combined group is in scope for FY2027. Without Article 74(1)(a) only FY2026 would count, one year out of four, and the group would be outside the law.","تخضع المجموعة المندمجة للنظام في 2027م. ولولا المادة 74 (1) (أ) لما احتُسبت إلا سنة 2026م، أي سنة واحدة من أربع، ولكانت المجموعة خارج النظام."],"r":["74(1)","74(2)",2],"p":["Combined revenue tops €750m in each of 2023 to 2025, and the merged group in 2026: in scope for FY2027.","تتجاوز الإيرادات المجمعة 750 مليون يورو في كل سنة من 2023م إلى 2025م، وكذلك المجموعة المندمجة في 2026م: داخل النطاق لعام 2027م."],"diagrams":[{"type":"columns","at":"answer","title":["The €750m test, merger-adjusted","اختبار 750 مليون يورو بعد احتساب الاندماج"],"cap":["Revenue, € million (A + B before 2026)","الإيرادات بملايين اليورو ((أ) + (ب) قبل 2026م)"],"items":[{"l":["2023","2023م"],"v":780},{"l":["2024","2024م"],"v":780},{"l":["2025","2025م"],"v":760},{"l":["2026","2026م"],"v":900}],"line":{"v":750,"l":["€750m test line","خط اختبار 750 مليون يورو"]},"verdict":["All four years reach €750m: in scope for FY2027.","السنوات الأربع كلها تبلغ 750 مليون يورو: داخل النطاق لعام 2027م."],"vt":"in"}]},{"t":["A Saudi company bought mid-year","شركة في المملكة اشتُريت في منتصف السنة"],"facts":["A group (calendar year) buys a Saudi company on 1 July 2027 and consolidates it line by line from that date. For FY2027 the target has accounting profit of SAR 40m (SAR 20m in each half), eligible payroll of SAR 30m (SAR 15m in the second half) and eligible tangible assets with a carrying value of SAR 200m.","تشتري مجموعة (سنتها تقويمية) شركة في المملكة في 1 يوليو 2027م وتوحّدها بنداً بنداً من ذلك التاريخ. وللسنة المالية 2027م بلغ ربح المستهدف المحاسبي 40 مليون ريال (20 مليوناً في كل نصف)، والرواتب المؤهلة 30 مليون ريال (15 مليوناً في النصف الثاني)، والقيمة الدفترية للأصول الملموسة المؤهلة 200 مليون ريال."],"steps":[{"t":["The target is a member for FY2027, but only the consolidated second-half profit of SAR 20m counts.","المستهدف عضو في 2027م، لكن لا يُحتسب إلا ربح النصف الثاني الموحد البالغ 20 مليون ريال."],"v":20000000,"u":"SAR"},{"t":["Tangible assets prorated for six months in the group:","الأصول الملموسة تناسبياً لستة أشهر في المجموعة:"],"x":"200000000*6/12","v":100000000,"u":"SAR"},{"t":["Payroll carve-out on consolidated payroll (9.2%):","استبعاد الرواتب على الرواتب الموحدة (9.2%):"],"x":"15000000*9.2/100","v":1380000,"u":"SAR"},{"t":["Asset carve-out (7.2%):","استبعاد الأصول (7.2%):"],"x":"100000000*7.2/100","v":7200000,"u":"SAR"},{"t":["Target's SBIE for FY2027:","استبعاد المستهدف لعام 2027م:"],"x":"1380000+7200000","v":8580000,"u":"SAR"}],"ans":["FY2027 brings in SAR 20m of income and SAR 8.58m of SBIE from the target. Its assets stay at historical carrying values, so purchase price step-ups do not flow into DMT income.","تُدخل سنة 2027م من المستهدف دخلاً قدره 20 مليون ريال واستبعاداً قدره 8.58 ملايين ريال. وتبقى أصوله بقيمها الدفترية التاريخية، فلا تدخل زيادات توزيع سعر الشراء في الدخل."],"r":["75(1)","104(1)","104(2)"],"p":["The target brings SAR 20m of income and SAR 8.58m of SBIE for its six months in the group.","يُدخل المستهدف دخلاً قدره 20 مليون ريال واستبعاداً قدره 8.58 مليون ريال عن أشهره الستة في المجموعة."],"diagrams":[{"type":"table","at":"answer","title":["What counts for FY2027","ما يُحتسب لعام 2027م"],"head":[["Item","البند"],["Full year","السنة كاملة"],["Counts","ما يُحتسب"]],"rows":[[["Accounting profit","الربح المحاسبي"],["SAR 40m","40 مليون ريال"],["SAR 20m: second half, consolidated","20 مليون ريال: النصف الثاني الموحد"]],[["Eligible payroll","الرواتب المؤهلة"],["SAR 30m","30 مليون ريال"],["SAR 15m: consolidated","15 مليون ريال: الموحد"]],[["Tangible assets","الأصول الملموسة"],["SAR 200m","200 مليون ريال"],["SAR 100m: six of twelve months","100 مليون ريال: ستة من اثني عشر شهراً"]],[["SBIE","الاستبعاد"],["–","–"],["SAR 1.38m + SAR 7.2m = SAR 8.58m","1.38 مليون + 7.2 مليون = 8.58 مليون ريال"]]]}]},{"t":["A 50:50 Saudi joint venture","مشروع مشترك مناصفة في المملكة"],"facts":["A foreign group holds 50% of a Saudi petrochemical JV, equity-accounted in its consolidated statements. The JV owns 100% of a Saudi logistics subsidiary. FY2027:\n• JV: DMT income SAR 120m, covered taxes SAR 12m\n• Subsidiary: DMT income SAR 30m, covered taxes SAR 3m\n• SBIE of the two: SAR 20m","تملك مجموعة أجنبية 50% من مشروع بتروكيماويات مشترك في المملكة، محاسب بطريقة حقوق الملكية في قوائمها الموحدة. ويملك المشروع 100% من شركة لوجستية تابعة في المملكة. السنة المالية 2027م:\n• المشروع المشترك: الدخل 120 مليون ريال، والضرائب المشمولة 12 مليون ريال\n• التابعة: الدخل 30 مليون ريال، والضرائب المشمولة 3 ملايين ريال\n• استبعادهما: 20 مليون ريال"],"steps":[{"t":["The JV group is computed as a separate group with the JV as UPE. Its net DMT income:","تُحتسب مجموعة المشروع المشترك كمجموعة مستقلة يكون المشروع كيانها الأم النهائي. صافي دخلها:"],"x":"120000000+30000000","v":150000000,"u":"SAR"},{"t":["JV group ETR:","المعدل الفعلي لمجموعة المشروع:"],"x":"(12000000+3000000)/150000000*100","v":10,"u":"%"},{"t":["Top-up percentage:","نسبة الضريبة التكميلية:"],"x":"15-10","v":5,"u":"%"},{"t":["Domestic top-up tax for the JV group:","الضريبة التكميلية المحلية لمجموعة المشروع:"],"x":"5/100*(150000000-20000000)","v":6500000,"u":"SAR"}],"ans":["The JV group owes SAR 6.5m, for which the JV and its subsidiary are jointly liable, even though the foreign group only equity-accounts its 50%. The rest of the group's Saudi ETR is computed without the JV.","على مجموعة المشروع المشترك 6.5 ملايين ريال، يتضامن فيها المشروع وتابعته في المسؤولية، رغم أن المجموعة الأجنبية تحاسب حصتها البالغة 50% بطريقة حقوق الملكية فقط. ويُحتسب معدل بقية المجموعة في المملكة دون المشروع المشترك."],"r":[78,79,"73(3)"],"p":["The JV group is computed apart: ETR 10%, top-up SAR 6.5m, owed jointly by the JV and its subsidiary.","تُحتسب مجموعة المشروع المشترك منفصلة: المعدل 10%، والضريبة التكميلية 6.5 مليون ريال، يتضامن فيها المشروع وتابعته."],"diagrams":[{"type":"org","at":"facts","title":["The JV group","مجموعة المشروع المشترك"],"nodes":[{"id":"f","t":["Foreign group","المجموعة الأجنبية"],"s":["equity-accounts the JV","تحاسب المشروع بطريقة حقوق الملكية"]},{"id":"j","t":["Saudi petrochemical JV","مشروع البتروكيماويات المشترك"],"s":["income SAR 120m · taxes SAR 12m","الدخل 120 مليوناً · الضرائب 12 مليوناً"],"tone":"in"},{"id":"s","t":["Saudi logistics subsidiary","الشركة اللوجستية التابعة"],"s":["income SAR 30m · taxes SAR 3m","الدخل 30 مليوناً · الضرائب 3 ملايين"],"tone":"in"}],"edges":[{"f":"f","to":"j","l":["50%","50%"]},{"f":"j","to":"s","l":["100%","100%"]}]},{"type":"gauge","at":"answer","v":10,"target":15,"max":20,"title":["The JV group's rate","معدل مجموعة المشروع المشترك"],"l":["JV group ETR","المعدل الفعلي لمجموعة المشروع"],"tl":["minimum rate","الحد الأدنى"],"gap":["5% top-up on SAR 130m of excess profit = SAR 6.5m","ضريبة تكميلية 5% على ربح زائد قدره 130 مليون ريال = 6.5 مليون"]}]}],"quiz":[{"q":["Who is liable for the domestic top-up tax?","من المسؤول عن الضريبة التكميلية المحلية؟"],"o":[["Only the entities that were allocated a share of the top-up","الكيانات التي خُصصت لها حصة من الضريبة فقط"],["Each taxpayer, and all the group's Saudi members jointly","كل مكلف، وجميع أعضاء المجموعة في المملكة بالتضامن"],["Only the UPE, on behalf of all the group's Saudi entities","الكيان الأم النهائي وحده، نيابة عن جميع كيانات المجموعة في المملكة"],["Each taxpayer for its own share, with no joint liability","كل مكلف عن حصته فقط، دون مسؤولية تضامنية"]],"a":1,"e":["Article 73(1)–(2): each taxpayer is liable for its own tax, and the group's Saudi taxpayers are jointly liable for the Kingdom's tax for the years they are members.","المادة 73 (1)–(2): كل مكلف مسؤول عن ضريبته، ومكلفو المجموعة في المملكة متضامنون في المسؤولية عن ضريبة المملكة عن سنوات عضويتهم."],"r":["73(1)","73(2)"]},{"q":["Can joint liability be limited?","هل يمكن قصر المسؤولية التضامنية؟"],"o":[["No: joint liability can never be limited under the draft","لا: لا يجوز قصر المسؤولية التضامنية في أي حال وفق المشروع"],["Yes, to one or more group entities with ZATCA's approval","نعم، على كيان أو أكثر من كيانات المجموعة بموافقة الهيئة"],["Yes, by a group board resolution notified to ZATCA","نعم، بقرار من مجلس إدارة المجموعة يُخطر به الهيئة"],["Yes, for entities that pay Zakat rather than tax","نعم، للكيانات التي تدفع الزكاة لا الضريبة"]],"a":1,"e":["Article 73(5): joint liability for a fiscal year can be limited to one or more group entities, but only with ZATCA's approval.","المادة 73 (5): يجوز قصر المسؤولية التضامنية عن سنة مالية على كيان أو أكثر من كيانات المجموعة، ولكن بموافقة الهيئة فقط."],"r":["73(5)"]},{"q":["Which partner in a Saudi partnership within an MNE group is NOT jointly and severally liable?","أي شريك في شراكة في المملكة ضمن مجموعة متعددة الجنسيات لا يكون متضامناً ومتكافلاً في المسؤولية؟"],"o":[["A general partner who does not manage the firm","الشريك المتضامن الذي لا يدير الشركة"],["A partner holding less than 10% of the partnership","الشريك الذي يملك أقل من 10% من الشراكة"],["A limited partner who is not a general partner","الشريك الموصي الذي ليس شريكاً متضامناً"],["A partner resident outside the Kingdom","الشريك المقيم خارج المملكة"]],"a":2,"e":["Article 73(4): partners are jointly and severally liable, except a limited partner who is not a general partner.","المادة 73 (4): الشركاء متضامنون ومتكافلون في المسؤولية، باستثناء الشريك الموصي الذي ليس شريكاً متضامناً."],"r":["73(4)"]},{"q":["Two groups merged in 2026. How is the €750m test applied to 2024?","اندمجت مجموعتان في 2026م. كيف يُطبق اختبار 750 مليون يورو على 2024م؟"],"o":[["It is met only if one of the two groups alone had €750m or more in 2024","يتحقق فقط إذا بلغت إيرادات إحدى المجموعتين وحدها 750 مليون يورو أو أكثر في 2024م"],["It is met if the two groups' combined 2024 revenue is €750m or more","يتحقق إذا بلغ مجموع إيرادات المجموعتين لعام 2024م 750 مليون يورو أو أكثر"],["It is met only if both groups each had €750m or more in 2024","يتحقق فقط إذا بلغت إيرادات كل من المجموعتين 750 مليون يورو أو أكثر في 2024م"],["It is met if combined revenue reaches €1.5bn, €750m per group","يتحقق إذا بلغت الإيرادات المجمعة 1.5 مليار يورو، أي 750 مليوناً لكل مجموعة"]],"a":1,"e":["Article 74(1)(a): for years before the merger, the test is met if the merging groups' combined revenue for that year is €750m or more.","المادة 74 (1) (أ): عن السنوات السابقة للاندماج، يتحقق الاختبار إذا بلغ مجموع إيرادات المجموعات المندمجة لتلك السنة 750 مليون يورو أو أكثر."],"r":["74(1)"]},{"q":["After a demerger, how does a demerged group meet the threshold in years two to four?","بعد الانفصال، كيف تستوفي المجموعة الم
