نفصلة الحد في السنوات من الثانية إلى الرابعة؟"],"o":[["€750m in every one of the years after the demerger","750 مليون يورو في كل سنة من السنوات التالية للانفصال"],["€375m in every one of the years after the demerger","375 مليون يورو في كل سنة من السنوات التالية للانفصال"],["€375m in at least two of the years after the demerger","375 مليون يورو في سنتين على الأقل من السنوات التالية للانفصال"],["€750m in at least two of the years after the demerger","750 مليون يورو في سنتين على الأقل من السنوات التالية للانفصال"]],"a":3,"e":["Article 74(1)(c)(2): in the second to fourth years after the demerger, €750m in at least two of the years since the demerger. The first year needs €750m in that year.","المادة 74 (1) (ج) (2): في السنوات من الثانية إلى الرابعة بعد الانفصال، 750 مليون يورو في سنتين على الأقل من السنوات التالية له. أما السنة الأولى فتتطلب 750 مليوناً في تلك السنة."],"r":["74(1)"]},{"q":["A Saudi company is bought on 1 October. Is it a group member for that fiscal year?","اشتُريت شركة في المملكة في 1 أكتوبر. هل هي عضو في المجموعة عن تلك السنة المالية؟"],"o":[["Yes, if any of its results are consolidated line by line that year","نعم، إذا وُحّد أي جزء من نتائجها بنداً بنداً في تلك السنة"],["No: it joins only from the start of the next fiscal year","لا: لا تنضم إلا من بداية السنة المالية التالية"],["Yes, but only if it was held for at least six months of the year","نعم، ولكن فقط إذا احتُفظ بها ستة أشهر على الأقل من السنة"],["Yes, and its full-year results count, not just the post-acquisition part","نعم، وتُحتسب نتائجها للسنة كاملة لا للجزء اللاحق للاقتناء فقط"]],"a":0,"e":["Article 75(1)(a): it is a member if any part of its results is consolidated line by line, but only the consolidated results count.","المادة 75 (1) (أ): تكون عضواً إذا وُحّد أي جزء من نتائجها بنداً بنداً، ولا يُحتسب إلا الجزء الموحد."],"r":["75(1)"]},{"q":["After an acquisition, which values does the target use for its assets and liabilities?","بعد الاقتناء، أي قيم يستخدمها المستهدف لأصوله والتزاماته؟"],"o":[["Fair values from the purchase price allocation","القيم العادلة من توزيع سعر الشراء"],["Its tax values under the Income Tax Law","قيمه الضريبية وفق نظام ضريبة الدخل"],["Its carrying values restated to market at the deal date","قيمه الدفترية معاداً قياسها بالقيمة السوقية في تاريخ الصفقة"],["Its historical carrying values","قيمه الدفترية التاريخية"]],"a":3,"e":["Article 75(1)(c): the target keeps its historical carrying values, so purchase price step-ups do not flow into DMT income.","المادة 75 (1) (ج): يحتفظ المستهدف بقيمه الدفترية التاريخية، فلا تدخل زيادات توزيع سعر الشراء في الدخل."],"r":["75(1)"]},{"q":["When is a share deal treated as an asset deal?","متى تُعامل صفقة الأسهم كصفقة أصول؟"],"o":[["Whenever the price paid exceeds the target's net book value","متى تجاوز السعر المدفوع صافي القيمة الدفترية للمستهدف"],["When the buyer elects it in its return, whatever the target's country does with the deal","عندما يختار المشتري ذلك في إقراره، أياً كانت معالجة دولة المستهدف للصفقة ذاتها"],["When its country taxes it like an asset deal, on the seller's gain over tax basis","إذا عاملتها دولة المستهدف كبيع أصول وفرضت الضريبة على مكسب البائع فوق أساسه الضريبي"],["When the target's country exempts the seller's gain on the shares","عندما تعفي دولة المستهدف مكسب البائع على الأسهم"]],"a":2,"e":["Article 75(2): only where the target's jurisdiction treats it like a purchase or sale of assets and taxes the seller on the gain measured against tax basis.","المادة 75 (2): فقط حين تعاملها ولاية المستهدف كشراء أو بيع للأصول وتفرض الضريبة على البائع على المكسب مقارنة بالأساس الضريبي."],"r":["75(2)"]},{"q":["Which is a condition of a DMT reorganisation?","أي مما يلي شرط لإعادة التنظيم لأغراض النظام؟"],"o":[["The buyer must compute taxable income using the seller's tax basis","أن يحتسب المشتري دخله الخاضع للضريبة باستخدام الأساس الضريبي للبائع"],["Consideration paid mainly in cash rather than in new shares","أن يُدفع المقابل نقداً في الغالب لا بأسهم جديدة يصدرها المشتري"],["The seller is fully taxed on its gain in the year of transfer","أن يخضع البائع للضريبة على كامل مكسبه في سنة نقل الأصول"],["ZATCA's prior written approval of the reorganisation","موافقة الهيئة الكتابية المسبقة على عملية إعادة التنظيم"]],"a":0,"e":["Article 77(1): mainly equity consideration, a seller's gain that is not taxed in whole or in part, and a buyer that must use the seller's tax basis. Cash consideration or a fully taxed gain points the other way.","المادة 77 (1): مقابل بحصص ملكية في الغالب، ومكسب للبائع غير خاضع للضريبة كلياً أو جزئياً، ومشترٍ ملزم باستخدام الأساس الضريبي للبائع. والمقابل النقدي أو المكسب الخاضع للضريبة بالكامل يدلان على العكس."],"r":["77"]},{"q":["What is a joint venture for this law?","ما المشروع المشترك لأغراض هذا النظام؟"],"o":[["A company owned 50:50 by two unrelated groups, however accounted for","شركة مملوكة مناصفة لمجموعتين غير مرتبطتين، أياً كانت معالجتها المحاسبية"],["Any associate accounted for under the equity method, whatever the UPE's stake","أي شركة زميلة تُحاسب بطريقة حقوق الملكية، أياً كانت حصة الكيان الأم النهائي فيها"],["An equity-accounted entity at least 50% held by the UPE, with exceptions","كيان بطريقة حقوق الملكية يملك الكيان الأم 50% منه على الأقل، مع استثناءات"],["A consolidated subsidiary in which the UPE holds between 50% and 80%","شركة تابعة موحدة يملك فيها الكيان الأم النهائي بين 50% و80%"]],"a":2,"e":["Article 79: reported under the equity method in the UPE's consolidated accounts, with the UPE holding at least 50% directly or indirectly; listed exclusions apply.","المادة 79: كيان تُعرض نتائجه بطريقة حقوق الملكية في القوائم الموحدة للكيان الأم الذي يملك 50% منه على الأقل بشكل مباشر أو غير مباشر، مع الاستثناءات الواردة."],"r":[79]},{"q":["How is a Saudi joint venture's top-up tax computed?","كيف تُحتسب الضريبة التكميلية لمشروع مشترك في المملكة؟"],"o":[["As its own MNE group: the JV and its subsidiaries, with the JV as UPE","كمجموعة مستقلة تضم المشروع المشترك وتوابعه، ويكون المشروع كيانها الأم"],["Blended with the group's other Saudi entities in a single Kingdom ETR","ممزوجاً مع كيانات المجموعة الأخرى في المملكة في معدل فعلي واحد للمملكة"],["It is exempt, as the group only equity-accounts its share","معفى، لأن المجموعة تحاسب حصتها بطريقة حقوق الملكية فقط"],["At each partner's level, in proportion to its equity share","على مستوى كل شريك، بنسبة حصته في حقوق الملكية"]],"a":0,"e":["Article 78(2): the JV and its subsidiaries compute their top-up as if they were a separate MNE group with the JV as UPE.","المادة 78 (2): يحتسب المشروع المشترك وكياناته التابعة الضريبة التكميلية كأنهم مجموعة متعددة الجنسيات مستقلة يكون المشروع كيانها الأم النهائي."],"r":["78"]},{"q":["What makes two groups a multi-parented MNE group?","ما الذي يجعل مجموعتين مجموعة متعددة الكيانات الأم؟"],"o":[["UPEs that share the same directors, auditors and head office","كيانات أم يشترك فيها أعضاء المجلس والمراجعون والمقر نفسه"],["UPEs that trade with each other above the €750m threshold","كيانات أم تتعامل فيما بينها بأكثر من حد 750 مليون يورو"],["Stapled or dual-listed UPEs, with all entities and PEs in one jurisdiction","كيانات أم بهيكل متلازم أو إدراج مزدوج، وجميع كياناتها ومنشآتها الدائمة في ولاية واحدة"],["Stapled or dual-listed UPEs, with at least one entity or PE in another jurisdiction","كيانات أم بهيكل متلازم أو إدراج مزدوج، ولها كيان أو منشأة دائمة واحدة على الأقل في ولاية أخرى"]],"a":3,"e":["Article 81: the UPEs are in a stapled structure or dual-listed arrangement, and at least one entity or PE of the combined group is in a different jurisdiction from the others. Articles 82 and 83 define the two arrangements.","المادة 81: أن تكون الكيانات الأم في هيكل متلازم أو ترتيب إدراج مزدوج، وأن يقع كيان أو منشأة دائمة واحدة على الأقل من المجموعة المجمعة في ولاية مختلفة عن بقية الكيانات. وتعرّف المادتان 82 و83 الترتيبين."],"r":[81,82,83]}],"cards":[{"f":["Taxpayer liability","مسؤولية المكلف"],"b":["Each taxpayer is liable for its own domestic top-up tax and related amounts.","كل مكلف مسؤول عن ضريبته التكميلية المحلية والمبالغ المرتبطة بها."],"r":["73(1)"]},{"f":["Group joint liability","المسؤولية التضامنية للمجموعة"],"b":["Saudi taxpayers in the same MNE group are jointly liable for the years they are members.","المكلفون في المملكة في المجموعة نفسها متضامنون عن السنوات التي يكونون فيها أعضاء."],"r":["73(2)"]},{"f":["JV group liability","مسؤولية مجموعة المشروع المشترك"],"b":["Each Saudi JV and JV subsidiary is jointly liable for the JV group's top-up.","كل مشروع مشترك وكيان تابع له في المملكة متضامن عن ضريبة مجموعة المشروع."],"r":["73(3)"]},{"f":["Partners' liability","مسؤولية الشركاء"],"b":["Partners jointly and severally liable, except limited partners who are not general partners.","الشركاء متضامنون ومتكافلون، عدا الشريك الموصي الذي ليس شريكاً متضامناً."],"r":["73(4)"]},{"f":["Limiting joint liability","قصر المسؤولية التضامنية"],"b":["To one or more entities, with ZATCA's approval.","على كيان أو أكثر، بموافقة الهيئة."],"r":["73(5)"]},{"f":["Merger and the €750m test","الاندماج واختبار 750 مليون يورو"],"b":["Pre-merger years: combined revenue of the merging groups (or entity and group).","سنوات ما قبل الاندماج: مجموع إيرادات المجموعات المندمجة (أو الكيان والمجموعة)."],"r":["74(1)"]},{"f":["Demerger and the €750m test","الانفصال واختبار 750 مليون يورو"],"b":["Year 1 after: €750m that year; years 2–4: €750m in at least two post-demerger years.","السنة الأولى بعده: 750 مليوناً فيها؛ والسنوات 2–4: 750 مليوناً في سنتين على الأقل بعد الانفصال."],"r":["74(1)"]},{"f":["Joining or leaving mid-year","الانضمام أو الخروج في منتصف السنة"],"b":["Member if any part consolidated; consolidated results only; assets prorated; historical carrying values.","عضو إذا وُحّد أي جزء؛ النتائج الموحدة فقط؛ الأصول تناسبياً؛ القيم الدفترية التاريخية."],"r":["75(1)"]},{"f":["Share deal as asset deal","صفقة أسهم كصفقة أصول"],"b":["When the local tax treats it as an asset deal and taxes the seller's gain against tax basis.","عندما تعاملها الضريبة المحلية كصفقة أصول وتفرض ضريبة على مكسب البائع مقارنة بالأساس الضريبي."],"r":["75(2)"]},{"f":["DMT reorganisation","إعادة التنظيم لأغراض النظام"],"b":["Equity consideration, untaxed seller gain, carry-over tax basis: no gain or loss, carry-over book values.","مقابل بحقوق ملكية، ومكسب بائع غير خاضع، وانتقال الأساس الضريبي: لا مكسب ولا خسارة، وانتقال القيم الدفترية."],"r":["76(2)","77"]},{"f":["Joint venture","المشروع المشترك"],"b":["Equity-accounted, UPE ≥ 50%; computed as a separate group with the JV as UPE.","محاسب بحقوق الملكية، والكيان الأم ≥ 50%؛ يُحتسب كمجموعة مستقلة والمشروع كيانها الأم."],"r":[78,79]},{"f":["Multi-parented MNE group","المجموعة متعددة الكيانات الأم"],"b":["Stapled structure or dual-listed arrangement with a cross-border element; treated as one group.","هيكل متلازم أو ترتيب إدراج مزدوج مع عنصر عابر للحدود؛ يُعامل كمجموعة واحدة."],"r":[80,81]}],"terms":[{"t":["Joint liability","المسؤولية التضامنية"],"d":["Each group member can be asked to pay the whole group's bill.","يجوز مطالبة كل عضو في المجموعة بسداد ضريبة المجموعة كاملة."]},{"t":["Merger and demerger","الاندماج والانفصال"],"d":["Two groups becoming one, or one group splitting into parts.","اتحاد مجموعتين في مجموعة واحدة، أو انقسام مجموعة إلى أجزاء."]},{"t":["Target","الكيان المستهدف"],"d":["A company bought or sold during the year.","شركة تُشترى أو تُباع خلال السنة."]},{"t":["DMT reorganisation","إعادة التنظيم"],"d":["A mainly share-for-share restructuring that is tax-neutral, so no gain arises.","إعادة هيكلة مقابلها أسهم في الغالب ومحايدة ضريبياً، فلا ينشأ عنها مكسب."]},{"t":["Joint venture (JV)","المشروع المشترك"],"d":["An equity-accounted entity the ultimate parent holds at least 50% of; it computes as its own group.","كيان يُحاسب بطريقة حقوق الملكية ويملك الكيان الأم النهائي 50% منه على الأقل؛ ويُحتسب كمجموعة مستقلة."]},{"t":["Multi-parented group","المجموعة متعددة الكيانات الأم"],"d":["Two groups tied by stapled shares or a dual listing, treated as one.","مجموعتان مرتبطتان بأسهم متلازمة أو بإدراج مزدوج، تُعاملان كمجموعة واحدة."]}],"range":"73–83"},{"id":14,"title":["Flow-through parents and investment entities","الكيانات الأم الشفافة وكيانات الاستثمار"],"goal":["Apply the flow-through UPE rule, compute an investment entity's ETR and top-up tax separately, and use the tax transparency and taxable distribution elections.","تطبيق قاعدة الكيان الأم النهائي الشفاف، واحتساب المعدل الفعلي والضريبة التكميلية لكيان الاستثمار بشكل مستقل، واستخدام اختياري الشفافية الضريبية وطريقة التوزيع الخاضع للضريبة."],"parts":[9],"arts":[84,85,86,87,88],"time":35,"metaphor":{"title":["Pipes, not tanks","أنابيب لا خزانات"],"text":["Some entities are pipes rather than tanks: a flow-through parent passes its income straight to owners who pay tax on it, and an investment fund passes returns to its investors. The law does not top up income that will be taxed at 15% or more in the owners' hands, and it keeps funds out of the operating ETR so their returns neither dilute nor inflate it.\nTwo elections let a fund be seen through the owner's own tax: yearly fair value taxation, or tax on distributions. But a pipe that stops flowing for three years is treated as a tank, and topped up at the full 15%.","بعض الكيانات أنابيب لا خزانات: فالكيان الأم الشفاف يمرر دخله مباشرة إلى ملاك يدفعون الضريبة عليه، وصندوق الاستثمار يمرر العوائد إلى مستثمريه. ولا يفرض النظام ضريبة تكميلية على دخل سيخضع للضريبة بنسبة 15% أو أكثر لدى الملاك، ويُبقي الصناديق خارج المعدل التشغيلي حتى لا تخفضه عوائدها ولا ترفعه.\nويسمح اختياران بالنظر إلى الصندوق عبر ضريبة المالك نفسه: ضريبة سنوية على القيمة العادلة، أو ضريبة على التوزيعات. لكن الأنبوب الذي يتوقف جريانه ثلاث سنوات يُعامل كخزان، وتُفرض عليه الضريبة التكميلية بنسبة 15% كاملة."]},"anchors":[{"if":["The UPE is a flow-through entity whose owners are taxed on its income at 15% or more","الكيان الأم النهائي شفاف ضريبياً ويخضع ملاكه للضريبة على دخله بنسبة 15% أو أكثر"],"then":["Reduce its DMT income for those interests, and its covered taxes in proportion (Art 84(1), 84(3))","اخفض دخله عن تلك الحصص، وضرائبه المشمولة بالنسبة نفسها (المادة 84 (1) و(3))"]},{"if":["A Saudi investment fund or REIV is a constituent entity, not the UPE","صندوق استثمار أو أداة استثمار عقاري في المملكة كيان تابع وليس الكيان الأم النهائي"],"then":["Compute its ETR and top-up separately, on the group's allocable share (Art 85)","احسب معدله وضريبته التكميلية بشكل مستقل، على الحصة القابلة للتخصيص للمجموعة (المادة 85)"]},{"if":["The fund's owner is taxed yearly on fair value changes at 15% or more","مالك الصندوق يخضع سنوياً للضريبة على تغيرات القيمة العادلة بنسبة 15% أو أكثر"],"then":["Consider the tax transparency election (Art 87)","فكّر في اختيار الشفافية الضريبية (المادة 87)"]},{"if":["The fund's owner is taxed on distributions at 15% or more","مالك الصندوق يخضع للضريبة على التوزيعات بنسبة 15% أو أكثر"],"then":["Consider the taxable distribution method, and distribute within three years (Art 88)","فكّر في طريقة التوزيع الخاضع للضريبة، ووزّع خلال ثلاث سنوات (المادة 88)"]}],"diagrams":[{"type":"flow","title":["An investment entity's top-up tax","الضريبة التكميلية لكيان الاستثمار"],"nodes":[{"t":["Investment entity's DMT income","دخل كيان الاستثمار"],"s":["computed under Part 3","محتسب وفق الجزء الثالث"]},{"t":["× inclusion ratio","× نسبة التضمين"],"s":["the group's share, ignoring elected interests · Art 85(4)–(5)","حصة المجموعة، دون الحصص المختارة · المادة 85 (4)–(5)"]},{"t":["= allocable share","= الحصة القابلة للتخصيص"],"s":["the ETR denominator","مقام المعدل الفعلي"]},{"t":["ETR = covered taxes on that share ÷ allocable share","المعدل = الضرائب المشمولة على الحصة ÷ الحصة"],"s":["Art 85(2)–(3)","المادة 85 (2)–(3)"]},{"t":["(15% − ETR) × (allocable share − SBIE)","(15% − المعدل) × (الحصة − الاستبعاد)"],"s":["Art 85(6)–(7)","المادة 85 (6)–(7)"]}],"quick":true},{"type":"table","title":["Three ways to treat an investment entity","ثلاث طرق لمعاملة كيان الاستثمار"],"head":[["Route","الطريق"],["When","متى"],["Result","النتيجة"]],"rows":[[["Default (Art 85)","الأصل (المادة 85)"],["Always, unless an election applies","دائماً، ما لم ينطبق اختيار"],["Separate ETR and top-up on the group's allocable share","معدل فعلي وضريبة تكميلية مستقلان على حصة المجموعة القابلة للتخصيص"]],[["Tax transparency election (Art 87)","اختيار الشفافية الضريبية (المادة 87)"],["The owner is taxed under a mark-to-market or similar regime at 15% or more","يخضع المالك لنظام القيمة السوقية أو ما يماثله بنسبة 15% أو أكثر"],["The fund is treated as tax transparent","يُعامل الصندوق كشفاف ضريبياً"]],[["Taxable distribution method (Art 88)","طريقة التوزيع الخاضع للضريبة (المادة 88)"],["The owner (not itself an investment entity) is expected to be taxed on distributions at 15% or more","يُتوقع خضوع المالك (وليس كيان استثمار) للضريبة على التوزيعات بنسبة 15% أو أكثر"],["Distributions taxed in the owner; income left undistributed after three years topped up at 15%","تُدرج التوزيعات لدى المالك؛ ويخضع الدخل غير الموزع بعد ثلاث سنوات لضريبة تكميلية بنسبة 15%"]]]}],"points":[{"h":["Flow-through UPE","الكيان الأم النهائي الشفاف"],"t":["A flow-through UPE reduces its DMT income by the income attributable to each ownership interest whose holder is taxed on the full amount at a nominal rate of 15% or more for a period ending within 12 months of the group's year-end (or where combined taxes are expected to reach 15%). It also does so for resident individuals, and resident governmental entities, international or non-profit organisations and pension funds, holding 5% or less.","يخفض الكيان الأم النهائي الشفاف دخله بالدخل المنسوب إلى كل حصة ملكية يخضع حاملها للضريبة على كامله بمعدل اسمي 15% أو أكثر عن فترة تنتهي خلال 12 شهراً من نهاية سنة المجموعة (أو حيث يُتوقع أن تبلغ الضرائب مجتمعة 15%). ويفعل ذلك أيضاً للأفراد المقيمين، وللكيانات الحكومية والمنظمات الدولية وغير الربحية وصناديق التقاعد المقيمة، الذين يملكون 5% أو أقل."],"r":["84(1)"],"p":["A pass-through parent leaves out income taxed on its owners at 15% or more, and small resident holders' shares.","يستبعد الكيان الأم الشفاف الدخل الخاضع للضريبة لدى ملاكه بنسبة 15% أو أكثر، وحصص صغار الملاك المقيمين."]},{"h":["Losses and taxes of a flow-through UPE","خسائر الكيان الأم الشفاف وضرائبه"],"t":["Its DMT loss is reduced by the loss attributable to each ownership interest, except to the extent the holders cannot use the loss in their own taxable income. When it reduces DMT income, it reduces its covered taxes in proportion.","تُخفض خسارته بالخسارة المنسوبة إلى كل حصة ملكية، إلا بقدر ما لا يستطيع الحاملون استخدام الخسارة في دخلهم الخاضع للضريبة. وعندما يخفض دخله يخفض ضرائبه المشمولة بالنسبة نفسها."],"r":["84(2)","84(3)"],"p":["Losses are cut the same way, unless owners cannot use them; taxes shrink in proportion.","تُخفض الخسائر بالطريقة نفسها ما لم يتعذر على الملاك استخدامها؛ وتنخفض الضرائب بالنسبة نفسها."]},{"h":["What an investment entity is","ما كيان الاستثمار"],"t":["An investment fund or real estate investment vehicle; an entity at least 95% owned by one (directly or through a chain) that only holds assets or invests funds for them; or an entity at least 85% owned by one whose income is substantially all excluded dividends or excluded equity gains or losses.","صندوق استثمار أو أداة استثمار عقاري؛ أو كيان مملوك لأي منهما بنسبة 95% على الأقل (مباشرة أو عبر سلسلة) لا يقوم إلا بحيازة الأصول أو استثمار الأموال لصالحه؛ أو كيان مملوك لأي منهما بنسبة 85% على الأقل يكون دخله كله تقريباً توزيعات مستبعدة أو مكاسب أو خسائر ملكية مستبعدة."],"r":[86],"p":["Funds, REIVs, and vehicles 95% or 85% owned by them, are investment entities.","الصناديق وأدوات الاستثمار العقاري، والأدوات المملوكة لها بنسبة 95% أو 85%، كيانات استثمار."]},{"h":["A separate ETR","معدل فعلي مستقل"],"t":["Unless it is tax transparent or under an Article 87 or 88 election, an investment entity's ETR is computed apart from the Kingdom's: its covered taxes divided by the group's allocable share of its DMT income. Several Saudi investment entities are combined into one ETR.","ما لم يكن شفافاً ضريبياً أو خاضعاً لاختيار وفق المادة 87 أو 88، يُحتسب المعدل الفعلي لكيان الاستثمار بمعزل عن معدل المملكة: ضرائبه المشمولة مقسومة على حصة المجموعة القابلة للتخصيص من دخله. وتُجمع كيانات الاستثمار المتعددة في المملكة في معدل واحد."],"r":["85(1)","85(2)"],"p":["An investment entity gets its own rate, kept apart from the Kingdom's operating rate.","لكيان الاستثمار معدل خاص به، منفصل عن معدل المملكة التشغيلي."]},{"h":["Allocable share and inclusion ratio","الحصة القابلة للتخصيص ونسبة التضمين"],"t":["The allocable share is the investment entity's DMT income times the UPE's inclusion ratio, which is its DMT income less the part attributable to other owners, divided by its DMT income. Covered taxes on income outside that share are left out.","الحصة القابلة للتخصيص هي دخل كيان الاستثمار مضروباً في نسبة التضمين للكيان الأم النهائي، وهي دخله ناقصاً الجزء المنسوب إلى الملاك الآخرين مقسوماً على دخله. وتُستبعد الضرائب المشمولة على الدخل الخارج عن تلك الحصة."],"r":["85(3)","85(4)","85(5)"],"p":["Only the group's share of the fund's income counts, with the taxes on that share.","لا يُحتسب إلا حصة المجموعة من دخل الصندوق، مع الضرائب على تلك الحصة."]},{"h":["Its top-up tax","ضريبته التكميلية"],"t":["The investment entity's top-up percentage (15% minus its ETR) times the group's allocable share less the investment entity's substance-based income exclusion.","نسبة الضريبة التكميلية لكيان الاستثمار (15% ناقصاً معدله) مضروبة في حصة المجموعة القابلة للتخصيص ناقصاً الاستبعاد على أساس الجوهر لكيان الاستثمار."],"r":["85(6)","85(7)"],"p":["Its top-up = (15% − its rate) × (group share − its substance allowance).","ضريبته التكميلية = (15% − معدله) × (حصة المجموعة − بدل الجوهر الخاص به)."]},{"h":["Tax transparency election","اختيار الشفافية الضريبية"],"t":["The filing entity may elect to treat an investment entity or insurance investment entity as tax transparent if its owner is taxed under a mark-to-market or similar regime on yearly changes in the fair value of its interest, at a rate of 15% or more.","يجوز للكيان المقدم للإقرار أن يختار معاملة كيان الاستثمار أو كيان التأمين الاستثماري كشفاف ضريبياً إذا كان مالكه يخضع لنظام القيمة السوقية أو ما يماثله على التغيرات السنوية في القيمة العادلة لحصته، بمعدل 15% أو أكثر."],"r":[87],"p":["If the owner is taxed yearly on the fund's value at 15% or more, the fund can be seen through.","إذا خضع المالك للضريبة سنوياً على قيمة الصندوق بنسبة 15% أو أكثر، جاز معاملة الصندوق كشفاف."]},{"h":["Taxable distribution method","طريقة التوزيع الخاضع للضريبة"],"t":["If the owner (not itself an investment entity) can reasonably be expected to be taxed on distributions at 15% or more, the filing entity may elect: distributions and the local creditable tax gross-up go into the owner's DMT income, and the investment entity's own income and taxes leave all ETR computations.","إذا أمكن توقع خضوع المالك (وليس كيان استثمار) للضريبة على التوزيعات بنسبة 15% أو أكثر، يجوز للكيان المقدم للإقرار أن يختار: فتدخل التوزيعات والضريبة المحلية القابلة للخصم المضافة في دخل المالك، ويخرج دخل كيان الاستثمار وضرائبه من جميع حسابات المعدل الفعلي."],"r":["88(1)","88(2)","88(3)"],"p":["If the owner is taxed on distributions at 15% or more, only distributions count, by election.","إذا خضع المالك للضريبة على التوزيعات بنسبة 15% أو أكثر، فلا تُحتسب إلا التوزيعات، بالاختيار."]},{"h":["Undistributed income after three years","الدخل غير الموزع بعد ثلاث سنوات"],"t":["Undistributed net DMT income of the tested year (the third year before the reporting year), after covered taxes, distributions to non-investment-entity shareholders, losses and investment loss carry-forwards in the testing period, is treated as DMT income of the reporting year and topped up at the full 15%.","يُعامل صافي الدخل غير الموزع لسنة الاختبار (السنة الثالثة قبل سنة الإقرار)، بعد الضرائب المشمولة والتوزيعات للمساهمين من غير كيانات الاستثمار والخسائر وخسائر الاستثمار المرحّلة في فترة الاختبار، كدخل لسنة الإقرار ويخضع لضريبة تكميلية بنسبة 15% كاملة."],"r":["88(2)","88(4)","88(5)","88(6)","88(7)"],"p":["Income left undistributed for three years is topped up at the full 15%.","الدخل غير الموزع لثلاث سنوات تُفرض عليه ضريبة تكميلية بنسبة 15% كاملة."]}],"oecd":[{"t":["Article 84 follows GloBE Article 7.1, Articles 85 and 86 follow Article 7.4 and the definitions, Article 87 follows 7.5 and Article 88 follows 7.6. The draft has no counterparts to Articles 7.2 (deductible dividend regimes) and 7.3 (eligible distribution tax systems).","تتبع المادة 84 المادة 7.1 من القواعد النموذجية، والمادتان 85 و86 المادة 7.4 والتعريفات، والمادة 87 المادة 7.5، والمادة 88 المادة 7.6. ولا يتضمن مشروع النظام ما يقابل المادتين 7.2 (أنظمة التوزيعات القابلة للخصم) و7.3 (أنظمة ضريبة التوزيعات المؤهلة)."],"src":["Model Rules Arts 7.1–7.6","القواعد النموذجية: المواد 7.1–7.6"]},{"t":["KSA angle: CMA-regulated investment funds and REITs are the usual candidates. As UPEs they are excluded entities (Art 12); when an operating group consolidates one, Article 85 keeps its returns out of the Kingdom's operating ETR.","من منظور المملكة: صناديق الاستثمار وصناديق الاستثمار العقاري المتداولة الخاضعة لهيئة السوق المالية هي المرشح المعتاد. فإذا كانت كيانات أم نهائية فهي كيانات مستبعدة (المادة 12)؛ وإذا وحّدتها مجموعة تشغيلية فإن المادة 85 تُبقي عوائدها خارج معدل المملكة التشغيلي."],"src":["Draft Arts 12, 85","المشروع م 12 و85"]}],"cases":[{"t":["A consolidated real estate fund","صندوق عقاري موحّد"],"facts":["A group consolidates a Saudi real estate fund that is an investment entity (not tax transparent, no election) and holds 60% of it. FY2027: the fund's DMT income is SAR 50m; covered taxes attributable to the group's share are SAR 1.8m; the fund's SBIE is SAR 2m.","توحّد مجموعة صندوقاً عقارياً في المملكة يُعد كيان استثمار (ليس شفافاً ضريبياً ولا اختيار عليه) وتملك 60% منه. السنة المالية 2027م: دخل الصندوق 50 مليون ريال؛ والضرائب المشمولة المنسوبة إلى حصة المجموعة 1.8 مليون ريال؛ واستبعاد الصندوق مليونا ريال."],"steps":[{"t":["Group's allocable share (inclusion ratio 60%):","الحصة القابلة للتخصيص للمجموعة (نسبة التضمين 60%):"],"x":"50000000*60/100","v":30000000,"u":"SAR"},{"t":["Investment entity ETR:","المعدل الفعلي لكيان الاستثمار:"],"x":"1800000/30000000*100","v":6,"u":"%"},{"t":["Top-up percentage:","نسبة الضريبة التكميلية:"],"x":"15-6","v":9,"u":"%"},{"t":["Top-up tax for the fund:","الضريبة التكميلية للصندوق:"],"x":"9/100*(30000000-2000000)","v":2520000,"u":"SAR"}],"ans":["The fund owes SAR 2.52m, computed on its own. Its income and taxes stay out of the Kingdom's operating ETR, which is computed without it.","على الصندوق 2.52 مليون ريال، محتسبة بشكل مستقل. ويبقى دخله وضرائبه خارج معدل المملكة التشغيلي الذي يُحتسب دونه."],"r":["85(2)","85(4)","85(5)","85(6)","53(5)"],"p":["The fund pays SAR 2.52m on its own: ETR 6% on the group's 60% share of SAR 30m.","يدفع الصندوق 2.52 مليون ريال وحده: معدله 6% على حصة المجموعة البالغة 60%، أي 30 مليون ريال."],"diagrams":[{"type":"org","at":"facts","title":["The group and the fund","المجموعة والصندوق"],"nodes":[{"id":"g","t":["The group","المجموعة"],"s":["consolidates the fund","توحّد الصندوق"]},{"id":"f","t":["Saudi real estate fund","صندوق عقاري في المملكة"],"s":["an investment entity","كيان استثمار"],"tone":"in"}],"edges":[{"f":"g","to":"f","l":["60%","60%"]}],"note":["Other investors hold the remaining 40%.","ويملك مستثمرون آخرون نسبة 40% الباقية."]},{"type":"gauge","at":"answer","v":6,"target":15,"max":20,"title":["The fund's own rate","المعدل الخاص بالصندوق"],"l":["Investment entity ETR","المعدل الفعلي لكيان الاستثمار"],"tl":["minimum rate","الحد الأدنى"],"gap":["9% top-up on SAR 28m (SAR 30m share less SAR 2m SBIE) = SAR 2.52m","ضريبة تكميلية 9% على 28 مليون ريال (حصة 30 مليوناً ناقص استبعاد مليونين) = 2.52 مليون"]}]},{"t":["Three years without distributing","ثلاث سنوات دون توزيع"],"facts":["Under the taxable distribution method, a group owner holds 100% of a Saudi investment entity. Tested year FY2027: DMT income SAR 40m, no covered taxes. Testing period FY2027 to FY2030: distributions to the owner of SAR 25m and a DMT loss of SAR 5m in FY2029.","بموجب طريقة التوزيع الخاضع للضريبة، يملك مالك في المجموعة 100% من كيان استثمار في المملكة. سنة الاختبار 2027م: الدخل 40 مليون ريال، ولا ضرائب مشمولة. فترة الاختبار من 2027م إلى 2030م: توزيعات للمالك 25 مليون ريال وخسارة 5 ملايين ريال في 2029م."],"steps":[{"t":["Undistributed net DMT income for the tested year:","صافي الدخل غير الموزع لسنة الاختبار:"],"x":"40000000-25000000-5000000","v":10000000,"u":"SAR"},{"t":["Treated as DMT income in FY2030 and taxed at the full 15%:","يُعامل كدخل في 2030م ويخضع لنسبة 15% كاملة:"],"x":"10000000*15/100","v":1500000,"u":"SAR"}],"ans":["SAR 1.5m of top-up tax arises in FY2030 on the SAR 10m left undistributed from FY2027. Distributing it within the testing period would have avoided the charge.","تنشأ ضريبة تكميلية قدرها 1.5 مليون ريال في 2030م على العشرة ملايين غير الموزعة من 2027م. ولو وُزعت خلال فترة الاختبار لتجنبت المجموعة هذا العبء."],"r":["88(2)","88(4)","88(5)","88(6)"],"p":["SAR 10m left undistributed from FY2027 is topped up at 15% in FY2030: SAR 1.5m.","العشرة ملايين غير الموزعة من 2027م تخضع لضريبة تكميلية بنسبة 15% في 2030م: 1.5 مليون ريال."],"diagrams":[{"type":"waterfall","at":"answer","title":["What is left undistributed","ما يبقى دون توزيع"],"cap":["SAR million","بملايين الريالات"],"rows":[{"l":["FY2027 DMT income","دخل 2027م"],"v":40,"k":"add"},{"l":["Distributions, FY2027 to FY2030","التوزيعات من 2027م إلى 2030م"],"v":25,"k":"sub"},{"l":["FY2029 loss","خسارة 2029م"],"v":5,"k":"sub"},{"l":["Undistributed","غير الموزع"],"v":10,"k":"sum"}],"note":["Taxed at the full 15% in FY2030: SAR 1.5m.","يخضع لنسبة 15% كاملة في 2030م: 1.5 مليون ريال."]}]},{"t":["A flow-through parent","كيان أم شفاف"],"facts":["Assume a Saudi partnership, fiscally transparent, is the UPE of an MNE group. Its FY2027 DMT income is SAR 100m. Owners: a company taxed on its full share at 20% in a period ending within 12 months (60%); Saudi-resident individuals each holding 5% or less (15% in total); a foreign fund not taxed on the income (25%).","افترض أن شراكة في المملكة، شفافة ضريبياً، هي الكيان الأم النهائي لمجموعة متعددة الجنسيات. دخلها لعام 2027م 100 مليون ريال. الملاك: شركة تخضع للضريبة على كامل حصتها بنسبة 20% عن فترة تنتهي خلال 12 شهراً (60%)؛ وأفراد مقيمون في المملكة يملك كل منهم 5% أو أقل (15% إجمالاً)؛ وصندوق أجنبي لا يخضع للضريبة على الدخل (25%)."],"steps":[{"t":["Reduction for the company taxed at 20%:","التخفيض عن الشركة الخاضعة لـ20%:"],"x":"100000000*60/100","v":60000000,"u":"SAR"},{"t":["Reduction for the small resident individual holders:","التخفيض عن صغار الحاملين من الأفراد المقيمين:"],"x":"100000000*15/100","v":15000000,"u":"SAR"},{"t":["DMT income that stays with the UPE:","الدخل الذي يبقى لدى الكيان الأم:"],"x":"100000000-60000000-15000000","v":25000000,"u":"SAR"}],"ans":["Only SAR 25m, the untaxed foreign fund's share, stays in the UPE's DMT income, and its covered taxes are cut in proportion.","لا يبقى في دخل الكيان الأم إلا 25 مليون ريال، وهي حصة الصندوق الأجنبي غير الخاضع للضريبة، وتُخفض ضرائبه المشمولة بالنسبة نفسها."],"r":["84(1)","84(3)"],"p":["Only SAR 25m, the untaxed foreign fund's share, stays with the parent.","لا يبقى لدى الكيان الأم إلا 25 مليون ريال، وهي حصة الصندوق الأجنبي غير الخاضع للضريبة."],"diagrams":[{"type":"bars","at":"answer","title":["Where the SAR 100m goes","أين تذهب الـ100 مليون ريال"],"u":"SAR","items":[{"l":["Out: company taxed at 20% (60%)","تخرج: شركة تخضع لنسبة 20% (60%)"],"v":60000000},{"l":["Out: small resident individuals (15%)","تخرج: أفراد مقيمون صغار (15%)"],"v":15000000},{"l":["Stays: untaxed foreign fund (25%)","تبقى: صندوق أجنبي غير خاضع (25%)"],"v":25000000,"tone":"g"}],"note":["The parent's covered taxes are cut in the same proportion.","وتُخفض الضرائب المشمولة للكيان الأم بالنسبة نفسها."]}]}],"quiz":[{"q":["When does a flow-through UPE reduce its DMT income for an ownership interest?","متى يخفض الكيان الأم النهائي الشفاف دخله عن حصة ملكية؟"],"o":[["When the holder is taxed on the full amount at under 15% within 12 months","عندما يخضع الحامل للضريبة على كامل المبلغ بنسبة تقل عن 15% خلال 12 شهراً"],["When the holder is taxed on half the amount at under 15% within 12 months","عندما يخضع الحامل للضريبة على نصف المبلغ بنسبة تقل عن 15% خلال 12 شهراً"],["When the holder is taxed on half the amount at 15% or more within 12 months","عندما يخضع الحامل للضريبة على نصف المبلغ بنسبة 15% أو أكثر خلال 12 شهراً"],["When the holder is taxed on the full amount at 15% or more within 12 months","عندما يخضع الحامل للضريبة على كامل المبلغ بنسبة 15% أو أكثر خلال 12 شهراً"]],"a":3,"e":["Article 84(1)(a): the holder is taxed on the full amount at a nominal rate of 15% or more for a period ending within 12 months of the group's year-end, or the UPE's and holder's taxes together are expected to reach 15%.","المادة 84 (1) (أ): يخضع الحامل للضريبة على كامل المبلغ بمعدل اسمي 15% أو أكثر عن فترة تنتهي خلال 12 شهراً من نهاية سنة المجموعة، أو يُتوقع أن تبلغ ضرائب الكيان الأم والحامل معاً 15%."],"r":["84(1)"]},{"q":["Which small holder also qualifies for the reduction?","أي حامل صغير يستفيد أيضاً من التخفيض؟"],"o":[["A natural person resident anywhere, holding 10% or less","شخص طبيعي مقيم في أي مكان، يملك 10% أو أقل"],["A company resident in the UPE jurisdiction holding 5% or less","شركة مقيمة في ولاية الكيان الأم تملك 5% أو أقل"],["A natural person resident in the UPE jurisdiction holding 5% or less","شخص طبيعي مقيم في ولاية الكيان الأم يملك 5% أو أقل"],["A natural person resident in the UPE jurisdiction holding 10% or less","شخص طبيعي مقيم في ولاية الكيان الأم يملك 10% أو أقل"]],"a":2,"e":["Article 84(1)(b): a resident individual holding 5% or less qualifies, as do resident governmental entities, international and non-profit organisations and pension funds at that size.","المادة 84 (1) (ب): يستفيد الفرد المقيم الذي يملك 5% أو أقل، وكذلك الكيانات الحكومية والمنظمات الدولية وغير الربحية وصناديق التقاعد المقيمة بالحجم نفسه."],"r":["84(1)"]},{"q":["A flow-through UPE has a DMT loss. What happens?","لدى الكيان الأم الشفاف خسارة. ماذا يحدث؟"],"o":[["It stays in full with the UPE, as losses never pass to holders","تبقى كاملة لدى الكيان الأم، لأن الخسائر لا تنتقل إلى الحاملين أبداً"],["It is reduced by each holder's share of the loss, unless holders cannot use it","تُخفض بحصة كل حامل من الخسارة، ما لم يتعذر على الحاملين استخدامها"],["It is reduced by each holder's share of the loss, even if holders cannot use it","تُخفض بحصة كل حامل من الخسارة، حتى لو تعذر على الحاملين استخدامها"],["It is carried back against the UPE's DMT income of the prior year","تُرحَّل إلى الخلف لمقابلة دخل الكيان الأم في السنة السابقة"]],"a":1,"e":["Article 84(2): the loss is reduced by the loss attributable to each ownership interest, except to the extent holders cannot use it in their own taxable income.","المادة 84 (2): تُخفض الخسارة بالخسارة المنسوبة إلى كل حصة ملكية، إلا بقدر ما لا يستطيع الحاملون استخدامها في دخلهم الخاضع للضريبة."],"r":["84(2)"]},{"q":["How is an investment entity's ETR computed?","كيف يُحتسب المعدل الفعلي لكيان الاستثمار؟"],"o":[["At the owner's level: the owner's covered taxes ÷ its total DMT income","على مستوى المالك: ضرائب المالك المشمولة ÷ إجمالي دخله"],["Separately: its covered taxes ÷ the group's allocable share of its DMT income","بشكل مستقل: ضرائبه المشمولة ÷ حصة المجموعة القابلة للتخصيص من دخله"],["Separately: its covered taxes ÷ its total DMT income, including other owners' share","بشكل مستقل: ضرائبه المشمولة ÷ إجمالي دخله، بما في ذلك حصة الملاك الآخرين"],["At the owner's level: the owner's covered taxes ÷ its allocable share","على مستوى المالك: ضرائب المالك المشمولة ÷ حصته القابلة للتخصيص"]],"a":1,"e":["Article 85(2): computed apart from the Kingdom, on the group's allocable share of its income, not all of it.","المادة 85 (2): يُحتسب بمعزل عن المملكة، على حصة المجموعة القابلة للتخصيص من دخله، لا على كامله."],"r":["85(2)"]},{"q":["What is the 'allocable share'?","ما «الحصة القابلة للتخصيص»؟"],"o":[["The investment entity's net revenue × the UPE's inclusion ratio","صافي إيرادات كيان الاستثمار × نسبة التضمين للكيان الأم النهائي"],["The investment entity's DMT income × the 15% minimum rate","دخل كيان الاستثمار × الحد الأدنى للضريبة البالغ 15%"],["The investment entity's net revenue × the 15% minimum rate","صافي إيرادات كيان الاستثمار × الحد الأدنى للضريبة البالغ 15%"],["The investment entity's DMT income × the UPE's inclusion ratio","دخل كيان الاستثمار × نسبة التضمين للكيان الأم النهائي"]],"a":3,"e":["Article 85(4): the investment entity's DMT income × the UPE's inclusion ratio.","المادة 85 (4): دخل كيان الاستثمار × نسبة التضمين للكيان الأم النهائي."],"r":["85(4)"]},{"q":["What is the inclusion ratio?","ما نسبة التضمين؟"],"o":[["Other owners' share of its DMT income, ÷ its DMT income","حصة الملاك الآخرين من دخله، ÷ دخله"],["Its revenue less the part paid to other owners, ÷ its total assets","إيراداته ناقصاً ما يُدفع للملاك الآخرين، ÷ إجمالي أصوله"],["Its DMT income less the part attributable to other owners, ÷ its DMT income","دخله ناقصاً الجزء المنسوب إلى الملاك الآخرين، ÷ دخله"],["Its revenue less the part attributable to other owners, ÷ its revenue","إيراداته ناقصاً الجزء المنسوب إلى الملاك الآخرين، ÷ إيراداته"]],"a":2,"e":["Article 85(5): the share of the entity's DMT income that belongs to the group, so other owners' share drops out.","المادة 85 (5): حصة المجموعة من دخل الكيان، فتسقط حصة الملاك الآخرين."],"r":["85(5)"]},{"q":["How is an investment entity's top-up tax computed?","كيف تُحتسب الضريبة التكميلية لكيان الاستثمار؟"],"o":[["The Kingdom's top-up % × (allocable share − SBIE)","نسبة المملكة التكميلية × (الحصة القابلة للتخصيص − الاستبعاد)"],["Its top-up % × (allocable share − its SBIE)","نسبتها التكميلية × (الحصة القابلة للتخصيص − استبعادها)"],["Its top-up % × (its total DMT income − its SBIE)","نسبتها التكميلية × (إجمالي دخلها − استبعادها)"],["The Kingdom's top-up % × (its total DMT income − its SBIE)","نسبة المملكة التكميلية × (إجمالي دخلها − استبعادها)"]],"a":1,"e":["Article 85(6)–(7): its own top-up percentage (15% minus its ETR) × the group's allocable share less its own SBIE.","المادة 85 (6)–(7): نسبته التكميلية الخاصة (15% ناقصاً معدله) × حصة المجموعة القابلة للتخصيص ناقصاً استبعاده."],"r":["85(6)","85(7)"]},{"q":["Which entity is NOT an investment entity under Article 86?","أي كيان ليس كيان استثمار وفق المادة 86؟"],"o":[["An investment fund meeting the Article 17 tests","صندوق استثمار يستوفي اختبارات المادة 17"],["A widely held real estate investment vehicle","أداة استثمار عقاري واسعة الملكية"],["An operating subsidiary 70% owned by a fund","شركة تشغيلية تابعة مملوكة لصندوق بنسبة 70%"],["An entity 95% owned by a fund that only holds assets for it","كيان يملكه صندوق بنسبة 95% ولا يقوم إلا بحيازة الأصول له"]],"a":2,"e":["Article 86(1): the ownership tests are 95% (holding vehicles) and 85% (mainly excluded dividends or gains).","المادة 86 (1): اختبارات الملكية 95% (أدوات الحيازة) و85% (توزيعات أو مكاسب مستبعدة في الغالب)."],"r":[86]},{"q":["When is the tax transparency election available?","متى يتاح اختيار الشفافية الضريبية؟"],"o":[["When the owner is taxed yearly on the fund's fair value changes at 15% or more","عندما يخضع المالك للضريبة سنوياً على تغيرات القيمة العادلة للصندوق بنسبة 15% أو أكثر"],["When the owner is taxed on distributions from the fund at 15% or more","عندما يخضع المالك للضريبة على ما يتلقاه من توزيعات الصندوق بنسبة 15% أو أكثر"],["When the owner is taxed on distributions from the fund at under 15%","عندما يخضع المالك للضريبة على توزيعات الصندوق بنسبة تقل عن 15%"],["When the owner is taxed yearly on fair value changes at under 15%","عندما يخضع المالك للضريبة سنوياً على تغيرات القيمة العادلة بنسبة تقل عن 15%"]],"a":0,"e":["Article 87(1): the owner must be taxed under a mark-to-market or similar regime on yearly fair value changes, at 15% or more. Tax on distributions is the Article 88 route.","المادة 87 (1): يجب أن يخضع المالك لنظام القيمة السوقية أو ما يماثله على التغيرات السنوية في القيمة العادلة بنسبة 15% أو أكثر. أما الضريبة على التوزيعات فهي طريق المادة 88."],"r":[87]},{"q":["When is the taxable distribution method available?","متى تتاح طريقة التوزيع الخاضع للضريبة؟"],"o":[["When an owner, even another investment entity, is taxed on distributions at 15%+","عندما يخضع مالك، ولو كان كيان استثمار آخر، للضريبة على التوزيعات بنسبة 15% فأكثر"],["When the owner is taxed yearly on fair value changes at 15% or more","عندما يخضع المالك للضريبة سنوياً على تغيرات القيمة العادلة بنسبة 15% أو أكثر"],["Only for Saudi funds whose owners are all Saudi residents","فقط للصناديق السعودية التي يقيم جميع ملاكها في المملكة"],["When a non-investment-entity owner is expected to be taxed on distributions at 15%+","عندما يُتوقع خضوع مالك ليس كيان استثمار للضريبة على التوزيعات بنسبة 15% فأكثر"]],"a":3,"e":["Article 88(1): the owner, not itself an investment entity, must reasonably be expected to be taxed on distributions at 15% or more.","المادة 88 (1): يجب أن يُتوقع بشكل معقول خضوع المالك، الذي ليس كيان استثمار، للضريبة على التوزيعات بنسبة 15% أو أكثر."],"r":["88(1)"]},{"q":["Under the taxable distribution method, what is the 'tested year'?","في طريقة التوزيع الخاضع للضريبة، ما «سنة الاختبار»؟"],"o":[["The third year preceding the reporting fiscal year","السنة الثالثة السابقة لسنة الإقرار"],["The second year preceding the reporting fiscal year","السنة الثانية السابقة لسنة الإقرار"],["The fifth year preceding the reporting fiscal year","السنة الخامسة السابقة لسنة الإقرار"],["The first fiscal year in which the election was made","أول سنة مالية أُجري فيها الاختيار"]],"a":0,"e":["Article 88(5): the tested year is the third fiscal year before the reporting year; its undistributed income is checked over the testing period.","المادة 88 (5): سنة الاختبار هي السنة المالية الثالثة السابقة لسنة الإقرار، ويُفحص دخلها غير الموزع خلال فترة الاختبار."],"r":["88(5)"]},{"q":["Undistributed net DMT income remains at the end of the testing period. How is it taxed?","بقي صافي دخل غير موزع في نهاية فترة الاختبار. كيف تُفرض عليه الضريبة؟"],"o":[["The owner's share is DMT income of the reporting year; 15% of it is top-up tax","تُعد حصة المالك دخلاً لسنة الإقرار، و15% منها ضريبة تكميلية"],["The owner's share is taxed at the Kingdom's top-up percentage for the year","تخضع حصة المالك لنسبة الضريبة التكميلية للمملكة عن السنة"],["The owner's share is added back to the tested year, which is reopened","تُضاف حصة المالك إلى سنة الاختبار، التي يُعاد فتحها"],["The owner's share is DMT income of the reporting year; 20% of it is top-up tax","تُعد حصة المالك دخلاً لسنة الإقرار، و20% منها ضريبة تكميلية"]],"a":0,"e":["Article 88(2)(c): the owner's share is treated as DMT income of the reporting year, and top-up tax is 15% of it, not the Kingdom's top-up percentage.","المادة 88 (2) (ج): تُعامل حصة المالك كدخل لسنة الإقرار، والضريبة التكميلية 15% منها، لا نسبة المملكة التكميلية."],"r":["88(2)"]}],"cards":[{"f":["Flow-through UPE reduction","تخفيض الكيان الأم الشفاف"],"b":["Reduce DMT income for interests whose holders are taxed at 15%+ within 12 months, and for small resident holders (≤5%).","يُخفض الدخل عن الحصص التي يخضع حاملوها لـ15% فأكثر خلال 12 شهراً، وعن صغار الحاملين المقيمين (≤5%)."],"r":["84(1)"]},{"f":["Flow-through UPE losses and taxes","خسائر الكيان الأم الشفاف وضرائبه"],"b":["Losses reduced for holders who can use them; covered taxes reduced in proportion.","تُخفض الخسائر عن الحاملين القادرين على استخدامها؛ وتُخفض الضرائب المشمولة بالنسبة نفسها."],"r":["84(2)","84(3)"]},{"f":["Investment entity","كيان الاستثمار"],"b":["Investment fund or REIV; 95%-owned holding vehicles; 85%-owned entities earning mainly excluded dividends or gains.","صندوق استثمار أو أداة استثمار عقاري؛ وأدوات حيازة مملوكة بنسبة 95%؛ وكيانات مملوكة بنسبة 85% تكسب أساساً توزيعات أو مكاسب مستبعدة."],"r":[86]},{"f":["Investment entity ETR","المعدل الفعلي لكيان الاستثمار"],"b":["Separate from the Kingdom: covered taxes ÷ allocable share; Saudi investment entities combined.","مستقل عن المملكة: الضرائب المشمولة ÷ الحصة القابلة للتخصيص؛ وتُجمع كيانات الاستثمار في المملكة."],"r":["85(2)"]},{"f":["Allocable share","الحصة القابلة للتخصيص"],"b":["Investment entity's DMT income × the UPE's inclusion ratio.","دخل كيان الاستثمار × نسبة التضمين للكيان الأم النهائي."],"r":["85(4)"]},{"f":["Inclusion ratio","نسبة التضمين"],"b":["(DMT income − part attributable to other owners) ÷ DMT income.","(الدخل − الجزء المنسوب إلى الملاك الآخرين) ÷ الدخل."],"r":["85(5)"]},{"f":["Investment entity covered taxes","الضرائب المشمولة لكيان الاستثمار"],"b":["Those attributable to the allocable share, plus taxes allocated to it under the Regulations.","المنسوبة إلى الحصة القابلة للتخصيص، مع الضرائب المخصصة له وفق اللائحة."],"r":["85(3)"]},{"f":["Investment entity top-up","الضريبة التكميلية لكيان الاستثمار"],"b":["(15% − its ETR) × (allocable share − its SBIE).","(15% − معدله) × (الحصة القابلة للتخصيص − استبعاده)."],"r":["85(6)","85(7)"]},{"f":["Tax transparency election","اختيار الشفافية الضريبية"],"b":["Owner taxed mark-to-market at 15%+: treat the fund as tax transparent.","المالك خاضع لنظام القيمة السوقية بنسبة 15% فأكثر: يُعامل الصندوق كشفاف ضريبياً."],"r":[87]},{"f":["Taxable distribution method","طريقة التوزيع الخاضع للضريبة"],"b":["Owner taxed on distributions at 15%+: distributions in the owner's income; fund out of ETR computations.","المالك خاضع للضريبة على التوزيعات بنسبة 15% فأكثر: التوزيعات في دخل المالك؛ والصندوق خارج حسابات المعدل."],"r":["88(1)","88(2)"]},{"f":["Undistributed net DMT income","صافي الدخل غير الموزع"],"b":["Tested-year income less covered taxes, distributions, losses and investment loss carry-forwards in the testing period.","دخل سنة الاختبار ناقصاً الضرائب المشمولة والتوزيعات والخسائر وخسائر الاستثمار المرحّلة في فترة الاختبار."],"r":["88(4)"]},{"f":["Tested year and testing period","سنة الاختبار وفترة الاختبار"],"b":["Tested year: third year before the reporting year; testing period: from its start to the reporting year-end.","سنة الاختبار: السنة الثالثة قبل سنة الإقرار؛ وفترة الاختبار: من بدايتها حتى نهاية سنة الإقرار."],"r":["88(5)","88(6)"]}],"terms":[{"t":["Flow-through UPE","الكيان الأم النهائي الشفاف"],"d":["A top parent whose income is taxed in its owners' hands, like a partnership.","كيان أم نهائي يخضع دخله للضريبة لدى ملاكه، مثل شركات الأشخاص."]},{"t":["Investment entity","كيان الاستثمار"],"d":["A fund or REIV, or a vehicle owned 95% or 85% by one.","صندوق أو أداة استثمار عقاري، أو أداة مملوكة لأي منهما بنسبة 95% أو 85%."]},{"t":["Inclusion ratio","نسبة التضمين"],"d":["The group's share of the fund's income, as a fraction.","حصة المجموعة من دخل الصندوق، في صورة نسبة."]},{"t":["Allocable share","الحصة القابلة للتخصيص"],"d":["The fund's income times the inclusion ratio: the base for its own rate.","دخل الصندوق مضروباً في نسبة التضمين: وهو أساس معدله الخاص."]},{"t":["Mark-to-market","نظام القيمة السوقية"],"d":["Taxing yearly changes in value, without waiting for a sale.","فرض الضريبة على التغيرات السنوية في القيمة دون انتظار البيع."]},{"t":["Taxable distribution method","طريقة التوزيع الخاضع للضريبة"],"d":["An election that counts only what the fund pays out to its owner.","اختيار لا يُحتسب فيه إلا ما يوزعه الصندوق على مالكه."]},{"t":["Tested year","سنة الاختبار"],"d":["The year whose undistributed income is checked three years later.","السنة التي يُفحص دخلها غير الموزع بعد ثلاث سنوات."]}],"range":"84–88"},{"id":15,"title":["Registration, returns, payment and the capstone","التسجيل والإقرارات والسداد والمراجعة الختامية"],"goal":["Map the compliance calendar, ZATCA's powers, currency rules and penalties, then run one computation end to end.","رسم تقويم الالتزام، وصلاحيات الهيئة، وقواعد العملة والغرامات، ثم تنفيذ احتساب كامل من البداية إلى النهاية."],"parts":[10,11,12],"arts":[89,90,91,92,93,94,95,96,97,98,99,100,101,102,105,106],"time":45,"metaphor":{"title":["A flight plan","خطة الرحلة"],"text":["Registration is filing the flight plan: within 15 months of the end of the first year in scope. The domestic top-up tax return and the GloBE information return are the landing reports: 15 months after each year-end, 18 months for the very first year. ZATCA is air traffic control and can review the logs for five years, or ten where a return was never filed or evasion was intended.\nThe instruments: euro thresholds are read at the December average rate, and the tax is paid in riyals.","التسجيل هو تقديم خطة الرحلة: خلال 15 شهراً من نهاية أول سنة خاضعة. وإقرار الضريبة التكميلية المحلية وإقرار معلومات القواعد العالمية هما تقريرا الهبوط: بعد 15 شهراً من نهاية كل سنة، و18 شهراً للسنة الأولى. والهيئة برج المراقبة، ولها مراجعة السجلات خمس سنوات، أو عشراً إذا لم يُقدم الإقرار أصلاً أو قُصد التهرب.\nوالأدوات: تُقرأ الحدود المقومة باليورو بمتوسط سعر ديسمبر، وتُسدد الضريبة بالريال."]},"anchors":[{"if":["FY2027 (calendar year) is the group's first year in scope","السنة المالية 2027م (تقويمية) أول سنة خاضعة للمجموعة"],"then":["Register by 31 March 2029, through one designated local entity if there are several taxpayers (Art 91)","سجّل قبل 31 مارس 2029م، عبر كيان محلي معين واحد إذا تعدد المكلفون (المادة 91)"]},{"if":["It is the transition year","إنها سنة الانتقال"],"then":["File the DTT return and GIR within 18 months: 30 June 2029 for FY2027 (Art 105)","قدّم إقرار الضريبة وإقرار المعلومات خلال 18 شهراً: 30 يونيو 2029م لعام 2027م (المادة 105)"]},{"if":["The UPE files the GIR in a country with a QCAA in effect with the Kingdom","يقدم الكيان الأم النهائي إقرار المعلومات في دولة لديها اتفاق مؤهل نافذ مع المملكة"],"then":["No Saudi GIR; notify ZATCA who files and where (Art 94(7)–(8))","لا إقرار معلومات في المملكة؛ أخطر الهيئة بمن يقدمه وأين (المادة 94 (7)–(8))"]},{"if":["A euro threshold must be tested","يجب اختبار حد مقوم باليورو"],"then":["Convert at the average December rate of the preceding year: ECB, else the Saudi Central Bank (Art 98(2))","حوّل بمتوسط سعر ديسمبر للسنة السابقة: البنك المركزي الأوروبي، وإلا البنك المركزي السعودي (المادة 98 (2))"]},{"if":["ZATCA wants to reassess a year","تريد الهيئة إعادة ربط سنة"],"then":["Five years from the return deadline; ten if no return or intended evasion; any time with written consent (Art 95(4))","خمس سنوات من موعد الإقرار؛ وعشر إذا لم يُقدم أو قُصد التهرب؛ وفي أي وقت بموافقة خطية (المادة 95 (4))"]}],"diagrams":[{"type":"table","title":["Compliance calendar for a calendar-year group in scope from FY2027","تقويم الالتزام لمجموعة سنتها تقويمية خاضعة اعتباراً من 2027م"],"head":[["Obligation","الالتزام"],["Deadline","الموعد"],["Where","الموضع"]],"rows":[[["Registration","التسجيل"],["31 March 2029 (15 months after FY2027)","31 مارس 2029م (15 شهراً بعد 2027م)"],["Art 91(1)","المادة 91 (1)"]],[["FY2027 DTT return and GIR","إقرار الضريبة وإقرار المعلومات لعام 2027م"],["30 June 2029 (18 months)","30 يونيو 2029م (18 شهراً)"],["Art 105","المادة 105"]],[["FY2028 DTT return and GIR","إقرار الضريبة وإقرار المعلومات لعام 2028م"],["31 March 2030 (15 months)","31 مارس 2030م (15 شهراً)"],["Art 94(1), 94(9)","المادة 94 (1)، 94 (9)"]],[["Change in registration details","تغيير بيانات التسجيل"],["15 months after the year-end of the change","15 شهراً بعد نهاية سنة التغيير"],["Art 91(3)","المادة 91 (3)"]],[["Payment of the tax","سداد الضريبة"],["As set by the Regulations","وفق ما تحدده اللائحة"],["Art 97","المادة 97"]],[["ZATCA assessment of FY2028","ربط الهيئة لعام 2028م"],["Until 31 March 2035 (ten years if no return or intended evasion)","حتى 31 مارس 2035م (عشر سنوات إذا لم يُقدم الإقرار أو قُصد التهرب)"],["Art 95(4)","المادة 95 (4)"]],[["Refund claim for an FY2028 overpayment","طلب استرداد مبلغ زائد مسدد في 2028م"],["31 December 2033 (five years from the end of the year)","31 ديسمبر 2033م (خمس سنوات من نهاية السنة)"],["Art 95(5)","المادة 95 (5)"]]],"quick":true},{"type":"flow","title":["The whole course in one line","المقرر كله في سطر واحد"],"nodes":[{"t":["Scope","النطاق"],"s":["Arts 2–17","المواد 2–17"]},{"t":["DMT income","الدخل"],"s":["Arts 18–41","المواد 18–41"]},{"t":["Covered taxes","الضرائب المشمولة"],"s":["Arts 42–52","المواد 42–52"]},{"t":["ETR and top-up","المعدل والضريبة التكميلية"],"s":["Arts 53–57, 63, 65","المواد 53–57، 63، 65"]},{"t":["SBIE","الاستبعاد"],"s":["Arts 58–62, 104","المواد 58–62، 104"]},{"t":["Reliefs","التخفيفات"],"s":["Arts 64, 66–72","المواد 64، 66–72"]},{"t":["Liability and filing","المسؤولية والإقرار"],"s":["Arts 73, 89–106","المواد 73، 89–106"]}],"quick":true}],"points":[{"h":["ZATCA in charge","الهيئة هي المسؤولة"],"t":["ZATCA administers, controls, assesses and collects the domestic top-up tax and imposes penalties, by decision of the Governor or a person he authorises. Anti-avoidance follows the Income Tax Law and its regulations, applied in line with this law's objectives.","تتولى الهيئة إدارة الضريبة التكميلية المحلية والرقابة عليها وربطها وتحصيلها، وتفرض الغرامات بقرار من المحافظ أو من يفوضه. وتُطبق إجراءات مكافحة التجنب وفق نظام ضريبة الدخل ولائحته، بما يتفق مع أهداف هذا النظام."],"r":[89,90],"p":["ZATCA runs the tax; anti-avoidance follows the Income Tax Law.","تدير الهيئة الضريبة؛ وتتبع مكافحة التجنب نظام ضريبة الدخل."]},{"h":["Registration","التسجيل"],"t":["Each taxpayer registers within 15 months of the end of its first fiscal year in scope. Where a group has several Saudi taxpayers, they appoint a designated local entity to register for all of them. Changes are notified within 15 months of the end of the year of change; failures attract the Income Tax Law's registration penalties.","يسجل كل مكلف خلال 15 شهراً من نهاية أول سنة مالية يخضع فيها للنظام. وإذا كان للمجموعة عدة مكلفين في المملكة عيّنوا كياناً محلياً معيناً يسجل عنهم جميعاً. ويُخطر بالتغييرات خلال 15 شهراً من نهاية سنة التغيير؛ ويترتب على الإخلال غرامات التسجيل في نظام ضريبة الدخل."],"r":[91],"p":["Register within 15 months of the first year-end in scope; one local entity registers for all.","سجّل خلال 15 شهراً من نهاية أول سنة في النطاق؛ ويسجل كيان محلي معين واحد عن الجميع."]},{"h":["Books, records and fiscal year","الدفاتر والسجلات والسنة المالية"],"t":["Taxpayers keep commercial books and records in Arabic for at least the period required by Saudi law; ZATCA may refuse a deduction that cannot be documented. The fiscal year is the UPE's consolidated accounts period, or the calendar year where deemed consolidated statements are used.","يمسك المكلفون الدفاتر التجارية والسجلات المحاسبية باللغة العربية مدة لا تقل عن المدة المقررة نظاماً في المملكة؛ وللهيئة رفض الخصم الذي لا يمكن إثباته. والسنة المالية هي فترة القوائم الموحدة للكيان الأم النهائي، أو السنة التقويمية حيث تُستخدم قوائم موحدة افتراضية."],"r":[92,93],"p":["Keep books in Arabic; the fiscal year follows the parent's consolidated accounts.","امسك الدفاتر بالعربية؛ وتتبع السنة المالية القوائم الموحدة للكيان الأم."]},{"h":["The domestic top-up tax return","إقرار الضريبة التكميلية المحلية"],"t":["Filed within 15 months of the year-end, with a self-assessment and a declaration that it is complete and correct. The designated local entity files one return for all the group's Saudi taxpayers. Amendments follow the Regulations.","يُقدم خلال 15 شهراً من نهاية السنة، متضمناً تقديراً ذاتياً للضريبة وإقراراً بأنه كامل وصحيح. ويقدم الكيان المحلي المعين إقراراً واحداً عن جميع مكلفي المجموعة في المملكة. وتخضع التعديلات للائحة."],"r":["94(1)","94(2)","94(3)","94(4)","94(5)"],"p":["File one self-assessed return for all Saudi taxpayers within 15 months of year-end.","قدّم إقراراً واحداً بالتقدير الذاتي عن كل المكلفين في المملكة خلال 15 شهراً من نهاية السنة."]},{"h":["The GloBE information return","إقرار معلومات القواعد العالمية"],"t":["Each taxpayer files a GIR in the standard template within 15 months, unless it is filed by the UPE or a designated filing entity in a jurisdiction with a qualifying competent authority agreement in effect with the Kingdom; ZATCA must then be told who files and where.","يقدم كل مكلف إقرار المعلومات بالنموذج الموحد خلال 15 شهراً، ما لم يقدمه الكيان الأم النهائي أو كيان مقدم معين في ولاية لديها اتفاق سلطة مختصة مؤهل نافذ مع المملكة؛ وعندئذ تُخطر الهيئة بمن يقدمه وأين."],"r":["94(6)","94(7)","94(8)","94(9)","94(10)","94(12)"],"p":["File the GIR too, unless the parent files it in a country with an agreement in effect with the Kingdom.","قدّم إقرار المعلومات أيضاً، ما لم يقدمه الكيان الأم في دولة لديها اتفاق نافذ مع المملكة."]},{"h":["First-year relief","تخفيف السنة الأولى"],"t":["For the transition year, both returns are due 18 months after the year-end instead of 15.","في سنة الانتقال يُستحق الإقراران بعد 18 شهراً من نهاية السنة بدلاً من 15."],"r":[105],"p":["First year: 18 months to file instead of 15.","السنة الأولى: 18 شهراً للتقديم بدلاً من 15."]},{"h":["Assessments, objections and refunds","الربوط والاعتراضات والاستردادات"],"t":["ZATCA may correct a return or assess where none is filed, and may raise an additional assessment. Objections follow the rules of procedure of the Zakat, Tax and Customs Committees. Time limits: five years (from the filing deadline, a refund request or a committee decision), ten years without a return or with intended evasion, or any time with written consent. Refunds are claimed within five years of the end of the year overpaid.","للهيئة تصحيح الإقرار أو إجراء الربط عند عدم تقديمه، ولها إجراء ربط إضافي. وتخضع الاعتراضات لقواعد عمل لجان الفصل في المخالفات والمنازعات الزكوية والضريبية والجمركية. والمدد: خمس سنوات (من موعد الإقرار أو طلب الاسترداد أو قرار اللجنة)، وعشر سنوات عند عدم تقديم الإقرار أو قصد التهرب، أو في أي وقت بموافقة خطية. ويُطلب الاسترداد خلال خمس سنوات من نهاية سنة السداد الزائد."],"r":[95],"p":["ZATCA can assess within five years, or ten with no return or intended evasion; refunds within five.","يجوز للهيئة الربط خلال خمس سنوات، أو عشر عند عدم تقديم الإقرار أو قصد التهرب؛ والاسترداد خلال خمس."]},{"h":["Information and field examination","المعلومات والفحص الميداني"],"t":["All persons and government bodies must give ZATCA tax information it requests, including for treaty purposes, and ZATCA may examine books and records on site during working hours.","على جميع الأشخاص والجهات الحكومية تزويد الهيئة بما تطلبه من معلومات ضريبية، بما في ذلك لأغراض الاتفاقيات، وللهيئة فحص الدفاتر والسجلات ميدانياً خلال ساعات العمل."],"r":[96],"p":["ZATCA can demand information and examine books on site.","يجوز للهيئة طلب المعلومات وفحص الدفاتر ميدانياً."]},{"h":["Currency and payment","العملة والسداد"],"t":["The tax is paid in riyals; payment timing is set by the Regulations. Amounts not already in riyals are translated using the accounting standard's principles, and the tax payable is converted at the Saudi Central Bank rate for the last day of the year. Euro thresholds are tested at the average December rate of the preceding year, quoted by the ECB, else the Saudi Central Bank, else a source ZATCA accepts.","تُسدد الضريبة بالريال، ويحدد اللائحة موعد السداد. وتُحوّل المبالغ غير المقومة بالريال وفق مبادئ المعيار المحاسبي، وتُحوّل الضريبة المستحقة بسعر البنك المركزي السعودي لآخر يوم من السنة. وتُختبر الحدود المقومة باليورو بمتوسط سعر ديسمبر للسنة السابقة، كما ينشره البنك المركزي الأوروبي، وإلا البنك المركزي السعودي، وإلا مصدر تقبله الهيئة."],"r":[97,98,99],"p":["Pay in riyals; test euro thresholds at the December average rate.","ادفع بالريال؛ واختبر الحدود المقومة باليورو بمتوسط سعر ديسمبر."]},{"h":["Penalties and collection","الغرامات والتحصيل"],"t":["Filing, late payment and fraud penalties, and collection by seizure and sale, all follow the Income Tax Law and its regulations, subject to the transitional penalty relief in Article 72. The Board may cancel uncollectible tax debts.","تتبع غرامات الإقرار والتأخر في السداد والاحتيال، والتحصيل بالحجز والبيع، أحكام نظام ضريبة الدخل ولائحته، مع مراعاة الإعفاء الانتقالي من الغرامات في المادة 72. وللمجلس إسقاط الديون الضريبية المتعذر تحصيلها."],"r":[100,101,102,"99(3)",72],"p":["Penalties and collection follow the Income Tax Law, with relief in the early years.","تتبع الغرامات والتحصيل نظام ضريبة الدخل، مع تخفيف في السنوات الأولى."]},{"h":["Start date and Regulations","تاريخ البدء واللائحة"],"t":["The law applies to fiscal years beginning on or after 1 January 2027. The Board issues the Regulations within 180 days of the law's issuance, effective from the same date as the law.","يُطبق النظام على السنوات المالية التي تبدأ في 1 يناير 2027م أو بعده. ويصدر المجلس اللائحة خلال 180 يوماً من صدور النظام، ويُعمل بها من تاريخ نفاذه."],"r":[106],"p":["The law applies to fiscal years beginning on or after 1 January 2027.","يُطبق النظام على السنوات المالية التي تبدأ في 1 يناير 2027م أو بعده."]}],"oecd":[{"t":["Article 94 follows GloBE Article 8.1: no local GIR is needed where the UPE or designated filing entity files in a jurisdiction with a qualifying competent authority agreement in effect. The 15-month deadline and the 18-month first year match the GloBE timetable. The DTT return itself is a domestic return.","تتبع المادة 94 المادة 8.1 من القواعد النموذجية: فلا حاجة إلى إقرار معلومات محلي إذا قدمه الكيان الأم النهائي أو الكيان المقدم المعين في ولاية لديها اتفاق سلطة مختصة مؤهل نافذ. ويطابق موعد الـ15 شهراً والـ18 شهراً للسنة الأولى الجدول الزمني للقواعد العالمية. أما إقرار الضريبة التكميلية فإقرار محلي."],"src":["Model Rules Art 8.1","القواعد النموذجية: المادة 8.1"]},{"t":["KSA angle: penalties, objections and collection all borrow from the Income Tax Law and the committees' procedures, so existing ZATCA dispute experience carries over. The ECB's daily reference rates do not include the riyal, so the Saudi Central Bank's rate will usually be the one used for euro thresholds.","من منظور المملكة: تستعير الغرامات والاعتراضات والتحصيل أحكامها من نظام ضريبة الدخل وإجراءات اللجان، فتنتقل الخبرة القائمة في منازعات الهيئة. ولا تشمل الأسعار المرجعية اليومية للبنك المركزي الأوروبي الريال، لذا سيكون سعر البنك المركزي السعودي هو المستخدم عادةً للحدود المقومة باليورو."],"src":["Draft Arts 95, 98, 100–102; ECB reference rates","المشروع م 95 و98 و100–102؛ الأسعار المرجعية للبنك المركزي الأوروبي"]}],"cases":[{"t":["The first three years' calendar","تقويم السنوات الثلاث الأولى"],"facts":["A calendar-year group with three Saudi taxpayers comes into scope in FY2027. Its UPE files the GIR in a country that has a qualifying competent authority agreement in effect with the Kingdom.","تدخل مجموعة سنتها تقويمية ولها ثلاثة مكلفين في المملكة نطاق النظام في 2027م. ويقدم كيانها الأم النهائي إقرار المعلومات في دولة لديها اتفاق سلطة مختصة مؤهل نافذ مع المملكة."],"steps":[{"t":["The three taxpayers appoint one designated local entity, which registers all of them by 31 March 2029.","يعيّن المكلفون الثلاثة كياناً محلياً معيناً واحداً يسجلهم جميعاً قبل 31 مارس 2029م."]},{"t":["The designated local entity files one FY2027 DTT return by 30 June 2029 (18 months, transition year).","يقدم الكيان المحلي المعين إقراراً واحداً لعام 2027م قبل 30 يونيو 2029م (18 شهراً، سنة الانتقال)."]},{"t":["No Saudi GIR is needed, but ZATCA must be notified of the UPE as filer and its jurisdiction.","لا حاجة إلى إقرار معلومات في المملكة، لكن يجب إخطار الهيئة بأن الكيان الأم هو المقدم وبولايته."]},{"t":["The FY2028 DTT return is due by 31 March 2030 (15 months).","يُستحق إقرار 2028م قبل 31 مارس 2030م (15 شهراً)."]}],"ans":["One designated local entity carries the whole Saudi compliance load: registration by 31 March 2029, the FY2027 return by 30 June 2029 and the FY2028 return by 31 March 2030, plus the GIR notification. Payment dates will come from the Regulations.","يحمل كيان محلي معين واحد عبء الالتزام كله في المملكة: التسجيل قبل 31 مارس 2029م، وإقرار 2027م قبل 30 يونيو 2029م، وإقرار 2028م قبل 31 مارس 2030م، مع إخطار إقرار المعلومات. وستحدد اللائحة مواعيد السداد."],"r":["91(1)","91(2)","94(1)","94(5)","94(7)","94(8)",105],"p":["One local entity does it all: register by 31 March 2029, file FY2027 by 30 June 2029 and FY2028 by 31 March 2030.","يتولى كيان محلي واحد كل شيء: التسجيل قبل 31 مارس 2029م، وإقرار 2027م قبل 30 يونيو 2029م، وإقرار 2028م قبل 31 مارس 2030م."],"diagrams":[{"type":"flow","at":"answer","title":["The first deadlines","المواعيد الأولى"],"nodes":[{"t":["31 Dec 2027","31 ديسمبر 2027م"],"s":["FY2027 ends","نهاية 2027م"]},{"t":["31 Mar 2029","31 مارس 2029م"],"s":["registration (15 months)","التسجيل (15 شهراً)"]},{"t":["30 Jun 2029","30 يونيو 2029م"],"s":["FY2027 return (18 months)","إقرار 2027م (18 شهراً)"]},{"t":["31 Mar 2030","31 مارس 2030م"],"s":["FY2028 return (15 months)","إقرار 2028م (15 شهراً)"]}],"note":["Plus: tell ZATCA that the UPE files the GIR, and where.","إضافة إلى إخطار الهيئة بأن الكيان الأم النهائي يقدم إقرار المعلومات، وأين."]}]},{"t":["Testing a euro threshold in riyals","اختبار حد مقوم باليورو بالريال"],"facts":["For FY2028, a group's Saudi entities have three-year average DMT revenue of SAR 42m and average DMT income of SAR 4.6m. The ECB does not quote the riyal; assume the Saudi Central Bank's December 2027 average is €1 = SAR 4.40.","للسنة المالية 2028م، بلغ متوسط إيرادات كيانات مجموعة في المملكة لثلاث سنوات 42 مليون ريال، ومتوسط دخلها 4.6 ملايين ريال. ولا ينشر البنك المركزي الأوروبي سعراً للريال؛ افترض أن متوسط البنك المركزي السعودي لشهر ديسمبر 2027م هو اليورو = 4.40 ريال."],"steps":[{"t":["Average revenue in euros (below €10m):","متوسط الإيرادات باليورو (أقل من 10 ملايين):"],"x":"42000000/4.4","v":9545454.55,"u":"EUR"},{"t":["Average income in euros (above €1m):","متوسط الدخل باليورو (أعلى من مليون):"],"x":"4600000/4.4","v":1045454.55,"u":"EUR"}],"ans":["Revenue passes but income fails, so de minimis is not available for FY2028 and the full computation applies. At a rate of SAR 4.20 instead, income would be about €1.10m: still a fail. The conversion rule can decide close cases.","تجتاز الإيرادات ويخفق الدخل، فلا يتاح استثناء الحد الأدنى لعام 2028م ويلزم الاحتساب الكامل. ولو كان السعر 4.20 ريال لبلغ الدخل نحو 1.10 مليون يورو: وهو إخفاق أيضاً. فقاعدة التحويل قد تحسم الحالات المتقاربة."],"r":["98(2)","64(1)"],"p":["Revenue (€9.55m) passes, but income (€1.05m) fails: no de minimis for FY2028.","تجتاز الإيرادات (9.55 مليون يورو)، لكن الدخل (1.05 مليون يورو) يخفق: فلا حد أدنى لعام 2028م."],"diagrams":[{"type":"table","at":"answer","title":["The two tests at €1 = SAR 4.40","الاختباران عند اليورو = 4.40 ريال"],"head":[["Test","الاختبار"],["SAR average","المتوسط بالريال"],["In euros","باليورو"],["Line","الحد"] نظمة التعاون الاقتصادي والتنمية لبيانات الركيزة الثانية للمجموعة."]},{"t":["Qualifying competent authority agreement","اتفاق السلطة المختصة المؤهل"],"d":["An agreement between tax authorities to exchange the GIR.","اتفاق بين الجهات الضريبية لتبادل إقرار المعلومات."]},{"t":["Assessment","الربط"],"d":["ZATCA's own calculation of the tax due.","احتساب الهيئة للضريبة المستحقة."]}],"range":"89–102, 105–106"}]}</script>
<script type="application/json" id="law-data">[{"n":1,"part":1,"part_en":"Definitions","part_ar":"التعريفات","title_en":"Definitions","title_ar":"التعريفات","page":1,"text_en":"The following words and phrases, wherever mentioned in this Law, shall have the meanings set out against each of them unless the context requires otherwise: Law: Domestic Minimum Tax (\"DMT\") Law.\nRegulations: The implementing regulations of this Law.\nKingdom: The territory of the Kingdom of Saudi Arabia, including its land, territorial waters and airspace and the areas above them, areas beyond the territorial waters that the Kingdom exercises sovereignty on its waters, seabed, sub-soil and natural resources by virtue of its laws and the international law provisions.\nThe Authority: Zakat, Tax and Customs Authority.\nThe Board: The Board of Directors of the Authority.\nThe Governor: Governor of the Authority.\nTax Treaty: An agreement for the avoidance of double taxation with respect to taxes on income and on capital.\nQualifying Competent Authority Agreement: A bilateral or multilateral agreement or arrangement between Competent Authorities that provides for the automatic exchange of annual GloBE Information Returns.\nAnnual Election: An election made by a Filing Constituent Entity and that applies only for the Fiscal Year for which the election is made.\nFive-Year Election: An election made by a Filing Constituent Entity with respect to a Fiscal Year (the Fiscal Year in which the election is made) that cannot be revoked with respect to that year or the four succeeding Fiscal Years. If a Five-Year Election is revoked with respect to a Fiscal Year (the revocation year), a new election cannot be made with respect to the four Fiscal Years succeeding the revocation year unless specific provisions of this Law or the Regulations stipulate for other rules on revocation.\nReal Estate Investment Vehicle: A widely held Entity that predominantly holds immovable property, and is subject to a tax regime designed to:\n(a) achieve a single level of taxation on the income, gains or profits of the Entity, either at the level of the Entity or at the level of its interest holders, and\n(b) allow the deferral of taxation of no more than one year from the end of the accounting period in which the income, profits or gains arise.\nAuthorised Accounting Body: The body with legal authority in a jurisdiction to prescribe, establish, or accept accounting standards for financial reporting purposes.\nMinimum Rate: Fifteen percent (15%).\nOther Comprehensive Income: Items of income and expense that are not recognised in profit or loss as required or permitted by the Authorised Financial Accounting Standard used in the Consolidated Financial Statements. Other Comprehensive Income is usually reported as an adjustment to equity in the statement of financial position (balance sheet).\nTransition Year: The first Fiscal Year that the MNE Group comes within the scope of this Law.\nFiscal Year: As defined in ARTICLE (93) of this Law.\nReporting Fiscal Year: Fiscal Year that is the subject of the Domestic Top-up Tax Return, or GloBE Information Return.\nJoint Venture Subsidiary: An Entity whose assets, liabilities, income, expenses, and cash flows are consolidated by a Joint Venture under an Acceptable Financial Accounting Standard or would have been required had it been required to consolidate such items in accordance with an Acceptable Financial Accounting Standard. A Permanent Establishment whose Main Entity is the Joint Venture, or a Joint Venture Subsidiary, shall be treated as a separate Joint Venture Subsidiary.\nQualified Domestic Minimum Top-up Tax (“QDMTT”): A minimum tax that is included in the domestic law of a jurisdiction and that:\n(a) determines the Excess Profits of the Constituent Entities located in the jurisdiction (domestic Excess Profits) in a manner that is equivalent to the GloBE Rules;\n(b) operates to increase domestic tax liability with respect to domestic Excess Profits to the Minimum Rate for the jurisdiction and Constituent Entities for a Fiscal Year; and\n(c) is implemented and administered in a way that is consistent with the outcomes provided for under the GloBE Rules and the Commentary, provided that such jurisdiction does not provide any benefits that are related to such rules.\nDomestic Top-up Tax: Tax imposed in accordance with the provisions of this Law.\nConstituent Entity-owner: A Constituent Entity that directly or indirectly owns an Ownership Interest in another Constituent Entity of the same MNE Group.\nFiling Constituent Entity: An Entity filing the Domestic Top-up Tax Return or GloBE Information Return in accordance with ARTICLE (94) of this Law.\nMain Entity: In respect of a Permanent Establishment, is the Entity that includes the Financial Accounting Net Income or Loss of the Permanent Establishment in its financial statements.\nFlow-through Entity: An Entity is a Flow-through Entity to the extent it is fiscally transparent with respect to its income, expenditure, profit, or loss in the jurisdiction where it was created unless it is tax resident and subject to a Covered Tax on its income or profit in another jurisdiction. A fiscally transparent treatment means that a jurisdiction treats the income, expenditure, profit, or loss of an entity as if it were derived or incurred by the direct owner of that entity in proportion to its interest in that entity.\nTax Transparent Entity: A Flow-through Entity is a Tax Transparent Entity with respect to its income, expenditure, profit or loss, to the extent the Reference Entity’s jurisdiction treats the tested Entity, and each Entity through which the Reference Entity owns an Ownership Interest in the tested Entity, as fiscally transparent.\nReference Entity: Constituent Entity-owner that is closest in the ownership chain to the tested Entity and that is either (a) not a Flow-through Entity or (b) where there is no such Constituent Entityowner, a Flow-through Entity that is the Ultimate Parent Entity of the MNE Group (Flow-through UPE).\nGroup Entity: In respect of any Entity or Group, means an Entity that is a member of the same Group.\nEntity: Any legal person, or an arrangement that prepares separate financial accounts, such as a partnership or trust. The term Entity shall not include central, state, or local government or their administration or agencies that carry out government functions.\nAuthorised Financial Accounting Standard: A set of generally accepted accounting principles permitted by an Authorised Accounting Body in the jurisdiction where an Entity is located.\nAcceptable Financial Accounting Standard: International Financial Reporting Standards (\"IFRS\") and the generally accepted accounting principles of Australia, Brazil, Canada, Member States of the European Union, Member States of the European Economic Area, Hong Kong (China), Japan, Mexico, New Zealand, the People’s Republic of China, the Republic of India, the Republic of Korea, Russia, Singapore, Switzerland, the United Kingdom, and the United States of America.\nTaxpayer: Any Constituent Entity - including a Stateless Constituent Entity created in the Kingdom, or any Entity considered to be a Constituent Entity pursuant to the provisions of this Law - or a Joint Venture and its JV Subsidiaries, provided they are within the scope of this Law.\nUPE Jurisdiction: The jurisdiction where the Ultimate Parent Entity is located.\nPortfolio Shareholding: Ownership Interests in an Entity that are held by the MNE Group and that carry rights to less than ten percent (10%) of the profits, capital, reserves, or voting rights of that Entity at the date of the distribution or disposition.\nOwnership Interest: Any equity interest that carries rights to the profits, capital or reserves of an Entity, including the profits, capital or reserves of a Main Entity’s Permanent Establishment(s).\nDMT Losses of all Constituent Entities: The sum of the DMT Losses of all relevant Constituent Entities located in the Kingdom determined in accordance with the provisions of Part Three (3) of this Law for the Fiscal Year.\nDMT Income of all Constituent Entities: The sum of the DMT Income of all relevant Constituent Entities located in the Kingdom determined in accordance with the provisions of Part Three (3) of this Law for the Fiscal Year.\nNet DMT Loss: The nil or negative amount, if any, computed by deducting DMT Losses of all Constituent Entities from DMT Income of all Constituent Entities.\nQualified Imputation Tax: A Covered Tax accrued or paid by a Constituent Entity that is refundable or creditable to the beneficial owner of a dividend distributed by such Constituent Entity (or, in the case of a Covered Tax accrued or paid by a Permanent Establishment, a dividend distributed by the Main Entity) to the extent that the refund is payable, or the credit is provided:\n(a) By a jurisdiction other than the jurisdiction which imposed the Covered Taxes under a foreign tax credit regime;\n(b) To a beneficial owner of the dividend that is subject to tax at a nominal rate that equals or exceeds the Minimum Rate on the dividend on a current basis under the domestic law of the jurisdiction which imposed the Covered Taxes on the Constituent Entity;\n(c) To an individual beneficial owner of the dividend who is tax resident in the jurisdiction which imposed the Covered Taxes on the Constituent Entity and who is subject to tax on the dividends as ordinary income; or\n(d) To a Governmental Entity, an International Organisation, a resident Non-profit Organisation, a resident Pension Fund, a resident Investment Entity that is not a Group Entity, or a resident life insurance company to the extent that the dividends are received in connection with a pension fund business and subject to tax in a similar manner as a dividend received by Pension Fund. For the purposes of paragraph (d) above, a Non-Profit Organisation or Pension Fund is resident in a jurisdiction if it is created and managed in that jurisdiction, and an Investment Entity is resident in a jurisdiction if it is created and regulated in the jurisdiction. A life insurance company is resident in the jurisdiction in which it is located.\nQualified UTPR: A set of rules equivalent to the relevant Articles of the GloBE Rules, including any provisions of the GloBE Rules associated with those articles, that are included in the domestic law of a jurisdiction and that are implemented and administered in a way that is consistent with the outcomes provided for under the GloBE Rules and the Commentary provided that such jurisdiction does not provide any benefits that are related to such rules.\nQualified IIR: A set of rules equivalent to the relevant Articles of the GloBE Rules, including any provisions of the GloBE Rules associated with those articles, that are included in the domestic law of a jurisdiction and that are implemented and administered in a way that is consistent with the outcomes provided for under the GloBE Rules and the Commentary, provided that such jurisdiction does not provide any benefits that are related to such rules.\nIncome Inclusion Rule (\"IIR\"): The rules included in the domestic law of a jurisdiction under which the minimum tax is paid at the level of a parent entity, in proportion to its ownership interests in those entities that have low taxed income and implemented and administered in a way that is aligned with relevant provisions set out in the GloBE Rules.\nGloBE Rules: Set of rules issued by the OECD/G20 Inclusive Framework on Base Erosion and Profit Shifting in December 2021, as amended.\nInsurance Investment Entity: An Entity that would meet the definition of an Investment Fund or a Real Estate Investment Vehicle with the exception that it is established specifically in relation to liabilities under an insurance or annuity contract and is wholly owned by an Entity that is subject to regulation as an insurance company in the jurisdictio
