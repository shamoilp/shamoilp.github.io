افي مكاسب الصرف الأجنبي"],["Decommissioning and remediation expenses","مصاريف إيقاف التشغيل والإصلاح البيئي"],["A deferred tax liability from an uncertain tax position","التزام ضريبي مؤجل من مركز ضريبي غير مؤكد"]],"a":3,"e":["An uncertain tax position is a disallowed accrual (Art 51), left out altogether; the others are in Article 50.","المركز الضريبي غير المؤكد استحقاق غير مسموح به (المادة 51) ويُستبعد كلياً؛ والبقية في المادة 50."],"r":[50,51]},{"q":["What is a disallowed accrual?","ما الاستحقاق غير المسموح به؟"],"o":[["Any accrual over SAR 1m","أي استحقاق يزيد على مليون ريال"],["A deferred tax movement relating to an uncertain tax position or to distributions from a constituent entity","حركة في الضريبة المؤجلة تتعلق بمركز ضريبي غير مؤكد أو بتوزيعات من كيان تابع"],["Any accrual the auditor rejects","أي استحقاق يرفضه المراجع"],["Zakat payable","الزكاة المستحقة"]],"a":1,"e":["Article 51.","المادة 51."],"r":[51]},{"q":["What is an unclaimed accrual?","ما الاستحقاق غير المطالب به؟"],"o":[["A liability increase not expected to be paid within the five-year window that the filing entity elects each year to leave out","زيادة في التزام لا يُتوقع سدادها خلال فترة السنوات الخمس ويختار الكيان المقدم للإقرار سنوياً عدم إدراجها"],["A refund not yet claimed","استرداد لم يُطالب به بعد"],["A tax credit not used","ائتمان ضريبي غير مستخدم"],["An unpaid fine","غرامة غير مسددة"]],"a":0,"e":["Article 49(8).","المادة 49 (8)."],"r":["49(8)"]},{"q":["At transition, at what rate are deferred tax assets and liabilities brought in?","عند الانتقال، بأي معدل تُدخل الأصول والالتزامات الضريبية المؤجلة؟"],"o":[["Always 20%","20% دائماً"],["The lower of 15% and the applicable domestic rate","الأقل من 15% والمعدل المحلي المطبق"],["The higher of the two","الأعلى منهما"],["Zero","صفر"]],"a":1,"e":["Article 103(2)(a).","المادة 103 (2) (أ)."],"r":["103(2)"]},{"q":["At transition, a deferred tax asset arose in 2023 from an item excluded from DMT income. What happens?","عند الانتقال، نشأ أصل ضريبي مؤجل في 2023م من بند مستبعد من الدخل. ماذا يحدث؟"],"o":[["It is brought in at 15%","يُدخل بنسبة 15%"],["It is excluded, because it was generated in a transaction after 30 November 2021","يُستبعد لأنه نشأ في معاملة بعد 30 نوفمبر 2021م"],["It is brought in at 20%","يُدخل بنسبة 20%"],["It is refunded","يُسترد نقداً"]],"a":1,"e":["Article 103(3).","المادة 103 (3)."],"r":["103(3)"]},{"q":["A plant was sold between two group companies in 2024. At transition, what is the buyer's basis?","بيع مصنع بين شركتين في المجموعة في 2024م. عند الانتقال، ما أساس المشتري؟"],"o":[["The price paid","السعر المدفوع"],["The seller's carrying value at disposal","القيمة الدفترية لدى البائع عند التصرف"],["Market value at transition","القيمة السوقية عند الانتقال"],["Zero","صفر"]],"a":1,"e":["Article 103(4) covers transfers after 30 November 2021 and before the transition year.","تغطي المادة 103 (4) النقل بعد 30 نوفمبر 2021م وقبل سنة الانتقال."],"r":["103(4)"]}],"cards":[{"f":["Total deferred tax adjustment","إجمالي تعديل الضريبة المؤجلة"],"b":["Deferred tax expense for covered taxes: as booked if at 15% or less, recast at 15% if higher.","مصروف الضريبة المؤجلة للضرائب المشمولة: كما قُيد إن كان بنسبة 15% أو أقل، ويُعاد احتسابه بنسبة 15% إن زاد."],"r":["49(1)","49(2)"]},{"f":["Five exclusions","خمسة استثناءات"],"b":["Excluded items; disallowed and unclaimed accruals; valuation and recognition adjustments; rate remeasurement; tax credits.","البنود المستبعدة؛ والاستحقاقات غير المسموح بها وغير المطالب بها؛ وتعديلات التقييم والإثبات؛ وإعادة القياس لتغير المعدل؛ والائتمانات الضريبية."],"r":["49(3)"]},{"f":["Loss asset uplift","رفع أصل الخسائر"],"b":["A deferred tax asset below 15% may be taken at 15% if attributable to a DMT loss.","يجوز أخذ الأصل الضريبي المؤجل المقيد بأقل من 15% بنسبة 15% إذا كان منسوباً إلى خسارة لأغراض النظام."],"r":["49(4)"]},{"f":["Recapture rule","قاعدة الاسترداد"],"b":["Liability not reversed by the end of the fifth following year: reduce that year's covered taxes and recalculate.","التزام لم ينعكس بنهاية السنة الخامسة التالية: تُخفض ضرائب تلك السنة ويُعاد الاحتساب."],"r":["49(5)","49(6)","49(7)"]},{"f":["Recapture exceptions (1)","الاستثناءات من الاسترداد (1)"],"b":["Tangible asset cost recovery; government licences with significant tangible investment; research and development.","استرداد تكلفة الأصول الملموسة؛ والتراخيص الحكومية ذات الاستثمار الملموس الكبير؛ والبحث والتطوير."],"r":["50"]},{"f":["Recapture exceptions (2)","الاستثناءات من الاسترداد (2)"],"b":["Decommissioning and remediation; fair value and FX net gains; insurance reserves; reinvested local tangible gains; related accounting changes.","إيقاف التشغيل والإصلاح؛ وصافي مكاسب القيمة العادلة والصرف؛ واحتياطيات التأمين؛ والمكاسب الملموسة المحلية المعاد استثمارها؛ والتغييرات المحاسبية المرتبطة."],"r":["50"]},{"f":["Disallowed accrual","الاستحقاق غير المسموح به"],"b":["Deferred tax on uncertain tax positions or on distributions from a constituent entity.","الضريبة المؤجلة على المراكز الضريبية غير المؤكدة أو على التوزيعات من كيان تابع."],"r":[51]},{"f":["Unclaimed accrual","الاستحقاق غير المطالب به"],"b":["Liability increase not expected to be paid within five years, left out by annual election.","زيادة في الالتزام لا يُتوقع سدادها خلال خمس سنوات، تُستبعد باختيار سنوي."],"r":["49(8)"]},{"f":["Rate cut below 15%","خفض المعدل إلى أقل من 15%"],"b":["The resulting deferred tax expense adjusts earlier years' covered taxes.","يعدّل مصروف الضريبة المؤجلة الناتج الضرائب المشمولة للسنوات السابقة."],"r":["52(6)"]},{"f":["Rate increase","زيادة المعدل"],"b":["Deferred tax expense from the increase adjusts earlier years when paid, capped at the 15% amount.","يعدّل مصروف الضريبة المؤجلة الناتج عن الزيادة السنوات السابقة عند سداده، بحد أقصى مبلغ الـ15%."],"r":["52(7)"]},{"f":["Transition attributes","السمات الضريبية عند الانتقال"],"b":["All deferred tax in the Saudi accounts, at the lower of 15% and the domestic rate; valuation allowances ignored.","جميع الضرائب المؤجلة في حسابات المملكة، بالأقل من 15% والمعدل المحلي؛ مع تجاهل مخصصات التقييم."],"r":["103(1)","103(2)"]},{"f":["30 November 2021","30 نوفمبر 2021م"],"b":["Cut-off for ignoring excluded-item assets and for carrying over the seller's basis on intra-group transfers.","التاريخ الفاصل لتجاهل أصول البنود المستبعدة ولنقل أساس البائع في عمليات النقل داخل المجموعة."],"r":["103(3)","103(4)"]}],"range":"49–51, 103"},{"id":10,"title":["The Kingdom's ETR and the top-up tax","معدل المملكة الفعلي والضريبة التكميلية"],"goal":["Blend the Saudi entities into one ETR, turn any shortfall into domestic top-up tax, allocate it to entities, and handle recalculations, negative covered taxes and minority-owned entities.","مزج الكيانات في المملكة في معدل فعلي واحد، وتحويل أي نقص إلى ضريبة تكميلية محلية، وتخصيصها على الكيانات، ومعالجة إعادة الاحتساب والضرائب المشمولة السالبة والكيانات ذات الملكية الأقلية."],"parts":[5],"arts":[53,54,55,56,57,63,65],"time":40,"metaphor":{"title":["One pot, one thermometer","قدرٌ واحد وميزان حرارة واحد"],"text":["Every Saudi entity pours its income and its taxes into one pot, and you take the temperature once: that is the Kingdom's ETR. If it reads below 15, you add heat only to the part that is not routine substance (the excess profit). Then the bill is served to each entity in proportion to the income it put in; an entity that put in a loss pays nothing.\nA few pots are kept on a separate stove: investment entities, minority-owned entities and stateless entities.","يصبّ كل كيان في المملكة دخله وضرائبه في قدر واحد، وتُقاس الحرارة مرة واحدة: هذا هو معدل المملكة الفعلي. فإن قلّ عن 15 تُضاف الحرارة إلى الجزء الذي لا يمثل الجوهر الاعتيادي فقط (الربح الزائد). ثم تُوزع الفاتورة على كل كيان بنسبة الدخل الذي أسهم به؛ أما الكيان الذي أسهم بخسارة فلا يدفع شيئاً.\nوبعض القدور تُطهى على موقد مستقل: كيانات الاستثمار، والكيانات ذات الملكية الأقلية، والكيانات عديمة الجنسية."]},"anchors":[{"if":["One Saudi entity is low-taxed and another is high-taxed","كيان في المملكة منخفض الضريبة وآخر مرتفعها"],"then":["Blend them: there is one ETR for the Kingdom (Art 53(2))","امزجهما: للمملكة معدل فعلي واحد (المادة 53 (2))"]},{"if":["The blended ETR is below 15%","المعدل الممزوج أقل من 15%"],"then":["Top-up % × (net DMT income − SBIE), plus any additional current top-up tax (Arts 54–56)","نسبة الضريبة التكميلية × (صافي الدخل − الاستبعاد على أساس الجوهر)، مع أي ضريبة تكميلية حالية إضافية (المواد 54–56)"]},{"if":["The Kingdom's top-up tax must be split among entities","يجب توزيع الضريبة التكميلية للمملكة على الكيانات"],"then":["Share it by DMT income among the entities that have income (Art 57(1))","وزّعها بحسب الدخل على الكيانات التي لديها دخل (المادة 57 (1))"]},{"if":["An earlier year is reopened by an ETR adjustment article","أُعيد فتح سنة سابقة بموجب إحدى مواد تعديل المعدل الفعلي"],"then":["Recalculate it; the extra top-up is additional current top-up tax this year (Art 63(1)–(2))","أعد احتسابها؛ والزيادة ضريبة تكميلية حالية إضافية هذه السنة (المادة 63 (1)–(2))"]},{"if":["The UPE owns 30% or less of a Saudi entity","يملك الكيان الأم النهائي 30% أو أقل من كيان في المملكة"],"then":["Compute it (or its minority-owned subgroup) separately from the rest (Art 65)","احسبه (أو مجموعته الفرعية ذات الملكية الأقلية) بمعزل عن البقية (المادة 65)"]}],"diagrams":[{"type":"formula","title":["The computation in six lines","الاحتساب في ستة أسطر"],"rows":[{"l":["Net DMT Income","صافي الدخل"],"r":["DMT income of the Saudi entities − their DMT losses (if positive) · Art 53(4)","دخل الكيانات في المملكة − خسائرها (إن كان موجباً) · المادة 53 (4)"]},{"l":["ETR","المعدل الفعلي"],"r":["Σ Adjusted Covered Taxes ÷ Net DMT Income · Art 53(2)","مجموع الضرائب المشمولة المعدلة ÷ صافي الدخل · المادة 53 (2)"]},{"l":["Top-up %","نسبة الضريبة التكميلية"],"r":["15% − ETR (if positive) · Art 54","15% − المعدل الفعلي (إن كان موجباً) · المادة 54"]},{"l":["Excess Profit","الربح الزائد"],"r":["Net DMT Income − SBIE (if positive) · Art 55","صافي الدخل − الاستبعاد على أساس الجوهر (إن كان موجباً) · المادة 55"]},{"l":["Domestic Top-up Tax","الضريبة التكميلية المحلية"],"r":["Top-up % × Excess Profit + Additional Current Top-up Tax · Art 56","النسبة × الربح الزائد + الضريبة التكميلية الحالية الإضافية · المادة 56"]},{"l":["Entity's share","حصة الكيان"],"r":["Kingdom top-up × entity's DMT income ÷ total DMT income of entities with income · Art 57","الضريبة التكميلية للمملكة × دخل الكيان ÷ إجمالي دخل الكيانات ذات الدخل · المادة 57"]}]},{"type":"tree","title":["Which pot does this entity go in?","في أي قدر يوضع هذا الكيان؟"],"root":{"q":["Is it an investment entity or insurance investment entity?","هل هو كيان استثمار أو كيان تأمين استثماري؟"],"yes":{"end":["Own ETR (Art 85), outside the Kingdom blend (Art 53(5))","معدل خاص (المادة 85)، خارج مزيج المملكة (المادة 53 (5))"],"tone":"out"},"no":{"q":["Does the UPE hold 30% or less of it?","هل يملك الكيان الأم النهائي 30% أو أقل منه؟"],"yes":{"end":["Minority-owned: separate computation, as a subgroup or alone (Art 65)","ملكية أقلية: احتساب مستقل، كمجموعة فرعية أو منفرداً (المادة 65)"],"tone":"out"},"no":{"q":["Is it a stateless constituent entity?","هل هو كيان تابع عديم الجنسية؟"],"yes":{"end":["A single entity in a separate jurisdiction (Art 53(3))","كيان منفرد في ولاية مستقلة (المادة 53 (3))"],"tone":"out"},"no":{"end":["Into the Kingdom's single blended ETR","يدخل في معدل المملكة الممزوج الواحد"],"tone":"in"}}}}}],"points":[{"h":["One blended ETR for the Kingdom","معدل ممزوج واحد للمملكة"],"t":["The ETR is calculated every year for the Kingdom as a whole: the Adjusted Covered Taxes of all Saudi constituent entities divided by the Kingdom's net DMT income.","يُحتسب المعدل الفعلي كل سنة للمملكة ككل: مجموع الضرائب المشمولة المعدلة لجميع الكيانات التابعة في المملكة مقسوماً على صافي دخل المملكة."],"r":["53(1)","53(2)"]},{"h":["Net DMT income","صافي الدخل"],"t":["Net DMT income is the DMT income of all Saudi constituent entities minus their DMT losses, if the result is positive. If it is not, there is no ETR for the year, but Article 63(3) can still bite.","صافي الدخل هو دخل جميع الكيانات التابعة في المملكة ناقصاً خسائرها، إن كانت النتيجة موجبة. وإن لم تكن، فلا معدل فعلي للسنة، لكن المادة 63 (3) قد تنطبق مع ذلك."],"r":["53(4)","63(3)"]},{"h":["Entities kept out of the blend","كيانات تُبقى خارج المزيج"],"t":["Investment entities and insurance investment entities are left out of the Kingdom's ETR and net DMT income; each stateless entity is treated as a single entity in a separate jurisdiction; minority-owned entities are computed separately.","تُستبعد كيانات الاستثمار وكيانات التأمين الاستثماري من معدل المملكة وصافي دخلها؛ ويُعامل كل كيان عديم الجنسية ككيان منفرد في ولاية مستقلة؛ وتُحتسب الكيانات ذات الملكية الأقلية بشكل مستقل."],"r":["53(3)","53(5)",65]},{"h":["Top-up percentage and excess profit","نسبة الضريبة التكميلية والربح الزائد"],"t":["The top-up percentage is 15% minus the ETR, if positive. Excess profit is net DMT income minus the substance-based income exclusion of the Saudi entities, if positive.","نسبة الضريبة التكميلية هي 15% ناقصاً المعدل الفعلي، إن كانت موجبة. والربح الزائد هو صافي الدخل ناقصاً الاستبعاد على أساس جوهر النشاط للكيانات في المملكة، إن كان موجباً."],"r":[54,55]},{"h":["Domestic top-up tax","الضريبة التكميلية المحلية"],"t":["The Kingdom's domestic top-up tax is the top-up percentage times excess profit, plus any additional current top-up tax for the year.","الضريبة التكميلية المحلية للمملكة هي نسبة الضريبة التكميلية مضروبة في الربح الزائد، مضافاً إليها أي ضريبة تكميلية حالية إضافية للسنة."],"r":[56]},{"h":["Who carries it","من يتحملها"],"t":["Each Saudi entity with DMT income takes a share in proportion to its DMT income over the total DMT income of the Saudi entities. Loss-making entities take none. If the top-up comes from a recalculation and the current year has no net income, the split follows the DMT income of the recalculated years.","يتحمل كل كيان في المملكة لديه دخل حصةً بنسبة دخله إلى إجمالي دخل الكيانات في المملكة، ولا يتحمل الكيان الخاسر شيئاً. وإذا نشأت الضريبة عن إعادة احتساب ولم يكن في السنة الحالية صافي دخل، فيتبع التوزيع دخل السنوات المعاد احتسابها."],"r":["57(1)","57(2)"]},{"h":["Additional current top-up tax","الضريبة التكميلية الحالية الإضافية"],"t":["When an ETR adjustment article reopens an earlier year (Art 34, Art 49(5)–(7), Art 52(1)–(5) or Art 52(8)), that year's ETR and top-up are recalculated, and the increase is charged as additional current top-up tax in the current year.","عندما تعيد إحدى مواد تعديل المعدل الفعلي فتح سنة سابقة (المادة 34، والمادة 49 (5)–(7)، والمادة 52 (1)–(5) أو 52 (8))، يُعاد احتساب معدل تلك السنة وضريبتها التكميلية، وتُحمّل الزيادة كضريبة تكميلية حالية إضافية في السنة الحالية."],"r":["63(1)","63(2)","63(7)"]},{"h":["Negative covered taxes in a year without net income","الضرائب المشمولة السالبة في سنة بلا صافي دخل"],"t":["If the Kingdom has no net DMT income and its Adjusted Covered Taxes are negative and below expected covered taxes (15% of the net DMT loss), the difference is additional current top-up tax, allocated to entities whose covered taxes are below 15% of their own result.","إذا لم يكن للمملكة صافي دخل وكانت ضرائبها المشمولة المعدلة سالبة وأقل من الضرائب المتوقعة (15% من صافي الخسارة)، فالفرق ضريبة تكميلية حالية إضافية، تُخصص على الكيانات التي تقل ضرائبها المشمولة عن 15% من نتيجتها."],"r":["63(3)","63(4)","63(6)"]},{"h":["Minority-owned entities","الكيانات ذات الملكية الأقلية"],"t":["A minority-owned constituent entity is one in which the UPE has a direct or indirect interest of 30% or less. A minority-owned subgroup is computed as if it were a separate MNE group; a standalone minority-owned entity is computed on its own. Both are left out of the rest of the group's ETR.","الكيان التابع ذو الملكية الأقلية هو الذي تكون حصة الكيان الأم النهائي فيه، مباشرة أو غير مباشرة، 30% أو أقل. وتُحتسب المجموعة الفرعية ذات الملكية الأقلية كأنها مجموعة متعددة الجنسيات مستقلة، ويُحتسب الكيان المنفرد وحده. ويُستبعد كلاهما من معدل بقية المجموعة."],"r":["65(1)","65(2)","65(3)","65(4)"]}],"oecd":[{"t":["Articles 53 to 57 mirror GloBE Articles 5.1 and 5.2, Article 63 mirrors 5.4 and Article 65 mirrors 5.6. The output differs: GloBE's jurisdictional top-up tax is collected from parents through the IIR or UTPR and is reduced by any QDMTT payable; here the tax is the QDMTT, charged directly to the Saudi entities.","تقابل المواد من 53 إلى 57 المادتين 5.1 و5.2 من القواعد النموذجية، وتقابل المادة 63 المادة 5.4، والمادة 65 المادة 5.6. والفرق في المخرجات: فالضريبة التكميلية للولاية في القواعد العالمية تُحصّل من الكيانات الأم عبر قاعدة تضمين الدخل أو قاعدة الأرباح الخاضعة لمعدل منخفض وتُخفض بأي ضريبة تكميلية محلية مؤهلة مستحقة؛ أما هنا فالضريبة هي نفسها الضريبة المحلية المؤهلة، وتُفرض مباشرة على الكيانات في المملكة."],"src":["Model Rules Arts 5.1, 5.2, 5.4, 5.6","القواعد النموذجية: المواد 5.1 و5.2 و5.4 و5.6"]},{"t":["KSA angle: blending puts Zakat payers and 20% income tax payers in one pot. Zakat is about 2.5% of a base built mainly from the balance sheet, not profit, so a profitable Zakat-only entity can sit far below 15% on its own, while income tax payers lift the Kingdom's average.","من منظور المملكة: يضع المزج دافعي الزكاة ودافعي ضريبة الدخل بنسبة 20% في قدر واحد. والزكاة نحو 2.5% من وعاء يُبنى أساساً من الميزانية لا من الربح، لذا قد يقع الكيان الرابح الخاضع للزكاة وحدها دون 15% بكثير منفرداً، بينما يرفع دافعو ضريبة الدخل متوسط المملكة."],"src":["Zakat Regulations 2024; Income Tax Law Art 7(a)","اللائحة التنفيذية لجباية الزكاة 2024م؛ نظام ضريبة الدخل م 7 (أ)"]}],"reflect":{"ref":["Al-Baqarah 2:286","البقرة: 286"],"ayah":"لا يكلف الله نفسا إلا وسعها","t":["Allah does not burden a soul beyond its capacity. The allocation rule has the same shape: those that earned more carry more, and the entity that made a loss carries nothing. When you split a liability, follow capacity, not convenience.","لا يكلف الله نفساً إلا وسعها. وقاعدة التخصيص على الشكل نفسه: من كسب أكثر حمل أكثر، والكيان الخاسر لا يحمل شيئاً. فإذا وزعت التزاماً فاتبع القدرة لا السهولة."]},"cases":[{"t":["Three Saudi entities, one ETR","ثلاثة كيانات في المملكة ومعدل واحد"],"facts":["FY2027, Saudi constituent entities of an in-scope group:\n• A (income tax payer): DMT income SAR 300m, Adjusted Covered Taxes SAR 48m\n• B (Zakat payer): DMT income SAR 200m, Adjusted Covered Taxes SAR 6m\n• C: DMT loss SAR 50m, no covered taxes\nSubstance-based income exclusion for the Kingdom: SAR 90m.","السنة المالية 2027م، الكيانات التابعة في المملكة لمجموعة خاضعة للنظام:\n• (أ) (تدفع ضريبة الدخل): الدخل 300 مليون ريال، والضرائب المشمولة المعدلة 48 مليون ريال\n• (ب) (تدفع الزكاة): الدخل 200 مليون ريال، والضرائب المشمولة المعدلة 6 ملايين ريال\n• (ج): خسارة 50 مليون ريال، ولا ضرائب مشمولة\nالاستبعاد على أساس جوهر النشاط للمملكة: 90 مليون ريال."],"steps":[{"t":["Net DMT income of the Kingdom:","صافي دخل المملكة:"],"x":"300000000+200000000-50000000","v":450000000,"u":"SAR"},{"t":["Blended ETR:","المعدل الممزوج:"],"x":"(48000000+6000000)/450000000*100","v":12,"u":"%"},{"t":["Top-up percentage:","نسبة الضريبة التكميلية:"],"x":"15-12","v":3,"u":"%"},{"t":["Excess profit:","الربح الزائد:"],"x":"450000000-90000000","v":360000000,"u":"SAR"},{"t":["Domestic top-up tax for the Kingdom:","الضريبة التكميلية المحلية للمملكة:"],"x":"3/100*360000000","v":10800000,"u":"SAR"},{"t":["A's share (300 of 500 of DMT income):","حصة (أ) (300 من 500 من الدخل):"],"x":"10800000*300000000/(300000000+200000000)","v":6480000,"u":"SAR"},{"t":["B's share (200 of 500):","حصة (ب) (200 من 500):"],"x":"10800000*200000000/(300000000+200000000)","v":4320000,"u":"SAR"}],"ans":["The Kingdom owes SAR 10.8m: A SAR 6.48m, B SAR 4.32m, C nothing. On its own B's ETR is only 3%; blending with A lifts it, but B still carries a share of the top-up by income.","على المملكة 10.8 ملايين ريال: (أ) 6.48 ملايين، و(ب) 4.32 ملايين، و(ج) لا شيء. ومعدل (ب) منفرداً 3% فقط؛ والمزج مع (أ) يرفعه، لكن (ب) يتحمل مع ذلك حصة من الضريبة بحسب الدخل."],"r":["53(2)","53(4)",54,55,56,"57(1)"]},{"t":["Negative covered taxes in a loss year","ضرائب مشمولة سالبة في سنة خ  ملايين ريال، والاستبعاد 10 ملايين ريال"],"steps":[{"t":["X's ETR, without the subgroup: no top-up","معدل (س) دون المجموعة الفرعية: لا ضريبة تكميلية"],"x":"90000000/500000000*100","v":18,"u":"%"},{"t":["M and N form a minority-owned subgroup (UPE interest 25%). Their ETR:","تشكل (م) و(ن) مجموعة فرعية ذات ملكية أقلية (حصة الكيان الأم 25%). معدلهما:"],"x":"5000000/100000000*100","v":5,"u":"%"},{"t":["Subgroup top-up tax:","الضريبة التكميلية للمجموعة الفرعية:"],"x":"(15-5)/100*(100000000-10000000)","v":9000000,"u":"SAR"},{"t":["For comparison, a blended ETR would have been about:","للمقارنة، كان المعدل الممزوج سيبلغ نحو:"],"x":"(90000000+5000000)/600000000*100","v":15.83,"u":"%"}],"ans":["The subgroup pays SAR 9m on its own. Blended with X it would have paid nothing, which is exactly what Article 65 prevents.","تدفع المجموعة الفرعية 9 ملايين ريال منفردة. ولو مُزجت مع (س) لما دفعت شيئاً، وهذا بالضبط ما تمنعه المادة 65."],"r":["65(1)","65(3)","65(4)"]}],"quiz":[{"q":["How is the Kingdom's ETR calculated?","كيف يُحتسب معدل المملكة الفعلي؟"],"o":[["Entity by entity","لكل كيان على حدة"],["Σ Adjusted Covered Taxes of all Saudi constituent entities ÷ the Kingdom's net DMT income","مجموع الضرائب المشمولة المعدلة لجميع الكيانات التابعة في المملكة ÷ صافي دخل المملكة"],["Tax paid ÷ revenue","الضريبة المسددة ÷ الإيرادات"],["Group-wide, all countries together","على مستوى المجموعة، لكل الدول معاً"]],"a":1,"e":["Article 53(2).","المادة 53 (2)."],"r":["53(2)"]},{"q":["What is the Kingdom's net DMT income?","ما صافي دخل المملكة؟"],"o":[["Profit before tax of the Saudi entities","الربح قبل الضريبة للكيانات في المملكة"],["DMT income of all Saudi constituent entities minus their DMT losses, if positive","دخل جميع الكيانات التابعة في المملكة ناقصاً خسائرها، إن كان موجباً"],["Taxable income per ZATCA returns","الدخل الخاضع للضريبة في إقرارات الهيئة"],["Group consolidated profit","الربح الموحد للمجموعة"]],"a":1,"e":["Article 53(4).","المادة 53 (4)."],"r":["53(4)"]},{"q":["Whose figures are l :["A Saudi entity has a DMT loss this year. What share of the Kingdom's top-up tax does it take?","كيان في المملكة لديه خسارة هذه السنة. ما حصته من الضريبة التكميلية للمملكة؟"],"o":[["None","لا شيء"],["An equal share","حصة متساوية"],["Its loss × 15%","خسارته × 15%"],["All of it","كلها"]],"a":0,"e":["Article 57(1) allocates only to entities with DMT income, though joint liability under Article 73 still applies.","تخصص المادة 57 (1) على الكيانات ذات الدخل فقط، مع بقاء المسؤولية التضامنية بموجب المادة 73."],"r":["57(1)",73]},{"q":["A post-filing decrease reopens FY2027. What is the extra top-up called, and when is it charged?","أعاد تخفيض لاحق للإقرار فتح 2027م. ما اسم الزيادة في الضريبة، ومتى تُحمّل؟"],"o":[["A penalty, in FY2027","غرامة، في 2027م"],["Additional current top-up tax, in the current year","ضريبة تكميلية حالية إضافية، في السنة الحالية"],["Deferred top-up tax, in five years","ضريبة تكميلية مؤجلة، بعد خمس سنوات"],["Nothing is charged","لا يُحمّل شيء"]],"a":1,"e":["Article 63(2).","المادة 63 (2)."],"r":["63(2)"]},{"q":["Which provisions are 'ETR adjustment articles'?","ما «مواد تعديل المعدل الفعلي»؟"],"o":[["Articles 53 to 57","المواد من 53 إلى 57"],["Article 34, Article 49(5)–(7), Article 52(1)–(5) and Article 52(8)","المادة 34، والمادة 49 (5)–(7)، والمادة 52 (1)–(5)، والمادة 52 (8)"],["Articles 66 to 72","المواد من 66 إلى 72"],["Only Article 63","المادة 63 فقط"]],"a":1,"e":["Article 63(7).","المادة 63 (7)."],"r":["63(7)"]},{"q":["No net DMT income; covered taxes are −SAR 10m; expected covered taxes are −SAR 6m. What arises?","لا صافي دخل؛ والضرائب المشمولة سالب 10 ملايين ريال؛ والمتوقعة سالب 6 ملايين ريال. ماذا ينشأ؟"],"o":[["Nothing","لا شيء"],["SAR 4m of additional current top-up tax, unless the excess negative tax expense election is made","ضريبة تكميلية حالية إضافية قدرها 4 ملايين ريال، ما لم يُجرَ اختيار المصروف الضريبي السالب الزائد"],["A SAR 10m refund","استرداد 10 ملايين ريال"],["SAR 16m of top-up tax","ضريبة تكميلية قدرها 16 مليون ريال"]],"a":1,"e":["Article 63(3)–(4); the alternative is the carry-forward under Articles 44(2) and 47(4).","المادة 63 (3)–(4)؛ والبديل هو الترحيل بموجب المادتين 44 (2) و47 (4)."],"r":["63(3)","63(4)","44(2)"]},{"q":["When is a Saudi entity a minority-owned constituent entity?","متى يكون الكيان في المملكة كياناً تابعاً ذا ملكية أقلية؟"],"o":[["When minority shareholders sit on its board","عندما يكون للمساهمين الأقلية مقاعد في مجلسه"],["When the UPE's direct or indirect interest in it is 30% or less","عندما تكون حصة الكيان الأم النهائي فيه، مباشرة أو غير مباشرة، 30% أو أقل"],["When it is listed","عندما يكون مدرجاً"],["When it is less than 50% owned by Saudis","عندما يملك السعوديون أقل من 50% منه"]],"a":1,"e":["Article 65(3). It is then computed separately (Art 65(1)–(2)).","المادة 65 (3). ويُحتسب حينئذ بشكل مستقل (المادة 65 (1)–(2))."],"r":["65(3)"]}],"cards":[{"f":["Kingdom ETR","معدل المملكة الفعلي"],"b":["Σ Adjusted Covered Taxes of Saudi entities ÷ net DMT income of the Kingdom.","مجموع الضرائب المشمولة المعدلة للكيانات في المملكة ÷ صافي دخل المملكة."],"r":["53(2)"]},{"f":["Net DMT income","صافي الدخل"],"b":["DMT income of Saudi entities minus their DMT losses, if positive.","دخل الكيانات في المملكة ناقصاً خسائرها، إن كان موجباً."],"r":["53(4)"]},{"f":["Kept out of the blend","خارج المزيج"],"b":["Investment entities, stateless entities, minority-owned entities and subgroups.","كيانات الاستثمار، والكيانات عديمة الجنسية، والكيانات والمجموعات الفرعية ذات الملكية الأقلية."],"r":["53(3)","53(5)",65]},{"f":["Top-up percentage","نسبة الضريبة التكميلية"],"b":["15% − ETR, if positive.","15% − المعدل الفعلي، إن كانت موجبة."],"r":[54]},{"f":["Excess profit","الربح الزائد"],"b":["Net DMT income − substance-based income exclusion, if positive.","صافي الدخل − الاستبعاد على أساس جوهر النشاط، إن كان موجباً."],"r":[55]},{"f":["Domestic top-up tax","الضريبة التكميلية المحلية"],"b":["Top-up % × excess profit + additional current top-up tax.","النسبة × الربح الزائد + الضريبة التكميلية الحالية الإضافية."],"r":[56]},{"f":["Entity allocation","التخصيص على الكيانات"],"b":["Pro rata to DMT income among entities with income; loss entities take none.","بالتناسب مع الدخل بين الكيانات ذات الدخل؛ ولا شيء على الكيانات الخاسرة."],"r":["57(1)"]},{"f":["Recalculated top-up in a year without net income","ضريبة معاد احتسابها في سنة بلا صافي دخل"],"b":["Allocated by DMT income of the recalculated years.","تُخصص بحسب دخل السنوات المعاد احتسابها."],"r":["57(2)"]},{"f":["Additional current top-up tax","الضريبة التكميلية الحالية الإضافية"],"b":["The increase from recalculating an earlier year, charged in the current year.","الزيادة الناتجة عن إعادة احتساب سنة سابقة، وتُحمّل في السنة الحالية."],"r":["63(1)","63(2)"]},{"f":["ETR adjustment articles","مواد تعديل المعدل الفعلي"],"b":["Art 34; Art 49(5)–(7); Art 52(1)–(5); Art 52(8).","المادة 34؛ والمادة 49 (5)–(7)؛ والمادة 52 (1)–(5)؛ والمادة 52 (8)."],"r":["63(7)"]},{"f":["Negative covered taxes, no net income","ضرائب مشمولة سالبة بلا صافي دخل"],"b":["Additional top-up = expected covered taxes (15% × net loss) − actual covered taxes, if lower.","الضريبة الإضافية = الضرائب المتوقعة (15% × صافي الخسارة) − الضرائب الفعلية، إن كانت أقل."],"r":["63(3)","63(4)"]},{"f":["Minority-owned constituent entity","الكيان التابع ذو الملكية الأقلية"],"b":["UPE interest of 30% or less; computed separately, as a subgroup or alone.","حصة الكيان الأم النهائي 30% أو أقل؛ ويُحتسب بشكل مستقل، كمجموعة فرعية أو منفرداً."],"r":["65(1)","65(2)","65(3)"]}],"range":"53–57, 63, 65"},{"id":11,"title":["Substance-based income exclusion: people and assets","الاستبعاد على أساس جوهر النشاط: الموظفون والأصول"],"goal":["Compute the payroll and tangible asset carve-outs at the transitional rates, and know who and what counts for each.","احتساب استبعاد تكاليف الرواتب واستبعاد الأصول الملموسة بالنسب الانتقالية، ومعرفة من وما يُحتسب في كل منهما."],"parts":[5,11],"arts":[58,59,60,61,62,104],"time":30,"metaphor":{"title":["An allowance for real presence","بدلٌ للوجود الحقيقي"],"text":["The top-up tax is aimed at profit that real activity does not explain. So before any top-up, every group gets a fixed allowance for its people and its plant in the Kingdom: so many halalas per riyal of payroll and per riyal of tangible assets. That routine return is never topped up.\nThe allowance starts generous (9.2% of payroll and 7.2% of assets for years beginning in 2027) and shrinks each year to 5% and 5% from 2033.","تستهدف الضريبة التكميلية الربح الذي لا يفسره نشاط حقيقي. لذا تحصل كل مجموعة قبل أي ضريبة تكميلية على بدل ثابت لموظفيها وأصولها في المملكة: هللات معينة عن كل ريال من الرواتب وعن كل ريال من الأصول الملموسة. وهذا العائد الاعتيادي لا تُفرض عليه ضريبة تكميلية أبداً.\nويبدأ البدل سخياً (9.2% من الرواتب و7.2% من الأصول للسنوات التي تبدأ في 2027م) ثم يتناقص كل سنة حتى يبلغ 5% و5% اعتباراً من 2033م."]},"anchors":[{"if":["The group has a large Saudi workforce","للمجموعة قوة عاملة كبيرة في المملكة"],"then":["Payroll carve-out = transitional rate × eligible payroll costs of eligible employees working in the Kingdom (Arts 59, 104(1))","استبعاد الرواتب = النسبة الانتقالية × تكاليف الرواتب المؤهلة للموظفين المؤهلين العاملين في المملكة (المادتان 59 و104 (1))"]},{"if":["Payroll was capitalised into a plant","رُسملت رواتب في مصنع"],"then":["Take it out of payroll: it earns its return through the asset carve-out (Art 59(1)(a))","أخرجها من الرواتب: فعائدها يأتي عبر استبعاد الأصول (المادة 59 (1) (أ))"]},{"if":["The asset is plant, natural resources, a right-of-use asset or a qualifying government licence in the Kingdom","الأصل مصنع أو موارد طبيعية أو حق استخدام أو ترخيص حكومي مؤهل في المملكة"],"then":["It is an eligible tangible asset (Art 61(1))","فهو أصل ملموس مؤهل (المادة 61 (1))"]},{"if":["The entity is an investment entity","الكيان كيان استثمار"],"then":["It is left out of the Kingdom's SBIE; it has its own under Article 85 (Art 58(1))","يُستبعد من استبعاد المملكة؛ وله استبعاده الخاص بموجب المادة 85 (المادة 58 (1))"]}],"diagrams":[{"type":"table","title":["Carve-out rates by year (fiscal year beginning in)","نسب الاستبعاد حسب السنة (سنة مالية تبدأ في)"],"head":[["Year","السنة"],["Payroll","الرواتب"],["Tangible assets","الأصول الملموسة"]],"rows":[[["2027","2027م"],["9.2%","9.2%"],["7.2%","7.2%"]],[["2028","2028م"],["9.0%","9.0%"],["7.0%","7.0%"]],[["2029","2029م"],["8.2%","8.2%"],["6.6%","6.6%"]],[["2030","2030م"],["7.4%","7.4%"],["6.2%","6.2%"]],[["2031","2031م"],["6.6%","6.6%"],["5.8%","5.8%"]],[["2032","2032م"],["5.8%","5.8%"],["5.4%","5.4%"]],[["2033 onwards","2033م وما بعدها"],["5%","5%"],["5%","5%"]]],"note":["Source: Article 104 for 2027–2032; Articles 59 and 60 for the 5% steady state.","المصدر: المادة 104 للأعوام 2027–2032م؛ والمادتان 59 و60 لنسبة 5% الدائمة."]},{"type":"bars","title":["Same business, shrinking allowance (Cases 1 and 2)","النشاط نفسه وبدل يتناقص (الحالتان 1 و2)"],"u":"SAR","items":[{"l":["Payroll carve-out FY2027","استبعاد الرواتب 2027م"],"v":25760000},{"l":["Asset carve-out FY2027","استبعاد الأصول 2027م"],"v":72000000,"tone":"g"},{"l":["Payroll carve-out FY2033","استبعاد الرواتب 2033م"],"v":14000000},{"l":["Asset carve-out FY2033","استبعاد الأصول 2033م"],"v":50000000,"tone":"g"}]}],"points":[{"h":["Two carve-outs","استبعادان"],"t":["The substance-based income exclusion for the Kingdom is the sum of the payroll carve-out and the tangible asset carve-out of each Saudi constituent entity, except investment entities and insurance investment entities. It is deducted from net DMT income to give excess profit.","الاستبعاد على أساس جوهر النشاط للمملكة هو مجموع استبعاد الرواتب واستبعاد الأصول الملموسة لكل كيان تابع في المملكة، باستثناء كيانات الاستثمار وكيانات التأمين الاستثماري. ويُخصم من صافي الدخل للوصول إلى الربح الزائد."],"r":["58(1)","55(1)"]},{"h":["Payroll carve-out","استبعاد الرواتب"],"t":["5% (more during transition) of the eligible payroll costs of eligible employees who perform activities for the group in the Kingdom. Payroll capitalised into eligible tangible assets, and payroll attributable to excluded international shipping income, are left out.","5% (وأكثر خلال الفترة الانتقالية) من تكاليف الرواتب المؤهلة للموظفين المؤهلين الذين يؤدون أنشطة للمجموعة في المملكة. وتُستبعد الرواتب المرسملة في أصول ملموسة مؤهلة، والرواتب المنسوبة إلى دخل الشحن الدولي المستبعد."],"r":["59(1)"]},{"h":["What payroll costs count","تكاليف الرواتب التي تُحتسب"],"t":["Employee compensation (salaries, wages and other direct personal benefits such as health insurance and pension contributions), payroll and employment taxes, and employer social security contributions.","تعويضات الموظفين (الرواتب والأجور والمزايا الشخصية المباشرة الأخرى مثل التأمين الصحي واشتراكات التقاعد)، وضرائب الرواتب والتوظيف، واشتراكات صاحب العمل في التأمينات الاجتماعية."],"r":["59(2)"]},{"h":["Who is an eligible employee","من الموظف المؤهل"],"t":["Employees of a group member, including part-time employees, and independent contractors who take part in the group's ordinary operating activities under the group's direction and control.","موظفو عضو في المجموعة، بمن فيهم موظفو الدوام الجزئي، والمقاولون المستقلون الذين يشاركون في الأنشطة التشغيلية الاعتيادية للمجموعة تحت توجيهها وإشرافها."],"r":["62(2)"]},{"h":["Tangible asset carve-out","استبعاد الأصول الملموسة"],"t":["5% (more during transition) of the carrying value of eligible tangible assets located in the Kingdom for the fiscal year. The Regulations will say how carrying value is measured.","5% (وأكثر خلال الفترة الانتقالية) من القيمة الدفترية للأصول الملموسة المؤهلة الواقعة في المملكة للسنة المالية. وستحدد اللائحة كيفية قياس القيمة الدفترية."],"r":["60(1)","60(2)"]},{"h":["Eligible tangible assets","الأصول الملموسة المؤهلة"],"t":["Property, plant and equipment in the jurisdiction; natural resources there; a lessee's right of use of tangible assets there; and a government licence or similar arrangement for using immovable property or exploiting natural resources that entails significant investment in tangible assets.","الممتلكات والمصانع والمعدات في الولاية؛ والموارد الطبيعية فيها؛ وحق المستأجر في استخدام أصول ملموسة فيها؛ والترخيص الحكومي أو ما يماثله لاستخدام العقارات أو استغلال الموارد الطبيعية المتضمن استثماراً كبيراً في أصول ملموسة."],"r":["61(1)"]},{"h":["Branches","الفروع"],"t":["A PE's eligible payroll and assets are those in its separate accounts (as adjusted under Article 40), provided the employees and assets are located in the PE's jurisdiction.","الرواتب والأصول المؤهلة للمنشأة الدائمة هي الواردة في حساباتها المنفصلة (بعد تعديلها وفق المادة 40)، بشرط أن يكون الموظفون والأصول في ولاية المنشأة الدائمة."],"r":["62(1)"]},{"h":["The transition glide path","مسار التدرج الانتقالي"],"t":["For fiscal years beginning in 2027 the rates are 9.2% for payroll and 7.2% for assets, falling each year to 5.8% and 5.4% in 2032; from 2033 both are 5%.","للسنوات المالية التي تبدأ في 2027م تبلغ النسبتان 9.2% للرواتب و7.2% للأصول، ثم تنخفضان كل سنة حتى 5.8% و5.4% في 2032م؛ واعتباراً من 2033م تصبح كلتاهما 5%."],"r":["104(1)","104(2)"]}],"oecd":[{"t":["Articles 58 to 62 follow GloBE Article 5.3, and Article 104 reproduces the 2027–2032 part of the transition table in Article 9.2. GloBE also excludes property held for sale, lease or investment and international shipping assets from eligible tangible assets, and measures carrying value as the average of opening and closing values; the draft leaves those details to the Regulations.","تتبع المواد من 58 إلى 62 المادة 5.3 من القواعد النموذجية، وتنقل المادة 104 الجزء الخاص بالأعوام 2027–2032م من الجدول الانتقالي في المادة 9.2. وتستبعد القواعد العالمية أيضاً من الأصول الملموسة المؤهلة العقارات المحتفظ بها للبيع أو التأجير أو الاستثمار وأصول الشحن الدولي، وتقيس القيمة الدفترية بمتوسط رصيدي بداية السنة ونهايتها؛ ويترك مشروع النظام هذه التفاصيل للائحة."],"src":["Model Rules Arts 5.3, 9.2","القواعد النموذجية: المادتان 5.3 و9.2"]},{"t":["KSA angle: employer GOSI contributions are employer social security contributions, so they count as eligible payroll costs. Whether government fees charged per expatriate worker count as employment taxes is a point to confirm when the Regulations are issued.","من منظور المملكة: اشتراكات صاحب العمل في المؤسسة العامة للتأمينات الاجتماعية هي اشتراكات تأمينات اجتماعية لصاحب العمل، فتُحتسب ضمن تكاليف الرواتب المؤهلة. أما هل تُعد الرسوم الحكومية المفروضة عن كل عامل وافد ضرائب توظيف، فنقطة يلزم تأكيدها عند صدور اللائحة."],"src":["Draft Art 59(2)","المشروع م 59 (2)"]}],"reflect":{"ref":["An-Najm 53:39","النجم: 39"],"ayah":"وأن ليس للإنسان إلا ما سعى","t":["Man has only what he strives for. The carve-out shields the return earned by real people and real assets in the Kingdom; profit that floats free of any effort is what the law tops up. Build on genuine striving and the rules work with you.","وأن ليس للإنسان إلا ما سعى. يحمي الاستبعاد العائد الذي يحققه أناس حقيقيون وأصول حقيقية في المملكة؛ أما الربح المنفصل عن أي جهد فهو ما يفرض عليه النظام الضريبة التكميلية. فابنِ على سعي حقيقي تعمل القواعد لصالحك."]},"cases":[{"t":["SBIE for FY2027","الاستبعاد للسنة المالية 2027م"],"facts":["The Saudi entities of a group (calendar year) report for FY2027:\n• Eligible payroll costs: SAR 300m (salaries, allowances, employer GOSI and medical insurance), of which SAR 20m was capitalised into a plant under construction\n• Carrying value of eligible tangible assets: SAR 1,000m (plant SAR 800m, right-of-use assets SAR 150m, a mining licence with significant tangible investment SAR 50m)","تُظهر الكيانات في المملكة لمجموعة (سنتها تقويمية) للسنة المالية 2027م:\n• تكاليف الرواتب المؤهلة: 300 مليون ريال (رواتب وبدلات واشتراكات التأمينات الاجتماعية والتأمين الطبي)، رُسمل منها 20 مليون ريال في مصنع تحت الإنشاء\n• القيمة الدفترية للأصول الملموسة المؤهلة: 1,000 مليون ريال (مصنع 800 مليون، وأصول حق استخدام 150 مليون، وترخيص تعدين باستثمار ملموس كبير 50 مليون)"],"steps":[{"t":["Payroll after taking out the capitalised part:","الرواتب بعد استبعاد الجزء المرسمل:"],"x":"300000000-20000000","v":280000000,"u":"SAR"},{"t":["Payroll carve-out at 9.2%:","استبعاد الرواتب بنسبة 9.2%:"],"x":"280000000*9.2/100","v":25760000,"u":"SAR"},{"t":["Tangible asset carve-out at 7.2%:","استبعاد الأصول الملموسة بنسبة 7.2%:"],"x":"1000000000*7.2/100","v":72000000,"u":"SAR"},{"t":["Substance-based income exclusion:","الاستبعاد على أساس جوهر النشاط:"],"x":"25760000+72000000","v":97760000,"u":"SAR"}],"ans":["The SBIE is SAR 97.76m. The SAR 20m of capitalised payroll is not lost: it sits in the plant's carrying value and earns its return through the asset carve-out.","الاستبعاد 97.76 مليون ريال. والعشرون مليوناً من الرواتب المرسملة لا تضيع: فهي ضمن القيمة الدفترية للمصنع وتحقق عائدها عبر استبعاد الأصول."],"r":["59(1)","59(2)","60(1)","61(1)","104(1)","104(2)"]},{"t":["The same business in FY2033","النشاط نفسه في 2033م"],"facts":["Assume the same eligible payroll (SAR 280m after capitalisation) and assets (SAR 1,000m) in FY2033, when both rates are 5%, and a top-up percentage of 3%.","افترض الرواتب المؤهلة نفسها (280 مليون ريال بعد الرسملة) والأصول نفسها (1,000 مليون ريال) في 2033م، حين تبلغ النسبتان 5%، ونسبة ضريبة تكميلية 3%."],"steps":[{"t":["Payroll carve-out at 5%:","استبعاد الرواتب بنسبة 5%:"],"x":"280000000*5/100","v":14000000,"u":"SAR"},{"t":["Asset carve-out at 5%:","استبعاد الأصول بنسبة 5%:"],"x":"1000000000*5/100","v":50000000,"u":"SAR"},{"t":["SBIE in FY2033:","الاستبعاد في 2033م:"],"x":"14000000+50000000","v":64000000,"u":"SAR"},{"t":["Fall in the allowance since FY2027:","انخفاض البدل منذ 2027م:"],"x":"97760000-64000000","v":33760000,"u":"SAR"},{"t":["Extra top-up tax from that fall at 3%:","الضريبة التكميلية الإضافية الناتجة عن ذلك بنسبة 3%:"],"x":"3/100*33760000","v":1012800,"u":"SAR"}],"ans":["With nothing else changing, excess profit rises by SAR 33.76m and the top-up tax by about SAR 1m a year. Models built on 2027 rates will understate later years.","مع ثبات كل شيء آخر يرتفع الربح الزائد بمقدار 33.76 مليون ريال، وترتفع الضريبة التكميلية بنحو مليون ريال سنوياً. والنماذج المبنية على نسب 2027م ستُقلّل تقدير السنوات اللاحقة."],"r":["59(1)","60(1)","104(1)","104(2)"]},{"t":["Whose pay counts?","رواتب من تُحتسب؟"],"facts":["A Saudi company's FY2027 people costs:\n• Employees working in the Kingdom, including part-timers: SAR 200m\n• Independent contractors working in its plant under its direction and control: SAR 30m\n• Fees to an outside cleaning firm (its staff are not under the company's direction): SAR 5m\n• Employees working full-time in its UAE branch (a PE): SAR 15m","تكاليف الأفراد لشركة في المملكة للسنة المالية 2027م:\n• موظفون يعملون في المملكة، بمن فيهم موظفو الدوام الجزئي: 200 مليون ريال\n• مقاولون مستقلون يعملون في مصنعها تحت توجيهها وإشرافها: 30 مليون ريال\n• أتعاب شركة نظافة خارجية (موظفوها ليسوا تحت توجيه الشركة): 5 ملايين ريال\n• موظفون يعملون بدوام كامل في فرعها بالإمارات (منشأة دائمة): 15 مليون ريال"],"steps":[{"t":["The cleaning firm's staff are not under the group's direction and control, so its fees are out.","موظفو شركة النظافة ليسوا تحت توجيه المجموعة وإشرافها، فتُستبعد أتعابها."]},{"t":["The UAE staff work for the group in the UAE, so they count, if at all, for the UAE branch.","موظفو الإمارات يعملون للمجموعة في الإمارات، فيُحتسبون، إن احتُسبوا، لفرع الإمارات."]},{"t":["Eligible payroll for the Kingdom:","الرواتب المؤهلة للمملكة:"],"x":"200000000+30000000","v":230000000,"u":"SAR"},{"t":["Payroll carve-out at 9.2%:","استبعاد الرواتب بنسبة 9.2%:"],"x":"230000000*9.2/100","v":21160000,"u":"SAR"}],"ans":["SAR 230m is eligible, giving a SAR 21.16m payroll carve-out for FY2027. Part-timers and contractors under the group's direction count; outsourced services and staff working abroad do not count for the Kingdom.","يؤهل 230 مليون ريال، فيكون استبعاد الرواتب 21.16 مليون ريال لعام 2027م. ويُحتسب موظفو الدوام الجزئي والمقاولون تحت توجيه المجموعة؛ ولا تُحتسب للمملكة الخدمات الخارجية ولا الموظفون العاملون في الخارج."],"r":["59(1)","62(1)","62(2)"]}],"quiz":[{"q":["What makes up the substance-based income exclusion?","مِمّ يتكون الاستبعاد على أساس جوهر النشاط؟"],"o":[["Payroll carve-out plus tangible asset carve-out","استبعاد الرواتب مع استبعاد الأصول الملموسة"],["Revenue carve-out","استبعاد الإيرادات"],["Intangible asset carve-out","استبعاد الأصول غير الملموسة"],["A flat SAR 10m","10 ملايين ريال ثابتة"]],"a":0,"e":["Article 58(1).","المادة 58 (1)."],"r":["58(1)"]},{"q":["Which entities are left out of the Kingdom's SBIE?","أي الكيانات تُستبعد من استبعاد المملكة؟"],"o":[["Loss-making entities","الكيانات الخاسرة"],["Investment entities and insurance investment entities","كيانات الاستثمار وكيانات التأمين الاستثماري"],["Zakat payers","دافعو الزكاة"],["Branches","الفروع"]],"a":1,"e":["Article 58(1).","المادة 58 (1)."],"r":["58(1)"]},{"q":["What are the carve-out rates for a fiscal year beginning in 2027?","ما نسب الاستبعاد لسنة مالية تبدأ في 2027م؟"],"o":[["5% and 5%","5% و5%"],["9.2% payroll, 7.2% tangible assets","9.2% للرواتب و7.2% للأصول الملموسة"],["10% and 8%","10% و8%"],["7.2% payroll, 9.2% assets","7.2% للرواتب و9.2% للأصول"]],"a":1,"e":["Article 104(1)–(2).","المادة 104 (1)–(2)."],"r":["104(1)","104(2)"]},{"q":["What are the rates for a fiscal year beginning in 2030?","ما النسب لسنة مالية تبدأ في 2030م؟"],"o":[["7.4% payroll, 6.2% assets","7.4% للرواتب و6.2% للأصول"],["8.2% and 6.6%","8.2% و6.6%"],["6.6% and 5.8%","6.6% و5.8%"],["5% and 5%","5% و5%"]],"a":0,"e":["Article 104.","المادة 104."],"r":[104]},{"q":["Which of these is NOT an eligible payroll cost?","أي مما يلي ليس من تكاليف الرواتب المؤهلة؟"],"o":[["Salaries","الرواتب"],["Employer social security contributions","اشتراكات صاحب العمل في التأمينات الاجتماعية"],["Health insurance for employees","التأمين الصحي للموظفين"],["Payroll capitalised into a plant under construction","رواتب مرسملة في مصنع تحت الإنشاء"]],"a":3,"e":["Article 59(1)(a) excludes payroll capitalised into eligible tangible assets; the others are in Article 59(2).","تستبعد المادة 59 (1) (أ) الرواتب المرسملة في أصول ملموسة مؤهلة؛ والبقية في المادة 59 (2)."],"r":["59(1)","59(2)"]},{"q":["A shipping company's cre .","المادة 61 (1) (د)."],"r":["61(1)"]},{"q":["How are a PE's eligible payroll and assets determined?","كيف تُحدد الرواتب والأصول المؤهلة للمنشأة الدائمة؟"],"o":[["From the head office accounts","من حسابات المركز الرئيسي"],["From the PE's separate accounts, if the people and assets are located in the PE's jurisdiction","من الحسابات المنفصلة للمنشأة، إذا كان الأفراد والأصول في ولايتها"],["By formula on revenue","بمعادلة على الإيرادات"],["They are ignored","تُتجاهل"]],"a":1,"e":["Article 62(1).","المادة 62 (1)."],"r":["62(1)"]},{"q":["What is the tangible asset carve-out once the transition ends?","ما استبعاد الأصول الملموسة بعد انتهاء الفترة الانتقالية؟"],"o":[["5% of the carrying value of eligible tangible assets in the Kingdom","5% من القيمة الدفترية للأصول الملموسة المؤهلة في المملكة"],["5% of their cost","5% من تكلفتها"],["8% of carrying value","8% من القيمة الدفترية"],["10% of depreciation","10% من الاستهلاك"]],"a":0,"e":["Article 60(1).","المادة 60 (1)."],"r":["60(1)"]},{"q":["Who will set out how carrying value and other SBIE details are measured?","من سيحدد كيفية قياس القيمة الدفترية وغيرها من تفاصيل الاستبعاد؟"],"o":[["The auditor","المراجع"],["The Regulations","اللائحة"],["The OECD directly","المنظمة مباشرة"],["Each group","كل مجموعة"]],"a":1,"e":["Articles 58(2), 59(3), 60(2), 61(2) and 62(3).","المواد 58 (2) و59 (3) و60 (2) و61 (2) و62 (3)."],"r":["58(2)","60(2)"]}],"cards":[{"f":["SBIE","الاستبعاد على أساس جوهر النشاط"],"b":["Payroll carve-out + tangible asset carve-out of Saudi entities, except investment entities.","استبعاد الرواتب + استبعاد الأصول الملموسة للكيانات في المملكة، عدا كيانات الاستثمار."],"r":["58(1)"]},{"f":["Payroll carve-out","استبعاد الرواتب"],"b":["5% of eligible payroll costs of eligible employees working for the group in the Kingdom.","5% من تكاليف الرواتب المؤهلة للموظفين المؤهلين العاملين للمجموعة في المملكة."],"r":["59(1)"]},{"f":["Eligible payroll costs","تكاليف الرواتب المؤهلة"],"b":["Compensation incl. health and pension benefits; payroll and employment taxes; employer social security.","التعويضات ومنها مزايا الصحة والتقاعد؛ وضرائب الرواتب والتوظيف؛ والتأمينات الاجتماعية لصاحب العمل."],"r":["59(2)"]},{"f":["Payroll left out","رواتب مستبعدة"],"b":["Capitalised into eligible tangible assets; attributable to excluded international shipping income.","المرسملة في أصول ملموسة مؤهلة؛ والمنسوبة إلى دخل الشحن الدولي المستبعد."],"r":["59(1)"]},{"f":["Eligible employees","الموظفون المؤهلون"],"b":["Employees incl. part-time, plus independent contractors under the group's direction and control.","الموظفون ومنهم الدوام الجزئي، والمقاولون المستقلون تحت توجيه المجموعة وإشرافها."],"r":["62(2)"]},{"f":["Tangible asset carve-out","استبعاد الأصول الملموسة"],"b":["5% of the carrying value of eligible tangible assets located in the Kingdom.","5% من القيمة الدفترية للأصول الملموسة المؤهلة الواقعة في المملكة."],"r":["60(1)"]},{"f":["Eligible tangible assets","الأصول الملموسة المؤهلة"],"b":["PP&E, natural resources, right-of-use assets, qualifying government licences, all in the jurisdiction.","الممتلكات والمصانع والمعدات، والموارد الطبيعية، وأصول حق الاستخدام، والتراخيص الحكومية المؤهلة، كلها في الولاية."],"r":["61(1)"]},{"f":["PE carve-outs","استبعادات المنشأة الدائمة"],"b":["From the PE's separate accounts, if people and assets are in the PE's jurisdiction.","من حسابات المنشأة المنفصلة، إذا كان الأفراد والأصول في ولايتها."],"r":["62(1)"]},{"f":["2027 rates","نسب 2027م"],"b":["Payroll 9.2%, tangible assets 7.2%.","الرواتب 9.2%، والأصول الملموسة 7.2%."],"r":[104]},{"f":["2028 and 2029 rates","نسب 2028م و2029م"],"b":["2028: 9.0% and 7.0%. 2029: 8.2% and 6.6%.","2028م: 9.0% و7.0%. 2029م: 8.2% و6.6%."],"r":[104]},{"f":["2030 to 2032 rates","نسب 2030م إلى 2032م"],"b":["2030: 7.4% / 6.2%. 2031: 6.6% / 5.8%. 2032: 5.8% / 5.4%.","2030م: 7.4% / 6.2%. 2031م: 6.6% / 5.8%. 2032م: 5.8% / 5.4%."],"r":[104]},{"f":["From 2033","اعتباراً من 2033م"],"b":["5% for payroll and 5% for tangible assets.","5% للرواتب و5% للأصول الملموسة."],"r":["59(1)","60(1)"]}],"range":"58–62, 104"},{"id":12,"title":["Safe harbours, de minimis and penalty relief","الملاذات الآمنة والحد الأدنى والإعفاء من الغرامات"],"goal":["Decide quickly whether the Kingdom's computation can be switched off: the de minimis exclusion, the transitional CbCR safe harbour and its three tests, the other safe harbours, and penalty relief in the early years.","التحديد السريع لإمكانية إيقاف احتساب المملكة: استثناء الحد الأدنى، والملاذ الآمن الانتقالي للتقرير حسب كل دولة واختباراته الثلاثة، والملاذات الآمنة الأخرى، والإعفاء من الغرامات في السنوات الأولى."],"parts":[5,6],"arts":[64,66,67,68,69,70,71,72],"time":35,"metaphor":{"title":["Express lanes at the border","مسارات سريعة عند المنفذ"],"text":["Most travellers queue for full inspection: the full DMT computation. A few lanes let you through quickly if you pass simple tests: a small presence (de minimis), country-by-country report tests in the early years (the transitional CbCR safe harbour), and newer lanes whose rules the Regulations will publish.\nThe express lanes have cameras: for 36 months ZATCA can ask whether the facts really fitted. And in the first years, a traveller who made honest, careful efforts is not fined for mistakes.","يقف معظم المسافرين في طابور التفتيش الكامل: الاحتساب الكامل. وبعض المسارات يسمح بالعبور السريع لمن يجتاز اختبارات بسيطة: الوجود المحدود (الحد الأدنى)، واختبارات التقرير حسب كل دولة في السنوات الأولى (الملاذ الآمن الانتقالي)، ومسارات أحدث ستنشر اللائحة شروطها.\nوللمسارات السريعة كاميرات: فللهيئة خلال 36 شهراً أن تسأل هل كانت الوقائع مطابقة فعلاً. وفي السنوات الأولى لا يُغرّم المسافر الذي بذل جهداً صادقاً وحريصاً على أخطائه."]},"anchors":[{"if":["Three-year average Saudi revenue is under €10m and average income is under €1m or a loss","متوسط إيرادات المملكة لثلاث سنوات أقل من 10 ملايين يورو ومتوسط الدخل أقل من مليون يورو أو خسارة"],"then":["Elect de minimis for the year: top-up tax deemed zero (Art 64)","اختر استثناء الحد الأدنى للسنة: تُعد الضريبة التكميلية صفراً (المادة 64)"]},{"if":["It is FY2027 and the group files a qualified CbC report","إنها السنة المالية 2027م والمجموعة تقدم تقريراً مؤهلاً حسب كل دولة"],"then":["Test the three CbCR safe harbour tests; passing any one is enough (Art 67(1))","طبّق اختبارات الملاذ الآمن الثلاثة؛ ويكفي اجتياز أي منها (المادة 67 (1))"]},{"if":["The group was under GloBE earlier but did not use the CbCR safe harbour for the Kingdom","كانت المجموعة خاضعة للقواعد العالمية سابقاً ولم تستخدم الملاذ الآمن للمملكة"],"then":["It cannot use it later: once out, always out (Art 68(3))","لا يمكنها استخدامه لاحقاً: من خرج لا يعود (المادة 68 (3))"]},{"if":["ZATCA questions a safe harbour within 36 months","الهيئة تستفسر عن ملاذ آمن خلال 36 شهراً"],"then":["You have six months to show the facts did not materially affect eligibility (Art 66(3))","لديك ستة أشهر لإثبات أن الوقائع لم تؤثر جوهرياً في الأهلية (المادة 66 (3))"]},{"if":["A filing error happens in the transition period despite good-faith efforts","وقع خطأ في الإقرار خلال الفترة الانتقالية رغم الجهد بحسن نية"],"then":["No penalties where ZATCA considers reasonable measures were taken (Art 72)","لا غرامات إذا رأت الهيئة أن تدابير معقولة قد اتُخذت (المادة 72)"]}],"diagrams":[{"type":"tree","title":["Transitional CbCR safe harbour for the Kingdom","الملاذ الآمن الانتقالي للتقرير حسب كل دولة للمملكة"],"root":{"q":["Is the fiscal year in the transition period, and does the group prepare a qualified CbC report?","هل السنة المالية ضمن الفترة الانتقالية، وهل تُعد المجموعة تقريراً مؤهلاً حسب كل دولة؟"],"no":{"end":["Not available","غير متاح"],"tone":"out"},"yes":{"q":["Was the group under this law or GloBE in an earlier year, with Saudi entities, without using this safe harbour for the Kingdom?","هل خضعت المجموعة لهذا النظام أو للقواعد العالمية في سنة سابقة، ولها كيانات في المملكة، دون أن تستخدم هذا الملاذ للمملكة؟"],"yes":{"end":["Not available: once out, always out (Art 68(3))","غير متاح: من خرج لا يعود (المادة 68 (3))"],"tone":"out"},"no":{"q":["Does any one test pass: (a) revenue < €10m and PBT < €1m; (b) simplified ETR ≥ 17%; (c) PBT ≤ SBIE?","هل يُجتاز أي اختبار: (أ) الإيرادات < 10 ملايين يورو والربح قبل الضريبة < مليون يورو؛ (ب) المعدل المبسط ≥ 17%؛ (ج) الربح قبل الضريبة ≤ الاستبعاد؟"],"yes":{"end":["Elect it: top-up tax deemed zero (Art 66(1))","اختره: تُعد الضريبة التكميلية صفراً (المادة 66 (1))"],"tone":"in"},"no":{"end":["Full computation (or another safe harbour)","احتساب كامل (أو ملاذ آمن آخر)"],"tone":"na"}}}}},{"type":"table","title":["The menu of reliefs","قائمة أوجه التخفيف"],"head":[["Relief","وجه التخفيف"],["Conditions in","الشروط في"],["Effect","الأثر"]],"rows":[[["De minimis exclusion","استثناء الحد الأدنى"],["Art 64","المادة 64"],["Top-up tax deemed zero; annual election","تُعد الضريبة التكميلية صفراً؛ اختيار سنوي"]],[["Transitional CbCR safe harbour","الملاذ الآمن الانتقالي للتقرير حسب كل دولة"],["Arts 67–68 (17% for years beginning in 2027)","المادتان 67–68 (17% للسنوات التي تبدأ في 2027م)"],["Top-up tax deemed zero","تُعد الضريبة التكميلية صفراً"]],[["Simplified ETR safe harbour","الملاذ الآمن للمعدل الفعلي المبسط"],["Regulations (Art 69)","اللائحة (المادة 69)"],["Top-up tax deemed zero","تُعد الضريبة التكميلية صفراً"]],[["NMCE simplified calculations safe harbour","الملاذ الآمن للاحتساب المبسط للكيانات غير الجوهرية"],["Regulations (Art 70)","اللائحة (المادة 70)"],["Top-up tax deemed zero","تُعد الضريبة التكميلية صفراً"]],[["Substance-based tax incentive safe harbour","الملاذ الآمن للحوافز الضريبية القائمة على الجوهر"],["Regulations (Art 71)","اللائحة (المادة 71)"],["Top-up tax from qualified tax incentives deemed zero","تُعد الضريبة التكميلية الناتجة عن الحوافز الضريبية المؤهلة صفراً"]],[["Transitional penalty relief","الإعفاء الانتقالي من الغرامات"],["Art 72","المادة 72"],["No penalties on the returns if reasonable measures were taken","لا غرامات على الإقرارات إذا اتُخذت تدابير معقولة"]]]}],"points":[{"h":["De minimis exclusion","استثناء الحد الأدنى"],"t":["By annual election, the Kingdom's top-up tax is deemed zero if the three-year average DMT revenue of the Saudi entities is below the riyal equivalent of €10m and their three-year average DMT income is a loss or below €1m. Years with no Saudi entities are left out of the average. It does not apply to stateless or investment entities, whose figures are left out.","باختيار سنوي، تُعد الضريبة التكميلية للمملكة صفراً إذا كان متوسط إيرادات الكيانات في المملكة لثلاث سنوات أقل مما يعادل 10 ملايين يورو بالريال، وكان متوسط دخلها لثلاث سنوات خسارة أو أقل من مليون يورو. وتُستبعد من المتوسط السنوات التي لم تكن فيها كيانات في المملكة. ولا ينطبق على الكيانات عديمة الجنسية أو كيانات الاستثمار، وتُستبعد أرقامها."],"r":["64(1)","64(2)","64(3)","64(4)","64(6)","64(7)"]},{"h":["What a DMT safe harbour does","ما يفعله الملاذ الآمن"],"t":["If the Saudi entities qualify and the filing entity elects, the Kingdom's top-up tax is deemed zero for the year. The substance-based tax incentive safe harbour works more narrowly: only the top-up tax that corresponds to qualified tax incentives is deemed zero.","إذا تأهلت الكيانات في المملكة واختار الكيان المقدم للإقرار، تُعد الضريبة التكميلية للمملكة صفراً عن السنة. ويعمل الملاذ الآمن للحوافز الضريبية القائمة على الجوهر بنطاق أضيق: فلا يُعد صفراً إلا ما يقابل الحوافز الضريبية المؤهلة من الضريبة التكميلية."],"r":["66(1)","66(2)","66(4)"]},{"h":["The three CbCR tests","اختبارات التقرير حسب كل دولة الثلاثة"],"t":["In the transition period, the Saudi entities qualify if any one test is met: (a) CbCR total revenue under €10m and profit before income tax under €1m in the Kingdom; (b) a simplified ETR at or above the transition rate; or (c) profit before income tax no more than the substance-based income exclusion of the Saudi entities.","في الفترة الانتقالية تتأهل الكيانات في المملكة إذا تحقق أي اختبار واحد: (أ) إجمالي إيرادات أقل من 10 ملايين يورو وربح قبل ضريبة الدخل أقل من مليون يورو في المملكة وفق التقرير؛ (ب) معدل فعلي مبسط يساوي معدل الانتقال أو يزيد عليه؛ (ج) ربح قبل ضريبة الدخل لا يتجاوز الاستبعاد على أساس جوهر النشاط للكيانات في المملكة."],"r":["67(1)"]},{"h":["17% and the transition period","17% والفترة الانتقالية"],"t":["The transition rate is 17% for fiscal years beginning in 2027. The transition period covers fiscal years beginning on or before 31 December 2027, but not a fiscal year ending after 30 June 2029. As the law starts in 2027, this is in practice a one-year relief for the Kingdom.","معدل الانتقال 17% للسنوات المالية التي تبدأ في 2027م. وتشمل الفترة الانتقالية السنوات المالية التي تبدأ في 31 ديسمبر 2027م أو قبله، دون السنة المالية التي تنتهي بعد 30 يونيو 2029م. ولأن النظام يبدأ في 2027م، فهذا عملياً تخفيف لسنة واحدة في المملكة."],"r":["67(2)","67(8)","106(1)"]},{"h":["Simplified covered taxes include Zakat","الضرائب المشمولة المبسطة تشمل الزكاة"],"t":["The simplified ETR divides simplified covered taxes, meaning the income tax and Zakat expense in the qualified financial statements for the Kingdom after removing taxes that are not covered taxes and uncertain tax positions, by profit before income tax per the qualified CbC report.","يقسم المعدل المبسط الضرائب المشمولة المبسطة، أي مصروف ضريبة الدخل والزكاة في القوائم المالية المؤهلة للمملكة بعد استبعاد الضرائب غير المشمولة والمراكز الضريبية غير المؤكدة، على الربح قبل ضريبة الدخل وفق التقرير المؤهل."],"r":["67(7)"]},{"h":["Qualified CbC report","التقرير المؤهل حسب كل دولة"],"t":["The safe harbour applies only if the group prepares a qualified CbC report: one prepared from qualified financial statements, meaning the consolidation accounts, separate statements under an acceptable or authorised standard, or the accounts used for the CbC report of an entity left out of consolidation for size or materiality.","لا يُطبق الملاذ إلا إذا أعدت المجموعة تقريراً مؤهلاً حسب كل دولة: أي معداً من قوائم مالية مؤهلة، وهي حسابات التوحيد، أو القوائم المنفصلة وفق معيار مقبول أو معتمد، أو الحسابات المستخدمة في التقرير لكيان مستبعد من التوحيد لأسباب الحجم أو الأهمية النسبية."],"r":["67(3)","67(4)"]},{"h":["Who cannot use it","من لا يمكنه استخدامه"],"t":["Stateless entities; multi-parented groups whose single CbC report does not combine the groups; and groups that were under this law or GloBE in an earlier year, with Saudi entities, and did not benefit from the safe harbour in the Kingdom that year.","الكيانات عديمة الجنسية؛ والمجموعات متعددة الكيانات الأم التي لا يجمع تقريرها الواحد المجموعات؛ والمجموعات التي خضعت لهذا النظام أو للقواعد العالمية في سنة سابقة ولها كيانات في المملكة ولم تستفد من الملاذ في المملكة في تلك السنة."],"r":[68]},{"h":["The newer safe harbours","الملاذات الآمنة الأحدث"],"t":["The simplified ETR safe harbour, the NMCE simplified calculations safe harbour and the substance-based tax incentive safe harbour are in the law, but their conditions are left to the Regulations.","الملاذ الآمن للمعدل الفعلي المبسط، والملاذ الآمن للاحتساب المبسط للكيانات غير الجوهرية، والملاذ الآمن للحوافز الضريبية القائمة على الجوهر منصوص عليها في النظام، لكن شروطها متروكة للائحة."],"r":[69,70,71]},{"h":["ZATCA's 36-month review","مراجعة الهيئة خلال 36 شهراً"],"t":["A safe harbour election falls away if: the Kingdom could have had top-up tax with an ETR below 15%; ZATCA notifies the liable entities, within 36 months of filing, of facts that may have materially affected eligibility and invites them to clarify within six months; and they fail to show that eligibility was not materially affected.","يسقط اختيار الملاذ الآمن إذا: كان يمكن أن تنشأ ضريبة تكميلية في المملكة بمعدل فعلي أقل من 15%؛ وأخطرت الهيئة الكيانات الملزمة خلال 36 شهراً من تقديم الإقرار بوقائع قد تكون أثرت جوهرياً في الأهلية ودعتها للإيضاح خلال ستة أشهر؛ وعجزت عن إثبات أن الأهلية لم تتأثر جوهرياً."],"r":["66(3)","66(5)"]},{"h":["Transitional penalty relief","الإعفاء الانتقالي من الغرامات"],"t":["During the transition period, no penalties apply to the domestic top-up tax return and GloBE information return where ZATCA considers that the group took reasonable measures, for example by showing it acted in good faith to understand and comply with the law.","خلال الفترة الانتقالية لا تُطبق غرامات على إقرار الضريبة التكميلية المحلية وإقرار معلومات القواعد العالمية إذا رأت الهيئة أن المجموعة اتخذت تدابير معقولة، كأن تثبت أنها تصرفت بحسن نية لفهم النظام والالتزام به."],"r":[72]}],"oecd":[{"t":["Articles 66 to 72 track the OECD's December 2022 safe harbour and penalty relief guidance and the Side-by-Side Package of 5 January 2026, which added a permanent simplified ETR safe harbour and a substance-based tax incentive safe harbour and extended the transitional CbCR safe harbour by one year to include 2027. The OECD's original transition rates were 15% for 2023 and 2024, 16% for 2025 and 17% for 2026; the draft applies 17% to years beginning in 2027.","تتبع المواد من 66 إلى 72 إرشادات المنظمة بشأن الملاذات الآمنة والإعفاء من الغرامات الصادرة في ديسمبر 2022م، وحزمة «جنباً إلى جنب» الصادرة في 5 يناير 2026م، التي أضافت ملاذاً آمناً دائماً للمعدل الفعلي المبسط وملاذاً آمناً للحوافز الضريبية القائمة على الجوهر، ومددت الملاذ الآمن الانتقالي للتقرير حسب كل دولة سنة واحدة ليشمل 2027م. وكانت معدلات الانتقال الأصلية لدى المنظمة 15% لعامي 2023 و2024م، و16% لعام 2025م، و17% لعام 2026م؛ ويطبق مشروع النظام 17% على السنوات التي تبدأ في 2027م."],"src":["OECD safe harbours guidance (Dec 2022); Side-by-Side Package (5 Jan 2026)","إرشادات المنظمة للملاذات الآمنة (ديسمبر 2022م)؛ حزمة «جنباً إلى جنب» (5 يناير 2026م)"]},{"t":["The same package's side-by-side and UPE safe harbours relieve only the IIR and UTPR. They do not switch off domestic minimum taxes, so US-parented groups with Saudi entities remain within the draft law.","أما الملاذان الآمنان «جنباً إلى جنب» والخاص بالكيان الأم النهائي في الحزمة نفسها فيخففان قاعدتي تضمين الدخل والأرباح الخاضعة لمعدل منخفض فقط، ولا يوقفان الضرائب المحلية الدنيا، لذا تبقى المجموعات الأمريكية الأم ذات الكيانات في المملكة ضمن مشروع النظام."],"src":["Side-by-Side Package (5 Jan 2026)","حزمة «جنباً إلى جنب» (5 يناير 2026م)"]},{"t":["KSA angle: Articl ],"r":["67(8)"]},{"q":["What goes into simplified covered taxes?","ما الذي يدخل في الضرائب المشمولة المبسطة؟"],"o":[["Income tax only","ضريبة الدخل فقط"],["Income tax and Zakat expense in the qualified statements, less non-covered taxes and uncertain tax positions","مصروف ضريبة الدخل والزكاة في القوائم المؤهلة، ناقصاً الضرائب غير المشمولة والمراكز الضريبية غير المؤكدة"],["All taxes paid, including VAT","كل الضرائب المسددة بما فيها ضريبة القيمة المضافة"],["Cash taxes per ZATCA statements","الضرائب النقدية وفق كشوف الهيئة"]],"a":1,"e":["Article 67(7).","المادة 67 (7)."],"r":["67(7)"]},{"q":["What must the group prepare for the transitional CbCR safe harbour to apply?","ما الذي يجب أن تعده المجموعة لتطبيق الملاذ الآمن الانتقالي؟"],"o":[["A transfer pricing study","دراسة تسعير تحويلي"],["A qualified CbC report","تقريراً مؤهلاً حسب كل دولة"],["Audited Saudi statutory accounts only","قوائم نظامية مدققة في المملكة فقط"],["A ZATCA ruling","قراراً من الهيئة"]],"a":1,"e":["Article 67(3).","المادة 67 (3)."],"r":["67(3)"]},{"q":["A group under an IIR in FY2025 did not use the CbCR safe harbour for its Saudi entities that year. Can it use it for the Kingdom in FY2027?","مجموعة خضعت لقاعدة تضمين الدخل في 2025م ولم تستخدم الملاذ الآمن لكياناتها في المملكة في تلك السنة. هل يمكنها استخدامه للمملكة في 2027م؟"],"o":[["Yes, every year is new","نعم، فكل سنة جديدة"],["No: once out, always out, unless it had no Saudi entities that year","لا: من خرج لا يعود، ما لم تكن لديها كيانات في المملكة في تلك السنة"],["Yes, with ZATCA approval","نعم، بموافقة الهيئة"],["Only for half the entities","لنصف الكيانات فقط"]],"a":1,"e":["Article 68(3).","المادة 68 (3)."],"r":["68"]},{"q":["Within what period can ZATCA raise facts that may affect a safe harbour, and how long does the group have to respond?","خلال أي مدة يمكن للهيئة إثارة وقائع قد تؤثر في الملاذ الآمن، وكم لدى المجموعة للرد؟"],"o":[["12 months; 1 month","12 شهراً؛ شهر"],["36 months after filing; 6 months","36 شهراً بعد التقديم؛ 6 أشهر"],["5 years; 1 year","5 سنوات؛ سنة"],["Any time; 30 days","أي وقت؛ 30 يوماً"]],"a":1,"e":["Article 66(3)(b).","المادة 66 (3) (ب)."],"r":["66(3)"]},{"q":["Where are the conditions for the simplified ETR, NMCE and substance-based tax incentive safe harbours?","أين شروط ملاذات المعدل المبسط والكيانات غير الجوهرية والحوافز الضريبية القائمة على الجوهر؟"],"o":[["In Article 67","في المادة 67"],["In the Regulations","في اللائحة"],["In the GloBE Model Rules directly","في القواعد النموذجية مباشرة"],["Nowhere: they are not available","لا مكان: فهي غير متاحة"]],"a":1,"e":["Articles 69, 70 and 71.","المواد 69 و70 و71."],"r":[69,70,71]},{"q":["What does the substance-based tax incentive safe harbour deem to be zero?","ما الذي يعدّه الملاذ الآمن للحوافز الضريبية القائمة على الجوهر صفراً؟"],"o":[["All top-up tax","كل الضريبة التكميلية"],["The top-up tax corresponding to qualified tax incentives","الضريبة التكميلية المقابلة للحوافز الضريبية المؤهلة"],["Covered taxes","الضرائب المشمولة"],["Penalties","الغرامات"]],"a":1,"e":["Article 66(2).","المادة 66 (2)."],"r":["66(2)"]},{"q":["During the transition period, when are penalties on the returns waived?","خلال الفترة الانتقالية، متى تُعفى الإقرارات من الغرامات؟"],"o":[["Always","دائماً"],["Where ZATCA considers the group took reasonable measures, such as acting in good faith","إذا رأت الهيئة أن المجموعة اتخذت تدابير معقولة، كالتصرف بحسن نية"],["Only if no tax is due","فقط إذا لم تستحق ضريبة"],["Never","أبداً"]],"a":1,"e":["Article 72.","المادة 72."],"r":[72]}],"cards":[{"f":["De minimis exclusion","استثناء الحد الأدنى"],"b":["3-year averages: revenue < €10m and income < €1m (or loss); top-up deemed zero; annual election.","متوسطات 3 سنوات: الإيرادات < 10 ملايين يورو والدخل < مليون يورو (أو خسارة)؛ وتُعد الضريبة صفراً؛ اختيار سنوي."],"r":[64]},{"f":["DMT safe harbours","الملاذات الآمنة"],"b":["Transitional CbCR, simplified ETR, NMCE simplified calculations, substance-based tax incentive.","الانتقالي للتقرير حسب كل دولة، والمعدل المبسط، والاحتساب المبسط للكيانات غير الجوهرية، والحوافز القائمة على الجوهر."],"r":["66(4)"]},{"f":["Safe harbour effect","أثر الملاذ الآمن"],"b":["Kingdom top-up deemed zero; for incentives, only the part from qualified tax incentives.","تُعد ضريبة المملكة صفراً؛ وفي الحوافز، الجزء الناتج عن الحوافز المؤهلة فقط."],"r":["66(1)","66(2)"]},{"f":["CbCR test (a): de minimis","الاختبار (أ): الحد الأدنى"],"b":["Revenue < €10m and profit before income tax < €1m in the Kingdom.","الإيرادات < 10 ملايين يورو والربح قبل ضريبة الدخل < مليون يورو في المملكة."],"r":["67(1)"]},{"f":["CbCR test (b): simplified ETR","الاختبار (ب): المعدل المبسط"],"b":["At or above the transition rate: 17% for years beginning in 2027.","عند معدل الانتقال أو أعلى: 17% للسنوات التي تبدأ في 2027م."],"r":["67(1)","67(2)"]},{"f":["CbCR test (c): routine profits","الاختبار (ج): الأرباح الاعتيادية"],"b":["Profit before income tax ≤ SBIE of the Saudi entities.","الربح قبل ضريبة الدخل ≤ الاستبعاد للكيانات في المملكة."],"r":["67(1)"]},{"f":["Simplified covered taxes","الضرائب المشمولة المبسطة"],"b":["Income tax and Zakat expense in the qualified statements, less non-covered taxes and uncertain positions.","مصروف ضريبة الدخل والزكاة في القوائم المؤهلة، ناقصاً الضرائب غير المشمولة والمراكز غير المؤكدة."],"r":["67(7)"]},{"f":["Transition period","الفترة الانتقالية"],"b":["Years beginning on or before 31 Dec 2027, excluding years ending after 30 Jun 2029.","السنوات التي تبدأ في 31 ديسمبر 2027م أو قبله، باستثناء ما ينتهي بعد 30 يونيو 2029م."],"r":["67(8)"]},{"f":["Qualified CbC report","التقرير المؤهل حسب كل دولة"],"b":["A CbC report prepared from qualified financial statements.","تقرير معد من قوائم مالية مؤهلة."],"r":["67(4)"]},{"f":["CbCR safe harbour exclusions","المستثنون من الملاذ الانتقالي"],"b":["Stateless entities; multi-parented groups without a combined report; once out, always out.","الكيانات عديمة الجنسية؛ والمجموعات متعددة الأمهات دون تقرير مجمّع؛ ومن خرج لا يعود."],"r":[68]},{"f":["ZATCA safe harbour challenge","اعتراض الهيئة على الملاذ الآمن"],"b":["Notice within 36 months of filing; six months to show eligibility was not materially affected.","إخطار خلال 36 شهراً من التقديم؛ وستة أشهر لإثبات أن الأهلية لم تتأثر جوهرياً."],"r":["66(3)"]},{"f":["Transitional penalty relief","الإعفاء الانتقالي من الغرامات"],"b":["No penalties on the returns in the transition period if reasonable, good-faith measures were taken.","لا غرامات على الإقرارات في الفترة الانتقالية إذا اتُخذت تدابير معقولة بحسن نية."],"r":[72]}],"range":"64, 66–72"},{"id":13,"title":["Who pays, and groups that change shape","من يدفع، والمجموعات التي يتغير شكلها"],"goal":["Apply joint liability, the revenue test for mergers and demergers, the rules for entities joining or leaving, asset transfers and DMT reorganisations, joint ventures and multi-parented groups.","تطبيق المسؤولية التضامنية، واختبار الإيرادات في الاندماج والانفصال، وقواعد انضمام الكيانات وخروجها، ونقل الأصول وإعادة التنظيم، والمشاريع المشتركة، والمجموعات متعددة الكيانات الأم."],"parts":[7,8],"arts":[73,74,75,76,77,78,79,80,81,82,83],"time":40,"metaphor":{"title":["A family ledger","دفتر العائلة"],"text":["Think of the group as a family that keeps one ledger for the Kingdom, and every member signs for the family's bill. When two families marry, their past pages are added together to see whether they were big enough; when a family splits, each part must show it is big enough on its own.\nA member who moves in or out mid-year counts only for the pages while it lived at home, and it brings its own old book values with it. A joint venture is a cousin's household: it keeps a separate ledger, and its members sign for that one.","تخيّل المجموعة عائلة تمسك دفتراً واحداً للمملكة، ويوقّع كل فرد فيها على فاتورة العائلة. فإذا تزوجت عائلتان جُمعت صفحاتهما السابقة لمعرفة هل بلغتا الحجم المطلوب؛ وإذا انقسمت عائلة فعلى كل جزء أن يثبت أنه بلغ الحجم بمفرده.\nومن ينتقل إلى البيت أو يخرج منه في منتصف السنة لا يُحسب إلا للصفحات التي أقام فيها، ويحمل معه قيمه الدفترية القديمة. أما المشروع المشترك فبيت ابن العم: له دفتر مستقل، ويوقّع أفراده على ذلك الدفتر."]},"anchors":[{"if":["Several Saudi taxpayers belong to the same in-scope group","عدة مكلفين في المملكة ينتمون إلى المجموعة نفسها الخاضعة للنظام"],"then":["They are jointly liable; ZATCA may approve limiting this to one or more entities (Art 73(2), 73(5))","فهم متضامنون في المسؤولية؛ وللهيئة أن توافق على قصرها على كيان أو أكثر (المادة 73 (2) و(5))"]},{"if":["Two groups merged in the last four years","اندمجت مجموعتان خلال السنوات الأربع الماضية"],"then":["Add their revenues for pre-merger years when testing €750m (Art 74(1)(a))","اجمع إيراداتهما لسنوات ما قبل الاندماج عند اختبار 750 مليون يورو (المادة 74 (1) (أ))"]},{"if":["A Saudi company is bought or sold mid-year","شركة في المملكة اشتُريت أو بيعت في منتصف السنة"],"then":["Count only the results consolidated line by line, at historical carrying values (Art 75(1))","احتسب فقط النتائج الموحدة بنداً بنداً، وبالقيم الدفترية التاريخية (المادة 75 (1))"]},{"if":["Assets move in a share-for-share merger that is tax-neutral locally","تنتقل أصول في اندماج مقابل أسهم محايد ضريبياً محلياً"],"then":["Test the DMT reorganisation conditions: if met, no gain or loss and the buyer takes the seller's values (Arts 76(2), 77)","اختبر شروط إعادة التنظيم: فإن تحققت فلا مكسب ولا خسارة، ويأخذ المشتري قيم البائع (المادتان 76 (2) و77)"]},{"if":["The UPE holds 50% or more of an equity-accounted Saudi company","يملك الكيان الأم النهائي 50% أو أكثر من شركة في المملكة محاسبة بطريقة حقوق الملكية"],"then":["It is a joint venture: compute it as a separate group; it and its subsidiaries are jointly liable (Arts 78, 79, 73(3))","فهي مشروع مشترك: احسبها كمجموعة مستقلة؛ وهي وكياناتها التابعة متضامنة في المسؤولية (المواد 78 و79 و73 (3))"]}],"diagrams":[{"type":"table","title":["Restructurings at a glance","إعادة الهيكلة في لمحة"],"head":[["Event","الحدث"],["Rule","القاعدة"],["Where","الموضع"]],"rows":[[["Two groups merge","اندماج مجموعتين"],["For pre-merger years the €750m test uses their combined revenue","في سنوات ما قبل الاندماج يُستخدم مجموع إيراداتهما لاختبار 750 مليون يورو"],["Art 74(1)(a)","المادة 74 (1) (أ)"]],[["A standalone entity joins a group","انضمام كيان مستقل إلى مجموعة"],["Combined revenue for years without consolidated statements","مجموع الإيرادات للسنوات التي لا توجد فيها قوائم موحدة"],["Art 74(1)(b)","المادة 74 (1) (ب)"]],[["A group demerges","انفصال مجموعة"],["First year after: €750m that year; years 2–4: €750m in at least two years after the demerger","السنة الأولى بعده: 750 مليون يورو فيها؛ والسنوات 2–4: 750 مليوناً في سنتين على الأقل بعد الانفصال"],["Art 74(1)(c)","المادة 74 (1) (ج)"]],[["Entity joins or leaves mid-year","انضمام كيان أو خروجه في منتصف السنة"],["Member if any part is consolidated line by line; only consolidated results; historical carrying values","عضو إذا وُحّد أي جزء منه بنداً بنداً؛ النتائج الموحدة فقط؛ والقيم الدفترية التاريخية"],["Art 75(1)","المادة 75 (1)"]],[["Share deal taxed locally like an asset deal","صفقة أسهم تخضع محلياً للضريبة كصفقة أصول"],["Treated as an acquisition or disposal of the assets and liabilities","تُعامل كاقتناء الأصول والالتزامات أو التصرف فيها"],["Art 75(2)","المادة 75 (2)"]],[["Asset sale","بيع أصول"],["Seller includes the gain or loss; buyer uses its carrying values","يدرج البائع المكسب أو الخسارة؛ ويستخدم المشتري قيمه الدفترية"],["Art 76(1)","المادة 76 (1)"]],[["DMT reorganisation","إعادة تنظيم لأغراض النظام"],["No gain or loss; buyer takes the seller's carrying values","لا مكسب ولا خسارة؛ ويأخذ المشتري القيم الدفترية للبائع"],["Art 76(2), Art 77","المادة 76 (2)، المادة 77"]]]},{"type":"tree","title":["Is this Saudi entity a joint venture?","هل هذا الكيان في المملكة مشروع مشترك؟"],"root":{"q":["Is it reported under the equity method in the UPE's consolidated statements?","هل يُعرض بطريقة حقوق الملكية في القوائم الموحدة للكيان الأم النهائي؟"],"no":{"end":["Not a joint venture","ليس مشروعاً مشتركاً"],"tone":"na"},"yes":{"q":["Does the UPE hold at least 50% of it, directly or indirectly?","هل يملك الكيان الأم النهائي 50% منه على الأقل، مباشرة أو غير مباشرة؟"],"no":{"end":["Not a joint venture","ليس مشروعاً مشتركاً"],"tone":"na"},"yes":{"q":["Is it an in-scope UPE, an excluded entity, an investment-type entity held through an excluded entity, held by a group of excluded entities only, or a JV subsidiary?","هل هو كيان أم نهائي خاضع، أو كيان مستبعد، أو كيان استثماري الطابع مملوك عبر كيان مستبعد، أو مملوك لمجموعة من كيانات مستبعدة فقط، أو كيان تابع لمشروع مشترك؟"],"yes":{"end":["Not a joint venture (Art 79(1)–(5))","ليس مشروعاً مشتركاً (المادة 79 (1)–(5))"],"tone":"out"},"no":{"end":["Joint venture: separate computation, joint liability with its subsidiaries","مشروع مشترك: احتساب مستقل، ومسؤولية تضامنية مع كياناته التابعة"],"tone":"in"}}}}}],"points":[{"h":["Each taxpayer, and the group jointly","كل مكلف، والمجموعة بالتضامن"],"t":["Each taxpayer is liable for the domestic top-up tax it owes. Taxpayers in the same MNE group are also jointly liable for the group's domestic top-up tax and related amounts in the Kingdom for the years in which they are group members.","كل مكلف مسؤول عن الضريبة التكميلية المحلية المستحقة عليه. والمكلفون في المجموعة نفسها متضامنون أيضاً في المسؤولية عن الضريبة التكميلية المحلية للمجموعة والمبالغ المرتبطة بها في المملكة عن السنوات التي يكونون فيها أعضاء في المجموعة."],"r":["73(1)","73(2)"]},{"h":["Joint ventures and partnerships","المشاريع المشتركة والشراكات"],"t":["Each Saudi joint venture and JV subsidiary is jointly liable for the JV group's top-up tax. Partners in a Saudi partnership that is part of an MNE group are jointly and severally liable for the group's tax in the Kingdom, except limited partners who are not general partners.","كل مشروع مشترك وكيان تابع له في المملكة متضامن في المسؤولية عن الضريبة التكميلية لمجموعة المشروع المشترك. والشركاء في شراكة في المملكة تنتمي إلى مجموعة متعددة الجنسيات متضامنون ومتكافلون في المسؤولية عن ضريبة المجموعة في المملكة، باستثناء الشريك الموصي الذي ليس شريكاً متضامناً."],"r":["73(3)","73(4)"]},{"h":["Limiting joint liability","قصر المسؤولية التضامنية"],"t":["With ZATCA's approval, joint liability for a fiscal year can be limited to one or more group entities.","يجوز بموافقة الهيئة قصر المسؤولية التضامنية عن سنة مالية على كيان أو أكثر من كيانات المجموعة."],"r":["73(5)"]},{"h":["Mergers and demergers and the €750m test","الاندماج والانفصال واختبار 750 مليون يورو"],"t":["After a merger, the threshold is met for a pre-merger year if the merging groups' combined revenue for that year reaches €750m; the same applies when a standalone entity joins. A demerged group meets it in the first year after the demerger if its own revenue that year is €750m or more, and in years two to four if it reaches €750m in at least two of the years after the demerger.","بعد الاندماج يتحقق الحد عن سنة ما قبل الاندماج إذا بلغ مجموع إيرادات المجموعات المندمجة لتلك السنة 750 مليون يورو، وكذلك عند انضمام كيان مستقل. وتستوفي المجموعة المنفصلة الحد في السنة الأولى بعد الانفصال إذا بلغت إيراداتها فيها 750 مليون يورو أو أكثر، وفي السنوات من الثانية إلى الرابعة إذا بلغت ذلك في سنتين على الأقل من السنوات التالية للانفصال."],"r":["74(1)","74(2)","74(3)"]},{"h":["Joining or leaving during the year","الانضمام أو الخروج خلال السنة"],"t":["A target is a member for the acquisition year if any of its results are consolidated line by line. Only the income, covered taxes and payroll in the consolidated statements count, tangible assets are prorated by time in the group, the target keeps its historical carrying values, and its deferred tax moves with it.","يكون الكيان المستهدف عضواً في سنة الاقتناء إذا وُحّد أي جزء من نتائجه بنداً بنداً. ولا يُحتسب إلا الدخل والضرائب المشمولة والرواتب الواردة في القوائم الموحدة، وتُحسب الأصول الملموسة تناسبياً بحسب مدة البقاء في المجموعة، ويحتفظ المستهدف بقيمه الدفترية التاريخية، وتنتقل ضرائبه المؤجلة معه."],"r":["75(1)"]},{"h":["Share deals treated as asset deals","صفقات الأسهم المعاملة كصفقات أصول"],"t":["Buying or selling a controlling interest is treated as buying or selling the assets and liabilities if the target's jurisdiction treats it that way and taxes the seller on the gain measured against the tax basis.","يُعامل شراء حصة مسيطرة أو بيعها كشراء الأصول والالتزامات أو بيعها إذا كانت ولاية المستهدف تعامله كذلك وتفرض ضريبة على البائع على المكسب مقارنة بالأساس الضريبي."],"r":["75(2)"]},{"h":["Asset transfers and DMT reorganisations","نقل الأصول وإعادة التنظيم"],"t":["On an ordinary transfer, the seller includes its gain or loss and the buyer uses its own carrying values. In a DMT reorganisation (mainly equity consideration, seller's gain not taxed in whole or part, buyer taking over the seller's tax basis), no gain or loss arises and the buyer takes the seller's carrying values, adjusted for any non-qualifying gain or loss.","في النقل العادي يدرج البائع مكسبه أو خسارته، ويستخدم المشتري قيمه الدفترية. أما في إعادة التنظيم (مقابل يغلب عليه حقوق الملكية، ومكسب البائع غير خاضع للضريبة كلياً أو جزئياً، والمشتري يأخذ الأساس الضريبي للبائع)، فلا ينشأ مكسب أو خسارة، ويأخذ المشتري القيم الدفترية للبائع معدلة بأي مكسب أو خسارة غير مؤهلة."],"r":["76(1)","76(2)","77"]},{"h":["Joint ventures are computed separately","تُحتسب المشاريع المشتركة بشكل مستقل"],"t":["A joint venture is an entity reported under the equity method in which the UPE holds at least 50%, subject to listed exceptions. A Saudi JV and its JV subsidiaries compute their top-up tax as if they were a separate MNE group with the JV as UPE.","المشروع المشترك كيان يُعرض بطريقة حقوق الملكية ويملك فيه الكيان الأم النهائي 50% على الأقل، مع استثناءات محددة. ويحتسب المشروع المشترك في المملكة وكياناته التابعة ضريبتهم التكميلية كأنهم مجموعة متعددة الجنسيات مستقلة يكون المشروع المشترك كيانها الأم النهائي."],"r":[78,79]},{"h":["Multi-parented groups","المجموعات متعددة الكيانات الأم"],"t":["Two or more groups whose UPEs form a stapled structure or a dual-listed arrangement, with at least one entity or PE in another jurisdiction, are treated as one multi-pa
