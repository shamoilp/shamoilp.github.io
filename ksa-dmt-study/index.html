nue test","فقط لأغراض اختبار الإيرادات"]],"a":1,"e":["Article 9(3). Its own income and taxes stay out of the computation, but entities it owns are tested on their own facts.","المادة 9 (3). يبقى دخله وضرائبه خارج الاحتساب، لكن الكيانات التي يملكها تُختبر وفق وقائعها."],"r":["9(3)"]}],"cards":[{"f":["The six excluded entities","الكيانات المستبعدة الستة"],"b":["Governmental Entity · International Organisation · Non-profit Organisation · Pension Fund · Investment Fund as UPE · REIV as UPE.","الكيان الحكومي · المنظمة الدولية · المنظمة غير الربحية · صندوق التقاعد · صندوق الاستثمار بصفته الكيان الأم النهائي · الأداة العقارية بصفتها الكيان الأم النهائي."],"r":["12(1)"]},{"f":["The 95% rule","قاعدة 95%"],"b":["≥95% of value held by excluded entities (not via a pension services entity) + only holding assets or investing for them, or ancillary activity.","تملك الكيانات المستبعدة 95% على الأقل من القيمة (لا عبر كيان خدمات التقاعد) + لا نشاط إلا حيازة الأصول أو الاستثمار لها أو نشاط مساند."],"r":["12(2)"]},{"f":["The 85% rule","قاعدة 85%"],"b":["≥85% of value held by excluded entities + substantially all income is excluded dividends or excluded equity gains or losses.","تملك الكيانات المستبعدة 85% على الأقل من القيمة + كل الدخل تقريباً توزيعات أو مكاسب أو خسائر حقوق ملكية مستبعدة."],"r":["12(2)"]},{"f":["Opting a 95% or 85% vehicle back in","إعادة أداة 95% أو 85% إلى الاحتساب"],"b":["Filing constituent entity's five-year election.","اختيار خمس سنوات من الكيان التابع المعين لتقديم الإقرار."],"r":["12(3)"]},{"f":["Five-Year Election","اختيار الخمس سنوات"],"b":["Locked for the election year and the next four; after revocation, no new election for the next four years.","ملزم لسنة الاختيار والسنوات الأربع التالية؛ وبعد الإلغاء لا اختيار جديد للسنوات الأربع التالية."],"r":[1]},{"f":["Governmental Entity: the four tests","الكيان الحكومي: الاختبارات الأربعة"],"b":["Government-owned · no trade or business, government or investment purpose · accountable with annual reporting · assets and earnings only to the government.","مملوك للحكومة · لا نشاط تجاري، وغرض حكومي أو استثماري · مساءلة مع تقارير سنوية · الأصول والأرباح للحكومة وحدها."],"r":[13]},{"f":["International Organisation","المنظمة الدولية"],"b":["Mainly governments · headquarters or similar agreement · income cannot benefit private persons.","تتألف أساساً من حكومات · اتفاقية مقر أو ما يماثلها · لا يعود دخلها بالنفع على أشخاص خاصين."],"r":[14]},{"f":["When is a charity not a Non-profit Organisation?","متى لا تكون الجمعية الخيرية منظمة غير ربحية؟"],"b":["When it carries on a trade or business not directly related to its purposes.","عندما تمارس تجارة أو نشاطاً لا يتصل مباشرة بأغراضها."],"r":["15(2)"]},{"f":["Pension Fund","صندوق التقاعد"],"b":["A pension services entity, or an entity providing retirement benefits that is regulated or whose benefits are protected by national regulations.","كيان خدمات التقاعد، أو كيان يقدم مزايا التقاعد ويخضع للتنظيم أو تحمي الأنظمة الوطنية مزاياه."],"r":[16]},{"f":["Investment Fund: three of the seven tests","صندوق الاستثمار: ثلاثة من الاختبارات السبعة"],"b":["Pools assets from partly unconnected investors · defined investment policy · regulated and professionally managed.","يجمع أصولاً من مستثمرين بعضهم غير مرتبطين · سياسة استثمار محددة · خاضع للتنظيم وتديره جهة مهنية."],"r":[17]},{"f":["Real Estate Investment Vehicle","الأداة الاستثمارية العقارية"],"b":["Widely held, mainly immovable property, one level of tax, deferral of at most one year. Excluded only as UPE.","واسعة الملكية، تحوز أساساً ممتلكات غير منقولة، مستوى واحد من الضريبة، تأجيل لا يتجاوز سنة. لا تُستبعد إلا بصفتها الكيان الأم النهائي."],"r":[1,"12(1)"]},{"f":["Does exclusion pass down to subsidiaries?","هل ينتقل الاستبعاد إلى الشركات التابعة؟"],"b":["No. The excluded entity is not a constituent entity, but the companies it owns are tested on their own facts.","لا. الكيان المستبعد ليس كياناً تابعاً، لكن الشركات التي يملكها تُختبر وفق وقائعها."],"r":["9(3)"]}],"range":"1, 12–17"},{"id":5,"title":["DMT Income I: the starting point and core adjustments","دخل الضريبة (1): نقطة البداية والتعديلات الأساسية"],"goal":["Start from the right accounts, then make the core adjustments: taxes, dividends, equity gains, revaluation gains and policy-disallowed expenses.","البدء من الحسابات الصحيحة، ثم إجراء التعديلات الأساسية: الضرائب، وتوزيعات الأرباح، ومكاسب حقوق الملكية، ومكاسب إعادة التقييم، والمصاريف غير جائزة الحسم."],"parts":[3],"arts":[18,19,20,21,22,23,24,27],"time":35,"metaphor":{"title":["Filtering crude oil","تكرير النفط الخام"],"text":["Accounting profit is crude oil: valuable, but full of things the DMT engine cannot burn. Article 18 tells you which well to draw from (local audited accounts, if every Saudi entity has them on the group's year-end). Article 19 is the refinery: it filters out taxes (they are measured separately), dividends and equity gains already taxed elsewhere, and puts back expenses the law will not subsidise, such as bribes and large fines.\nWhat comes out of the refinery is DMT Income or Loss: the fuel the 15% gauge actually measures.","الربح المحاسبي نفط خام: ثمين، لكنه مليء بما لا يستطيع محرك ضريبة الحد الأدنى المحلي حرقه. تحدد المادة 18 البئر الذي تسحب منه (الحسابات المحلية المدققة إذا كانت لكل كيان في المملكة بنهاية السنة نفسها للمجموعة). والمادة 19 هي المصفاة: تستبعد الضرائب (فهي تُقاس بشكل منفصل)، وتوزيعات الأرباح ومكاسب حقوق الملكية التي خضعت للضريبة في مكان آخر، وتُعيد المصاريف التي لا يدعمها النظام، كالرشاوى والغرامات الكبيرة.\nوما يخرج من المصفاة هو دخل أو خسارة ضريبة الحد الأدنى المحلي: الوقود الذي يقيسه مؤشر 15% فعلاً."]},"anchors":[{"if":["You open a Saudi entity's DMT computation","تفتح احتساب ضريبة الحد الأدنى المحلي لكيان في المملكة"],"then":["Check first: do all Saudi entities have Saudi-standard accounts on the group's year-end, required by the Income Tax Law or audited? If yes, start there (Art 18(2))","تحقق أولاً: هل لدى كل الكيانات في المملكة حسابات وفق المعيار السعودي بنهاية سنة المجموعة، مطلوبة بموجب نظام ضريبة الدخل أو مدققة؟ إن كان نعم فابدأ منها (المادة 18 (2))"]},{"if":["The P&L shows a tax charge","تُظهر قائمة الدخل مصروف ضريبة"],"then":["Add back all covered taxes, current and deferred, and any DMT accrued; they feed the ETR numerator instead (Art 20)","أعد إضافة كل الضرائب المشمولة، الحالية والمؤجلة، وأي ضريبة حد أدنى محلي مستحقة؛ فمكانها بسط معدل الضريبة الفعلي (المادة 20)"]},{"if":["A dividend comes in","تُستلم توزيعات أرباح"],"then":["Ask: is it a short-term portfolio shareholding (<10%, held <1 year)? Only then does it stay in income (Art 21)","اسأل: هل هي حصة ملكية محدودة قصيرة الأجل (أقل من 10% ومحتفظ بها أقل من سنة)؟ عندها فقط تبقى في الدخل (المادة 21)"]},{"if":["You see fair value gains, equity-method profit or a gain on selling shares","ترى مكاسب قيمة عادلة أو ربحاً بطريقة حقوق الملكية أو مكسباً من بيع أسهم"],"then":["Exclude them unless the stake is a portfolio shareholding below 10% (Art 22)","استبعدها ما لم تكن الحصة حصة ملكية محدودة دون 10% (المادة 22)"]},{"if":["You see a fine, penalty or improper payment","ترى غرامة أو عقوبة أو دفعة غير مشروعة"],"then":["Add back bribes and illegal payments of any size, and fines of €50,000 or more (Art 27)","أعد إضافة الرشاوى والمدفوعات غير المشروعة أياً كان حجمها، والغرامات التي تبلغ 50,000 يورو أو أكثر (المادة 27)"]}],"diagrams":[{"type":"flow","title":["From accounting profit to DMT Income","من الربح المحاسبي إلى دخل ضريبة الحد الأدنى المحلي"],"nodes":[{"t":["Financial Accounting Net Income or Loss","صافي الدخل أو الخسارة المحاسبية"],"s":["local or group standard · Art 18","المعيار المحلي أو معيار المجموعة · المادة 18"]},{"t":["+ Net Taxes Expense","+ صافي المصاريف الضريبية"],"s":["Art 20","المادة 20"]},{"t":["− Excluded Dividends","− توزيعات الأرباح المستبعدة"],"s":["Art 21","المادة 21"]},{"t":["± Excluded Equity Gain or Loss","± مكاسب أو خسائر حقوق الملكية المستبعدة"],"s":["Art 22","المادة 22"]},{"t":["± Revaluation, FX, errors, pensions…","± إعادة التقييم والعملات والأخطاء والتقاعد…"],"s":["Arts 19, 24–29","المواد 19 و24–29"]},{"t":["+ Policy Disallowed Expenses","+ المصاريف غير جائزة الحسم"],"s":["Art 27","المادة 27"]},{"t":["= DMT Income or Loss","= دخل أو خسارة ضريبة الحد الأدنى المحلي"],"s":["per constituent entity","لكل كيان تابع"]}]},{"type":"table","title":["Dividends and share gains at a glance","توزيعات الأرباح ومكاسب الأسهم بنظرة سريعة"],"head":[["Stake","الحصة"],["Dividends","توزيعات الأرباح"],["Fair value and disposal gains","مكاسب القيمة العادلة والبيع"]],"rows":[[["10% or more (or equity-accounted)","10% أو أكثر (أو بطريقة حقوق الملكية)"],["Excluded","مستبعدة"],["Excluded (equity-method profit too)","مستبعدة (وكذلك ربح طريقة حقوق الملكية)"]],[["Below 10%, held 1 year or more","دون 10%، محتفظ بها سنة أو أكثر"],["Excluded, unless the five-year portfolio election is made","مستبعدة، ما لم يُجرَ اختيار الخمس سنوات للحصص المحدودة"],["Included","مُدرجة"]],[["Below 10%, held less than 1 year","دون 10%، محتفظ بها أقل من سنة"],["Included","مُدرجة"],["Included","مُدرجة"]]],"note":["Below 10% means a Portfolio Shareholding: rights to less than 10% of profits, capital, reserves or votes (Art 1).","دون 10% تعني حصة ملكية محدودة: حقوق في أقل من 10% من الأرباح أو رأس المال أو الاحتياطيات أو حقوق التصويت (المادة 1)."]}],"points":[{"h":["The starting point","نقطة البداية"],"t":["Each constituent entity's DMT Income or Loss is its Financial Accounting Net Income or Loss for the year, adjusted for the items in Articles 19 to 41.","دخل أو خسارة ضريبة الحد الأدنى المحلي لكل كيان تابع هو صافي دخله أو خسارته المحاسبية للسنة، معدلاً بالبنود الواردة في المواد من 19 إلى 41."],"r":["18(1)"]},{"h":["Local accounts first","الحسابات المحلية أولاً"],"t":["If every Saudi constituent entity keeps accounts under the Kingdom's authorised accounting standard on the same fiscal year as the group's consolidated statements, use those accounts, before intra-group eliminations. This applies where all of them must keep or use those accounts under the Income Tax Law, or the accounts are externally audited. Otherwise, another standard applies under conditions set by the Regulations.","إذا كان لكل كيان تابع في المملكة حسابات وفق المعايير المحاسبية المعتمدة في المملكة وبالسنة المالية نفسها للقوائم الموحدة للمجموعة، تُستخدم تلك الحسابات قبل استبعاد المعاملات داخل المجموعة. ويسري ذلك إذا كانت جميعها ملزمة بمسك تلك الحسابات أو استخدامها بموجب نظام ضريبة الدخل، أو كانت الحسابات مدققة تدقيقاً خارجياً. وفي غير ذلك يُطبق معيار آخر وفق شروط تحددها اللائحة."],"r":["18(2)","18(3)"]},{"h":["The adjustment list","قائمة التعديلات"],"t":["Net taxes expense; excluded dividends; excluded equity gain or loss; included revaluation method gain or loss; gains or losses on asset transfers excluded under Article 76; asymmetric FX gains or losses; policy disallowed expenses; prior period errors and accounting changes; accrued pension expense provided through a pension fund; bad debts in the Article 29 cases; and any other adjustment set by the Regulations.","صافي المصاريف الضريبية؛ وتوزيعات الأرباح المستبعدة؛ ومكاسب أو خسائر حقوق الملكية المستبعدة؛ والمكاسب أو الخسائر وفق طريقة إعادة التقييم؛ ومكاسب أو خسائر التصرف في الأصول والالتزامات المستبعدة بموجب المادة 76؛ ومكاسب أو خسائر العملات الأجنبية غير المتماثلة؛ والمصاريف غير جائزة الحسم؛ وأخطاء الفترات السابقة والتغيرات المحاسبية؛ ومصاريف التقاعد المستحقة المقدمة عبر صندوق تقاعد؛ والديون المعدومة في حالات المادة 29؛ وأي تعديلات أخرى تحددها اللائحة."],"r":["19(1)"]},{"h":["Net taxes expense","صافي المصاريف الضريبية"],"t":["Add back covered taxes accrued as an expense, current and deferred (including those on excluded income), any deferred tax asset for the year's loss, and any tax under this Law accrued as an expense. The ETR measures taxes separately, so they must not reduce the income they are measured against.","تُعاد إضافة الضرائب المشمولة المستحقة كمصروف، الحالية والمؤجلة (بما فيها تلك المتعلقة بالدخل المستبعد)، وأي أصل ضريبي مؤجل مرتبط بخسارة السنة، وأي ضريبة بموجب هذا النظام مستحقة كمصروف. فمعدل الضريبة الفعلي يقيس الضرائب بشكل منفصل، فلا يجوز أن تُنقص الدخل الذي تُقاس مقابله."],"r":[20]},{"h":["Excluded dividends","توزيعات الأرباح المستبعدة"],"t":["Dividends on ownership interests are excluded, except on a short-term portfolio shareholding (under 10% and held for less than a year at the distribution date) and on an investment entity under the Article 88 election. The filing entity can make a five-year election to include all dividends on portfolio shareholdings.","تُستبعد توزيعات الأرباح المتعلقة بحصص الملكية، باستثناء حصة الملكية المحدودة قصيرة الأجل (دون 10% ومحتفظ بها أقل من سنة في تاريخ التوزيع) والكيان الاستثماري الخاضع لاختيار المادة 88. ويجوز للكيان المعين لتقديم الإقرار إجراء اختيار خمس سنوات لإدراج جميع توزيعات الحصص المحدودة."],"r":[21]},{"h":["Excluded equity gain or loss","مكاسب أو خسائر حقوق الملكية المستبعدة"],"t":["Fair value changes and disposal gains or losses on ownership interests, and equity-method profit or loss, are excluded. Portfolio shareholdings are the exception for fair value and disposals: their gains stay in.","تُستبعد تغيرات القيمة العادلة ومكاسب أو خسائر التصرف في حصص الملكية، والربح أو الخسارة بطريقة حقوق الملكية. وتُستثنى الحصص المحدودة في القيمة العادلة والتصرف: فمكاسبها تبقى في الدخل."],"r":[22]},{"h":["The equity investment inclusion election","اختيار إدراج الاستثمار في حقوق الملكية"],"t":["A five-year election to include gains, losses and the related taxes on ownership interests where the tax system already taxes them (mark-to-market, deferred tax on revaluations, transparent entities, taxable disposals). It does not apply to portfolio shareholdings, and it cannot be revoked for an interest whose loss has been used.","اختيار خمس سنوات لإدراج المكاسب والخسائر والضرائب المرتبطة بها على حصص الملكية حين يفرض النظام الضريبي الضريبة عليها أصلاً (التقييم بسعر السوق، والضريبة المؤجلة على إعادة التقييم، والكيانات الشفافة، والتصرفات الخاضعة للضريبة). ولا ينطبق على الحصص المحدودة، ولا يجوز إلغاؤه لحصة استُخدمت خسارتها."],"r":[23]},{"h":["Revaluation gains","مكاسب إعادة التقييم"],"t":["Where property, plant and equipment is revalued to fair value through Other Comprehensive Income and never recycled to profit or loss, the net gain or loss (adjusted for associated covered taxes) is brought into DMT income.","حيث يُعاد تقييم العقارات والآلات والمعدات بالقيمة العادلة عبر الدخل الشامل الآخر دون إعادة تصنيفها لاحقاً إلى الربح أو الخسارة، يُدرج صافي المكسب أو الخسارة (معدلاً بالضرائب المشمولة المرتبطة) في الدخل."],"r":[24]},{"h":["Policy disallowed expenses","المصاريف غير جائزة الحسم"],"t":["Bribes, kickbacks and other illegal payments are added back whatever the amount. Fines and penalties are added back if they equal or exceed the riyal equivalent of €50,000.","تُعاد إضافة الرشاوى والعمولات غير المشروعة وسائر المدفوعات غير القانونية أياً كان مبلغها. وتُعاد إضافة الغرامات والعقوبات إذا ساوت أو تجاوزت ما يوازي 50,000 يورو بالريال."],"r":[27]}],"oecd":[{"t":["Article 18(2) uses the local accounting standard, as the OECD's February 2023 Administrative Guidance allows a QDMTT to do, so a Saudi computation can start from audited Saudi statutory accounts rather than the parent's consolidation package.","تستخدم المادة 18 (2) المعيار المحاسبي المحلي، كما تسمح الإرشادات الإدارية للمنظمة الصادرة في فبراير 2023م للضريبة التكميلية المحلية المؤهلة، فيمكن أن يبدأ الاحتساب في المملكة من الحسابات النظامية السعودية المدققة بدلاً من حزمة توحيد الكيان الأم."],"src":["OECD Administrative Guidance, February 2023 (QDMTT accounting standard)","الإرشادات الإدارية للمنظمة، فبراير 2023م (المعيار المحاسبي للضريبة التكميلية المحلية المؤهلة)"]},{"t":["The adjustment list mirrors GloBE Article 3.2.1. The draft adds bad debt releases (Art 29) and a catch-all for adjustments set by the Regulations.","تحاكي قائمة التعديلات المادة 3.2.1 من القواعد النموذجية، ويضيف المشروع الإعفاء من الديون (المادة 29) وبنداً عاماً للتعديلات التي تحددها اللائحة."],"src":["Model Rules Art 3.2.1","القواعد النموذجية: المادة 3.2.1"]}],"reflect":{"ref":["Al-Isra 17:35","الإسراء: 35"],"ayah":"وأوفوا الكيل إذا كلتم وزنوا بالقسطاس المستقيم","t":["Give full measure when you measure, and weigh with an even balance. The adjustments exist so the measure is true: taxes are not counted twice, income already taxed elsewhere is not taxed again, and a fine is not allowed to lower the bill. Adjust both ways with the same care.","أوفوا الكيل إذا كلتم وزنوا بالميزان العادل. فالتعديلات وُجدت ليكون القياس صادقاً: لا تُحتسب الضرائب مرتين، ولا يُخضع للضريبة مجدداً دخلٌ خضع لها في مكان آخر، ولا يُسمح لغرامة أن تُنقص المستحق. فاضبط التعديلات في الاتجاهين بالعناية نفسها."]},"cases":[{"t":["From net profit to DMT Income","من صافي الربح إلى دخل ضريبة الحد الأدنى المحلي"],"facts":["Najd Trading's FY2027 profit after tax is SAR 40m. The P&L includes:\n• Current tax SAR 8m and deferred tax SAR 1m (all covered taxes)\n• Dividend of SAR 3m and a fair value gain of SAR 1.5m on a 30% stake carried at fair value\n• Equity-method share of a joint venture's profit: SAR 2m\n• Dividend of SAR 0.4m on a 2% stake held for three years\n• Dividend of SAR 0.2m on a 5% stake bought six months ago\nNo portfolio dividend election has been made.","صافي ربح شركة نجد التجارية بعد الضريبة للسنة المالية 2027م يبلغ 40 مليون ريال. وتتضمن قائمة الدخل:\n• ضريبة حالية 8 ملايين ريال وضريبة مؤجلة مليون ريال (كلها ضرائب مشمولة)\n• توزيعات 3 ملايين ريال ومكسب قيمة عادلة 1.5 مليون ريال على حصة 30% مقيمة بالقيمة العادلة\n• حصة من ربح مشروع مشترك بطريقة حقوق الملكية: مليونا ريال\n• توزيعات 0.4 مليون ريال على حصة 2% محتفظ بها ثلاث سنوات\n• توزيعات 0.2 مليون ريال على حصة 5% اشتُريت قبل ستة أشهر\nولم يُجرَ اختيار توزيعات الحصص المحدودة."],"steps":[{"t":["Add back net taxes expense (current + deferred covered taxes).","أعد إضافة صافي المصاريف الضريبية (الضرائب المشمولة الحالية والمؤجلة)."],"x":"40000000+8000000+1000000","v":49000000,"u":"SAR"},{"t":["Remove excluded dividends: the 30% stake (SAR 3m) and the long-held 2% stake (SAR 0.4m).","استبعد توزيعات الأرباح المستبعدة: حصة 30% (3 ملايين) وحصة 2% طويلة الأجل (0.4 مليون)."],"x":"49000000-3000000-400000","v":45600000,"u":"SAR"},{"t":["Remove excluded equity gains: the JV's equity-method profit (SAR 2m) and the fair value gain on the 30% stake (SAR 1.5m).","استبعد مكاسب حقوق الملكية المستبعدة: ربح المشروع المشترك بطريقة حقوق الملكية (مليونان) ومكسب القيمة العادلة على حصة 30% (1.5 مليون)."],"x":"45600000-2000000-1500000","v":42100000,"u":"SAR"},{"t":["Keep the SAR 0.2m dividend on the 5% stake held six months: a short-term portfolio shareholding.","أبقِ توزيعات 0.2 مليون ريال على حصة 5% المحتفظ بها ستة أشهر: حصة ملكية محدودة قصيرة الأجل."]}],"ans":["DMT Income is SAR 42.1m. The SAR 9m of covered taxes is not lost: it becomes the starting point for adjusted covered taxes in the ETR (Module 8).","دخل ضريبة الحد الأدنى المحلي 42.1 مليون ريال. ولا تضيع الضرائب المشمولة البالغة 9 ملايين ريال، بل تصبح نقطة البداية للضرائب المشمولة المعدلة في معدل الضريبة الفعلي (الوحدة 8)."],"r":[20,21,22]},{"t":["Statutory accounts or the consolidation package?","الحسابات النظامية أم حزمة التوحيد؟"],"facts":["A group reports under IFRS with a December year-end. Its three Saudi entities each prepare audited statutory accounts under the Kingdom's authorised standard, also to December. For FY2027 one entity's statutory profit is SAR 25m, while its consolidation package shows SAR 24.2m because of a different provisioning policy. Before consolidation eliminations.","تعد مجموعة قوائمها وفق المعايير الدولية للتقرير المالي بنهاية سنة في ديسمبر. ولكل من كياناتها الثلاثة في المملكة حسابات نظامية مدققة وفق المعايير المعتمدة في المملكة، بنهاية ديسمبر أيضاً. وللسنة المالية 2027م يبلغ الربح النظامي لأحد الكيانات 25 مليون ريال، بينما تُظهر حزمة التوحيد 24.2 مليون ريال بسبب اختلاف سياسة المخصصات. والأرقام قبل استبعادات التوحيد."],"steps":[{"t":["Do all Saudi entities have accounts under the Kingdom's standard on the same fiscal year as the consolidated statements? Yes, all to December.","هل لدى جميع الكيانات في المملكة حسابات وفق معيار المملكة بالسنة المالية نفسها للقوائم الموحدة؟ نعم، كلها بنهاية ديسمبر."]},{"t":["Is one of the conditions met (required under the Income Tax Law, or externally audited)? Yes, they are audited.","هل تحقق أحد الشرطين (الإلزام بموجب نظام ضريبة الدخل أو التدقيق الخارجي)؟ نعم، فهي مدققة."]},{"t":["So start from statutory profit, before intra-group eliminations. Difference from the package:","فنبدأ من الربح النظامي قبل استبعاد المعاملات داخل المجموعة. الفرق عن الحزمة:"],"x":"25000000-24200000","v":800000,"u":"SAR"}],"ans":["The starting point is SAR 25m, the statutory figure. If any one of the three Saudi entities had a March year-end, the condition would fail for all of them, and the Regulations would set which other standard applies.","نقطة البداية 25 مليون ريال، أي الرقم النظامي. ولو كانت نهاية سنة أحد الكيانات الثلاثة في مارس لفشل الشرط بالنسبة لها جميعاً، ولحددت اللائحة المعيار الآخر الواجب التطبيق."],"r":["18(2)","18(3)"]},{"t":["Fines, bribes and the €50,000 line","الغرامات والرشاوى وحد 50,000 يورو"],"facts":["In FY2027 a Saudi entity expensed:\n• Municipal and traffic fines: SAR 120,000 in total\n• One competition-authority penalty: SAR 2,000,000\n• A facilitation payment to an official, unlawful under the applicable law: SAR 50,000\nAssume €1 = SAR 4.2 for this case.","في السنة المالية 2027م قيّد كيان في المملكة كمصروف:\n• غرامات بلدية ومرورية: 120,000 ريال إجمالاً\n• عقوبة واحدة من هيئة المنافسة: 2,000,000 ريال\n• دفعة تسهيل لموظف، غير مشروعة وفق النظام المطبق: 50,000 ريال\nافترض أن اليورو = 4.2 ريال لهذه الحالة."],"steps":[{"t":["The €50,000 threshold in riyals:","حد 50,000 يورو بالريال:"],"x":"50000*4.2","v":210000,"u":"SAR"},{"t":["Fines totalling SAR 120,000 are below the threshold: they stay deducted.","الغرامات البالغة 120,000 ريال دون الحد: تبقى مخصومة."]},{"t":["The SAR 2m penalty exceeds it, and the facilitation payment is illegal whatever its size. Add both back:","عقوبة المليوني ريال تتجاوزه، ودفعة التسهيل غير مشروعة أياً كان حجمها. أعد إضافتهما:"],"x":"2000000+50000","v":2050000,"u":"SAR"}],"ans":["Add back SAR 2,050,000 as policy disallowed expenses. The small fines remain deductible. The bribe is added back even though it is far below €50,000: the threshold only applies to fines and penalties.","تُعاد إضافة 2,050,000 ريال كمصاريف غير جائزة الحسم. وتبقى الغرامات الصغيرة قابلة للحسم. وتُعاد إضافة الرشوة رغم أنها أقل بكثير من 50,000 يورو، لأن الحد لا ينطبق إلا على الغرامات والعقوبات."],"r":[27]}],"quiz":[{"q":["What is the starting point for a constituent entity's DMT Income or Loss?","ما نقطة البداية لدخل أو خسارة ضريبة الحد الأدنى المحلي للكيان التابع؟"],"o":[["Its taxable income under the Income Tax Law","دخله الخاضع للضريبة وفق نظام ضريبة الدخل"],["Its Financial Accounting Net Income or Loss for the year, adjusted under Articles 19 to 41","صافي دخله أو خسارته المحاسبية للسنة، معدلاً وفق المواد 19 إلى 41"],["Its Zakat base","وعاؤه الزكوي"],["Its revenue","إيراداته"]],"a":1,"e":["Article 18(1). The DMT is accounts-based: taxable income and the Zakat base are not the starting point.","المادة 18 (1). تقوم الضريبة على الحسابات المحاسبية: فلا الدخل الخاضع للضريبة ولا الوعاء الزكوي نقطة البداية."],"r":["18(1)"]},{"q":["When must the Saudi local accounts be used as the starting point?","متى يجب استخدام الحسابات المحلية السعودية نقطةً للبداية؟"],"o":[["Whenever any Saudi entity has local accounts","كلما كان لأي كيان في المملكة حسابات محلية"],["When all Saudi entities have accounts under the Kingdom's authorised standard on the group's fiscal year, and they are required under the Income Tax Law or externally audited","عندما يكون لجميع الكيانات في المملكة حسابات وفق المعيار المعتمد في المملكة بالسنة المالية للمجموعة، وتكون مطلوبة بموجب نظام ضريبة الدخل أو مدققة خارجياً"],["Only if ZATCA requests it","فقط إذا طلبت الهيئة ذلك"],["Never; the consolidation package always applies","أبداً؛ فحزمة التوحيد تُطبق دائماً"]],"a":1,"e":["Article 18(2). If the conditions are not met, another standard applies under conditions in the Regulations (Art 18(3)).","المادة 18 (2). فإن لم تتحقق الشروط، يُطبق معيار آخر وفق شروط تحددها اللائحة (المادة 18 (3))."],"r":["18(2)","18(3)"]},{"q":["Which of these is NOT on the Article 19(1) adjustment list?","أي مما يلي ليس في قائمة التعديلات بالمادة 19 (1)؟"],"o":[["Net Taxes Expense","صافي المصاريف الضريبية"],["Policy Disallowed Expenses","المصاريف غير جائزة الحسم"],["Accrued pension expense provided through a Pension Fund","مصاريف التقاعد المستحقة المقدمة عبر صندوق تقاعد"],["Depreciation expense","مصروف الاستهلاك"]],"a":3,"e":["Depreciation follows the accounts; it is not an Article 19 adjustment. The list also covers dividends, equity gains, revaluation gains, FX, prior period errors, bad debts and anything the Regulations add.","يتبع الاستهلاك الحسابات وليس من تعديلات المادة 19. وتشمل القائمة أيضاً التوزيعات ومكاسب حقوق الملكية وإعادة التقييم والعملات وأخطاء الفترات السابقة والديون المعدومة وما تضيفه اللائحة."],"r":["19(1)"]},{"q":["Why is Net Taxes Expense added back?","لماذا يُعاد إضافة صافي المصاريف الضريبية؟"],"o":[["To increase the tax","لزيادة الضريبة"],["Because covered taxes are measured separately in the ETR numerator; deducting them from income would double count","لأن الضرائب المشمولة تُقاس بشكل منفصل في بسط معدل الضريبة الفعلي، وخصمها من الدخل يعني احتسابها مرتين"],["Because taxes are not real expenses","لأن الضرائب ليست مصاريف حقيقية"],["Only deferred tax is added back","تُعاد إضافة الضريبة المؤجلة فقط"]],"a":1,"e":["Article 20: covered taxes accrued as an expense (current and deferred), deferred tax assets for the year's loss, and DMT accrued as an expense are all reversed out of income.","المادة 20: تُستبعد من الدخل الضرائب المشمولة المستحقة كمصروف (الحالية والمؤجلة)، والأصول الضريبية المؤجلة لخسارة السنة، وضريبة الحد الأدنى المحلي المستحقة كمصروف."],"r":[20]},{"q":["A dividend is received on a 6% stake bought four months ago. How is it treated?","استُلمت توزيعات على حصة 6% اشتُريت قبل أربعة أشهر. كيف تُعامل؟"],"o":[["Excluded","مستبعدة"],["Included in DMT income: it is a short-term portfolio shareholding","مدرجة في الدخل: فهي حصة ملكية محدودة قصيرة الأجل"],["Half included","يُدرج نصفها"],["Treated as a covered tax","تُعامل كضريبة مشمولة"]],"a":1,"e":["Article 21(1)(a) and (3): a portfolio shareholding (under 10%) held for less than one year at the distribution date is short-term, so its dividends are not excluded.","المادة 21 (1) (أ) و(3): الحصة المحدودة (دون 10%) المحتفظ بها أقل من سنة في تاريخ التوزيع قصيرة الأجل، فلا تُستبعد توزيعاتها."],"r":["21(1)","21(3)"]},{"q":["A dividend is received on an 8% stake held for three years, and no election has been made. How is it treated?","استُلمت توزيعات على حصة 8% محتفظ بها ثلاث سنوات، ولم يُجرَ أي اختيار. كيف تُعامل؟"],"o":[["Included, because it is under 10%","مدرجة لأنها دون 10%"],["Excluded, because it is not a short-term portfolio shareholding","مستبعدة لأنها ليست حصة محدودة قصيرة الأجل"],["Included only if the payer is Saudi","مدرجة فقط إذا كان الدافع سعودياً"],["It reduces covered taxes","تخفض الضرائب المشمولة"]],"a":1,"e":["Article 21(1): only short-term portfolio shareholdings (and Art 88 investment entities) are carved out of the exclusion. The filing entity could include all portfolio dividends by a five-year election (Art 21(2)).","المادة 21 (1): لا يُستثنى من الاستبعاد إلا الحصص المحدودة قصيرة الأجل (والكيانات الاستثمارية وفق المادة 88). ويجوز للكيان المعين إدراج جميع توزيعات الحصص المحدودة باختيار خمس سنوات (المادة 21 (2))."],"r":["21(1)","21(2)"]},{"q":["Which of these is an Excluded Equity Gain or Loss?","أي مما يلي من مكاسب أو خسائر حقوق الملكية المستبعدة؟"],"o":[["A gain on selling a 3% listed stake","مكسب بيع حصة مدرجة 3%"],["Equity-method profit from a 40% associate","ربح بطريقة حقوق الملكية من شركة زميلة 40%"],["Fair value gain on a 5% stake","مكسب قيمة عادلة على حصة 5%"],["Interest income","دخل الفوائد"]],"a":1,"e":["Article 22(1)(b): equity-method profit or loss is excluded. Fair value and disposal gains on portfolio shareholdings (under 10%) stay in income.","المادة 22 (1) (ب): يُستبعد الربح أو الخسارة بطريقة حقوق الملكية. أما مكاسب القيمة العادلة والبيع على الحصص المحدودة (دون 10%) فتبقى في الدخل."],"r":["22(1)"]},{"q":["Which statement about the equity investment inclusion election is true?","أي العبارات التالية صحيحة بشأن اختيار إدراج الاستثمار في حقوق الملكية؟"],"o":[["It is an annual election that covers portfolio shareholdings","اختيار سنوي يشمل الحصص المحدودة"],["It is a five-year election, it does not apply to portfolio shareholdings, and it cannot be revoked for an interest whose loss has been used","اختيار خمس سنوات لا ينطبق على الحصص المحدودة، ولا يجوز إلغاؤه لحصة استُخدمت خسارتها"],["It only removes income","يستبعد الدخل فقط"],["ZATCA makes it","تجريه الهيئة"]],"a":1,"e":["Article 23(3) and (4). Under the election the related current and deferred taxes are brought into adjusted covered taxes too (Art 23(2)).","المادة 23 (3) و(4). وبموجب الاختيار تُدرج أيضاً الضرائب الحالية والمؤجلة المرتبطة في الضرائب المشمولة المعدلة (المادة 23 (2))."],"r":["23(2)","23(3)","23(4)"]},{"q":["A Saudi company revalues its buildings upward through Other Comprehensive Income and never recycles the gain. What happens for the DMT?","أعادت شركة في المملكة تقييم مبانيها بالزيادة عبر الدخل الشامل الآخر دون إعادة تصنيف المكسب لاحقاً. ما الأثر لأغراض النظام؟"],"o":[["Nothing, it is outside profit or loss","لا شيء، فهو خارج الربح أو الخسارة"],["The net gain, adjusted for associated covered taxes, is included in DMT income","يُدرج صافي المكسب، معدلاً بالضرائب المشمولة المرتبطة، في الدخل"],["It reduces covered taxes","يخفض الضرائب المشمولة"],["It is an excluded equity gain","يُعد مكسب حقوق ملكية مستبعداً"]],"a":1,"e":["Article 24: the Included Revaluation Method Gain or Loss for property, plant and equipment is brought into income because it would otherwise never pass through profit or loss.","المادة 24: تُدرج المكاسب أو الخسائر وفق طريقة إعادة التقييم للعقارات والآلات والمعدات، لأنها لن تمر عبر الربح أو الخسارة بغير ذلك."],"r":[24]},{"q":["Which payments are Policy Disallowed Expenses?","أي المدفوعات تُعد مصاريف غير جائزة الحسم؟"],"o":[["All fines of any size","جميع الغرامات أياً كان حجمها"],["Illegal payments of any size, and fines and penalties of €50,000 or more (riyal equivalent)","المدفوعات غير المشروعة أياً كان حجمها، والغرامات والعقوبات التي تبلغ 50,000 يورو أو أكثر (بما يوازيها بالريال)"],["Only bribes above €50,000","الرشاوى التي تتجاوز 50,000 يورو فقط"],["Zakat","الزكاة"]],"a":1,"e":["Article 27(1)(a) and (b). The €50,000 threshold applies to fines and penalties, not to bribes or kickbacks.","المادة 27 (1) (أ) و(ب). ينطبق حد 50,000 يورو على الغرامات والعقوبات، لا على الرشاوى أو العمولات غير المشروعة."],"r":[27]},{"q":["What adjustment does Article 19 allow beyond the classic GloBE list?","ما التعديل الذي تسمح به المادة 19 خارج القائمة التقليدية لقواعد مكافحة تآكل الوعاء العالمي؟"],"o":[["Removing all foreign income","استبعاد جميع الدخل الأجنبي"],["Bad debt in the Article 29 cases, plus any other adjustment the Regulations set","الديون المعدومة في حالات المادة 29، وأي تعديلات أخرى تحددها اللائحة"],["Deducting Zakat from income","خصم الزكاة من الدخل"],["Ignoring deferred tax","تجاهل الضريبة المؤجلة"]],"a":1,"e":["Article 19(1)(j) and (k). The Regulations can therefore add adjustments, so watch for them.","المادة 19 (1) (ي) و(ك). وعليه يمكن أن تضيف اللائحة تعديلات، فتابعها."],"r":["19(1)"]},{"q":["A Saudi entity holds a 15% stake at fair value. Its value rises by SAR 4m. What is the DMT treatment?","يحوز كيان في المملكة حصة 15% بالقيمة العادلة، وارتفعت قيمتها بمقدار 4 ملايين ريال. ما معالجتها لأغراض النظام؟"],"o":[["Included in DMT income","تُدرج في الدخل"],["Excluded as an Excluded Equity Gain, unless the equity investment inclusion election applies","تُستبعد كمكسب حقوق ملكية مستبعد، ما لم ينطبق اختيار إدراج الاستثمار في حقوق الملكية"],["Taxed at 15% directly","تخضع لـ15% مباشرة"],["Deferred to disposal","تُؤجل حتى البيع"]],"a":1,"e":["Article 22(1)(a): fair value changes on an ownership interest that is not a portfolio shareholding are excluded. Article 23 lets the group bring them in where the tax system already taxes them.","المادة 22 (1) (أ): تُستبعد تغيرات القيمة العادلة لحصة ملكية ليست حصة محدودة. وتسمح المادة 23 للمجموعة بإدراجها حين يفرض النظام الضريبي الضريبة عليها أصلاً."],"r":["22(1)",23]}],"cards":[{"f":["Starting point of DMT Income or Loss","نقطة بداية دخل أو خسارة الضريبة"],"b":["Financial Accounting Net Income or Loss for the year, adjusted under Articles 19–41.","صافي الدخل أو الخسارة المحاسبية للسنة، معدلاً وفق المواد 19–41."],"r":["18(1)"]},{"f":["When do Saudi local accounts apply?","متى تُطبق الحسابات المحلية السعودية؟"],"b":["All Saudi entities on the Kingdom's standard and the group's fiscal year, and either required by the Income Tax Law or externally audited.","جميع الكيانات في المملكة وفق معيار المملكة وبالسنة المالية للمجموعة، ومطلوبة بموجب نظام ضريبة الدخل أو مدققة خارجياً."],"r":["18(2)"]},{"f":["Local accounts are taken…","تُعتمد الحسابات المحلية…"],"b":["Before consolidation adjustments that eliminate intra-group transactions.","قبل تعديلات التوحيد التي تستبعد المعاملات داخل المجموعة."],"r":["18(2)"]},{"f":["Net Taxes Expense includes","يشمل صافي المصاريف الضريبية"],"b":["Covered taxes expensed (current and deferred), deferred tax assets for the year's loss, and DMT accrued as an expense.","الضرائب المشمولة المقيدة كمصروف (الحالية والمؤجلة)، والأصول الضريبية المؤجلة لخسارة السنة، والضريبة المستحقة بموجب النظام كمصروف."],"r":[20]},{"f":["Excluded Dividends: the two exceptions","توزيعات الأرباح المستبعدة: الاستثناءان"],"b":["Short-term portfolio shareholdings, and investment entities under the Article 88 election.","الحصص المحدودة قصيرة الأجل، والكيانات الاستثمارية الخاضعة لاختيار المادة 88."],"r":["21(1)"]},{"f":["Short-term Portfolio Shareholding","حصة الملكية المحدودة قصيرة الأجل"],"b":["Under 10% and economically held for less than one year at the distribution date.","دون 10% ومحتفظ بها اقتصادياً أقل من سنة في تاريخ التوزيع."],"r":["21(3)",1]},{"f":["Portfolio dividend election","اختيار توزيعات الحصص المحدودة"],"b":["Five-year election to include all dividends on portfolio shareholdings.","اختيار خمس سنوات لإدراج جميع توزيعات الحصص المحدودة."],"r":["21(2)"]},{"f":["Excluded Equity Gain or Loss","مكاسب أو خسائر حقوق الملكية المستبعدة"],"b":["Fair value and disposal gains or losses on non-portfolio interests, and equity-method profit or loss.","مكاسب أو خسائر القيمة العادلة والبيع على الحصص غير المحدودة، والربح أو الخسارة بطريقة حقوق الملكية."],"r":[22]},{"f":["Equity investment inclusion election","اختيار إدراج الاستثمار في حقوق الملكية"],"b":["Five-year; brings in gains, losses and related taxes on non-portfolio interests already taxed locally; locked once a loss is used.","خمس سنوات؛ يُدرج المكاسب والخسائر والضرائب المرتبطة على الحصص غير المحدودة الخاضعة للضريبة محلياً؛ ويصبح ملزماً بعد استخدام خسارة."],"r":[23]},{"f":["Included Revaluation Method Gain or Loss","المكاسب أو الخسائر وفق طريقة إعادة التقييم"],"b":["PP&E revaluation through OCI that is never recycled: included, net of associated covered taxes.","إعادة تقييم العقارات والآلات والمعدات عبر الدخل الشامل الآخر دون إعادة تصنيف: تُدرج صافيةً من الضرائب المشمولة المرتبطة."],"r":[24]},{"f":["Policy Disallowed Expenses","المصاريف غير جائزة الحسم"],"b":["Illegal payments (any amount) and fines or penalties of €50,000 or more in riyal terms.","المدفوعات غير المشروعة (أياً كان مبلغها) والغرامات أو العقوبات التي تبلغ 50,000 يورو أو أكثر بما يوازيها بالريال."],"r":[27]},{"f":["Who decides extra adjustments?","من يحدد التعديلات الإضافية؟"],"b":["The Regulations, under Article 19(1)(k).","اللائحة، بموجب المادة 19 (1) (ك)."],"r":["19(1)"]}],"range":"18–24, 27"},{"id":6,"title":["DMT Income II: special adjustments and elections","دخل الضريبة (2): التعديلات الخاصة والاختيارات"],"goal":["Handle the special adjustments (FX, prior-period errors, arm's length, tax credits, intragroup financing) and know when each election helps and what it locks in.","معالجة التعديلات الخاصة (العملات، وأخطاء الفترات السابقة، ومبدأ السعر المحايد، والائتمانات الضريبية، والتمويل داخل المجموعة) ومعرفة متى يفيد كل اختيار وما الذي يُلزم به."],"parts":[3],"arts":[25,26,28,29,30,31,32,33,34,35],"time":40,"metaphor":{"title":["Gears on the gearbox","تروس علبة السرعات"],"text":["Module 5 was the engine; this module is the gearbox. Some gears are automatic: arm's length corrections, asymmetric FX, the intragroup financing brake. Others are gears you choose: five-year elections that stay engaged for five years, and annual elections you can change each year.\nChoose a gear for the road ahead, not just the next bend. A five-year election that saves tax this year can cost more in years two to five.","كانت الوحدة الخامسة هي المحرك، وهذه الوحدة هي علبة السرعات. بعض التروس آلية: تصحيحات السعر المحايد، والعملات غير المتماثلة، وكابح التمويل داخل المجموعة. وبعضها تختاره بنفسك: اختيارات خمس سنوات تبقى معشّقة خمس سنوات، واختيارات سنوية يمكن تغييرها كل سنة.\nاختر الترس للطريق كله، لا للمنعطف القريب فقط. فاختيار الخمس سنوات الذي يوفّر ضريبة هذا العام قد يكلّف أكثر في السنوات من الثانية إلى الخامسة."]},"anchors":[{"if":["Two group entities in different countries record a transaction at different amounts or off arm's length","كيانان في المجموعة في دولتين مختلفتين يقيدان معاملة بمبلغين مختلفين أو بغير السعر المحايد"],"then":["Adjust it to the same amount and to arm's length for the DMT (Art 31(1))","عدّلها إلى المبلغ نفسه وإلى السعر المحايد لأغراض النظام (المادة 31 (1))"]},{"if":["The entity gets a tax credit","يحصل الكيان على ائتمان ضريبي"],"then":["Refundable in cash within 4 years, or marketable and transferable? Treat it as income. Otherwise it reduces covered taxes (Arts 32, 46)","هل يُسترد نقداً خلال 4 سنوات، أو هو قابل للتسويق والتحويل؟ عامله كدخل. وإلا فهو يخفض الضرائب المشمولة (المادتان 32 و46)"]},{"if":["Opening equity changes because of an error fix or a policy change","تتغير حقوق الملكية الافتتاحية بسبب تصحيح خطأ أو تغيير سياسة"],"then":["Bring it into this year's DMT income, unless it cuts a covered tax liability by €1m or more (that goes to Art 52) (Art 28)","أدرجه في دخل هذه السنة، ما لم يخفض التزام ضريبة مشمولة بمليون يورو أو أكثر (فيُعالج وفق المادة 52) (المادة 28)"]},{"if":["Saudi land or buildings are sold at a big gain","بيعت أراضٍ أو مبانٍ في المملكة بمكسب كبير"],"then":["Consider the annual aggregate asset gain election to spread the gain over 5 years (Art 34)","فكّر في الاختيار السنوي لمكاسب الأصول المجمعة لتوزيع المكسب على 5 سنوات (المادة 34)"]},{"if":["A low-taxed Saudi entity pays interest to a group lender that is not taxed on it","كيان منخفض الضريبة في المملكة يدفع فوائد لمقرض في المجموعة لا يخضع للضريبة عليها"],"then":["Disallow the expense under the intragroup financing rule (Art 35)","لا تسمح بالمصروف وفق قاعدة الترتيب التمويلي ضمن المجموعة (المادة 35)"]}],"diagrams":[{"type":"table","title":["The elections in Part 3","الاختيارات في الجزء الثالث"],"head":[["Election","الاختيار"],["Type","النوع"],["What it does","أثره"]],"rows":[[["Portfolio dividends (Art 21(2))","توزيعات الحصص المحدودة (المادة 21 (2))"],["Five-year","خمس سنوات"],["Includes all portfolio dividends","يُدرج جميع توزيعات الحصص المحدودة"]],[["Equity investment inclusion (Art 23)","إدراج الاستثمار في حقوق الملكية (المادة 23)"],["Five-year","خمس سنوات"],["Includes taxed equity gains and their taxes","يُدرج مكاسب حقوق الملكية الخاضعة للضريبة وضرائبها"]],[["FX on hedged ownership interests (Art 26)","العملات على حصص الملكية المحوّطة (المادة 26)"],["Five-year","خمس سنوات"],["Treats the FX as an excluded equity gain or loss","يعامل فروق العملة كمكسب أو خسارة حقوق ملكية مستبعدة"]],[["Debt release (Art 29)","الإعفاء من الديون (المادة 29)"],["Annual","سنوي"],["Excludes the release income and its taxes","يستبعد دخل الإعفاء وضرائبه"]],[["Stock-based compensation (Art 30)","التعويض على أساس الأسهم (المادة 30)"],["Five-year","خمس سنوات"],["Uses the tax-deductible amount instead of the book expense","يستخدم المبلغ القابل للحسم ضريبياً بدلاً من المصروف المحاسبي"]],[["Fair value or impairment (Art 33)","القيمة العادلة أو انخفاض القيمة (المادة 33)"],["Five-year","خمس سنوات"],["Uses the realisation principle","يستخدم مبدأ التحقق"]],[["Aggregate asset gain (Art 34)","مكاسب الأصول المجمعة (المادة 34)"],["Annual","سنوي"],["Spreads Saudi property gains over 5 years","يوزّع مكاسب العقارات في المملكة على 5 سنوات"]],[["Tax consolidation group (Art 36)","المجموعة الضريبية الموحدة (المادة 36)"],["Five-year","خمس سنوات"],["Eliminates transactions within a Saudi tax group","يستبعد المعاملات داخل مجموعة ضريبية في المملكة"]]],"note":["All these elections are made by the filing constituent entity.","يُجري جميع هذه الاختيارات الكيان التابع المعين لتقديم الإقرار."]}],"points":[{"h":["Asymmetric FX","العملات غير المتماثلة"],"t":["Where an entity's accounting and tax functional currencies differ, foreign exchange gains or losses that appear on only one side (or arise from a third currency) are adjusted so the DMT measures them consistently.","حين تختلف العملة الوظيفية المحاسبية عن العملة الوظيفية الضريبية للكيان، تُعدّل مكاسب أو خسائر العملات التي تظهر في جانب واحد فقط (أو تنشأ عن عملة ثالثة) لكي تقيسها الضريبة بشكل متسق."],"r":[25]},{"h":["Hedges of investments","تحوّط الاستثمارات"],"t":["Where the group hedges currency movements on ownership interests, the filing entity may make a five-year election to treat the FX gains or losses in an entity's accounts as excluded equity gains or losses.","حين تحوّط المجموعة تحركات العملة على حصص الملكية، يجوز للكيان المعين إجراء اختيار خمس سنوات لمعاملة مكاسب أو خسائر العملات في حسابات الكيان كمكاسب أو خسائر حقوق ملكية مستبعدة."],"r":[26]},{"h":["Prior period errors and accounting changes","أخطاء الفترات السابقة والتغيرات المحاسبية"],"t":["Changes in opening equity from correcting earlier errors, or from changes in accounting policy, are taken into the current year. An error correction that cuts a covered tax liability materially (the riyal equivalent of €1m or more) is dealt with under Article 52 instead.","تُدرج في السنة الحالية التغيرات في حقوق الملكية الافتتاحية الناتجة عن تصحيح أخطاء سابقة أو تغيير السياسات المحاسبية. أما تصحيح الخطأ الذي يخفض التزام ضريبة مشمولة تخفيضاً جوهرياً (ما يوازي مليون يورو أو أكثر) فيُعالج وفق المادة 52."],"r":[28,52]},{"h":["Debt releases","الإعفاء من الديون"],"t":["By an annual election, income from a bad debt release can be excluded from the borrower's DMT income, together with the related current and deferred tax, if the Regulations' conditions are met.","يجوز باختيار سنوي استبعاد دخل الإعفاء من الدين المعدوم من دخل الكيان المقترض، مع الضريبة الحالية والمؤجلة المرتبطة، إذا تحققت شروط اللائحة."],"r":[29]},{"h":["Stock-based compensation","التعويض على أساس الأسهم"],"t":["A five-year election substitutes the amount deductible for tax for the book expense, applied to all Saudi entities. If an option expires unexercised, the amount previously deducted comes back into income that year.","يستبدل اختيار خمس سنوات المصروف المحاسبي بالمبلغ القابل للحسم ضريبياً، ويُطبق على جميع الكيانات في المملكة. وإذا انقضى خيار دون ممارسة، يُعاد المبلغ المحسوم سابقاً إلى الدخل في تلك السنة."],"r":[30]},{"h":["Arm's length","مبدأ السعر المحايد"],"t":["Cross-border transactions between constituent entities must be recorded at the same amount on both sides and at arm's length. A loss on transferring an asset between two entities in the same jurisdiction is recomputed at arm's length if it enters DMT income.","يجب قيد المعاملات العابرة للحدود بين الكيانات التابعة بالمبلغ نفسه في الطرفين وبالسعر المحايد. وتُعاد احتساب الخسارة الناتجة عن نقل أصل بين كيانين في الولاية نفسها بالسعر المحايد إذا دخلت في الدخل."],"r":[31]},{"h":["Tax credits","الائتمانات الضريبية"],"t":["Qualified refundable tax credits (payable in cash or cash equivalents within four years) and marketable transferable tax credits are income. Any other credit is not income; it reduces covered taxes instead, which pushes the ETR down much harder.","الائتمانات الضريبية القابلة للاسترداد المؤهلة (المستحقة نقداً أو بما يعادله خلال أربع سنوات) والائتمانات القابلة للتسويق والتحويل تُعامل كدخل. وأي ائتمان آخر لا يُعد دخلاً، بل يخفض الضرائب المشمولة، فيُنزل معدل الضريبة الفعلي بشدة أكبر."],"r":[32,"46(1)"]},{"h":["Fair value and impairment","القيمة العادلة وانخفاض القيمة"],"t":["A five-year election lets the group use the realisation principle for assets and liabilities held at fair value or tested for impairment. It covers all Saudi entities unless the filing entity specifies otherwise.","يسمح اختيار خمس سنوات للمجموعة باستخدام مبدأ التحقق للأصول والالتزامات المقيسة بالقيمة العادلة أو الخاضعة لاختبار انخفاض القيمة. ويشمل جميع الكيانات في المملكة ما لم يحدد الكيان المعين غير ذلك."],"r":[33]},{"h":["Aggregate asset gains","مكاسب الأصول المجمعة"],"t":["When Saudi entities make a net gain on disposing of immovable property in the Kingdom (ignoring intra-group transfers), an annual election re-runs the look-back period (the election year and the four prior years): the gain first absorbs net asset losses of earlier loss years, and the rest is spread over the period. Earlier years are then recalculated under Article 63.","حين تحقق الكيانات في المملكة صافي مكسب من التصرف في ممتلكات غير منقولة في المملكة (دون التحويلات داخل المجموعة)، يعيد اختيار سنوي احتساب فترة المراجعة (سنة الاختيار والسنوات الأربع السابقة): يُقابَل المكسب أولاً بصافي خسائر الأصول في سنوات الخسارة السابقة، ويُوزَّع الباقي على الفترة. ثم يُعاد احتساب السنوات السابقة وفق المادة 63."],"r":[34,63]},{"h":["Intragroup financing","التمويل داخل المجموعة"],"t":["A low-tax entity cannot deduct expenses on a financing arrangement with a high-tax group counterparty if the arrangement is expected to raise the low-tax entity's expenses without a matching rise in the counterparty's taxable income.","لا يجوز للكيان منخفض الضريبة حسم مصاريف ترتيب تمويلي مع طرف مقابل مرتفع الضريبة في المجموعة إذا كان متوقعاً أن يزيد الترتيب مصاريف الكيان منخفض الضريبة دون زيادة مماثلة في الدخل الخاضع للضريبة لدى الطرف المقابل."],"r":[35]}],"oecd":[{"t":["Stock-based compensation, arm's length, qualified refundable credits, the fair value election, aggregate asset gains and intragroup financing follow GloBE Articles 3.2.2 to 3.2.7. Treating marketable transferable tax credits as income comes from the OECD's July 2023 Administrative Guidance.","تتبع أحكامُ التعويض على أساس الأسهم والسعر المحايد والائتمانات القابلة للاسترداد المؤهلة واختيار القيمة العادلة ومكاسب الأصول المجمعة والتمويل داخل المجموعة الموادَّ من 3.2.2 إلى 3.2.7 من القواعد النموذجية. أما معاملة الائتمانات القابلة للتسويق والتحويل كدخل فمصدرها الإرشادات الإدارية للمنظمة الصادرة في يوليو 2023م."],"src":["Model Rules Arts 3.2.2–3.2.7; OECD Administrative Guidance, July 2023","القواعد النموذجية: المواد 3.2.2–3.2.7؛ الإرشادات الإدارية للمنظمة، يوليو 2023م"]}],"reflect":{"ref":["Al-Ma'idah 5:1","المائدة: 1"],"ayah":"يا أيها الذين آمنوا أوفوا بالعقود","t":["O you who believe, fulfil your contracts. A five-year election is a commitment the group makes to the Authority, and the law holds it to it even when the numbers turn. Choose elections you can honour for the whole term.","يا أيها الذين آمنوا أوفوا بالعقود. واختيار الخمس سنوات التزام تقطعه المجموعة أمام الهيئة، ويُلزمها النظام به حتى لو تغيرت الأرقام. فاختر من الاختيارات ما تستطيع الوفاء به طوال مدته."]},"cases":[{"t":["Two credits, two very different ETRs","ائتمانان ومعدلان فعليان مختلفان جداً"],"facts":["A Saudi entity has DMT Income of SAR 100m and adjusted covered taxes of SAR 12m before any credit. It earns a SAR 5m investment tax credit. Compare two designs:\n(A) the credit is refundable in cash within three years (a qualified refundable tax credit);\n(B) the credit can only reduce tax payable and is not refundable or transferable.","لكيان في المملكة دخل قدره 100 مليون ريال وضرائب مشمولة معدلة قدرها 12 مليون ريال قبل أي ائتمان. ويحصل على ائتمان ضريبي استثماري قدره 5 ملايين ريال. قارن بين تصميمين:\n(أ) الائتمان قابل للاسترداد نقداً خلال ثلاث سنوات (ائتمان ضريبي قابل للاسترداد مؤهل)؛\n(ب) الائتمان لا يُستخدم إلا لتخفيض الضريبة المستحقة ولا يُسترد ولا يُحوَّل."],"steps":[{"t":["Design A: the credit is income, so DMT Income becomes:","التصميم (أ): الائتمان دخل، فيصبح الدخل:"],"x":"100000000+5000000","v":105000000,"u":"SAR"},{"t":["Design A ETR: taxes unchanged ÷ the larger income.","معدل التصميم (أ): الضرائب دون تغيير ÷ الدخل الأكبر."],"x":"12000000/105000000*100","v":11.43,"u":"%"},{"t":["Design B: the credit reduces covered taxes instead.","التصميم (ب): الائتمان يخفض الضرائب المشمولة بدلاً من ذلك."],"x":"12000000-5000000","v":7000000,"u":"SAR"},{"t":["Design B ETR:","معدل التصميم (ب):"],"x":"7000000/100000000*100","v":7,"u":"%"}],"ans":["The same SAR 5m credit leaves the ETR at 11.43% if it is a qualified refundable credit, but drops it to 7% if it is not. That is why incentive design matters so much under a minimum tax: refundable or transferable credits hold up the ETR.","يُبقي الائتمان نفسه البالغ 5 ملايين ريال المعدلَ الفعلي عند 11.43% إذا كان ائتماناً قابلاً للاسترداد مؤهلاً، لكنه يُنزله إلى 7% إذا لم يكن كذلك. ولهذا يهم تصميم الحوافز كثيراً في ظل ضريبة الحد الأدنى: فالائتمانات القابلة للاسترداد أو التحويل تحافظ على المعدل الفعلي."],"r":[32,"46(1)"]},{"t":["Spreading a property gain","توزيع مكسب عقاري"],"facts":["In FY2031 the group's Saudi entities sell buildings in the Kingdom to third parties for a net gain of SAR 50m. In FY2029 they had a net loss of SAR 10m on property disposals (a loss year). The filing entity makes the aggregate asset gain election for FY2031. Assume the remaining gain is spread evenly, as the Model Rules do; the draft leaves the details to the Regulations.","في السنة المالية 2031م باعت كيانات المجموعة في المملكة مباني داخل المملكة لأطراف ثالثة بصافي مكسب قدره 50 مليون ريال. وفي السنة المالية 2029م كان لديها صافي خسارة قدرها 10 ملايين ريال من التصرف في عقارات (سنة خسارة). ويُجري الكيان المعين اختيار مكاسب الأصول المجمعة للسنة المالية 2031م. افترض أن المكسب المتبقي يُوزَّع بالتساوي كما في القواعد النموذجية، إذ يترك المشروع التفاصيل للائحة."],"steps":[{"t":["Look-back period: the election year and the four prior years, FY2027 to FY2031.","فترة المراجعة: سنة الاختيار والسنوات الأربع السابقة، من 2027م إلى 2031م."],"x":"2031-4","v":2027,"u":"yr"},{"t":["First set the gain against FY2029's net asset loss. Adjusted asset gain left:","قابل المكسب أولاً بصافي خسارة الأصول في 2029م. مكسب الأصول المعدل المتبقي:"],"x":"50000000-10000000","v":40000000,"u":"SAR"},{"t":["Spread the rest over the five years of the look-back period:","وزّع الباقي على السنوات الخمس لفترة المراجعة:"],"x":"40000000/5","v":8000000,"u":"SAR"}],"ans":["FY2031 keeps only SAR 8m of the gain; SAR 8m goes to each earlier year and FY2029's loss is wiped out. ETRs and top-up for FY2027–FY2030 are recalculated, and any extra tax is collected as additional current top-up tax under Article 63. The election helps when the earlier years had spare covered taxes.","لا يبقى في 2031م إلا 8 ملايين ريال من المكسب؛ ويُخصص لكل سنة سابقة 8 ملايين ريال وتُمحى خسارة 2029م. ويُعاد احتساب المعدلات الفعلية والضريبة التكميلية للسنوات من 2027م إلى 2030م، وتُحصَّل أي ضريبة إضافية كضريبة تكميلية حالية إضافية وفق المادة 63. ويفيد الاختيار حين يكون في السنوات السابقة ضرائب مشمولة فائضة."],"r":[34,63]},{"t":["The loan that the lender does not pay tax on","القرض الذي لا يدفع المقرض ضريبة عليه"],"facts":["Gulf Assembly (Saudi) has DMT Income of SAR 30m and adjusted covered taxes of SAR 2.7m, so the Kingdom ETR is 9%. It pays SAR 6m interest to a group finance company in Country H, which has a 25% tax rate but treats the instrument as equity and exempts the return. The arrangement was expected to work this way from the start.","لشركة الخليج للتجميع (في المملكة) دخل قدره 30 مليون ريال وضرائب مشمولة معدلة قدرها 2.7 مليون ريال، فمعدل المملكة الفعلي 9%. وتدفع 6 ملايين ريال فوائد لشركة تمويل في المجموعة في الدولة (هـ)، التي يبلغ سعر ضريبتها 25% لكنها تعامل الأداة كحقوق ملكية وتعفي العائد. وكان متوقعاً منذ البداية أن يعمل الترتيب بهذه الطريقة."],"steps":[{"t":["Gulf Assembly is a low-tax entity (Kingdom ETR below 15%); the lender is a high-tax counterparty. Its taxable income does not rise with the interest.","شركة الخليج للتجميع كيان منخفض الضريبة (معدل المملكة دون 15%)، والمقرض طرف مقابل مرتفع الضريبة لا يزيد دخله الخاضع للضريبة بالفوائد."]},{"t":["Exclude the SAR 6m interest expense, so DMT Income becomes:","استبعد مصروف الفوائد البالغ 6 ملايين ريال، فيصبح الدخل:"],"x":"30000000+6000000","v":36000000,"u":"SAR"},{"t":["New ETR, with covered taxes unchanged:","المعدل الفعلي الجديد مع بقاء الضرائب المشمولة:"],"x":"2700000/36000000*100","v":7.5,"u":"%"},{"t":["Top-up percentage rises from 6% to:","ترتفع نسبة الضريبة التكميلية من 6% إلى:"],"x":"15-7.5","v":7.5,"u":"%"}],"ans":["The interest is disallowed for the DMT: income rises to SAR 36m and the top-up percentage from 6% to 7.5%. The rule stops a group from shifting deductions into a low-taxed Saudi entity through an instrument that creates no matching taxable income elsewhere.","لا يُسمح بالفوائد لأغراض النظام: يرتفع الدخل إلى 36 مليون ريال وترتفع نسبة الضريبة التكميلية من 6% إلى 7.5%. وتمنع القاعدة المجموعة من نقل الحسومات إلى كيان منخفض الضريبة في المملكة عبر أداة لا تُنشئ دخلاً خاضعاً للضريبة مقابلاً في مكان آخر."],"r":[35,53,54]}],"quiz":[{"q":["What are Asymmetric Foreign Currency Gains or Losses?","ما مكاسب أو خسائر العملات الأجنبية غير المتماثلة؟"],"o":[["Any FX loss over €1m","أي خسارة عملات تتجاوز مليون يورو"],["FX gains or losses of an entity whose accounting and tax functional currencies differ, recognised on one side only or arising from a third currency","مكاسب أو خسائر عملات لكيان تختلف عملته الوظيفية المحاسبية عن الضريبية، تظهر في جانب واحد فقط أو تنشأ عن عملة ثالثة"],["FX on dividends","فروق العملة على التوزيعات"],["FX on Zakat payments","فروق العملة على مدفوعات الزكاة"]],"a":1,"e":["Article 25 defines the four cases and the tax functional, accounting functional and third currencies.","تعرّف المادة 25 الحالات الأربع والعملة الوظيفية الضريبية والمحاسبية والعملة الثالثة."],"r":[25]},{"q":["An error correction in opening equity cuts a covered tax liability by the riyal equivalent of €1.5m. Where is it dealt with?","تصحيح خطأ في حقوق الملكية الافتتاحية يخفض التزام ضريبة مشمولة بما يوازي 1.5 مليون يورو. أين يُعالج؟"],"o":[["In the current year's DMT income as usual","في دخل السنة الحالية كالمعتاد"],["Under Article 52 (post-filing adjustments), because it is a material decrease","وفق المادة 52 (التعديلات بعد تقديم الإقرار)، لأنه تخفيض جوهري"],["It is ignored","يتم تجاهله"],["Under Article 34","وفق المادة 34"]],"a":1,"e":["Article 28(1)(a) and (2): a decrease of €1m or more in a covered tax liability is material and goes through Article 52.","المادة 28 (1) (أ) و(2): التخفيض بمليون يورو أو أكثر في التزام ضريبة مشمولة جوهري ويُعالج وفق المادة 52."],"r":[28,52]},{"q":["What kind of election is the debt release election?","ما نوع اختيار الإعفاء من الديون؟"],"o":[["A five-year election","اختيار خمس سنوات"],["An annual election, subject to conditions in the Regulations","اختيار سنوي يخضع لشروط اللائحة"],["Automatic","تلقائي"],["Only for banks","للبنوك فقط"]],"a":1,"e":["Article 29(1). It excludes the release income and the related current and deferred tax from the borrower's computation.","المادة 29 (1). يستبعد دخل الإعفاء والضريبة الحالية والمؤجلة المرتبطة من احتساب المقترض."],"r":[29]},{"q":["Under the stock-based compensation election, what happens when an option expires unexercised?","في اختيار التعويض على أساس الأسهم، ماذا يحدث إذا انقضى خيار دون ممارسة؟"],"o":[["Nothing","لا شيء"],["The total amount previously deducted is included in DMT income for the year the option expires","يُدرج إجمالي المبلغ المحسوم سابقاً في الدخل في سنة انقضاء الخيار"],["The election is cancelled","يُلغى الاختيار"],["The covered taxes are refunded","تُسترد الضرائب المشمولة"]],"a":1,"e":["Article 30(2). The election is a five-year election applied consistently to all Saudi entities (Art 30(3)).","المادة 30 (2). والاختيار اختيار خمس سنوات يُطبق باتساق على جميع الكيانات في المملكة (المادة 30 (3))."],"r":[30]},{"q":["A Saudi entity sells goods to a group distributor abroad below arm's length, and the two record different amounts. What does Article 31 require?","يبيع كيان في المملكة بضائع لموزّع في المجموعة بالخارج بأقل من السعر المحايد، ويقيد الطرفان مبلغين مختلفين. ماذا تتطلب المادة 31؟"],"o":[["Nothing, accounts govern","لا شيء، فالحسابات هي المرجع"],["Adjust both to the same amount, consistent with arm's length","تعديل الطرفين إلى المبلغ نفسه وبما يتفق مع السعر المحايد"],["Disallow the sale","عدم السماح بالبيع"],["Tax the difference at 15%","فرض 15% على الفرق"]],"a":1,"e":["Article 31(1) and (3).","المادة 31 (1) و(3)."],"r":[31]},{"q":["Two Saudi group entities transfer an asset at a non-arm's length price, producing a loss. What happens?","ينقل كيانان في المجموعة في المملكة أصلاً بسعر غير محايد، فتنشأ خسارة. ماذا يحدث؟"],"o":[["The loss is always allowed","يُسمح بالخسارة دائماً"],["If the loss enters DMT income, it is recomputed at arm's length","إذا دخلت الخسارة في الدخل، يُعاد احتسابها بالسعر المحايد"],["The loss is doubled","تتضاعف الخسارة"],["The asset is ignored","يتم تجاهل الأصل"]],"a":1,"e":["Article 31(2) applies to losses on transfers between entities in the same jurisdiction.","تنطبق المادة 31 (2) على الخسائر الناتجة عن النقل بين كيانات في الولاية نفسها."],"r":["31(2)"]},{"q":["When is a refundable tax credit 'qualified'?","متى يكون الائتمان الضريبي القابل للاسترداد 'مؤهلاً'؟"],"o":[["When it is refundable at any time","عندما يكون قابلاً للاسترداد في أي وقت"],["When it must be paid in cash or cash equivalents within four years of meeting the conditions","عندما يجب صرفه نقداً أو بما يعادله خلال أربع سنوات من استيفاء الشروط"],["When it exceeds SAR 1m","عندما يتجاوز مليون ريال"],["When it is approved by ZATCA","عندما توافق عليه الهيئة"]],"a":1,"e":["Article 32(3). A partly refundable credit qualifies to the extent of the part payable within four years.","المادة 32 (3). والائتمان ال
