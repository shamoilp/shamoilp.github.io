ocal Tangible Asset?","وفق المادة 34، ما الأصل الملموس المحلي؟"],"o":[["Any Saudi asset","أي أصل في المملكة"],["Immovable property located in the Kingdom","ممتلكات غير منقولة تقع في المملكة"],["Machinery and vehicles","الآلات والمركبات"],["Shares in Saudi companies","أسهم الشركات السعودية"]],"a":1,"e":["Article 34(3)(b).","المادة 34 (3) (ب)."],"r":["34(3)"]},{"q":["When does the intragroup financing rule disallow an expense?","متى تمنع قاعدة الترتيب التمويلي ضمن المجموعة حسم مصروف؟"],"o":[["Whenever a Saudi entity pays interest","كلما دفع كيان في المملكة فوائد"],["When a low-tax entity's expense under an arrangement with a high-tax group counterparty is expected to increase without a matching increase in the counterparty's taxable income","عندما يُتوقع أن يزيد مصروف الكيان منخفض الضريبة في ترتيب مع طرف مقابل مرتفع الضريبة في المجموعة دون زيادة مماثلة في الدخل الخاضع للضريبة لدى الطرف المقابل"],["Only if the loan is in foreign currency","فقط إذا كان القرض بعملة أجنبية"],["Only above SAR 10m","فقط فوق 10 ملايين ريال"]],"a":1,"e":["Article 35, with its definitions of high-tax counterparty, low-tax entity and low-tax jurisdiction.","المادة 35، مع تعريفاتها للطرف المقابل مرتفع الضريبة والكيان منخفض الضريبة والولاية منخفضة الضريبة."],"r":[35]}],"cards":[{"f":["Asymmetric FX","العملات غير المتماثلة"],"b":["FX recognised on only one side where accounting and tax functional currencies differ, or from a third currency: adjusted.","فروق عملة تظهر في جانب واحد فقط حين تختلف العملة الوظيفية المحاسبية عن الضريبية، أو تنشأ عن عملة ثالثة: تُعدّل."],"r":[25]},{"f":["FX hedge election","اختيار تحوّط العملات"],"b":["Five-year: FX on hedged ownership interests treated as excluded equity gain or loss.","خمس سنوات: تُعامل فروق العملة على حصص الملكية المحوّطة كمكاسب أو خسائر حقوق ملكية مستبعدة."],"r":[26]},{"f":["Prior period errors","أخطاء الفترات السابقة"],"b":["Opening-equity changes go into the current year, except a material (≥ €1m) cut in a covered tax liability, which goes to Article 52.","تُدرج تغيرات حقوق الملكية الافتتاحية في السنة الحالية، باستثناء التخفيض الجوهري (مليون يورو فأكثر) في التزام ضريبة مشمولة، فيُعالج وفق المادة 52."],"r":[28]},{"f":["Debt release election","اختيار الإعفاء من الديون"],"b":["Annual: excludes bad debt release income and related taxes, if the Regulations' conditions are met.","سنوي: يستبعد دخل الإعفاء من الدين المعدوم وضرائبه، إذا تحققت شروط اللائحة."],"r":[29]},{"f":["Stock-based compensation election","اختيار التعويض على أساس الأسهم"],"b":["Five-year: use the tax-deductible amount; recapture if options expire unexercised.","خمس سنوات: يُستخدم المبلغ القابل للحسم ضريبياً؛ ويُسترد إذا انقضت الخيارات دون ممارسة."],"r":[30]},{"f":["Arm's length rule","قاعدة السعر المحايد"],"b":["Cross-border intra-group transactions at the same amount and arm's length; same-jurisdiction asset-transfer losses recomputed.","المعاملات العابرة للحدود داخل المجموعة بالمبلغ نفسه وبالسعر المحايد؛ وتُعاد احتساب خسائر نقل الأصول داخل الولاية نفسها."],"r":[31]},{"f":["Qualified Refundable Tax Credit","الائتمان الضريبي القابل للاسترداد المؤهل"],"b":["Payable in cash or cash equivalents within four years: treated as income.","يُصرف نقداً أو بما يعادله خلال أربع سنوات: يُعامل كدخل."],"r":[32]},{"f":["Marketable Transferable Tax Credit","الائتمان الضريبي القابل للتسويق والتحويل"],"b":["Usable against covered tax and meeting the legal transferability and marketability standards: treated as income.","يُستخدم مقابل الضريبة المشمولة ويستوفي معياري قابلية التحويل النظامي والتسويق: يُعامل كدخل."],"r":["32(4)"]},{"f":["Any other tax credit","أي ائتمان ضريبي آخر"],"b":["Not income; it reduces covered taxes.","لا يُعد دخلاً؛ بل يخفض الضرائب المشمولة."],"r":["32(2)","46(1)"]},{"f":["Fair value and impairment election","اختيار القيمة العادلة وانخفاض القيمة"],"b":["Five-year: realisation principle for fair-valued or impaired items, all Saudi entities unless specified.","خمس سنوات: مبدأ التحقق للبنود المقيسة بالقيمة العادلة أو المنخفضة القيمة، لجميع الكيانات في المملكة ما لم يُحدد غير ذلك."],"r":[33]},{"f":["Aggregate asset gain election","اختيار مكاسب الأصول المجمعة"],"b":["Annual: Saudi property gains offset earlier net asset losses, the rest spread over the election year and four prior years; earlier years recalculated.","سنوي: تُقابَل مكاسب العقارات في المملكة بصافي خسائر الأصول السابقة، ويُوزَّع الباقي على سنة الاختيار والسنوات الأربع السابقة؛ ويُعاد احتساب السنوات السابقة."],"r":[34]},{"f":["Intragroup financing arrangement rule","قاعدة الترتيب التمويلي ضمن المجموعة"],"b":["Disallows a low-tax entity's expense where the high-tax group counterparty gets no matching taxable income.","تمنع حسم مصروف الكيان منخفض الضريبة حين لا يقابله دخل خاضع للضريبة لدى الطرف المقابل مرتفع الضريبة في المجموعة."],"r":[35]}],"range":"25–26, 28–35"},{"id":7,"title":["DMT Income III: tax groups, sectors and allocations","دخل الضريبة (3): المجموعات الضريبية والقطاعات والتخصيص"],"goal":["Apply the sector rules (insurance, bank capital, international shipping) and allocate income between head offices, PEs and flow-through entities.","تطبيق القواعد القطاعية (التأمين، ورأس مال البنوك، والشحن الدولي) وتخصيص الدخل بين المراكز الرئيسية والمنشآت الدائمة والكيانات الشفافة مالياً."],"parts":[3],"arts":[36,37,38,39,40,41],"time":35,"metaphor":{"title":["Sorting parcels at a depot","فرز الطرود في المستودع"],"text":["By now every entity has a parcel of income. This module is the sorting depot: some parcels are opened and re-weighed (insurance and bank capital), some go straight onto a ship and leave the system (international shipping income), and some are re-addressed to the right owner: a branch's parcel goes to the branch, a transparent partnership's parcel goes to its partners.\nThe depot's rule is simple: income lands once, with the entity the law says earned it, never twice and never nowhere.","أصبح لكل كيان الآن طرد من الدخل، وهذه الوحدة هي مستودع الفرز: بعض الطرود يُفتح ويُعاد وزنه (التأمين ورأس مال البنوك)، وبعضها يُشحن مباشرة ويخرج من النظام (دخل الشحن الدولي)، وبعضها يُعاد توجيهه إلى مالكه الصحيح: فطرد الفرع يذهب إلى الفرع، وطرد الشراكة الشفافة يذهب إلى شركائها.\nوقاعدة المستودع بسيطة: يصل الدخل مرة واحدة، إلى الكيان الذي يعدّه النظام قد حققه، لا مرتين ولا إلى لا أحد."]},"anchors":[{"if":["Saudi group entities belong to the same tax consolidation group","كيانات المجموعة في المملكة ضمن مجموعة ضريبية موحدة واحدة"],"then":["Consider the five-year election to eliminate their intra-group transactions (Art 36)","فكّر في اختيار الخمس سنوات لاستبعاد معاملاتها البينية (المادة 36)"]},{"if":["A Saudi shipping company earns freight from ships in international traffic","شركة شحن في المملكة تحقق إيرادات نقل من سفن في النقل الدولي"],"then":["Exclude it, cap ancillary income at 50% of shipping income, and prove strategic or commercial management in the Kingdom (Art 39)","استبعده، واجعل الدخل المساند بحد أقصى 50% من دخل الشحن، وأثبت أن الإدارة الاستراتيجية أو التجارية في المملكة (المادة 39)"]},{"if":["A Saudi company has a branch abroad, or a foreign company a branch in the Kingdom","لشركة في المملكة فرع في الخارج، أو لشركة أجنبية فرع في المملكة"],"then":["Give the branch its own accounts' income; keep it out of the head office, except recaptured branch losses (Art 40)","اعطِ الفرع دخل حساباته الخاصة؛ وأبقِه خارج المركز الرئيسي، باستثناء خسائر الفرع المستردة (المادة 40)"]},{"if":["Income sits in a fiscally transparent partnership","الدخل في شراكة شفافة مالياً"],"then":["Allocate first to its PEs, then to its group owners that are reference entities, by ownership; a UPE or reverse hybrid keeps the rest (Art 41)","خصصه أولاً لمنشآتها الدائمة، ثم لملاكها في المجموعة الذين هم كيانات مرجعية بحسب الملكية؛ ويحتفظ الكيان الأم النهائي أو الكيان الهجين العكسي بالباقي (المادة 41)"]}],"diagrams":[{"type":"flow","title":["Where a flow-through entity's income goes","أين يذهب دخل الكيان الشفاف مالياً"],"nodes":[{"t":["1. Its PEs","1. منشآته الدائمة"],"s":["income of any PE through which it does business · Art 41(1)(a)","دخل أي منشأة دائمة يمارس عملاً من خلالها · المادة 41 (1) (أ)"]},{"t":["2. Reference-entity owners","2. الملاك من الكيانات المرجعية"],"s":["tax transparent, not the UPE: by ownership · Art 41(1)(b)","شفاف ضريبياً وليس الكيان الأم النهائي: بحسب الملكية · المادة 41 (1) (ب)"]},{"t":["3. Itself","3. الكيان نفسه"],"s":["if it is the UPE or a reverse hybrid · Art 41(1)(c)","إذا كان الكيان الأم النهائي أو كياناً هجيناً عكسياً · المادة 41 (1) (ج)"]}]},{"type":"table","title":["International shipping: in or out?","الشحن الدولي: داخل الاحتساب أم خارجه؟"],"head":[["Income","الدخل"],["Treatment (Art 39)","المعالجة (المادة 39)"]],"rows":[[["Carrying passengers or cargo on ships it operates in international traffic","نقل الركاب أو البضائع بسفن يشغّلها في النقل الدولي"],["Excluded (international shipping income)","مستبعد (دخل الشحن الدولي)"]],[["Slot charters, fully equipped time charters, pools and joint operating agencies","استئجار المساحات، والتأجير المجهز بالكامل، والاتحادات والوكالات التشغيلية المشتركة"],["Excluded","مستبعد"]],[["Bareboat charter to another constituent entity","التأجير دون طاقم لكيان تابع آخر"],["Excluded","مستبعد"]],[["Selling a ship held for at least one year","بيع سفينة محتفظ بها سنة على الأقل"],["Excluded","مستبعد"]],[["Container leasing, short-term storage and detention charges; services to other shipping enterprises by engineers, maintenance staff, cargo handlers, catering and customer-service staff; ticket sales for the domestic leg; integral investment income; bareboat charters to third parties for up to 3 years","تأجير الحاويات وتخزينها لفترة قصيرة ورسوم الاحتجاز؛ وخدمات المهندسين وموظفي الصيانة ومناولة البضائع والتموين وخدمة العملاء لمؤسسات الشحن الأخرى؛ وبيع تذاكر المرحلة المحلية؛ ودخل الاستثمار المرتبط؛ والتأجير دون طاقم لغير الكيانات التابعة لمدة لا تتجاوز 3 سنوات"],["Excluded as ancillary income, capped at 50% of international shipping income","مستبعد كدخل مساند، بحد أقصى 50% من دخل الشحن الدولي"]],[["Transport on inland waterways within one jurisdiction","النقل عبر الممرات المائية الداخلية في ولاية واحدة"],["Stays in DMT income","يبقى ضمن الدخل"]]],"note":["The exclusion needs proof that the strategic or commercial management of all the ships is carried on in the jurisdiction where the entity is located (Art 39(9)).","يتطلب الاستبعاد إثبات أن الإدارة الاستراتيجية أو التجارية لجميع السفن تتم في الولاية التي يقع فيها الكيان (المادة 39 (9))."]}],"points":[{"h":["Tax consolidation group election","اختيار المجموعة الضريبية الموحدة"],"t":["By a five-year election, the UPE's consolidation treatment is applied to eliminate income, expenses, gains and losses on transactions between constituent entities that are all located in the Kingdom and in the same tax consolidation group. Making or revoking it must not duplicate or omit any item.","باختيار خمس سنوات، تُطبق معالجة التوحيد لدى الكيان الأم النهائي لاستبعاد الدخل والمصاريف والمكاسب والخسائر الناتجة عن المعاملات بين كيانات تابعة تقع كلها في المملكة وضمن المجموعة الضريبية الموحدة نفسها. ويجب ألا يؤدي إجراؤه أو إلغاؤه إلى ازدواج أي بند أو إغفاله."],"r":[36]},{"h":["Insurance companies","شركات التأمين"],"t":["An insurer excludes amounts charged to policyholders for taxes it pays on policyholder returns, and includes policyholder returns missing from its accounts where the matching change in the policyholder liability is in its accounts.","تستبعد شركة التأمين المبالغ المفروضة على حاملي وثائق التأمين مقابل الضرائب التي تسددها عن عوائدهم، وتُدرج عوائد حاملي الوثائق غير الظاهرة في حساباتها إذا ظهر التغير المقابل في التزامها تجاههم في حساباتها."],"r":[37]},{"h":["Bank and insurance capital","رأس مال البنوك والتأمين"],"t":["Distributions on Additional Tier One capital (banks) or Restricted Tier One capital (insurers) recorded in equity are treated as an expense for the issuer and as income for the holder.","تُعامل التوزيعات على الشريحة الإضافية الأولى لرأس المال (البنوك) أو الشريحة المقيدة الأولى (التأمين) المقيدة في حقوق الملكية كمصروف للمُصدر ودخل للحائز."],"r":[38]},{"h":["International shipping","الشحن الدولي"],"t":["International shipping income and qualified ancillary income are excluded, and so is a net loss from them. Ancillary income across the jurisdiction is capped at 50% of international shipping income. Direct costs are deducted, indirect costs are allocated by revenue, and all of them leave the computation with the income.","يُستبعد دخل الشحن الدولي ودخل الشحن الدولي المساند المؤهل، وكذلك صافي الخسارة منهما. ويُحدّ الدخل المساند في الولاية بـ50% من دخل الشحن الدولي. وتُخصم التكاليف المباشرة، وتُوزَّع التكاليف غير المباشرة بحسب الإيرادات، وتخرج جميعها من الاحتساب مع الدخل."],"r":[39]},{"h":["PE income comes from the PE's accounts","دخل المنشأة الدائمة من حساباتها"],"t":["A PE's financial accounting income is what its separate accounts show. Without separate accounts, use what standalone accounts would show under the UPE's consolidation standard. For an exempt-income PE, it is the income the head office country exempts and the expenses it does not deduct.","الدخل المحاسبي للمنشأة الدائمة هو ما تُظهره حساباتها المنفصلة. وإذا لم تكن لها حسابات منفصلة، فيُستخدم ما كانت ستُظهره حسابات مستقلة وفق معيار التوحيد لدى الكيان الأم النهائي. وللمنشأة ذات الدخل المعفى، هو الدخل الذي تعفيه دولة المركز الرئيسي والمصاريف التي لا تحسمها."],"r":["40(1)","40(2)","40(4)"]},{"h":["Branch losses and recapture","خسائر الفرع واستردادها"],"t":["A PE's income is kept out of its head office. But a PE's DMT Loss is treated as the head office's expense to the extent the head office deducts it for tax and it is not set against income taxed in both countries. Later PE income is then treated as the head office's, up to that loss.","يبقى دخل المنشأة الدائمة خارج مركزها الرئيسي. لكن خسارة المنشأة تُعامل كمصروف للمركز الرئيسي بقدر ما يحسمها ضريبياً ولا تُقابَل بدخل خاضع للضريبة في الدولتين. ثم يُعامل دخل المنشأة اللاحق كدخل للمركز الرئيسي حتى مبلغ تلك الخسارة."],"r":["40(5)","40(6)"]},{"h":["Flow-through entities","الكيانات الشفافة مالياً"],"t":["A flow-through entity's accounting income goes first to any PE through which it operates; the rest of a tax transparent entity's income goes to its group owners that are reference entities, by ownership interest. If it is the UPE or a reverse hybrid, it keeps the rest itself.","يُخصص الدخل المحاسبي للكيان الشفاف مالياً أولاً لأي منشأة دائمة يعمل من خلالها؛ ويُخصص باقي دخل الكيان الشفاف ضريبياً لملاكه في المجموعة الذين هم كيانات مرجعية بحسب حصص ملكيتهم. وإذا كان الكيان الأم النهائي أو كياناً هجيناً عكسياً، احتفظ بالباقي لنفسه."],"r":["41(1)"]},{"h":["Reverse hybrids","الكيانات الهجينة العكسية"],"t":["A flow-through entity is a reverse hybrid to the extent the reference entity's jurisdiction does not treat it (and each entity in between) as fiscally transparent: the owner's country does not tax the income, so the entity keeps it.","يُعد الكيان الشفاف مالياً كياناً هجيناً عكسياً بقدر ما لا تعامله ولاية الكيان المرجعي (وكل كيان وسيط) بوصفه شفافاً مالياً: فدولة المالك لا تفرض الضريبة على الدخل، فيبقى لدى الكيان."],"r":["41(2)"]}],"oecd":[{"t":["The tax consolidation, insurance, Additional Tier One and international shipping rules follow GloBE Articles 3.2.8 to 3.3. The PE and flow-through allocation rules follow Articles 3.4 and 3.5.","تتبع قواعد التوحيد الضريبي والتأمين والشريحة الإضافية الأولى والشحن الدولي المواد من 3.2.8 إلى 3.3 من القواعد النموذجية. وتتبع قواعد تخصيص دخل المنشأة الدائمة والكيان الشفاف المادتين 3.4 و3.5."],"src":["Model Rules Arts 3.2.8–3.5","القواعد النموذجية: المواد 3.2.8–3.5"]},{"t":["KSA angle: the Income Tax Law computes each capital company's tax base separately, even when its accounts are consolidated (Art 6(e)). The Zakat Implementing Regulations 2024 (Art 16) do allow a consolidated Zakat declaration for a holding company and its fully owned subsidiaries. Whether that counts as a 'tax consolidation group' for Article 36 is not settled by the draft law; watch the Regulations.","من منظور المملكة: يحتسب نظام ضريبة الدخل وعاء كل شركة أموال بشكل مستقل حتى لو كانت حساباتها موحدة (المادة 6 (هـ)). وتسمح اللائحة التنفيذية لجباية الزكاة لعام 2024م (المادة 16) بتقديم إقرار زكوي موحد للشركة القابضة وشركاتها التابعة المملوكة بالكامل. أما هل يُعد ذلك «مجموعة ضريبية موحدة» لأغراض المادة 36 فلم يحسمه مشروع النظام؛ فراقب اللائحة."],"src":["Income Tax Law Art 6(e); Zakat Regulations 2024 Art 16","نظام ضريبة الدخل م 6 (هـ)؛ اللائحة التنفيذية لجباية الزكاة 2024م م 16"]}],"reflect":{"ref":["Hud 11:85","هود: 85"],"ayah":"ولا تبخسوا الناس أشياءهم","t":["Do not deprive people of what is theirs. Allocation rules are about giving each entity its own income, no more and no less. Put each parcel of profit where the law says it was earned, even when another home would cost less tax.","ولا تنقصوا الناس حقوقهم. وقواعد التخصيص غايتها أن يأخذ كل كيان دخله، لا أكثر ولا أقل. فضع كل طرد من الربح حيث يقرر النظام أنه تحقق، حتى لو كان مكان آخر أقل ضريبة."]},"cases":[{"t":["A Saudi shipping line and the 50% cap","خط شحن سعودي وحد 50%"],"facts":["Red Sea Lines (Saudi) operates container ships in international traffic and manages them strategically and commercially from Jeddah. FY2027 net figures after allocating costs:\n• International shipping income: SAR 80m\n• Qualified ancillary income (container leasing, storage, detention charges): SAR 50m\n• Rent from an office building it owns in Jeddah: SAR 5m","تشغّل شركة خطوط البحر الأحمر (سعودية) سفن حاويات في النقل الدولي وتديرها استراتيجياً وتجارياً من جدة. الأرقام الصافية للسنة المالية 2027م بعد توزيع التكاليف:\n• دخل الشحن الدولي: 80 مليون ريال\n• دخل الشحن المساند المؤهل (تأجير الحاويات وتخزينها ورسوم الاحتجاز): 50 مليون ريال\n• إيجار مبنى مكاتب تملكه في جدة: 5 ملايين ريال"],"steps":[{"t":["Management test: strategic and commercial management is in the Kingdom, so the exclusion is available.","اختبار الإدارة: الإدارة الاستراتيجية والتجارية في المملكة، فالاستبعاد متاح."]},{"t":["Cap on ancillary income: 50% of international shipping income.","حد الدخل المساند: 50% من دخل الشحن الدولي."],"x":"80000000*50/100","v":40000000,"u":"SAR"},{"t":["Total excluded: shipping income plus capped ancillary income.","إجمالي المستبعد: دخل الشحن مع الدخل المساند المحدود."],"x":"80000000+40000000","v":120000000,"u":"SAR"},{"t":["Stays in DMT income: ancillary income above the cap plus the office rent, which is not shipping income at all.","يبقى في الدخل: الدخل المساند الزائد عن الحد مع إيجار المكاتب، وهو ليس دخل شحن أصلاً."],"x":"(50000000-40000000)+5000000","v":15000000,"u":"SAR"}],"ans":["SAR 120m is excluded and SAR 15m stays in DMT income (SAR 10m of ancillary income above the cap and SAR 5m of rent). The 50% cap is tested for all Saudi constituent entities together, so a group with several shipping entities pools them for the cap.","يُستبعد 120 مليون ريال ويبقى 15 مليون ريال في الدخل (10 ملايين من الدخل المساند الزائد عن الحد و5 ملايين من الإيجار). ويُختبر حد 50% لجميع الكيانات التابعة في المملكة مجتمعة، فالمجموعة التي لديها عدة كيانات شحن تجمعها لأغراض الحد."],"r":["39(1)","39(3)","39(5)","39(9)"]},{"t":["A branch loss that comes home, then goes back","خسارة فرع تعود إلى الوطن ثم ترجع"],"facts":["Arabian Engineering (Saudi head office) has a branch in Country P that is a PE. Assume the branch's loss is deductible in the head office's Saudi taxable income and is not set against income taxed in both countries.\n• FY2027: branch DMT Loss SAR 5m\n• FY2028: branch DMT Income SAR 8m","لشركة الهندسة العربية (مركز رئيسي في المملكة) فرع في الدولة (ف) يُعد منشأة دائمة. افترض أن خسارة الفرع قابلة للحسم من الدخل الخاضع للضريبة للمركز الرئيسي في المملكة ولا تُقابَل بدخل خاضع للضريبة في الدولتين.\n• 2027م: خسارة الفرع 5 ملايين ريال\n• 2028م: دخل الفرع 8 ملايين ريال"],"steps":[{"t":["FY2027: the SAR 5m branch loss is treated as the Saudi head office's expense, not the branch's.","2027م: تُعامل خسارة الفرع البالغة 5 ملايين ريال كمصروف للمركز الرئيسي في المملكة لا للفرع."],"v":5000000,"u":"SAR"},{"t":["FY2028: branch income up to the earlier loss is treated as the head office's income (recapture).","2028م: يُعامل دخل الفرع حتى مبلغ الخسارة السابقة كدخل للمركز الرئيسي (استرداد)."],"x":"min(8000000,5000000)","v":5000000,"u":"SAR"},{"t":["The rest of FY2028's branch income stays with the branch, in Country P:","يبقى باقي دخل الفرع لعام 2028م لدى الفرع في الدولة (ف):"],"x":"8000000-5000000","v":3000000,"u":"SAR"}],"ans":["The loss used in the Kingdom in FY2027 is clawed back into the Kingdom's DMT income in FY2028 (SAR 5m); only SAR 3m is the branch's own income in Country P. This keeps the Kingdom's ETR from benefiting twice from the same branch loss.","تُسترد الخسارة المستخدمة في المملكة في 2027م إلى دخل المملكة في 2028م (5 ملايين ريال)، ولا يبقى دخلاً خاصاً بالفرع في الدولة (ف) إلا 3 ملايين ريال. وهذا يمنع معدل المملكة الفعلي من الاستفادة مرتين من خسارة الفرع نفسها."],"r":["40(5)","40(6)"]},{"t":["Splitting a transparent partnership's profit","تقسيم ربح شراكة شفافة"],"facts":["A partnership that the Kingdom treats as fiscally transparent is owned 60% by Saudi group company A and 40% by Saudi group company B. It is not the UPE, and A and B are reference entities. FY2027 accounting profit: SAR 10m, of which SAR 2m is earned through its PE in the UAE.","شراكة تعاملها المملكة بوصفها شفافة مالياً، تملك شركة المجموعة السعودية (أ) 60% منها وشركة المجموعة السعودية (ب) 40%. وليست الكيان الأم النهائي، و(أ) و(ب) كيانان مرجعيان. الربح المحاسبي للسنة المالية 2027م: 10 ملايين ريال، منها مليونا ريال تحققت عبر منشأتها الدائمة في الإمارات."],"steps":[{"t":["First, the UAE PE takes its own income.","أولاً، تأخذ المنشأة الدائمة في الإمارات دخلها."],"v":2000000,"u":"SAR"},{"t":["Remaining income to allocate to the owners:","الدخل المتبقي للتخصيص على الملاك:"],"x":"10000000-2000000","v":8000000,"u":"SAR"},{"t":["A's share (60%):","حصة (أ) (60%):"],"x":"8000000*60/100","v":4800000,"u":"SAR"},{"t":["B's share (40%):","حصة (ب) (40%):"],"x":"8000000*40/100","v":3200000,"u":"SAR"}],"ans":["The UAE PE has SAR 2m, A SAR 4.8m and B SAR 3.2m; the partnership itself keeps nothing. Had the partnership been the UPE, or a reverse hybrid because the owners' country did not see through it, it would have kept the SAR 8m itself.","للمنشأة الدائمة في الإمارات مليونا ريال، ولـ(أ) 4.8 ملايين ريال، ولـ(ب) 3.2 ملايين ريال، ولا يبقى للشراكة شيء. ولو كانت الشراكة الكيان الأم النهائي، أو كياناً هجيناً عكسياً لأن دولة الملاك لا تعاملها بشفافية، لاحتفظت بالثمانية ملايين لنفسها."],"r":["41(1)","41(2)"]}],"quiz":[{"q":["When can the tax consolidation group election eliminate intra-group transactions?","متى يمكن لاختيار المجموعة الضريبية الموحدة استبعاد المعاملات البينية؟"],"o":[["For any group entities anywhere","لأي كيانات في المجموعة في أي مكان"],["Where all the entities are located in the Kingdom and in the same tax consolidation group","حين تقع جميع الكيانات في المملكة وضمن المجموعة الضريبية الموحدة نفسها"],["Only for banks","للبنوك فقط"],["Only with ZATCA's approval each year","فقط بموافقة الهيئة كل سنة"]],"a":1,"e":["Article 36(1). It is a five-year election, and making or revoking it must not duplicate or omit items (Art 36(2)).","المادة 36 (1). وهو اختيار خمس سنوات، ويجب ألا يؤدي إجراؤه أو إلغاؤه إلى ازدواج البنود أو إغفالها (المادة 36 (2))."],"r":[36]},{"q":["An insurer charges policyholders for taxes it pays on their returns. How are those charges treated?","تفرض شركة تأمين على حاملي الوثائق مبالغ مقابل الضرائب التي تسددها عن عوائدهم. كيف تُعامل هذه المبالغ؟"],"o":[["Included in DMT income","تُدرج في الدخل"],["Excluded from DMT income","تُستبعد من الدخل"],["Treated as covered taxes","تُعامل كضرائب مشمولة"],["Taxed at 15%","تخضع لـ15%"]],"a":1,"e":["Article 37(1).","المادة 37 (1)."],"r":["37"]},{"q":["A bank pays a distribution on Additional Tier One capital recorded as a reduction of equity. What is the DMT treatment for the bank?","يدفع بنك توزيعات على الشريحة الإضافية الأولى لرأس المال مقيدة كتخفيض لحقوق الملكية. ما المعالجة لأغراض النظام لدى البنك؟"],"o":[["Ignored, as it is in equity","يتم تجاهلها لأنها في حقوق الملكية"],["Treated as an expense","تُعامل كمصروف"],["Treated as an excluded dividend","تُعامل كتوزيعات مستبعدة"],["Added to covered taxes","تُضاف إلى الضرائب المشمولة"]],"a":1,"e":["Article 38(1). The holder includes the matching receipt as income (Art 38(2)).","المادة 38 (1). ويُدرج الحائز المبلغ المقابل المستلم كدخل (المادة 38 (2))."],"r":[38]},{"q":["Which income stays IN DMT income for a shipping company?","أي دخل يبقى داخل الاحتساب لشركة الشحن؟"],"o":[["Freight from ships it operates in international traffic","إيرادات النقل بسفن يشغّلها في النقل الدولي"],["A gain on selling a ship held for three years","مكسب بيع سفينة محتفظ بها ثلاث سنوات"],["Transport on inland waterways within the same jurisdiction","النقل عبر الممرات المائية الداخلية في الولاية نفسها"],["Slot-charter income","دخل استئجار المساحات"]],"a":2,"e":["Article 39(3) excludes inland waterway transport within the same jurisdiction from international shipping income.","تستثني المادة 39 (3) النقل عبر الممرات المائية الداخلية في الولاية نفسها من دخل الشحن الدولي."],"r":["39(3)"]},{"q":["What is the cap on qualified ancillary international shipping income?","ما الحد الأقصى لدخل الشحن الدولي المساند المؤهل؟"],"o":[["25% of revenue","25% من الإيرادات"],["50% of the international shipping income of all constituent entities in the jurisdiction","50% من دخل الشحن الدولي لجميع الكيانات التابعة في الولاية"],["100% of shipping income","100% من دخل الشحن"],["SAR 10m","10 ملايين ريال"]],"a":1,"e":["Article 39(5).","المادة 39 (5)."],"r":["39(5)"]},{"q":["What must a shipping company show to use the exclusion?","ماذا يجب أن تُثبت شركة الشحن للاستفادة من الاستبعاد؟"],"o":[["That its ships fly the Saudi flag","أن سفنها ترفع العلم السعودي"],["That the strategic or commercial management of all the ships is carried on from within its jurisdiction","أن الإدارة الاستراتيجية أو التجارية لجميع السفن تتم من داخل ولايتها"],["That it is listed","أنها مدرجة"],["That it pays Zakat","أنها تدفع الزكاة"]],"a":1,"e":["Article 39(9).","المادة 39 (9)."],"r":["39(9)"]},{"q":["A ship used in international traffic is sold after eight months. Is the gain international shipping income?","بيعت سفينة مستخدمة في النقل الدولي بعد ثمانية أشهر. هل المكسب دخل شحن دولي؟"],"o":[["Yes, always","نعم، دائماً"],["No: a ship sale counts only if the ship was held for use for at least one year","لا: لا يُحتسب بيع السفينة إلا إذا احتُفظ بها للاستخدام سنة على الأقل"],["Only if sold to a group entity","فقط إذا بيعت لكيان في المجموعة"],["Only half of it","نصفه فقط"]],"a":1,"e":["Article 39(2)(f).","المادة 39 (2) (و)."],"r":["39(2)"]},{"q":["A Saudi branch of a foreign company has no separate accounts. What is its accounting income?","لا توجد حسابات منفصلة لفرع شركة أجنبية في المملكة. ما دخله المحاسبي؟"],"o":[["Zero","صفر"],["What standalone accounts would show under the accounting standard of the UPE's consolidated statements","ما كانت ستُظهره حسابات مستقلة وفق المعيار المحاسبي للقوائم الموحدة للكيان الأم النهائي"],["Its share of group revenue","حصته من إيرادات المجموعة"],["Its Saudi taxable income","دخله الخاضع للضريبة في المملكة"]],"a":1,"e":["Article 40(2). The Regulations can set further adjustments (Art 40(3)).","المادة 40 (2). ويجوز للائحة تحديد تعديلات إضافية (المادة 40 (3))."],"r":["40(2)"]},{"q":["Is a PE's income included in its head office's DMT income?","هل يُدرج دخل المنشأة الدائمة في دخل مركزها الرئيسي؟"],"o":[["Yes, always","نعم، دائماً"],["No, except for the recapture of PE losses that the head office used","لا، باستثناء استرداد خسائر المنشأة التي استخدمها المركز الرئيسي"],["Only if the PE is Saudi","فقط إذا كانت المنشأة في المملكة"],["Only half","النصف فقط"]],"a":1,"e":["Article 40(5) and (6).","المادة 40 (5) و(6)."],"r":["40(5)","40(6)"]},{"q":["A transparent partnership (not the UPE) has income after allocating to its PEs. Who gets it?","شراكة شفافة (ليست الكيان الأم النهائي) لديها دخل بعد التخصيص لمنشآتها. لمن يذهب؟"],"o":[["The partnership keeps it","تحتفظ به الشراكة"],["Its group owners that are reference entities, by ownership interest","ملاكها في المجموعة الذين هم كيانات مرجعية، بحسب حصص ملكيتهم"],["ZATCA allocates it","تخصصه الهيئة"],["It is excluded","يُستبعد"]],"a":1,"e":["Article 41(1)(b).","المادة 41 (1) (ب)."],"r":["41(1)"]},{"q":["When does a flow-through entity keep its remaining income itself?","متى يحتفظ الكيان الشفاف مالياً بدخله المتبقي لنفسه؟"],"o":[["When it is Saudi","عندما يكون سعودياً"],["When it is the UPE or a reverse hybrid","عندما يكون الكيان الأم النهائي أو كياناً هجيناً عكسياً"],["When it has a loss","عندما تكون لديه خسارة"],["Never","أبداً"]],"a":1,"e":["Article 41(1)(c) and (2).","المادة 41 (1) (ج) و(2)."],"r":["41(1)","41(2)"]},{"q":["What makes a flow-through entity a reverse hybrid?","ما الذي يجعل الكيان الشفاف مالياً كياناً هجيناً عكسياً؟"],"o":[["It is transparent in every country","أنه شفاف في كل دولة"],["The reference entity's jurisdiction does not treat it (and each entity in between) as fiscally transparent","أن ولاية الكيان المرجعي لا تعامله (ولا كل كيان وسيط) بوصفه شفافاً مالياً"],["It is listed","أنه مدرج"],["It has a PE","أن له منشأة دائمة"]],"a":1,"e":["Article 41(2).","المادة 41 (2)."],"r":["41(2)"]}],"cards":[{"f":["Tax consolidation group election","اختيار المجموعة الضريبية الموحدة"],"b":["Five-year: eliminate transactions between Saudi entities in the same tax consolidation group.","خمس سنوات: استبعاد المعاملات بين الكيانات في المملكة ضمن المجموعة الضريبية الموحدة نفسها."],"r":[36]},{"f":["Insurance: policyholder taxes","التأمين: ضرائب حاملي الوثائق"],"b":["Exclude amounts charged to policyholders for taxes on their returns; include missing policyholder returns.","تُستبعد المبالغ المفروضة على حاملي الوثائق مقابل ضرائب عوائدهم؛ وتُدرج عوائدهم غير الظاهرة."],"r":[37]},{"f":["AT1 and RT1 distributions","توزيعات الشريحة الإضافية والمقيدة الأولى"],"b":["Expense for the issuer, income for the holder, even though booked in equity.","مصروف للمُصدر ودخل للحائز، رغم قيدها في حقوق الملكية."],"r":[38]},{"f":["International shipping income","دخل الشحن الدولي"],"b":["Excluded (losses too), if strategic or commercial management is in the entity's jurisdiction.","مستبعد (وكذلك الخسائر)، إذا كانت الإدارة الاستراتيجية أو التجارية في ولاية الكيان."],"r":[39]},{"f":["Ancillary shipping income cap","حد دخل الشحن المساند"],"b":["50% of the jurisdiction's international shipping income.","50% من دخل الشحن الدولي في الولاية."],"r":["39(5)"]},{"f":["Shipping costs","تكاليف الشحن"],"b":["Direct costs deducted, indirect costs allocated by revenue; all excluded with the income.","تُخصم التكاليف المباشرة، وتُوزَّع غير المباشرة بحسب الإيرادات؛ وتُستبعد جميعها مع الدخل."],"r":["39(6)","39(7)","39(8)"]},{"f":["PE income source","مصدر دخل المنشأة الدائمة"],"b":["Its separate accounts; otherwise standalone accounts under the UPE's consolidation standard.","حساباتها المنفصلة؛ وإلا فحسابات مستقلة وفق معيار التوحيد لدى الكيان الأم النهائي."],"r":["40(1)","40(2)"]},{"f":["Exempt-income PE","المنشأة الدائمة ذات الدخل المعفى"],"b":["Income the head office country exempts, less expenses it does not deduct.","الدخل الذي تعفيه دولة المركز الرئيسي ناقص المصاريف التي لا تحسمها."],"r":["40(4)"]},{"f":["PE loss used by head office","خسارة المنشأة التي استخدمها المركز الرئيسي"],"b":["Treated as head office expense; later PE income up to that loss is recaptured as head office income.","تُعامل كمصروف للمركز الرئيسي؛ ويُسترد لاحقاً دخل المنشأة حتى مبلغ تلك الخسارة كدخل للمركز الرئيسي."],"r":["40(6)"]},{"f":["Flow-through allocation order","ترتيب تخصيص دخل الكيان الشفاف"],"b":["PEs first, then reference-entity owners by ownership; UPE or reverse hybrid keeps the rest.","المنشآت الدائمة أولاً، ثم الملاك من الكيانات المرجعية بحسب الملكية؛ ويحتفظ الكيان الأم النهائي أو الهجين العكسي بالباقي."],"r":["41(1)"]},{"f":["Reverse hybrid","الكيان الهجين العكسي"],"b":["Transparent where created, but not treated as transparent by the reference entity's jurisdiction.","شفاف حيث أُنشئ، لكن ولاية الكيان المرجعي لا تعامله بوصفه شفافاً."],"r":["41(2)"]},{"f":["Reference Entity","الكيان المرجعي"],"b":["The closest group owner in the chain that is not a flow-through entity (or a flow-through UPE).","أقرب مالك في المجموعة ضمن سلسلة الملكية لا يكون كياناً شفافاً مالياً (أو كيان أم نهائي شفاف)."],"r":[1]}],"range":"36–41"},{"id":8,"title":["Covered taxes: what counts, Zakat included","الضرائب المشمولة: ما يُحتسب، والزكاة منها"],"goal":["Identify covered taxes (Zakat included), build Adjusted Covered Taxes from the current tax line, and deal with refunds, unpaid taxes and negative tax expense.","تحديد الضرائب المشمولة (ومنها الزكاة)، وبناء الضرائب المشمولة المعدلة من بند الضريبة الحالية، ومعالجة الاستردادات والضرائب غير المسددة والمصروف الضريبي السالب."],"parts":[4],"arts":[42,43,44,45,46,47,48,52],"time":35,"metaphor":{"title":["The numerator's guest list","قائمة ضيوف البسط"],"text":["The ETR is a fraction. Modules 5 to 7 built the bottom line (DMT income); this module builds the top line. Think of covered taxes as a guest list at the door: income taxes, taxes charged instead of income tax, and taxes on retained earnings and equity. Zakat is named on the list.\nSome people are turned away at the door: top-up taxes themselves, an insurer's tax on its policyholders' returns, disputed amounts, and tax that will not really be paid within three years. Every guest is counted once, in the year they belong.","معدل الضريبة الفعلي كسرٌ. بنت الوحدات من 5 إلى 7 المقام (الدخل)، وهذه الوحدة تبني البسط. تخيّل الضرائب المشمولة قائمة ضيوف عند الباب: ضرائب الدخل، والضرائب المفروضة بدلاً من ضريبة الدخل، والضرائب على الأرباح المحتجزة وحقوق الملكية، والزكاة مذكورة بالاسم في القائمة.\nويُردّ بعضهم عند الباب: الضرائب التكميلية نفسها، وضريبة شركة التأمين على عوائد حاملي وثائقها، والمبالغ المتنازع عليها، والضريبة التي لن تُسدد فعلاً خلال ثلاث سنوات. ويُعدّ كل ضيف مرة واحدة، في السنة التي ينتمي إليها."]},"anchors":[{"if":["A Saudi company books Zakat","شركة في المملكة تقيّد الزكاة"],"then":["Count it as a covered tax and add it back in DMT income as part of net taxes expense (Arts 42(1)(c), 19(1)(a))","احسبها ضريبة مشمولة وأعدها إلى الدخل ضمن صافي مصروف الضرائب (المادتان 42 (1) (ج) و19 (1) (أ))"]},{"if":["The tax charge includes a provision for a ZATCA dispute","يتضمن مصروف الضريبة مخصصاً لنزاع مع الهيئة"],"then":["Take it out now as an uncertain tax position; put it back in the year it is paid (Arts 46(1)(d), 45(1)(b))","استبعده الآن كمركز ضريبي غير مؤكد، وأعده في سنة سداده (المادتان 46 (1) (د) و45 (1) (ب))"]},{"if":["Tax relates to income already excluded from DMT income","الضريبة تتعلق بدخل مستبعد أصلاً من الدخل"],"then":["Remove that tax too: numerator and denominator must match (Art 46(1)(a))","استبعد تلك الضريبة أيضاً، فالبسط والمقام يجب أن يتطابقا (المادة 46 (1) (أ))"]},{"if":["ZATCA refunds or reduces a prior year's tax","الهيئة تردّ أو تخفض ضريبة سنة سابقة"],"then":["Recalculate that year's ETR and top-up, unless the decrease is under €1m and the annual election is made (Art 52(2), 52(4))","أعد احتساب معدل تلك السنة وضريبتها التكميلية، ما لم يقل التخفيض عن مليون يورو ويُجرَ الاختيار السنوي (المادة 52 (2) و(4))"]}],"diagrams":[{"type":"flow","title":["From the tax line to Adjusted Covered Taxes","من بند الضريبة إلى الضرائب المشمولة المعدلة"],"nodes":[{"t":["Current tax expense","مصروف الضريبة الحالية"],"s":["covered taxes in the accounts: income tax and Zakat","الضرائب المشمولة في الحسابات: ضريبة الدخل والزكاة"]},{"t":["+ Additions","+ الإضافات"],"s":["Art 45","المادة 45"]},{"t":["− Reductions","− التخفيضات"],"s":["Art 46","المادة 46"]},{"t":["± Deferred tax","± الضريبة المؤجلة"],"s":["Arts 49–51 (Module 9)","المواد 49–51 (الوحدة 9)"]},{"t":["± Equity and OCI","± حقوق الملكية والدخل الشامل الآخر"],"s":["taxes on included items taxed in the Kingdom · Art 44(1)(c)","ضرائب بنود مدرجة تخضع للضريبة في المملكة · المادة 44 (1) (ج)"]},{"t":["= Adjusted Covered Taxes","= الضرائب المشمولة المعدلة"],"s":["counted once only · Art 44(3)","تُحتسب مرة واحدة فقط · المادة 44 (3)"]}]},{"type":"table","title":["Covered or not?","مشمولة أم لا؟"],"head":[["Item","البند"],["Treatment","المعالجة"]],"rows":[[["Saudi corporate income tax on the foreign shareholders' share","ضريبة الدخل في المملكة على حصة الشركاء الأجانب"],["Covered (Art 42(1)(a))","مشمولة (المادة 42 (1) (أ))"]],[["Zakat levied by the Kingdom on companies","الزكاة التي تفرضها المملكة على الشركات"],["Covered (Art 42(1)(c))","مشمولة (المادة 42 (1) (ج))"]],[["A tax charged instead of a general corporate income tax","ضريبة تُفرض بدلاً من ضريبة الدخل العامة على الشركات"],["Covered (Art 42(1)(b))","مشمولة (المادة 42 (1) (ب))"]],[["Domestic top-up tax accrued under a QDMTT, or top-up tax under an IIR","الضريبة التكميلية المستحقة بموجب ضريبة تكميلية محلية مؤهلة، أو بموجب قاعدة تضمين الدخل"],["Not covered (Art 42(2)(a)–(b))","غير مشمولة (المادة 42 (2) (أ)–(ب))"]],[["Taxes from an adjustment under a qualified UTPR","الضرائب الناتجة عن تعديل بموجب قاعدة الأرباح الخاضعة لمعدل منخفض المؤهلة"],["Not covered (Art 42(2)(c))","غير مشمولة (المادة 42 (2) (ج))"]],[["Taxes an insurer pays on its policyholders' returns","الضرائب التي تسددها شركة التأمين عن عوائد حاملي وثائقها"],["Not covered (Art 42(2)(d))","غير مشمولة (المادة 42 (2) (د))"]],[["VAT, customs duty and other taxes not on income, profits, retained earnings or equity","ضريبة القيمة المضافة والرسوم الجمركية وغيرها مما لا يُفرض على الدخل أو الأرباح أو الأرباح المحتجزة أو حقوق الملكية"],["Not covered: outside Art 42(1)","غير مشمولة: خارج نطاق المادة 42 (1)"]]]}],"points":[{"h":["Three kinds of covered tax","ثلاثة أنواع من الضرائب المشمولة"],"t":["Covered taxes are taxes recorded in an entity's accounts on its income or profits (or its share of another constituent entity's); taxes imposed in lieu of a general corporate income tax; and taxes levied by reference to retained earnings and corporate equity, expressly including Zakat levied by the Kingdom on companies.","الضرائب المشمولة هي الضرائب المسجلة في حسابات الكيان على دخله أو أرباحه (أو حصته في دخل كيان تابع آخر)؛ والضرائب المفروضة بدلاً من ضريبة الدخل العامة على الشركات؛ والضرائب المفروضة بالرجوع إلى الأرباح المحتجزة وحقوق ملكية الشركات، ومنها صراحةً الزكاة التي تفرضها المملكة على الشركات."],"r":["42(1)"]},{"h":["What is a tax, and what is kept out","ما الضريبة، وما المستبعد"],"t":["A tax is a compulsory unrequited payment to General Government. Top-up taxes under an IIR or a QDMTT, taxes from a UTPR adjustment and an insurer's taxes on policyholder returns are not covered taxes.","الضريبة سداد إلزامي بلا مقابل للإدارات الحكومية. ولا تُعد ضرائب مشمولة: الضرائب التكميلية بموجب قاعدة تضمين الدخل أو الضريبة التكميلية المحلية المؤهلة، والضرائب الناتجة عن تعديل قاعدة الأرباح الخاضعة لمعدل منخفض، وضرائب شركة التأمين على عوائد حاملي الوثائق."],"r":["42(2)","42(3)"]},{"h":["Adjusted Covered Taxes","الضرائب المشمولة المعدلة"],"t":["Start with the current tax expense for covered taxes in the accounts. Add the additions, take off the reductions, apply the total deferred tax adjustment, and bring in covered taxes recorded in equity or OCI on items included in DMT income that are taxed in the Kingdom. No tax may be counted twice.","ابدأ بمصروف الضريبة الحالية للضرائب المشمولة في الحسابات، ثم أضف الإضافات واطرح التخفيضات، وطبّق إجمالي تعديل الضريبة المؤجلة، وأدرج الضرائب المشمولة المقيدة في حقوق الملكية أو الدخل الشامل الآخر عن بنود مدرجة في الدخل وخاضعة للضريبة في المملكة. ولا تُحتسب أي ضريبة مرتين."],"r":["44(1)","44(3)"]},{"h":["Additions","الإضافات"],"t":["Add covered taxes booked as an expense above profit before tax; uncertain-position taxes paid this year that were reduced in an earlier year; and qualified refundable or marketable transferable tax credits booked as a reduction of current tax (they count as income instead).","أضف الضرائب المشمولة المقيدة كمصروف قبل الربح قبل الضريبة؛ وضرائب المراكز غير المؤكدة المسددة هذه السنة التي خُفضت في سنة سابقة؛ والائتمانات الضريبية المؤهلة القابلة للاسترداد أو القابلة للتحويل والتداول المقيدة كتخفيض للضريبة الحالية (لأنها تُعامل كدخل بدلاً من ذلك)."],"r":["45(1)","32(1)"]},{"h":["Reductions","التخفيضات"],"t":["Take off tax on income excluded from DMT income; non-qualifying tax credits not booked in current tax; refunds or credits not booked in current tax (unless they are post-filing adjustments); taxes on uncertain tax positions; and current tax not expected to be paid within three years of year-end.","اطرح الضريبة على الدخل المستبعد من الدخل؛ والائتمانات الضريبية غير المؤهلة غير المقيدة في الضريبة الحالية؛ والاستردادات أو الائتمانات غير المقيدة في الضريبة الحالية (ما لم تكن تعديلات لاحقة للإقرار)؛ وضرائب المراكز الضريبية غير المؤكدة؛ والضريبة الحالية التي لا يُتوقع سدادها خلال ثلاث سنوات من نهاية السنة."],"r":["46(1)"]},{"h":["Excess negative tax expense","المصروف الضريبي السالب الزائد"],"t":["If Adjusted Covered Taxes turn negative, the group may elect, and must where the top-up percentage would exceed 15%, to exclude the excess negative tax expense and carry it forward to reduce later years' covered taxes. In a year with net DMT income the excess is the whole negative amount; in a year without, it is the shortfall below expected covered taxes (15% of the Kingdom's net DMT loss).","إذا أصبحت الضرائب المشمولة المعدلة سالبة، يجوز للمجموعة أن تختار، ويجب عليها إذا تجاوزت نسبة الضريبة التكميلية 15%، استبعاد المصروف الضريبي السالب الزائد وترحيله لتخفيض الضرائب المشمولة في السنوات اللاحقة. وفي سنة فيها صافي دخل يكون الزائد هو المبلغ السالب كله؛ وفي سنة بلا صافي دخل يكون النقص عن الضرائب المتوقعة (15% من صافي خسارة المملكة)."],"r":["44(2)","47(1)","47(2)","63(4)"]},{"h":["Refunds and assessments for past years","الاستردادات والربوط عن سنوات سابقة"],"t":["An increase in a past year's covered taxes goes into the year it is booked. A decrease reopens the past year: its ETR and top-up tax are recalculated and any extra becomes additional current top-up tax. A group may elect each year to book an immaterial decrease (under €1m in aggregate for the Kingdom) in the current year instead.","تُدرج الزيادة في ضرائب سنة سابقة في السنة التي تُقيد فيها. أما التخفيض فيعيد فتح السنة السابقة: يُعاد احتساب معدلها الفعلي وضريبتها التكميلية، وتصبح أي زيادة ضريبة تكميلية حالية إضافية. ويجوز للمجموعة أن تختار سنوياً إدراج التخفيض غير الجوهري (أقل من مليون يورو إجمالاً للمملكة) في السنة الحالية."],"r":["52(1)","52(2)","52(4)","52(5)","63(2)"]},{"h":["Tax that is never paid","الضريبة التي لا تُسدد"],"t":["If more than €1m of current tax claimed in a year is still unpaid three years after that year-end, the year is recalculated without the unpaid amount. Expected non-payment is dealt with up front as a reduction.","إذا بقي أكثر من مليون يورو من الضريبة الحالية المطالب بها في سنة ما دون سداد بعد ثلاث سنوات من نهاية تلك السنة، يُعاد احتساب السنة دون المبلغ غير المسدد. أما عدم السداد المتوقع فيُعالج مسبقاً كتخفيض."],"r":["52(8)","46(1)"]}],"oecd":[{"t":["Articles 42 to 48 follow GloBE Articles 4.1 and 4.2. The draft names Zakat expressly within taxes on retained earnings and equity, and it leaves out taxes under an eligible distribution tax system (GloBE Art 4.2.1(b)), a regime the Kingdom does not operate.","تتبع المواد من 42 إلى 48 المادتين 4.1 و4.2 من القواعد النموذجية. ويذكر مشروع النظام الزكاة صراحةً ضمن الضرائب على الأرباح المحتجزة وحقوق الملكية، ويُسقط الضرائب بموجب نظام ضريبة التوزيعات المؤهل (المادة 4.2.1 (ب))، وهو نظام لا تطبقه المملكة."],"src":["Model Rules Arts 4.1–4.2","القواعد النموذجية: المادتان 4.1–4.2"]},{"t":["Watch point: Article 43 defines Disqualified Refundable Imputation Tax, but the exclusions in Article 42(2) do not list it, whereas GloBE Article 4.2.2(d) excludes it from covered taxes. Expect the final law or the Regulations to close the gap.","نقطة للمتابعة: تعرّف المادة 43 ضريبة الإسناد غير المؤهلة القابلة للاسترداد، لكن الاستثناءات في المادة 42 (2) لا تذكرها، بينما تستبعدها المادة 4.2.2 (د) من القواعد النموذجية من الضرائب المشمولة. والمتوقع أن يعالج النظام النهائي أو اللائحة هذه الفجوة."],"src":["Model Rules Art 4.2.2","القواعد النموذجية: المادة 4.2.2"]}],"reflect":{"ref":["Al-Baqarah 2:43","البقرة: 43"],"ayah":"وأقيموا الصلاة وآتوا الزكاة","t":["Establish prayer and give Zakat. The draft counts Zakat in the numerator, but before it is a number in a computation it is an act of worship owed in full and on time. Let the duty lead and the figures follow.","أقيموا الصلاة وآتوا الزكاة. يحتسب مشروع النظام الزكاة في البسط، لكنها قبل أن تكون رقماً في معادلة عبادةٌ تؤدى كاملة وفي وقتها. فلتكن الفريضة في المقدمة والأرقام تبعاً لها."]},"cases":[{"t":["Building covered taxes for a mixed Saudi company","بناء الضرائب المشمولة لشركة سعودية مختلطة"],"facts":["Najd Industrial is 60% Saudi-owned and 40% foreign-owned. Its FY2027 'Zakat and income tax' line shows:\n• Income tax on the foreign shareholders' share: SAR 24m, of which SAR 3m is a provision for a disputed ZATCA assessment and SAR 1m is tax on a gain from selling shares in an associate (an excluded equity gain)\n• Zakat on the Saudi shareholders' share: SAR 9m\nIgnore deferred tax for now.","شركة نجد الصناعية مملوكة بنسبة 60% لسعوديين و40% لأجانب. يُظهر بند «الزكاة وضريبة الدخل» للسنة المالية 2027م:\n• ضريبة الدخل على حصة الشركاء الأجانب: 24 مليون ريال، منها 3 ملايين مخصص لربط متنازع عليه مع الهيئة، ومليون ريال ضريبة على مكسب بيع أسهم في شركة زميلة (مكسب ملكية مستبعد)\n• الزكاة على حصة الشركاء السعوديين: 9 ملايين ريال\nتجاهل الضريبة المؤجلة الآن."],"steps":[{"t":["Current tax expense for covered taxes (income tax plus Zakat):","مصروف الضريبة الحالية للضرائب المشمولة (ضريبة الدخل مع الزكاة):"],"x":"24000000+9000000","v":33000000,"u":"SAR"},{"t":["Less the uncertain tax position (it comes back when paid):","ناقصاً المركز الضريبي غير المؤكد (يعود عند السداد):"],"x":"33000000-3000000","v":30000000,"u":"SAR"},{"t":["Less tax on the excluded equity gain:","ناقصاً الضريبة على مكسب الملكية المستبعد:"],"x":"30000000-1000000","v":29000000,"u":"SAR"}],"ans":["Adjusted Covered Taxes before the deferred tax adjustment are SAR 29m. Zakat is fully in. If the SAR 3m is later paid, it is added to covered taxes in the year of payment.","الضرائب المشمولة ال  income; non-qualifying credits; off-line refunds; uncertain positions; tax unpaid within 3 years.","ضريبة الدخل المستبعد؛ والائتمانات غير المؤهلة؛ والاستردادات خارج بند الضريبة؛ والمراكز غير المؤكدة؛ والضريبة غير المسددة خلال 3 سنوات."],"r":["46(1)"]},{"f":["Excess negative tax expense","المصروف الضريبي السالب الزائد"],"b":["Excluded and carried forward, at election or where the top-up % would exceed 15%.","يُستبعد ويُرحّل، باختيار أو إذا تجاوزت نسبة الضريبة التكميلية 15%."],"r":["44(2)",47]},{"f":["Disqualified Refundable Imputation Tax","ضريبة الإسناد غير المؤهلة القابلة للاسترداد"],"b":["Tax refundable or creditable to a dividend's owner (beyond that dividend), or refundable to the payer on distribution.","ضريبة قابلة للاسترداد أو الخصم لمالك التوزيعات (خارج تلك التوزيعات)، أو قابلة للاسترداد للموزِّع عند التوزيع."],"r":[43]},{"f":["Post-filing increase","زيادة لاحقة للإقرار"],"b":["Booked as a covered-tax adjustment in the year it is made.","تُدرج كتعديل للضرائب المشمولة في سنة إجرائها."],"r":["52(1)"]},{"f":["Post-filing decrease","تخفيض لاحق للإقرار"],"b":["Reopens the earlier year's ETR and top-up; immaterial (< €1m) may go to the current year by annual election.","يعيد فتح معدل السنة السابقة وضريبتها التكميلية؛ ويجوز إدراج غير الجوهري (أقل من مليون يورو) في السنة الحالية باختيار سنوي."],"r":["52(2)","52(4)","52(5)"]},{"f":["Unpaid tax rule","قاعدة الضريبة غير المسددة"],"b":["Over €1m of current tax unpaid after 3 years: recalculate that year without it.","أكثر من مليون يورو من الضريبة الحالية غير مسدد بعد 3 سنوات: يُعاد احتساب تلك السنة دونه."],"r":["52(8)"]},{"f":["Allocating covered taxes between entities","تخصيص الضرائب المشمولة بين الكيانات"],"b":["Left to the Regulations.","متروك للائحة."],"r":[48]}],"range":"42–48, 52"},{"id":9,"title":["Deferred tax: timing without double counting","الضريبة المؤجلة: التوقيت دون ازدواج"],"goal":["Compute the total deferred tax adjustment at no more than 15%, apply the exclusions and the five-year recapture, and bring deferred tax attributes in on transition.","احتساب إجمالي تعديل الضريبة المؤجلة بما لا يتجاوز 15%، وتطبيق الاستثناءات والاسترداد بعد خمس سنوات، وإدخال السمات الضريبية المؤجلة عند الانتقال."],"parts":[4,11],"arts":[49,50,51,103],"time":35,"metaphor":{"title":["A promissory note","سند لأمر"],"text":["A deferred tax liability is a promise to pay tax later. The draft accepts the promise today, so a timing difference does not make the Kingdom look low-taxed, but on three conditions: the promise is valued at no more than 15%, it is the right kind of promise, and it is kept within five years. Some promises are trusted without a deadline, such as tax depreciation on plant and machinery.\nA deferred tax asset is the mirror image: tax already paid, or a loss already suffered, that will lower tax later.","الالتزام الضريبي المؤجل وعدٌ بسداد الضريبة لاحقاً. ويقبل مشروع النظام الوعد اليوم، حتى لا يجعل فرق التوقيت المملكة تبدو منخفضة الضريبة، ولكن بثلاثة شروط: أن يُقيَّم الوعد بما لا يزيد على 15%، وأن يكون من النوع الصحيح، وأن يُوفى به خلال خمس سنوات. وبعض الوعود يوثق بها دون أجل، مثل الاستهلاك الضريبي للمصانع والآلات.\nأما الأصل الضريبي المؤجل فهو الصورة المقابلة: ضريبة سُددت أو خسارة وقعت، وستخفض الضريبة لاحقاً."]},"anchors":[{"if":["Deferred tax is booked at the 20% Saudi income tax rate","الضريبة المؤجلة مقيدة بمعدل ضريبة الدخل في المملكة 20%"],"then":["Recast it at 15% (Art 49(2))","أعد احتسابها بنسبة 15% (المادة 49 (2))"]},{"if":["A deferred tax liability has not reversed after five years","التزام ضريبي مؤجل لم ينعكس بعد خمس سنوات"],"then":["Unless it is a recapture exception accrual, cut covered taxes of the year it was claimed and recalculate (Arts 49(5)–(7), 50)","ما لم يكن من الاستحقاقات المستثناة من الاسترداد، اخفض ضرائب السنة التي طولب به فيها وأعد الاحتساب (المادتان 49 (5)–(7) و50)"]},{"if":["Deferred tax relates to an uncertain tax position or to distributions","الضريبة المؤجلة تتعلق بمركز ضريبي غير مؤكد أو بتوزيعات"],"then":["Leave it out: it is a disallowed accrual (Arts 49(3)(b), 51)","استبعدها: فهي استحقاق غير مسموح به (المادتان 49 (3) (ب) و51)"]},{"if":["The group enters the law with deferred tax on its balance sheet","تدخل المجموعة النظام وفي ميزانيتها ضرائب مؤجلة"],"then":["Bring it in at the lower of 15% and the domestic rate, ignoring valuation allowances (Art 103)","أدخلها بالأقل من 15% والمعدل المحلي، متجاهلاً مخصصات التقييم (المادة 103)"]}],"diagrams":[{"type":"table","title":["Deferred tax items: in, out or recaptured?","بنود الضريبة المؤجلة: داخلة أم مستبعدة أم مستردة؟"],"head":[["Item","البند"],["Treatment","المعالجة"]],"rows":[[["Deferred tax expense at 15% or less","مصروف ضريبة مؤجلة بنسبة 15% أو أقل"],["Taken as booked (Art 49(1))","يؤخذ كما هو مقيد (المادة 49 (1))"]],[["Deferred tax expense above 15%, such as Saudi CIT at 20%","مصروف ضريبة مؤجلة بأكثر من 15%، مثل ضريبة الدخل في المملكة 20%"],["Recast at 15% (Art 49(2))","يُعاد احتسابه بنسبة 15% (المادة 49 (2))"]],[["Deferred tax on items excluded from DMT income","الضريبة المؤجلة على بنود مستبعدة من الدخل"],["Out (Art 49(3)(a))","مستبعدة (المادة 49 (3) (أ))"]],[["Disallowed accruals and unclaimed accruals","الاستحقاقات غير المسموح بها وغير المطالب بها"],["Out (Arts 49(3)(b), 49(8), 51)","مستبعدة (المواد 49 (3) (ب) و49 (8) و51)"]],[["Valuation allowances and recognition adjustments on deferred tax assets","مخصصات التقييم وتعديلات الإثبات على الأصول الضريبية المؤجلة"],["Out (Art 49(3)(c))","مستبعدة (المادة 49 (3) (ج))"]],[["Remeasurement after a change in the domestic tax rate","إعادة القياس بعد تغيير معدل الضريبة المحلي"],["Out here; dealt with under Art 52(6)–(7)","مستبعدة هنا؛ وتُعالج وفق المادة 52 (6)–(7)"]],[["Deferred tax on generating and using tax credits","الضريبة المؤجلة على نشوء الائتمانات الضريبية واستخدامها"],["Out (Art 49(3)(e))","مستبعدة (المادة 49 (3) (هـ))"]],[["A liability not reversed within five years that is not a recapture exception accrual","التزام لم ينعكس خلال خمس سنوات وليس من الاستحقاقات المستثناة"],["Recaptured (Art 49(5)–(7))","يُسترد (المادة 49 (5)–(7))"]]]},{"type":"flow","title":["The five-year recapture clock","ساعة الاسترداد ذات السنوات الخمس"],"nodes":[{"t":["FY2027","2027م"],"s":["a deferred tax liability increase is counted in covered taxes","تُحتسب زيادة الالتزام الضريبي المؤجل ضمن الضرائب المشمولة"]},{"t":["FY2028 to FY2032","من 2028م إلى 2032م"],"s":["the five subsequent years to reverse","السنوات الخمس اللاحقة للانعكاس"]},{"t":["End of FY2032","نهاية 2032م"],"s":["any unreversed part, unless an exception, is recaptured","أي جزء لم ينعكس، ما لم يكن مستثنى، يُسترد"]},{"t":["Back to FY2027","العودة إلى 2027م"],"s":["reduce its covered taxes, recalculate ETR and top-up","تخفيض ضرائبها المشمولة وإعادة احتساب المعدل والضريبة التكميلية"]},{"t":["Charge in FY2032","التحميل في 2032م"],"s":["extra top-up is additional current top-up tax","الزيادة ضريبة تكميلية حالية إضافية"]}]}],"points":[{"h":["The basic rule","القاعدة الأساسية"],"t":["The total deferred tax adjustment is the deferred tax expense in the accounts for covered taxes. If it was computed at 15% or less, take it as booked; if at more than 15%, recalculate it at 15%. A Saudi income tax payer books deferred tax at 20%, so it is recast.","إجمالي تعديل الضريبة المؤجلة هو مصروف الضريبة المؤجلة في الحسابات للضرائب المشمولة. فإن احتُسب بنسبة 15% أو أقل يؤخذ كما قُيد، وإن احتُسب بأكثر من 15% يُعاد احتسابه بنسبة 15%. ودافع ضريبة الدخل في المملكة يقيد الضريبة المؤجلة بنسبة 20%، فيُعاد احتسابها."],"r":["49(1)","49(2)"]},{"h":["Five things left out","خمسة أمور مستبعدة"],"t":["Leave out deferred tax on items excluded from DMT income; on disallowed and unclaimed accruals; valuation allowances and recognition adjustments on deferred tax assets; remeasurement after a domestic rate change; and deferred tax on generating and using tax credits.","تُستبعد الضريبة المؤجلة على البنود المستبعدة من الدخل؛ وعلى الاستحقاقات غير المسموح بها وغير المطالب بها؛ ومخصصات التقييم وتعديلات الإثبات على الأصول الضريبية المؤجلة؛ وإعادة القياس بعد تغيير المعدل المحلي؛ والضريبة المؤجلة على نشوء الائتمانات الضريبية واستخدامها."],"r":["49(3)"]},{"h":["Loss assets at a low rate","أصول الخسائر بمعدل منخفض"],"t":["A deferred tax asset recorded at below 15% may be recalculated at 15% in the same year if the entity shows that it is attributable to a DMT loss.","يجوز إعادة احتساب الأصل الضريبي المؤجل المقيد بأقل من 15% بنسبة 15% في السنة نفسها إذا أثبت الكيان أنه منسوب إلى خسارة لأغراض النظام."],"r":["49(4)"]},{"h":["The five-year recapture","الاسترداد بعد خمس سنوات"],"t":["A deferred tax liability counted in covered taxes that has not reversed by the end of the fifth following year is recaptured: it reduces the covered taxes of that earlier year, whose ETR and top-up tax are recalculated, unless it is a recapture exception accrual.","الالتزام الضريبي المؤجل المحتسب ضمن الضرائب المشمولة الذي لم ينعكس بنهاية السنة الخامسة التالية يُسترد: فيخفض الضرائب المشمولة لتلك السنة السابقة، ويُعاد احتساب معدلها وضريبتها التكميلية، ما لم يكن من الاستحقاقات المستثناة من الاسترداد."],"r":["49(5)","49(6)","49(7)"]},{"h":["Recapture exception accruals","الاستحقاقات المستثناة من الاسترداد"],"t":["No recapture applies to deferred tax liabilities from: cost recovery on tangible assets; government licences for immovable property or natural resources with significant tangible investment; research and development; decommissioning and remediation; fair value net gains; foreign exchange net gains; insurance reserves and deferred acquisition costs; reinvested gains on local tangible property; and accounting changes on these.","لا يُطبق الاسترداد على الالتزامات الضريبية المؤجلة الناشئة عن: استرداد تكلفة الأصول الملموسة؛ والتراخيص الحكومية لاستخدام العقارات أو استغلال الموارد الطبيعية المتضمنة استثماراً كبيراً في أصول ملموسة؛ والبحث والتطوير؛ وإيقاف التشغيل والإصلاح البيئي؛ وصافي مكاسب القيمة العادلة؛ وصافي مكاسب الصرف الأجنبي؛ واحتياطيات التأمين وتكاليف الاقتناء المؤجلة؛ ومكاسب الممتلكات الملموسة المحلية المعاد استثمارها؛ والتغييرات المحاسبية في هذه الفئات."],"r":[50]},{"h":["Disallowed and unclaimed accruals","الاستحقاقات غير المسموح بها وغير المطالب بها"],"t":["A disallowed accrual is a deferred tax movement relating to an uncertain tax position or to distributions from a constituent entity. An unclaimed accrual is a liability increase not expected to be paid within the five-year window, which the filing entity elects each year to leave out.","الاستحقاق غير المسموح به حركة في الضريبة المؤجلة تتعلق بمركز ضريبي غير مؤكد أو بتوزيعات من كيان تابع. والاستحقاق غير المطالب به زيادة في الالتزام لا يُتوقع سدادها خلال فترة السنوات الخمس، ويختار الكيان المقدم للإقرار سنوياً عدم إدراجها."],"r":[51,"49(8)"]},{"h":["Tax rate changes","تغيير معدلات الضريبة"],"t":["If the domestic rate is cut below 15% and that creates deferred tax expense, the expense adjusts covered taxes of the earlier years. Deferred tax expense from a rate increase adjusts earlier years only when paid, and only up to the amount recalculated at 15%.","إذا خُفض المعدل المحلي إلى أقل من 15% ونشأ عن ذلك مصروف ضريبة مؤجلة، فإنه يعدّل الضرائب المشمولة للسنوات السابقة. أما مصروف الضريبة المؤجلة الناتج عن زيادة المعدل فيعدّل السنوات السابقة عند سداده فقط، وبما لا يتجاوز المبلغ المعاد احتسابه بنسبة 15%."],"r":["52(6)","52(7)"]},{"h":["Entering the law: tax attributes","دخول النظام: السمات الضريبية"],"t":["In the transition year the group takes into account all deferred tax assets and liabilities reflected or disclosed in the accounts of its Saudi entities, at the lower of 15% and the domestic rate, ignoring valuation and recognition adjustments. A loss asset recorded below 15% can be taken at 15% if the loss would have been a DMT loss.","في سنة الانتقال تأخذ المجموعة في الاعتبار جميع الأصول والالتزامات الضريبية المؤجلة الظاهرة أو المفصح عنها في حسابات كياناتها في المملكة، بالأقل من 15% والمعدل المحلي، متجاهلة تعديلات التقييم والإثبات. ويجوز أخذ أصل الخسائر المقيد بأقل من 15% بنسبة 15% إذا كانت الخسارة ستُعد خسارة لأغراض النظام."],"r":["103(1)","103(2)"]},{"h":["The 30 November 2021 cut-off","تاريخ 30 نوفمبر 2021م الفاصل"],"t":["Deferred tax assets from items excluded from DMT income are ignored if they were generated in a transaction after 30 November 2021. Assets (other than inventory) moved between group entities after that date and before the transition year keep the seller's carrying value as their basis.","تُتجاهل الأصول الضريبية المؤجلة الناشئة عن بنود مستبعدة من الدخل إذا نشأت في معاملة بعد 30 نوفمبر 2021م. وتحتفظ الأصول (عدا المخزون) المنقولة بين كيانات المجموعة بعد ذلك التاريخ وقبل سنة الانتقال بالقيمة الدفترية لدى البائع أساساً لها."],"r":["103(3)","103(4)"]}],"oecd":[{"t":["Articles 49 to 51 follow GloBE Article 4.4 and Article 103 follows Article 9.1. The draft has no equivalent of the GloBE Loss Election in Article 4.5.","تتبع المواد من 49 إلى 51 المادة 4.4 من القواعد النموذجية، وتتبع المادة 103 المادة 9.1. ولا يتضمن مشروع النظام ما يقابل اختيار خسائر القواعد العالمية في المادة 4.5."],"src":["Model Rules Arts 4.4, 4.5, 9.1","القواعد النموذجية: المواد 4.4 و4.5 و9.1"]},{"t":["KSA angle: Saudi entities generally treat Zakat as outside IAS 12 and record no deferred Zakat, so for a Zakat-only entity the deferred tax adjustment is usually nil and Zakat enters covered taxes as booked each year.","من منظور المملكة: تعامل الكيانات في المملكة الزكاة عادةً بوصفها خارج نطاق معيار المحاسبة الدولي 12 ولا تقيد زكاة مؤجلة، لذا يكون تعديل الضريبة المؤجلة للكيان الخاضع للزكاة وحدها صفراً في الغالب، وتدخل الزكاة الضرائب المشمولة كما تُقيد كل سنة."],"src":["IAS 12; Saudi practice","معيار المحاسبة الدولي 12؛ الممارسة في المملكة"]}],"reflect":{"ref":["Al-Baqarah 2:282","البقرة: 282"],"ayah":"يا أيها الذين آمنوا إذا تداينتم بدين إلى أجل مسمى فاكتبوه","t":["When you take on a debt for a fixed term, write it down. A deferred tax liability is just that: an obligation recorded today for a term ahead. The recapture rule asks what every debtor is asked: record it truthfully, and settle it when it falls due.","إذا تداينتم بدين إلى أجل مسمى فاكتبوه. والالتزام الضريبي المؤجل كذلك: التزام يُقيد اليوم لأجل قادم. وقاعدة الاسترداد تطلب ما يُطلب من كل مدين: أن يقيده بصدق، ويسدده عند حلوله."]},"cases":[{"t":["Recasting 20% deferred tax at 15%","إعادة احتساب ضريبة مؤجلة بنسبة 20% إلى 15%"],"facts":["Gulf Petrochem (Saudi, wholly foreign-owned, income tax at 20%) books FY2027 deferred tax expense of SAR 8m, all at 20%:\n• SAR 6m from tax depreciation on plant running ahead of book depreciation\n• SAR 2m on fair value gains on a 25% shareholding, which are excluded equity gains","تقيد شركة الخليج للبتروكيماويات (سعودية، مملوكة بالكامل لأجانب، وتخضع لضريبة الدخل 20%) مصروف ضريبة مؤجلة لعام 2027م قدره 8 ملايين ريال، كله بنسبة 20%:\n• 6 ملايين من الاستهلاك الضريبي للمصنع الذي يسبق الاستهلاك الدفتري\n• مليونا ريال على مكاسب القيمة العادلة لحصة 25%، وهي مكاسب ملكية مستبعدة"],"steps":[{"t":["Remove deferred tax on the excluded equity gains:","استبعد الضريبة المؤجلة على مكاسب الملكية المستبعدة:"],"x":"8000000-2000000","v":6000000,"u":"SAR"},{"t":["Recast the rest from 20% to 15%:","أعد احتساب الباقي من 20% إلى 15%:"],"x":"6000000*15/20","v":4500000,"u":"SAR"}],"ans":["The total deferred tax adjustment is SAR 4.5m. The plant liability is cost recovery on tangible assets, a recapture exception accrual, so it is not exposed to the five-year recapture.","إجمالي تعديل الضريبة المؤجلة 4.5 ملايين ريال. والتزام المصنع ناشئ عن استرداد تكلفة أصول ملموسة، وهو من الاستحقاقات المستثناة، فلا يخضع للاسترداد بعد خمس سنوات."],"r":["49(2)","49(3)","50"]},{"t":["A liability that does not reverse","التزام لا ينعكس"],"facts":["In FY2027 a Saudi company counted a SAR 10m increase (at 15%) in a deferred tax liability on an intangible asset, which is not a recapture exception category. At 31 December 2032, SAR 6m of it has not reversed. FY2027 figures for the Kingdom: net DMT income SAR 400m, Adjusted Covered Taxes SAR 62m, substance-based income exclusion SAR 100m.","في 2027م احتسبت شركة في المملكة زيادة قدرها 10 ملايين ريال (بنسبة 15%) في التزام ضريبي مؤجل على أصل غير ملموس، وهو ليس من الفئات المستثناة من الاسترداد. وفي 31 ديسمبر 2032م لم ينعكس منها 6 ملايين ريال. أرقام المملكة لعام 2027م: صافي الدخل 400 مليون ريال، والضرائب المشمولة المعدلة 62 مليون ريال، والاستبعاد على أساس جوهر النشاط 100 مليون ريال."],"steps":[{"t":["Original FY2027 ETR:","المعدل الفعلي الأصلي لعام 2027م:"],"x":"62000000/400000000*100","v":15.5,"u":"%"},{"t":["Recalculated ETR after recapturing SAR 6m:","المعدل المعاد احتسابه بعد استرداد 6 ملايين ريال:"],"x":"(62000000-6000000)/400000000*100","v":14,"u":"%"},{"t":["Top-up percentage:","نسبة الضريبة التكميلية:"],"x":"15-14","v":1,"u":"%"},{"t":["Additional current top-up tax, charged in FY2032:","الضريبة التكميلية الحالية الإضافية، وتُحمّل في 2032م:"],"x":"1/100*(400000000-100000000)","v":3000000,"u":"SAR"}],"ans":["FY2027 drops below 15% and SAR 3m of additional current top-up tax arises in FY2032. Had the liability come from tax depreciation on tangible assets, nothing would have been recaptured.","ينخفض معدل 2027م إلى ما دون 15% وتنشأ ضريبة تكميلية حالية إضافية قدرها 3 ملايين ريال في 2032م. ولو نشأ الالتزام عن الاستهلاك الضريبي لأصول ملموسة لما استُرد شيء."],"r":["49(5)","49(6)","49(7)","63(2)"]},{"t":["Bringing deferred tax into the transition year","إدخال الضريبة المؤجلة في سنة الانتقال"],"facts":["At the start of FY2027, its transition year, a Saudi income tax payer shows (at 20%):\n• Deferred tax asset on tax losses carried forward: SAR 20m, with a valuation allowance of SAR 5m against it; the losses would have been DMT losses\n• Deferred tax liability on accelerated tax depreciation: SAR 12m","في بداية 2027م، سنة الانتقال، يُظهر دافع لضريبة الدخل في المملكة (بنسبة 20%):\n• أصل ضريبي مؤجل على خسائر ضريبية مرحّلة: 20 مليون ريال، وعليه مخصص تقييم 5 ملايين ريال؛ وكانت الخسائر ستُعد خسائر لأغراض النظام\n• التزام ضريبي مؤجل على الاستهلاك الضريبي المعجل: 12 مليون ريال"],"steps":[{"t":["Ignore the valuation allowance and take the asset at 15% (lower of 15% and 20%):","تجاهل مخصص التقييم وخذ الأصل بنسبة 15% (الأقل من 15% و20%):"],"x":"20000000*15/20","v":15000000,"u":"SAR"},{"t":["Take the liability at 15%:","خذ الالتزام بنسبة 15%:"],"x":"12000000*15/20","v":9000000,"u":"SAR"},{"t":["Net deferred tax asset brought into the law:","صافي الأصل الضريبي المؤجل المُدخل في النظام:"],"x":"15000000-9000000","v":6000000,"u":"SAR"}],"ans":["A net SAR 6m deferred tax asset at 15% comes in. As the losses are used, the asset reverses into covered taxes, so years sheltered by old losses do not look low-taxed.","يدخل صافي أصل ضريبي مؤجل قدره 6 ملايين ريال بنسبة 15%. ومع استخدام الخسائر ينعكس الأصل في الضرائب المشمولة، فلا تبدو السنوات المحمية بالخسائر القديمة منخفضة الضريبة."],"r":["103(1)","103(2)"]}],"quiz":[{"q":["A Saudi company books deferred tax at 20%. What enters the total deferred tax adjustment?","تقيد شركة في المملكة الضريبة المؤجلة بنسبة 20%. ما الذي يدخل إجمالي تعديل الضريبة المؤجلة؟"],"o":[["The full 20% amount","المبلغ كاملاً بنسبة 20%"],["The amount recalculated at 15%","المبلغ المعاد احتسابه بنسبة 15%"],["Nothing","لا شيء"],["Half of it","نصفه"]],"a":1,"e":["Article 49(2).","المادة 49 (2)."],"r":["49(2)"]},{"q":["Deferred tax is booked at 10% in a low-tax jurisdiction. What enters?","قُيدت الضريبة المؤجلة بنسبة 10% في ولاية منخفضة الضريبة. ما الذي يدخل؟"],"o":[["The amount as booked","المبلغ كما قُيد"],["The amount grossed up to 15%","المبلغ مرفوعاً إلى 15%"],["Nothing","لا شيء"],["Double the amount","ضعف المبلغ"]],"a":0,"e":["Article 49(1): at or below 15%, it is taken as booked.","المادة 49 (1): بنسبة 15% أو أقل، يؤخذ كما قُيد."],"r":["49(1)"]},{"q":["Which of these is left out of the total deferred tax adjustment?","أي مما يلي يُستبعد من إجمالي تعديل الضريبة المؤجلة؟"],"o":[["Deferred tax on accelerated tax depreciation","الضريبة المؤجلة على الاستهلاك الضريبي المعجل"],["A change in the valuation allowance on a deferred tax asset","تغير مخصص التقييم على أصل ضريبي مؤجل"],["Deferred tax on a provision","الضريبة المؤجلة على مخصص"],["Deferred tax on lease
