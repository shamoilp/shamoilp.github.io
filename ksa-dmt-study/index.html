/* VOICE  a practitioner's study course: precise, cited, plain words first
   IDEA   learn by habit: a picture first, a trigger-response anchor, worked cases, then spaced recall
   PICTURE the draft law as a road: scope gate, income, taxes, rate, top-up, filing
   COLOUR navy band and table heads (advisory house style), gold for anchors and limits, green only for correct answers, red for wrong ones
   TYPE   system sans; installed Arabic fonts for Arabic; numbers always left-to-right
   LAYOUT phone: one column. 1600px+: module rail, lesson, article reader. 2400px+: lesson beside practice. 3200px+: lesson, cases and quiz or cards side by side, plus reader */
:root{--bg:#ffffff;--ink:#0f1b2d;--muted:#556479;--line:#dde3ec;--pane:#f4f6fa;--band:#0f2747;--bandink:#ffffff;--accent:#1f4e9c;--btnink:#ffffff;--gold:#c8a24a;--goldsoft:#fbf3df;--ok:#1d7a46;--oksoft:#e7f5ec;--bad:#b4232a;--badsoft:#fdecec;--radius:14px;--shadow:0 1px 2px rgb(15 27 45 / 7%)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--ink:#e7ecf5;--muted:#9aa7bd;--line:#243149;--pane:#111a2b;--band:#0a1a33;--accent:#8fb4ff;--btnink:#0b1220;--goldsoft:#2a2414;--oksoft:#10291c;--badsoft:#2d1517;--shadow:none}}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
html[lang=ar] body{font-family:"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic","Geeza Pro","Arabic UI Text",Tahoma,Arial,sans-serif;line-height:1.85}
a{color:var(--accent)}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
.skip{position:absolute;inset-inline-start:-999px;top:8px;background:var(--gold);color:#000;padding:8px 12px;border-radius:8px;z-index:9}
.skip:focus{inset-inline-start:8px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.band{background:var(--band);color:var(--bandink);padding:12px max(16px,2.4vw)}
.band-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{display:flex;flex-direction:column;margin-inline-end:auto;text-decoration:none;color:inherit}
.brand b{font-size:clamp(19px,2.2vw,24px);letter-spacing:-.01em;line-height:1.15}
.brand small{color:#c9d5ea;font-size:13px}
.langbtn{background:var(--gold);color:#1b1405;border:0;border-radius:999px;padding:6px 14px;font-weight:700}
nav.main{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
nav.main a{color:#e3eaf6;text-decoration:none;padding:6px 10px;border-radius:999px;font-size:15px}
nav.main a[aria-current=page]{background:rgb(255 255 255 / 15%);color:#fff;font-weight:600}
main{max-width:980px;margin:0 auto;padding:18px max(14px,3vw) 40px}
body:not([data-lv="0"]) main{max-width:none;padding:18px max(20px,1.6vw) 40px}
main:focus{outline:none}
.narrow{max-width:900px;margin-inline:auto}
h1,h2,h3{line-height:1.25;margin:0 0 10px}
h1{font-size:clamp(24px,2.6vw,32px);letter-spacing:-.01em}
h2{font-size:clamp(19px,2vw,23px)}
h3{font-size:17px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.lede{font-size:17px;color:var(--muted);max-width:72ch}
.draft{background:var(--goldsoft);border:1px solid var(--gold);border-radius:var(--radius);padding:10px 14px;font-size:14.5px;margin:12px 0 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--pane);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--btnink);border-radius:999px;padding:8px 16px;font-weight:600;text-decoration:none;font-size:15px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1405}
.hub{display:block}
body:not([data-lv="0"]) .hub{display:grid;grid-template-columns:minmax(360px,500px) minmax(0,1fr);gap:32px;align-items:start}
body:not([data-lv="0"]) .hub .intro{position:sticky;top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.mod{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-decoration:none;color:inherit;background:var(--bg);box-shadow:var(--shadow)}
.mod:hover{border-color:var(--accent)}
.mod .mnum{font-size:13px;font-weight:700;color:var(--accent)}
.mod h3{margin:0}
.mod p{margin:0;font-size:14.5px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}
.crumbs{font-size:14px;margin-bottom:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin:8px 0 14px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabs a{flex:none;white-space:nowrap;text-decoration:none;color:var(--ink);padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-size:15px}
.tabs a[aria-current=page]{background:var(--band);border-color:var(--band);color:#fff}
@media (max-width:560px){.tabs{flex-wrap:wrap;overflow:visible}}
.colh{font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:2px 0 8px}
html[lang=ar] .colh{letter-spacing:0;text-transform:none}
/* module layout */
.mv{display:block}
.rail,.reader{display:none}
body:not([data-lv="0"]) .mv{display:grid;gap:22px;align-items:start;justify-content:center}
body[data-lv="1"] .mv{grid-template-columns:250px minmax(0,900px) minmax(400px,760px);grid-template-areas:"rail head reader" "rail c1 reader"}
body[data-lv="2"] .mv{grid-template-columns:260px minmax(0,860px) minmax(0,860px) minmax(420px,820px);grid-template-areas:"rail head head reader" "rail c1 c2 reader"}
body[data-lv="3"] .mv{grid-template-columns:270px repeat(3,minmax(0,820px)) minmax(440px,880px);grid-template-areas:"rail head head head reader" "rail c1 c2 c3 reader"}
body:not([data-lv="0"]) .rail,body:not([data-lv="0"]) .reader{display:block;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--pane);padding:12px}
.rail{grid-area:rail;grid-row:1 / span 2}.reader{grid-area:reader;grid-row:1 / span 2}.mhead{grid-area:head}.c1{grid-area:c1}.c2{grid-area:c2}.c3{grid-area:c3}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rail ol a{display:grid;grid-template-columns:1.8em 1fr;gap:6px;padding:6px 8px;border-radius:10px;text-decoration:none;color:inherit;font-size:14px;line-height:1.35}
.rail ol a:hover{background:var(--bg)}
.rail ol a[aria-current=page]{background:var(--band);color:#fff}
.rail .n{font-weight:700;color:var(--gold)}
.rail .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.reader select{width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);margin:4px 0 10px}
.reader h3{margin-top:4px}
.reader .lawtext{font-size:15px}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:12px 0;background:var(--bg);box-shadow:var(--shadow)}
.card.metaphor{background:var(--goldsoft);border-color:var(--gold)}
.card.reflect{border-inline-start:5px solid var(--gold)}
.card.reflect .ayah{font-family:"Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;font-size:21px;line-height:1.9;margin:4px 0 6px}
.card h3 .k{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:2px}
html[lang=ar] .card h3 .k{text-transform:none;letter-spacing:0}
.anchors{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.anchors li{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:var(--pane);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:15px}
.anchors .arr{color:var(--gold);font-weight:800}
html[dir=rtl] .anchors .arr{display:inline-block;transform:scaleX(-1)}
.anchors .if b,.anchors .then b{display:block;font-size:12px;color:var(--muted);font-weight:700}
@media (max-width:560px){.anchors li{grid-template-columns:1fr;gap:2px}.anchors .arr{justify-self:center;display:inline-block;line-height:1;transform:rotate(90deg)}html[dir=rtl] .anchors .arr{transform:rotate(90deg)}}
.points{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.points li{border-inline-start:4px solid var(--accent);padding-inline-start:12px}
.points b{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);text-decoration:none;background:transparent}
.chip:hover,.chip.on{background:var(--accent);color:var(--btnink)}
.oecd{border-inline-start:4px solid var(--gold);background:var(--pane);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15px}
.oecd .src{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.dg{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:12px 0;background:var(--pane)}
.dg-title{font-weight:700;margin-bottom:10px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .node{flex:1 1 130px;overflow-wrap:break-word;background:var(--bg);border:1px solid var(--line);border-top:4px solid var(--band);border-radius:10px;padding:8px 10px;font-size:14px}
.flow .node b{display:block;font-size:14.5px}
.flow .node span{color:var(--muted);font-size:13px}
.flow .ar{align-self:center;color:var(--gold);font-weight:800;font-size:18px}
html[dir=rtl] .flow .ar{transform:scaleX(-1)}
@media (max-width:560px){.flow{flex-direction:column;flex-wrap:nowrap;gap:3px}.flow .node{flex:none}.flow .ar{align-self:center;line-height:1;transform:rotate(90deg)}html[dir=rtl] .flow .ar{transform:rotate(90deg)}}
.tree{font-size:14.5px}
.tree .q{background:var(--bg);border:1px solid var(--line);border-inline-start:4px solid var(--band);border-radius:10px;padding:8px 10px;font-weight:600}
.tree .br{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 0;padding-inline-start:14px;border-inline-start:2px dashed var(--line)}
.tree .br.ln{grid-template-columns:minmax(110px,1fr) 2.2fr}
.tree .br.ly{grid-template-columns:2.2fr minmax(110px,1fr)}
.tree .lab{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px}
.tree .end{border-radius:10px;padding:8px 10px;font-weight:600}
.tree .end.in{background:var(--goldsoft);border:1px solid var(--gold)}
.tree .end.out{background:var(--bg);border:1px dashed var(--muted)}
.tree .end.na{background:var(--bg);border:1px solid var(--line)}
@media (max-width:560px){.tree .br,.tree .br.ln,.tree .br.ly{grid-template-columns:1fr}}
.tree,.tree .br>div{container-type:inline-size}
@container (max-width:340px){.tree .br,.tree .br.ln,.tree .br.ly{grid-template-columns:1fr}}
.formula{display:grid;gap:6px}
.formula .row{display:grid;grid-template-columns:minmax(0,1.1fr) auto minmax(0,2fr);gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14.5px}
.formula .op{font-weight:800;color:var(--gold)}
.formula .l{font-weight:700}
.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--bg)}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:start;vertical-align:top}
.tbl th{background:var(--band);color:#fff;font-weight:600}
.tbl tbody tr:nth-child(even) td{background:var(--pane)}
.bars{display:grid;gap:8px}
.bars .b{display:grid;grid-template-columns:minmax(90px,1fr) 3fr auto;gap:8px;align-items:center;font-size:14px}
.bars .t{height:14px;background:var(--line);border-radius:9px;overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--accent)}
.bars .t i.g{background:var(--gold)}
.bars .t i.c{background:var(--bad)}
.dg-cap{font-size:13px;color:var(--muted);margin:-4px 0 8px}
.colc{max-width:520px}
.cplot{position:relative;height:170px;display:flex;align-items:flex-end;gap:12px;border-bottom:1.5px solid var(--muted);padding:0 4px}
.ccol{flex:1;height:100%;display:flex;align-items:flex-end}
.cbar{width:100%;min-height:24px;background:var(--accent);border-radius:6px 6px 0 0;display:flex;justify-content:center;align-items:flex-end;padding-bottom:5px;color:var(--btnink);font-size:13px;font-weight:700}
.cbar.lo{background:var(--line);color:var(--ink)}
.cline{position:absolute;left:0;right:0;border-top:2px dashed var(--gold);z-index:1;pointer-events:none}
.clabs{display:flex;gap:12px;padding:4px 4px 0}
.clabs span{flex:1;text-align:center;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.colc.many .cplot,.colc.many .clabs{gap:5px}
.colc.many .clabs span,.colc.many .cbar{font-size:11.5px}
.clegend{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:8px;color:var(--muted)}
.clegend i{display:inline-block;width:22px;border-top:2px dashed var(--gold)}
.verdict{margin-top:10px;border-radius:10px;padding:8px 12px;font-weight:700}
.verdict.in{background:var(--oksoft);border:1px solid var(--ok)}
.verdict.out{background:var(--badsoft);border:1px solid var(--bad)}
.wf{display:grid;gap:6px}
.wr{display:grid;grid-template-columns:minmax(120px,1.6fr) 2.4fr minmax(52px,auto);gap:8px;align-items:center;font-size:14px}
.wt{position:relative;height:16px;background:var(--bg);border-radius:6px}
.wt i{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--accent)}
.wr.sub .wt i{background:var(--bad)}
.wr.sum .wt i{background:var(--gold)}
.wr.sum .wl,.wr.sum .wv{font-weight:700}
.wv{text-align:end}
.gt{position:relative;height:22px;background:var(--bg);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.gt i{position:absolute;top:0;bottom:0}
.gt .gf{inset-inline-start:0;background:var(--accent)}
.gt .gg{background:repeating-linear-gradient(45deg,var(--bad) 0 5px,transparent 5px 9px);opacity:.8}
.gt .gm{width:3px;margin-inline-start:-1px;background:var(--gold)}
.gl{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-top:6px;color:var(--muted)}
.gl b{color:var(--ink)}
.gap{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:8px;font-weight:600}
.gap i{width:20px;height:12px;border-radius:3px;display:inline-block;background:repeating-linear-gradient(45deg,var(--bad) 0 4px,transparent 4px 7px)}
.org{overflow-x:auto;padding-bottom:4px}
.org ul{display:flex;justify-content:center;list-style:none;margin:0;padding:22px 0 0;position:relative;direction:ltr}
.org > ul{padding-top:0}
.org li{display:flex;flex-direction:column;align-items:center;position:relative;padding:22px 6px 0}
.org li::before,.org li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:22px;border-top:1.5px solid var(--muted)}
.org li::after{right:auto;left:50%;border-left:1.5px solid var(--muted)}
.org li:only-child::before,.org li:only-child::after{display:none}
.org li:only-child{padding-top:0}
.org li:first-child::before,.org li:last-child::after{border:0}
.org li:last-child::before{border-right:1.5px solid var(--muted)}
.org ul ul::before{content:"";position:absolute;top:0;left:50%;height:22px;border-left:1.5px solid var(--muted)}
.org > ul > li{padding-top:0}
.org > ul > li::before,.org > ul > li::after{display:none}
.on{background:var(--bg);border:1px solid var(--line);border-top:4px solid var(--band);border-radius:10px;padding:6px 10px;min-width:112px;max-width:210px;text-align:center;font-size:14px}
.on b{display:block}
.on span{color:var(--muted);font-size:12.5px}
.on.in{border-top-color:var(--gold);background:var(--goldsoft)}
.on.out{border-top-style:dashed}
html[dir=rtl] .on{direction:rtl}
.oe{font-size:12px;border:1px solid var(--muted);border-radius:999px;padding:0 8px;background:var(--bg);margin-bottom:3px;direction:ltr;unicode-bidi:isolate}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 18px;margin:0}
.terms div{border-inline-start:3px solid var(--gold);padding-inline-start:10px}
.terms dt{font-weight:700}
.terms dd{margin:0;font-size:14.5px;color:var(--muted)}
.points .plain{margin:3px 0 5px;font-size:16.5px;line-height:1.5}
.points .detail{font-size:15px;color:var(--muted)}
.viewsw{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;margin-top:10px;background:var(--pane)}
.viewsw button{border:0;background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.viewsw button[aria-pressed=true]{background:var(--band);color:#fff}
.ans .bl{display:block;font-weight:700}
.qbanner{background:var(--goldsoft);border:1px solid var(--gold);border-radius:10px;padding:8px 12px;font-size:14.5px;margin:2px 0 12px}
.bline{background:var(--oksoft);border:1px solid var(--ok);border-radius:10px;padding:10px 12px;margin-top:10px}
.bline b{display:block;font-size:12.5px;color:var(--muted);margin-bottom:2px}
.ans .dg{background:var(--bg)}
.calc{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;font-size:14px;background:var(--pane);border:1px solid var(--line);border-radius:8px;padding:2px 7px;display:inline-block;margin-top:4px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.case .facts{background:var(--pane);border-radius:10px;padding:10px 12px;margin:8px 0;white-space:pre-line;font-size:15px}
.steps{list-style:none;padding:0;margin:8px 0;display:grid;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:15px}
.steps li::before{content:counter(s);background:var(--band);color:#fff;border-radius:999px;width:24px;height:24px;display:grid;place-items:center;font-size:13px;font-weight:700}
.steps .v{font-weight:700}
.ans{background:var(--oksoft);border:1px solid var(--ok);border-radius:10px;padding:10px 12px;margin-top:8px;white-space:pre-line}
.q{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:12px 0}
.q .qn{font-size:13px;color:var(--muted);font-weight:700}
.q .qt{font-weight:600;margin:4px 0 10px}
.opts{display:grid;gap:8px}

<script type="application/json" id="course-data">{"about":[{"h":["What this is","ما هذه الدورة"],"p":[["A free, self-paced course on Saudi Arabia's draft Domestic Minimum Tax (DMT) Law, the Kingdom's Pillar Two domestic top-up tax. Fifteen modules follow the draft's twelve Parts. Each module opens with a picture and trigger-response anchors, works three case studies with numbers, then tests you with a quiz that gives instant feedback and flashcards that come back on a spaced schedule.","دورة مجانية للتعلم الذاتي حول مشروع نظام ضريبة الحد الأدنى المحلي في المملكة العربية السعودية، وهو الضريبة التكميلية المحلية ضمن الركيزة الثانية. تتبع خمس عشرة وحدة أجزاء المشروع الاثني عشر. تبدأ كل وحدة بصورة ذهنية ومحفّزات واستجابات، ثم ثلاث دراسات حالة بالأرقام، ثم اختبار بتغذية راجعة فورية وبطاقات مراجعة تعود وفق جدول متباعد."],["Every key point leads with a one-line plain version, each module lists the words you will meet, and every case has a diagram and a one-line bottom line. Choose Quick view for the essentials in about five minutes, or Full view for the detail and the OECD notes.","وتبدأ كل نقطة رئيسية بسطر واحد بلغة مبسطة، وتضم كل وحدة المصطلحات التي ستصادفها، ولكل حالة رسم توضيحي وخلاصة في سطر واحد. اختر «عرض سريع» للأساسيات في نحو خمس دقائق، أو «عرض كامل» للتفاصيل وملاحظات منظمة التعاون الاقتصادي والتنمية."],["The format follows GMT Study, an open study course on the Singapore and OECD rules (github.com/LYM-00/Beps-2.0-E-learning-quiz). Everything here is written fresh for the Saudi draft, and every answer cites the article it comes from.","يتبع الشكل دورة GMT Study المفتوحة حول القواعد السنغافورية وقواعد المنظمة (github.com/LYM-00/Beps-2.0-E-learning-quiz). أما المحتوى هنا فمكتوب من جديد لمشروع النظام السعودي، وكل إجابة تذكر المادة التي تستند إليها."]]},{"h":["Sources and dates","المصادر والتواريخ"],"p":[["The draft: 'Draft Domestic Minimum Tax Law' (مشروع نظام ضريبة الحد الأدنى المحلي), a 75-page bilingual PDF created on 16 November 2026, with 106 articles in 12 Parts. The article text in this course was extracted from that PDF; check the official text for exact wording.","المشروع: «مشروع نظام ضريبة الحد الأدنى المحلي»، ملف PDF ثنائي اللغة من 75 صفحة أُنشئ في 16 نوفمبر 2026م، يضم 106 مواد في 12 جزءاً. استُخرج نص المواد في هذه الدورة من ذلك الملف، فراجع النص الرسمي للصياغة الدقيقة."],["On 19 November 2026 ZATCA announced that it will apply the domestic minimum top-up tax from 1 January 2027 to entities of multinational groups with annual revenue of €750 million or more (zatca.gov.sa, news).","أعلنت هيئة الزكاة والضريبة والجمارك في 19 نوفمبر 2026م تطبيق الضريبة التكميلية للحد الأدنى المحلي اعتباراً من 1 يناير 2027م على الكيانات التابعة للمجموعات متعددة الجنسيات التي تبلغ إيراداتها السنوية 750 مليون يورو أو أكثر (zatca.gov.sa، المركز الإعلامي)."],["The OECD notes compare the draft with the OECD/G20 GloBE Model Rules (December 2021) and later OECD guidance. They are comparisons, not part of the Saudi draft.","تقارن ملاحظات المنظمة المشروعَ بالقواعد النموذجية لمكافحة تآكل الوعاء الضريبي العالمي الصادرة عن الإطار الشامل لمجموعة العشرين ومنظمة التعاون الاقتصادي والتنمية (ديسمبر 2021م) والإرشادات اللاحقة. وهي مقارنات وليست جزءاً من المشروع السعودي."]]},{"h":["Limits","حدود الاستخدام"],"p":[["The law is a draft and its implementing Regulations are not yet issued, so articles, numbering and figures may change. This is a study aid, not tax or legal advice. The case studies use invented groups and round numbers to show the mechanics.","النظام ما يزال مشروعاً ولم تصدر لائحته التنفيذية بعد، لذا قد تتغير المواد وترقيمها والأرقام. هذه أداة للدراسة وليست استشارة ضريبية أو قانونية. وتستخدم دراسات الحالة مجموعات افتراضية وأرقاماً مقرّبة لتوضيح طريقة العمل."]]},{"h":["Privacy","الخصوصية"],"p":[["The page loads nothing from other sites and sends nothing anywhere. Your quiz answers, flashcard history and language choice are kept in this browser only. Use the buttons below to save them to a file, move them to another device or clear them.","لا تحمّل الصفحة أي شيء من مواقع أخرى ولا ترسل أي بيانات. تُحفظ إجابات الاختبارات وسجل البطاقات واختيار اللغة في هذا المتصفح فقط. استخدم الأزرار أدناه لحفظها في ملف أو نقلها إلى جهاز آخر أو مسحها."]]}],"glossary":[{"en":"Law (Domestic Minimum Tax Law)","ar":"النظام (نظام ضريبة الحد الأدنى المحلي)","r":1},{"en":"Regulations","ar":"اللائحة","r":1},{"en":"Kingdom","ar":"المملكة","r":1},{"en":"The Authority (ZATCA)","ar":"الهيئة (هيئة الزكاة والضريبة والجمارك)","r":1},{"en":"The Board","ar":"المجلس","r":1},{"en":"Tax Treaty","ar":"الاتفاقية الضريبية","r":1},{"en":"Qualifying Competent Authority Agreement","ar":"اتفاقية سلطة مختصة مؤهلة","r":1},{"en":"Annual Election","ar":"الاختيار السنوي","r":1},{"en":"Five-Year Election","ar":"اختيار الخمس سنوات","r":1},{"en":"Real Estate Investment Vehicle","ar":"الأداة الاستثمارية العقارية","r":1},{"en":"Authorised Accounting Body","ar":"الجهة المحاسبية المعتمدة","r":1},{"en":"Minimum Rate (15%)","ar":"الحد الأدنى (15%)","r":1},{"en":"Other Comprehensive Income","ar":"الدخل الشامل الآخر","r":1},{"en":"Transition Year","ar":"السنة الانتقالية","r":1},{"en":"Fiscal Year","ar":"السنة المالية","r":93},{"en":"Reporting Fiscal Year","ar":"السنة المالية لتقديم الإقرار","r":1},{"en":"Joint Venture Subsidiary","ar":"الشركة التابعة لمشروع مشترك","r":1},{"en":"Qualified Domestic Minimum Top-up Tax (QDMTT)","ar":"الضريبة التكميلية المحلية الأدنى المؤهلة","r":1},{"en":"Domestic Top-up Tax","ar":"الضريبة التكميلية المحلية","r":1},{"en":"Constituent Entity-owner","ar":"الكيان التابع المالك","r":1},{"en":"Filing Constituent Entity","ar":"الكيان التابع المعين لتقديم الإقرار","r":1},{"en":"Main Entity","ar":"الكيان الرئيسي","r":1},{"en":"Flow-through Entity","ar":"الكيان الشفاف مالياً","r":1},{"en":"Tax Transparent Entity","ar":"الكيان الشفاف ضريبياً","r":1},{"en":"Reference Entity","ar":"الكيان المرجعي","r":1},{"en":"Group Entity","ar":"الكيان في المجموعة","r":1},{"en":"Entity","ar":"الكيان","r":1},{"en":"Authorised Financial Accounting Standard","ar":"المعايير المحاسبية المالية المعتمدة","r":1},{"en":"Acceptable Financial Accounting Standard","ar":"المعايير المحاسبية المالية المقبولة","r":1},{"en":"Taxpayer","ar":"المكلف","r":1},{"en":"UPE Jurisdiction","ar":"الولاية القضائية للكيان الأم النهائي","r":1},{"en":"Portfolio Shareholding","ar":"حصة الملكية المحدودة","r":1},{"en":"Ownership Interest","ar":"حصة الملكية","r":1},{"en":"DMT Income of all Constituent Entities","ar":"دخل ضريبة الحد الأدنى المحلي لجميع الكيانات التابعة","r":1},{"en":"DMT Losses of all Constituent Entities","ar":"خسائر ضريبة الحد الأدنى المحلي لجميع الكيانات التابعة","r":1},{"en":"Net DMT Loss","ar":"صافي خسائر ضريبة الحد الأدنى المحلي","r":1},{"en":"Net DMT Income","ar":"صافي دخل ضريبة الحد الأدنى المحلي","r":53},{"en":"Qualified Imputation Tax","ar":"ضريبة الإسناد المؤهلة","r":1},{"en":"Qualified UTPR","ar":"قاعدة الأرباح الخاضعة لمعدل ضريبي منخفض المؤهلة","r":1},{"en":"Qualified IIR","ar":"قاعدة تضمين الدخل المؤهلة","r":1},{"en":"Income Inclusion Rule (IIR)","ar":"قاعدة تضمين الدخل","r":1},{"en":"GloBE Rules","ar":"قواعد مكافحة تآكل الوعاء الضريبي العالمي","r":1},{"en":"Income Tax Law","ar":"نظام ضريبة الدخل","r":1},{"en":"Special Economic Zones","ar":"المناطق الاقتصادية الخاصة","r":2},{"en":"Stateless Constituent Entity","ar":"الكيان التابع عديم الجنسية","r":2},{"en":"Revenue","ar":"الإيرادات","r":3},{"en":"Consolidated Financial Statements","ar":"القوائم المالية الموحدة","r":4},{"en":"Tax Resident","ar":"المقيم الضريبي","r":6},{"en":"Controlling Interest","ar":"الحصة المسيطرة","r":7},{"en":"MNE Group","ar":"المجموعة المتعددة الجنسيات","r":8},{"en":"Constituent Entity","ar":"الكيان التابع","r":9},{"en":"Ultimate Parent Entity (UPE)","ar":"الكيان الأم النهائي","r":10},{"en":"Permanent Establishment","ar":"المنشأة الدائمة","r":11},{"en":"Excluded Entity","ar":"الكيان المستبعد","r":12},{"en":"Governmental Entity","ar":"الكيان الحكومي","r":13},{"en":"International Organisation","ar":"المنظمة الدولية","r":14},{"en":"Non-profit Organisation","ar":"المنظمة غير الربحية","r":15},{"en":"Pension Fund","ar":"صندوق التقاعد","r":16},{"en":"Investment Fund","ar":"صندوق الاستثمار","r":17},{"en":"Net Taxes Expense","ar":"صافي المصاريف الضريبية","r":20},{"en":"Excluded Dividends","ar":"توزيعات الأرباح المستبعدة","r":21},{"en":"Excluded Equity Gain or Loss","ar":"مكاسب أو خسائر حقوق الملكية المستبعدة","r":22},{"en":"Policy Disallowed Expenses","ar":"المصاريف غير جائزة الحسم وفقاً للنظام","r":27},{"en":"Covered Taxes","ar":"الضرائب المشمولة","r":42},{"en":"Adjusted Covered Taxes","ar":"الضرائب المشمولة المعدلة","r":44},{"en":"Effective Tax Rate (ETR)","ar":"معدل الضريبة الفعلي","r":53},{"en":"Top-up Tax Percentage","ar":"نسبة الضريبة التكميلية","r":54},{"en":"Excess Profit","ar":"الربح الزائد","r":55},{"en":"Substance-based Income Exclusion (SBIE)","ar":"الاستبعاد على أساس جوهر النشاط","r":58},{"en":"Additional Current Top-up Tax","ar":"الضريبة التكميلية الحالية الإضافية","r":63},{"en":"De Minimis Exclusion","ar":"استبعاد المستوى الأدنى","r":64},{"en":"DMT Safe Harbour","ar":"الملاذ الآمن لضريبة الحد الأدنى المحلي","r":66},{"en":"Joint Venture","ar":"المشروع المشترك","r":79},{"en":"Multi-Parented MNE Group","ar":"المجموعة المتعددة الجنسيات ذات كيانات أم متعددة","r":81},{"en":"Investment Entity","ar":"الكيان الاستثماري","r":86}],"modules":[{"id":1,"title":["The big picture: what the DMT is and how it works","الصورة الكاملة: ما ضريبة الحد الأدنى المحلي وكيف تعمل"],"goal":["Explain in two minutes what the Saudi DMT is, who it covers, from when, how the top-up is worked out and who pays.","أن تشرح في دقيقتين ما ضريبة الحد الأدنى المحلي في المملكة، ومن تشمل، ومتى تبدأ، وكيف تُحسب الضريبة التكميلية، ومن يدفعها."],"parts":[1,2,5,6,7,12],"arts":[1,2,53,54,55,56,57,66,73,106],"time":25,"metaphor":{"title":["One tank, one gauge","خزّان واحد ومؤشّر واحد"],"text":["Picture every Saudi company of a large group pouring its profit into one shared tank. A gauge on the tank shows the tax rate: the taxes those companies pay, divided by that profit. There is a line on the gauge at 15%.\nIf the needle sits below the line, the DMT pump tops the tank up to 15%. It pumps only on the profit left after an allowance for real staff and assets. And Saudi Arabia pumps first, before any other country's top-up rule can reach the same profit.","تخيّل أن كل شركة في المملكة تابعة لمجموعة كبيرة تصبّ ربحها في خزّان واحد مشترك. وعلى الخزّان مؤشّر يبيّن معدل الضريبة: الضرائب التي تدفعها هذه الشركات مقسومة على ذلك الربح. وعلى المؤشّر خطّ عند 15%.\nإذا كان المؤشّر تحت الخط، تضخّ ضريبة الحد الأدنى المحلي ما يرفع الخزّان إلى 15%. ولا تضخّ إلا على الربح المتبقي بعد بدلٍ عن الموظفين والأصول الحقيقية. والمملكة تضخّ أولاً، قبل أن تصل أي قاعدة تكميلية لدولة أخرى إلى الربح نفسه."]},"anchors":[{"if":["A group with a Saudi company had revenue of €750m or more in 2 of the last 4 years","مجموعة لها شركة في المملكة بلغت إيراداتها 750 مليون يورو أو أكثر في سنتين من آخر 4 سنوات"],"then":["It is in scope for years starting on or after 1 January 2027 (Arts 2, 106)","فهي خاضعة للسنوات التي تبدأ في 1 يناير 2027م أو بعده (المادتان 2 و106)"]},{"if":["Someone says: 'we pay 20% income tax, so no DMT'","يقول أحدهم: «ندفع ضريبة دخل 20%، فلا ضريبة تكميلية علينا»"],"then":["Check the Kingdom ETR (covered taxes ÷ net DMT income), not the headline rate (Art 53)","افحص معدل المملكة الفعلي (الضرائب المشمولة ÷ صافي الدخل)، لا المعدل الاسمي (المادة 53)"]},{"if":["The Kingdom ETR is below 15%","معدل المملكة الفعلي أقل من 15%"],"then":["Top-up = (15% − ETR) × excess profit, plus any extra from earlier years (Arts 54–56)","الضريبة التكميلية = (15% − المعدل الفعلي) × الربح الزائد، مع أي إضافة من سنوات سابقة (المواد 54–56)"]},{"if":["A client asks which Saudi company pays","يسأل عميل: أي شركة في المملكة تدفع؟"],"then":["Each pays its share; all are liable for the whole unless ZATCA agrees a limit (Art 73)","تدفع كل شركة حصتها؛ والجميع مسؤول عن المبلغ كله ما لم توافق الهيئة على قصر المسؤولية (المادة 73)"]}],"diagrams":[{"type":"gauge","title":["The gauge in the picture","المؤشّر في الصورة"],"v":11,"target":15,"max":20,"l":["Kingdom ETR (example)","معدل المملكة الفعلي (مثال)"],"tl":["minimum rate","الحد الأدنى"],"gap":["The DMT tops up the 4% shortfall, on the profit above the staff-and-assets allowance.","تُكمل الضريبة النقص البالغ 4%، على الربح الذي يزيد على بدل الموظفين والأصول."],"pos":"picture"},{"type":"flow","title":["The DMT road in seven stops","طريق ضريبة الحد الأدنى المحلي في سبع محطات"],"nodes":[{"t":["Is the group in?","هل المجموعة خاضعة؟"],"s":["€750m test · Arts 2–17","اختبار 750 مليون يورو · المواد 2–17"]},{"t":["Saudi profit","الربح في المملكة"],"s":["net DMT income · Arts 18–41","صافي الدخل · المواد 18–41"]},{"t":["Saudi taxes","الضرائب في المملكة"],"s":["income tax and Zakat, adjusted · Arts 42–52","ضريبة الدخل والزكاة بعد التعديل · المواد 42–52"]},{"t":["Tax rate","معدل الضريبة"],"s":["taxes ÷ profit (ETR) · Art 53","الضرائب ÷ الربح (المعدل الفعلي) · المادة 53"]},{"t":["Shortfall","النقص"],"s":["15% − ETR · Art 54","15% − المعدل الفعلي · المادة 54"]},{"t":["Profit to top up","الربح الخاضع للتكملة"],"s":["profit − staff-and-assets allowance · Arts 55, 58","الربح − بدل الموظفين والأصول · المادتان 55 و58"]},{"t":["Top-up tax","الضريبة التكميلية"],"s":["shortfall × that profit · Art 56","النقص × ذلك الربح · المادة 56"]}],"note":["Then split it among the profit-making Saudi entities (Art 57), file and pay (Part 10).","ثم وزّعها على الكيانات الرابحة في المملكة (المادة 57)، وقدّم الإقرار وسدّد (الجزء العاشر)."],"quick":true},{"type":"formula","title":["Six formulas to know","ست معادلات تحتاجها"],"rows":[{"l":["ETR","المعدل الفعلي"],"r":["all Saudi adjusted covered taxes ÷ net DMT income · Art 53","مجموع الضرائب المشمولة المعدلة في المملكة ÷ صافي الدخل · المادة 53"]},{"l":["Net DMT income","صافي الدخل"],"r":["Saudi entities' DMT income − their DMT losses · Art 53(4)","دخل الكيانات في المملكة − خسائرها · المادة 53 (4)"]},{"l":["Top-up %","نسبة الضريبة التكميلية"],"r":["15% − ETR (if above zero) · Art 54","15% − المعدل الفعلي (إن كان أكبر من صفر) · المادة 54"]},{"l":["Excess profit","الربح الزائد"],"r":["net DMT income − SBIE · Art 55","صافي الدخل − الاستبعاد على أساس الجوهر · المادة 55"]},{"l":["Domestic Top-up Tax","الضريبة التكميلية المحلية"],"r":["top-up % × excess profit + any extra from earlier years · Art 56","النسبة × الربح الزائد + أي إضافة من سنوات سابقة · المادة 56"]},{"l":["One entity's share","حصة الكيان"],"r":["Kingdom top-up × its DMT income ÷ total DMT income of profit-making Saudi entities · Art 57","ضريبة المملكة × دخل الكيان ÷ مجموع دخل الكيانات الرابحة في المملكة · المادة 57"]}]}],"points":[{"h":["What the law is","ما هذا النظام"],"p":["A Saudi top-up tax for large groups whose Saudi tax rate is below 15%.","ضريبة تكميلية سعودية على المجموعات الكبيرة التي يقل معدل ضريبتها في المملكة عن 15%."],"t":["The draft is the Domestic Minimum Tax (DMT) Law. The tax it charges is the Domestic Top-up Tax. It is built to the OECD's model for a domestic top-up tax (a QDMTT): it measures Saudi profit the OECD way, then tops up the tax on the excess profit to 15%.","المشروع هو نظام ضريبة الحد الأدنى المحلي، والضريبة التي يفرضها هي الضريبة التكميلية المحلية. وهو مبني على نموذج المنظمة للضريبة التكميلية المحلية المؤهلة: يقيس الربح في المملكة بطريقة المنظمة، ثم يرفع الضريبة على الربح الزائد إلى 15%."],"r":[1]},{"h":["Who is in","من يخضع"],"p":["A group's Saudi companies and branches are in if group revenue reached €750m in 2 of the last 4 years.","تخضع شركات المجموعة وفروعها في المملكة إذا بلغت إيرادات المجموعة 750 مليون يورو في سنتين من آخر 4 سنوات."],"t":["In scope: every company or branch of an MNE group that is located in the Kingdom, Special Economic Zones included. The test: the parent's consolidated revenue reached €750m (in riyals) in at least 2 of the 4 years before the year being tested. Stateless entities created under Saudi law are caught too.","يخضع للنظام كل كيان أو فرع لمجموعة متعددة الجنسيات يقع في المملكة، بما في ذلك المناطق الاقتصادية الخاصة. والاختبار: أن تبلغ الإيرادات الموحدة للكيان الأم 750 مليون يورو (بما يعادلها بالريال) في سنتين على الأقل من السنوات الأربع السابقة لسنة الاختبار. وتخضع كذلك الكيانات عديمة الجنسية المنشأة وفق أنظمة المملكة."],"r":["2(1)","2(2)"]},{"h":["From when","متى يبدأ"],"p":["Years starting on or after 1 January 2027.","السنوات المالية التي تبدأ في 1 يناير 2027م أو بعده."],"t":["The law applies to fiscal years beginning on or after 1 January 2027. The Board must issue the Regulations within 180 days of the law's issue, and they apply from the same date as the law.","يُطبق النظام على السنوات المالية التي تبدأ في 1 يناير 2027م أو بعده. ويصدر المجلس اللائحة خلال 180 يوماً من صدور النظام، ويُعمل بها من تاريخ نفاذه نفسه."],"r":["106(1)","106(2)"]},{"h":["One rate for the whole Kingdom","معدل واحد للمملكة كلها"],"p":["One tax rate for all the group's Saudi entities together, not one per company.","معدل ضريبي واحد لجميع كيانات المجموعة في المملكة معاً، لا معدل لكل شركة."],"t":["Add up the adjusted covered taxes of all the group's Saudi entities and divide by their total Saudi profit after losses (net DMT income). That is the Kingdom's ETR. Investment entities and insurance investment entities stay out of this pot, and each stateless entity is treated on its own.","اجمع الضرائب المشمولة المعدلة لجميع كيانات المجموعة في المملكة، واقسمها على إجمالي ربحها في المملكة بعد الخسائر (صافي الدخل). هذا هو معدل المملكة الفعلي. وتبقى كيانات الاستثمار وكيانات التأمين الاستثماري خارج هذا المزيج، ويُعامل كل كيان عديم الجنسية بمفرده."],"r":[53]},{"h":["From rate to tax","من المعدل إلى الضريبة"],"p":["Top-up tax = (15% − ETR) × the profit left after the staff-and-assets allowance.","الضريبة التكميلية = (15% − المعدل الفعلي) × الربح المتبقي بعد بدل الموظفين والأصول."],"t":["Top-up % = 15% − ETR. Excess profit = net DMT income − the substance-based income exclusion (an allowance for payroll and tangible assets). Domestic Top-up Tax = top-up % × excess profit, plus any extra top-up that comes from reworking earlier years.","نسبة الضريبة التكميلية = 15% − المعدل الفعلي. والربح الزائد = صافي الدخل − الاستبعاد على أساس جوهر النشاط (بدل عن الرواتب والأصول الملموسة). والضريبة التكميلية المحلية = النسبة × الربح الزائد، مضافاً إليها أي ضريبة إضافية تنشأ عن إعادة احتساب سنوات سابقة."],"r":[54,"55(1)",56,63]},{"h":["Sharing it out","توزيع الضريبة"],"p":["Only the profit-making Saudi entities share the bill, each by its profit.","لا يتقاسم الفاتورة إلا الكيانات الرابحة في المملكة، كلٌّ بقدر ربحه."],"t":["Each Saudi entity with DMT income takes a share: Kingdom top-up × its DMT income ÷ the total DMT income of the Saudi entities. An entity with a loss takes no share.","يأخذ كل كيان في المملكة لديه دخل حصة: الضريبة التكميلية للمملكة × دخله ÷ مجموع دخل الكيانات في المملكة. ولا يأخذ الكيان الخاسر أي حصة."],"r":["57(1)"]},{"h":["Safe harbours can switch it off","الملاذات الآمنة قد توقفها"],"p":["If the group qualifies for a safe harbour and chooses it, the top-up is zero.","إذا تأهلت المجموعة لملاذ آمن واختارته، تكون الضريبة التكميلية صفراً."],"t":["If the filing entity elects and the Saudi entities qualify for a safe harbour (the transitional CbCR, simplified ETR or NMCE safe harbour), the Kingdom's top-up is treated as zero. The tax-incentive safe harbour zeroes only the top-up linked to qualified incentives. ZATCA can challenge an election within 36 months of filing.","إذا اختار الكيان المقدم للإقرار وتأهلت الكيانات في المملكة لملاذ آمن (الملاذ الانتقالي للتقرير حسب كل دولة، أو المعدل الفعلي المبسط، أو الاحتساب المبسط للكيانات غير الجوهرية)، تُعد الضريبة التكميلية للمملكة صفراً. أما ملاذ الحوافز الضريبية فلا يُصفّر إلا الضريبة المرتبطة بالحوافز المؤهلة. وللهيئة أن تعترض على الاختيار خلال 36 شهراً من تقديم الإقرار."],"r":[66]},{"h":["Who pays","من يدفع"],"p":["Each Saudi taxpayer pays its share, but all the group's Saudi taxpayers are liable for the whole.","يدفع كل مكلف في المملكة حصته، لكن جميع مكلفي المجموعة في المملكة مسؤولون عن المبلغ كله."],"t":["Each taxpayer owes its own amount, and the group's Saudi taxpayers are jointly liable for the group's whole Saudi top-up. Joint ventures, their subsidiaries and partners (other than limited partners) are jointly liable too. ZATCA can approve limiting joint liability to one or more entities.","يتحمل كل مكلف المبلغ المستحق عليه، ويتضامن مكلفو المجموعة في المملكة في المسؤولية عن كامل ضريبتها التكميلية في المملكة. وتتضامن كذلك المشاريع المشتركة وكياناتها التابعة والشركاء (عدا الشركاء الموصين). وللهيئة أن توافق على قصر المسؤولية التضامنية على كيان أو أكثر."],"r":[73]}],"oecd":[{"t":["The draft follows the OECD design for a domestic top-up tax (QDMTT). Under the OECD model rules, any top-up another country charges on Saudi profit is reduced by the Saudi top-up already payable. So Saudi Arabia collects first, and the group is not taxed twice.","يتبع المشروع تصميم المنظمة للضريبة التكميلية المحلية المؤهلة. وبموجب القواعد النموذجية، تُخفض أي ضريبة تكميلية تفرضها دولة أخرى على الربح في المملكة بمقدار الضريبة التكميلية السعودية المستحقة. فتحصّل المملكة أولاً، ولا تُفرض الضريبة على المجموعة مرتين."],"src":["Model Rules Art 5.2.3 and the QDMTT definition in Art 10.1","القواعد النموذجية: المادة 5.2.3 وتعريف الضريبة التكميلية المحلية الأدنى المؤهلة في المادة 10.1"]},{"t":["Article 56 has no deduction for a QDMTT, unlike the OECD formula, because the DMT is itself the domestic top-up. The draft defines the IIR and UTPR but charges only the Domestic Top-up Tax.","لا تتضمن المادة 56 خصماً للضريبة التكميلية المحلية المؤهلة، خلافاً لمعادلة المنظمة، لأن هذه الضريبة هي نفسها الضريبة التكميلية المحلية. ويعرّف المشروع قاعدتي تضمين الدخل والأرباح الخاضعة لمعدل منخفض، لكنه لا يفرض إلا الضريبة التكميلية المحلية."],"src":["Model Rules Art 5.2.3","القواعد النموذجية: المادة 5.2.3"]}],"cases":[{"t":["Is GulfCo in scope for 2027?","هل تخضع جلف كو للنظام في 2027م؟"],"facts":["Rhein AG (Germany) is the parent of a group that includes GulfCo Arabia LLC (Saudi Arabia). Everyone uses calendar-year accounts. Group revenue in Rhein AG's consolidated accounts:\nFY2023 €690m · FY2024 €720m · FY2025 €810m · FY2026 €905m.","شركة راين (ألمانيا) هي الكيان الأم لمجموعة تضم شركة جلف كو العربية (المملكة). وتستخدم جميع الشركات سنة مالية تقويمية. إيرادات المجموعة في القوائم الموحدة لشركة راين:\n2023م: 690 مليون يورو · 2024م: 720 مليوناً · 2025م: 810 ملايين · 2026م: 905 ملايين."],"steps":[{"t":["The test year is FY2027, so look at the 4 years before it: 2023 to 2026.","سنة الاختبار هي 2027م، فانظر إلى السنوات الأربع التي قبلها: من 2023م إلى 2026م."]},{"t":["Years at or above €750m: 2025 (€810m) and 2026 (€905m).","السنوات التي بلغت 750 مليون يورو أو أكثر: 2025م (810 ملايين) و2026م (905 ملايين)."],"v":2},{"t":["2 of 4 passes. It is an MNE group because GulfCo is outside the parent's country (Germany).","سنتان من أربع تكفيان. وهي مجموعة متعددة الجنسيات لأن جلف كو خارج دولة الكيان الأم (ألمانيا)."]},{"t":["FY2027 starts on 1 January 2027, the first year the law covers.","تبدأ السنة المالية 2027م في 1 يناير 2027م، وهي أول سنة يشملها النظام."]}],"ans":["GulfCo is a group company located in the Kingdom, and the group passed the €750m test in 2 of the 4 years before FY2027. The test is applied in riyals (the SAR equivalent of €750m) and scaled for any year that is not 12 months long.","جلف كو شركة في المجموعة تقع في المملكة، واجتازت المجموعة اختبار 750 مليون يورو في سنتين من السنوات الأربع السابقة لعام 2027م. ويُطبق الاختبار بالريال (ما يعادل 750 مليون يورو)، ويُعدّل لأي سنة لا تبلغ 12 شهراً."],"r":[2,8,"106(1)"],"diagrams":[{"type":"org","at":"facts","title":["Who's who","من هو من"],"nodes":[{"id":"rh","t":["Rhein AG","راين"],"s":["Germany · parent","ألمانيا · الكيان الأم"]},{"id":"gc","t":["GulfCo Arabia LLC","جلف كو العربية"],"s":["Saudi Arabia","المملكة العربية السعودية"],"tone":"in"}],"edges":[{"f":"rh","to":"gc"}]},{"type":"columns","at":"facts","title":["The €750m test","اختبار 750 مليون يورو"],"cap":["Group revenue, € million","إيرادات المجموعة بملايين اليورو"],"items":[{"l":["2023","2023م"],"v":690},{"l":["2024","2024م"],"v":720},{"l":["2025","2025م"],"v":810},{"l":["2026","2026م"],"v":905}],"line":{"v":750,"l":["€750m test line","خط اختبار 750 مليون يورو"]}}],"p":["In scope from FY2027: €750m reached in 2 of the 4 years before.","تخضع اعتباراً من 2027م: بلغت الإيرادات 750 مليون يورو في سنتين من السنوات الأربع السابقة."]},{"t":["The Kingdom's top-up for 2027","الضريبة التكميلية للمملكة لعام 2027م"],"facts":["An in-scope group has three Saudi entities for FY2027:\n• Alpha: DMT income SAR 40m; adjusted covered taxes SAR 3.6m\n• Beta: DMT income SAR 20m; adjusted covered taxes SAR 1.2m\n• Gamma: DMT loss SAR 10m; no covered taxes\nThe allowance for staff and assets (SBIE) for all Saudi entities is SAR 8m. There is no extra top-up from earlier years and no safe harbour.","لمجموعة خاضعة للنظام ثلاثة كيانات في المملكة للسنة المالية 2027م:\n• (ألفا): الدخل 40 مليون ريال، والضرائب المشمولة المعدلة 3.6 ملايين ريال\n• (بيتا): الدخل 20 مليون ريال، والضرائب المشمولة المعدلة 1.2 مليون ريال\n• (غاما): خسارة 10 ملايين ريال، ولا ضرائب مشمولة\nوبدل الموظفين والأصول (الاستبعاد على أساس الجوهر) لجميع الكيانات في المملكة 8 ملايين ريال. ولا توجد ضريبة إضافية من سنوات سابقة ولا ملاذ آمن."],"steps":[{"t":["Net DMT income = Alpha + Beta − Gamma's loss.","صافي الدخل = (ألفا) + (بيتا) − خسارة (غاما)."],"x":"40000000+20000000-10000000","v":50000000,"u":"SAR"},{"t":["Adjusted covered taxes of all Saudi entities.","الضرائب المشمولة المعدلة لجميع الكيانات في المملكة."],"x":"3600000+1200000","v":4800000,"u":"SAR"},{"t":["ETR = covered taxes ÷ net DMT income.","المعدل الفعلي = الضرائب المشمولة ÷ صافي الدخل."],"x":"4800000/50000000*100","v":9.6,"u":"%"},{"t":["Top-up % = 15% − ETR.","نسبة الضريبة التكميلية = 15% − المعدل الفعلي."],"x":"15-9.6","v":5.4,"u":"%"},{"t":["Excess profit = net DMT income − SBIE.","الربح الزائد = صافي الدخل − الاستبعاد على أساس الجوهر."],"x":"50000000-8000000","v":42000000,"u":"SAR"},{"t":["Top-up tax = top-up % × excess profit.","الضريبة التكميلية = النسبة × الربح الزائد."],"x":"5.4/100*42000000","v":2268000,"u":"SAR"}],"ans":["Gamma's loss shrinks the total profit, so the blended ETR (9.6%) is higher than Alpha's own 9% and Beta's 6%. Blending works on the totals, not on an average of each company's rate.","تخفض خسارة (غاما) إجمالي الربح، فيصبح المعدل الممزوج (9.6%) أعلى من معدل (ألفا) منفردة 9% ومعدل (بيتا) 6%. فالمزج يعمل على المجاميع، لا على متوسط معدلات الشركات."],"r":[53,54,"55(1)",56],"diagrams":[{"type":"waterfall","title":["From entity results to the profit to top up","من نتائج الكيانات إلى الربح الخاضع للتكملة"],"cap":["SAR million","بملايين الريالات"],"rows":[{"l":["Alpha","(ألفا)"],"v":40,"k":"add"},{"l":["Beta","(بيتا)"],"v":20,"k":"add"},{"l":["Gamma's loss","خسارة (غاما)"],"v":10,"k":"sub"},{"l":["Net DMT income","صافي الدخل"],"v":50,"k":"sum"},{"l":["Staff-and-assets allowance","بدل الموظفين والأصول"],"v":8,"k":"sub"},{"l":["Excess profit","الربح الزائد"],"v":42,"k":"sum"}]},{"type":"gauge","title":["The Kingdom's rate against 15%","معدل المملكة مقارنةً بـ15%"],"v":9.6,"target":15,"max":20,"l":["Kingdom ETR","معدل المملكة الفعلي"],"tl":["minimum rate","الحد الأدنى"],"gap":["Top-up of 5.4% on SAR 42m of excess profit = SAR 2,268,000","ضريبة تكميلية بنسبة 5.4% على ربح زائد قدره 42 مليون ريال = 2,268,000 ريال"]}],"p":["The Kingdom owes SAR 2,268,000: a 5.4% top-up on SAR 42m of excess profit.","على المملكة 2,268,000 ريال: ضريبة تكميلية بنسبة 5.4% على ربح زائد قدره 42 مليون ريال."]},{"t":["Who carries the SAR 2,268,000?","من يتحمل 2,268,000 ريال؟"],"facts":["Same group as case 2. The Kingdom's top-up for FY2027 is SAR 2,268,000.","المجموعة نفسها في الحالة 2. والضريبة التكميلية للمملكة لعام 2027م هي 2,268,000 ريال."],"steps":[{"t":["Only entities with DMT income share the bill. Their total is Alpha + Beta (Gamma made a loss).","لا يتقاسم الفاتورة إلا الكيانات ذات الدخل. ومجموع دخلها (ألفا) + (بيتا)، فـ(غاما) خاسرة."],"x":"40000000+20000000","v":60000000,"u":"SAR"},{"t":["Alpha's share = top-up × 40m ÷ 60m.","حصة (ألفا) = الضريبة × 40 مليوناً ÷ 60 مليوناً."],"x":"2268000*40000000/60000000","v":1512000,"u":"SAR"},{"t":["Beta's share = top-up × 20m ÷ 60m.","حصة (بيتا) = الضريبة × 20 مليوناً ÷ 60 مليوناً."],"x":"2268000*20000000/60000000","v":756000,"u":"SAR"},{"t":["Gamma has no DMT income, so it gets no share.","ليس لـ(غاما) دخل، فلا حصة لها."],"v":0,"u":"SAR"}],"ans":["Alpha SAR 1,512,000 and Beta SAR 756,000. All three are group taxpayers, so each is liable for the full SAR 2,268,000 unless ZATCA agrees to limit that. Watch the divisor: total DMT income of the profit-makers (60m), not net DMT income (50m).","(ألفا) 1,512,000 ريال و(بيتا) 756,000 ريال. والثلاث مكلفات في المجموعة، فكلٌّ منها مسؤول عن كامل 2,268,000 ريال ما لم توافق الهيئة على قصر ذلك. وانتبه إلى المقسوم عليه: مجموع دخل الكيانات الرابحة (60 مليوناً)، لا صافي الدخل (50 مليوناً)."],"r":["57(1)","73(2)","73(5)"],"diagrams":[{"type":"bars","title":["Who pays what","من يدفع كم"],"u":"SAR","items":[{"l":["Alpha","(ألفا)"],"v":1512000},{"l":["Beta","(بيتا)"],"v":756000,"tone":"g"},{"l":["Gamma","(غاما)"],"v":0}],"note":["Shares follow DMT income: Alpha 40m and Beta 20m out of 60m. Gamma made a loss, so it takes no share.","تتبع الحصص الدخل: (ألفا) 40 مليوناً و(بيتا) 20 مليوناً من 60 مليوناً. و(غاما) خاسرة، فلا حصة لها."]}],"p":["Alpha pays two-thirds, Beta one-third and Gamma nothing, but all three are liable for the whole.","تدفع (ألفا) الثلثين و(بيتا) الثلث و(غاما) لا شيء، لكن الثلاث مسؤولة عن المبلغ كله."]}],"quiz":[{"q":["Which statement about the Minimum Rate is correct?","أي العبارات التالية عن الحد الأدنى للمعدل صحيحة؟"],"o":[["It is 20%, the headline Saudi income tax rate","20%، وهو السعر الأساسي لضريبة الدخل في المملكة"],["It is 15%, measured against each entity's own ETR","15%، ويُقارن بالمعدل الفعلي لكل كيان على حدة"],["It is 17% for 2027 and falls to 15% from 2028","17% لعام 2027م، ثم ينخفض إلى 15% اعتباراً من 2028م"],["It is 15%, measured against the Kingdom's blended ETR","15%، ويُقارن بالمعدل الفعلي الممزوج للمملكة ككل"]],"a":3,"e":["Article 1 sets the Minimum Rate at 15%, and Article 53 compares it with one blended ETR for all Saudi entities. 17% is only the FY2027 Transition Rate for the CbCR safe harbour (Art 67(2)).","تحدد المادة 1 الحد الأدنى للمعدل بنسبة 15%، وتقارنه المادة 53 بمعدل فعلي ممزوج واحد لجميع الكيانات في المملكة. أما 17% فهي معدل الانتقال لعام 2027م في الملاذ الآمن الانتقالي فقط (المادة 67 (2))."],"r":[1,"53(2)","67(2)"]},{"q":["From which fiscal years does the draft Law apply?","اعتباراً من أي سنوات مالية يسري مشروع النظام؟"],"o":[["Fiscal years beginning on or after 1 January 2026","السنوات المالية التي تبدأ في 1 يناير 2026م أو بعده"],["Fiscal years beginning on or after 1 January 2027","السنوات المالية التي تبدأ في 1 يناير 2027م أو بعده"],["Fiscal years ending on or after 1 January 2027","السنوات المالية التي تنتهي في 1 يناير 2027م أو بعده"],["Fiscal years ending on or after 1 January 2026","السنوات المالية التي تنتهي في 1 يناير 2026م أو بعده"]],"a":1,"e":["Article 106(1): fiscal years beginning on or after 1 January 2027. A group with a July–June year is first caught for the year that starts on 1 July 2027.","المادة 106 (1): السنوات المالية التي تبدأ في 1 يناير 2027م أو بعده. فالمجموعة التي تبدأ سنتها في يوليو تخضع أول مرة عن السنة التي تبدأ في 1 يوليو 2027م."],"r":["106(1)"]},{"q":["Which revenue test brings a Saudi entity into scope?","ما اختبار الإيرادات الذي يُدخل الكيان الواقع في المملكة ضمن النطاق؟"],"o":[["UPE consolidated revenue of €750m or more in at least 2 of the 4 prior fiscal years","إيرادات موحدة للكيان الأم النهائي تبلغ 750 مليون يورو أو أكثر في سنتين على الأقل من السنوات الأربع السابقة"],["Combined revenue of the Saudi entities of €750m or more in at least 3 of the 5 prior years","إيرادات مجمعة للكيانات في المملكة تبلغ 750 مليون يورو أو أكثر في ثلاث على الأقل من السنوات الخمس السابقة"],["Combined revenue of the Saudi entities of €750m or more in 2 of the 4 prior years","إيرادات مجمعة للكيانات في المملكة تبلغ 750 مليون يورو أو أكثر في سنتين من السنوات الأربع السابقة"],["UPE consolidated revenue of €750m or more in at least 3 of the 5 prior fiscal years","إيرادات موحدة للكيان الأم النهائي تبلغ 750 مليون يورو أو أكثر في ثلاث على الأقل من السنوات الخمس السابقة"]],"a":0,"e":["Article 2(1) uses the ultimate parent's consolidated financial statements, expressed in riyals, for the four years before the tested year. Saudi-only revenue and the current year do not count.","تعتمد المادة 2 (1) على القوائم المالية الموحدة للكيان الأم النهائي، مقوّمة بالريال، عن السنوات الأربع السابقة للسنة الخاضعة للاختبار. ولا تُحتسب إيرادات المملكة وحدها ولا السنة الحالية."],"r":["2(1)"]},{"q":["Which of these can be a taxpayer under the draft?","أي مما يلي يمكن أن يكون مكلفاً بموجب المشروع؟"],"o":[["All constituent entities located in the Kingdom, except those in Special Economic Zones","جميع الكيانات التابعة الواقعة في المملكة، باستثناء كيانات المناطق الاقتصادية الخاصة"],["Only a Saudi ultimate parent entity, acting for all of the group's Saudi entities","الكيان الأم النهائي السعودي وحده، نيابة عن جميع كيانات المجموعة في المملكة"],["All constituent entities located in the Kingdom, Special Economic Zones included","جميع الكيانات التابعة الواقعة في المملكة، بما فيها كيانات المناطق الاقتصادية الخاصة"],["Only Saudi subsidiaries and branches of groups whose parent is outside the Kingdom","الشركات التابعة والفروع في المملكة للمجموعات التي يقع كيانها الأم خارج المملكة فقط"]],"a":2,"e":["Article 2(1) and (2) reach constituent entities located in the Kingdom, expressly including the Special Economic Zones, and stateless constituent entities created under Saudi law. Sitting in a zone does not take an entity out of scope.","تشمل المادة 2 (1) و(2) الكيانات التابعة الواقعة في المملكة، بما فيها المناطق الاقتصادية الخاصة صراحةً، والكيانات التابعة عديمة الجنسية المنشأة بموجب أنظمة المملكة. فالوجود في منطقة خاصة لا يُخرج الكيان من النطاق."],"r":["2(1)","2(2)"]},{"q":["How is the effective tax rate measured?","كيف يُقاس معدل الضريبة الفعلي؟"],"o":[["Entity by entity: each entity's adjusted covered taxes ÷ its own DMT income","لكل كيان على حدة: ضرائبه المشمولة المعدلة ÷ دخله لأغراض النظام"],["For the Kingdom as a whole: total adjusted covered taxes ÷ total Saudi revenue","للمملكة ككل: مجموع الضرائب المشمولة المعدلة ÷ إجمالي الإيرادات في المملكة"],["For the Kingdom as a whole: total adjusted covered taxes ÷ net DMT income","للمملكة ككل: مجموع الضرائب المشمولة المعدلة ÷ صافي الدخل"],["Entity by entity: each entity's adjusted covered taxes ÷ its own revenue","لكل كيان على حدة: ضرائبه المشمولة المعدلة ÷ إيراداته"]],"a":2,"e":["Article 53(2) blends all Saudi constituent entities into one Kingdom ETR, so high-taxed and low-taxed Saudi entities average out.","تجمع المادة 53 (2) جميع الكيانات التابعة في المملكة في معدل فعلي واحد للمملكة، فتتوازن الكيانات مرتفعة الضريبة مع منخفضة الضريبة."],"r":["53(2)"]},{"q":["A group's Kingdom ETR is 11%. What is the top-up tax percentage?","معدل الضريبة الفعلي لمجموعة في المملكة 11%. فما نسبة الضريبة التكميلية؟"],"o":[["11%","11%"],["4%","4%"],["15%","15%"],["26%","26%"]],"a":1,"e":["Article 54: the positive difference between the 15% Minimum Rate and the ETR, so 15% − 11% = 4 percentage points.","المادة 54: الفرق الإيجابي بين الحد الأدنى 15% ومعدل الضريبة الفعلي، أي 15% − 11% = 4 نقاط مئوية."],"r":[54]},{"q":["Excess Profit for the Kingdom equals:","يساوي الربح الزائد للمملكة:"],"o":[["Revenue minus the substance-based income exclusion","الإيرادات ناقص الاستبعاد على أساس جوهر النشاط"],["Net DMT Income minus adjusted covered taxes and the exclusion","صافي الدخل ناقص الضرائب المشمولة المعدلة والاستبعاد"],["Revenue minus adjusted covered taxes and the exclusion","الإيرادات ناقص الضرائب المشمولة المعدلة والاستبعاد"],["Net DMT Income minus the substance-based income exclusion","صافي الدخل ناقص الاستبعاد على أساس جوهر النشاط"]],"a":3,"e":["Article 55(1). The exclusion shields a routine return on payroll and tangible assets; only profit above it is topped up.","المادة 55 (1). يحمي الاستبعاد عائداً اعتيادياً على الرواتب والأصول الملموسة، ولا تُفرض الضريبة التكميلية إلا على الربح الذي يتجاوزه."],"r":["55(1)"]},{"q":["The Kingdom's Domestic Top-up Tax for a year is:","الضريبة التكميلية المحلية للمملكة عن سنة هي:"],"o":[["Top-up % × Net DMT Income + Additional Current Top-up Tax","نسبة الضريبة التكميلية × صافي الدخل + الضريبة التكميلية الحالية الإضافية"],["Top-up % × Net DMT Income, ignoring recalculations of earlier years","نسبة الضريبة التكميلية × صافي الدخل، دون احتساب إعادة احتساب السنوات السابقة"],["Top-up % × Excess Profit + Additional Current Top-up Tax","نسبة الضريبة التكميلية × الربح الزائد + الضريبة التكميلية الحالية الإضافية"],["Top-up % × Excess Profit, ignoring recalculations of earlier years","نسبة الضريبة التكميلية × الربح الزائد، دون احتساب إعادة احتساب السنوات السابقة"]],"a":2,"e":["Article 56: multiply the top-up % by excess profit, then add the additional current top-up tax under Article 63, which picks up recalculations of earlier years.","المادة 56: اضرب نسبة الضريبة التكميلية في الربح الزائد، ثم أضف الضريبة التكميلية الحالية الإضافية وفق المادة 63، التي تلتقط إعادة احتساب السنوات السابقة."],"r":[56,63]},{"q":["A Saudi entity in an in-scope group has a DMT Loss this year. How much of the Kingdom's tax is allocated to it under Article 57(1)?","كيان في المملكة ضمن مجموعة خاضعة لديه خسارة هذا العام. ما حصته من ضريبة المملكة وفق المادة 57 (1)؟"],"o":[["None, though it stays jointly liable for the Kingdom's tax that year","لا شيء، لكنه يبقى مسؤولاً بالتضامن عن ضريبة المملكة عن تلك السنة"],["A share in proportion to its loss, though it stays jointly liable","حصة بنسبة خسارته، مع بقائه مسؤولاً بالتضامن"],["An equal share, because all group taxpayers are jointly liable","حصة متساوية، لأن جميع مكلفي المجموعة مسؤولون بالتضامن"],["None, and it is released from joint liability for that year","لا شيء، ويُعفى من المسؤولية التضامنية عن تلك السنة"]],"a":0,"e":["Article 57(1) allocates only to entities with DMT Income, in proportion to that income. The loss-making entity is still jointly liable as a group taxpayer under Article 73(2).","توزع المادة 57 (1) الضريبة على الكيانات التي لديها دخل فقط وبنسبة دخلها. ومع ذلك يبقى الكيان الخاسر مسؤولاً بالتضامن بصفته مكلفاً عضواً في المجموعة وفق المادة 73 (2)."],"r":["57(1)","73(2)"]},{"q":["Which statement about the de minimis exclusion is correct?","أي العبارات التالية عن استثناء الحد الأدنى صحيحة؟"],"o":[["It is one of the four safe harbours listed in Article 66(4)","أحد الملاذات الآمنة الأربعة المذكورة في المادة 66 (4)"],["It is a separate annual election under Article 64, outside Article 66(4)","اختيار سنوي مستقل وفق المادة 64، خارج نطاق المادة 66 (4)"],["It is a five-year election, and it also covers stateless constituent entities","اختيار خمس سنوات، ويشمل أيضاً الكيانات التابعة عديمة الجنسية"],["It applies when Saudi revenue is below €10m in the current fiscal year alone","ينطبق عندما تقل الإيرادات في المملكة عن 10 ملايين يورو في السنة المالية الحالية وحدها"]],"a":1,"e":["Article 64 makes de minimis its own annual election, tested on three-year averages: revenue under €10m and income a loss or under €1m. Stateless and investment entities are left out. Article 66(4) lists the four safe harbours.","تجعل المادة 64 استثناء الحد الأدنى اختياراً سنوياً مستقلاً يُختبر بمتوسطات ثلاث سنوات: إيرادات دون 10 ملايين يورو، ودخل يكون خسارة أو دون مليون يورو. وتُستبعد الكيانات عديمة الجنسية وكيانات الاستثمار. أما المادة 66 (4) فتسرد الملاذات الآمنة الأربعة."],"r":[64,"66(4)"]},{"q":["ZATCA wants to challenge a safe harbour election. What timeline does Article 66(3) set?","تريد الهيئة الاعتراض على اختيار ملاذ آمن. ما المهلة التي تحددها المادة 66 (3)؟"],"o":[["Notice within 36 months after filing; 30 days to respond","إخطار خلال 36 شهراً بعد تقديم الإقرار، و30 يوماً للرد"],["Notice within 60 months after filing; 6 months to respond","إخطار خلال 60 شهراً بعد تقديم الإقرار، و6 أشهر للرد"],["Notice within 60 months after filing; 30 days to respond","إخطار خلال 60 شهراً بعد تقديم الإقرار، و30 يوماً للرد"],["Notice within 36 months after filing; 6 months to respond","إخطار خلال 36 شهراً بعد تقديم الإقرار، و6 أشهر للرد"]],"a":3,"e":["Article 66(3)(b)–(c): ZATCA notifies specific facts within 36 months after the return is filed and invites a response within 6 months. The election falls away only if the entity cannot show those facts did not materially affect eligibility, and Saudi top-up could otherwise arise.","المادة 66 (3) (ب)–(ج): تُخطر الهيئة بحقائق محددة خلال 36 شهراً بعد تقديم الإقرار وتدعو إلى الرد خلال 6 أشهر. ولا يسقط الاختيار إلا إذا عجز الكيان عن إثبات أن تلك الحقائق لم تؤثر جوهرياً في الأهلية، وكان يمكن أن تنشأ ضريبة تكميلية في المملكة."],"r":["66(3)"]},{"q":["Who is liable to pay the Kingdom's Domestic Top-up Tax?","من المسؤول عن سداد الضريبة التكميلية المحلية للمملكة؟"],"o":[["Every Saudi taxpayer in the group, jointly, unless ZATCA approves a limit","جميع مكلفي المجموعة في المملكة بالتضامن، ما لم توافق الهيئة على قصر المسؤولية"],["Only the filing entity, which then recovers shares from the other Saudi entities","الكيان المقدم للإقرار وحده، ثم يسترد الحصص من بقية الكيانات في المملكة"],["Each taxpayer for its own allocated share only, with no joint liability","كل مكلف عن حصته المخصصة فقط، دون أي مسؤولية تضامنية"],["The ultimate parent entity abroad, on behalf of the group's Saudi entities","الكيان الأم النهائي في الخارج، نيابة عن كيانات المجموعة في المملكة"]],"a":0,"e":["Article 73(1), (2) and (5). The filing entity files, but liability rests with all the group's Saudi taxpayers jointly unless ZATCA approves a limit.","المادة 73 (1) و(2) و(5). يقدّم الكيان المعين الإقرار، لكن المسؤولية تقع على جميع المكلفين في المجموعة في المملكة بالتضامن ما لم توافق الهيئة على قصرها."],"r":["73(1)","73(2)","73(5)"]}],"cards":[{"f":["Minimum Rate","الحد الأدنى"],"b":["15%","15% (خمسة عشر بالمائة)"],"r":[1]},{"f":["What tax does the DMT Law impose?","ما الضريبة التي يفرضها نظام ضريبة الحد الأدنى المحلي؟"],"b":["The Domestic Top-up Tax, designed as a qualified domestic minimum top-up tax (QDMTT).","الضريبة التكميلية المحلية، المصممة بوصفها ضريبة تكميلية محلية أدنى مؤهلة."],"r":[1]},{"f":["The revenue test","اختبار الإيرادات"],"b":["UPE consolidated revenue ≥ the SAR equivalent of €750m in at least 2 of the 4 fiscal years immediately before the tested year; prorated for years that are not 12 months.","إيرادات موحدة للكيان الأم النهائي توازي 750 مليون يورو بالريال أو أكثر في سنتين على الأقل من السنوات الأربع السابقة مباشرة، مع التعديل التناسبي للسنوات التي لا تساوي 12 شهراً."],"r":[2]},{"f":["First fiscal years covered","أول السنوات المالية الخاضعة"],"b":["Fiscal years beginning on or after 1 January 2027.","السنوات المالية التي تبدأ في 1 يناير 2027م أو بعده."],"r":["106(1)"]},{"f":["When must the Regulations be issued?","متى يجب إصدار اللائحة؟"],"b":["Within 180 days after the Law is issued; they take effect from the Law's effective date.","خلال 180 يوماً من صدور النظام، ويُعمل بها من تاريخ نفاذ النظام."],"r":["106(2)"]},{"f":["ETR formula","معادلة معدل الضريبة الفعلي"],"b":["Total adjusted covered taxes of Saudi constituent entities ÷ Net DMT Income of the Kingdom.","إجمالي الضرائب المشمولة المعدلة للكيانات التابعة في المملكة ÷ صافي دخل ضريبة الحد الأدنى المحلي في المملكة."],"r":["53(2)"]},{"f":["Net DMT Income","صافي دخل ضريبة الحد الأدنى المحلي"],"b":["DMT Income of all Saudi constituent entities minus their DMT Losses, if positive.","دخل جميع الكيانات التابعة في المملكة ناقص خسائرها، إن كان موجباً."],"r":["53(4)"]},{"f":["Top-up Tax Percentage","نسبة الضريبة التكميلية"],"b":["15% minus the Kingdom ETR, if positive.","15% ناقص معدل الضريبة الفعلي للمملكة، إن كان موجباً."],"r":[54]},{"f":["Excess Profit","الربح الزائد"],"b":["Net DMT Income minus the substance-based income exclusion of all Saudi constituent entities.","صافي الدخل ناقص الاستبعاد على أساس جوهر النشاط لجميع الكيانات التابعة في المملكة."],"r":["55(1)"]},{"f":["Domestic Top-up Tax formula","معادلة الضريبة التكميلية المحلية"],"b":["Top-up % × Excess Profit + Additional Current Top-up Tax.","نسبة الضريبة التكميلية × الربح الزائد + الضريبة التكميلية الحالية الإضافية."],"r":[56]},{"f":["How is the Kingdom's tax shared among entities?","كيف تُوزَّع ضريبة المملكة على الكيانات؟"],"b":["DTT × the entity's DMT Income ÷ total DMT Income of all Saudi constituent entities. Loss-makers get nothing.","الضريبة × دخل الكيان ÷ مجموع دخل جميع الكيانات التابعة في المملكة. ولا شيء للكيانات الخاسرة."],"r":["57(1)"]},{"f":["The four DMT Safe Harbours","الملاذات الآمنة الأربعة"],"b":["Transitional CbCR · Simplified ETR · NMCE Simplified Calculations · Substance-based Tax Incentive.","الانتقالي للتقرير الخاص بكل دولة · معدل الضريبة الفعلي المبسط · الاحتساب المبسط للكيانات غير الجوهرية · الحوافز الضريبية القائمة على الجوهر."],"r":["66(4)"]}],"terms":[{"t":["Domestic Top-up Tax","الضريبة التكميلية المحلية"],"d":["The tax the DMT Law charges: it brings a large group's tax in the Kingdom up to 15%.","الضريبة التي يفرضها النظام: ترفع ضريبة المجموعة الكبيرة في المملكة إلى 15%."]},{"t":["Constituent entity","الكيان التابع"],"d":["Any company or branch that belongs to the group.","أي شركة أو فرع ينتمي إلى المجموعة."]},{"t":["MNE group","المجموعة متعددة الجنسيات"],"d":["A group with at least one company or branch outside the parent's country.","مجموعة لها شركة أو فرع واحد على الأقل خارج دولة الكيان الأم."]},{"t":["Net DMT income","صافي دخل ضريبة الحد الأدنى المحلي"],"d":["The group's total Saudi profit, measured the DMT way, after losses.","إجمالي ربح المجموعة في المملكة، محسوباً بطريقة النظام، بعد الخسائر."]},{"t":["Adjusted covered taxes","الضرائب المشمولة المعدلة"],"d":["The income tax and Zakat that count, after adjustments.","ضريبة الدخل والزكاة اللتان تُحتسبان، بعد التعديلات."]},{"t":["Effective tax rate (ETR)","معدل الضريبة الفعلي"],"d":["Adjusted covered taxes ÷ net DMT income, for all Saudi entities together.","الضرائب المشمولة المعدلة ÷ صافي الدخل، لجميع الكيانات في المملكة معاً."]},{"t":["Substance-based income exclusion (SBIE)","الاستبعاد على أساس جوهر النشاط"],"d":["An allowance for staff and tangible assets in the Kingdom that is never topped up.","بدل عن الموظفين والأصول الملموسة في المملكة لا تُفرض عليه ضريبة تكميلية."]},{"t":["Excess profit","الربح الزائد"],"d":["Net DMT income minus the SBIE: the profit that can be topped up.","صافي الدخل ناقصاً الاستبعاد: وهو الربح الذي قد تُفرض عليه الضريبة التكميلية."]},{"t":["QDMTT","الضريبة التكميلية المحلية المؤهلة"],"d":["A domestic top-up tax built to OECD rules, so other countries reduce their own top-up by it.","ضريبة تكميلية محلية مبنية على قواعد المنظمة، فتخفض الدول الأخرى ضريبتها التكميلية بقدرها."]}],"range":"1–2, 53–57, 66, 73, 106"},{"id":2,"title":["Scope I: MNE groups and the €750m test","النطاق (1): المجموعات المتعددة الجنسيات واختبار 750 مليون يورو"],"goal":["Decide whether a group and its Saudi entities are in scope: group, MNE group, ultimate parent, constituent entity and the revenue test.","تحديد ما إذا كانت المجموعة وكياناتها في المملكة ضمن النطاق: المجموعة، والمجموعة المتعددة الجنسيات، والكيان الأم النهائي، والكيان التابع، واختبار الإيرادات."],"parts":[1,2],"arts":[2,3,4,7,8,9,10],"time":30,"metaphor":{"title":["The family photo","الصورة العائلية"],"text":["The ultimate parent's consolidated financial statements are the group's family photo. Everyone consolidated line by line is in the photo, and so is anyone left out only because they are small, immaterial or held for sale: that is the Group. The one who is not in anybody else's photo is the ultimate parent.\nIf at least one family member lives outside the parent's country, it is an MNE family. The revenue test reads the caption under the photo (consolidated revenue), never the Saudi member's own income.","القوائم المالية الموحدة للكيان الأم النهائي هي الصورة العائلية للمجموعة. كل من يُوحَّد على أساس كل بند على حدة موجود في الصورة، وكذلك من استُبعد فقط بسبب الحجم أو الجوهر أو لأنه محتفظ به لغرض البيع: هذه هي المجموعة. ومن لا يظهر في صورة أي أحد آخر هو الكيان الأم النهائي.\nفإذا كان فرد واحد على الأقل من العائلة يعيش خارج دولة الكيان الأم، فهي عائلة متعددة الجنسيات. ويقرأ اختبار الإيرادات التعليق المكتوب أسفل الصورة (الإيرادات الموحدة)، لا دخل الفرد الموجود في المملكة."]},"anchors":[{"if":["You need to know who belongs to the group","تحتاج إلى معرفة من ينتمي إلى المجموعة"],"then":["Open the UPE's consolidated statements: consolidated line by line, or left out only for size, materiality or held for sale (Art 8(2))","افتح القوائم الموحدة للكيان الأم النهائي: من يُوحَّد بنداً بنداً، أو يُستبعد فقط بسبب الحجم أو الجوهر أو الاحتفاظ به للبيع (المادة 8 (2))"]},{"if":["Group revenue hovers around €750m","تتأرجح إيرادات المجموعة حول 750 مليون يورو"],"then":["Build a four-year table of UPE consolidated revenue in riyals and prorate any year that is not 12 months (Art 2(3))","أعد جدولاً للإيرادات الموحدة للكيان الأم النهائي بالريال لأربع سنوات، وعدّل تناسبياً أي سنة لا تساوي 12 شهراً (المادة 2 (3))"]},{"if":["The accounts show investment gains or one-off gains","تُظهر القوائم مكاسب استثمارية أو مكاسب غير متكررة"],"then":["Count them: revenue includes net investment gains and extraordinary or non-recurring items (Art 3(1)(b))","احتسبها: تشمل الإيرادات صافي المكاسب الاستثمارية والبنود الاستثنائية أو غير المتكررة (المادة 3 (1) (ب))"]},{"if":["A Saudi company is owned by a sovereign wealth fund","شركة سعودية مملوكة لصندوق ثروة سيادي"],"then":["Ignore the fund if it meets the Governmental Entity test; each company it directly controls is the UPE of its own group (Art 10(2))","تجاهل الصندوق إذا استوفى معيار الكيان الحكومي؛ فكل شركة يسيطر عليها مباشرة هي الكيان الأم النهائي لمجموعتها (المادة 10 (2))"]},{"if":["A purely domestic Saudi group, with no foreign entity or PE","مجموعة سعودية محلية بالكامل بلا كيان أو منشأة دائمة في الخارج"],"then":["Not an MNE group, so out of scope however large it is (Art 8(1))","ليست مجموعة متعددة الجنسيات، فهي خارج النطاق مهما كان حجمها (المادة 8 (1))"]}],"diagrams":[{"type":"tree","title":["Is this Saudi entity in scope?","هل يخضع هذا الكيان في المملكة للنظام؟"],"root":{"q":["Is it in a Group: consolidated, or left out only for size, materiality or held for sale?","هل هو ضمن مجموعة: موحّد، أو مستبعد فقط بسبب الحجم أو الجوهر أو الاحتفاظ به للبيع؟"],"yes":{"q":["Does the Group have at least one entity or PE outside the UPE's jurisdiction?","هل لدى المجموعة كيان أو منشأة دائمة واحدة على الأقل خارج ولاية الكيان الأم النهائي؟"],"yes":{"q":["UPE consolidated revenue ≥ SAR equivalent of €750m in 2 of the 4 preceding years?","هل بلغت الإيرادات الموحدة ما يوازي 750 مليون يورو بالريال في سنتين من السنوات الأربع السابقة؟"],"yes":{"q":["Is the entity an Excluded Entity (Art 12)?","هل الكيان كيان مستبعد (المادة 12)؟"],"yes":{"end":["Out of scope: excluded","خارج النطاق: مستبعد"],"tone":"out"},"no":{"end":["In scope: a Saudi constituent entity and taxpayer","ضمن النطاق: كيان تابع في المملكة ومكلف"],"tone":"in"}},"no":{"end":["Out of scope for this year","خارج النطاق لهذه السنة"],"tone":"out"}},"no":{"end":["Not an MNE group: out of scope","ليست مجموعة متعددة الجنسيات: خارج النطاق"],"tone":"out"}},"no":{"end":["Not a group member. An entity with a foreign PE can still form its own Group (Art 8(3)).","ليس عضواً في مجموعة. ويمكن للكيان الذي له منشأة دائمة في الخارج أن يشكّل مجموعة بذاته (المادة 8 (3))."],"tone":"na"}},"quick":true},{"type":"table","title":["What counts as revenue for the €750m test","ما يُحتسب من الإيرادات لاختبار 750 مليون يورو"],"head":[["Item","البند"],["Treatment","المعالجة"]],"rows":[[["Sales of goods, services and other ordinary activities","بيع السلع وتقديم الخدمات والأنشطة الاعتيادية الأخرى"],["Included (Art 3(1)(a))","تُدرج (المادة 3 (1) (أ))"]],[["Net investment gains, realised or unrealised, in the consolidated P&L","صافي المكاسب الاستثمارية المحققة وغير المحققة في قائمة الأرباح والخسائر الموحدة"],["Included (Art 3(1)(b))","تُدرج (المادة 3 (1) (ب))"]],[["Extraordinary or non-recurring income or gains shown separately","الدخل أو المكاسب المعروضة بشكل منفصل كبنود استثنائية أو غير متكررة"],["Included (Art 3(1)(b))","تُدرج (المادة 3 (1) (ب))"]],[["Discounts, returns and allowances","الخصومات والمرتجعات والمسموحات"],["May be netted if the accounting standard allows (Art 3(2))","تجوز مقاصتها إذا سمح بها المعيار المحاسبي (المادة 3 (2))"]],[["Cost of sales and other operating expenses","تكلفة المبيعات والمصاريف التشغيلية الأخرى"],["Never deducted (Art 3(2))","لا تُخصم (المادة 3 (2))"]],[["Gross investment losses shown separately","إجمالي خسائر الاستثمارات المعروضة بشكل منفصل"],["Reduce revenue only up to gross investment gains (Art 3(4))","تخفض الإيرادات بحدود إجمالي المكاسب الاستثمارية فقط (المادة 3 (4))"]],[["Financial entities","الكيانات المالية"],["Use the items similar to revenue under the UPE's accounting standards (Art 3(5))","تُستخدم البنود المماثلة للإيرادات وفق المعايير المحاسبية للكيان الأم النهائي (المادة 3 (5))"]]]}],"points":[{"h":["Group","المجموعة"],"t":["Entities related through ownership or control whose assets, liabilities, income, expenses and cash flows are in the ultimate parent's consolidated financial statements, or are left out of them solely on size or materiality grounds or because the entity is held for sale. An entity with PEs in other jurisdictions is also a Group, if it is not part of another Group.","كيانات مرتبطة بالملكية أو السيطرة تُدرج أصولها والتزاماتها ودخلها ومصاريفها وتدفقاتها النقدية في القوائم المالية الموحدة للكيان الأم النهائي، أو تُستبعد منها فقط على أساس الحجم أو الجوهر أو لكون الكيان محتفظاً به لغرض البيع. ويُعد مجموعةً أيضاً الكيانُ الذي له منشآت دائمة في ولايات أخرى ما لم يكن جزءاً من مجموعة أخرى."],"r":["8(2)","8(3)"],"p":["A group is everyone in the parent's consolidated accounts.","المجموعة هي كل من يرد في القوائم الموحدة للكيان الأم."]},{"h":["MNE group","المجموعة المتعددة الجنسيات"],"t":["A Group with at least one entity or permanent establishment that is not located in the ultimate parent's jurisdiction. A purely domestic Saudi group is not an MNE group.","مجموعة لديها كيان أو منشأة دائمة واحدة على الأقل لا تقع في ولاية الكيان الأم النهائي. والمجموعة السعودية المحلية بالكامل ليست مجموعة متعددة الجنسيات."],"r":["8(1)"],"p":["The group needs at least one company or branch outside the parent's country.","يجب أن يكون للمجموعة شركة أو فرع واحد على الأقل خارج دولة الكيان الأم."]},{"h":["Constituent entity","الكيان التابع"],"t":["Any entity included in a Group, and any permanent establishment of such an entity. Each PE is treated as separate from its main entity and from the main entity's other PEs. Excluded entities are never constituent entities.","أي كيان مشمول في مجموعة، وأي منشأة دائمة لهذا الكيان. وتُعامل كل منشأة دائمة على أنها منفصلة عن الكيان الرئيسي وعن منشآته الدائمة الأخرى. ولا يكون الكيان المستبعد كياناً تابعاً أبداً."],"r":[9],"p":["Every group company counts, and each branch counts separately.","تُحتسب كل شركة في المجموعة، ويُحتسب كل فرع بمفرده."]},{"h":["Ultimate parent entity","الكيان الأم النهائي"],"t":["The entity that owns, directly or indirectly, a controlling interest in another entity and is not itself owned with a controlling interest by another entity; or the main entity of a Group formed by an entity and its foreign PEs.","الكيان الذي يمتلك بشكل مباشر أو غير مباشر حصة مسيطرة في كيان آخر، ولا يكون هو نفسه مملوكاً بحصة مسيطرة لكيان آخر؛ أو الكيان الرئيسي لمجموعة مكوّنة من كيان ومنشآته الدائمة في الخارج."],"r":["10(1)"],"p":["The UPE is the parent at the top: it controls others and nobody controls it.","الكيان الأم النهائي في القمة: يسيطر على غيره ولا يسيطر عليه أحد."]},{"h":["Controlling interest","الحصة المسيطرة"],"t":["An ownership interest such that the holder consolidates the entity line by line under an Acceptable Financial Accounting Standard, or would have to if it prepared consolidated statements. A main entity is deemed to hold the controlling interest in its PEs.","حصة ملكية تجعل مالكها يوحّد الكيان على أساس كل بند على حدة وفقاً للمعايير المحاسبية المالية المقبولة، أو كان سيتعين عليه ذلك لو أعدّ قوائم موحدة. ويُعد الكيان الرئيسي مالكاً للحصص المسيطرة في منشآته الدائمة."],"r":[7],"p":["Control means the owner consolidates the company line by line.","السيطرة تعني أن المالك يوحّد الشركة بنداً بنداً."]},{"h":["Which financial statements","أي قوائم مالية"],"t":["Consolidated statements prepared under an Acceptable Financial Accounting Standard. If the parent uses another standard, its statements count after adjustments to prevent material competitive distortions, which are corrected to the IFRS treatment under ZATCA guidance. If it prepares none, use those it would have prepared.","القوائم الموحدة المعدة وفق المعايير المحاسبية المالية المقبولة. فإذا استخدم الكيان الأم معياراً آخر، تُعتمد قوائمه بعد التعديلات اللازمة لمنع أي تباينات تنافسية جوهرية، والتي تُصحح إلى معالجة المعايير الدولية للتقرير المالي وفق إرشادات الهيئة. وإذا لم يُعد قوائم، تُستخدم القوائم التي كان سيعدها."],"r":["4(1)","4(2)"],"p":["Use the parent's consolidated accounts, prepared under an accepted standard.","استخدم القوائم الموحدة للكيان الأم المعدّة وفق معيار مقبول."]},{"h":["The accepted standards","المعايير المقبولة"],"t":["IFRS, plus the GAAP of Australia, Brazil, Canada, EU and EEA member states, Hong Kong (China), Japan, Mexico, New Zealand, China, India, Korea, Russia, Singapore, Switzerland, the UK and the USA.","المعايير الدولية للتقرير المالي، والمبادئ المحاسبية المقبولة عموماً في أستراليا والبرازيل وكندا والدول الأعضاء في الاتحاد الأوروبي والمنطقة الاقتصادية الأوروبية وهونغ كونغ (الصين) واليابان والمكسيك ونيوزيلندا والصين والهند وكوريا وروسيا وسنغافورة وسويسرا والمملكة المتحدة والولايات المتحدة."],"r":[1],"p":["IFRS and the main national GAAPs (US, UK, EU, Japan, China, India and others) are accepted.","تُقبل المعايير الدولية والمعايير الوطنية الرئيسية (الأمريكية والبريطانية والأوروبية واليابانية والصينية والهندية وغيرها)."]},{"h":["Sovereign wealth funds","صناديق الثروة السيادية"],"t":["A sovereign wealth fund that meets the Governmental Entity criterion of managing or investing the government's assets is not treated as an ultimate parent and is ignored. Each entity in which it holds a controlling interest through direct ownership is the ultimate parent of its own group, and each group is tested on its own.","لا يُعد صندوق الثروة السيادي الذي يستوفي معيار الكيان الحكومي (إدارة أصول الحكومة أو استثمارها) كياناً أماً نهائياً ويتم تجاهله. ويُعد كل كيان يملك فيه الصندوق حصة مسيطرة نتيجة حصص ملكية مباشرة الكيانَ الأم النهائي لمجموعته، وتُختبر كل مجموعة على حدة."],"r":["10(2)","13(2)"],"p":["A state fund is not the parent: each company it controls is tested on its own.","الصندوق الحكومي ليس كياناً أماً: وتُختبر كل شركة يسيطر عليها بمفردها."]},{"h":["Short and long years","السنوات القصيرة والطويلة"],"t":["If any of the four test years is not 12 months long, the €750m threshold for that year is adjusted in proportion to its length.","إذا كانت أي من سنوات الاختبار الأربع لا تساوي 12 شهراً، يُعدّل حد 750 مليون يورو لتلك السنة بما يتناسب مع مدتها."],"r":["2(3)"],"p":["For a short or long year, the €750m test is scaled to its length.","في السنة القصيرة أو الطويلة، تُعدّل عتبة 750 مليون يورو بحسب طولها."]}],"oecd":[{"t":["The scope test matches GloBE Article 1.1: €750m in the UPE's consolidated financial statements in at least two of the four preceding fiscal years. The draft measures the threshold in riyals.","يطابق اختبار النطاق المادة 1.1 من القواعد النموذجية: 750 مليون يورو في القوائم المالية الموحدة للكيان الأم النهائي في سنتين على الأقل من السنوات المالية الأربع السابقة. ويقيس المشروع الحد بالريال السعودي."],"src":["Model Rules Art 1.1","القواعد النموذجية: المادة 1.1"]},{"t":["The sovereign wealth fund rule follows OECD Administrative Guidance (February 2023): a fund that meets the Governmental Entity definition is not the UPE of the companies it controls, so they are tested as separate groups.","تتبع قاعدة صناديق الثروة السيادية الإرشادات الإدارية للمنظمة (فبراير 2023م): فالصندوق الذي يستوفي تعريف الكيان الحكومي لا يُعد الكيان الأم النهائي للشركات التي يسيطر عليها، فتُختبر كمجم
