تم استبعاد الدخل الناتج عن الإعفاء من الديون المدرج في صافي الدخل المحاسبي أو الخسارة المحاسبية من دخل أو خسارة ضريبة الحد الأدنى المحلي للكيان التابع المقترض.\n(ب) يتم استبعاد أي مصاريف ضريبية حالية متعلقة بالإعفاء من الديون وأي مصاريف ضريبية مؤجلة ذات صلة وناجمة عن تخفيض في الأصول والالتزامات الضريبية المحلية و المتعلقة بالإعفاء من الديون، من الضرائب المشمولة المعدلة للكيان التابع المقترض.\n3- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":30,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Stock-Based Compensation Expense Election","title_ar":"اختيار مصاريف التعويض على أساس الأسهم","page":25,"text_en":"1- For the purposes of computing the DMT Income or Loss, and at the election of the Filing Constituent Entity, a Constituent Entity may substitute the amount allowed as a deduction in the calculation of its taxable income in its location for the amount expensed in its financial accounts for a cost or expense of such Constituent Entity that was paid with stock-based compensation.\n2- If the stock-based compensation expense arises in connection with an option that expires without exercise, the Constituent Entity must include the total amount previously deducted in the calculation of its DMT Income or Loss for the Fiscal Year in which the option expires. 3- The election under this Article shall be a FiveYear Election and must be applied consistently to the stock-based compensation of all Constituent Entities located in the Kingdom for the year in which the election is made and all subsequent Fiscal Years.\n4- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- لأغراض احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي، وعند القيام بالاختيار من قبل الكيان التابع المعين لتقديم الإقرار، يجوز للكيان التابع أن يستبدل المبلغ المسموح به كخصم لاحتساب دخله الخاضع للضريبة في موقعه، مقابل مبلغ المصاريف في حساباته المالية، بتكلفة أو مصاريف هذا الكيان التابع المسددة بتعويضات على أساس الأسهم.\n2- إذا نشأت مصاريف التعويضات على أساس الأسهم بخصوص خيار تنتهي صلاحيته دون ممارسته، يجب على الكيان التابع تضمين المبلغ الإجمالي الذي تم خصمه سابقا في احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي للسنة المالية التي ينتهي فيها ذلك الخيار.\n3- يكون الاختيار بموجب هذه المادة اختياراً لخمس سنوات ويجب تطبيقه بما يتسق مع التعويضات على أساس الأسهم لجميع الكيانات التابعة الواقعة في المملكة للسنة التي يتم فيها إجراء الاختيار وجميع السنوات المالية اللاحقة.\n4- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":31,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Transactions not Consistent with the Arm’s Length Principle","title_ar":"المعاملات غير المتوافقة مع مبدأ السعر المحايد","page":26,"text_en":"1- Any transaction between Constituent Entities located in different jurisdictions that is not recorded in the same amount in the financial accounts of the Constituent Entities or that is not consistent with the Arm’s Length Principle shall be adjusted so as to be in the same amount and consistent with the Arm’s Length Principle.\n2- A loss from a sale or other transfer of an asset between two Constituent Entities located in the same jurisdiction that is not recorded consistent with the Arm’s Length Principle shall be recomputed based on the Arm’s Length Principle if that loss is included in the calculation of the DMT Income or Loss.\n3- Arm's Length Principle means the principle under which transactions between Constituent Entities must be recorded by reference to the conditions that would have been obtained between independent enterprises in comparable transactions and under comparable circumstances.\n4- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يجب تعديل أي معاملة بين كيانات تابعة واقعة في ولايات قضائية مختلفة لا يتم تسجيلها بنفس المبلغ في الحسابات المالية للكيانات التابعة أو لا تتوافق مع مبدأ السعر المحايد، بحيث تكون بنفس المبلغ وتتوافق مع مبدأ السعر المحايد.\n2- يجب إعادة احتساب الخسارة الناتجة عن بيع أصل أو نقله بين كيانيْن تابعيْن يقعان في نفس الولاية القضائية إذا تم تسجيلها بما لا يتوافق مع مبدأ السعر المحايد، بحيث تكون إعادة الاحتساب على أساس مبدأ السعر المحايد في حال إدراج تلك الخسارة في احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي.\n3- يُقصد بمبدأ السعر المحايد المبدأ الذي يجب بموجبه تسجيل المعاملات بين الكيانات التابعة على أساس الشروط التي كانت ستتحقق بين مؤسسات مستقلة في معاملات مماثلة وفي ظروف مماثلة.\n4- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":32,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Refundable Tax Credits and Marketable Transferable Tax Credits","title_ar":"الائتمانات الضريبية القابلة للاسترداد والائتمانات الضريبية القابلة للتسويق والتحويل","page":26,"text_en":"1- Qualified Refundable Tax Credits and Marketable Transferable Tax Credits shall be treated as income in the computation of the DMT Income or Loss of a Constituent Entity.\n2- A tax credit that is not a Qualified Refundable Tax Credit or a Marketable Transferable Tax Credit shall not be treated as income in the calculation of the DMT Income or Loss of a Constituent Entity.\n3- Qualified Refundable Tax Credit is a refundable tax credit designed in a way such that it must be paid as cash or available as cash equivalents within four years from when a Constituent Entity satisfies the conditions for receiving the credit under the laws of the jurisdiction granting the credit. A tax credit that is refundable in part is a Qualified Refundable Tax Credit to the extent it must be paid as cash or available as cash equivalents within four years from when a Constituent Entity satisfies the conditions for receiving the credit under the laws of the jurisdiction granting the credit. A Qualified Refundable Tax Credit does not include any amount of tax creditable or refundable pursuant to a Qualified Imputation Tax or a Disqualified Refundable Imputation Tax.\n4- Marketable Transferable Tax Credit is a tax credit that can be used by the holder of the credit to reduce its liability for a Covered Tax in the jurisdiction that issued the tax credit and that meets the legal transferability standard and the marketability standard in the hands of a holder.\n5- The Regulations shall specify the implementing provisions for this Article.","text_ar":"القابلة للاسترداد والائتمانات الضريبية القابلة للتسويق والتحويل\n1- تُعامل الائتمانات الضريبية المؤهلة القابلة للاسترداد والا ئتمانات الضريبية القابلة للتسويق والتحويل على أنها دخل عند احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي.\n2- لا يُعامل على أنه دخل عند احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي لكيان تابع الائتمان الضريبي الذي لا يُعد ائتماناً ضريبياً مؤهلاً قابلاً للاسترداد أو ائتماناً ضريبياً قابلاً للتسويق والتحويل.\n3- الائتمان الضريبي المؤهل القابل للاسترداد هو ائتمان ضريبي قابل للاسترداد مصمم بحيث يجب تسديده نقداً أو بما يعادل النقد خلال أربع سنوات من استيفاء الكيان التابع لشروط الحصول على الائتمان بموجب أنظمة الولاية القضائية المانحة للائتمان. يعد الائتمان الضريبي القابل للاسترداد جزئياً كائتمان ضريبي مؤهل قابل للاسترداد بقدر ما يجب تسديده نقداً أو بما يعادل النقد خلال أربع سنوات من استيفاء الكيان التابع لشروط الحصول على الائتمان بموجب أنظمة الولاية القضائية المانحة للائتمان. لا يتضمن الائتمان الضريبي المؤهل القابل للاسترداد أي مبلغ للضريبة القابلة للائتمان أو للاسترداد وفقاً لضريبة الإسناد المؤهلة أو الضريبة المسندة القابلة للاسترداد غير المؤهلة.\n4- الائتمان الضريبي القابل للتسويق والتحويل هو الائتمان الضريبي الذي يمكن أن يستخدمه صاحبه لتخفيض التزامه بالضريبة المشمولة في الولاية القضائية التي أصدرت الائتمان الضريبي والذي يستوفي معيار قابلية التحويل النظامي ومعيار قابلية التسويق في يد المالك.\n5- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":33,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Fair Value and Impairment Accounting Election","title_ar":"اختيار المحاسبة على أساس القيمة العادلة أو على أساس انخفاض القيمة","page":27,"text_en":"1- For the purposes of computing the DMT Income, a Filing Constituent Entity may elect to determine gains and losses using the realisation principle with respect to assets and liabilities that are subject to fair value or impairment accounting in the Consolidated Financial Statements.\n2- The election under this Article shall be a FiveYear Election. The election applies to all Constituent Entities located in the Kingdom unless otherwise specified by the Filing Constituent Entity.\n3- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- لأغراض احتساب دخل ضريبة الحد الأدنى المحلي، يجوز للكيان التابع المعين لتقديم الإقرار اختيار تحديد المكاسب والخسائر باستخدام مبدأ التحقق فيما يتعلق بالأصول والالتزامات التي تخضع للمحاسبة على أساس القيمة العادلة أو على أساس انخفاض القيمة في القوائم المالية الموحدة.\n2- يكون الاختيار بموجب هذه المادة اختيارا لخمس سنوات وينطبق الاختيار على جميع الكيانات التابعة الواقعة في المملكة ما لم يحدد الكيان التابع المعين لتقديم الإقرار خلاف ذلك.\n3- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":34,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Aggregate Asset Gain Election","title_ar":"اختيار مكاسب الأصول المجمعة","page":27,"text_en":"1- Where there is Aggregate Asset Gain in the Kingdom in a Fiscal Year, the Filing Constituent Entity may make an Annual Election for the Kingdom to adjust the DMT Income or Loss with respect to each previous Fiscal Year in the Look-Back Period and spread any remaining Adjusted Asset Gain over the Look-back Period.\n2- As a result of the election under paragraph (1) of this Article, the Effective Tax Rate and Domestic Top-up Tax, if any, for any previous Fiscal Year shall be recalculated as per the provisions of ARTICLE (63) of this Law. 3- For the purpose of this Article, the following phrases shall have the meanings set out against each of them:\n(a) Look-Back Period: in respect of an election under paragraph (1) of this Article, means the Election Year and the four prior Fiscal Years.\n(b) Local Tangible Asset: immovable property located in the Kingdom.\n(c) Aggregate Asset Gain: the net gain in the Election Year from the disposition of Local Tangible Assets by all Constituent Entities located in the Kingdom excluding the gain or loss on a transfer of assets between Group members.\n(d) Adjusted Asset Gain: an amount equal to the Aggregate Asset Gain in the Election Year, reduced by any amount of such gain that has been applied against the Net Asset Loss in a prior Loss Year under this Article.\n(e) Net Asset Loss: the net loss from the disposition of Local Tangible Assets by a Constituent Entity in a Fiscal Year excluding the gain or loss on a transfer of assets to another Group Member. The amount of Net Asset Loss shall be reduced by the amount of Net Asset Gain or Adjusted Asset Gain which is set-off against such loss as a result of a previous election made under this Article.\n(f) Net Asset Gain: the net gain from the disposition of Local Tangible Assets by a Constituent Entity located in the Kingdom and for which an election under this Article was made excluding the gain or loss on a transfer of assets to another Group Member.\n(g) Loss Year: in respect of jurisdiction for which the Filing Constituent Entity has made an election under this Article, means a Fiscal Year in the Look-Back Period for which there is a Net Asset Loss for a Constituent Entity located in that jurisdiction and the total amount of Net Asset Loss of all such Constituent Entities exceeds the total amount of their Net Asset Gain.\n4- The Regulations shall specify the implementing provisions and controls for this Article.","text_ar":"1- في حال وجود مكاسب أصول مجمعة في المملكة خلال سنة مالية، يجوز للكيان التابع المعين لتقديم الإقرار أن يقوم باختيار سنوي في المملكة لإعادة احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي بالنسبة لكل سنة مالية سابقة ضمن فترة المراجعة وتوزيع أي مكاسب أصول معدلة خلال فترة المراجعة.\n2- نتيجةً للاختيار بموجب الفقرة (1) من هذه المادة، يجب إعادة احتساب معدل الضريبة الفعلي والضريبة التكميلية المحلية لأي سنة مالية سابقة، إن وجدت، وفقاً لأحكام المادة (الثالثة والستين) من هذا النظام.\n3- لأغراض هذه المادة، يقصد بالعبارات الآتية المعاني الموضحة أمام كلٍ منها:\n(أ) فترة المراجعة: السنة التي تم فيها الاختيار والسنوات المالية الأربع التي تسبقها، فيما يتعلق بالاختيار المنصوص عليه في الفقرة (1) من هذه المادة.\n(ب) الأصل الملموس المحلي: الممتلكات غير المنقولة الواقعة في المملكة.\n(ج) مكاسب الأصول المجمعة: صافي المكاسب في سنة الاختيار الناجم عن التصرف في الأصول الملموسة المحلية من قبل جميع الكيانات التابعة الواقعة في المملكة، باستثناء المكاسب أو الخسارة الناتجة عن تحويل الأصول بين أعضاء المجموعة.\n(د) مكاسب الأصول المعدلة: مبلغ يساوي مكاسب الأصول المجمعة في سنة الاختيار، يخفض منه أي مبلغ من تلك المكاسب والذي تم تسويته مقابل صافي خسائر الأصول في سنة خسارة سابقة بموجب هذه المادة.\n(هـ) صافي خسائر الأصول: صافي الخسائر الناتجة عن التصرف في الأصول الملموسة المحلية من قبل كيان تابع في سنة مالية، باستثناء المكاسب أو الخسارة الناتجة عن نقل الأصول إلى عضو آخر في المجموعة، بعد تخفيضها بمبلغ صافي مكاسب الأصول أو مكاسب الأصول المعدلة التي يتم تعويضها مقابل هذه الخسارة نتيجة لاختيار سابق تم بموجب هذه المادة.\n(و) صافي مكاسب الأصول: صافي المكاسب الناتجة عن التصرف في الأصول الملموسة المحلية من قبل كيان تابع واقع في المملكة والتي تم إجراء اختيار بشأنها بموجب هذه المادة باستثناء المكاسب أو الخسائر الناتجة عن نقل الأصول إلى عضو آخر في المجموعة.\n(ز) سنة الخسارة: فيما يتعلق بالولاية القضائية التي أجرى الكيان التابع المعين لتقديم الإقرار الاختيار بشأنها وفقاً ل لمنصوص عليه في هذه المادة، هي السنة المالية في فترة المراجعة، التي تتضمن صافي خسائر الأصول العائدة للكيان التابع الواقع في تلك الولاية القضائية، ويتجاوز المبلغ الإجمالي لصافي خسائر الأصول لجميع تلك الكيانات التابعة إجمالي مبلغ صافي مكاسب أصولها.\n4- تحدد اللائحة الأحكام التنفيذية والضوابط لتطبيق هذه المادة."},{"n":35,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Intragroup Financing Arrangement","title_ar":"الترتيب التمويلي ضمن المجموعة","page":28,"text_en":"-1 The calculation of a Low-Tax Entity’s DMT Income or Loss shall exclude any expense attributable to an Intragroup Financing Arrangement that can reasonably be anticipated, over the expected duration of the arrangement, to increase the amount of expenses taken into account in calculating the DMT Income or Loss of the Low-Tax Entity without resulting in a commensurate increase in the taxable income of the High-Tax Counterparty.\n2- For the purpose of this Article, the following phrases shall have the meanings set out against each of them:\n(a) Intragroup Financing Arrangement: any arrangement entered between two or more members of the MNE Group whereby a HighTax Counterparty directly or indirectly provides credit or otherwise makes an investment in a Low-Tax Entity.\n(b) High-Tax Counterparty: Constituent Entity that is located in a jurisdiction that is not a Low-Tax Jurisdiction or that is located in a jurisdiction that would not be a Low-Tax Jurisdiction if its Effective Tax Rate were determined without regard to any income or expense accrued by that Entity in respect of an Intragroup Financing Arrangement.\n(c) Low-Tax Entity: a Constituent Entity located in a Low-Tax Jurisdiction or a jurisdiction that would be a Low-Tax Jurisdiction if the Effective Tax Rate for the jurisdiction were determined without regard to any income or expense accrued by that Entity in respect of an Intragroup Financing Arrangement.\n(d) Low-Tax Jurisdiction: in respect of an MNE Group in any Fiscal Year, means a jurisdiction where the MNE Group has Net DMT Income (or, for jurisdictions other than the Kingdom, Net GloBE Income calculated according to the GloBE Rules) and is subject to an Effective Tax Rate in that period (calculated under this Law or according to the GloBE Rules, as appropriate) that is lower than the Minimum Rate.","text_ar":"1- عند احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي للكيان الخاضع لمعدل ضريبي منخفض، يجب استبعاد أي مصاريف منسوبة إلى ترتيب تمويلي ضمن المجموعة التي يمكن بشكل معقول توقعها، وذلك على مدى المدة المتوقعة للترتيب، من أجل زيادة مبلغ المصاريف التي تؤخذ في الاعتبار عند احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي للكيان الخاضع لمعدل ضريبي منخفض دون أن يؤدي ذلك إلى زيادة متناسبة في الدخل الخاضع للضريبة للطرف المقابل الخاضع لمعدل ضريبي مرتفع.\n2- لأغراض هذه المادة، يقصد بالعبارات الآتية المعاني الموضحة أمام كلٍ منها:\n(أ) الترتيب التمويلي ضمن المجموعة: أي ترتيب يتم إبرامه بين عضوين أو أكثر في المجموعة المتعددة الجنسيات حيث يقوم الطرف المقابل الخاضع لمعدل ضريبي مرتفع بتقديم ائتمان بشكل مباشر أو غير مباشر، أو بالاستثمار بطريقة أخرى في كيان خاضع لمعدل ضريبي منخفض.\n(ب) الطرف المقابل الخاضع لمعدل ضريبي مرتفع : كيان تابع يقع في ولاية قضائية ليست ولاية قضائية ذات معدل ضريبي منخفض، أو يقع في ولاية قضائية لن تكون ولاية قضائية ذات معدل ضريبي منخفض فيما لو تم تحديد معدل الضريبة الفعلي لهذا الكيان دون الأخذ بالاعتبار أي دخل أو مصاريف مستحقة عليه بالنسبة لترتيب تمويلي ضمن المجموعة.\n(ج) الكيان الخاضع لمعدل ضريبي منخفض: الكيان التابع الواقع في ولاية قضائية ذات معدل ضريبي منخفض، أو في ولاية قضائية كانت ستكون كذلك لو حُدد معدل الضريبة الفعلي فيها دون الأخذ في الاعتبار أي دخل أو مصاريف مستحقة لذلك الكيان أو عليه فيما يتعلق بالترتيب التمويلي ضمن المجموعة.\n(د) الولاية القضائية ذات المعدل الضريبي المنخفض: هي ولاية قضائية تحقق فيها المجموعة المتعددة الجنسيات - في أي سنة مالية - صافي دخل ضريبة حد أدنى محلي (أو صافي دخل محتسب وفقاً لقواعد مكافحة تآكل الوعاء الضريبي العالمي بالنسبة للولايات القضائية الأخرى) وتخضع خلال تلك الفترة لمعدل ضريبة فعلي أقل من الحد الأدنى تم احتسابه وفقاً لأحكام النظام أو وفقاً لقواعد مكافحة تآكل الوعاء الضريبي العالمي بحسب الحال"},{"n":36,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Tax Consolidation Group Election","title_ar":"اختيار المجموعة الضريبية الموحدة","page":29,"text_en":"1- For the purposes of calculating the Net DMT Income or Net DMT Loss, and pursuant to an election made for the Kingdom by a Filing Constituent Entity under this Article, an Ultimate Parent Entity shall apply its consolidated accounting treatment to eliminate income, expense, gains and losses from transactions between Constituent Entities that meet all of the following conditions: (a) All the Entities are located in the Kingdom;\n(b) All the Entities are included in the same tax consolidation group.\n2- The election under this Article shall be a FiveYear Election. Upon making or revoking such election, appropriate adjustments shall be made for DMT purposes such that there shall not be duplications or omissions of items of the DMT Income or Loss as a result of having made or revoked the election.\n3- The Regulations shall specify implementing provisions for this Article.","text_ar":"1- لأغراض احتساب صافي دخل ضريبة الحد الأدنى المحلي أو صافي خسائر ضريبة الحد الأدنى المحلي، ووفقاً لاختيار يقوم به الكيان التابع المعين لتقديم الإقرار للمملكة بموجب هذه المادة، على الكيان الأم النهائي تطبيق المعالجة المحاسبية الموحدة لإلغاء الدخل والمصاريف والمكاسب والخسائر الناتجة عن المعاملات بين الكيانات التابعة التي تستوفي جميع الشروط الآتية:\n(أ) تكون جميع الكيانات واقعة في المملكة.\n(ب) تكون جميع الكيانات أعضاء في نفس المجموعة الضريبية الموحدة.\n2- يكون الاختيار بموجب هذه المادة اختيارا لخمس سنوات. عند إجراء هذا الاختيار أو إلغائه، يجب إجراء التعديلات المناسبة لأغراض ضريبة الحد الأدنى المحلي بحيث لا يكون هناك تكرار أو حذف لبنود دخل أو خسارة ضريبة الحد الأدنى المحلي نتيجة لقيام الاختيار أو إلغائه.\n3- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":37,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Insurance Companies","title_ar":"شركات التأمين","page":30,"text_en":"An insurance company shall:\n1- Exclude from the calculation of the DMT Income or Loss the amounts charged to policyholders for Taxes paid by the insurance company in respect of returns to the policy holders;\n2- Include in the calculation of the DMT Income or Loss any returns to policyholders that are not reflected in the Financial Accounting Net Income or Loss to the extent the corresponding increase or decrease in liability to the policyholders is reflected in its Financial Accounting Net Income or Loss.","text_ar":"على شركة التأمين:\n1- أن تستبعد من احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي المبالغ المفروضة على حاملي وثائق التأمين مقابل الضرائب التي تسددها شركة التأمين المتعلقة بعوائد حاملي وثائق التأمين.\n2- أن تدرج في احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي أي عوائد لحاملي وثائق التأمين التي لا تنعكس في صافي الدخل المحاسبي أو الخسارة المحاسبية شريطة أن تنعكس الزيادة أو النقصان المقابل في التزام حاملي وثائق التأمين ضمن صافي الدخل المحاسبي أو الخسارة المحا سبية."},{"n":38,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Additional Tier One Capital and Restricted Tier One Capital","title_ar":"الشريحة الإضافية الأولى لرأس المال والشريحة المقيدة الأولى لرأس المال","page":30,"text_en":"1- Amounts recognised as a decrease to the equity of a Constituent Entity attributable to distributions paid or payable in respect of Additional Tier One Capital, or in respect of Restricted Tier One Capital, issued by the Constituent Entity shall be treated as an expense in the calculation of its DMT Income or Loss.\n2- Amounts recognised as an increase to the equity of a Constituent Entity attributable to distributions received or receivable in respect of Additional Tier One Capital, or in respect of Restricted Tier One Capital, held by the Constituent Entity shall be included in the calculation of its DMT Income or Loss.\n3- Additional Tier One Capital means an instrument issued by a Constituent Entity pursuant to prudential regulatory requirements applicable to the banking sector that is convertible to equity or written down if a pre-specified trigger event occurs and that has other features which are designed to aid loss absorbency in the event of a financial crisis.\n4- Restricted Tier One Capital means an instrument issued by a Constituent Entity pursuant to prudential regulatory requirements applicable to the insurance sector that is convertible to equity or written down if a pre-specified trigger event occurs and that has other features which are designed to aid loss absorbency in the event of a financial crisis.\n5- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يجب أن تعامل المبالغ المعترف بها كتخفيض في حقوق ملكية الكيان التابع المنسوبة إلى التوزيعات المسددة أو الواجبة السداد الخاصة بالشريحة الإضافية الأولى لرأس المال أو الخاصة بالشريحة المقيدة الأولى لرأس المال الصادرة عن الكيان التابع، على أنها مصاريف عند احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي.\n2- يجب أن تدرج في احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي المبالغ المعترف بها كزيادة في حقوق ملكية الكيان التابع المنسوبة إلى التوزيعات المستلمة أو مستحقة الاستلام الخاصة بالشريحة الإضافية الأولى لرأس المال أو الخاصة بالشريحة المقيدة الأولى لرأس المال التي يحتفظ بها الكيان التابع.\n3- يُقصد بالشريحة الإضافية الأولى لرأس المال الأداة الصادرة عن كيان تابع وفقاً للمتطلبات التنظيمية الاحترازية المطبقة على القطاع المصرفي والتي يمكن تحويلها إلى حقوق ملكية أو يمكن تخفيضها في حال وقوع حدث هام محدد مسبقاً ، ولها ميزات أخرى مصممة للمساعدة في استيعاب الخسارة في حال حدوث أزمة مالية.\n4- يقصد بالشريحة المقيدة الأولى لرأس المال الأداة الصادرة عن كيان تابع وفقاً للمتطلبات التنظيمية الاحترازية المطبقة على قطاع التأمين والتي يمكن تحويلها إلى حقوق ملكية أو يمكن تخفيضها في حال وقوع حدث هام محدد مسبقاً ولها ميزات أخرى مصممة للمساعدة في استيعاب الخسارة في حال حدوث أزمة مالية.\n5- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":39,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"International Shipping Income Exclusion","title_ar":"استبعاد الدخل الناجم عن الشحن الدولي","page":31,"text_en":"1- A Constituent Entity’s International Shipping Income and Qualified Ancillary International Shipping Income shall be excluded from the calculation of its DMT Income or Loss for the jurisdiction in which it is located. Where the calculation of a Constituent Entity’s International Shipping Income and Qualified Ancillary International Shipping Income results in a loss, such loss shall be excluded from the calculation of its DMT Income or Loss.\n2- International Shipping Income means the net income obtained by a Constituent Entity from:\n(a) The transportation of passengers or cargo by ships that it operates in international traffic, whether the ship is owned, leased or otherwise at the disposal of the Constituent Entity;\n(b) The transportation of passengers or cargo by ships operated in international traffic under slot-chartering arrangements;\n(c) Leasing a ship, to be used for the transportation of passengers or cargo in international traffic, on charter fully equipped, crewed and supplied;\n(d) Leasing a ship on a bare boat charter basis, for the use of transportation of passengers or cargo in international traffic, to another Constituent Entity;\n(e) The participation in a pool, a joint business or an international operating agency for the transportation of passengers or cargo by ships in international traffic; and\n(f) The sale of a ship used for the transportation of passengers or cargo in international traffic provided that the ship has been held for use by the Constituent Entity for a minimum of one year. 3- International Shipping Income shall not include net income obtained from the transportation of passengers or cargo by ships via inland waterways within the same jurisdiction.\n4- Qualified Ancillary International Shipping Income means net income obtained by a Constituent Entity from the following activities that are performed primarily in connection with the transportation of passengers or cargo by ships in international traffic:\n(a) Leasing a ship on a bare boat charter basis to another shipping enterprise that is not a Constituent Entity, provided that the charter does not exceed three years;\n(b) Sale of tickets issued by other shipping enterprises for the domestic leg of an international voyage;\n(c) Leasing and short-term storage of containers or detention charges for the late return of containers;\n(d) Provision of services to other shipping enterprises by engineers, maintenance staff, cargo handlers, catering staff, and customer services personnel; and\n(e) Investment income where the investment that generates the income is made as an integral part of the carrying on the business of operating the ships in international traffic.\n5- The aggregated Qualified Ancillary International Shipping Income of all Constituent Entities located in a jurisdiction shall not exceed fifty percent (50%) of those Constituent Entities’ International Shipping Income.\n6- The costs incurred by a Constituent Entity that are directly attributable to its international shipping activities listed in paragraph (2) of this Article and the costs directly attributable to its qualified ancillary activities listed in paragraph (4) of this Article shall be deducted from the Constituent Entity’s Revenues from such activities to compute its International Shipping Income and Qualified Ancillary International Shipping Income.\n7- Other costs incurred by a Constituent Entity that are indirectly attributable to a Constituent Entity’s international shipping activities and qualified ancillary activities shall be allocated on the basis of the Constituent Entity’s Revenues from such activities in proportion to its total Revenues. 8- All direct and indirect costs attributed to a Constituent Entity’s International Shipping Income and Qualified Ancillary International Shipping Income shall be excluded from the calculation of its DMT Income or Loss.\n9- In order for a Constituent Entity’s International Shipping Income and Qualified Ancillary International Shipping Income to qualify for the exclusion from its DMT Income or Loss under this Article, the Constituent Entity must demonstrate that the strategic or commercial management of all ships concerned is effectively carried on from within the jurisdiction where the Constituent Entity is located.\n10- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يتم استبعاد الدخل الناجم عن الشحن الدولي ودخل الشحن الدولي المساند المؤهل للكيان التابع من احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي في الولاية القضائية التي يقع فيها. في حال أدى احتساب الدخل الناجم عن الشحن الدولي ودخل الشحن الدولي المساند المؤهل للكيان التابع إلى خسارة، يجب استبعاد تلك الخسارة من احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي.\n2- يقصد بالدخل الناجم عن الشحن الدولي صافي الدخل الذي يحصل عليه الكيان التابع من:\n(أ) نقل الركاب أو البضائع بالسفن التي يشغلها الكيان التابع في النقل الدولي، سواء كانت السفينة مملوكة أو مستأجرة أو تحت تصرف الكيان التابع.\n(ب) نقل الركاب أو البضائع بواسطة السفن العاملة في النقل الدولي بموجب ترتيبات استئجار المساحات الفارغة\n(ج) تأجير سفينة مجهزة بالكامل بطاقمها ولوازمها لاستخدامها في نقل الركاب أو البضائع في النقل الدولي\n(د) تأجير سفينة على أساس استئجار قارب فارغ لاستخدامها في نقل الركاب أو البضائع في النقل الدولي إلى كيان تابع آخر.\n(هـ) المشاركة في مجموعة أو عمل مشترك أو وكالة تشغيل دولية لنقل الركاب أو البضائع عن طريق السفن في النقل الدولي.\n(و) بيع سفينة تستخدم لنقل الركاب أو البضائع في النقل الدولي، شريطة أن تكون السفينة محتفظا بها لاستخدام الكيان التابع لمدة لا تقل عن سنة واحدة.\n3- لا يشمل الدخل الناجم عن الشحن الدولي صافي الدخل المحقق من نقل الركاب أو البضائع بالسفن عبر الممرات المائية الداخلية ضمن نفس الولاية القضائية.\n4- يقصد ب دخل الشحن الدولي المساند المؤهل صافي الدخل الذي يحصل عليه الكيان التابع من الأنشطة الآتية التي يتم تنفيذها بشكل أساسي بخصوص نقل الركاب أو البضائع بواسطة السفن في النقل الدولي:\n(أ) تأجير سفينة على أساس استئجار قارب فارغ إلى شركة شحن أخرى ليست من الكيانات التابعة، شرط ألا تتجاوز مدة الاستئجار ثلاث سنوات\n(ب) بيع التذاكر الصادرة عن مؤسسات الشحن الأخرى للمرحلة المحلية من الرحلة الدولية.\n(ج) تأجير الحاويات وتخزينها لفترة قصيرة أو رسوم الاحتجاز مقابل التأخر في إرجاع حاويات\n(د) تقديم الخدمات لمؤسسات الشحن الأخرى عن طريق المهندسين، وموظفي الصيانة، وحاملي البضائع، وموظفي تقديم الطعام، وموظفي خدمة العملاء\n(هـ) دخل الاستثمار عندما يكون الاستثمار الذي يحقق الدخل جزءاً لا يتجزأ من ممارسة أعمال تشغيل السفن في النقل الدولي.\n5- يجب ألا يتجاوز دخل الشحن الدولي المساند المؤهل المجمع لجميع الكيانات التابعة الواقعة في الولاية القضائية خمسين بالمائة (50%) من الدخل الناجم عن الشحن الدولي لهذه الكيانات التابعة.\n6- يجب أن تخصم التكاليف التي يتكبدها الكيان التابع المنسوبة مباشرة إلى أنشطة الشحن الدولي المنصوص عليها في الفقرة (2) من هذه المادة، وكذلك التكاليف المنسوبة مباشرةً إلى أنشطته المساندة المؤهلة المنصوص عليها في الفقرة من هذه المادة، من إيرادات الكيان التابع الناتجة عن هذه الأنشطة عند احتساب الدخل الناجم عن الشحن الدولي ودخل الشحن الدولي المساند المؤهل.\n7- يجب تخصيص التكاليف الأخرى التي يتكبدها الكيان التابع المنسوبة بشكل غير مباشر إلى أنشطة الشحن الدولي والأنشطة المساندة المؤهلة للكيان التابع، على أساس إيرادات الكيان التابع الناتجة عن هذه الأنشطة بالنسبة إلى إجمالي إيراداته.\n8- يجب استبعاد جميع التكاليف المباشرة وغير المباشرة المنسوبة إلى الدخل الناجم عن الشحن الدولي ودخل الشحن الدولي المساند المؤهل للكيان التابع من احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي.\n9- يجب أن يثبت الكيان التابع أن الإدارة الإستراتيجية أو التجارية لجميع السفن المعنية تتم بشكل فعال من داخل الولاية القضائية التي يقع فيها هذا الكيان التابع، لكي يكون الدخل الناجم عن الشحن الدولي ودخل الشحن الدولي المساند المؤهل العائد له مؤهّ لين للاستبعاد من احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي بموجب هذه المادة.\n10- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":40,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Allocation of Income or Loss between a Main Entity and a Permanent Establishment","title_ar":"تخصيص الدخل أو الخسارة بين كيان رئيسي ومنشأة دائمة","page":33,"text_en":"1- The Financial Accounting Net Income or Loss of a Constituent Entity that is a Permanent Establishment in accordance with paragraphs (1), (2) and (3) of ARTICLE (11) of this Law shall be the net income or loss reflected in the separate financial accounts of the Permanent Establishment.\n2- For the purposes of paragraph (1) of this Article, when the Permanent Establishment does not have separate financial accounts, the Financial Accounting Net Income or Loss shall be the amount that would have been reflected in its separate financial accounts if prepared on a standalone basis and in accordance with the accounting standard used in the preparation of the Consolidated Financial Statements of the Ultimate Parent Entity.\n3- The Regulations shall specify the cases where it is necessary to adjust the Financial Accounting Net Income or Loss of a Permanent Establishment referred to in paragraph (1) of this Article.\n4- In case of a Constituent Entity that is a Permanent Establishment as defined by paragraph (4) of ARTICLE (11) of this Law, its income used for computing Financial Accounting Net Income or Loss shall be the income being exempted in the jurisdiction where the Main Entity is located and attributable to the operations conducted outside that jurisdiction. The expenses used for computing Financial Accounting Net Income or Loss shall be those that are not deducted for taxable purposes in the jurisdiction where the Main Entity is located and that are attributable to such operations.\n5- The Financial Accounting Net Income or Loss of a Permanent Establishment shall not be taken into account in determining the DMT Income or Loss of the Main Entity, except as stipulated in paragraph (6) of this Article.\n6- A DMT Loss of a Permanent Establishment shall be treated as an expense of the Main Entity (and not of the Permanent Establishment) for the purposes of computing its DMT Income or Loss to the extent that the loss of the Permanent Establishment is treated as an expense in the calculation of the domestic taxable income of such Main Entity and is not set off against an item of income that is subject to tax under the laws of both the jurisdiction of the Main Entity and the jurisdiction of the Permanent Establishment. The DMT Income subsequently arising in the Permanent Establishment shall be treated as DMT Income of the Main Entity (and not the Permanent Establishment) up to the amount of the DMT Loss that was previously treated as an expense for the purposes of computing the DMT Income or Loss of the Main Entity.\n7- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يكون صافي الدخل المحاسبي أو الخسارة المحاسبية للكيان التابع الذي يعد منشأة دائمة بموجب الفقرات (1) و(2) و(3) من المادة (الحادية عشرة) من هذا النظام، هو صافي الدخل أو الخسارة المنعكسة في الحسابات المالية المنفصلة للمنشأة الدائمة.\n2- لأغراض الفقرة (1) من هذه المادة، عندما لا يكون للمنشأة الدائمة حسابات مالية منفصلة، فإن صافي الدخل المحاسبي أو الخسارة المحاسبية هو المبلغ الذي كان سينعكس في حساباتها المالية المنفصلة في حال تم إعدادها على أساس مس تقل ووفقا للمعايير المحاسبية المستخدمة في إعداد القوائم المالية الموحدة للكيان الأم النهائي.\n3- تحدد اللائحة الحالات التي تتطلب تعديل صافي الدخل المحاسبي أو الخسارة المحاسبية لمنشأة دائمة كما هو محدد في الفقرة (1) من هذه المادة.\n4- في الحالات التي يعد فيها الكيان التابع منشأةً دائمةً كما تم تعريفها في الفقرة (4) من المادة (الحادية عشرة) من هذا النظام، يجب أن يكون دخله المستخدم لاحتساب صافي الدخل المحاسبي أو الخسارة المحاسبية هو الدخل المعفى في الولاية القضائية التي يقع فيها الكيان الرئيسي والمنسوب إلى العمليات التي تتم خارج تلك الولاية القضائية. تكون المصاريف المستخدمة لاحتساب صافي الدخل المحاسبي أو الخسارة المحاسبية تلك التي لا يسمح خصمها لأغراض الضريبة في الولاية القضائية التي يقع فيها الكيان الرئيسي والمنسوبة إلى هذه العمليات.\n5- لا يؤخذ بصافي الدخل المحاسبي أو الخسارة المحاسبية للمنشأة الدائمة عند تحديد دخل أو خسارة ضريبة الحد الأدنى المحلي للكيان الرئيسي، باستثناء ما تنص عليه الفقرة (6) من هذه المادة.\n6- يجب أن تعامل خسارة ضريبة الحد الأدنى المحلي لمنشأة دائمة على أنها مصاريف للكيان الرئيسي (وليس للمنشأة الدائمة) لأغراض احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي شرط معاملة خسارة المنشأة الدائمة كمصاريف في احتساب الدخل المحلي الخاضع للضريبة لهذا الكيان لا رئيسي وعدم تعويضها مقابل بند من الدخل الذي يخضع للضريبة بموجب أنظمة كل من الولاية القضائية للكيان الرئيسي والولاية القضائية للمنشأة الدائمة. ويعامل دخل ضريبة الحد الأدنى المحلي الذي ينشأ لاحقاً في المنشأة الدائمة على أنه دخل ضريبة الحد الأدنى المحلي للكيان الرئيسي (وليس المنشأة الدائمة) بما لا يتجاوز مبلغ خسارة ضريبة الحد الأدنى المحلي الذي تم التعامل معه سابقا كمصاريف لأغراض احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي للكيان الرئيسي.\n7- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":41,"part":3,"part_en":"DMT Income or Loss","part_ar":"دخل أو خسارة ضريبة الحد الأدنى المحلي","title_en":"Allocation of Income or Loss from a Flow-Through Entity","title_ar":"تخصيص الدخل أو الخسارة من كيان شفاف مالياً","page":34,"text_en":"1- The Financial Accounting Net Income or Loss of a Constituent Entity that is a Flow-through Entity shall be allocated as follows:\n(a) In the case of a Permanent Establishment through which the business of the Entity is wholly or partly carried out, the Financial Accounting Net Income or Loss of the Entity shall be allocated to that Permanent Establishment in accordance with ARTICLE\n(40) of this Law;\n(b) In the case of a Tax Transparent Entity that is not the Ultimate Parent Entity, any Financial Accounting Net Income or Loss remaining after application of sub-paragraph (a) of this paragraph shall be allocated to its Constituent Entity-owners that are Reference Entities in accordance with their Ownership Interests; and\n(c) In the case of a Tax Transparent Entity that is the Ultimate Parent Entity or a Reverse Hybrid Entity, any Financial Accounting Net Income or Loss remaining after application of sub-paragraph (a) of this paragraph shall be allocated to it.\n2- A Flow-through Entity is a Reverse Hybrid Entity with respect to its income, expenditure, profit or loss to the extent that the jurisdiction in which the Reference Entity is located does not treat the tested Entity, and each Entity through which the Reference Entity owns its Ownership Interest in the tested Entity, as fiscally transparent.\n3- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يجب تخصيص صافي الدخل المحاسبي أو الخسارة المحاسبية للكيان التابع الذي يكون كياناً شفافاً ماليا على النحو الآتي:\n(أ) فيما يتعلق بالمنشأة الدائمة التي تزاول من خلالها أعمال الكيان كلياً أو جزئياً ، يجب تخصيص صافي الدخل المحاسبي أو الخسارة المحاسبية للكيان لتلك المنشأة الدائمة بموجب المادة (الأربعين) من هذا النظام\n(ب) فيما يتعلق بالكيان الشفاف ضريبياً الذي لا يكون الكيان الأم النهائي، يجب تخصيص أي صافي دخل محاسبي أو خسارة محاسبية متبقية بعد تطبيق الفقرة الفرعية\n(أ) من هذه الفقرة للكيانات التابعة المالكة التي تكون كيانات مرجعية وفقاً لحصص ملكيتها.\n(ج) فيما يتعلق بالكيان الشفاف ضريبياً الذي يكون الكيان الأم النهائي أو كيانا هجينا عكسيا ، يجب أن يخصص له ما تبقى من أي صافي دخل محاسبي أو خسارة محاسبية بعد تطبيق الفقرة الفرعية\n(أ) من هذه الفقرة.\n2- يُعد الكيان المختبر - الشفاف مالياً - كياناً هجيناً عكسياً فيما يتعلق بدخله أو نفقاته أو أرباحه أو خسائره إلى الحد الذي لا تتعامل فيه الولاية القضائية التي يقع فيها الكيان المرجعي مع الكيان المختبر، ومع كل كيان يمتلك من خلاله الكيان المرجعي حصة ملكية في الكيان المختبر، باعتباره شفافاً مالياً.\n3- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":42,"part":4,"part_en":"Covered Taxes","part_ar":"الضرائب المشمولة","title_en":"Scope of Covered Taxes","title_ar":"نطاق الضرائب المشمولة","page":35,"text_en":"1- Covered Taxes means:\n(a) Taxes recorded in the financial accounts of a Constituent Entity with respect to its income or profits or its share of the income or profits of a Constituent Entity in which it owns an Ownership Interest;\n(b) Taxes imposed in lieu of a generally applicable corporate income tax; and\n(c) Taxes levied by reference to retained earnings and corporate equity, including Zakat levied by the Kingdom on companies and other taxes levied on multiple components based on income and equity.\n2- Covered Taxes do not include any amount of:\n(a) Top-up Tax accrued by a Parent Entity under a Qualified IIR;\n(b) Top-up Tax accrued by a Constituent Entity under a Qualified Domestic Minimum Top-up Tax;\n(c) Taxes attributable to an adjustment made by a Constituent Entity as a result of the application of a Qualified UTPR;\n(d) Taxes paid by an insurance company in respect of returns to policyholders.\n3- For the purposes of this Article, tax is a compulsory unrequited payment to General Government.\n4- For the purpose of this Article, Top-up tax is the top-up tax computed for the jurisdiction or Constituent Entity pursuant to the relevant provisions of the GloBE Rules.\n5- The Regulations shall specify the controls and implementing provisions for this Article.","text_ar":"1- يُقصد بالضرائب المشمولة:\n(أ) الضرائب المسجلة في الحسابات المالية للكيان التابع فيما يتعلق بدخله أو أرباحه أو حصته في دخل أو أرباح كيان تابع يمتلك فيه حصة ملكية\n(ب) الضرائب المفروضة بدلاً من ضريبة الدخل على الشركات المطبقة عموماً\n(ج) الضرائب المفروضة بالرجوع إلى الأرباح المحتجزة وحقوق ملكية الشركات، بما في ذلك الزكاة التي تفرضها المملكة على الشركات والضرائب الأخرى المفروضة على مكونات متعددة على أساس الدخل وحقوق الملكية.\n2- لا تشمل الضرائب المشمولة أي مبلغ مما يلي:\n(أ) الضريبة التكميلية المستحقة على كيان أم بموجب قاعدة تضمين الدخل المؤهلة.\n(ب) الضريبة التكميلية المستحقة على كيان تابع بموجب ضريبة تكميلية محلية أدنى مؤهلة.\n(ج) الضرائب المنسوبة إلى تعديل أجراه الكيان التابع نتيجة لتطبيق قاعدة أرباح خاضعة لمعدل ضريبي منخفض مؤهلة.\n(د) الضرائب التي تسددها شركة التأمين فيما يتعلق بالعوائد لحاملي وثائق التأمين\n3- لأغراض هذه المادة، الضريبة هي سداد إلزامي مسدد بلا مقابل للإدارات الحكومية.\n4- لأغراض هذه المادة، الضريبة التكميلية هي الضريبة التكميلية المحتسبة للولاية القضائية أو الكيان التابع وفقاً للأحكام ذات الصلة من قواعد مكافحة تآكل الوعاء الضريبي العالمي.\n5- تحدد اللائحة الضوابط والأحكام التنفيذية لتطبيق هذه المادة"},{"n":43,"part":4,"part_en":"Covered Taxes","part_ar":"الضرائب المشمولة","title_en":"Disqualified Refundable Imputation Tax","title_ar":"الضريبة المسندة القابلة للاسترداد غير المؤهلة","page":35,"text_en":"Disqualified Refundable Imputation Tax means any amount of tax, other than a Qualified Imputation Tax, accrued or paid by a Constituent Entity that meets any of the following conditions:\n1- The amount of tax is refundable to the beneficial owner of a dividend distributed by such Constituent Entity in respect of that dividend or creditable by the beneficial owner against a tax liability other than a tax liability in respect of such dividend;\n2- The amount of tax is refundable to the distributing corporation upon distribution of a dividend.","text_ar":"الضريبة المسندة القابلة للاسترداد غير المؤهلة هي أي مبلغ ضريبة، غير ضريبة الإسناد المؤهلة، المستحقة أو المسددة من قبل الكيان التابع والتي تتوافر فيها أي من الشروط الآتية:\n1- يكون مبلغ الضريبة قابلاً للاسترداد إلى المالك المستفيد من توزيعات الأرباح الموزعة من قبل الكيان التابع فيما يتعلق بتوزيعات الأرباح هذه، أو قابلا للائتمان من قبل المالك المستفيد مقابل التزام ضريبي غير الالتزام الضريبي المتعلق بتوزيعات الأرباح المعنية.\n2- يكون مبلغ الضريبة قابلا للاسترداد إلى الشركة الموزعة عند توزيع توزيعات الأرباح."},{"n":44,"part":4,"part_en":"Covered Taxes","part_ar":"الضرائب المشمولة","title_en":"Adjusted Covered Taxes","title_ar":"الضرائب المشمولة المعدلة","page":36,"text_en":"1- The Adjusted Covered Taxes of a Constituent Entity for the Fiscal Year shall be equal to the current tax expense accrued in its Financial Accounting Net Income or Loss with respect to Covered Taxes for the Fiscal Year adjusted by:\n(a) The net amount of its Additions to Covered Taxes for the Fiscal Year, as determined under ARTICLE (45) of this Law, and Reductions to Covered Taxes for the Fiscal Year, as determined under ARTICLE (46) of this Law;\n(b) The Total Deferred Tax Adjustment Amount, calculated in accordance with ARTICLES (49),\n(50) and (51) of this Law;\n(c) Any increase or decrease in Covered Taxes recorded in equity or Other Comprehensive Income relating to amounts included in the calculation of DMT Income or Loss that are subject to tax under the tax laws of the Kingdom.\n2- At the election of the Filing Constituent Entity, or where the Top-up Tax Percentage for the Kingdom for a Fiscal Year exceeds the Minimum Rate, an MNE Group shall exclude the Excess Negative Tax Expense from its Adjusted Covered Taxes for the Kingdom in respect of the Fiscal Year and establish an Excess Negative Tax Expense Carry-forward to the following Fiscal Year.\n3- For the purposes of determining a Constituent Entity’s Adjusted Covered Taxes, no amount of Covered Taxes shall be taken into account more than once.\n4- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- تساوي الضرائب المشمولة المعدلة للكيان التابع عن السنة المالية، المصاريف الضريبية الحالية المستحقة في صافي الدخل المحاسبي أو الخسارة المحاسبية المتعلقة بالضرائب المشمولة للسنة المالية، والتي تم تعديلها تبعاً للآتي:\n(أ) صافي مبلغ الإضافات على الضرائب المشمولة التابعة لها للسنة المالية، كما هو محدد في المادة (الخامسة والأربعين) من هذا النظام، والتخفيضات على الضرائب المشمولة للسنة المالية ، كما هو محدد بموجب المادة (السادسة والأربعين) من هذا النظام\n(ب) إجمالي مبلغ تسوية الضريبة المؤجلة المحتسبة وفقاً لأحكام المواد (التاسعة والأربعين) و (الخمسين) و(الحادية والخمسين) من هذا النظام.\n(ج) أي زيادة أو نقصان في الضرائب المشمولة المسجلة في حقوق الملكية أو الدخل الشامل الآخر المرتبطة بالمبالغ المدرجة في احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي و الخاضعة للضريبة بموجب الأنظمة الضريبية في المملكة.\n2- عند اختيار الكيان التابع المعين لتقديم الإقرار، أو إذا تجاوزت نسبة الضريبة التكميلية في المملكة الحد الأدنى عن سنة مالية معينة، على المجموعة المتعددة الجنسيات استبعاد مصاريف الضريبة السلبية الزائدة من الضرائب المشمولة المعدلة العائدة لها في المملكة عن السنة المالية وتكوين مصاريف ضريبة سلبية زائدة مرحّلة إلى السنة المالية التالية.\n3- لأغراض تحديد الضرائب المشمولة المعدلة لكيان تابع، لا يتم الأخذ بالاعتبار أل ي مبلغ من الضرائب المشمولة أكثر من مرة واحدة.\n4- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":45,"part":4,"part_en":"Covered Taxes","part_ar":"الضرائب المشمولة","title_en":"Additions to Covered Taxes","title_ar":"إضافات على الضرائب المشمولة","page":37,"text_en":"1- The Additions to Covered Taxes of a Constituent Entity for the Fiscal Year represent the sum of the following amounts:\n(a) Any amount of Covered Taxes accrued as an expense in the profit before taxation in the financial accounts;\n(b) Any amount of Covered Taxes that is paid in the Fiscal Year and that relates to an uncertain tax position where that amount has been treated for a previous Fiscal Year as a Reduction to Covered Taxes under subparagraph (d) of paragraph (1) of ARTICLE\n(46) of this Law; and\n(c) Any amount of credit or refund in respect of a Qualified Refundable Tax Credit or Marketable Transferable Tax Credit that is recorded as a reduction to the current tax expense.\n2- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- الإضافات على الضرائب المشمولة للكيان التابع عن السنة المالية هي إجمالي المبالغ الآتية:\n(أ) أي مبلغ من الضرائب المشمولة المستحقة كمصاريف عند احتساب الأرباح في الحسابات المالية قبل فرض الضريبة.\n(ب) أي مبلغ من الضرائب المشمولة المسددة في السنة المالية المتعلق بوضع ضريبي غير مؤكد حيث تمت معاملة هذا المبلغ في سنة مالية سابقة كتخفيض على الضرائب المشمولة بموجب الفقرة الفرعية\n(د) من الفقرة (1) من المادة (السادسة والأربعين) من هذا النظام.\n(ج) أي مبلغ ائتمان أو استرداد فيما يتعلق بائتمان ضريبي مؤهل قابل للاسترداد أو ائتمان ضريبي قابل للتسويق والتحويل تم تسجيله كتخفيض للمصاريف الضريبية الحالية.\n2- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":46,"part":4,"part_en":"Covered Taxes","part_ar":"الضرائب المشمولة","title_en":"Reductions to Covered Taxes","title_ar":"التخفيضات على الضرائب المشمولة","page":37,"text_en":"1- The Reductions to Covered Taxes of a Constituent Entity for the Fiscal Year represent the sum of the following amounts:\n(a) The amount of current tax expense with respect to income excluded from the calculation of the DMT Income or Loss under Part Three (3) of this Law;\n(b) Any tax credit or any part of a tax credit that does not meet the definitions of a Qualified Refundable Tax Credit or Marketable Transferable Tax Credit, and that is not recorded as a reduction to the current tax expense in the financial accounts of the Constituent Entity;\n(c) Any amount of Covered Taxes refunded or credited to a Constituent Entity, except for any Qualified Refundable Tax Credit or Marketable Transferable Tax Credit, and that was not treated as an adjustment to current tax expense in the financial accounts. This subparagraph will apply only when such a refund (or credit) is not an adjustment to a Constituent Entity’s liability for Covered Taxes for a previous Fiscal Year under paragraphs\n(1) to (5) of ARTICLE (52) of this Law;\n(d) The amount of current tax expense which relates to an uncertain tax position;\n(e) Any amount of current tax expense that is not expected to be paid within three years of the last day of the Fiscal Year. 2- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- التخفيضات على الضرائب المشمولة للكيان التابع عن السنة المالية هي إجمالي المبالغ الآتية:\n(أ) مبلغ المصاريف الضريبية الحالية المتعلقة بالدخل المستبعد من احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي بموجب الجزء الثالث من هذا النظام.\n(ب) أي ائتمان ضريبي أو أي جزء من ائتمان ضريبي لا يستوفي تعريفات الائتمان الضريبي المؤهل القابل للاسترداد أو الائتمان الضريبي القابل للتسويق والتحويل، ولم يتم تسجيله كتخفيض في المصاريف الضريبية الحالية في الحسابات المالية للكيان التابع.\n(ج) أي مبلغ من الضرائب المشمولة تم استرداده أو ائتمانه لصالح الكيان التابع، باستثناء أي ائتمان ضريبي مؤهل قابل للاسترداد أو ائتمان ضريبي قابل للتسويق والتحويل، ولم يعامل كتسوية للمصاريف الضريبية الحالية في الحسابات المالية. تطبق هذه الفقرة الفرعية فقط عندما لا يكون هذا الاسترداد (أو الائتمان) بمثابة تعديل لالتزام الكيان التابع عن الضرائب المشمولة لسنة مالية سابقة بموجب الفقرات (1) إلى (5) من المادة (الثانية والخمسين) من هذا النظام.\n(د) مبلغ لا مصاريف الضريبية الحالية المتعلق بوضع ضريبي غير مؤكد.\n(هـ) أي مبلغ من المصاريف الضريبية الحالية غير المتوقع سدادها خلال ثلاث سنوات من اليوم الأخير من السنة المالية.\n2- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":47,"part":4,"part_en":"Covered Taxes","part_ar":"الضرائب المشمولة","title_en":"Excess Negative Tax Expense","title_ar":"مصاريف الضريبة السلبية الزائدة","page":38,"text_en":"1- For the purposes of the election under paragraph (2) of ARTICLE (44) of this Law, Excess Negative Tax Expense for a Fiscal Year for the Kingdom shall be an amount equal to the difference between the Adjusted Covered Taxes and the Expected Adjusted Covered Taxes Amount, where in such Fiscal Year the MNE Group has no Net DMT Income for the Kingdom.\n2- The Excess Negative Tax Expense for a Fiscal Year in which the MNE Group realizes positive Net DMT Income for the Kingdom shall be equal to the negative Adjusted Covered Taxes in such Fiscal Year.\n3- For the purpose of paragraph (1) of this Article, the Expected Adjusted Covered Taxes Amount shall be computed in accordance with paragraph (4) of ARTICLE (63) of this Law.\n4- The Excess Negative Tax Expense for a Fiscal Year in which the MNE Group realizes no Net DMT Income for the Kingdom shall be equal to the amount computed under paragraphs (3) and (4) of ARTICLE (63) of this Law for that Fiscal Year.\n5- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- لأغراض الاختيار بموجب الفقرة (2) من المادة (الرابعة والأربعين) من هذا النظام، تكون مصاريف الضريبة السلبية الزائدة في المملكة لسنة مالية مبلغاً يساوي الفرق بين الضرائب المشمولة المعدلة ومبلغ الضرائب المشمولة المعدلة المتوقعة، إذا لم يكن للمجموعة المتعددة الجنسيات صافي دخل ضريبة حد أدنى محلي في المملكة خلال السنة المالية المعنية.\n2- تساوي مصاريف الضريبة السلبية الزائدة - في السنة المالية التي يتحقق فيها للمجموعة المتعددة الجنسيات صافي دخل ضريبة حد أدنى محلي إيجابي في المملكة- الضرائب المشمولة المعدلة السلبية خلال تلك السنة.\n3- لأغراض الفقرة (1) من هذه المادة، يحتسب مبلغ الضرائب المشمولة المعدلة المتوقعة وفقاً للفقرة (4) من المادة (الثالثة والستين) من هذا النظام.\n4- إن مصاريف الضريبة السلبية الزائدة للسنة المالية التي لا تحقق فيها المجموعة المتعددة الجنسيات أي صافي دخل ضريبة حد أدنى محلي في المملكة تساوي المبلغ المحتسب بموجب الفقرتين (3) و (4) من المادة (الثالثة والستين) من هذا النظام لتلك السنة المالية.\n5- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":48,"part":4,"part_en":"Covered Taxes","part_ar":"الضرائب المشمولة","title_en":"Allocation of Covered Taxes from One Constituent Entity to Another Constituent Entity","title_ar":"تخصيص الضرائب المشمولة من كيان تابع إلى كيان تابع آخر","page":38,"text_en":"Covered Taxes shall be allocated from one Constituent Entity to another Constituent Entity in accordance with the provisions specified in the Regulations.","text_ar":"يجب تخصيص الضرائب المشمولة من كيان تابع إلى كيان تابع آخر بموجب الأحكام التي تحددها اللائحة."},{"n":49,"part":4,"part_en":"Covered Taxes","part_ar":"الضرائب المشمولة","title_en":"Mechanism to Address Temporary Differences","title_ar":"آلية معالجة الفروقات المؤقتة","page":38,"text_en":"1- Where the tax rate applied for the purposes of calculating the deferred tax expense in the financial accounts of a Constituent Entity for a Fiscal Year is equal to or less than the Minimum Rate, the Total Deferred Tax Adjustment Amount for that Constituent Entity for the Fiscal Year shall be equal to the deferred tax expense accrued in the Financial Accounting Net Income or Loss for that Constituent Entity, as defined under ARTICLE (18) of this Law, for the Fiscal Year with respect to Covered Taxes.\n2- Where the tax rate applied for the purposes of calculating the deferred tax expense in the financial accounts of a Constituent Entity for a Fiscal Year is greater than the Minimum Rate, the Total Deferred Tax Adjustment Amount for that Constituent Entity for the Fiscal Year shall be equal to the deferred tax expense accrued in its financial accounts for the Fiscal Year with respect to Covered Taxes recalculated at the Minimum Rate.\n3- The Total Deferred Tax Adjustment Amount for a Constituent Entity for a Fiscal Year shall not include any of the following:\n(a) The amount of deferred tax expense with respect to items excluded from the calculation of the DMT Income or Loss under Part Three\n(3) of this Law;\n(b) The amount of deferred tax expense with respect to Disallowed Accruals and Unclaimed Accruals;\n(c) The impact of a valuation adjustment or accounting recognition adjustment with respect to a deferred tax asset;\n(d) The amount of deferred tax expense arising from a re-measurement with respect to a change in the applicable domestic tax rate; and\n(e) The amount of deferred tax expense with respect to the generation and use of tax credits.\n4- A deferred tax asset recorded in a Fiscal Year at a rate lower than the Minimum Rate may be recalculated at the Minimum Rate in the same Fiscal Year, if the Entity can demonstrate that the deferred tax asset is attributable to a DMT Loss.\n5- To the extent a deferred tax liability, that is not a Recapture Exception Accrual, is taken into account under this Article, and such amount is not paid within the five subsequent Fiscal Years, the amount must be recaptured pursuant to this Article.\n6- The amount of the Recaptured Deferred Tax Liability determined for the current Fiscal Year pursuant to paragraph (7) of this Article shall be treated as a reduction to Covered Taxes in the fifth preceding Fiscal Year and the Effective Tax Rate and Domestic Top-up Tax of such Fiscal Year shall be recalculated under the rules of paragraphs (1) and (2) of ARTICLE\n(63) of this Law. 7- The Recaptured Deferred Tax Liability for the current Fiscal Year shall be the amount of the increase in a category of deferred tax liability that was included in the Total Deferred Tax Adjustment Amount in the fifth preceding Fiscal Year that has not reversed by the end of the last day of the current Fiscal Year, unless such amount relates to a Recapture Exception Accrual as set forth in ARTICLE (50) of this Law.\n8- Unclaimed Accrual means any increase in a deferred tax liability recorded in the financial accounts of a Constituent Entity for a Fiscal Year that is not expected to be paid within the time period set forth in paragraphs (5) to\n(7) of this Article and for which the Filing Constituent Entity makes an Annual Election not to include in Total Deferred Tax Adjustment Amount for such Fiscal Year.\n9- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- عندما يكون معدل الضريبة المطبق لأغراض احتساب المصاريف الضريبية المؤجلة في الحسابات المالية للكيان التابع عن سنة مالية يساوي أو يقل عن الحد الأدنى، فإن إجمالي مبلغ تسوية الضريبة المؤجلة للكيان التابع عن السنة المالية يساوي المصاريف الضريبية المؤجلة المستحقة في صافي الدخل المحاسبي أو الخسارة المحاسبية لذلك الكيان التابع – كما هو محدد بموجب المادة (الثامنة عشرة) من هذا النظام – للسنة المالية المتعلقة بالضرائب المشمولة.\n2- عندما يكون معدل الضريبة المطبق لأغراض احتساب المصاريف الضريبية المؤجلة في الحسابات المالية للكيان التابع عن سنة مالية يزيد عن الحد الأدنى، فإن إجمالي مبلغ تسوية الضريبة المؤجلة للكيان التابع عن السنة المالية يساوي المصاريف الضريبية المؤجلة المستحقة في حساباته المالية عن السنة المالية فيما يتعلق بالضرائب المشمولة المعاد احتسابها على أساس الحد الأدنى.\n3- لا يتضمن إجمالي مبلغ تسوية الضريبة المؤجلة للكيان التابع خلال سنة مالية أياً مما يلي\n(أ) مبلغ المصاريف الضريبية المؤجلة فيما يتعلق بالبنود المستبعدة من احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي بموجب الجزء الثالث من هذا النظام.\n(ب) مبلغ المصاريف الضريبية المؤجلة فيما يتعلق بالاستحقاقات غير الجائزة والاستحقاقات غير المطالب بها\n(ج) تأثير تعديل التقييم أو تعديل الاعتراف المحاسبي فيما يتعلق بأصل ضريبي مؤجل\n(د) مبلغ المصاريف الضريبية المؤجلة الناشئة عن إعادة القياس فيما يتعلق بالتغيير في معدل الضريبة المحلية المطبق.\n(هـ) مبلغ المصاريف الضريبية المؤجلة فيما يتعلق بتكوين واستخدام الائتمان الضريبي.\n4- يجوز إعادة احتساب الأصل الضريبي المؤجل المسجل في سنة مالية بمعدل أقل من الحد الأدنى باستخدام الحد الأدنى عن السنة المالية ذاتها، إذا أثبت الكيان أن الأصل الضريبي المؤجل منسوب إلى خسارة ضريبة الحد الأدنى المحلي.\n5- إلى الحد الذي يكون فيه الالتزام الضريبي المؤجل، الذي لا يشكل رد استحقاقات استثنائية، مأخوذاً في الاعتبار بموجب هذه المادة، ولم يتم سداد هذا المبلغ خلال السنوات المالية الخمس اللاحقة، يجب إعادة تحصيل المبلغ بموجب هذه المادة.\n6- يجب التعامل مع مبلغ رد الالتزام الضريبي المؤجل المحدد للسنة المالية الحالية وفقاً للفقرة (7) من هذه المادة على أنه تخفيض في الضرائب المشمولة في السنة المالية الخامسة السابقة ويتم إعادة احتساب معدل الضريبة الفعلي والضريبة التكميلية المحلية لتلك السنة المالية بموجب أحكام الفقرتين (1) و(2) من المادة (الثالثة والستين) من هذا النظام.\n7- يقصد برد الالتزام الضريبي المؤجل للسنة المالية الحالية مبلغ الزيادة في فئة الالتزام الضريبي المؤجل المدرج في إجمالي مبلغ تسوية الضريبة المؤجلة خلال السنة المالية الخامسة السابقة والذي لم يتم عكسه بحلول نهاية آخر يوم من السنة المالية الحالية، إلا إذا كان ذلك المبلغ مرتبطاً برد استحقاقات استثنائية كما هو منصوص عليه في المادة (الخمسين) من هذا النظام.\n8- يقصد بالاستحقاقات غير المطالب بها أي زيادة في التزام ضريبي مؤجل مسجل في الحسابات المالية للكيان التابع لسنة مالية، ومن غير المتوقع أن يتم سدادها خلال الفترة الزمنية المنصوص عليها في الفقرات من (5) إلى (7) من هذه المادة والتي يقوم بموجبها الكيان التابع المعين لتقديم الإقرار بالاختيار السنوي لعدم تضمينها في إجمالي مبلغ تسوية الضريبة المؤجلة لتلك السنة المالية.\n9- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":50,"part":4,"part_en":"Covered Taxes","part_ar":"الضرائب المشمولة","title_en":"Recapture Exception Accrual","title_ar":"رد الاستحقاقات الاستثنائية","page":40,"text_en":"Recapture Exception Accrual means the tax expense accrued attributable to changes in associated deferred tax liabilities, in respect of the following:\n1- Cost recovery allowances on Tangible Assets;\n2- The cost of a licence or similar arrangement from the government for the use of immovable property or exploitation of natural resources that entails significant investment in Tangible Assets;\n3- Research and development expenses;\n4- De-commissioning and remediation expenses;\n5- Fair value accounting on unrealised net gains;\n6- Foreign currency exchange net gains;\n7- Insurance reserves and insurance policy deferred acquisition costs;\n8- Gains from the sale of tangible property located in the same jurisdiction as the Constituent Entity that are reinvested in tangible property in the same jurisdiction; and\n9- Additional amounts accrued as a result of accounting principles changes with respect to categories stipulated in paragraphs (1) through (8) of this Article.","text_ar":"يقصد برد الاستحقاقات الاستثنائية المصاريف الضريبية المستحقة المنسوبة إلى التغيرات في الالتزامات الضريبية المؤجلة المرتبطة، فيما يتعلق بما يلي:\n1- مخصصات استرداد التكاليف على الأصول الملموسة.\n2- تكلفة ترخيص أو ترتيب مماثل من قبل الحكومة، لاستخدام الممتلكات غير المنقولة أو استغلال الموارد الطبيعية التي تستلزم استثمارا كبيراً في الأصول الملموسة.\n3- مصاريف البحث والتطوير.\n4- مصاريف وقف التشغيل والإجراءات الإصالحية.\n5- محاسبة صافي المكاسب غير المحققة على أساس القيمة العادلة.\n6- صافي مكاسب صرف العملات الأجنبية.\n7- احتياطيات التأمين وتكاليف شراء وثائق التأمين المؤجلة.\n8- المكاسب الناتجة عن بيع ممتلكات ملموسة واقعة في ذات الولاية القضائية التي يقع فيها الكيان التابع والتي يتم إعادة استثمارها في ممتلكات ملموسة في ذات الولاية القضائية.\n9- المبالغ الإضافية المستحقة نتيجة تغير المبادئ المحاسبية فيما يتعلق بالفئات المنصوص عليها في الفقرات من (1) إلى (8) من هذه المادة."},{"n":51,"part":4,"part_en":"Covered Taxes","part_ar":"الضرائب المشمولة","title_en":"Disallowed Accrual","title_ar":"الاستحقاقات غير الجائزة","page":41,"text_en":"Disallowed Accrual means any movement in deferred tax expense accrued in the financial accounts of a Constituent Entity which relates to:\n1- An uncertain tax position; or\n2- Distributions from a Constituent Entity.","text_ar":"يقصد بالاستحقاقات غير الجائزة أي حركة في المصاريف الضريبية المؤجلة المستحقة في الحسابات المالية للكيان التابع والتي تتعلق بأي مما يأتي:\n1- وضع ضريبي غير مؤكد.\n2- توزيعات من كيان تابع."},{"n":52,"part":4,"part_en":"Covered Taxes","part_ar":"الضرائب المشمولة","title_en":"Post-Filing Adjustments and Tax Rate Changes","title_ar":"التعديلات والتغيرات في معدل الضريبة بعد تقديم الإقرار","page":41,"text_en":"1- An adjustment to a Constituent Entity’s liability for Covered Taxes for a previous Fiscal Year recorded in the financial accounts shall be treated as an adjustment to Covered Taxes in the Fiscal Year in which the adjustment is made.\n2- Notwithstanding the provisions of paragraph\n(1) of this Article, in case the adjustment relates to a Fiscal Year in which there is a decrease in the Constituent Entity’s Adjusted Covered Taxes for a previous Fiscal Year, the Effective Tax Rate and Domestic Top-up Tax for such Fiscal Year must be recalculated as per paragraphs (1) and (2) of ARTICLE (63) of this Law.\n3- For the purposes of recalculating the Effective Tax Rate and Domestic Top-up Tax in accordance with paragraph (2) of this Article, the Adjusted Covered Taxes determined for the Fiscal Year shall be reduced by the amount of the decrease in Covered Taxes and DMT Income determined for the Fiscal Year and any intervening Fiscal Years shall be adjusted as necessary and appropriate.\n4- A Filing Constituent Entity may make an Annual Election to treat an immaterial decrease in Covered Taxes as an adjustment to Covered Taxes in the Fiscal Year in which the adjustment is made.\n5- For the purposes of this Article, an immaterial decrease in Covered Taxes shall be an aggregate decrease of less than, in Saudi Riyals, the equivalent of one (1) million euros in the Adjusted Covered Taxes determined for the Kingdom for a Fiscal Year.\n6- Where in a Fiscal Year the applicable domestic tax rate is reduced below the Minimum Rate, and such reduction results in a deferred tax expense in the financial accounts of a Constituent Entity for a Fiscal Year, the amount of deferred tax expense shall be treated as an adjustment to a Constituent Entity’s liability for Covered Taxes claimed under articles from ARTICLE (44) to ARTICLE\n(47) of this Law for a previous Fiscal Year.\n7- When paid, the amount of deferred tax expense that has resulted from an increase to the applicable domestic tax rate shall be treated as an adjustment under paragraphs\n(1) to (5) of this Article to a Constituent Entity’s liability for Covered Taxes claimed under articles from ARTICLE (44) to ARTICLE\n(47) of this Law for a previous Fiscal Year when such amount was originally recorded at a rate less than the Minimum Rate. This adjustment shall be limited to an amount that is equal to an increase of deferred tax expense up to such deferred tax expense recalculated at the Minimum Rate.\n8- If more than, in Saudi Riyals, the equivalent of one (1) million euros of the amount accrued by a Constituent Entity as current tax expense and included in Adjusted Covered Taxes for a Fiscal Year is not paid within three years of the last day of such year, the Effective Tax Rate and Domestic Top-up Tax for the Fiscal Year in which the unpaid amount was claimed as a Covered Tax must be recalculated in accordance with paragraphs (1) and (2) of ARTICLE (63) of this Law by excluding such unpaid amount from Adjusted Covered Taxes. and Top-up Tax","text_ar":"1- يجب معاملة التعديل المسجل في الحسابات المالية للكيان الت ابع والمتعلق بالتزامه بالضرائب المشمولة عن سنة مالية سابقة، كتعديل على الضرائب المشمولة في السنة المالية التي تم فيها التعديل.\n2- استثناءً من أحكام الفقرة (1) من هذه المادة، إذا كان التعديل يرتبط بسنة مالية يوجد فيها انخفاض في الضرائب المشمولة المعدلة للكيان الت ابع عن سنة مالية سابقة، يجب إعادة احتساب معدل الضريبة الفعلي والضريبة التكميلية المحلية لتلك السنة المالية وفقا للفقرتين (1) و(2) من المادة (الثالثة والستين) من هذا النظام.\n3- لأغراض إعادة احتساب معدل الضريبة الفعلي والضريبة التكميلية المحلية بموجب الفقرة (2) من هذه المادة، يجب تخفيض الضرائب المشمولة المعدلة المحددة للسنة المالية بمبلغ الانخفاض في الضرائب المشمولة، كما يجب تعديل دخل ضريبة الحد الأدنى المحلي المحدد للسنة المالية وأي سنوات مالية مع نية حسب الضرورة وبصورة مناسبة.\n4- للكيان التابع المعين لتقديم الإقرار إجراء اختيار سنوي لمعاملة الانخفاض غير الجوهري في الضرائب المشمولة كتعديل على الضرائب المشمولة في السنة المالية التي يتم فيها التعديل.\n5- لأغراض هذه المادة، فإن الانخفاض غير الجوهري في الضرائب المشمولة هو انخفاض إجمالي يقل عن، بالريال السعودي، ما يوازي مليون يورو في الضرائب المشمولة المعدلة المحددة للمملكة عن سنة مالية.\n6- عندما يتم في سنة مالية تخفيض معدل الضريبة المحلي المطبق إلى أقل من الحد الأدنى، ويؤدي هذا التخفيض إلى مصاريف ضريبية مؤجلة في الحسابات المالية للكيان التابع في السنة المالية، يعامل مبلغ المصاريف الضريبية المؤجلة على أنه تعديل في التزام الكيان التابع بالضرائب المشمولة المطالب بها عن سنة مالية سابقة بموجب المواد من المادة (الرابعة والأربعين) إلى المادة (السابعة والأربعين) من هذا النظام.\n7- يعامل مبلغ المصاريف الضريبية المؤجلة، عند سداده، والناتج عن زيادة معدل الضريبة المحلي المطبق، كتعديل بموجب الفقرات (1) إلى (5) من هذه المادة على التزام الكيان التابع بالضرائب المشمولة المطالب بها بموجب المواد من المادة (الرابعة والأربعين) إلى المادة (السابعة والأربعين) من هذا النظام عن سنة مالية سابقة، وذلك في حال تم تسجيل هذا المبلغ في الأصل بمعدل أقل من الحد الأدنى. يقتصر هذا التعديل على مبلغ يساوي زيادة المصاريف الضريبية المؤجلة بما لا يتجاوز المصاريف الضريبية المؤجلة المعاد احتسابها وفقاً للحد الأدنى.\n8- إذا لم يتم سداد أكثر من، بالريال السعودي، ما يوازي مليون (1,000,000) يورو من المبلغ المستحق من قبل الكيان التابع كمصاريف ضريبية حالية مدرجة في الضرائب المشمولة المعدلة لسنة مالية في غضون ثلاث سنوات من اليوم الأخير من تلك السنة، يجب إعادة احتساب معدل الضريبة الفعلي والضريبة التكميلية المحلية للسنة المالية التي تمت فيها المطالبة بالمبلغ غير المسدد كضريبة مشمولة بموجب الفقرتين (1) و (2) من المادة (الثالثة والستين) من هذا النظام، من خلال استثناء المبلغ غير المسدد ذاته من الضرائب المشمولة المعدلة."},{"n":53,"part":5,"part_en":"Computation of Effective Tax Rate","part_ar":"احتساب معدل الضريبة الفعلي والضريبة التكميلية","title_en":"Determination of the Effective Tax Rate","title_ar":"تحديد معدل الضريبة الفعلي","page":42,"text_en":"1- The Effective Tax Rate of the MNE Group shall be calculated for every Fiscal Year with regards to its Net DMT Income for the Kingdom.\n2- The Effective Tax Rate of the MNE Group for a Fiscal Year shall be calculated for the Kingdom by dividing the sum of the Adjusted Covered Taxes of all Constituent Entities located in the Kingdom by the Net DMT Income of the Kingdom for the Fiscal Year.\n3- For the purposes of this Part, each Stateless Constituent Entity shall be treated as a single Constituent Entity located in a separate jurisdiction.\n4- The Net DMT Income of the Kingdom for a Fiscal Year shall be the positive amount, if any, calculated by deducting the DMT Losses of all Constituent Entities located in the Kingdom from the DMT Income of all Constituent Entities located in the Kingdom.\n5- The Adjusted Covered Taxes and the DMT Income or Loss of Constituent Entities that are Investment Entities or Insurance Investment Entities shall be excluded from the determination of the Effective Tax Rate under paragraphs (1) and (2) of this Article and Net DMT Income under paragraph (4) of this Article.","text_ar":"1- يُحتسب معدل الضريبة الفعلي للمجموعة المتعددة الجنسيات عن كل سنة مالية بالنسبة لصافي دخل ضريبة الحد الأدنى المحلي العائد لها في المملكة.\n2- يتم احتساب معدل الضريبة الفعلي للمجموعة المتعددة الجنسيات لسنة مالية في المملكة من خلال قسمة إجمالي الضرائب المشمولة المعدلة لكل الكيانات التابعة الواقعة في المملكة على صافي دخل ضريبة الحد الأدنى المحلي في المملكة للسنة المالية.\n3- لأغراض هذا الجزء، يجب معاملة كل كيان تابع عديم الجنسية على أنه كيان تابع واحد يقع في ولاية قضائية منفصلة.\n4- يُقصد بصافي دخل ضريبة الحد الأدنى المحلي في المملكة لسنة مالية المبلغ الإيجابي، إن وجد، والذي يتم احتسابه عن طريق خصم خسائر ضريبة الحد الأدنى المحلي لجميع الكيانات التابعة الواقعة في المملكة من دخل ضريبة الحد الأدنى المحلي لجميع الكيانات التابعة الواقعة في المملكة.\n5- يتم استبعاد الضرائب المشمولة المعدلة ودخل أو خسارة ضريبة الحد الأدنى المحلي للكيانات التابعة التي تعتبر كيانات استثمارية أو كيانات تأمين استثمارية من تحديد معدل الضريبة الفعلي بموجب الفقرتين (1) و (2) من هذه المادة وصافي دخل ضريبة الحد الأدنى المحلي بموجب الفقرة (4) من هذه المادة."},{"n":54,"part":5,"part_en":"Computation of Effective Tax Rate","part_ar":"احتساب معدل الضريبة الفعلي والضريبة التكميلية","title_en":"Top-Up Tax Percentage","title_ar":"نسبة الضريبة التكميلية","page":43,"text_en":"The Top-up Tax Percentage for the Kingdom for a Fiscal Year shall be the positive percentage point difference, if any, calculated by deducting the Effective Tax Rate for the Kingdom for the Fiscal Year from the Minimum Rate.","text_ar":"تكون نسبة الضريبة التكميلية للمملكة عن سنة مالية، فرق النسبة المئوية الإيجابي، إن وجد، الناتج عن خصم معدل الضريبة الفعلي للمملكة للسنة المالية من الحد الأدنى."},{"n":55,"part":5,"part_en":"Computation of Effective Tax Rate","part_ar":"احتساب معدل الضريبة الفعلي والضريبة التكميلية","title_en":"Excess Profit","title_ar":"الربح الزائد","page":43,"text_en":"1- Excess Profit for the Kingdom for a Fiscal Year shall be the positive amount, if any, calculated by deducting the Substance-based Income Exclusion of all Constituent Entities located in the Kingdom for the Fiscal Year from the Net DMT Income of all Constituent Entities located in the Kingdom for the Fiscal Year.\n2- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يكون الربح الزائد للمملكة عن سنة مالية هو المبلغ الإيجابي، إن وجد، المحسوب من خلال خصم الاستبعاد على أساس جوهر النشاط لجميع الكيانات التابعة الواقعة في المملكة للسنة المالية، من صافي دخل ضريبة الحد الأدنى المحلي لجميع الكيانات التابعة الواقعة في المملكة للسنة المالية.\n2- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":56,"part":5,"part_en":"Computation of Effective Tax Rate","part_ar":"احتساب معدل الضريبة الفعلي والضريبة التكميلية","title_en":"Domestic Top-Up Tax","title_ar":"الضريبة التكميلية المحلية","page":43,"text_en":"Domestic Top-up Tax for the Kingdom for a Fiscal Year shall be equal to the positive amount, if any, calculated by:\n1- Multiplying the Top-up Tax Percentage calculated for the Kingdom for the Fiscal Year by the Excess Profit calculated for the Kingdom for the Fiscal Year; and\n2- Adding the Additional Current Top-up Tax calculated for the Kingdom as per ARTICLE\n(63) of this Law for the Fiscal Year to the product resulting from the calculation stipulated in paragraph (1) of this paragraph.","text_ar":"تساوي الضريبة التكميلية المحلية للمملكة لسنة مالية المبلغ الإيجابي، إن وجد، محسوباً من خلال الآتي:\n1- ضرب نسبة الضريبة التكميلية المحتسبة للمملكة للسنة المالية في الربح الزائد المحتسب للمملكة للسنة المالية.\n2- إضافة الضريبة التكميلية الحالية الإضافية المحتسبة للمملكة وفقاً لأحكام المادة (الثالثة والستين) من هذا النظام للسنة المالية إلى النتيجة الناجمة عن الاحتساب المنصوص عليه في الفقرة (1) من هذه المادة."},{"n":57,"part":5,"part_en":"Computation of Effective Tax Rate","part_ar":"احتساب معدل الضريبة الفعلي والضريبة التكميلية","title_en":"Domestic Top-Up Tax of a Constituent Entity","title_ar":"الضريبة التكميلية المحلية لكيان تابع","page":43,"text_en":"1- Except for the provisions of paragraphs (3) and (4) of ARTICLE (63) of this Law, the Domestic Top-up Tax of a Constituent Entity shall be calculated for each Constituent Entity located in the Kingdom where it has DMT Income determined in accordance with the provisions of Part Three (3) of this Law for the Fiscal Year included in the calculation of the Net DMT Income for the Kingdom in accordance with the following:\n(a) Multiplying the Domestic Top-up Tax calculated for the Kingdom for the Fiscal Year by the DMT Income of the Constituent Entity for the Fiscal Year; and\n(b) Dividing the product resulting from the calculation described in sub-paragraph (a) of this paragraph by the aggregate DMT Income of all Constituent Entities located in the Kingdom for the Fiscal Year.\n2- If the Domestic Top-up Tax is attributable to a recalculation under paragraphs (1) and (2) of ARTICLE (63) of this Law and the Net DMT Income for the current Fiscal Year in the Kingdom is nil, the Domestic Top-up Tax shall be allocated using the calculation described in paragraph (1) of this Article based on the DMT Income of the Constituent Entities in the Fiscal Years for which the recalculations under paragraph (1) of ARTICLE (63) of this Law were performed.","text_ar":"1- باستثناء ما نصت عليه الفقرتان (3) و(4) من المادة (الثالثة والستين) من هذا النظام، تُحتسب الضريبة التكميلية المحلية لكيان تابع بالنسبة لكل كيان تابع واقع في المملكة، حيث لديه دخل ضريبة حد أدنى محلي للسنة المالية محدد بموجب أحكام الجزء الثالث من هذا النظام ومدرج في احتساب صافي دخل ضريبة الحد الأدنى المحلي للم ملكة، وذلك تبعاً للآتي:\n(أ) ضرب الضريبة التكميلية المحلية المحتسبة للمملكة للسنة المالية في دخل ضريبة الحد الأدنى المحلي للكيان التابع للسنة المالية.\n(ب) قسمة النتيجة الناجمة عن الاحتساب المنصوص عليه في الفقرة الفرعية\n(أ) من هذه الفقرة على دخل ضريبة الحد الأدنى المحلي المجمع لجميع الكيانات التابعة الواقعة في المملكة للسنة المالية.\n2- في حال كانت الضريبة التكميلية المحلية منسوبة إلى إعادة احتساب بموجب الفقرتين (1) و (2) من المادة (الثالثة والستين) من هذا النظام وكان صافي دخل ضريبة الحد الأدنى المحلي عن السنة المالية الحالية في المملكة يساوي صفرا، يتم تخصيص الضريبة التكميلية المحلية باستخدام الاحتساب المنصوص عليه في الفقرة (1) من هذه المادة بناء على دخل ضريبة الحد الأدنى المحلي للكيانات التابعة في السنوات المالية التي حدثت فيها عمليات إعادة الاحتساب بموجب الفقرة (1) من المادة (الثالثة والستين) من هذا النظام."},{"n":58,"part":5,"part_en":"Computation of Effective Tax Rate","part_ar":"احتساب معدل الضريبة الفعلي والضريبة التكميلية","title_en":"Substance-Based Income Exclusion","title_ar":"الاستبعاد على أساس جوهر النشاط","page":44,"text_en":"1- The Substance-based Income Exclusion amount for a jurisdiction shall be the sum of the Payroll Carve-out and the Tangible Asset Carve-out for each Constituent Entity located in the jurisdiction, except for Constituent Entities that are Investment Entities or Insurance Investment Entities.\n2- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- إن مبلغ الاستبعاد على أساس جوهر النشاط لولاية قضائية هو مجموع الرواتب المستبعدة والأصول الملموسة المستبعدة لكل كيان تابع واقع في الولاية القضائية، باستثناء الكيانات التابعة التي تعد كيانات استثمارية أو كيانات تأمين استثمارية.\n2- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":59,"part":5,"part_en":"Computation of Effective Tax Rate","part_ar":"احتساب معدل الضريبة الفعلي والضريبة التكميلية","title_en":"Payroll Carve-Out","title_ar":"الرواتب المستبعدة","page":44,"text_en":"1- The Payroll Carve-out for a Constituent Entity located in a jurisdiction shall be equal to five percent (5%) of its Eligible Payroll Costs for the Fiscal Year of Eligible Employees that perform activities for the MNE Group in such jurisdiction, except Eligible Payroll Costs that are:\n(a) Capitalised and included in the carrying value of Eligible Tangible Assets;\n(b) Attributable to a Constituent Entity’s International Shipping Income and Qualified Ancillary International Shipping Income under paragraphs (6), (7) and (8) of ARTICLE (39) of this Law that is excluded from the calculation of the DMT Income or Loss for the Fiscal Year.\n2- For the purposes of this Article, Eligible Payroll Costs include employee compensation expenditures (including salaries, wages, and other expenditures that provide a direct and separate personal benefit to the employee, such as health insurance and pension contributions), payroll and employment taxes, and employer social security contributions.\n3- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- تساوي الرواتب المستبعدة لكيان تابع واقع في ولاية قضائية خمسة بالمائة (%5) من تكاليف الرواتب المؤهلة التابعة له للسنة المالية بالنسبة للموظفين المؤهلين الذين يزاولون أنشطة لصالح المجموعة المتعددة الجنسيات في هذه الولاية القضائية، باستثناء تكاليف الرواتب المؤهلة التي تكون:\n(أ) مرسملة ومدرجة في القيمة الدفترية للأصول الملموسة المؤهلة.\n(ب) منسوبة إلى الدخل الناتج عن الشحن الدولي ودخل الشحن الدولي المساند المؤهل لكيان تابع بموجب الفقرات من (6) إلى (8) من المادة (التاسعة والثلاثين) من هذا النظام، التي تكون مستبعدة من احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي للسنة المالية.\n2- لأغراض هذه المادة، تشمل تكاليف الرواتب المؤهلة نفقات تعويضات الموظفين (بما في ذلك الرواتب والأجور والنفقات الأخرى التي توفر منفعة شخصية مباشرة ومنفصلة للموظف، مثل التأمين الصحي والمساهمات التقاعدية)، وضرائب الرواتب والتوظيف، ومساهمات الضمان الاجتماعي لصاحب العمل.\n3- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":60,"part":5,"part_en":"Computation of Effective Tax Rate","part_ar":"احتساب معدل الضريبة الفعلي والضريبة التكميلية","title_en":"Tangible Asset Carve-Out","title_ar":"الأصول الملموسة المستبعدة","page":45,"text_en":"1- The Tangible Asset Carve-out for a Constituent Entity located in a jurisdiction shall be equal to five percent (5%) of the carrying value of Eligible Tangible Assets located in such jurisdiction for the Fiscal Year.\n2- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- تساوي الأصول الملموسة المستبعدة لكيان تابع واقع في ولاية قضائية خمسة بالمائة (%5) من القيمة الدفترية للأصول الملموسة المؤهلة الواقعة في تلك الولاية القضائية للسنة المالية.\n2- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":61,"part":5,"part_en":"Computation of Effe
