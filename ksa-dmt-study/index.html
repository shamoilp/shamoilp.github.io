rented MNE group. Their Saudi entities compute the domestic top-up tax together, and the UPEs file one GloBE information return unless they appoint a designated filing entity.","تُعامل المجموعتان أو أكثر اللتان يشكل كياناهما الأم هيكلاً متلازماً أو ترتيب إدراج مزدوج، مع كيان أو منشأة دائمة واحدة على الأقل في ولاية أخرى، كمجموعة واحدة متعددة الكيانات الأم. وتحتسب كياناتها في المملكة الضريبة التكميلية المحلية معاً، ويقدم الكيانات الأم إقراراً واحداً لمعلومات القواعد العالمية ما لم يعيّنوا كياناً مقدماً للإقرار."],"r":[80,81,82,83]}],"oecd":[{"t":["Articles 74 to 83 follow GloBE Chapter 6 (Articles 6.1 to 6.5). Article 73 is the Kingdom's own collection rule: GloBE has no joint liability across group members or partners, so it comes from domestic law design.","تتبع المواد من 74 إلى 83 الفصل السادس من القواعد النموذجية (المواد من 6.1 إلى 6.5). أما المادة 73 فقاعدة تحصيل خاصة بالمملكة: فلا تتضمن القواعد العالمية مسؤولية تضامنية بين أعضاء المجموعة أو الشركاء، فهي من تصميم النظام المحلي."],"src":["Model Rules Arts 6.1–6.5","القواعد النموذجية: المواد 6.1–6.5"]},{"t":["KSA angle: joint liability reaches every Saudi member, including Zakat-only entities that carry no allocated top-up. Factor it into acquisitions, disposals and minority investments: indemnities and the Article 73(5) limitation request are the tools.","من منظور المملكة: تمتد المسؤولية التضامنية إلى كل عضو في المملكة، بما في ذلك الكيانات الخاضعة للزكاة وحدها التي لم تُخصص لها ضريبة تكميلية. فراعها في عمليات الاقتناء والبيع والاستثمارات الأقلية: وأدواتها التعويضات التعاقدية وطلب القصر بموجب المادة 73 (5)."],"src":["Draft Art 73","المشروع م 73"]}],"reflect":{"ref":["Al-Ma'idah 5:2","المائدة: 2"],"ayah":"وتعاونوا على البر والتقوى ولا تعاونوا على الإثم والعدوان","t":["Cooperate in goodness and piety, not in sin and aggression. Joint liability binds group members together. When you structure a deal or a joint venture, make the shared obligation something each party can stand behind, with clear terms rather than hidden exposure.","تعاونوا على البر والتقوى ولا تعاونوا على الإثم والعدوان. والمسؤولية التضامنية تربط أعضاء المجموعة معاً. فإذا هيكلت صفقة أو مشروعاً مشتركاً فاجعل الالتزام المشترك أمراً يستطيع كل طرف الوقوف خلفه، بشروط واضحة لا بمخاطر خفية."]},"cases":[{"t":["A merger that brings a group into scope","اندماج يُدخل مجموعة في النطاق"],"facts":["Group A and Group B merged in 2026; the combined group's FY2026 revenue was €900m. Before the merger:\n• Group A revenue: 2023 €400m, 2024 €420m, 2025 €450m\n• Group B revenue: 2023 €380m, 2024 €360m, 2025 €310m\nIs the combined group in scope for FY2027?","اندمجت المجموعتان (أ) و(ب) في 2026م، وبلغت إيرادات المجموعة المندمجة لعام 2026م 900 مليون يورو. وقبل الاندماج:\n• إيرادات (أ): 2023م 400 مليون، و2024م 420 مليوناً، و2025م 450 مليون يورو\n• إيرادات (ب): 2023م 380 مليوناً، و2024م 360 مليوناً، و2025م 310 ملايين يورو\nهل تخضع المجموعة المندمجة للنظام في 2027م؟"],"steps":[{"t":["2023 combined revenue:","مجموع إيرادات 2023م:"],"x":"400000000+380000000","v":780000000,"u":"EUR"},{"t":["2024 combined revenue:","مجموع إيرادات 2024م:"],"x":"420000000+360000000","v":780000000,"u":"EUR"},{"t":["2025 combined revenue:","مجموع إيرادات 2025م:"],"x":"450000000+310000000","v":760000000,"u":"EUR"},{"t":["2026 (post-merger) consolidated revenue is €900m. All four preceding years reach €750m.","إيرادات 2026م الموحدة (بعد الاندماج) 900 مليون يورو. فالسنوات الأربع السابقة كلها تبلغ 750 مليوناً."]}],"ans":["The combined group is in scope for FY2027. Without Article 74(1)(a) only FY2026 would count, one year out of four, and the group would be outside the law.","تخضع المجموعة المندمجة للنظام في 2027م. ولولا المادة 74 (1) (أ) لما احتُسبت إلا سنة 2026م، أي سنة واحدة من أربع، ولكانت المجموعة خارج النظام."],"r":["74(1)","74(2)",2]},{"t":["A Saudi company bought mid-year","شركة في المملكة اشتُريت في منتصف السنة"],"facts":["A group (calendar year) buys a Saudi company on 1 July 2027 and consolidates it line by line from that date. For FY2027 the target has accounting profit of SAR 40m (SAR 20m in each half), eligible payroll of SAR 30m (SAR 15m in the second half) and eligible tangible assets with a carrying value of SAR 200m.","تشتري مجموعة (سنتها تقويمية) شركة في المملكة في 1 يوليو 2027م وتوحّدها بنداً بنداً من ذلك التاريخ. وللسنة المالية 2027م بلغ ربح المستهدف المحاسبي 40 مليون ريال (20 مليوناً في كل نصف)، والرواتب المؤهلة 30 مليون ريال (15 مليوناً في النصف الثاني)، والقيمة الدفترية للأصول الملموسة المؤهلة 200 مليون ريال."],"steps":[{"t":["The target is a member for FY2027, but only the consolidated second-half profit of SAR 20m counts.","المستهدف عضو في 2027م، لكن لا يُحتسب إلا ربح النصف الثاني الموحد البالغ 20 مليون ريال."],"v":20000000,"u":"SAR"},{"t":["Tangible assets prorated for six months in the group:","الأصول الملموسة تناسبياً لستة أشهر في المجموعة:"],"x":"200000000*6/12","v":100000000,"u":"SAR"},{"t":["Payroll carve-out on consolidated payroll (9.2%):","استبعاد الرواتب على الرواتب الموحدة (9.2%):"],"x":"15000000*9.2/100","v":1380000,"u":"SAR"},{"t":["Asset carve-out (7.2%):","استبعاد الأصول (7.2%):"],"x":"100000000*7.2/100","v":7200000,"u":"SAR"},{"t":["Target's SBIE for FY2027:","استبعاد المستهدف لعام 2027م:"],"x":"1380000+7200000","v":8580000,"u":"SAR"}],"ans":["FY2027 brings in SAR 20m of income and SAR 8.58m of SBIE from the target. Its assets stay at historical carrying values, so purchase price step-ups do not flow into DMT income.","تُدخل سنة 2027م من المستهدف دخلاً قدره 20 مليون ريال واستبعاداً قدره 8.58 ملايين ريال. وتبقى أصوله بقيمها الدفترية التاريخية، فلا تدخل زيادات توزيع سعر الشراء في الدخل."],"r":["75(1)","104(1)","104(2)"]},{"t":["A 50:50 Saudi joint venture","مشروع مشترك مناصفة في المملكة"],"facts":["A foreign group holds 50% of a Saudi petrochemical JV, equity-accounted in its consolidated statements. The JV owns 100% of a Saudi logistics subsidiary. FY2027:\n• JV: DMT income SAR 120m, covered taxes SAR 12m\n• Subsidiary: DMT income SAR 30m, covered taxes SAR 3m\n• SBIE of the two: SAR 20m","تملك مجموعة أجنبية 50% من مشروع بتروكيماويات مشترك في المملكة، محاسب بطريقة حقوق الملكية في قوائمها الموحدة. ويملك المشروع 100% من شركة لوجستية تابعة في المملكة. السنة المالية 2027م:\n• المشروع المشترك: الدخل 120 مليون ريال، والضرائب المشمولة 12 مليون ريال\n• التابعة: الدخل 30 مليون ريال، والضرائب المشمولة 3 ملايين ريال\n• استبعادهما: 20 مليون ريال"],"steps":[{"t":["The JV group is computed as a separate group with the JV as UPE. Its net DMT income:","تُحتسب مجموعة المشروع المشترك كمجموعة مستقلة يكون المشروع كيانها الأم النهائي. صافي دخلها:"],"x":"120000000+30000000","v":150000000,"u":"SAR"},{"t":["JV group ETR:","المعدل الفعلي لمجموعة المشروع:"],"x":"(12000000+3000000)/150000000*100","v":10,"u":"%"},{"t":["Top-up percentage:","نسبة الضريبة التكميلية:"],"x":"15-10","v":5,"u":"%"},{"t":["Domestic top-up tax for the JV group:","الضريبة التكميلية المحلية لمجموعة المشروع:"],"x":"5/100*(150000000-20000000)","v":6500000,"u":"SAR"}],"ans":["The JV group owes SAR 6.5m, for which the JV and its subsidiary are jointly liable, even though the foreign group only equity-accounts its 50%. The rest of the group's Saudi ETR is computed without the JV.","على مجموعة المشروع المشترك 6.5 ملايين ريال، يتضامن فيها المشروع وتابعته في المسؤولية، رغم أن المجموعة الأجنبية تحاسب حصتها البالغة 50% بطريقة حقوق الملكية فقط. ويُحتسب معدل بقية المجموعة في المملكة دون المشروع المشترك."],"r":[78,79,"73(3)"]}],"quiz":[{"q":["Who is liable for the domestic top-up tax?","من المسؤول عن الضريبة التكميلية المحلية؟"],"o":[["Only the UPE","الكيان الأم النهائي فقط"],["Each taxpayer, and the Saudi members of the group jointly","كل مكلف، وأعضاء المجموعة في المملكة بالتضامن"],["Only the largest Saudi entity","أكبر كيان في المملكة فقط"],["Only entities with allocated top-up","الكيانات التي خُصصت لها الضريبة فقط"]],"a":1,"e":["Article 73(1)–(2).","المادة 73 (1)–(2)."],"r":["73(1)","73(2)"]},{"q":["Can joint liability be limited?","هل يمكن قصر المسؤولية التضامنية؟"],"o":[["No","لا"],["Yes, to one or more group entities with ZATCA's approval","نعم، على كيان أو أكثر من كيانات المجموعة بموافقة الهيئة"],["Yes, by board resolution alone","نعم، بقرار مجلس الإدارة وحده"],["Only for Zakat payers","لدافعي الزكاة فقط"]],"a":1,"e":["Article 73(5).","المادة 73 (5)."],"r":["73(5)"]},{"q":["Which partner in a Saudi partnership within an MNE group is NOT jointly and severally liable?","أي شريك في شراكة في المملكة ضمن مجموعة متعددة الجنسيات لا يكون متضامناً ومتكافلاً في المسؤولية؟"],"o":[["A general partner","الشريك المتضامن"],["A limited partner who is not a general partner","الشريك الموصي الذي ليس شريكاً متضامناً"],["The managing partner","الشريك المدير"],["A Saudi partner","الشريك السعودي"]],"a":1,"e":["Article 73(4).","المادة 73 (4)."],"r":["73(4)"]},{"q":["Two groups merged in 2026. How is the €750m test applied to 2024?","اندمجت مجموعتان في 2026م. كيف يُطبق اختبار 750 مليون يورو على 2024م؟"],"o":[["2024 is ignored","تُتجاهل 2024م"],["It is met if the two groups' combined 2024 revenue is €750m or more","يتحقق إذا بلغ مجموع إيرادات المجموعتين لعام 2024م 750 مليون يورو أو أكثر"],["Only the larger group's revenue counts","تُحتسب إيرادات المجموعة الأكبر فقط"],["It is automatically met","يتحقق تلقائياً"]],"a":1,"e":["Article 74(1)(a).","المادة 74 (1) (أ)."],"r":["74(1)"]},{"q":["After a demerger, how does a demerged group meet the threshold in years two to four?","بعد الانفصال، كيف تستوفي المجموعة المنفصلة الحد في السنوات من الثانية إلى الرابعة؟"],"o":[["€750m in every year","750 مليون يورو في كل سنة"],["€750m in at least two of the years after the demerger","750 مليون يورو في سنتين على الأقل من السنوات التالية للانفصال"],["It inherits the old group's status","ترث وضع المجموعة السابقة"],["€375m a year","375 مليون يورو سنوياً"]],"a":1,"e":["Article 74(1)(c)(2).","المادة 74 (1) (ج) (2)."],"r":["74(1)"]},{"q":["A Saudi company is bought on 1 October. Is it a group member for that fiscal year?","اشتُريت شركة في المملكة في 1 أكتوبر. هل هي عضو في المجموعة عن تلك السنة المالية؟"],"o":[["No, only from next year","لا، من السنة التالية فقط"],["Yes, if any of its results are consolidated line by line that year","نعم، إذا وُحّد أي جزء من نتائجها بنداً بنداً في تلك السنة"],["Only if held for 6 months","فقط إذا احتُفظ بها 6 أشهر"],["Only with ZATCA approval","فقط بموافقة الهيئة"]],"a":1,"e":["Article 75(1)(a).","المادة 75 (1) (أ)."],"r":["75(1)"]},{"q":["After an acquisition, which values does the target use for its assets and liabilities?","بعد الاقتناء، أي قيم يستخدمها المستهدف لأصوله والتزاماته؟"],"o":[["Fair values from the purchase price allocation","القيم العادلة من توزيع سعر الشراء"],["Its historical carrying values","قيمه الدفترية التاريخية"],["Tax values","القيم الضريبية"],["Zero","صفر"]],"a":1,"e":["Article 75(1)(c).","المادة 75 (1) (ج)."],"r":["75(1)"]},{"q":["When is a share deal treated as an asset deal?","متى تُعامل صفقة الأسهم كصفقة أصول؟"],"o":[["Always","دائماً"],["When the target's jurisdiction treats it like an asset deal and taxes the seller on the gain against the tax basis","عندما تعاملها ولاية المستهدف كصفقة أصول وتفرض ضريبة على البائع على المكسب مقارنة بالأساس الضريبي"],["When the price exceeds book value","عندما يتجاوز السعر القيمة الدفترية"],["Never","أبداً"]],"a":1,"e":["Article 75(2).","المادة 75 (2)."],"r":["75(2)"]},{"q":["Which is a condition of a DMT reorganisation?","أي مما يلي شرط لإعادة التنظيم لأغراض النظام؟"],"o":[["Cash consideration","مقابل نقدي"],["The buyer must compute taxable income using the seller's tax basis","أن يحتسب المشتري دخله الخاضع للضريبة باستخدام الأساس الضريبي للبائع"],["The seller is fully taxed on the gain","خضوع البائع للضريبة كاملة على المكسب"],["ZATCA approval","موافقة الهيئة"]],"a":1,"e":["Article 77(1)(c); the consideration must be mainly equity and the seller's gain untaxed in whole or part.","المادة 77 (1) (ج)؛ ويجب أن يكون المقابل في معظمه حقوق ملكية وأن يكون مكسب البائع غير خاضع للضريبة كلياً أو جزئياً."],"r":["77"]},{"q":["What is a joint venture for this law?","ما المشروع المشترك لأغراض هذا النظام؟"],"o":[["Any 50:50 company","أي شركة مناصفة"],["An entity reported under the equity method in which the UPE holds at least 50%, subject to exceptions","كيان يُعرض بطريقة حقوق الملكية ويملك فيه الكيان الأم النهائي 50% على الأقل، مع استثناءات"],["Any associate","أي شركة زميلة"],["Any partnership","أي شراكة"]],"a":1,"e":["Article 79.","المادة 79."],"r":[79]},{"q":["How is a Saudi joint venture's top-up tax computed?","كيف تُحتسب الضريبة التكميلية لمشروع مشترك في المملكة؟"],"o":[["Blended with the group's other Saudi entities","ممزوجة مع كيانات المجموعة الأخرى في المملكة"],["As if the JV and its subsidiaries were a separate MNE group with the JV as UPE","كأن المشروع وكياناته التابعة مجموعة مستقلة يكون المشروع كيانها الأم النهائي"],["It is exempt","معفاة"],["At the partners' level","على مستوى الشركاء"]],"a":1,"e":["Article 78(2).","المادة 78 (2)."],"r":["78"]},{"q":["What makes two groups a multi-parented MNE group?","ما الذي يجعل مجموعتين مجموعة متعددة الكيانات الأم؟"],"o":[["Common directors","أعضاء مجلس مشتركون"],["Their UPEs form a stapled structure or dual-listed arrangement, and at least one entity or PE is in a different jurisdiction","أن يشكل كياناهما الأم هيكلاً متلازماً أو ترتيب إدراج مزدوج، مع كيان أو منشأة دائمة واحدة على الأقل في ولاية مختلفة"],["Shared auditors","مراجعون مشتركون"],["Trading with each other","تعامل تجاري بينهما"]],"a":1,"e":["Article 81, with Articles 82 and 83 defining the two arrangements.","المادة 81، مع تعريف الترتيبين في المادتين 82 و83."],"r":[81,82,83]}],"cards":[{"f":["Taxpayer liability","مسؤولية المكلف"],"b":["Each taxpayer is liable for its own domestic top-up tax and related amounts.","كل مكلف مسؤول عن ضريبته التكميلية المحلية والمبالغ المرتبطة بها."],"r":["73(1)"]},{"f":["Group joint liability","المسؤولية التضامنية للمجموعة"],"b":["Saudi taxpayers in the same MNE group are jointly liable for the years they are members.","المكلفون في المملكة في المجموعة نفسها متضامنون عن السنوات التي يكونون فيها أعضاء."],"r":["73(2)"]},{"f":["JV group liability","مسؤولية مجموعة المشروع المشترك"],"b":["Each Saudi JV and JV subsidiary is jointly liable for the JV group's top-up.","كل مشروع مشترك وكيان تابع له في المملكة متضامن عن ضريبة مجموعة المشروع."],"r":["73(3)"]},{"f":["Partners' liability","مسؤولية الشركاء"],"b":["Partners jointly and severally liable, except limited partners who are not general partners.","الشركاء متضامنون ومتكافلون، عدا الشريك الموصي الذي ليس شريكاً متضامناً."],"r":["73(4)"]},{"f":["Limiting joint liability","قصر المسؤولية التضامنية"],"b":["To one or more entities, with ZATCA's approval.","على كيان أو أكثر، بموافقة الهيئة."],"r":["73(5)"]},{"f":["Merger and the €750m test","الاندماج واختبار 750 مليون يورو"],"b":["Pre-merger years: combined revenue of the merging groups (or entity and group).","سنوات ما قبل الاندماج: مجموع إيرادات المجموعات المندمجة (أو الكيان والمجموعة)."],"r":["74(1)"]},{"f":["Demerger and the €750m test","الانفصال واختبار 750 مليون يورو"],"b":["Year 1 after: €750m that year; years 2–4: €750m in at least two post-demerger years.","السنة الأولى بعده: 750 مليوناً فيها؛ والسنوات 2–4: 750 مليوناً في سنتين على الأقل بعد الانفصال."],"r":["74(1)"]},{"f":["Joining or leaving mid-year","الانضمام أو الخروج في منتصف السنة"],"b":["Member if any part consolidated; consolidated results only; assets prorated; historical carrying values.","عضو إذا وُحّد أي جزء؛ النتائج الموحدة فقط؛ الأصول تناسبياً؛ القيم الدفترية التاريخية."],"r":["75(1)"]},{"f":["Share deal as asset deal","صفقة أسهم كصفقة أصول"],"b":["When the local tax treats it as an asset deal and taxes the seller's gain against tax basis.","عندما تعاملها الضريبة المحلية كصفقة أصول وتفرض ضريبة على مكسب البائع مقارنة بالأساس الضريبي."],"r":["75(2)"]},{"f":["DMT reorganisation","إعادة التنظيم لأغراض النظام"],"b":["Equity consideration, untaxed seller gain, carry-over tax basis: no gain or loss, carry-over book values.","مقابل بحقوق ملكية، ومكسب بائع غير خاضع، وانتقال الأساس الضريبي: لا مكسب ولا خسارة، وانتقال القيم الدفترية."],"r":["76(2)","77"]},{"f":["Joint venture","المشروع المشترك"],"b":["Equity-accounted, UPE ≥ 50%; computed as a separate group with the JV as UPE.","محاسب بحقوق الملكية، والكيان الأم ≥ 50%؛ يُحتسب كمجموعة مستقلة والمشروع كيانها الأم."],"r":[78,79]},{"f":["Multi-parented MNE group","المجموعة متعددة الكيانات الأم"],"b":["Stapled structure or dual-listed arrangement with a cross-border element; treated as one group.","هيكل متلازم أو ترتيب إدراج مزدوج مع عنصر عابر للحدود؛ يُعامل كمجموعة واحدة."],"r":[80,81]}],"range":"73–83"},{"id":14,"title":["Flow-through parents and investment entities","الكيانات الأم الشفافة وكيانات الاستثمار"],"goal":["Apply the flow-through UPE rule, compute an investment entity's ETR and top-up tax separately, and use the tax transparency and taxable distribution elections.","تطبيق قاعدة الكيان الأم النهائي الشفاف، واحتساب المعدل الفعلي والضريبة التكميلية لكيان الاستثمار بشكل مستقل، واستخدام اختياري الشفافية الضريبية وطريقة التوزيع الخاضع للضريبة."],"parts":[9],"arts":[84,85,86,87,88],"time":35,"metaphor":{"title":["Pipes, not tanks","أنابيب لا خزانات"],"text":["Some entities are pipes rather than tanks: a flow-through parent passes its income straight to owners who pay tax on it, and an investment fund passes returns to its investors. The law does not top up income that will be taxed at 15% or more in the owners' hands, and it keeps funds out of the operating ETR so their returns neither dilute nor inflate it.\nTwo elections let a fund be seen through the owner's own tax: yearly fair value taxation, or tax on distributions. But a pipe that stops flowing for three years is treated as a tank, and topped up at the full 15%.","بعض الكيانات أنابيب لا خزانات: فالكيان الأم الشفاف يمرر دخله مباشرة إلى ملاك يدفعون الضريبة عليه، وصندوق الاستثمار يمرر العوائد إلى مستثمريه. ولا يفرض النظام ضريبة تكميلية على دخل سيخضع للضريبة بنسبة 15% أو أكثر لدى الملاك، ويُبقي الصناديق خارج المعدل التشغيلي حتى لا تخفضه عوائدها ولا ترفعه.\nويسمح اختياران بالنظر إلى الصندوق عبر ضريبة المالك نفسه: ضريبة سنوية على القيمة العادلة، أو ضريبة على التوزيعات. لكن الأنبوب الذي يتوقف جريانه ثلاث سنوات يُعامل كخزان، وتُفرض عليه الضريبة التكميلية بنسبة 15% كاملة."]},"anchors":[{"if":["The UPE is a flow-through entity whose owners are taxed on its income at 15% or more","الكيان الأم النهائي شفاف ضريبياً ويخضع ملاكه للضريبة على دخله بنسبة 15% أو أكثر"],"then":["Reduce its DMT income for those interests, and its covered taxes in proportion (Art 84(1), 84(3))","اخفض دخله عن تلك الحصص، وضرائبه المشمولة بالنسبة نفسها (المادة 84 (1) و(3))"]},{"if":["A Saudi investment fund or REIV is a constituent entity, not the UPE","صندوق استثمار أو أداة استثمار عقاري في المملكة كيان تابع وليس الكيان الأم النهائي"],"then":["Compute its ETR and top-up separately, on the group's allocable share (Art 85)","احسب معدله وضريبته التكميلية بشكل مستقل، على الحصة القابلة للتخصيص للمجموعة (المادة 85)"]},{"if":["The fund's owner is taxed yearly on fair value changes at 15% or more","مالك الصندوق يخضع سنوياً للضريبة على تغيرات القيمة العادلة بنسبة 15% أو أكثر"],"then":["Consider the tax transparency election (Art 87)","فكّر في اختيار الشفافية الضريبية (المادة 87)"]},{"if":["The fund's owner is taxed on distributions at 15% or more","مالك الصندوق يخضع للضريبة على التوزيعات بنسبة 15% أو أكثر"],"then":["Consider the taxable distribution method, and distribute within three years (Art 88)","فكّر في طريقة التوزيع الخاضع للضريبة، ووزّع خلال ثلاث سنوات (المادة 88)"]}],"diagrams":[{"type":"flow","title":["An investment entity's top-up tax","الضريبة التكميلية لكيان الاستثمار"],"nodes":[{"t":["Investment entity's DMT income","دخل كيان الاستثمار"],"s":["computed under Part 3","محتسب وفق الجزء الثالث"]},{"t":["× inclusion ratio","× نسبة التضمين"],"s":["the group's share, ignoring elected interests · Art 85(4)–(5)","حصة المجموعة، دون الحصص المختارة · المادة 85 (4)–(5)"]},{"t":["= allocable share","= الحصة القابلة للتخصيص"],"s":["the ETR denominator","مقام المعدل الفعلي"]},{"t":["ETR = covered taxes on that share ÷ allocable share","المعدل = الضرائب المشمولة على الحصة ÷ الحصة"],"s":["Art 85(2)–(3)","المادة 85 (2)–(3)"]},{"t":["(15% − ETR) × (allocable share − SBIE)","(15% − المعدل) × (الحصة − الاستبعاد)"],"s":["Art 85(6)–(7)","المادة 85 (6)–(7)"]}]},{"type":"table","title":["Three ways to treat an investment entity","ثلاث طرق لمعاملة كيان الاستثمار"],"head":[["Route","الطريق"],["When","متى"],["Result","النتيجة"]],"rows":[[["Default (Art 85)","الأصل (المادة 85)"],["Always, unless an election applies","دائماً، ما لم ينطبق اختيار"],["Separate ETR and top-up on the group's allocable share","معدل فعلي وضريبة تكميلية مستقلان على حصة المجموعة القابلة للتخصيص"]],[["Tax transparency election (Art 87)","اختيار الشفافية الضريبية (المادة 87)"],["The owner is taxed under a mark-to-market or similar regime at 15% or more","يخضع المالك لنظام القيمة السوقية أو ما يماثله بنسبة 15% أو أكثر"],["The fund is treated as tax transparent","يُعامل الصندوق كشفاف ضريبياً"]],[["Taxable distribution method (Art 88)","طريقة التوزيع الخاضع للضريبة (المادة 88)"],["The owner (not itself an investment entity) is expected to be taxed on distributions at 15% or more","يُتوقع خضوع المالك (وليس كيان استثمار) للضريبة على التوزيعات بنسبة 15% أو أكثر"],["Distributions taxed in the owner; income left undistributed after three years topped up at 15%","تُدرج التوزيعات لدى المالك؛ ويخضع الدخل غير الموزع بعد ثلاث سنوات لضريبة تكميلية بنسبة 15%"]]]}],"points":[{"h":["Flow-through UPE","الكيان الأم النهائي الشفاف"],"t":["A flow-through UPE reduces its DMT income by the income attributable to each ownership interest whose holder is taxed on the full amount at a nominal rate of 15% or more for a period ending within 12 months of the group's year-end (or where combined taxes are expected to reach 15%). It also does so for resident individuals, and resident governmental entities, international or non-profit organisations and pension funds, holding 5% or less.","يخفض الكيان الأم النهائي الشفاف دخله بالدخل المنسوب إلى كل حصة ملكية يخضع حاملها للضريبة على كامله بمعدل اسمي 15% أو أكثر عن فترة تنتهي خلال 12 شهراً من نهاية سنة المجموعة (أو حيث يُتوقع أن تبلغ الضرائب مجتمعة 15%). ويفعل ذلك أيضاً للأفراد المقيمين، وللكيانات الحكومية والمنظمات الدولية وغير الربحية وصناديق التقاعد المقيمة، الذين يملكون 5% أو أقل."],"r":["84(1)"]},{"h":["Losses and taxes of a flow-through UPE","خسائر الكيان الأم الشفاف وضرائبه"],"t":["Its DMT loss is reduced by the loss attributable to each ownership interest, except to the extent the holders cannot use the loss in their own taxable income. When it reduces DMT income, it reduces its covered taxes in proportion.","تُخفض خسارته بالخسارة المنسوبة إلى كل حصة ملكية، إلا بقدر ما لا يستطيع الحاملون استخدام الخسارة في دخلهم الخاضع للضريبة. وعندما يخفض دخله يخفض ضرائبه المشمولة بالنسبة نفسها."],"r":["84(2)","84(3)"]},{"h":["What an investment entity is","ما كيان الاستثمار"],"t":["An investment fund or real estate investment vehicle; an entity at least 95% owned by one (directly or through a chain) that only holds assets or invests funds for them; or an entity at least 85% owned by one whose income is substantially all excluded dividends or excluded equity gains or losses.","صندوق استثمار أو أداة استثمار عقاري؛ أو كيان مملوك لأي منهما بنسبة 95% على الأقل (مباشرة أو عبر سلسلة) لا يقوم إلا بحيازة الأصول أو استثمار الأموال لصالحه؛ أو كيان مملوك لأي منهما بنسبة 85% على الأقل يكون دخله كله تقريباً توزيعات مستبعدة أو مكاسب أو خسائر ملكية مستبعدة."],"r":[86]},{"h":["A separate ETR","معدل فعلي مستقل"],"t":["Unless it is tax transparent or under an Article 87 or 88 election, an investment entity's ETR is computed apart from the Kingdom's: its covered taxes divided by the group's allocable share of its DMT income. Several Saudi investment entities are combined into one ETR.","ما لم يكن شفافاً ضريبياً أو خاضعاً لاختيار وفق المادة 87 أو 88، يُحتسب المعدل الفعلي لكيان الاستثمار بمعزل عن معدل المملكة: ضرائبه المشمولة مقسومة على حصة المجموعة القابلة للتخصيص من دخله. وتُجمع كيانات الاستثمار المتعددة في المملكة في معدل واحد."],"r":["85(1)","85(2)"]},{"h":["Allocable share and inclusion ratio","الحصة القابلة للتخصيص ونسبة التضمين"],"t":["The allocable share is the investment entity's DMT income times the UPE's inclusion ratio, which is its DMT income less the part attributable to other owners, divided by its DMT income. Covered taxes on income outside that share are left out.","الحصة القابلة للتخصيص هي دخل كيان الاستثمار مضروباً في نسبة التضمين للكيان الأم النهائي، وهي دخله ناقصاً الجزء المنسوب إلى الملاك الآخرين مقسوماً على دخله. وتُستبعد الضرائب المشمولة على الدخل الخارج عن تلك الحصة."],"r":["85(3)","85(4)","85(5)"]},{"h":["Its top-up tax","ضريبته التكميلية"],"t":["The investment entity's top-up percentage (15% minus its ETR) times the group's allocable share less the investment entity's substance-based income exclusion.","نسبة الضريبة التكميلية لكيان الاستثمار (15% ناقصاً معدله) مضروبة في حصة المجموعة القابلة للتخصيص ناقصاً الاستبعاد على أساس الجوهر لكيان الاستثمار."],"r":["85(6)","85(7)"]},{"h":["Tax transparency election","اختيار الشفافية الضريبية"],"t":["The filing entity may elect to treat an investment entity or insurance investment entity as tax transparent if its owner is taxed under a mark-to-market or similar regime on yearly changes in the fair value of its interest, at a rate of 15% or more.","يجوز للكيان المقدم للإقرار أن يختار معاملة كيان الاستثمار أو كيان التأمين الاستثماري كشفاف ضريبياً إذا كان مالكه يخضع لنظام القيمة السوقية أو ما يماثله على التغيرات السنوية في القيمة العادلة لحصته، بمعدل 15% أو أكثر."],"r":[87]},{"h":["Taxable distribution method","طريقة التوزيع الخاضع للضريبة"],"t":["If the owner (not itself an investment entity) can reasonably be expected to be taxed on distributions at 15% or more, the filing entity may elect: distributions and the local creditable tax gross-up go into the owner's DMT income, and the investment entity's own income and taxes leave all ETR computations.","إذا أمكن توقع خضوع المالك (وليس كيان استثمار) للضريبة على التوزيعات بنسبة 15% أو أكثر، يجوز للكيان المقدم للإقرار أن يختار: فتدخل التوزيعات والضريبة المحلية القابلة للخصم المضافة في دخل المالك، ويخرج دخل كيان الاستثمار وضرائبه من جميع حسابات المعدل الفعلي."],"r":["88(1)","88(2)","88(3)"]},{"h":["Undistributed income after three years","الدخل غير الموزع بعد ثلاث سنوات"],"t":["Undistributed net DMT income of the tested year (the third year before the reporting year), after covered taxes, distributions to non-investment-entity shareholders, losses and investment loss carry-forwards in the testing period, is treated as DMT income of the reporting year and topped up at the full 15%.","يُعامل صافي الدخل غير الموزع لسنة الاختبار (السنة الثالثة قبل سنة الإقرار)، بعد الضرائب المشمولة والتوزيعات للمساهمين من غير كيانات الاستثمار والخسائر وخسائر الاستثمار المرحّلة في فترة الاختبار، كدخل لسنة الإقرار ويخضع لضريبة تكميلية بنسبة 15% كاملة."],"r":["88(2)","88(4)","88(5)","88(6)","88(7)"]}],"oecd":[{"t":["Article 84 follows GloBE Article 7.1, Articles 85 and 86 follow Article 7.4 and the definitions, Article 87 follows 7.5 and Article 88 follows 7.6. The draft has no counterparts to Articles 7.2 (deductible dividend regimes) and 7.3 (eligible distribution tax systems).","تتبع المادة 84 المادة 7.1 من القواعد النموذجية، والمادتان 85 و86 المادة 7.4 والتعريفات، والمادة 87 المادة 7.5، والمادة 88 المادة 7.6. ولا يتضمن مشروع النظام ما يقابل المادتين 7.2 (أنظمة التوزيعات القابلة للخصم) و7.3 (أنظمة ضريبة التوزيعات المؤهلة)."],"src":["Model Rules Arts 7.1–7.6","القواعد النموذجية: المواد 7.1–7.6"]},{"t":["KSA angle: CMA-regulated investment funds and REITs are the usual candidates. As UPEs they are excluded entities (Art 12); when an operating group consolidates one, Article 85 keeps its returns out of the Kingdom's operating ETR.","من منظور المملكة: صناديق الاستثمار وصناديق الاستثمار العقاري المتداولة الخاضعة لهيئة السوق المالية هي المرشح المعتاد. فإذا كانت كيانات أم نهائية فهي كيانات مستبعدة (المادة 12)؛ وإذا وحّدتها مجموعة تشغيلية فإن المادة 85 تُبقي عوائدها خارج معدل المملكة التشغيلي."],"src":["Draft Arts 12, 85","المشروع م 12 و85"]}],"reflect":{"ref":["Al-Hashr 59:7","الحشر: 7"],"ayah":"كي لا يكون دولة بين الأغنياء منكم","t":["So that wealth does not merely circulate among the rich among you. The taxable distribution method rewards returns that flow out to owners and are taxed there; income hoarded for three years is topped up in full. Structure investments so that wealth moves and serves, rather than sits.","كي لا يكون دولة بين الأغنياء منكم. تكافئ طريقة التوزيع الخاضع للضريبة العوائد التي تجري إلى الملاك وتُفرض عليها الضريبة هناك؛ أما الدخل المحبوس ثلاث سنوات فتُفرض عليه الضريبة التكميلية كاملة. فهيكل الاستثمارات بحيث يتحرك المال ويخدم، لا أن يركد."]},"cases":[{"t":["A consolidated real estate fund","صندوق عقاري موحّد"],"facts":["A group consolidates a Saudi real estate fund that is an investment entity (not tax transparent, no election) and holds 60% of it. FY2027: the fund's DMT income is SAR 50m; covered taxes attributable to the group's share are SAR 1.8m; the fund's SBIE is SAR 2m.","توحّد مجموعة صندوقاً عقارياً في المملكة يُعد كيان استثمار (ليس شفافاً ضريبياً ولا اختيار عليه) وتملك 60% منه. السنة المالية 2027م: دخل الصندوق 50 مليون ريال؛ والضرائب المشمولة المنسوبة إلى حصة المجموعة 1.8 مليون ريال؛ واستبعاد الصندوق مليونا ريال."],"steps":[{"t":["Group's allocable share (inclusion ratio 60%):","الحصة القابلة للتخصيص للمجموعة (نسبة التضمين 60%):"],"x":"50000000*60/100","v":30000000,"u":"SAR"},{"t":["Investment entity ETR:","المعدل الفعلي لكيان الاستثمار:"],"x":"1800000/30000000*100","v":6,"u":"%"},{"t":["Top-up percentage:","نسبة الضريبة التكميلية:"],"x":"15-6","v":9,"u":"%"},{"t":["Top-up tax for the fund:","الضريبة التكميلية للصندوق:"],"x":"9/100*(30000000-2000000)","v":2520000,"u":"SAR"}],"ans":["The fund owes SAR 2.52m, computed on its own. Its income and taxes stay out of the Kingdom's operating ETR, which is computed without it.","على الصندوق 2.52 مليون ريال، محتسبة بشكل مستقل. ويبقى دخله وضرائبه خارج معدل المملكة التشغيلي الذي يُحتسب دونه."],"r":["85(2)","85(4)","85(5)","85(6)","53(5)"]},{"t":["Three years without distributing","ثلاث سنوات دون توزيع"],"facts":["Under the taxable distribution method, a group owner holds 100% of a Saudi investment entity. Tested year FY2027: DMT income SAR 40m, no covered taxes. Testing period FY2027 to FY2030: distributions to the owner of SAR 25m and a DMT loss of SAR 5m in FY2029.","بموجب طريقة التوزيع الخاضع للضريبة، يملك مالك في المجموعة 100% من كيان استثمار في المملكة. سنة الاختبار 2027م: الدخل 40 مليون ريال، ولا ضرائب مشمولة. فترة الاختبار من 2027م إلى 2030م: توزيعات للمالك 25 مليون ريال وخسارة 5 ملايين ريال في 2029م."],"steps":[{"t":["Undistributed net DMT income for the tested year:","صافي الدخل غير الموزع لسنة الاختبار:"],"x":"40000000-25000000-5000000","v":10000000,"u":"SAR"},{"t":["Treated as DMT income in FY2030 and taxed at the full 15%:","يُعامل كدخل في 2030م ويخضع لنسبة 15% كاملة:"],"x":"10000000*15/100","v":1500000,"u":"SAR"}],"ans":["SAR 1.5m of top-up tax arises in FY2030 on the SAR 10m left undistributed from FY2027. Distributing it within the testing period would have avoided the charge.","تنشأ ضريبة تكميلية قدرها 1.5 مليون ريال في 2030م على العشرة ملايين غير الموزعة من 2027م. ولو وُزعت خلال فترة الاختبار لتجنبت المجموعة هذا العبء."],"r":["88(2)","88(4)","88(5)","88(6)"]},{"t":["A flow-through parent","كيان أم شفاف"],"facts":["Assume a Saudi partnership, fiscally transparent, is the UPE of an MNE group. Its FY2027 DMT income is SAR 100m. Owners: a company taxed on its full share at 20% in a period ending within 12 months (60%); Saudi-resident individuals each holding 5% or less (15% in total); a foreign fund not taxed on the income (25%).","افترض أن شراكة في المملكة، شفافة ضريبياً، هي الكيان الأم النهائي لمجموعة متعددة الجنسيات. دخلها لعام 2027م 100 مليون ريال. الملاك: شركة تخضع للضريبة على كامل حصتها بنسبة 20% عن فترة تنتهي خلال 12 شهراً (60%)؛ وأفراد مقيمون في المملكة يملك كل منهم 5% أو أقل (15% إجمالاً)؛ وصندوق أجنبي لا يخضع للضريبة على الدخل (25%)."],"steps":[{"t":["Reduction for the company taxed at 20%:","التخفيض عن الشركة الخاضعة لـ20%:"],"x":"100000000*60/100","v":60000000,"u":"SAR"},{"t":["Reduction for the small resident individual holders:","التخفيض عن صغار الحاملين من الأفراد المقيمين:"],"x":"100000000*15/100","v":15000000,"u":"SAR"},{"t":["DMT income that stays with the UPE:","الدخل الذي يبقى لدى الكيان الأم:"],"x":"100000000-60000000-15000000","v":25000000,"u":"SAR"}],"ans":["Only SAR 25m, the untaxed foreign fund's share, stays in the UPE's DMT income, and its covered taxes are cut in proportion.","لا يبقى في دخل الكيان الأم إلا 25 مليون ريال، وهي حصة الصندوق الأجنبي غير الخاضع للضريبة، وتُخفض ضرائبه المشمولة بالنسبة نفسها."],"r":["84(1)","84(3)"]}],"quiz":[{"q":["When does a flow-through UPE reduce its DMT income for an ownership interest?","متى يخفض الكيان الأم النهائي الشفاف دخله عن حصة ملكية؟"],"o":[["Always","دائماً"],["When the holder is taxed on the full amount at a nominal rate of 15% or more for a period ending within 12 months of the group's year-end","عندما يخضع الحامل للضريبة على كامل المبلغ بمعدل اسمي 15% أو أكثر عن فترة تنتهي خلال 12 شهراً من نهاية سنة المجموعة"],["When the holder is Saudi","عندما يكون الحامل سعودياً"],["Never","أبداً"]],"a":1,"e":["Article 84(1)(a).","المادة 84 (1) (أ)."],"r":["84(1)"]},{"q":["Which small holder also qualifies for the reduction?","أي حامل صغير يستفيد أيضاً من التخفيض؟"],"o":[["Any foreign investor with 10%","أي مستثمر أجنبي يملك 10%"],["A natural person resident in the UPE jurisdiction holding 5% or less","شخص طبيعي مقيم في ولاية الكيان الأم يملك 5% أو أقل"],["A fund with 20%","صندوق يملك 20%"],["Any company","أي شركة"]],"a":1,"e":["Article 84(1)(b).","المادة 84 (1) (ب)."],"r":["84(1)"]},{"q":["A flow-through UPE has a DMT loss. What happens?","لدى الكيان الأم الشفاف خسارة. ماذا يحدث؟"],"o":[["The loss stays in full","تبقى الخسارة كاملة"],["It is reduced by the loss attributable to each ownership interest, except where holders cannot use the loss","تُخفض بالخسارة المنسوبة إلى كل حصة ملكية، إلا حيث لا يستطيع الحاملون استخدامها"],["It doubles","تتضاعف"],["It is carried back","تُرحّل للخلف"]],"a":1,"e":["Article 84(2).","المادة 84 (2)."],"r":["84(2)"]},{"q":["How is an investment entity's ETR computed?","كيف يُحتسب المعدل الفعلي لكيان الاستثمار؟"],"o":[["Blended with the Kingdom","ممزوجاً مع المملكة"],["Separately: its covered taxes ÷ the group's allocable share of its DMT income","بشكل مستقل: ضرائبه المشمولة ÷ حصة المجموعة القابلة للتخصيص من دخله"],["At the owner's level","على مستوى المالك"],["It is not computed","لا يُحتسب"]],"a":1,"e":["Article 85(2).","المادة 85 (2)."],"r":["85(2)"]},{"q":["What is the 'allocable share'?","ما «الحصة القابلة للتخصيص»؟"],"o":[["The fund's revenue × 15%","إيرادات الصندوق × 15%"],["The investment entity's DMT income × the UPE's inclusion ratio","دخل كيان الاستثمار × نسبة التضمين للكيان الأم النهائي"],["Its net assets","صافي أصوله"],["Its distributions","توزيعاته"]],"a":1,"e":["Article 85(4).","المادة 85 (4)."],"r":["85(4)"]},{"q":["What is the inclusion ratio?","ما نسبة التضمين؟"],"o":[["Revenue ÷ assets","الإيرادات ÷ الأصول"],["The entity's DMT income less the part attributable to other owners, divided by its DMT income","دخل الكيان ناقصاً الجزء المنسوب إلى الملاك الآخرين، مقسوماً على دخله"],["Always 100%","100% دائماً"],["Distributions ÷ income","التوزيعات ÷ الدخل"]],"a":1,"e":["Article 85(5).","المادة 85 (5)."],"r":["85(5)"]},{"q":["How is an investment entity's top-up tax computed?","كيف تُحتسب الضريبة التكميلية لكيان الاستثمار؟"],"o":[["15% × revenue","15% × الإيرادات"],["Its top-up % × (allocable share − its SBIE)","نسبتها التكميلية × (الحصة القابلة للتخصيص − استبعادها)"],["The Kingdom's top-up % × its income","نسبة المملكة × دخله"],["Nil","صفر"]],"a":1,"e":["Article 85(6)–(7).","المادة 85 (6)–(7)."],"r":["85(6)","85(7)"]},{"q":["Which entity is NOT an investment entity under Article 86?","أي كيان ليس كيان استثمار وفق المادة 86؟"],"o":[["An investment fund","صندوق استثمار"],["A real estate investment vehicle","أداة استثمار عقاري"],["An entity 95% owned by a fund that only holds assets for it","كيان مملوك لصندوق بنسبة 95% لا يقوم إلا بحيازة الأصول لصالحه"],["An operating subsidiary 70% owned by a fund","شركة تشغيلية تابعة مملوكة لصندوق بنسبة 70%"]],"a":3,"e":["Article 86(1): the ownership tests are 95% (holding vehicles) and 85% (mainly excluded dividends or gains).","المادة 86 (1): اختبارات الملكية 95% (أدوات الحيازة) و85% (توزيعات أو مكاسب مستبعدة في الغالب)."],"r":[86]},{"q":["When is the tax transparency election available?","متى يتاح اختيار الشفافية الضريبية؟"],"o":[["When the fund is loss-making","عندما يكون الصندوق خاسراً"],["When the owner is taxed under a mark-to-market or similar regime on yearly fair value changes at 15% or more","عندما يخضع المالك لنظام القيمة السوقية أو ما يماثله على التغيرات السنوية في القيمة العادلة بنسبة 15% أو أكثر"],["When the fund is listed","عندما يكون الصندوق مدرجاً"],["When ZATCA agrees","عندما توافق الهيئة"]],"a":1,"e":["Article 87(1).","المادة 87 (1)."],"r":[87]},{"q":["When is the taxable distribution method available?","متى تتاح طريقة التوزيع الخاضع للضريبة؟"],"o":[["For any owner","لأي مالك"],["When an owner that is not an investment entity can reasonably be expected to be taxed on distributions at 15% or more","عندما يمكن توقع خضوع مالك ليس كيان استثمار للضريبة على التوزيعات بنسبة 15% أو أكثر"],["Only for Saudi funds","للصناديق السعودية فقط"],["Only for REITs","لصناديق الاستثمار العقاري فقط"]],"a":1,"e":["Article 88(1).","المادة 88 (1)."],"r":["88(1)"]},{"q":["Under the taxable distribution method, what is the 'tested year'?","في طريقة التوزيع الخاضع للضريبة، ما «سنة الاختبار»؟"],"o":[["The current year","السنة الحالية"],["The third year preceding the reporting fiscal year","السنة الثالثة السابقة لسنة الإقرار"],["The first year of the law","السنة الأولى للنظام"],["The fifth preceding year","السنة الخامسة السابقة"]],"a":1,"e":["Article 88(5).","المادة 88 (5)."],"r":["88(5)"]},{"q":["Undistributed net DMT income remains at the end of the testing period. How is it taxed?","بقي صافي دخل غير موزع في نهاية فترة الاختبار. كيف تُفرض عليه الضريبة؟"],"o":[["It is ignored","يُتجاهل"],["The owner's share is DMT income of the reporting year, and 15% of it is top-up tax","تُعد حصة المالك دخلاً لسنة الإقرار، و15% منها ضريبة تكميلية"],["At the Kingdom's top-up %","بنسبة المملكة التكميلية"],["At 20%","بنسبة 20%"]],"a":1,"e":["Article 88(2)(c).","المادة 88 (2) (ج)."],"r":["88(2)"]}],"cards":[{"f":["Flow-through UPE reduction","تخفيض الكيان الأم الشفاف"],"b":["Reduce DMT income for interests whose holders are taxed at 15%+ within 12 months, and for small resident holders (≤5%).","يُخفض الدخل عن الحصص التي يخضع حاملوها لـ15% فأكثر خلال 12 شهراً، وعن صغار الحاملين المقيمين (≤5%)."],"r":["84(1)"]},{"f":["Flow-through UPE losses and taxes","خسائر الكيان الأم الشفاف وضرائبه"],"b":["Losses reduced for holders who can use them; covered taxes reduced in proportion.","تُخفض الخسائر عن الحاملين القادرين على استخدامها؛ وتُخفض الضرائب المشمولة بالنسبة نفسها."],"r":["84(2)","84(3)"]},{"f":["Investment entity","كيان الاستثمار"],"b":["Investment fund or REIV; 95%-owned holding vehicles; 85%-owned entities earning mainly excluded dividends or gains.","صندوق استثمار أو أداة استثمار عقاري؛ وأدوات حيازة مملوكة بنسبة 95%؛ وكيانات مملوكة بنسبة 85% تكسب أساساً توزيعات أو مكاسب مستبعدة."],"r":[86]},{"f":["Investment entity ETR","المعدل الفعلي لكيان الاستثمار"],"b":["Separate from the Kingdom: covered taxes ÷ allocable share; Saudi investment entities combined.","مستقل عن المملكة: الضرائب المشمولة ÷ الحصة القابلة للتخصيص؛ وتُجمع كيانات الاستثمار في المملكة."],"r":["85(2)"]},{"f":["Allocable share","الحصة القابلة للتخصيص"],"b":["Investment entity's DMT income × the UPE's inclusion ratio.","دخل كيان الاستثمار × نسبة التضمين للكيان الأم النهائي."],"r":["85(4)"]},{"f":["Inclusion ratio","نسبة التضمين"],"b":["(DMT income − part attributable to other owners) ÷ DMT income.","(الدخل − الجزء المنسوب إلى الملاك الآخرين) ÷ الدخل."],"r":["85(5)"]},{"f":["Investment entity covered taxes","الضرائب المشمولة لكيان الاستثمار"],"b":["Those attributable to the allocable share, plus taxes allocated to it under the Regulations.","المنسوبة إلى الحصة القابلة للتخصيص، مع الضرائب المخصصة له وفق اللائحة."],"r":["85(3)"]},{"f":["Investment entity top-up","الضريبة التكميلية لكيان الاستثمار"],"b":["(15% − its ETR) × (allocable share − its SBIE).","(15% − معدله) × (الحصة القابلة للتخصيص − استبعاده)."],"r":["85(6)","85(7)"]},{"f":["Tax transparency election","اختيار الشفافية الضريبية"],"b":["Owner taxed mark-to-market at 15%+: treat the fund as tax transparent.","المالك خاضع لنظام القيمة السوقية بنسبة 15% فأكثر: يُعامل الصندوق كشفاف ضريبياً."],"r":[87]},{"f":["Taxable distribution method","طريقة التوزيع الخاضع للضريبة"],"b":["Owner taxed on distributions at 15%+: distributions in the owner's income; fund out of ETR computations.","المالك خاضع للضريبة على التوزيعات بنسبة 15% فأكثر: التوزيعات في دخل المالك؛ والصندوق خارج حسابات المعدل."],"r":["88(1)","88(2)"]},{"f":["Undistributed net DMT income","صافي الدخل غير الموزع"],"b":["Tested-year income less covered taxes, distributions, losses and investment loss carry-forwards in the testing period.","دخل سنة الاختبار ناقصاً الضرائب المشمولة والتوزيعات والخسائر وخسائر الاستثمار المرحّلة في فترة الاختبار."],"r":["88(4)"]},{"f":["Tested year and testing period","سنة الاختبار وفترة الاختبار"],"b":["Tested year: third year before the reporting year; testing period: from its start to the reporting year-end.","سنة الاختبار: السنة الثالثة قبل سنة الإقرار؛ وفترة الاختبار: من بدايتها حتى نهاية سنة الإقرار."],"r":["88(5)","88(6)"]}],"range":"84–88"},{"id":15,"title":["Registration, returns, payment and the capstone","التسجيل والإقرارات والسداد والمراجعة الختامية"],"goal":["Map the compliance calendar, ZATCA's powers, currency rules and penalties, then run one computation end to end.","رسم تقويم الالتزام، وصلاحيات الهيئة، وقواعد العملة والغرامات، ثم تنفيذ احتساب كامل من البداية إلى النهاية."],"parts":[10,11,12],"arts":[89,90,91,92,93,94,95,96,97,98,99,100,101,102,105,106],"time":45,"metaphor":{"title":["A flight plan","خطة الرحلة"],"text":["Registration is filing the flight plan: within 15 months of the end of the first year in scope. The domestic top-up tax return and the GloBE information return are the landing reports: 15 months after each year-end, 18 months for the very first year. ZATCA is air traffic control and can review the logs for five years, or ten where a return was never filed or evasion was intended.\nThe instruments: euro thresholds are read at the December average rate, and the tax is paid in riyals.","التسجيل هو تقديم خطة الرحلة: خلال 15 شهراً من نهاية أول سنة خاضعة. وإقرار الضريبة التكميلية المحلية وإقرار معلومات القواعد العالمية هما تقريرا الهبوط: بعد 15 شهراً من نهاية كل سنة، و18 شهراً للسنة الأولى. والهيئة برج المراقبة، ولها مراجعة السجلات خمس سنوات، أو عشراً إذا لم يُقدم الإقرار أصلاً أو قُصد التهرب.\nوالأدوات: تُقرأ الحدود المقومة باليورو بمتوسط سعر ديسمبر، وتُسدد الضريبة بالريال."]},"anchors":[{"if":["FY2027 (calendar year) is the group's first year in scope","السنة المالية 2027م (تقويمية) أول سنة خاضعة للمجموعة"],"then":["Register by 31 March 2029, through one designated local entity if there are several taxpayers (Art 91)","سجّل قبل 31 مارس 2029م، عبر كيان محلي معين واحد إذا تعدد المكلفون (المادة 91)"]},{"if":["It is the transition year","إنها سنة الانتقال"],"then":["File the DTT return and GIR within 18 months: 30 June 2029 for FY2027 (Art 105)","قدّم إقرار الضريبة وإقرار المعلومات خلال 18 شهراً: 30 يونيو 2029م لعام 2027م (المادة 105)"]},{"if":["The UPE files the GIR in a country with a QCAA in effect with the Kingdom","يقدم الكيان الأم النهائي إقرار المعلومات في دولة لديها اتفاق مؤهل نافذ مع المملكة"],"then":["No Saudi GIR; notify ZATCA who files and where (Art 94(7)–(8))","لا إقرار معلومات في المملكة؛ أخطر الهيئة بمن يقدمه وأين (المادة 94 (7)–(8))"]},{"if":["A euro threshold must be tested","يجب اختبار حد مقوم باليورو"],"then":["Convert at the average December rate of the preceding year: ECB, else the Saudi Central Bank (Art 98(2))","حوّل بمتوسط سعر ديسمبر للسنة السابقة: البنك المركزي الأوروبي، وإلا البنك المركزي السعودي (المادة 98 (2))"]},{"if":["ZATCA wants to reassess a year","تريد الهيئة إعادة ربط سنة"],"then":["Five years from the return deadline; ten if no return or intended evasion; any time with written consent (Art 95(4))","خمس سنوات من موعد الإقرار؛ وعشر إذا لم يُقدم أو قُصد التهرب؛ وفي أي وقت بموافقة خطية (المادة 95 (4))"]}],"diagrams":[{"type":"table","title":["Compliance calendar for a calendar-year group in scope from FY2027","تقويم الالتزام لمجموعة سنتها تقويمية خاضعة اعتباراً من 2027م"],"head":[["Obligation","الالتزام"],["Deadline","الموعد"],["Where","الموضع"]],"rows":[[["Registration","التسجيل"],["31 March 2029 (15 months after FY2027)","31 مارس 2029م (15 شهراً بعد 2027م)"],["Art 91(1)","المادة 91 (1)"]],[["FY2027 DTT return and GIR","إقرار الضريبة وإقرار المعلومات لعام 2027م"],["30 June 2029 (18 months)","30 يونيو 2029م (18 شهراً)"],["Art 105","المادة 105"]],[["FY2028 DTT return and GIR","إقرار الضريبة وإقرار المعلومات لعام 2028م"],["31 March 2030 (15 months)","31 مارس 2030م (15 شهراً)"],["Art 94(1), 94(9)","المادة 94 (1)، 94 (9)"]],[["Change in registration details","تغيير بيانات التسجيل"],["15 months after the year-end of the change","15 شهراً بعد نهاية سنة التغيير"],["Art 91(3)","المادة 91 (3)"]],[["Payment of the tax","سداد الضريبة"],["As set by the Regulations","وفق ما تحدده اللائحة"],["Art 97","المادة 97"]],[["ZATCA assessment of FY2028","ربط الهيئة لعام 2028م"],["Until 31 March 2035 (ten years if no return or intended evasion)","حتى 31 مارس 2035م (عشر سنوات إذا لم يُقدم الإقرار أو قُصد التهرب)"],["Art 95(4)","المادة 95 (4)"]],[["Refund claim for an FY2028 overpayment","طلب استرداد مبلغ زائد مسدد في 2028م"],["31 December 2033 (five years from the end of the year)","31 ديسمبر 2033م (خمس سنوات من نهاية السنة)"],["Art 95(5)","المادة 95 (5)"]]]},{"type":"flow","title":["The whole course in one line","المقرر كله في سطر واحد"],"nodes":[{"t":["Scope","النطاق"],"s":["Arts 2–17","المواد 2–17"]},{"t":["DMT income","الدخل"],"s":["Arts 18–41","المواد 18–41"]},{"t":["Covered taxes","الضرائب المشمولة"],"s":["Arts 42–52","المواد 42–52"]},{"t":["ETR and top-up","المعدل والضريبة التكميلية"],"s":["Arts 53–57, 63, 65","المواد 53–57، 63، 65"]},{"t":["SBIE","الاستبعاد"],"s":["Arts 58–62, 104","المواد 58–62، 104"]},{"t":["Reliefs","التخفيفات"],"s":["Arts 64, 66–72","المواد 64، 66–72"]},{"t":["Liability and filing","المسؤولية والإقرار"],"s":["Arts 73, 89–106","المواد 73، 89–106"]}]}],"points":[{"h":["ZATCA in charge","الهيئة هي المسؤولة"],"t":["ZATCA administers, controls, assesses and collects the domestic top-up tax and imposes penalties, by decision of the Governor or a person he authorises. Anti-avoidance follows the Income Tax Law and its regulations, applied in line with this law's objectives.","تتولى الهيئة إدارة الضريبة التكميلية المحلية والرقابة عليها وربطها وتحصيلها، وتفرض الغرامات بقرار من المحافظ أو من يفوضه. وتُطبق إجراءات مكافحة التجنب وفق نظام ضريبة الدخل ولائحته، بما يتفق مع أهداف هذا النظام."],"r":[89,90]},{"h":["Registration","التسجيل"],"t":["Each taxpayer registers within 15 months of the end of its first fiscal year in scope. Where a group has several Saudi taxpayers, they appoint a designated local entity to register for all of them. Changes are notified within 15 months of the end of the year of change; failures attract the Income Tax Law's registration penalties.","يسجل كل مكلف خلال 15 شهراً من نهاية أول سنة مالية يخضع فيها للنظام. وإذا كان للمجموعة عدة مكلفين في المملكة عيّنوا كياناً محلياً معيناً يسجل عنهم جميعاً. ويُخطر بالتغييرات خلال 15 شهراً من نهاية سنة التغيير؛ ويترتب على الإخلال غرامات التسجيل في نظام ضريبة الدخل."],"r":[91]},{"h":["Books, records and fiscal year","الدفاتر والسجلات والسنة المالية"],"t":["Taxpayers keep commercial books and records in Arabic for at least the period required by Saudi law; ZATCA may refuse a deduction that cannot be documented. The fiscal year is the UPE's consolidated accounts period, or the calendar year where deemed consolidated statements are used.","يمسك المكلفون الدفاتر التجارية والسجلات المحاسبية باللغة العربية مدة لا تقل عن المدة المقررة نظاماً في المملكة؛ وللهيئة رفض الخصم الذي لا يمكن إثباته. والسنة المالية هي فترة القوائم الموحدة للكيان الأم النهائي، أو السنة التقويمية حيث تُستخدم قوائم موحدة افتراضية."],"r":[92,93]},{"h":["The domestic top-up tax return","إقرار الضريبة التكميلية المحلية"],"t":["Filed within 15 months of the year-end, with a self-assessment and a declaration that it is complete and correct. The designated local entity files one return for all the group's Saudi taxpayers. Amendments follow the Regulations.","يُقدم خلال 15 شهراً من نهاية السنة، متضمناً تقديراً ذاتياً للضريبة وإقراراً بأنه كامل وصحيح. ويقدم الكيان المحلي المعين إقراراً واحداً عن جميع مكلفي المجموعة في المملكة. وتخضع التعديلات للائحة."],"r":["94(1)","94(2)","94(3)","94(4)","94(5)"]},{"h":["The GloBE information return","إقرار معلومات القواعد العالمية"],"t":["Each taxpayer files a GIR in the standard template within 15 months, unless it is filed by the UPE or a designated filing entity in a jurisdiction with a qualifying competent authority agreement in effect with the Kingdom; ZATCA must then be told who files and where.","يقدم كل مكلف إقرار المعلومات بالنموذج الموحد خلال 15 شهراً، ما لم يقدمه الكيان الأم النهائي أو كيان مقدم معين في ولاية لديها اتفاق سلطة مختصة مؤهل نافذ مع المملكة؛ وعندئذ تُخطر الهيئة بمن يقدمه وأين."],"r":["94(6)","94(7)","94(8)","94(9)","94(10)","94(12)"]},{"h":["First-year relief","تخفيف السنة الأولى"],"t":["For the transition year, both returns are due 18 months after the year-end instead of 15.","في سنة الانتقال يُستحق الإقراران بعد 18 شهراً من نهاية السنة بدلاً من 15."],"r":[105]},{"h":["Assessments, objections and refunds","الربوط والاعتراضات والاستردادات"],"t":["ZATCA may correct a return or assess where none is filed, and may raise an additional assessment. Objections follow the rules of procedure of the Zakat, Tax and Customs Committees. Time limits: five years (from the filing deadline, a refund request or a committee decision), ten years without a return or with intended evasion, or any time with written consent. Refunds are claimed within five years of the end of the year overpaid.","للهيئة تصحيح الإقرار أو إجراء الربط عند عدم تقديمه، ولها إجراء ربط إضافي. وتخضع الاعتراضات لقواعد عمل لجان الفصل في المخالفات والمنازعات الزكوية والضريبية والجمركية. والمدد: خمس سنوات (من موعد الإقرار أو طلب الاسترداد أو قرار اللجنة)، وعشر سنوات عند عدم تقديم الإقرار أو قصد التهرب، أو في أي وقت بموافقة خطية. ويُطلب الاسترداد خلال خمس سنوات من نهاية سنة السداد الزائد."],"r":[95]},{"h":["Information and field examination","المعلومات والفحص الميداني"],"t":["All persons and government bodies must give ZATCA tax information it requests, including for treaty purposes, and ZATCA may examine books and records on site during working hours.","على جميع الأشخاص والجهات الحكومية تزويد الهيئة بما تطلبه من معلومات ضريبية، بما في ذلك لأغراض الاتفاقيات، وللهيئة فحص الدفاتر والسجلات ميدانياً خلال ساعات العمل."],"r":[96]},{"h":["Currency and payment","العملة والسداد"],"t":["The tax is paid in riyals; payment timing is set by the Regulations. Amounts not already in riyals are translated using the accounting standard's principles, and the tax payable is converted at the Saudi Central Bank rate for the last day of the year. Euro thresholds are tested at the average December rate of the preceding year, quoted by the ECB, else the Saudi Central Bank, else a source ZATCA accepts.","تُسدد الضريبة بالريال، ويحدد اللائحة موعد السداد. وتُحوّل المبالغ غير المقومة بالريال وفق مبادئ المعيار المحاسبي، وتُحوّل الضريبة المستحقة بسعر البنك المركزي السعودي لآخر يوم من السنة. وتُختبر الحدود المقومة باليورو بمتوسط سعر ديسمبر للسنة السابقة، كما ينشره البنك المركزي الأوروبي، وإلا البنك المركزي السعودي، وإلا مصدر تقبله الهيئة."],"r":[97,98,99]},{"h":["Penalties and collection","الغرامات والتحصيل"],"t":["Filing, late payment and fraud penalties, and collection by seizure and sale, all follow the Income Tax Law and its regulations, subject to the transitional penalty relief in Article 72. The Board may cancel uncollectible tax debts.","تتبع غرامات الإقرار والتأخر في السداد والاحتيال، والتحصيل بالحجز والبيع، أحكام نظام ضريبة الدخل ولائحته، مع مراعاة الإعفاء الانتقالي من الغرامات في المادة 72. وللمجلس إسقاط الديون الضريبية المتعذر تحصيلها."],"r":[100,101,102,"99(3)",72]},{"h":["Start date and Regulations","تاريخ البدء واللائحة"],"t":["The law applies to fiscal years beginning on or after 1 January 2027. The Board issues the Regulations within 180 days of the law's issuance, effective from the same date as the law.","يُطبق النظام على السنوات المالية التي تبدأ في 1 يناير 2027م أو بعده. ويصدر المجلس اللائحة خلال 180 يوماً من صدور النظام، ويُعمل بها من تاريخ نفاذه."],"r":[106]}],"oecd":[{"t":["Article 94 follows GloBE Article 8.1: no local GIR is needed where the UPE or designated filing entity files in a jurisdiction with a qualifying competent authority agreement in effect. The 15-month deadline and the 18-month first year match the GloBE timetable. The DTT return itself is a domestic return.","تتبع المادة 94 المادة 8.1 من القواعد النموذجية: فلا حاجة إلى إقرار معلومات محلي إذا قدمه الكيان الأم النهائي أو الكيان المقدم المعين في ولاية لديها اتفاق سلطة مختصة مؤهل نافذ. ويطابق موعد الـ15 شهراً والـ18 شهراً للسنة الأولى الجدول الزمني للقواعد العالمية. أما إقرار الضريبة التكميلية فإقرار محلي."],"src":["Model Rules Art 8.1","القواعد النموذجية: المادة 8.1"]},{"t":["KSA angle: penalties, objections and collection all borrow from the Income Tax Law and the committees' procedures, so existing ZATCA dispute experience carries over. The ECB's daily reference rates do not include the riyal, so the Saudi Central Bank's rate will usually be the one used for euro thresholds.","من منظور المملكة: تستعير الغرامات والاعتراضات والتحصيل أحكامها من نظام ضريبة الدخل وإجراءات اللجان، فتنتقل الخبرة القائمة في منازعات الهيئة. ولا تشمل الأسعار المرجعية اليومية للبنك المركزي الأوروبي الريال، لذا سيكون سعر البنك المركزي السعودي هو المستخدم عادةً للحدود المقومة باليورو."],"src":["Draft Arts 95, 98, 100–102; ECB reference rates","المشروع م 95 و98 و100–102؛ الأسعار المرجعية للبنك المركزي الأوروبي"]}],"reflect":{"ref":["An-Nisa 4:103","النساء: 103"],"ayah":"إن الصلاة كانت على المؤمنين كتابا موقوتا","t":["Prayer is prescribed for the believers at fixed times. A believer already lives by deadlines five times a day. Bring the same discipline to the compliance calendar: register, file and pay on time, not because a penalty waits, but because punctuality is part of trustworthiness.","إن الصلاة كانت على المؤمنين كتاباً موقوتاً. فالمؤمن يعيش مع المواعيد خمس مرات في اليوم. فاحمل الانضباط نفسه إلى تقويم الالتزام: سجّل وقدّم الإقرار وسدّد في الموعد، لا لأن غرامة تنتظر، بل لأن الالتزام بالوقت من الأمانة."]},"cases":[{"t":["The first three years' calendar","تقويم السنوات الثلاث الأولى"],"facts":["A calendar-year group with three Saudi taxpayers comes into scope in FY2027. Its UPE files the GIR in a country that has a qualifying competent authority agreement in effect with the Kingdom.","تدخل مجموعة سنتها تقويمية ولها ثلاثة مكلفين في المملكة نطاق النظام في 2027م. ويقدم كيانها الأم النهائي إقرار المعلومات في دولة لديها اتفاق سلطة مختصة مؤهل نافذ مع المملكة."],"steps":[{"t":["The three taxpayers appoint one designated local entity, which registers all of them by 31 March 2029.","يعيّن المكلفون الثلاثة كياناً محلياً معيناً واحداً يسجلهم جميعاً قبل 31 مارس 2029م."]},{"t":["The designated local entity files one FY2027 DTT return by 30 June 2029 (18 months, transition year).","يقدم الكيان المحلي المعين إقراراً واحداً لعام 2027م قبل 30 يونيو 2029م (18 شهراً، سنة الانتقال)."]},{"t":["No Saudi GIR is needed, but ZATCA must be notified of the UPE as filer and its jurisdiction.","لا حاجة إلى إقرار معلومات في المملكة، لكن يجب إخطار الهيئة بأن الكيان الأم هو المقدم وبولايته."]},{"t":["The FY2028 DTT return is due by 31 March 2030 (15 months).","يُستحق إقرار 2028م قبل 31 مارس 2030م (15 شهراً)."]}],"ans":["One designated local entity carries the whole Saudi compliance load: registration by 31 March 2029, the FY2027 return by 30 June 2029 and the FY2028 return by 31 March 2030, plus the GIR notification. Payment dates will come from the Regulations.","يحمل كيان محلي معين واحد عبء الالتزام كله في المملكة: التسجيل قبل 31 مارس 2029م، وإقرار 2027م قبل 30 يونيو 2029م، وإقرار 2028م قبل 31 مارس 2030م، مع إخطار إقرار المعلومات. وستحدد اللائحة مواعيد السداد."],"r":["91(1)","91(2)","94(1)","94(5)","94(7)","94(8)",105]},{"t":["Testing a euro threshold in riyals","اختبار حد مقوم باليورو بالريال"],"facts":["For FY2028, a group's Saudi entities have three-year average DMT revenue of SAR 42m and average DMT income of SAR 4.6m. The ECB does not quote the riyal; assume the Saudi Central Bank's December 2027 average is €1 = SAR 4.40.","للسنة المالية 2028م، بلغ متوسط إيرادات كيانات مجموعة في المملكة لثلاث سنوات 42 مليون ريال، ومتوسط دخلها 4.6 ملايين ريال. ولا ينشر البنك المركزي الأوروبي سعراً للريال؛ افترض أن متوسط البنك المركزي السعودي لشهر ديسمبر 2027م هو اليورو = 4.40 ريال."],"steps":[{"t":["Average revenue in euros (below €10m):","متوسط الإيرادات باليورو (أقل من 10 ملايين):"],"x":"42000000/4.4","v":9545454.55,"u":"EUR"},{"t":["Average income in euros (above €1m):","متوسط الدخل باليورو (أعلى من مليون):"],"x":"4600000/4.4","v":1045454.55,"u":"EUR"}],"ans":["Revenue passes but income fails, so de minimis is not available for FY2028 and the full computation applies. At a rate of SAR 4.20 instead, income would be about €1.10m: still a fail. The conversion rule can decide close cases.","تجتاز الإيرادات ويخفق الدخل، فلا يتاح استثناء الحد الأدنى لعام 2028م ويلزم الاحتساب الكامل. ولو كان السعر 4.20 ريال لبلغ الدخل نحو 1.10 مليون يورو: وهو إخفاق أيضاً. فقاعدة التحويل قد تحسم الحالات المتقاربة."],"r":["98(2)","64(1)"]},{"t":["Capstone: from the accounts to the top-up tax","المراجعة الختامية: من الحسابات إلى الضريبة التكميلية"],"facts":["FY2028, calendar year, group in scope; the transitional CbCR safe harbour has ended and de minimis fails.\n• Alpha Manufacturing (wholly foreign-owned income tax payer): net income SAR 250m after current tax SAR 36m and deferred tax SAR 8m (at 20%); it includes an excluded dividend of SAR 10m and a fine of SAR 2m (a policy-disallowed expense)\n• Beta Trading (Saudi-owned Zakat payer): net income SAR 110m after Zakat of SAR 4m\n• Eligible payroll SAR 200m; eligible tangible assets SAR 600m","السنة المالية 2028م، سنة تقويمية، ومجموعة خاضعة؛ انتهى الملاذ الآمن الانتقالي ويخفق اختبار الحد الأدنى.\n• ألفا للتصنيع (مملوكة بالكامل لأجانب وتدفع ضريبة الدخل): صافي الدخل 250 مليون ريال بعد ضريبة حالية 36 مليوناً وضريبة مؤجلة 8 ملايين (بنسبة 20%)؛ ويتضمن توزيعات مستبعدة 10 ملايين وغرامة مليوني ريال (مصروف غير مسموح به لاعتبارات السياسة العامة)\n• بيتا للتجارة (مملوكة لسعوديين وتدفع الزكاة): صافي الدخل 110 ملايين ريال بعد زكاة 4 ملايين\n• الرواتب المؤهلة 200 مليون ريال؛ والأصول الملموسة المؤهلة 600 مليون ريال"],"steps":[{"t":["Alpha's DMT income (add back taxes and the fine, remove the excluded dividend):","دخل ألفا (إعادة الضرائب والغرامة، واستبعاد التوزيعات المستبعدة):"],"x":"250000000+36000000+8000000-10000000+2000000","v":286000000,"u":"SAR"},{"t":["Alpha's covered taxes (deferred tax recast from 20% to 15%):","ضرائب ألفا المشمولة (إعادة احتساب الضريبة المؤجلة من 20% إلى 15%):"],"x":"36000000+8000000*15/20","v":42000000,"u":"SAR"},{"t":["Beta's DMT income (add back Zakat):","دخل بيتا (إعادة الزكاة):"],"x":"110000000+4000000","v":114000000,"u":"SAR"},{"t":["Kingdom ETR:","معدل المملكة الفعلي:"],"x":"(42000000+4000000)/(286000000+114000000)*100","v":11.5,"u":"%"},{"t":["SBIE at the 2028 rates (9.0% payroll, 7.0% assets):","الاستبعاد بنسب 2028م (9.0% للرواتب و7.0% للأصول):"],"x":"200000000*9/100+600000000*7/100","v":60000000,"u":"SAR"},{"t":["Domestic top-up tax (3.5% × excess profit of SAR 340m):","الضريبة التكميلية المحلية (3.5% × ربح زائد 340 مليون ريال):"],"x":"(15-11.5)/100*(400000000-60000000)","v":11900000,"u":"SAR"},{"t":["Alpha's share:","حصة ألفا:"],"x":"11900000*286000000/400000000","v":8508500,"u":"SAR"},{"t":["Beta's share:","حصة بيتا:"],"x":"11900000*114000000/400000000","v":3391500,"u":"SAR"}],"ans":["The Kingdom's FY2028 domestic top-up tax is SAR 11.9m: Alpha SAR 8.51m and Beta SAR 3.39m, with joint liability for the whole. The return is due by 31 March 2030. Notice how Beta, at 3.5% on its own, pulls the blended ETR below 15% even though Alpha alone is at about 14.7%.","الضريبة التكميلية المحلية للمملكة لعام 2028م 11.9 مليون ريال: ألفا 8.51 ملايين وبيتا 3.39 ملايين، مع مسؤولية تضامنية عن المبلغ كله. ويُستحق الإقرار قبل 31 مارس 2030م. ولاحظ كيف تسحب بيتا، بمعدل 3.5% منفردة، المعدل الممزوج إلى ما دون 15% رغم أن ألفا وحدها عند نحو 14.7%."],"r":["19(1)","49(2)","53(2)",56,"57(1)",104,"73(2)","94(1)"]}],"quiz":[{"q":["Who imposes penalties under the draft law?","من يفرض الغرامات بموجب مشروع النظام؟"],"o":[["The courts directly","المحاكم مباشرة"],["ZATCA, by decision of the Governor or a person he authorises","الهيئة، بقرار من المحافظ أو من يفوضه"],["The Ministry of Commerce","وزارة التجارة"],["The external auditor","المراجع الخارجي"]],"a":1,"e":["Article 90.","المادة 90."],"r":[90]},{"q":["Which anti-avoidance rules apply?","أي قواعد لمكافحة التجنب تنطبق؟"],"o":[["None","لا شيء"],["Those under the Income Tax Law and its regulations, applied in line with this law's objectives","قواعد نظام ضريبة الدخل ولائحته، مطبقة بما يتفق مع أهداف هذا النظام"],["OECD principal purpose test only","اختبار الغرض الرئيسي للمنظمة فقط"],["New rules in this law","قواعد جديدة في هذا النظام"]],"a":1,"e":["Article 89.","المادة 89."],"r":[89]},{"q":["When must a taxpayer register?","متى يجب على المكلف التسجيل؟"],"o":[["Before the year starts","قبل بداية السنة"],["Within 15 months of the end of its first fiscal year in scope","خلال 15 شهراً من نهاية أول سنة مالية يخضع فيها للنظام"],["Within 30 days of the law","خلال 30 يوماً من النظام"],["With the first return","مع الإقرار الأول"]],"a":1,"e":["Article 91(1).","المادة 91 (1)."],"r":["91(1)"]},{"q":["A group has several Saudi taxpayers. Who registers and files?","لمجموعة عدة مكلفين في المملكة. من يسجل ويقدم الإقرار؟"],"o":[["Each separately","كل منهم على حدة"],["A designated local entity they appoint, on behalf of all","كيان محلي معين يعينونه، نيابة عنهم جميعاً"],["The UPE abroad","الكيان الأم النهائي في الخارج"],["ZATCA decides","تقرر الهيئة"]],"a":1,"e":["Articles 91(2) and 94(5).","المادتان 91 (2) و94 (5)."],"r":["91(2)","94(5)"]},{"q":["In what language must books and records be kept?","بأي لغة يجب إمساك الدفاتر والسجلات؟"],"o":[["English","الإنجليزية"],["Arabic","العربية"],["Either","أي منهما"],["The UPE's language","لغة الكيان الأم النهائي"]],"a":1,"e":["Article 92(1).","المادة 92 (1)."],"r":["92"]},{"q":["What is the usual deadline for the domestic top-up tax return?","ما الموعد المعتاد لإقرار الضريبة التكميلية المحلية؟"],"o":[["120 days","120 يوماً"],["15 months after the year-end","15 شهراً بعد نهاية السنة"],["12 months","12 شهراً"],["24 months","24 شهراً"]],"a":1,"e":["Article 94(1).","المادة 94 (1)."],"r":["94(1)"]},{"q":["What is the deadline for the first (transition) year's returns?","ما موعد إقرارات السنة الأولى (الانتقالية)؟"],"o":[["15 months","15 شهراً"],["18 months after the year-end","18 شهراً بعد نهاية السنة"],["24 months","24 شهراً"],["6 months","6 أشهر"]],"a":1,"e":["Article 105.","المادة 105."],"r":[105]},{"q":["When is no GloBE information return needed in the Kingdom?","متى لا يلزم تقديم إقرار معلومات القواعد العالمية في المملكة؟"],"o":[["Never","أبداً"],["When the UPE or a designated filing entity files it in a jurisdiction with a qualifying competent authority agreement in effect with the Kingdom","عندما يقدمه الكيان الأم النهائي أو كيان مقدم معين في ولاية لديها اتفاق سلطة مختصة مؤهل نافذ مع المملكة"],["When no tax is due","عندما لا تستحق ضريبة"],["When the group is listed","عندما تكون المجموعة مدرجة"]],"a":1,"e":["Article 94(7); ZATCA must be notified under Article 94(8).","المادة 94 (7)؛ ويجب إخطار الهيئة وفق المادة 94 (8)."],"r":["94(7)","94(8)"]},{"q":["How long does ZATCA normally have to make or amend an assessment?","كم لدى الهيئة عادةً لإجراء الربط أو تعديله؟"],"o":[["Three years","ثلاث سنوات"],["Five years, or ten without a return or with intended evasion","خمس سنوات، أو عشر عند عدم تقديم الإقرار أو قصد التهرب"],["Unlimited","غير محدود"],["One year","سنة واحدة"]],"a":1,"e":["Article 95(4).","المادة 95 (4)."],"r":["95(4)"]},{"q":["In which currency is the tax paid?","بأي عملة تُسدد الضريبة؟"],"o":[["Euro","اليورو"],["US dollar","الدولار الأمريكي"],["Saudi riyal","الريال السعودي"],["The UPE's currency","عملة الكيان الأم النهائي"]],"a":2,"e":["Article 99(1).","المادة 99 (1)."],"r":["99"]},{"q":["How are euro thresholds tested for a fiscal year?","كيف تُختبر الحدود المقومة باليورو لسنة مالية؟"],"o":[["At the year-end spot rate","بالسعر الفوري في نهاية السنة"],["At the average of daily rates for December of the preceding year: ECB, else the Saudi Central Bank, else an acceptable source","بمتوسط الأسعار اليومية لشهر ديسمبر من السنة السابقة: البنك المركزي الأوروبي، وإلا البنك المركزي السعودي، وإلا مصدر مقبول"],["At a fixed SAR 4.0","بسعر ثابت 4.0 ريال"],["At the budget rate","بسعر الموازنة"]],"a":1,"e":["Article 98(2).","المادة 98 (2)."],"r":["98"]},{"q":["From when does the law apply, and when do the Regulations come?","متى يُطبق النظام، ومتى تصدر اللائحة؟"],"o":[["From 1 January 2026; Regulations any time","من 1 يناير 2026م؛ واللائحة في أي وقت"],["Fiscal years beginning on or after 1 January 2027; Regulations within 180 days of issuance, effective with the law","السنوات المالية التي تبدأ في 1 يناير 2027م أو بعده؛ واللائحة خلال 180 يوماً من الصدور، ويُعمل بها مع النظام"],["From publication; no Regulations","من النشر؛ دون لائحة"],["From 2028","من 2028م"]],"a":1,"e":["Article 106.","المادة 106."],"r":[106]}],"cards":[{"f":["ZATCA's role","دور الهيئة"],"b":["Administers, assesses and collects the tax; penalties by decision of the Governor or delegate.","تدير الضريبة وتربطها وتحصلها؛ والغرامات بقرار المحافظ أو من يفوضه."],"r":[90]},{"f":["Anti-avoidance","مكافحة التجنب"],"b":["Income Tax Law rules apply, in line with this law's objectives.","تُطبق قواعد نظام ضريبة الدخل بما يتفق مع أهداف هذا النظام."],"r":[89]},{"f":["Registration","التسجيل"],"b":["Within 15 months of the end of the first year in scope; changes within 15 months of the year-end.","خلال 15 شهراً من نهاية أول سنة خاضعة؛ والتغييرات خلال 15 شهراً من نهاية السنة."],"r":[91]},{"f":["Designated local entity","الكيان المحلي المعين"],"b":["Appointed by several Saudi taxpayers to register and file for all of them.","يعينه عدة مكلفين في المملكة للتسجيل وتقديم الإقرارات عنهم جميعاً."],"r":["91(2)","94(5)","94(12)"]},{"f":["Books and records","الدفاتر والسجلات"],"b":["In Arabic, kept for at least the legal period; undocumented deductions may be refused.","باللغة العربية، وتُحفظ المدة النظامية على الأقل؛ ويجوز رفض الخصم غير الموثق."],"r":[92]},{"f":["Fiscal year","السنة المالية"],"b":["The UPE's consolidated accounts period; calendar year for deemed consolidated statements.","فترة القوائم الموحدة للكيان الأم النهائي؛ والسنة التقويمية للقوائم الموحدة الافتراضية."],"r":[93]},{"f":["DTT return","إقرار الضريبة التكميلية"],"b":["15 months after year-end; self-assessment plus a declaration of completeness.","بعد 15 شهراً من نهاية السنة؛ تقدير ذاتي مع إقرار بالاكتمال."],"r":["94(1)","94(2)"]},{"f":["GIR and QCAA","إقرار المعلومات والاتفاق المؤهل"],"b":["Local GIR in 15 months unless filed by the UPE or DFE in a QCAA jurisdiction; notify ZATCA.","إقرار معلومات محلي خلال 15 شهراً ما لم يقدمه الكيان الأم أو الكيان المقدم المعين في ولاية لها اتفاق مؤهل؛ مع إخطار الهيئة."],"r":["94(7)","94(8)","94(9)"]},{"f":["First-year relief","تخفيف السنة الأولى"],"b":["Both returns due 18 months after the transition year ends.","يُستحق الإقراران بعد 18 شهراً من نهاية سنة الانتقال."],"r":[105]},{"f":["Assessments and refunds","الربوط والاستردادات"],"b":["Five years; ten without a return or with intended evasion; refunds within five years.","خمس سنوات؛ وعشر عند عدم الإقرار أو قصد التهرب؛ والاسترداد خلال خمس سنوات."],"r":[95]},{"f":["Currency","العملة"],"b":["Pay in riyals at the Saudi Central Bank year-end rate; euro thresholds at December averages.","السداد بالريال بسعر البنك المركزي السعودي في نهاية السنة؛ والحدود باليورو بمتوسطات ديسمبر."],"r":[98,99]},{"f":["Penalties and collection","الغرامات والتحصيل"],"b":["By reference to the Income Tax Law, subject to Article 72 relief; seizure and sale up to the debt.","بالإحالة إلى نظام ضريبة الدخل، مع مراعاة تخفيف المادة 72؛ والحجز والبيع بحدود الدين."],"r":[100,101,102]}],"range":"89–102, 105–106"}]}</script>
<script type="application/json" id="law-data">[{"n":1,"part":1,"part_en":"Definitions","part_ar":"التعريفات","title_en":"Definitions","title_ar":"التعريفات","page":1,"text_en":"The following words and phrases, wherever mentioned in this Law, shall have the meanings set out against each of them unless the context requires otherwise: Law: Domestic Minimum Tax (\"DMT\") Law.\nRegulations: The implementing regulations of this Law.\nKingdom: The territory of the Kingdom of Saudi Arabia, including its land, territorial waters and airspace and the areas above them, areas beyond the territorial waters that the Kingdom exercises sovereignty on its waters, seabed, sub-soil and natural resources by virtue of its laws and the international law provisions.\nThe Authority: Zakat, Tax and Customs Authority.\nThe Board: The Board of Directors of the Authority.\nThe Governor: Governor of the Authority.\nTax Treaty: An agreement for the avoidance of double taxation with respect to taxes on income and on capital.\nQualifying Competent Authority Agreement: A bilateral or multilateral agreement or arrangement between Competent Authorities that provides for the automatic exchange of annual GloBE Information Returns.\nAnnual Election: An election made by a Filing Constituent Entity and that applies only for the Fiscal Year for which the election is made.\nFive-Year Election: An election made by a Filing Constituent Entity with respect to a Fiscal Year (the Fiscal Year in which the election is made) that cannot be revoked with respect to that year or the four succeeding Fiscal Years. If a Five-Year Election is revoked with respect to a Fiscal Year (the revocation year), a new election cannot be made with respect to the four Fiscal Years succeeding the revocation year unless specific provisions of this Law or the Regulations stipulate for other rules on revocation.\nReal Estate Investment Vehicle: A widely held Entity that predominantly holds immovable property, and is subject to a tax regime designed to:\n(a) achieve a single level of taxation on the income, gains or profits of the Entity, either at the level of the Entity or at the level of its interest holders, and\n(b) allow the deferral of taxation of no more than one year from the end of the accounting period in which the income, profits or gains arise.\nAuthorised Accounting Body: The body with legal authority in a jurisdiction to prescribe, establish, or accept accounting standards for financial reporting purposes.\nMinimum Rate: Fifteen percent (15%).\nOther Comprehensive Income: Items of income and expense that are not recognised in profit or loss as required or permitted by the Authorised Financial Accounting Standard used in the Consolidated Financial Statements. Other Comprehensive Income is usually reported as an adjustment to equity in the statement of financial position (balance sheet).\nTransition Year: The first Fiscal Year that the MNE Group comes within the scope of this Law.\nFiscal Year: As defined in ARTICLE (93) of this Law.\nReporting Fiscal Year: Fiscal Year that is the subject of the Domestic Top-up Tax Return, or GloBE Information Return.\nJoint Venture Subsidiary: An Entity whose assets, liabilities, income, expenses, and cash flows are consolidated by a Joint Venture under an Acceptable Financial Accounting Standard or would have been required had it been required to consolidate such items in accordance with an Acceptable Financial Accounting Standard. A Permanent Establishment whose Main Entity is the Joint Venture, or a Joint Venture Subsidiary, shall be treated as a separate Joint Venture Subsidiary.\nQualified Domestic Minimum Top-up Tax (“QDMTT”): A minimum tax that is included in the domestic law of a jurisdiction and that:\n(a) determines the Excess Profits of the Constituent Entities located in the jurisdiction (domestic Excess Profits) in a manner that is equivalent to the GloBE Rules;\n(b) operates to increase domestic tax liability with respect to domestic Excess Profits to the Minimum Rate for the jurisdiction and Constituent Entities for a Fiscal Year; and\n(c) is implemented and administered in a way that is consistent with the outcomes provided for under the GloBE Rules and the Commentary, provided that such jurisdiction does not provide any benefits that are related to such rules.\nDomestic Top-up Tax: Tax imposed in accordance with the provisions of this Law.\nConstituent Entity-owner: A Constituent Entity that directly or indirectly owns an Ownership Interest in another Constituent Entity of the same MNE Group.\nFiling Constituent Entity: An Entity filing the Domestic Top-up Tax Return or GloBE Information Return in accordance with ARTICLE (94) of this Law.\nMain Entity: In respect of a Permanent Establishment, is the Entity that includes the Financial Accounting Net Income or Loss of the Permanent Establishment in its financial statements.\nFlow-through Entity: An Entity is a Flow-through Entity to the extent it is fiscally transparent with respect to its income, expenditure, profit, or loss in the jurisdiction where it was created unless it is tax resident and subject to a Covered Tax on its income or profit in another jurisdiction. A fiscally transparent treatment means that a jurisdiction treats the income, expenditure, profit, or loss of an entity as if it were derived or incurred by the direct owner of that entity in proportion to its interest in that entity.\nTax Transparent Entity: A Flow-through Entity is a Tax Transparent Entity with respect to its income, expenditure, profit or loss, to the extent the Reference Entity’s jurisdiction treats the tested Entity, and each Entity through which the Reference Entity owns an Ownership Interest in the tested Entity, as fiscally transparent.\nReference Entity: Constituent Entity-owner that is closest in the ownership chain to the tested Entity and that is either (a) not a Flow-through Entity or (b) where there is no such Constituent Entityowner, a Flow-through Entity that is the Ultimate Parent Entity of the MNE Group (Flow-through UPE).\nGroup Entity: In respect of any Entity or Group, means an Entity that is a member of the same Group.\nEntity: Any legal person, or an arrangement that prepares separate financial accounts, such as a partnership or trust. The term Entity shall not include central, state, or local government or their administration or agencies that carry out government functions.\nAuthorised Financial Accounting Standard: A set of generally accepted accounting principles permitted by an Authorised Accounting Body in the jurisdiction where an Entity is located.\nAcceptable Financial Accounting Standard: International Financial Reporting Standards (\"IFRS\") and the generally accepted accounting principles of Australia, Brazil, Canada, Member States of the European Union, Member States of the European Economic Area, Hong Kong (China), Japan, Mexico, New Zealand, the People’s Republic of China, the Republic of India, the Republic of Korea, Russia, Singapore, Switzerland, the United Kingdom, and the United States of America.\nTaxpayer: Any Constituent Entity - including a Stateless Constituent Entity created in the Kingdom, or any Entity considered to be a Constituent Entity pursuant to the provisions of this Law - or a Joint Venture and its JV Subsidiaries, provided they are within the scope of this Law.\nUPE Jurisdiction: The jurisdiction where the Ultimate Parent Entity is located.\nPortfolio Shareholding: Ownership Interests in an Entity that are held by the MNE Group and that carry rights to less than ten percent (10%) of the profits, capital, reserves, or voting rights of that Entity at the date of the distribution or disposition.\nOwnership Interest: Any equity interest that carries rights to the profits, capital or reserves of an Entity, including the profits, capital or reserves of a Main Entity’s Permanent Establishment(s).\nDMT Losses of all Constituent Entities: The sum of the DMT Losses of all relevant Constituent Entities located in the Kingdom determined in accordance with the provisions of Part Three (3) of this Law for the Fiscal Year.\nDMT Income of all Constituent Entities: The sum of the DMT Income of all relevant Constituent Entities located in the Kingdom determined in accordance with the provisions of Part Three (3) of this Law for the Fiscal Year.\nNet DMT Loss: The nil or negative amount, if any, computed by deducting DMT Losses of all Constituent Entities from DMT Income of all Constituent Entities.\nQualified Imputation Tax: A Covered Tax accrued or paid by a Constituent Entity that is refundable or creditable to the beneficial owner of a dividend distributed by such Constituent Entity (or, in the case of a Covered Tax accrued or paid by a Permanent Establishment, a dividend distributed by the Main Entity) to the extent that the refund is payable, or the credit is provided:\n(a) By a jurisdiction other than the jurisdiction which imposed the Covered Taxes under a foreign tax credit regime;\n(b) To a beneficial owner of the dividend that is subject to tax at a nominal rate that equals or exceeds the Minimum Rate on the dividend on a current basis under the domestic law of the jurisdiction which imposed the Covered Taxes on the Constituent Entity;\n(c) To an individual beneficial owner of the dividend who is tax resident in the jurisdiction which imposed the Covered Taxes on the Constituent Entity and who is subject to tax on the dividends as ordinary income; or\n(d) To a Governmental Entity, an International Organisation, a resident Non-profit Organisation, a resident Pension Fund, a resident Investment Entity that is not a Group Entity, or a resident life insurance company to the extent that the dividends are received in connection with a pension fund business and subject to tax in a similar manner as a dividend received by Pension Fund. For the purposes of paragraph (d) above, a Non-Profit Organisation or Pension Fund is resident in a jurisdiction
