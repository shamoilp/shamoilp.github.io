ent Entity or an Insurance Investment Entity may apply the Taxable Distribution Method with respect to its Ownership Interest in a Constituent Entity that is an Investment Entity or an Insurance Investment Entity if the Constituent Entity-owner can be reasonably expected to be subject to tax on distributions from the Investment Entity or Insurance Investment Entity at a tax rate that equals or exceeds the Minimum Rate.\n2- Under the Taxable Distribution Method, the following provisions shall apply:\n(a) Distributions and deemed distributions of the Investment Entity or Insurance Investment Entity’s DMT Income shall be included in the DMT Income of the Constituent Entity-owner, other than an Investment Entity or Insurance Investment Entity, that received the distribution;\n(b) The Local Creditable Tax Gross-up shall be included in the DMT Income and Adjusted Covered Taxes of the Constituent Entity-owner, other than an Investment Entity or Insurance Investment Entity, that received the distribution;\n(c) The Constituent Entity-owner’s proportionate share of the Investment Entity or Insurance Investment Entity’s Undistributed Net DMT Income for the Tested Year shall be treated as DMT Income of the Investment Entity or Insurance Investment Entity for the Reporting Fiscal Year and the result of multiplying the Minimum Rate by such DMT Income shall be treated as Domestic Top-up Tax of a Low-Tax Constituent Entity in the Fiscal Year for the purposes of Part Three (3) of this Law;\n(d) The Investment Entity or Insurance Investment Entity’s DMT Income or Loss for the Fiscal Year and any Adjusted Covered Taxes attributable to such income are excluded from all Effective Tax Rate calculations under Part Five (5) and ARTICLE\n(85) of this Law, except as stipulated in subparagraph (b) of this paragraph.\n3- For the purposes of sub-paragraph (b) of paragraph (2) of this Article, the Local Creditable Tax Gross-up means the amount of Covered Taxes incurred by the Investment Entity that is allowed as a credit against the Constituent Entity-owner’s tax liability arising in connection with a distribution from the Investment Entity.\n4- The Undistributed Net DMT Income for a Fiscal Year shall be the amount of the Investment Entity or Insurance Investment Entity’s DMT Income, if any, for the Tested Year reduced, but not below zero, by the following amounts:\n(a) Any Covered Taxes of the Investment Entity or Insurance Investment Entity;\n(b) Distributions and deemed distributions to shareholders other than Constituent Entities that are Investment Entities or Insurance Investment Entities in the Testing Period;\n(c) DMT Losses arising in the Testing Period; and\n(d) Investment Loss Carry-forwards.\n5- For the purposes of this Article, the Tested Year is the third year preceding the Reporting Fiscal Year.\n6- For the purposes of this Article, the Testing Period is the period beginning with the first day of the Tested Year and ending with the last day of the Reporting Fiscal Year that the Ownership Interest was held by a Group Entity.\n7- Undistributed Net DMT Income for the Tested Year cannot be reduced by distributions or deemed distributions to the extent that such distributions were treated as a reduction to Undistributed Net DMT Income of a previous Tested Year. For the purposes of computing Undistributed Net DMT Income, a DMT Loss shall be reduced to the extent it reduced Undistributed Net DMT Income at the end of a previous Fiscal Year. If a DMT Loss for a Fiscal Year is not reduced to zero before the end of the last Testing Period that includes such Fiscal Year, the remainder becomes an Investment Loss Carry-forward and shall be reduced in the same manner as a DMT Loss in subsequent Fiscal Years.\n8- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- تبعاً لاختيار الكيان التابع المعين لتقديم الإقرار، يجوز للكيان التابع المالك الذي ليس كيان استثماري أو كيان تأمين استثماري، أن يطبق طريقة التوزيع الخاضعة للضريبة فيما يتعلق بحصة ملكيته في كيان تابع يُعد كياناً استثمارياً أو كيان تأمين استثماري، وذلك إذا كان من المتوقع بشكل معقول أن يخضع الكيان التابع المالك للضريبة على توزيعات الكيان الاستثماري أو كيان التأمين الاستثماري بمعدل يساوي أو يتجاوز الحد الأدنى.\n2- تُطبق الأحكام الآتية بالنسبة إلى طريقة التوزيع الخاضعة للضريبة:\n(أ) يتم إدراج التوزيعات والتوزيعات الاعتبارية لدخل ضريبة الحد الأدنى المحلي الخاص بالكيان الاستثماري أو كيان التأمين الاستثماري، في دخل ضريبة الحد الأدنى المحلي الخاص بالكيان التابع المالك الذي استلم التوزيعات، بخلاف الكيان الاستثماري أو كيان التأمين الاستثماري.\n(ب) يتم إدراج إجمالي الضريبة المحلية القابلة للائتمان في دخل ضريبة الحد الأدنى المحلي والضرائب المشمولة المعدلة للكيان التابع المالك الذي استلم التوزيعات، بخلاف الكيان الاستثماري أو كيان التأمين الاستثماري\n(ج) تتم معاملة الحصة التناسبية للكيان التابع المالك من صافي دخل ضريبة الحد الأدنى المحلي غير الموزع للكيان الاستثماري أو كيان التأمين الاستثماري خلال سنة الاختبار على أنها دخل ضريبة الحد الأدنى المحلي للكيان الاستثماري أو كيان التأمين الاستثماري خلال السنة المالية لتقديم الإقرار ، ويتم التعامل مع نتيجة ضرب الحد الأدنى في دخل ضريبة الحد الأدنى المحلي هذا على أنها ضريبة تكميلية محلية للكيان التابع الخاضع لمعدل ضريبي منخفض في السنة المالية لأغراض الجزء الثالث من هذا النظام\n(د) يتم استبعاد دخل أو خسارة ضريبة الحد الأدنى المحلي للكيان الاستثماري أو كيان التأمين الاستثماري خلال السنة المالية وأي ضرائب مشمولة معدلة منسوبة إلى هذا الدخل من جميع حسابات معدل الضريبة الفعلي بموجب الجزء الخامس والمادة (الخامسة والثمانين) من هذا النظام، باستثناء ما تنص عليه الفقرة الفرعية\n(ب) من هذه الفقرة\n3- لأغراض الفقرة الفرعية\n(ب) من الفقرة (2) من هذه المادة، يُعد إجمالي الضريبة المحلية القابلة للائتمان هو مبلغ الضرائب المشمولة المتكبدة من قبل الكيان الاستثماري والمسموح به كائتمان مقابل الالتزام الضريبي للكيان التابع المالك الناشئ فيما يتعلق بتوزيع حاصل من قبل الكيان الاستثماري.\n4- يُقصد بصافي دخل ضريبة الحد الأدنى المحلي غير الموزع لسنة مالية مبلغ دخل ضريبة الحد الأدنى المحلي للكيان الاستثماري أو كيان التأمين الاستثماري إن وجد لسنة الاختبار ومخفضاً منه ، بما لا يقل عن الصفر، المبالغ الآتية:\n(أ) أي ضرائب مشمولة للكيان الاستثماري أو كيان التأمين الاستثماري\n(ب) التوزيعات والتوزيعات الاعتبارية للمساهمين غير الكيانات التابعة التي تمثل كيانات استثمارية أو كيانات تأمين استثمارية في فترة الاختبار\n(ج) خسائر ضريبة الحد الأدنى المحلي الناشئة خلال فترة الاختبار\n(د) الخسائر الاستثمارية المرحلة\n5- لأغراض هذه المادة، تكون سنة الاختبار السنة الثالثة التي تسبق السنة المالية لتقديم الإقرار.\n6- لأغراض هذه المادة ، يُقصد ب فترة الاختبار الفترة التي تبدأ في أول يوم من سنة الاختبار وتنتهي في آخر يوم من السنة المالية لتقديم الإقرار التي يحتفظ فيها لا كيان في المجموعة بحصص الملكية.\n7- لا يمكن تخفيض صافي دخل ضريبة الحد الأدنى المحلي غير الموزع خلال سنة الاختبار بالتوزيعات أو التوزيعات الاعتبارية إلى الحد الذي يتم فيه التعامل مع هذه التوزيعات على أنها تخفيض لصافي دخل ضريبة الحد الأدنى المحلي غير الموزع لسنة اختبار سابقة. لأغراض احتساب صافي دخل ضريبة الحد الأدنى المحلي غير الموزع، يتم تخفيض خسارة ضريبة الحد الأدنى المحلي بما يساوي الحد الذي أدى إلى خفض صافي دخل ضريبة الحد الأدنى المحلي غير الموزع في نهاية السنة المالية السابقة. إذا لم يتم تخفيض خسارة ضريبة الحد الأدنى المحلي للسنة المالية إلى الصفر قبل نهاية فترة الاختبار الأخيرة التي تتضمن هذه السنة المالية، يصبح ما تبقى خسارة استثمارية مُرحّلة ويتم تخفيضها بذات الطريقة المستخدمة مع خسارة ضريبة الحد الأدنى المحلي في السنوات المالية اللاحقة.\n8- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":89,"part":10,"part_en":"Administrative Provisions","part_ar":"الأحكام الإدارية","title_en":"Anti-Tax Avoidance Procedures","title_ar":"إجراءات مكافحة التجنب الضريبي","page":66,"text_en":"1- Anti-tax avoidance procedures shall be applied as per the provisions applicable under the Income Tax Law and its implementing regulations in accordance with the objectives of this Law.\n2- The Regulations shall specify the implementing provisions, controls and procedures for implementing this Article.","text_ar":"1- تطبق إجراءات مكافحة التجنب الضريبي وفقا لما هو مطبق بموجب نظام ضريبة الدخل ولائحته التنفيذية بما لا يتعارض مع أهداف هذا النظام.\n2- تُحدد اللائحة الأحكام التنفيذية والضوابط وإجراءات تطبيق هذه المادة."},{"n":90,"part":10,"part_en":"Administrative Provisions","part_ar":"الأحكام الإدارية","title_en":"Tax Administration","title_ar":"إدارة الضريبة","page":66,"text_en":"1- The Authority is responsible for the administration, control, assessment and collection of Domestic Top-up Tax. The Authority is also responsible for imposing penalties in case of non-compliance with the provisions of this Law.\n2- The penalty shall be imposed by a decision rendered by the Governor or a person authorized by the Governor.","text_ar":"- 1 تتولى لا هيئة مسؤولية إدارة ومراجعة وربط وتحصيل الضريبة التكميلية المحلية. وتتولى الهيئة أيضاً مسؤولية فرض العقوبات عند مخالفة أحكام هذا النظام. -2 تُ فرض العقوبة بقرار يصدر عن المحافظ أو من يفوضه."},{"n":91,"part":10,"part_en":"Administrative Provisions","part_ar":"الأحكام الإدارية","title_en":"Registration","title_ar":"التسجيل","page":66,"text_en":"1- All Taxpayers must register with the Authority within fifteen (15) months from the end of the first Fiscal Year during which the Taxpayer became within the scope of this Law.\n2- For the purposes of paragraph (1) of this Article, where more than one Taxpayer is part of the same MNE Group, they shall appoint a Designated Local Entity that shall register on their behalf within the deadline stipulated under paragraph (1) of this Article.\n3- A Taxpayer that is registered for the purposes of this Law shall be required to notify the Authority directly, or through the appointed Designated Local Entity where applicable, of any change in the registration information within fifteen (15) months from the end of the Fiscal Year in which the said change occurred.\n4- The Regulations shall specify the information, data and documents to be provided for the purposes of the registration under this Article.\n5- Failure in complying with the provisions of this Article shall be subject to the penalties and fines applicable for not complying with registration requirements applicable under the Income Tax Law and its implementing regulations.","text_ar":"1- على جميع المكلفين التسجيل لدى الهيئة خلال خمسة عشر (15) شهراً من نهاية السنة المالية الأولى التي أصبحوا خلالها ضمن نطاق هذا النظام.\n2- لأغراض الفقرة (1) من هذه المادة، في حال انتماء أكثر من مكلف إلى نفس المجموعة المتعددة الجنسيات، يجب عليهم تعيين كيان معين محلي ليقوم بالتسجيل نيابة عنهم ضمن لا مدة المنصوص عليها في الفقرة (1) من هذه المادة.\n3- على المكلف المسجل لأغراض هذا النظام إخطار الهيئة بشكل مباشر، أو من خلال الكيان المعين المحلي عند الاقتضاء، بأي تغيير في بيانات التسجيل خلال خمسة عشر (15) شهراً من نهاية السنة المالية التي حدث فيها التغيير المذكور.\n4- تحدد اللائحة المعلومات والبيانات والمستندات الواجب تقديمها لأغراض التسجيل بموجب هذه المادة.\n5- يخضع عدم الالتزام بأحكام هذه المادة للغرامات والعقوبات المطبقة في حال عدم الالتزام بمتطلبات التسجيل المطبقة بموجب نظام ضريبة الدخل ولائحته التنفيذية."},{"n":92,"part":10,"part_en":"Administrative Provisions","part_ar":"الأحكام الإدارية","title_en":"Books and Records","title_ar":"الدفاتر والسجلات","page":67,"text_en":"1- A Taxpayer shall maintain the necessary commercial books and accounting records in Arabic for precise determination of the tax payable by it, for a period of no less than the period specified under the relevant legislation in force in the Kingdom.\n2- The Authority has the right not to allow a deduction if the Taxpayer is unable, without reasonable excuse, to produce a document of the expense or evidence supporting the legitimacy of its claim for the deduction.\n3- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- على المكلف أن يمسك الدفاتر التجارية والسجلات المحاسبية الضرورية باللغة العربية لأغراض التحديد الدقيق للضريبة الواجبة السداد من قبله، وذلك لمدة لا تقل عن المدة المحددة بموجب الأنظمة المعنية المعمول بها في المملكة.\n2- للهيئة الحق في عدم إجازة أي خصم إذا عجز المكلف دون سبب معقول عن تقديم المستند الخاص بالمصاريف أو الأدلة المؤيدة لصحة مطالبته بالخصم.\n3- تُحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة"},{"n":93,"part":10,"part_en":"Administrative Provisions","part_ar":"الأحكام الإدارية","title_en":"Fiscal Year","title_ar":"السنة المالية","page":67,"text_en":"1- Fiscal Year means an accounting period with respect to which the Ultimate Parent Entity of the MNE Group prepares its Consolidated Financial Statements. In case the Consolidated Financial Statements are prepared in accordance with sub-paragraph (d) of paragraph (1) of ARTICLE (4) of this Law, Fiscal Year means a calendar year.\n2- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- يُقصد بالسنة المالية الفترة المحاسبية التي يقوم عنها الكيان الأم النهائي للمجموعة المتعددة الجنسيات بإعداد القوائم المالية الموحدة. في حال إعداد القوائم المالية الموحدة بموجب الفقرة الفرعية (د)من الفقرة 1() من المادة (الرابعة) من هذا النظام، فيُقصد بالسنة المالية السنة التقويمية.\n2- تُحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة"},{"n":94,"part":10,"part_en":"Administrative Provisions","part_ar":"الأحكام الإدارية","title_en":"Filing Obligation","title_ar":"التزام تقديم الإقرارات","page":67,"text_en":"1- A Taxpayer for a Fiscal Year shall submit to the Authority a Domestic Top-up Tax Return in the form specified in the Regulations, within fifteen (15) months from the end of the Fiscal Year. 2- A Domestic Top-up Tax Return required under paragraph (1) of this Article shall include the following information:\n(a) A Domestic Top-up Tax self-assessment;\n(b) A declaration to the effect that the Domestic Top-up Tax Return is complete and correct;\n(c) Such further particulars as required in accordance with the Regulations.\n3- A Taxpayer is not obligated to file a Domestic Top-up Tax Return with the Authority if a Domestic Top-up Tax Return conforming to the requirements of paragraph (2) of this Article has been filed by the Designated Local Entity located in the Kingdom for the Reporting Fiscal Year.\n4- A Domestic Top-up Tax Return and the selfassessment of the Domestic Top-up Tax may be amended in accordance with the provisions specified in the Regulations.\n5- Where more than one Taxpayer is part of the same MNE Group as per the provisions of this Law, the Designated Local Entity appointed for the purposes of the registration under ARTICLE (91) of this Law shall be responsible for the submission of the Domestic Top-up Tax Return on behalf of all such Taxpayers.\n6- Subject to paragraph (7) of this Article, each Taxpayer shall file with the Authority a GloBE Information Return for the Fiscal Year in accordance with the requirements of paragraph (9) to paragraph (11) of this Article. The return may be filed by either the Taxpayer itself or by a Designated Local Entity.\n7- A Taxpayer is not obligated to file a GloBE Information Return with the Authority if a GloBE Information Return conforming to the requirements of paragraph (9) to paragraph\n(11) of this Article has been filed by either:\n(a) The Ultimate Parent Entity located in a jurisdiction that has a Qualifying Competent Authority Agreement in effect with the Kingdom for the Reporting Fiscal Year; or\n(b) The Designated Filing Entity located in a jurisdiction that has a Qualifying Competent Authority Agreement in effect with the Kingdom for the Reporting Fiscal Year.\n8- Where paragraph (7) of this Article applies, a Taxpayer, or the Designated Local Entity, shall notify the Authority of the identity of the Entity that is filing the GloBE Information Return and the jurisdiction in which it is located.\n9- Without prejudice to paragraph (7) of this Article, the GloBE Information Return shall be filed in a standard template no later than fifteen (15) months after the end of the Fiscal Year and shall include the information specified in the Regulations.\n10- The Authority may modify the information, filing and notification requirements of the GloBE Information Return and may develop simplified reporting procedures.\n11- The laws of the Kingdom with respect to sanctions and the confidentiality of returns and return information shall apply to the GloBE Information Return.\n12- Where paragraph (7) of this Article does not apply, and where more than one Taxpayer is part of the same MNE Group as per the provisions of this Law, the Designated Local Entity appointed for the purposes of the registration under ARTICLE (91) of this Law shall be responsible for the submission of the GloBE Information Return on behalf of all such Taxpayers.\n13- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- على المكلف أن يُعد إقرار الضريبة التكميلية المحلية عن كل سنة مالية ويقدمه إلى الهيئة وفقاً للنموذج المحدد في اللائحة، وذلك خلال خمسة عشر شهراً من نهاية السنة المالية المعنية.\n2- يشمل إقرار الضريبة التكميلية المحلية المطلوب بموجب الفقرة (1) من هذه المادة المعلومات الآتية:\n(أ) تقييم ذاتي للضريبة التكميلية المحلية.\n(ب) تصريح بأن إقرار لا ضريبة التكميلية المحلية كامل وصحيح.\n(ج) التفاصيل الإضافية المطلوبة بموجب اللائحة.\n3- لا يتوجب على المكلف تقديم إقرار الضريبة التكميلية المحلية إلى الهيئة إذا قدّم الكيان المعين المحلي الواقع في المملكة ، عن السنة المالية لتقديم الإقرار ، إقراراً يستوفي متطلبات الفقرة (2) من هذه المادة.\n4- يجوز تعديل إقرار لا ضريبة التكميلية المحلية والتقييم الذاتي للضريبة التكميلية المحلية وفقاً للأحكام المحددة في اللائحة.\n5- في حال انتماء أكثر من مكلف إلى نفس المجموعة المتعددة الجنسيات وفقاً لأحكام هذا النظام، فيكون الكيان المعين المحلي الذي تم تعيينه لغايات التسجيل وفقاً للمادة (الحادية والتسعين) من هذا النظام مسؤولاً عن تقديم إقرار الضريبة التكميلية المحلية نيابة عن جميع هؤلاء المكلفين.\n6- مع مراعاة أحكام الفقرة (7) من هذه المادة، على المكلف أن يقدم للهيئة إقرار معلومات قواعد مكافحة تآكل الوعاء الضريبي العالمي للسنة المالية وفقا لمتطلبات الفقرات من (9) إلى (11) من هذه المادة. يجوز تقديم الإقرار إما من قبل المكلف نفسه أو من قبل كيان معين محلي.\n7- لا يتوجب على المكلف تقديم إقرار معلومات قواعد مكافحة تآكل الوعاء الضريبي العالمي إلى الهيئة في حال تم تقديم إقرار معلومات قواعد مكافحة تآكل الوعاء الضريبي العالمي وفق متطلبات الفقرات من (9) إلى (11) من هذه المادة من قبل إما:\n(أ) الكيان الأم النهائي الواقع في ولاية قضائية لديها اتفاقية سلطة مختصة مؤهلة نافذة مع المملكة للسنة المالية لتقديم الإقرار . أو\n(ب) الكيان التابع المعين من قبل المجموعة المتعددة الجنسيات لتقديم الإقرار نيابة عنها - بدلاً من الكيان الأم النهائي - شريطة أن يكون الكيان التابع واقعاً في ولاية قضائية ترتبط مع المملكة باتفاقية سلطة مختصة مؤهلة ونافذة خلال السنة المالية لتقديم الإقرار.\n8- في حال تنطبق الفقرة (7) من هذه المادة، على المكلف ، أو الكيان المعين المحلي، إخطار الهيئة بهوية الكيان الذي يقدم إقرار معلومات قواعد مكافحة تآكل الوعاء الضريبي العالمي والولاية القضائية التي يقع فيها.\n9- دون الإخلال بأحكام الفقرة (7) من هذه المادة، يتم تقديم إقرار معلومات قواعد مكافحة تآكل الوعاء الضريبي العالمي وفقاً لنموذج قياسي خلال فترة لا تتجاوز خمسة عشر (15) شهراً من نهاية السنة المالية، ويحتوي الإقرار على المعلومات المنصوص عليها في اللائحة.\n10- يجوز للهيئة أن تعدل المتطلبات المتعلقة بالمعلومات والإقرار والإخطار الخاصة بإقرار معلومات قواعد مكافحة تآكل الوعاء الضريبي العالمي، ويجوز لها تطوير إجراءات إقرار مبسطة.\n11- تسري أنظمة المملكة - فيما يتعلق بالعقوبات وسرية الإقرارات والمعلومات الواردة فيها - على إقرار معلومات قواعد مكافحة تآكل الوعاء الضريبي العالمي.\n12- في حال عدم تطبيق الفقرة (7) من هذه المادة، وفي حال انتماء أكثر من مكلف إلى نفس المجموعة المتعددة الجنسيات وفقاً لأحكام هذا النظام، فيكون الكيان المعين المحلي الذي تم تعيينه لغايات التسجيل وفقاً للمادة (الحادية والتسعين) من هذا النظام مسؤولاً عن تقديم إقرار معلومات قواعد مكافحة تآكل الوعاء الضريبي العالمي نيابة عن جميع هؤلاء المكلفين.\n13- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":95,"part":10,"part_en":"Administrative Provisions","part_ar":"الأحكام الإدارية","title_en":"Examination and Tax Assessment","title_ar":"إجراءات الفحص والربط","page":69,"text_en":"1- The Authority may correct and adjust the Domestic Top-up Tax Return to make it conform to the provisions of this Law, and it may perform a tax assessment if such return is not filed.\n2- The Authority shall notify the Taxpayer directly, or through the appointed Designated Local Entity where applicable, of the tax assessment and of the related tax due by a registered official letter, or by any other means that proves its receipt of the notification.\n3- If it becomes clear to the Authority that the tax it had previously accepted is incorrect, the Authority may make an additional assessment and notify the Taxpayer directly, or through the appointed Designated Local Entity where applicable, of the additional assessment and the reasons thereof. The Taxpayer may object to the assessment in accordance with the Rules of Procedure of the Zakat, Tax, and Customs Committees, as amended.\n4- The Authority may make or amend an assessment as per the following deadlines, whichever comes later: (a) Within five years from any of the following:\n(1) The end of the deadline specified for filing the Domestic Top-up Tax Return for the Fiscal Year;\n(2) The date of submission of the refund request to the Authority;\n(3) The date of issuance of a final decision by the Committees for Resolution of Zakat, Tax and Customs Violations and Disputes ordering the re-assessment.\n(b) Within ten years of the deadline specified for filing the Domestic Top-up Tax Return for the Fiscal Year if a Taxpayer does not file its return, or it is found that the return is incomplete or incorrect with the intent of tax evasion;\n(c) At any time upon a written consent of the Taxpayer.\n5- A Taxpayer may request directly, or through the appointed Designated Local Entity where applicable, a refund of overpaid amounts within five years from the end of the Fiscal Year in which the amounts were overpaid.\n6- The Regulations shall specify the provisions, controls and procedures necessary to implement the provisions of this Article, including the recovery of amounts paid in excess.","text_ar":"1- للهيئة تصحيح وتعديل إقرار الضريبة التكميلية المحلية بما يجعله متوافقاً مع أحكام النظام، كما للهيئة الحق في إجراء ربط الضريبة في حال عدم تقديم هذا الإقرار.\n2- على الهيئة إبلاغ المكلف بشكل مباشر، أو من خلال الكيان المعين المحلي عند الاقتضاء ، بربط الضريبة والضريبة المعنية المستحقة عليه بخطاب رسمي مسجل ، أو أي وسيلة أخرى تثبت استلامه الإشعار\n3- في حال تبين للهيئة أن الضريبة التي قبلتها سابقا غير صحيحة، للهيئة الحق في إجراء ربط إضافي وإبلاغ المكلف بشكل مباشر، أو من خلال الكيان المعين المحلي عند الاقتضاء ، بالربط الإضافي ومبرراته. للمكلف الاعتراض على الربط وفقاً لقواعد عمل اللجان الزكوية والضريبية والجمركية وما يطرأ عليها من تعديلات.\n4- يحق للهيئة إجراء أو تعديل الربط الضريبي ضمن المدد الآتية ، أيها يحل لاحقاً\n(أ) خلال خمس سنوات من أي من: (1) نهاية الأجل المحدد لتقديم إقرار الضريبة التكميلية المحلية عن السنة المالية. (2) تاريخ طلب الاسترداد المقدم إلى الهيئة. (3) تاريخ صدور قرار نهائي من لجان الفصل في المخالفات والمنازعات الزكوية والضريبية والجمركية يقضي بإعادة الربط.\n(ب) خلال عشر سنوات من نهاية الأجل المحدد لتقديم إقرار الضريبة التكميلية المحلية عن السنة المالية إذا لم يقدم المكلف إقراره، أو إذا تبين أن الإقرار غير كامل أو غير صحيح بقصد التهرب الضريبي.\n(ج) في أي وقت إذا وافق المكلف خطيا على ذلك.\n5- يجوز للمكلف أن يطلب بشكل مباشر، أو من خلال الكيان المعين المحلي عند الاقتضاء، استرداد أي مبالغ مسددة بالزيادة خلال خمس سنوات من نهاية السنة المالية المسدد عنها المبالغ بالزيادة.\n6- تحدد اللائحة الأحكام والضوابط والإجراءات اللازمة لتنفيذ أحكام هذه المادة بما في ذلك استرداد المبالغ المسددة بالزيادة."},{"n":96,"part":10,"part_en":"Administrative Provisions","part_ar":"الأحكام الإدارية","title_en":"The Authority’S Right to Information","title_ar":"حق الهيئة في المعلومات","page":70,"text_en":"1- All persons and government bodies are required to provide the Authority with any information related to tax, if requested by the Authority for the purposes of taxation stated in this Law or for the purposes of international treaties provisions.\n2- Failures in complying with the provisions of this Article shall be subject to the fines and penalties applicable for similar failures under the Income Tax Law and its implementing regulations.\n3- The Authority may conduct a field examination of the Taxpayer’s books and records during working hours to ascertain the correctness of the Taxpayer’s tax liability.\n4- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- على جميع الأشخاص والجهات الحكومية تزويد الهيئة بأية معلومات مرتبطة بالضريبة وتطلبها الهيئة سواءً للأغراض الضريبية الواردة في هذا النظام أو لأغراض أحكام الاتفاقيات الدولية.\n2- يخضع عدم الالتزام بأحكام هذه المادة للغرامات والعقوبات المطبقة في الحالات المماثلة بموجب نظام ضريبة الدخل ولائحته التنفيذية.\n3- للهيئة الحق في فحص ميداني لدفاتر وسجلات المكلف أثناء ساعات العمل للتحقق من صحة الضريبة الواجبة عليه.\n4- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":97,"part":10,"part_en":"Administrative Provisions","part_ar":"الأحكام الإدارية","title_en":"Payment of the Domestic Top-Up Tax","title_ar":"سداد الضريبة التكميلية المحلية","page":70,"text_en":"The Regulations shall determine the time periods, terms and conditions for the payment or settlement of the Domestic Top-up Tax due or other associated dues by the Taxpayer.","text_ar":"تحدد اللائحة الفترات الزمنية والأحكام والشروط المتعلقة بسداد أو تسوية الضريبة التكميلية المحلية المستحقة، أو مستحقات أخرى مرتبطة بها ومتوجبة على المكلف."},{"n":98,"part":10,"part_en":"Administrative Provisions","part_ar":"الأحكام الإدارية","title_en":"Calculation Currency","title_ar":"عملة الاحتساب","page":71,"text_en":"1- If an amount relevant to a calculation required for the purposes of this Law is in a different currency than the Saudi Riyal and is not converted to Saudi Riyal during the preparation of the Consolidated Financial Statements, such amount should be converted to Saudi Riyal using the foreign currency translation principles of the accounting standard used to calculate the Financial Accounting Net Income or Loss in accordance with ARTICLE (18) of this Law.\n2- For the purposes of determining if a monetary threshold in this Law that is denominated in euros is satisfied or exceeded by an amount in respect of a Group, Entity or jurisdiction for a particular Fiscal Year, if the amount is denominated in another currency, the amount shall be converted from that currency to euros using the average of the daily rates of exchange, in respect of the two currencies for the month of December included in the Fiscal Year immediately preceding the particular Fiscal Year, as quoted by:\n(a) The European Central Bank;\n(b) Where the European Central Bank does not provide the relevant foreign exchange rate, the Saudi Central Bank; or\n(c) Another source that is acceptable to the Authority, if the Saudi Central Bank does not quote a daily rate of exchange in respect of the two currencies.\n3- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- إذا كان أي مبلغ يجب احتسابه لأغراض النظام مقوما بعملة مختلفة عن الريال السعودي ولم يتم تحويله إلى الريال السعودي عند إعداد القوائم المالية الموحدة، وجب تحويله إلى الريال السعودي وفقاً لمبادئ تحويل العملات الأجنبية المحددة في المعايير المحاسبية المالية المستخدمة لاحتساب صافي الدخل المحاسبي أو الخسارة المحاسبية بموجب المادة (الثامنة عشرة) من هذا النظام.\n2- لأغراض تحديد ما إذا كان أي حد نقدي في هذا النظام مقوما باليورو قد تم استيفاؤه أو تجاوزه فيما يتعلق بمجموعة أو كيان أو ولاية قضائية لسنة مالية معينة، إذا كان المبلغ مقوماً بعملة أخرى، يجب تحويل المبلغ من تلك العملة إلى اليورو باستخدام متوسط أسعار الصرف اليومية، فيما يتعلق بالعملتين لشهر ديسمبر للسنة المالية التي تسبق مباشرة السنة المالية المحددة، وذلك وفقاً لما هو معلن من:\n(أ) البنك المركزي الأوروبي.\n(ب) إذا لم يوفر البنك المركزي الأوروبي سعر الصرف ذ ا الصلة، البنك المركزي السعودي.\n(ج) مصدر آخر مقبول للهيئة، إذا لم يحدد البنك المركزي السعودي سعر صرف يومي للعملتين.\n3- تُحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":99,"part":10,"part_en":"Administrative Provisions","part_ar":"الأحكام الإدارية","title_en":"Payment Currency","title_ar":"عملة السداد","page":71,"text_en":"1- The Domestic Top-up Tax due shall be paid in Saudi Riyal.\n2- If the determination of the Domestic Top-up Tax involves an amount in a currency other than the Saudi Riyal, the amount shall be calculated for payment purposes in Saudi Riyal using the foreign exchange rate published for the last day of the Fiscal Year by:\n(a) The Saudi Central Bank; or\n(b) Where the Saudi Central Bank does not publish the relevant foreign exchange rate, another source that is acceptable to the Authority.\n3- The Board shall have the power to cancel tax debt and fines deemed uncollectible. The Regulations shall specify the cases where collection is impossible.","text_ar":"1- تسدد الضريبة التكميلية المحلية المستحقة بالريال السعودي.\n2- إذا تضمن تحديد الضريبة التكميلية المحلية مبلغاً بعملة غير الريال السعودي، يُحتسب المبلغ لأغراض السداد بالريال السعودي وفقاً لسعر الصرف المعلن لآخر يوم من السنة المالية من قبل:\n(أ) البنك المركزي السعودي.\n(ب) إذا لم ينشر البنك المركزي السعودي سعر الصرف ذا الصلة ، مصدر آخر مقبول من قبل الهيئة.\n3- للمجلس صلاحية إسقاط دين الضريبة والغرامات متى توفرت أسباب استحالة تحصيلها وتحدد اللائحة الحالات التي يستحيل معها التحصيل."},{"n":100,"part":10,"part_en":"Administrative Provisions","part_ar":"الأحكام الإدارية","title_en":"Violations and Fines","title_ar":"المخالفات والغرامات","page":72,"text_en":"1- Without prejudice to ARTICLE (72) of this Law, failure in complying with the provisions of ARTICLE (94) of this Law shall be subject to the fines and penalties relevant to not complying with return filing requirements applicable under the Income Tax Law and its implementing regulations.\n2- The Regulations shall specify any provisions related to submitting the Domestic Top-up Tax Return in cases of cessation of activity.","text_ar":"1- دون الإخلال بأحكام المادة (الثانية والسبعين) من هذا النظام، يخضع عدم الالتزام بأحكام المادة (الرابعة والتسعين) من هذا النظام للغرامات والعقوبات الخاصة بعدم الالتزام بمتطلبات تقديم الإقرار الضريبي المطبقة بموجب نظام ضريبة الدخل ولائحته التنفيذية.\n2- تحدد اللائحة أي أحكام خاصة بتقديم إقرار الضريبة التكميلية المحلية في حالات التوقف عن النشاط."},{"n":101,"part":10,"part_en":"Administrative Provisions","part_ar":"الأحكام الإدارية","title_en":"Payment Delay and Fraud Fines","title_ar":"غرامات التأخير عن السداد والغش","page":72,"text_en":"1- Without prejudice to ARTICLE (72) of this Law, and in addition to the fines and penalties otherwise stipulated in ARTICLE (100) of this Law, the penalties and fines applicable for non-payment of tax and payment delays shall be applied as per the relevant provisions applicable under the Income Tax Law and its implementing regulations.\n2- In addition to the fines and penalties otherwise stipulated in ARTICLE (100) of this Law, penalties and fines applicable for providing false information or committing fraud or deception with the intention of tax evasion shall be applied as per the relevant provisions applicable under the Income Tax Law and its implementing regulations.","text_ar":"1- مع عدم الإخلال بأحكام المادة (الثانية والسبعين من هذا النظام، وإضافة إلى الغرامات والعقوبات الأخرى المنصوص عليها في المادة (المائة) من هذا النظام، تطبق العقوبات والغرامات الخاصة بع دم سداد الضريبة أو التأخير عن السداد وفقا لما هو مطبق بموجب نظام ضريبة الدخل ولائحته التنفيذية.\n2- بالإضافة إلى الغرامات والعقوبات الأخرى المنصوص عليها في المادة (المائة) من هذا النظام، تطبق العقوبات والغرامات الخاصة بتقديم معلومات غير حقيقية أو الغش أو التحايل بقصد التهرب الضريبي وفقاً لما هو مطبق بموجب نظام ضريبة الدخل ولائحته التنفيذية."},{"n":102,"part":10,"part_en":"Administrative Provisions","part_ar":"الأحكام الإدارية","title_en":"Debt Collection Procedures","title_ar":"إجراءات تحصيل الديون","page":72,"text_en":"1- Should the Taxpayer fail to pay directly, or through the appointed Designated Local Entity where applicable, the Domestic Top-up Tax due by the dates specified by the Regulations, the Authority shall have the right to take necessary measures to impose seizure on the Taxpayer's funds, movable and immovable properties, in accordance with the provisions of the Income Tax Law and its implementing regulations, provided that the seizure shall not exceed the amount of tax debts.\n2- Pursuant to the applicable legal procedures, the movable and immovable properties of the Taxpayer shall be sold within the limit of satisfaction of the tax debts, in accordance with the provisions of the Income Tax Law and its implementing regulations.\n3- In case the due tax debts are not paid by the Taxpayer directly, or through the appointed Designated Local Entity where applicable, the compulsory collection procedures may be initiated by the Authority, in accordance with the provisions of the Income Tax Law and its implementing regulations, with government and private agencies required to follow the Authority's instructions in this regard.\n4- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- في حالة عدم قيام المكلف بسداد الضريبة التكميلية المحلية المستحقة عليه بشكل مباشر، أو من خلال الكيان المعين المحلي عند الاقتضاء، في المواعيد التي تحددها اللائحة، يكون للهيئة الحق في اتخاذ الإجراءات اللازمة لتوقيع الحجز على أموال المكلف وأمواله المنقولة وغير المنقولة، وفقاً لما هو مطبق بموجب نظام ضريبة الدخل ولائحته التنفيذية، على ألا يتجاوز الحجز مقدار الديون الضريبية.\n2- وفقاً للإجراءات النظامية المعمول بها، يتم بيع أموال المكلف المنقولة وغير المنقولة بما يكفي لتسديد الديون الضريبية ، وفقاً لما هو مطبق بموجب نظام ضريبة الدخل ولائحته التنفيذية.\n3- في حالة عدم سداد المكلف الديون الضريبية المستحقة بشكل مباشر، أو من خلال الكيان المعين المحلي عند الاقتضاء، يجوز للهيئة البدء في إجراءات التحصيل الإلزامي، وفقاً لما هو مطبق بموجب نظام ضريبة الدخل ولائحته التنفيذية، وعلى الجهات الحكومية والخاصة تنفيذ تعليمات الهيئة بهذا الخصوص.\n4- تُحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":103,"part":11,"part_en":"Transitional Provisions","part_ar":"الأحكام الانتقالية","title_en":"Tax Attributes upon Transition","title_ar":"الأصول والالتزامات الضريبية عند الانتقال","page":73,"text_en":"1- When determining the Effective Tax Rate for the Kingdom in a Transition Year, and for each subsequent Fiscal Year, the MNE Group shall take into account all of the deferred tax assets and deferred tax liabilities reflected or disclosed in the financial accounts of all the Constituent Entities in the Kingdom for the Transition Year.\n2- For the purposes of paragraph (1) of this Article:\n(a) The deferred tax assets and liabilities must be taken into account at the lower of:\n(1) The Minimum Rate; or\n(2) The applicable domestic tax rate.\n(b) A deferred tax asset that has been recorded at a rate lower than the Minimum Rate may be taken into account at the Minimum Rate if the Taxpayer can demonstrate that the deferred tax asset is attributable to a loss that would have been a DMT Loss had the MNE Group been subject to this Law in the year in which the loss arose;\n(c) The impact of any valuation adjustment, or accounting recognition adjustment, with respect to a deferred tax asset, shall be disregarded.\n3- Deferred tax assets arising from items excluded from the computation of DMT Income or Loss under Part Three (3) of this Law must be excluded from the computation of paragraph (1) of this Article when such deferred tax assets are generated in a transaction that takes place after 30 November 2021.\n4- In the case of a transfer of assets between Constituent Entities after 30 November 2021 and before the commencement of a Transition Year, the basis in the acquired assets, other than inventory, shall be based upon the disposing Entity’s carrying value of the transferred assets upon disposition with the deferred tax assets and liabilities brought into the scope of this Law determined on that basis.\n5- The Regulations shall specify the implementing provisions for this Article.","text_ar":"1- عند تحديد معدل الضريبة الفعلي للمملكة في سنة انتقالية، وكل سنة مالية لاحقة ، تأخذ المجموعة المتعددة الجنسيات بالاعتبار جميع الأصول الضريبية المؤجلة والالتزامات الضريبية المؤجلة المنعكسة أو المفصح عنها في الحسابات المالية لجميع الكيانات التابعة في المملكة للسنة الانتقالية.\n2- لأغراض الفقرة (1) من هذه المادة\n(أ) تؤخذ الأصول الضريبية المؤجلة والالتزامات الضريبية المؤجلة في الاعتبار بالمعدل الأدنى من: (1) الحد الأدنى . أو (2) معدل الضريبة المحلي المطبق.\n(ب) الأصل الضريبي المؤجل الذي تم تسجيله بمعدل أقل من الحد الأدنى يجوز أن يُؤخذ في الاعتبار من خلال تطبيق الحد الأدنى في حال تمكن المكلف من إثبات أن الأصل الضريبي المؤجل منسوب إلى خسارة كانت لتكون خسارة ضريبة حد أدنى محلي لو كانت المجموعة المتعددة الجنسيات خاضعة لهذا ا لنظام في السنة التي نشأت فيها الخسارة.\n(ج) يتم تجاهل أثر أي تعديل في التقييم، أو تعديل في الاعتراف المحاسبي ، فيما يتعلق بالأصل الضريبي المؤجل.\n3- الأصول الضريبية المؤجلة الناشئة عن البنود المستبعدة من احتساب دخل أو خسارة ضريبة الحد الأدنى المحلي بموجب الجزء الثالث من هذا النظام تُستبعد من الاحتساب حسب الفقرة (1) من هذه المادة عندما تنشأ هذه الأصول الضريبية المؤجلة في أي معاملة تحدث بعد تاريخ 30 نوفمبر 2021م.\n4- في حال نقل الأصول بين الكيانات التابعة بعد تاريخ 30 نوفمبر 2021 م وقبل بداية السنة الانتقالية، يستند الأساس في الأصول المكتسبة، غير المخزون، إلى القيمة الدفترية للكيان المتصرف للأصول المنقولة عند التصرف مع الأصول والالتزامات الضريبية المؤجلة التي تدخل في نطاق هذا النظام وتُحدد وفقاً لهذا الأساس.\n5- تحدد اللائحة الأحكام التنفيذية لتطبيق هذه المادة."},{"n":104,"part":11,"part_en":"Transitional Provisions","part_ar":"الأحكام الانتقالية","title_en":"Transitional Period For the Substance-Based Income Exclusion Relief","title_ar":"المرحلة الانتقالية لتخفيض الاستبعاد على أساس جوهر النشاط","page":74,"text_en":"1- For the purposes of applying ARTICLE (59) of this Law, the value of five percent (5%) shall be replaced for each Fiscal Year beginning in the calendar year set out in column (1) of the table, with the values set out in column (2) of the table:\n(1) (2) 2027 9.2% 2028 9.0% 2029 8.2% 2030 7.4% 2031 6.6% 2032 5.8%\n2- For the purposes of applying ARTICLE (60) of this Law the value of five percent (5%) shall be replaced, for each Fiscal Year beginning in the calendar year set out in column (1) of the table, with the values set out in column (2) of the table:\n(1) (2) 2027 7.2% 2028 7.0% 2029 6.6% 2030 6.2% 2031 5.8% 2032 5.4%","text_ar":"لتخفيض الاستبعاد على أساس جوهر النشاط\n1- لأغراض تطبيق المادة (التاسعة والخمسين) من هذا النظام، تُستبدل قيمة الخمسة بالمائة لكل سنة مالية تبدأ في السنة التقويمية المنصوص عليها في العمود الأول في الجدول، بالقيمة المبينة في العمود الثاني من الجدول ذاته:\n2- لأغراض تطبيق المادة (الستين) من هذا النظام، تُستبدل قيمة الخمسة بالمائة (%5) لكل سنة مالية تبدأ في السنة التقويمية المنصوص عليها في العمود الأول في الجدول، بالقيمة المبينة في العمود الثاني من الجدول ذاته:"},{"n":105,"part":11,"part_en":"Transitional Provisions","part_ar":"الأحكام الانتقالية","title_en":"Transitional Relief For Filing Obligations","title_ar":"التخفيف الانتقالي لالتزام تقديم الإقرار","page":74,"text_en":"Notwithstanding the provisions of paragraphs\n(1) and (9) of ARTICLE (94) of this Law, the Domestic Top-up Tax Return and the GloBE Information Return shall be filed with the Authority no later than eighteen (18) months after the last day of the Reporting Fiscal Year that is the Transition Year.","text_ar":"استثناءً من أحكام الفقرتين (1) و (9) من المادة (الرابعة والتسعين) من هذا النظام، يُقدم إقرار الضريبة التكميلية المحلية وإقرار معلومات قواعد مكافحة تآكل الوعاء الضريبي العالمي إلى الهيئة خلال مدة لا تتجاوز ثمانية عشر (18) شهراً بعد اليوم الأخير من السنة المالية لتقديم الإقرار التي تكون هي السنة الانتقالية."},{"n":106,"part":12,"part_en":"Final Provisions","part_ar":"الأحكام النهائية","title_en":"Effective Date of the Law and Power of the Board","title_ar":"سريان النظام وسلطات المجلس","page":75,"text_en":"1- The Law shall be applied to Fiscal Years beginning on or after 1 January 2027.\n2- The Board shall issue the Regulations within one hundred and eighty (180) days after the issuance of the Law and the Regulations shall come into effect as from the same date the Law takes effect.\n3- The Board, or a representative it appoints, shall issue the necessary decisions and instructions to implement the provisions of the Law and Regulations and shall come into force from the date of their publication.","text_ar":"1- يسري النظام على السنوات المالية التي تبدأ في أو بعد تاريخ 1 يناير 2027م.\n2- يصدر المجلس اللائحة خلال مائة وثمانين يوماً من تاريخ صدور النظام، ويُعمل بها من تاريخ نفاذ النظام.\n3- يصدر المجلس ، أو من ينيبه، القرارات والتعليمات اللازمة لتنفيذ أحكام النظام واللائحة ويعمل بها من تاريخ نشرها."}]</script>

/* ---------- state ---------- */

  s.quiz = s.quiz || {}; s.cards = s.cards || {}; s.days = s.days || []; s.seen = s.seen || {}; s.reader = s.reader || {};

}
let st = load();
function save(){ mem = st; try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} }
const lg = () => st.lang === "ar" ? 1 : 0;

const T = k => S[st.lang][k] || S.en[k] || k;
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
function mark(){ const d = today(); if (!st.days.includes(d)) { st.days.push(d); st.days = st.days.slice(-400); } }
function streak(){ const set = new Set(st.days); let n = 0, d = today(); if (!set.has(d)) d = addDays(d, -1); while (set.has(d)) { n++; d = addDays(d, -1); } return n; }
function level(){ const w = window.innerWidth; return w >= 3200 ? 3 : w >= 2400 ? 2 : w >= 1600 ? 1 : 0; }

const nf = new Intl.NumberFormat("en-US", {maximumFractionDigits: 2});
function money(v){ const n = nf.format(v); return st.lang === "ar" ? n + " " + T("sar") : T("sar") + " " + n; }
function val(v, u){ if (v == null) return ""; if (u === "yr") return String(v); if (u === "%") return nf.format(v) + "%"; if (u === "SAR") return money(v); if (u === "EUR") return (st.lang === "ar" ? nf.format(v) + " يورو" : "EUR " + nf.format(v)); return nf.format(v); }
function expr(x, u){ return (u === "yr" ? esc(x) : esc(x).replace(/\d+(\.\d+)?/g, m => nf.format(Number(m)))).replace(/\*/g, " × ").replace(/\//g, " ÷ ").replace(/(\d|\))-(?=[\d(])/g, "$1 − ").replace(/\+/g, " + "); }
function rngs(a){ a = a.slice().sort((x, y) => x - y); const out = []; let s = a[0], p = a[0]; for (let i = 1; i <= a.length; i++) { if (a[i] === p + 1) { p = a[i]; continue; } out.push(s === p ? String(s) : s + "–" + p); s = p = a[i]; } return out.join(", "); }

/* ---------- diagrams ---------- */
function diagram(d){
  if (!d) return "";
  let h = '<figure class="dg">' + (d.title ? '<figcaption class="dg-title">' + esc(L(d.title)) + "</figcaption>" : "");
  if (d.type === "flow") {
    h += '<div class="flow">' + d.nodes.map((n, i) => (i ? '<span class="ar" aria-hidden="true">→</span>' : "") + '<div class="node"><b>' + esc(L(n.t)) + "</b>" + (n.s ? "<span>" + esc(L(n.s)) + "</span>" : "") + "</div>").join("") + "</div>";
  } else if (d.type === "tree") {
    const node = n => n.end ? '<div class="end ' + (n.tone || "na") + '">' + esc(L(n.end)) + "</div>"
      : '<div class="q">' + esc(L(n.q)) + '</div><div class="br' + (n.yes.end && !n.no.end ? ' ln' : (!n.yes.end && n.no.end ? ' ly' : '')) + '"><div><div class="lab">' + esc(L(n.yl || ["Yes", "نعم"])) + "</div>" + node(n.yes) + '</div><div><div class="lab">' + esc(L(n.nl || ["No", "لا"])) + "</div>" + node(n.no) + "</div></div>";
    h += '<div class="tree">' + node(d.root) + "</div>";
  } else if (d.type === "formula") {
    h += '<div class="formula">' + d.rows.map(r => '<div class="row"><span class="l">' + esc(L(r.l)) + '</span><span class="op">' + esc(r.op || "=") + "</span><span>" + esc(L(r.r)) + "</span></div>").join("") + "</div>";
  } else if (d.type === "table") {

  } else if (d.type === "bars") {
    const max = Math.max.apply(null, d.items.map(i => Math.abs(i.v)).concat([d.max || 0]));
    h += '<div class="bars">' + d.items.map(i => '<div class="b"><span>' + esc(L(i.l)) + '</span><span class="t"><i class="' + (i.tone || "") + '" style="width:' + (max ? Math.round(Math.abs(i.v) / max * 100) : 0) + '%"></i></span><span class="num">' + esc(val(i.v, i.u || d.u)) + "</span></div>").join("") + "</div>";
  }
  return h + (d.note ? '<p class="small muted" style="margin-top:8px">' + esc(L(d.note)) + "</p>" : "") + "</figure>";
}

  let h = '<div class="colh">' + esc(T("reader")) + "</div>";
  if (m) h += '<select id="rsel" aria-label="' + esc(T("reader")) + '">' + m.arts.map(k => '<option value="' + k + '"' + (k === n ? " selected" : "") + ">" + esc(T("art")) + " " + k + " · " + esc(L([LAWN[k].title_en, LAWN[k].title_ar])) + "</option>").join("") + "</select>";
  h += '<h3 data-n="' + a.n + '">' + esc(T("art")) + ' <span class="num">' + a.n + "</span>: " + esc(L([a.title_en, a.title_ar])) + '</h3><div class="meta"><span>' + esc(T("part")) + " " + a.part + ": " + esc(L([a.part_en, a.part_ar])) + "</span><span>" + esc(T("page")) + ' <span class="num">' + a.page + "</span></span></div>";
  h += '<label class="toggle" style="margin:8px 0"><input type="checkbox" id="both"' + (both ? " checked" : "") + "> " + esc(T("both")) + "</label>";
  const hr = '<hr style="border:0;border-top:1px solid var(--line);margin:12px 0">';
  h += both ? (st.lang === "ar" ? lawText(a.text_ar, "rtl") + hr + lawText(a.text_en, "ltr") : lawText(a.text_en, "ltr") + hr + lawText(a.text_ar, "rtl")) : lawText(st.lang === "ar" ? a.text_ar : a.text_en, st.lang === "ar" ? "rtl" : "ltr");
  return h;
}
function rail(m){
  return '<div class="colh">' + esc(T("nav_mods")) + "</div><ol>" + MODS.map(x => '<li><a href="#/m/' + x.id + '"' + (x === m ? ' aria-current="page"' : "") + '><span class="n num">' + x.id + "</span><span>" + esc(L(x.title)) + "</span></a></li>").join("") + '</ol><div class="links"><a class="btn gold" href="#/drill">' + esc(T("drill")) + "</a></div>";
}
function modFoot(m){
  const i = MODS.indexOf(m), p = MODS[i - 1], n = MODS[i + 1];
  return '<div class="pager">' + (p ? '<a class="btn ghost" href="#/m/' + p.id + '">' + esc(T("modprev")) + "</a>" : "<span></span>") + (n ? '<a class="btn" href="#/m/' + n.id + '">' + esc(T("modnext")) + ": " + esc(L(n.title)) + "</a>" : "") + "</div>";
}
const BODY = {learn, cases, quiz, cards: cardsTab, arts: artsTab};
const TN = {learn: "t_learn", cases: "t_cases", quiz: "t_quiz", cards: "t_cards", arts: "t_arts"};
function moduleView(id, tab){
  const m = MODS.find(x => String(x.id) === String(id)); if (!m) return hub();
  if (!st.seen[m.id]) { st.seen[m.id] = 1; save(); }
  const lv = level();
  let tabs, cols;
  if (lv <= 1) { tab = BODY[tab] ? tab : "learn"; tabs = ["learn", "cases", "quiz", "cards", "arts"]; cols = [tab]; }
  else if (lv === 2) { tab = BODY[tab] && tab !== "learn" ? tab : "cases"; tabs = ["cases", "quiz", "cards", "arts"]; cols = ["learn", tab]; }
  else { tab = ["quiz", "cards", "arts"].includes(tab) ? tab : "quiz"; tabs = ["quiz", "cards", "arts"]; cols = ["learn", "cases", tab]; }
  const head = '<div class="mhead"><div class="crumbs"><a href="#/">' + esc(T("nav_mods")) + "</a> · " + esc(T("m")) + " " + m.id + " " + esc(T("of")) + " " + MODS.length + "</div><h1>" + esc(L(m.title)) + '</h1><div class="meta"><span>' + esc(T(m.parts.length > 1 ? "parts" : "part")) + ' <span class="num">' + rngs(m.parts) + "</span></span><span>" + esc(T("arts")) + ' <span class="num">' + esc(m.range) + "</span></span><span>~" + m.time + " " + esc(T("min")) + '</span></div><nav class="tabs" aria-label="' + esc(L(m.title)) + '">' + tabs.map(t => '<a href="#/m/' + m.id + "/" + t + '"' + (t === tab ? ' aria-current="page"' : "") + ">" + esc(T(TN[t])) + "</a>").join("") + "</nav></div>";
  let h = '<div class="mv"><aside class="rail" aria-label="' + esc(T("nav_mods")) + '">' + (lv ? rail(m) : "") + "</aside>" + head;
  cols.forEach((c, k) => { h += '<section class="c' + (k + 1) + '">' + (cols.length > 1 ? '<div class="colh">' + esc(T(TN[c])) + "</div>" : "") + BODY[c](m) + (k === 0 ? modFoot(m) : "") + "</section>"; });
  const rn = st.reader[m.id] && m.arts.includes(st.reader[m.id]) ? st.reader[m.id] : m.arts[0];
  h += '<aside class="reader" id="reader" aria-label="' + esc(T("reader")) + '">' + (lv ? readerBody(rn, m) : "") + "</aside></div>";
  $main.innerHTML = h;
  if (cols.includes("quiz")) save();
}
function showReader(n){
  const box = document.getElementById("reader"); if (!box || !level() || !LAWN[n]) return false;
  const {seg} = parse(); const m = seg[0] === "m" ? MODS.find(x => String(x.id) === seg[1]) : null;
  if (m && m.arts.includes(n)) { st.reader[m.id] = n; save(); }
  box.innerHTML = readerBody(n, m && m.arts.includes(n) ? m : null);
  box.scrollTop = 0;
  document.querySelectorAll(".chip.on").forEach(c => c.classList.remove("on"));
  document.querySelectorAll('.chip[data-art="' + n + '"]').forEach(c => c.classList.add("on"));
  return true;
}

/* ---------- review & drill ---------- */
let session = null;
function buildSession(kind){
  let items = allDue().map(x => ({k: "c", m: x[0], i: x[1]}));
  if (kind === "drill") {
    for (const m of MODS) { for (let i = 0; i < m.cards.length && items.length < 10; i++) if (!cardState(cid(m, i))) items.push({k: "c", m, i}); if (items.length >= 10) break; }
    items = items.slice(0, 10);
    const pool = []; MODS.filter(m => st.seen[m.id]).forEach(m => m.quiz.forEach((q, qi) => pool.push({k: "q", m, i: qi})));
    const src = pool.length ? pool : MODS[0].quiz.map((q, qi) => ({k: "q", m: MODS[0], i: qi}));
    for (let n = 0; n < 3 && src.length; n++) items.push(src.splice(Math.floor(Math.random() * src.length), 1)[0]);
  }
  session = {kind, items, pos: 0, picked: null};
}
function sessionView(kind){
  if (!session || session.kind !== kind) buildSession(kind);
  const s = session;
  let h = '<div class="narrow"><h1>' + esc(T(kind === "drill" ? "drill_h" : "rev_h")) + '</h1><p class="lede">' + esc(T(kind === "drill" ? "drill_lede" : "rev_lede")) + "</p>";
  if (s.pos >= s.items.length) { $main.innerHTML = h + '<p class="card">' + esc(T(s.items.length ? (kind === "drill" ? "drill_done" : "deckdone") : "rev_none")) + '</p><div class="btns"><a class="btn" href="#/">' + esc(T("nav_mods")) + "</a></div></div>"; session = null; return; }
  const it = s.items[s.pos];
  h += '<p class="meta"><span class="num">' + (s.items.length - s.pos) + "</span> " + esc(T("rev_left")) + "</p>";
  if (it.k === "c") {
    h += '<div class="deck">' + flashFace(it.m, it.i, " · " + esc(L(it.m.title))) + '<div class="rate">' + [["again", 0], ["good", 1], ["easy", 2]].map(r => '<button class="' + r[0] + '" type="button" data-act="srate" data-r="' + r[1] + '">' + esc(T(r[0])) + "</button>").join("") + "</div></div>";
  } else {
    const x = it.m.quiz[it.i], a = s.picked, LT = st.lang === "ar" ? ["أ", "ب", "ج", "د"] : ["A", "B", "C", "D"];
    h += '<div class="q"><div class="qn">' + esc(T("qq")) + " · " + esc(T("m")) + " " + it.m.id + '</div><div class="qt">' + para(L(x.q)) + '</div><div class="opts">' + x.o.map((o, oi) => '<button type="button" class="opt' + (a != null ? (oi === x.a ? " ok" : oi === a ? " bad" : "") : "") + '" data-act="spick" data-o="' + oi + '"' + (a != null ? " disabled" : "") + '><span class="ltr">' + LT[oi] + ".</span><span>" + esc(L(o)) + "</span></button>").join("") + "</div>" + (a != null ? '<div class="fb ' + (a === x.a ? "ok" : "bad") + '"><b>' + esc(T(a === x.a ? "correct" : "wrong")) + "</b>" + para(L(x.e)) + chips(x.r) + '</div><div class="btns"><button class="btn" type="button" data-act="snext">' + esc(T("cont")) + "</button></div>" : "") + "</div>";
  }
  $main.innerHTML = h + "</div>";
}

/* ---------- law & glossary ---------- */
function lawList(q, cur){
  q = (q || "").trim().toLowerCase();
  const modOf = {}; MODS.forEach(m => m.arts.forEach(n => (modOf[n] = modOf[n] || []).push(m.id)));
  let part = 0, out = "";
  LAW.forEach(a => {
    const hay = (a.n + " " + a.title_en + " " + a.title_ar + " " + (q.length > 2 ? a.text_en + " " + a.text_ar : "")).toLowerCase();
    if (q && hay.indexOf(q) < 0) return;
    if (a.part !== part) { part = a.part; out += (out ? "</ul>" : "") + '<h2 style="margin-top:16px;font-size:17px">' + esc(T("part")) + " " + a.part + ": " + esc(L([a.part_en, a.part_ar])) + '</h2><ul class="law-list">'; }
    out += '<li><a href="#/law/' + a.n + '"' + (a.n === cur ? ' aria-current="page"' : "") + '><span class="n num">' + a.n + "</span><span>" + esc(L([a.title_en, a.title_ar])) + '</span><span class="muted small">' + (modOf[a.n] ? esc(T("m")) + " " + modOf[a.n].join(", ") : "") + "</span></a></li>";
  });
  return out + (out ? "</ul>" : "");
}
function lawPage(n, q){
  const lv = level();
  const a = LAWN[n] || (lv ? LAW[0] : null);
  const listHead = "<h1>" + esc(T("law_h")) + '</h1><p class="lede">' + esc(T("law_lede")) + '</p><input type="search" id="lawq" placeholder="' + esc(T("search")) + '" value="' + esc(q) + '" aria-label="' + esc(T("search")) + '">';
  let art = "";
  if (a) {
    const mods = MODS.filter(m => m.arts.includes(a.n));
    const both = st.both != null ? st.both : lv >= 2;
    art = (lv ? "" : '<div class="crumbs"><a href="#/law">' + esc(T("back")) + "</a></div>") + "<h1>" + esc(T("art")) + ' <span class="num">' + a.n + "</span>: " + esc(L([a.title_en, a.title_ar])) + '</h1><div class="meta"><span>' + esc(T("part")) + " " + a.part + ": " + esc(L([a.part_en, a.part_ar])) + "</span><span>" + esc(T("page")) + ' <span class="num">' + a.page + "</span></span>" + (mods.length ? "<span>" + esc(T("covered")) + ": " + mods.map(m => '<a href="#/m/' + m.id + '">' + esc(T("m")) + " " + m.id + "</a>").join(", ") + "</span>" : "") + '</div><label class="toggle" style="margin-top:8px"><input type="checkbox" id="both"' + (both ? " checked" : "") + "> " + esc(T("both")) + "</label>" +
      (both ? '<div class="cols two" style="margin-top:12px"><section><h3>English</h3>' + lawText(a.text_en, "ltr") + '</section><section><h3 dir="rtl">العربية</h3>' + lawText(a.text_ar, "rtl") + "</section></div>" : '<div class="cols" style="margin-top:12px">' + lawText(st.lang === "ar" ? a.text_ar : a.text_en, st.lang === "ar" ? "rtl" : "ltr") + "</div>") +
      '<div class="pager">' + (LAWN[a.n - 1] ? '<a class="btn ghost" href="#/law/' + (a.n - 1) + '">' + esc(T("prev")) + "</a>" : "<span></span>") + (LAWN[a.n + 1] ? '<a class="btn ghost" href="#/law/' + (a.n + 1) + '">' + esc(T("nextart")) + "</a>" : "") + "</div>";
  }
  if (lv) $main.innerHTML = '<div class="lawv"><div class="lawnav" id="lawnav">' + listHead + '<div id="lawres">' + lawList(q, a && a.n) + "</div></div><article>" + art + "</article></div>";
  else $main.innerHTML = a ? art : listHead + '<div id="lawres">' + lawList(q, null) + "</div>";
  const inp = document.getElementById("lawq");
  if (inp) inp.addEventListener("input", () => { document.getElementById("lawres").innerHTML = lawList(inp.value, a && lv ? a.n : null); });
  const cur = document.querySelector('#lawnav a[aria-current="page"]'); if (cur && !q) cur.scrollIntoView({block: "center"});
}
function glossary(){
  const draw = q => { q = (q || "").trim().toLowerCase();
    return C.glossary.filter(g => !q || (g.en + " " + g.ar).toLowerCase().indexOf(q) >= 0).sort((x, y) => st.lang === "ar" ? x.ar.localeCompare(y.ar, "ar") : x.en.localeCompare(y.en, "en"))
      .map(g => '<div class="gl"><span dir="ltr" lang="en">' + esc(g.en) + '</span><span dir="rtl" lang="ar">' + esc(g.ar) + "</span>" + (g.r ? '<span style="grid-column:1/-1">' + chips([g.r]) + "</span>" : "") + "</div>").join(""); };
  $main.innerHTML = "<h1>" + esc(T("gl_h")) + '</h1><p class="lede">' + esc(T("gl_lede")) + '</p><input type="search" id="glq" placeholder="' + esc(T("gl_search")) + '" aria-label="' + esc(T("gl_search")) + '" style="max-width:640px"><div class="glwrap" id="glres">' + draw("") + "</div>";
  const inp = document.getElementById("glq"); inp.addEventListener("input", () => { document.getElementById("glres").innerHTML = draw(inp.value); });
}
function about(){
  let h = '<div class="narrow"><h1>' + esc(T("about_h")) + "</h1>" + C.about.map(s => "<h2>" + esc(L(s.h)) + "</h2>" + s.p.map(p => "<p>" + para(L(p)) + "</p>").join("")).join("");
  h += "<h2>" + esc(T("progress")) + '</h2><div class="btns"><button class="btn" type="button" data-act="export">' + esc(T("export")) + '</button><label class="btn ghost">' + esc(T("import")) + '<input type="file" id="imp" accept="application/json" class="hide"></label><button class="btn ghost" type="button" data-act="reset">' + esc(T("reset")) + "</button>" + (location.protocol.indexOf("http") === 0 ? '<a class="btn gold" href="index.html" download="ksa-dmt-study.html">' + esc(T("offline")) + "</a>" : "") + "</div></div>";
  $main.innerHTML = h;
  document.getElementById("imp").addEventListener("change", e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const o = JSON.parse(rd.result); if (o && typeof o === "object" && o.cards) { st = Object.assign(load(), o); save(); render(true); } } catch(err) {} }; rd.readAsText(f); });
}

/* ---------- router ---------- */
function parse(){ const h = decodeURIComponent((location.hash || "#/").slice(2)); const parts = h.split("?"); return {seg: parts[0].split("/").filter(Boolean), q: new URLSearchParams(parts[1] || "").get("q") || ""}; }
function render(keepScroll){
  const {seg, q} = parse(); shell(seg.length ? seg : "");
  const y = window.scrollY;
  if (!seg.length) hub();
  else if (seg[0] === "m") moduleView(seg[1], seg[2]);
  else if (seg[0] === "review") sessionView("review");
  else if (seg[0] === "drill") sessionView("drill");
  else if (seg[0] === "law") lawPage(Number(seg[1]) || 0, q);
  else if (seg[0] === "glossary") glossary();
  else if (seg[0] === "about") about();
  else hub();
  if (keepScroll) window.scrollTo(0, y); else { window.scrollTo(0, 0); $main.focus({preventScroll: true}); }
}
window.addEventListener("hashchange", () => render(false));
let lastLv = level(), rt = null;
window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { const lv = level(); if (lv !== lastLv) { lastLv = lv; render(true); } }, 150); });
document.addEventListener("change", e => {
  if (e.target.id === "both") {
    st.both = e.target.checked; save();
    const r = document.getElementById("reader");
    if (r && r.contains(e.target)) { const h3 = r.querySelector("h3[data-n]"); showReader(Number(h3.dataset.n)); } else render(true);
  }
  if (e.target.id === "rsel") showReader(Number(e.target.value));
});
document.addEventListener("click", e => {
  const link = e.target.closest("a.chip, a.artlink");
  if (link && level() && document.getElementById("reader")) { e.preventDefault(); showReader(Number(link.dataset.art)); return; }
  const b = e.target.closest("[data-act], .opt[data-q]"); if (!b) return;
  const act = b.dataset.act;
  if (b.matches(".opt[data-q]")) { const m = MODS.find(x => String(x.id) === b.dataset.m); st.quiz[m.id] = st.quiz[m.id] || {ans: {}}; st.quiz[m.id].ans[Number(b.dataset.q)] = Number(b.dataset.o); mark(); save(); render(true); return; }
  if (act === "next" || act === "all") return stepCase(b.dataset.case, act === "all");
  if (act === "flip") return b.classList.toggle("flipped");
  if (act === "rate") { rateCard(b.dataset.id, Number(b.dataset.r)); if (Number(b.dataset.r) === 0) deckPos[b.dataset.m] = (deckPos[b.dataset.m] || 0) + 1; return render(true); }
  if (act === "srate") { const it = session.items[session.pos]; const r = Number(b.dataset.r); rateCard(cid(it.m, it.i), r); if (r === 0 && !it.again) session.items.push(Object.assign({}, it, {again: 1})); session.pos++; return sessionView(session.kind); }
  if (act === "spick") { session.picked = Number(b.dataset.o); mark(); save(); return sessionView(session.kind); }
  if (act === "snext") { session.picked = null; session.pos++; return sessionView(session.kind); }
  if (act === "qreset") { st.quiz[b.dataset.m] = {ans: {}, best: (st.quiz[b.dataset.m] || {}).best}; save(); return render(true); }
  if (act === "qwrong") { const m = MODS.find(x => String(x.id) === b.dataset.m); const q = st.quiz[m.id]; Object.keys(q.ans).forEach(k => { if (q.ans[k] !== m.quiz[k].a) delete q.ans[k]; }); save(); return render(true); }
  if (act === "export") { const blob = new Blob([JSON.stringify(st, null, 1)], {type: "application/json"}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "ksa-dmt-study-progress.json"; document.body.appendChild(a); a.click(); a.remove(); return; }
  if (act === "reset") { if (confirm(T("resetq"))) { const lang = st.lang; st = load(); st.quiz = {}; st.cards = {}; st.days = []; st.seen = {}; st.reader = {}; st.lang = lang; save(); render(false); } return; }
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea, select")) return;
  const f = document.querySelector(".flash"); if (!f) return;
  if (e.key === " " && (document.activeElement === document.body || document.activeElement === $main)) { e.preventDefault(); f.classList.toggle("flipped"); }
  const r = {"1": 0, "2": 1, "3": 2}[e.key]; if (r != null) { const btn = document.querySelector('.rate [data-r="' + r + '"]'); if (btn) btn.click(); }
});
render(false);
})();
</script>
</body>
</html>
